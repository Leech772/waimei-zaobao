、以個人關係控風險」。第一任期時，北京透過貿易談判與大規模採購美國農產品，換取特朗普在台海議題上的相對克制。\n\n專家認為，第二任期北京更進一步，把對台軍售直接納入美中高層談判，並以貿易休戰、稀土與供應鏈議題作為槓桿，試圖讓特朗普把台灣問題「交易化」。\n\n習近平多次強調台灣是「最重要議題」，並在此前的峰會上要求美方明確反對台灣獨立，同時暗示穩定關係取決於限制對台支持。北京判斷特朗普重視交易成果多於長期承諾，因此採取「耐心施壓、避免正面衝突」的策略，等待他任期內的窗口，同時為「後特朗普」時期預做準備。\n\n至於中期選舉本身，駱明輝認為，北京自然會關注結果，但不會過度在意誰勝誰負：無論牌局如何發展，中南海都會積極規劃，並把戰略目光放在特朗普任期結束之後。\n\n特朗普任內的對台軍售呈現「先放後卡」的節奏。第一任期他多次批准軍售，規模與頻率高於前任，涵蓋戰機、坦克與飛彈系統，並強化高層軍事交流；2025年12月，他更批准約111億美元的大規模軍售案，創下紀錄。\n\n轉折出現在2026年初。涉及愛國者飛彈、雷達與指揮系統、用於台灣「T-Dome」防空體系的140億美元新案被長期擱置，特朗普在與習近平會談後持續延遲。\n\n美國前外交官、捍衛民主基金會（Foundation for Defense of Democracies, FDD）中國項目主任辛格頓（Craig Singleton）本週在\n\n警告，延遲對台軍售正在製造「危險的誤解」，「今天為避免摩擦而擱置，可能為明天更危險的對抗創造條件」。他認為，數十年來美中靠精心拿捏的語言和戰略模糊處理台灣問題，但如今習近平可能將延遲軍售解讀為華盛頓默認「穩定美中關係取決於限制對台支持」的前提。軍售拖得越久，北京越可能把未來任何推進視為背叛，反而引發特朗普試圖避免的不穩定。\n\n除了軍售，美台在情報分享、聯合演訓、不對稱戰力與無人機上的合作仍在持續，但節奏受白宮與北京談判牽制。\n\n第一個觀察點，鄧銘杰向BBC中文透露，有美國官員早前表示，此案被「拆包」成較小規模方案的機率已大幅上升；布魯金斯學會的何瑞恩（Ryan Hass）也預期，APEC與G20之後會出現較小規模的軍售案。\n\n年底的《國防授權法》是第二個觀察點。參議院版本加入了對台戰爭儲備庫存，並將台灣納入涵蓋菲律賓的更廣泛「第一島鏈」倡議。鄧銘杰認為，這些條款能否在最終版本中保留，值得關注。\n\n第三則是政治修辭。特朗普今年5月曾說他「不希望有人走向獨立」，若類似表述出現在深圳或邁阿密峰會的書面聲明中，將是真正的轉變。\n\n此次選舉中，多位「台灣連線」的共和黨議員遭淘汰。這些友台議員長期推動對台軍售、加強軍事合作並監督行政部門，每年都有成員拜訪台灣；取而代之的，是許多首次進入眾議院的年輕民主黨人，他們對台灣乃至中國事務是否熟悉，都是問號。\n\n台美關係研究社群「美國台灣觀測站」分析指出，勝選的新生代議員多數對國際議題鮮少著墨，或強調外交優先、減少軍事干預，民主黨內年輕「進步派」是否會走更多元的外交路線，值得觀察。\n\n藍若思則提醒另一層矛盾：特朗普呼籲增加支出以重建美國海軍，應對中國海軍的擴張；但民主黨更關注「奶油」而非「槍砲」，民主黨主導的國會將優先擴大醫療補助與氣候政策等福利支出，進而壓縮國防預算，使軍事科技投資更難推動。\n\n「美國台灣觀測站」也分析，從歷史經驗看，歷屆總統任期最後幾年常把重心轉向海外事務，白宮自今年4月起已開始盤點移民、關稅、住房等不需國會的行動，特朗普更自稱「否決先生」（Mr. Veto）。外交仍主要由行政權主導，因此即便特朗普「跛腳」，對台美關係影響有限。\n\n台灣國防安全研究院助理研究員鍾志東早前在台北一場會議上提出類似判斷：當前的中美關係可用「短多長空」理解。他強調，台美關係必須放在中美關係的整體結構中看待，1979年美國即便需要聯合北京抗衡蘇聯，也未接受停止對台軍售的要求；在中美戰略競爭持續升溫的今天，美國在此議題上讓步的空間反而更低。即使短期內不會宣布大手筆軍售，也不代表美國正在台灣議題上向中國妥協。\n\n中期選舉改變的是華盛頓由誰來提問，但關於台灣的最終答案，仍掌握在特朗普手中。鄧銘杰向BBC中文強調，台灣最大的風險在於優先順序的落差：北京幾乎把台灣置於一切之上，而特朗普同時在處理貿易、稀土與其他議題。\n\n接下來，台北必須同時與新國會和白宮打交道。在島內「疑美論」不斷發酵的背景下，不同政黨對美國的期待本就分歧，華盛頓的權力重組，只會讓台北的說服工作更加複雜。", "body": "美國中期選舉結果出爐，民主黨在參眾兩院同時翻盤，共和黨總統特朗普（Donald Trump，又譯川普）的第二任期後半段將在「跛腳」狀態下展開。這場選舉不只改變華盛頓的權力版圖，也可能牽動美中關係與台灣議題的走向。\n\n時機尤其敏感。11月18至19日，亞太經合組織（APEC）領導人峰會將在深圳舉行；12月中，特朗普與習近平還可能在邁阿密G20峰會再度會面。價值140億美元的對台軍售案正卡在特朗普手中，他今年5月曾公開稱這筆軍售是「很好的談判籌碼」。民主黨掌控國會後，出口管制、晶片限制與軍售節奏會否出現新的拉鋸，成為觀察焦點。\n\n多位專家向BBC中文分析，美國兩黨在對華問題上的共識深厚，總統仍是政策主導者，大方向不會因國會易主而改變；真正的變化在於監督力度，民主黨將透過聽證會、傳票、《國防授權法》與撥款法案，嚴格審視特朗普與北京達成的貿易休戰。\n\n與此同時，多位長期支持台灣的共和黨「台灣連線」議員落馬，也意味著台北必須重新經營與新生代民主黨議員的關係。\n\n美國智庫太平洋論壇（Pacific Forum）兼任研究員藍若思（Elizabeth Larus）向BBC中文表示，無論國會由哪個黨派掌握多數，美國對台灣的支持及對華政策都不會改變，兩黨都會試圖推動特朗普批准桌上那筆140億美元的對台軍售案。\n\n「自1979年以來，每一任美國總統都維持了《台灣關係法》、『六項保證』以及美國的『一個中國』政策，這些都不會因為民主黨掌控國會而改變。」她說。\n\n美國智庫德國馬歇爾基金會（German Marshall Fund, GMF）亞洲計畫主任葛來儀（Bonnie Glaser）預測，民主黨將掌控撥款程序與參議院議程，很可能在《國防授權法》（NDAA）與撥款法案中加入多項要求：加速交付已核准的對台武器、新的對外軍售（FMS）案件通報、對台使用外國軍事融資（FMF），以及台灣安全合作倡議（Taiwan Security Cooperation Initiative）資金。《六項保證法案》（Six Assurances Act）也可能獲得更多推進動能。\n\n葛來儀還指出，民主黨大勝後，美國可能加強對中國取得先進晶片的限制，《安全晶片法案》（Safe Chips Act）有機會通過。但特朗普擁有否決權，民主黨票數不足以推翻，除非部分共和黨議員倒戈支持。\n\n新加坡南洋理工大學公共政策與全球事務副教授駱明輝（Dylan Loh）對BBC中文表示：「美國對中國存在廣泛共識，整體關係的塑造仍主要由總統主導。」\n\n新加坡獨立分析師鄧銘杰也不認為民主黨大勝會帶來更溫和的對華政策。兩大黨在出口管制、晶片限制與供應鏈措施上立場一致，實際變化在於監督力度：民主黨將透過聽證會與傳票，嚴格審視貿易休戰和「建設性戰略穩定」框架。\n\n此文包含Google YouTube提供的内容。由於這些内容會使用曲奇或小甜餅等科技，我們在加載任何内容前會尋求您的認可。 您可能在給予許可前希望閲讀Google YouTube曲奇政策和隱私政策。希望閲讀上述内容，請點擊“接受並繼續”。\n\n中國近年對特朗普的戰略，核心是「以經貿換穩定、以個人關係控風險」。第一任期時，北京透過貿易談判與大規模採購美國農產品，換取特朗普在台海議題上的相對克制。\n\n專家認為，第二任期北京更進一步，把對台軍售直接納入美中高層談判，並以貿易休戰、稀土與供應鏈議題作為槓桿，試圖讓特朗普把台灣問題「交易化」。\n\n習近平多次強調台灣是「最重要議題」，並在此前的峰會上要求美方明確反對台灣獨立，同時暗示穩定關係取決於限制對台支持。北京判斷特朗普重視交易成果多於長期承諾，因此採取「耐心施壓、避免正面衝突」的策略，等待他任期內的窗口，同時為「後特朗普」時期預做準備。\n\n至於中期選舉本身，駱明輝認為，北京自然會關注結果，但不會過度在意誰勝誰負：無論牌局如何發展，中南海都會積極規劃，並把戰略目光放在特朗普任期結束之後。\n\n特朗普任內的對台軍售呈現「先放後卡」的節奏。第一任期他多次批准軍售，規模與頻率高於前任，涵蓋戰機、坦克與飛彈系統，並強化高層軍事交流；2025年12月，他更批准約111億美元的大規模軍售案，創下紀錄。\n\n轉折出現在2026年初。涉及愛國者飛彈、雷達與指揮系統、用於台灣「T-Dome」防空體系的140億美元新案被長期擱置，特朗普在與習近平會談後持續延遲。\n\n美國前外交官、捍衛民主基金會（Foundation for Defense of Democracies, FDD）中國項目主任辛格頓（Craig Singleton）本週在\n\n警告，延遲對台軍售正在製造「危險的誤解」，「今天為避免摩擦而擱置，可能為明天更危險的對抗創造條件」。他認為，數十年來美中靠精心拿捏的語言和戰略模糊處理台灣問題，但如今習近平可能將延遲軍售解讀為華盛頓默認「穩定美中關係取決於限制對台支持」的前提。軍售拖得越久，北京越可能把未來任何推進視為背叛，反而引發特朗普試圖避免的不穩定。\n\n除了軍售，美台在情報分享、聯合演訓、不對稱戰力與無人機上的合作仍在持續，但節奏受白宮與北京談判牽制。\n\n第一個觀察點，鄧銘杰向BBC中文透露，有美國官員早前表示，此案被「拆包」成較小規模方案的機率已大幅上升；布魯金斯學會的何瑞恩（Ryan Hass）也預期，APEC與G20之後會出現較小規模的軍售案。\n\n年底的《國防授權法》是第二個觀察點。參議院版本加入了對台戰爭儲備庫存，並將台灣納入涵蓋菲律賓的更廣泛「第一島鏈」倡議。鄧銘杰認為，這些條款能否在最終版本中保留，值得關注。\n\n第三則是政治修辭。特朗普今年5月曾說他「不希望有人走向獨立」，若類似表述出現在深圳或邁阿密峰會的書面聲明中，將是真正的轉變。\n\n此次選舉中，多位「台灣連線」的共和黨議員遭淘汰。這些友台議員長期推動對台軍售、加強軍事合作並監督行政部門，每年都有成員拜訪台灣；取而代之的，是許多首次進入眾議院的年輕民主黨人，他們對台灣乃至中國事務是否熟悉，都是問號。\n\n台美關係研究社群「美國台灣觀測站」分析指出，勝選的新生代議員多數對國際議題鮮少著墨，或強調外交優先、減少軍事干預，民主黨內年輕「進步派」是否會走更多元的外交路線，值得觀察。\n\n藍若思則提醒另一層矛盾：特朗普呼籲增加支出以重建美國海軍，應對中國海軍的擴張；但民主黨更關注「奶油」而非「槍砲」，民主黨主導的國會將優先擴大醫療補助與氣候政策等福利支出，進而壓縮國防預算，使軍事科技投資更難推動。\n\n「美國台灣觀測站」也分析，從歷史經驗看，歷屆總統任期最後幾年常把重心轉向海外事務，白宮自今年4月起已開始盤點移民、關稅、住房等不需國會的行動，特朗普更自稱「否決先生」（Mr. Veto）。外交仍主要由行政權主導，因此即便特朗普「跛腳」，對台美關係影響有限。\n\n台灣國防安全研究院助理研究員鍾志東早前在台北一場會議上提出類似判斷：當前的中美關係可用「短多長空」理解。他強調，台美關係必須放在中美關係的整體結構中看待，1979年美國即便需要聯合北京抗衡蘇聯，也未接受停止對台軍售的要求；在中美戰略競爭持續升溫的今天，美國在此議題上讓步的空間反而更低。即使短期內不會宣布大手筆軍售，也不代表美國正在台灣議題上向中國妥協。\n\n中期選舉改變的是華盛頓由誰來提問，但關於台灣的最終答案，仍掌握在特朗普手中。鄧銘杰向BBC中文強調，台灣最大的風險在於優先順序的落差：北京幾乎把台灣置於一切之上，而特朗普同時在處理貿易、稀土與其他議題。\n\n接下來，台北必須同時與新國會和白宮打交道。在島內「疑美論」不斷發酵的背景下，不同政黨對美國的期待本就分歧，華盛頓的權力重組，只會讓台北的說服工作更加複雜。", "link": "https://www.bbc.com/zhongwen/articles/cqr7ydkrnpxno/trad?at_medium=RSS&at_campaign=rss", "time": "11月06日 18:21", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "澳門國安首案宣判：區錦新囚12年半，妻子斥「莫須有迫害」", "title_zh": "澳門國安首案宣判：區錦新囚12年半，妻子斥「莫須有迫害」", "summary_orig": "這是澳門首宗國安案，案件過程並不公開，區錦新由「指派律師」辯護，審理法官及律師身份不明。從預審、開審到宣判，外界只能從政府新聞稿得知消息。", "summary_zh": "這是澳門首宗國安案，案件過程並不公開，區錦新由「指派律師」辯護，審理法官及律師身份不明。從預審、開審到宣判，外界只能從政府新聞稿得知消息。", "body_orig": "", "body_zh": "星期五（11月6日），澳門完成史上首宗國安審判。民主派領袖、前立法會議員區錦新被控「顛覆國家政權」等罪名，於初級法院被判囚12年6個月。\n\n現年69歲的他預料須服刑到2039年，出獄時已年屆82歲。根據澳門《刑法典》規定， 服刑至三分之二可申請假釋。\n\n判決後，區錦新妻子鄭妙珊表示裁決不可接受，她發公開信指區案是政治審判，「是人格羞辱的莫須有迫害」。家屬曾表示，接近一年都無法探望區錦新。\n\n這是澳門首宗國安案，案件過程並不公開，區錦新由「指派律師」辯護，審理法官及律師身份不明。從預審、開審到宣判，外界只能從政府新聞稿得知消息。\n\n澳門政府表示尊重並支持法院裁決，指維護國安、捍衛法治的立場堅定不移。中國外交部發言人表示，中央政府堅定支持澳門依法懲治危害國安的行為。\n\n區錦新的海外法律代表批評這是「一場虛假的審判」，強調區是葡萄牙公民，葡萄牙政府和歐盟應努力讓他離開澳門。\n\n根據法院裁決，在7月2日的預審中，區錦新原被起訴七宗罪：三項「顛覆國家政權罪」、三項「與境外組織聯繫危害國家安全」罪，以及《刑法典》下一項「違反保密」罪。\n\n法院在新聞稿指出，由於區錦新「沒有自行聘請律師」，由法院「指派律師」辯護。法院稱，「律師與緊密溝通、聯繫」。\n\n就行為一，法庭指出，區錦新各干犯「顛覆國家政權罪」及「與境外組織聯繫危害國家安全」罪，但因兩罪存在表面競合關係，以較重罪的「顛覆國家政權罪」作處罰。\n\n就行為二，區錦新被起訴兩項「顛覆國家政權罪」及兩項「與境外組織聯繫危害國家安全」罪。法庭指出，因嫌犯行為是否達至「推翻、破壞程度」的要求存在疑問，「顛覆國家政權罪」罪名不成立。但就「與境外組織聯繫危害國家安全」罪則完全符合犯罪構成要件，兩項罪名均成立。\n\n另外就《刑法典》下「違反保密罪」一罪，法庭指於2021年身為時任立法會議員期間，區錦新把立法會有關賭牌續期閉門會議的秘密內容向境外組織洩漏，認定該罪罪成。\n\n法院稱在庭審中，區錦新對大部分基礎事實無異議，承認勾結和串通多個境外組織的事實行為構成犯罪，並「認同辯護律師為其辯護的意見」。\n\n法院作出判案理由，指出儘管區為初犯，且承認相當部分的犯罪事實，「惟其故意程度極高，有關犯罪的不法性程度及可能造成的後果均十分嚴重」。\n\n在判決後，區錦新妻子鄭妙珊發公開信。她表示從閉門審訊到公開宣判，「是政治審判」，「是人格羞辱的莫須有迫害」。\n\n她表示作為家屬，只望往後能夠得到當局允許，能「不附加條件」地跟獲得丈夫書信和定期探訪的權利，「至於其他，相信一切主觀願望只會換來更大的失望，是故不想多想亦無謂多講」。\n\n區錦新女兒區翰怡則向BBC中文表示，對判決「深感悲痛和憤慨」。她形容其父親是一位愛好和平的人、慈愛的父親。\n\n「他畢生致力於服務澳門人民。幾十年來，他一直為民主挺身而出，為社區爭取權益，幫助那些需要幫助的人。想到他要因為一些不該被視為犯罪的行為而身陷囹圄12年半，我簡直無法忍受。」\n\n區翰怡表示，希望澳門人記住父親的正直、勇氣、慈悲和為澳門人所作出貢獻。她呼籲葡萄牙政府和歐盟採取行動，盡一切可能確保他返回葡萄牙。\n\n今年7月，區錦新羈押滿一年前夕，其女兒區翰怡曾向葡新社表示，過去一年家人無法探望，只能透過當局安排的社工了解情況。「（社工）只說他吃得好，一切都好。」\n\n區錦新獲法院分發「指派律師」後，區翰怡說家人亦不知道該律師身份：「無論我們發送多少封電子郵件、聯繫哪個部門，他們都置之不理。」\n\n法院則在新聞稿中，稱指定代表律師與區有「緊密溝通、聯繫」，法庭亦依法批准家屬定期探視嫌犯的申請。\n\n區錦新的海外法律代表邁克爾·波拉克（Michael Polak）在判刑後發聲明，批評這是「一場虛假的審判」，形容區被定罪心不僅令澳門蒙羞，也將影響國際社會從法治角度對澳門的看法。\n\n他指出，區錦新不應該僅因為他的「非暴力信仰」被拘捕。波拉克又強調區是葡萄牙公民，葡萄牙政府和歐盟應當努力讓他離開澳門，「而不是讓他因莫須有的罪名在獄中度過十餘年 。」\n\n在法院外，道路被封，現場有大量保安和警察看守。法院對出空地設有傳媒區，大批無法進入法院的傳媒只能在此等候，現場約有20人。\n\n是次宣判消息公佈來得突然。11月5日初級法院於下午3點發新聞稿，表示區案將於明早10點公開宣判。欲旁聽的公眾及傳媒須分別在4點起到法院及新聞局的線上系統登記。\n\n但有市民發文表示，4點02分左右到達法院，已有職員表示「已經取完籌，額滿了」。當局沒透露旁聽席數量為何。另據BBC中文了解，有本地媒體表示成功在新聞局系統登記後，獲告知「沒有足夠的位置」無法旁聽。\n\n今早新聞局向現場媒體確認，只得四間傳媒出席旁聽，包括澳門廣播電視中文及葡文台、澳門日報及大眾報。BBC中文聯繫新聞局確認消息，截至發稿前未有回覆。\n\n法院判決後指，「數十名市民、傳媒以及嫌犯家屬出席了今天的公開宣判」。惟在場記者所見，現場僅有零星做運動的市民及多名便衣警員。\n\n曾在澳門執業多年的葡裔律師何睿智（Jorge Menezes）向BBC中文指出，澳門當局透過刑期傳遞訊息：「澳門社會必須受到震懾、外界必須看到一個可以交代的結果，以及當局想像中的北京。」\n\n在他看來，審判同時反映當局的軟弱，「一個有自信的政府，根本會把這種虛構出來的威脅當作笑話。澳門如今卻是在用手榴彈打蚊子。」\n\n對於區錦新或在獄中渡過餘生，何睿智認為這是當局「刻意採取的手段」：「對待一個人的方式越不人道，對其他人的警告就越強烈」。\n\n多年研究澳門政治的學者余永逸博士則向BBC中文分析，區案是政府劃出「清楚紅線」的基准：「澳門居民可以做什麼、不可以做什麼，有什麼是不能接受」。\n\n至於判決對社會的影響，余永逸認為自2021年立法會候選人遭集體DQ事件後，市民已目睹澳門變成「自我審查」、「不能夠表達意見」的社會，今日判決未必再對社會帶來多大衝擊。\n\n何睿智持相同看法。他同意判決象徵的政治界線非常明確：不要與境外人士談論澳門政治，服從權威，不得批評北京。\n\n他強調，目前判決內容依然含糊，沒有點名任何「敵對外部組織」，亦無列出具體的「虛假信息」或出版物，而這是當局「刻意為之」——「模糊的界線會促使人們為了自保而選擇退縮，在此之後，威脅本身就會發揮作用，進而引發自我審查。」\n\n人權觀察亞洲區副主任王松蓮（Maya Wang）表示，國安定罪向澳門「所有以和平方式提出批評的人士發出了令人不寒而栗的信號」。\n\n她指出，區案司法程序存在「嚴重違反正當程序和公平審判權利的問題」，呼籲葡萄牙、歐盟及其他相關國家政府應強烈要求當局立即無條件釋放區錦新。\n\n中聯辦發言人對裁决表示堅決支持。其指澳門首宗國安案件的宣判有力表明，「國家安全底線不容觸碰，澳門的法治精神不容挑戰」。\n\n區錦新原是一名小學老師。在1989年六四事件發生後，與吳國昌等人籌組「澳門民主發展聯委會」，提出「回應中國民主運動、推動澳門民主發展」，成為澳門此後30年「六四燭光晚會」的組織者。\n\n他自1993年起擔任澳門市政議員，在1999年主權移交後與吳國昌相繼成為立法會議員；連同於2016年當選的蘇嘉豪，成為立法會內唯一三名民主派議員。\n\n2021年，擔任超過20年議員的區錦新宣布不再尋求連任。拍檔吳國昌與蘇嘉豪則於同年被撤銷參選資格。澳門特區終審法院駁回吳蘇二人上訴，理由是組織六四悼念屬「誹謗」中國政府、可視為不擁護澳門《基本法》。民聯會後因壓力於2023年解散。\n\n不過，區錦新在卸任議員後，仍常在Facebook和媒體採訪中評論時政。他最後一則Facebook帖文寫在被捕當日，評論澳門第四條與氹仔的跨海大橋。\n\n2025年7月30日，擁有葡國籍的區錦新被捕後，歐盟對外行動署譴責中方抓捕歐洲公民，形容事情的發展加劇了人們對澳門「政治多元化和言論自由持續受到侵蝕的擔憂」。\n\n中國外交部駐澳門公署其後批評歐盟「蓄意攻擊澳門法治、粗暴干涉澳門事務和中國內政」，「敦促歐盟立即停止對澳門事務說三道四、無端指責，立即停止干預澳門事務和中國內政」。\n\n2025年9月，葡萄牙總理蒙特內格羅（Luís Montenegro） 訪問澳門，當時蒙特內格羅向葡語記者表示，二人沒有談及區錦新案，又稱處理此案需要「必要的謹慎」及「某種程度低調」，但他保證沒有遺忘此事。", "body": "星期五（11月6日），澳門完成史上首宗國安審判。民主派領袖、前立法會議員區錦新被控「顛覆國家政權」等罪名，於初級法院被判囚12年6個月。\n\n現年69歲的他預料須服刑到2039年，出獄時已年屆82歲。根據澳門《刑法典》規定， 服刑至三分之二可申請假釋。\n\n判決後，區錦新妻子鄭妙珊表示裁決不可接受，她發公開信指區案是政治審判，「是人格羞辱的莫須有迫害」。家屬曾表示，接近一年都無法探望區錦新。\n\n這是澳門首宗國安案，案件過程並不公開，區錦新由「指派律師」辯護，審理法官及律師身份不明。從預審、開審到宣判，外界只能從政府新聞稿得知消息。\n\n澳門政府表示尊重並支持法院裁決，指維護國安、捍衛法治的立場堅定不移。中國外交部發言人表示，中央政府堅定支持澳門依法懲治危害國安的行為。\n\n區錦新的海外法律代表批評這是「一場虛假的審判」，強調區是葡萄牙公民，葡萄牙政府和歐盟應努力讓他離開澳門。\n\n根據法院裁決，在7月2日的預審中，區錦新原被起訴七宗罪：三項「顛覆國家政權罪」、三項「與境外組織聯繫危害國家安全」罪，以及《刑法典》下一項「違反保密」罪。\n\n法院在新聞稿指出，由於區錦新「沒有自行聘請律師」，由法院「指派律師」辯護。法院稱，「律師與緊密溝通、聯繫」。\n\n就行為一，法庭指出，區錦新各干犯「顛覆國家政權罪」及「與境外組織聯繫危害國家安全」罪，但因兩罪存在表面競合關係，以較重罪的「顛覆國家政權罪」作處罰。\n\n就行為二，區錦新被起訴兩項「顛覆國家政權罪」及兩項「與境外組織聯繫危害國家安全」罪。法庭指出，因嫌犯行為是否達至「推翻、破壞程度」的要求存在疑問，「顛覆國家政權罪」罪名不成立。但就「與境外組織聯繫危害國家安全」罪則完全符合犯罪構成要件，兩項罪名均成立。\n\n另外就《刑法典》下「違反保密罪」一罪，法庭指於2021年身為時任立法會議員期間，區錦新把立法會有關賭牌續期閉門會議的秘密內容向境外組織洩漏，認定該罪罪成。\n\n法院稱在庭審中，區錦新對大部分基礎事實無異議，承認勾結和串通多個境外組織的事實行為構成犯罪，並「認同辯護律師為其辯護的意見」。\n\n法院作出判案理由，指出儘管區為初犯，且承認相當部分的犯罪事實，「惟其故意程度極高，有關犯罪的不法性程度及可能造成的後果均十分嚴重」。\n\n在判決後，區錦新妻子鄭妙珊發公開信。她表示從閉門審訊到公開宣判，「是政治審判」，「是人格羞辱的莫須有迫害」。\n\n她表示作為家屬，只望往後能夠得到當局允許，能「不附加條件」地跟獲得丈夫書信和定期探訪的權利，「至於其他，相信一切主觀願望只會換來更大的失望，是故不想多想亦無謂多講」。\n\n區錦新女兒區翰怡則向BBC中文表示，對判決「深感悲痛和憤慨」。她形容其父親是一位愛好和平的人、慈愛的父親。\n\n「他畢生致力於服務澳門人民。幾十年來，他一直為民主挺身而出，為社區爭取權益，幫助那些需要幫助的人。想到他要因為一些不該被視為犯罪的行為而身陷囹圄12年半，我簡直無法忍受。」\n\n區翰怡表示，希望澳門人記住父親的正直、勇氣、慈悲和為澳門人所作出貢獻。她呼籲葡萄牙政府和歐盟採取行動，盡一切可能確保他返回葡萄牙。\n\n今年7月，區錦新羈押滿一年前夕，其女兒區翰怡曾向葡新社表示，過去一年家人無法探望，只能透過當局安排的社工了解情況。「（社工）只說他吃得好，一切都好。」\n\n區錦新獲法院分發「指派律師」後，區翰怡說家人亦不知道該律師身份：「無論我們發送多少封電子郵件、聯繫哪個部門，他們都置之不理。」\n\n法院則在新聞稿中，稱指定代表律師與區有「緊密溝通、聯繫」，法庭亦依法批准家屬定期探視嫌犯的申請。\n\n區錦新的海外法律代表邁克爾·波拉克（Michael Polak）在判刑後發聲明，批評這是「一場虛假的審判」，形容區被定罪心不僅令澳門蒙羞，也將影響國際社會從法治角度對澳門的看法。\n\n他指出，區錦新不應該僅因為他的「非暴力信仰」被拘捕。波拉克又強調區是葡萄牙公民，葡萄牙政府和歐盟應當努力讓他離開澳門，「而不是讓他因莫須有的罪名在獄中度過十餘年 。」\n\n在法院外，道路被封，現場有大量保安和警察看守。法院對出空地設有傳媒區，大批無法進入法院的傳媒只能在此等候，現場約有20人。\n\n是次宣判消息公佈來得突然。11月5日初級法院於下午3點發新聞稿，表示區案將於明早10點公開宣判。欲旁聽的公眾及傳媒須分別在4點起到法院及新聞局的線上系統登記。\n\n但有市民發文表示，4點02分左右到達法院，已有職員表示「已經取完籌，額滿了」。當局沒透露旁聽席數量為何。另據BBC中文了解，有本地媒體表示成功在新聞局系統登記後，獲告知「沒有足夠的位置」無法旁聽。\n\n今早新聞局向現場媒體確認，只得四間傳媒出席旁聽，包括澳門廣播電視中文及葡文台、澳門日報及大眾報。BBC中文聯繫新聞局確認消息，截至發稿前未有回覆。\n\n法院判決後指，「數十名市民、傳媒以及嫌犯家屬出席了今天的公開宣判」。惟在場記者所見，現場僅有零星做運動的市民及多名便衣警員。\n\n曾在澳門執業多年的葡裔律師何睿智（Jorge Menezes）向BBC中文指出，澳門當局透過刑期傳遞訊息：「澳門社會必須受到震懾、外界必須看到一個可以交代的結果，以及當局想像中的北京。」\n\n在他看來，審判同時反映當局的軟弱，「一個有自信的政府，根本會把這種虛構出來的威脅當作笑話。澳門如今卻是在用手榴彈打蚊子。」\n\n對於區錦新或在獄中渡過餘生，何睿智認為這是當局「刻意採取的手段」：「對待一個人的方式越不人道，對其他人的警告就越強烈」。\n\n多年研究澳門政治的學者余永逸博士則向BBC中文分析，區案是政府劃出「清楚紅線」的基准：「澳門居民可以做什麼、不可以做什麼，有什麼是不能接受」。\n\n至於判決對社會的影響，余永逸認為自2021年立法會候選人遭集體DQ事件後，市民已目睹澳門變成「自我審查」、「不能夠表達意見」的社會，今日判決未必再對社會帶來多大衝擊。\n\n何睿智持相同看法。他同意判決象徵的政治界線非常明確：不要與境外人士談論澳門政治，服從權威，不得批評北京。\n\n他強調，目前判決內容依然含糊，沒有點名任何「敵對外部組織」，亦無列出具體的「虛假信息」或出版物，而這是當局「刻意為之」——「模糊的界線會促使人們為了自保而選擇退縮，在此之後，威脅本身就會發揮作用，進而引發自我審查。」\n\n人權觀察亞洲區副主任王松蓮（Maya Wang）表示，國安定罪向澳門「所有以和平方式提出批評的人士發出了令人不寒而栗的信號」。\n\n她指出，區案司法程序存在「嚴重違反正當程序和公平審判權利的問題」，呼籲葡萄牙、歐盟及其他相關國家政府應強烈要求當局立即無條件釋放區錦新。\n\n中聯辦發言人對裁决表示堅決支持。其指澳門首宗國安案件的宣判有力表明，「國家安全底線不容觸碰，澳門的法治精神不容挑戰」。\n\n區錦新原是一名小學老師。在1989年六四事件發生後，與吳國昌等人籌組「澳門民主發展聯委會」，提出「回應中國民主運動、推動澳門民主發展」，成為澳門此後30年「六四燭光晚會」的組織者。\n\n他自1993年起擔任澳門市政議員，在1999年主權移交後與吳國昌相繼成為立法會議員；連同於2016年當選的蘇嘉豪，成為立法會內唯一三名民主派議員。\n\n2021年，擔任超過20年議員的區錦新宣布不再尋求連任。拍檔吳國昌與蘇嘉豪則於同年被撤銷參選資格。澳門特區終審法院駁回吳蘇二人上訴，理由是組織六四悼念屬「誹謗」中國政府、可視為不擁護澳門《基本法》。民聯會後因壓力於2023年解散。\n\n不過，區錦新在卸任議員後，仍常在Facebook和媒體採訪中評論時政。他最後一則Facebook帖文寫在被捕當日，評論澳門第四條與氹仔的跨海大橋。\n\n2025年7月30日，擁有葡國籍的區錦新被捕後，歐盟對外行動署譴責中方抓捕歐洲公民，形容事情的發展加劇了人們對澳門「政治多元化和言論自由持續受到侵蝕的擔憂」。\n\n中國外交部駐澳門公署其後批評歐盟「蓄意攻擊澳門法治、粗暴干涉澳門事務和中國內政」，「敦促歐盟立即停止對澳門事務說三道四、無端指責，立即停止干預澳門事務和中國內政」。\n\n2025年9月，葡萄牙總理蒙特內格羅（Luís Montenegro） 訪問澳門，當時蒙特內格羅向葡語記者表示，二人沒有談及區錦新案，又稱處理此案需要「必要的謹慎」及「某種程度低調」，但他保證沒有遺忘此事。", "link": "https://www.bbc.com/zhongwen/articles/cw62yyejjrlro/trad?at_medium=RSS&at_campaign=rss", "time": "11月06日 21:11", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "黃之鋒勾結罪國安案：重判10年，料出獄已屆40歲", "title_zh": "黃之鋒勾結罪國安案：重判10年，料出獄已屆40歲", "summary_orig": "香港民主派活動人士黃之鋒原有望於數月內獲釋，但最新的10年判刑使他要繼續服刑到2036年，出獄時或已年屆40歲。法律學者分析，案件反映《香港國安法》或可被「反覆動用」，令特定政治犯持續留在獄中。", "summary_zh": "香港民主派活動人士黃之鋒原有望於數月內獲釋，但最新的10年判刑使他要繼續服刑到2036年，出獄時或已年屆40歲。法律學者分析，案件反映《香港國安法》或可被「反覆動用」，令特定政治犯持續留在獄中。", "body_orig": "", "body_zh": "香港民主派活動人士黃之鋒被控告中國《香港國安法》下的「串謀勾結外國勢力危害國家安全」罪，星期四（11月5日）於香港高等法院被判囚10年。\n\n他正就「民主派初選47人案」服刑，原有望於2027年1月獲釋。新增的10年刑期，其中2個月2日與「47人案」同期執行；預料他須服刑到2036年，出獄時或已年屆40歲。\n\n這是繼壹傳媒創辦人黎智英後，第二宗在香港被起訴「勾結外國勢力」罪的案件，也是黃之鋒第二宗涉及《香港國安法》相關的案件。港府表示歡迎法庭的重判。\n\n國際特赦組織批評，當局在黃之鋒原定刑期獲釋前數月才新增定罪，「手法殘酷」。有法律學者分析，案件反映國安法控罪或可被「反覆動用」，令特定政治犯持續留在獄中。\n\n英國外交部回覆BBC中文查詢時稱，最新判決說明《香港國安法》被用於針對行使政治表達權利的人。\n\n此文包含Google YouTube提供的内容。由於這些内容會使用曲奇或小甜餅等科技，我們在加載任何内容前會尋求您的認可。 您可能在給予許可前希望閲讀Google YouTube曲奇政策和隱私政策。希望閲讀上述内容，請點擊“接受並繼續”。\n\n黃之鋒身穿深藍色長袖裇衫及卡其色長褲、戴黑框眼鏡，較以往瘦削，面有鬚根，出庭時向旁聽席點頭，沒有微笑，他不時細望旁聽席的人士，然後微微點頭打招呼。有旁聽人士輪流進場換人，與黃之鋒短暫打招呼後離去。\n\n正庭公眾席全滿，旁聽者包括：戴着黑色口罩的學民思潮前成員錢詩文、社運人士雷玉蓮、前社民連成員黃浩銘、前民陣召集人陳皓桓、「47人案」獲釋者岑子杰，以及多國領事人員。\n\n主審法官譚耀豪在判刑前，先交代判刑理由。在宣讀判刑理由時，黃之鋒戴着耳機不時手記筆記。最終判囚10年，黃之鋒聞訊後平靜低頭。\n\n有旁聽人士向黃之鋒揮手，並說「等你出來」，錢詩文與友人相擁哭泣；散庭後，有旁聽人士一向走上前欲與黃之鋒握手，被黃叫停。\n\n香港民主黨前創黨成員、社運人士曾健成（阿牛）在判決後對BBC中文說，在《國安法》下看不到輕判，黃之鋒如今要到40歲才得到自由，他感到相當難過、無奈，並反問「人生有多少個十年」。他隔空向黃之鋒喊話：「辛苦你了之鋒，頂住，希望你捱得過。」\n\n根據《香港國安法》，量刑分為兩級，「勾結」罪可囚3年以上至10年以下，「罪行重大」者可判囚10年以上至無期徒刑。\n\n法庭強調，國安法不具追溯力，被告被定罪基於法例實施後的行為；惟量刑時可將法例生效前的行為及活動作為其犯案背景的一部分來考慮，以評估罪行的嚴重性及程度。\n\n早前一辯方資深大律師陳政龍在書面陳詞中提出，本案不屬「罪行重大」。辯方指，黃之鋒並不迴避本案屬非常嚴重罪行的事實，但請法庭不要裁定本案為「罪行重大」。\n\n辯方律師提出，黃之鋒在國安法生效參與串謀的程度有限，角色屬次要；與黎智英案比較本案情節較輕，涉及的外國政府、人物及平台內容也有實質分別。\n\n另外，辯方也望法庭考慮黃之鋒在最早期已認罪、連同其他案件已羈押近6年；他的個人背景品格、檢控延近5年、整體刑期原則等。\n\n法官則認為黃之鋒與羅冠聰在本案與黎智英相似，均站在最前線，是主謀，情節嚴重。綜合本案所有情況，以13年監禁作為量刑起點，基於被告人的認罪答辯和求情，將量刑起點下調 3 年，判處監禁 10 年；即《國安法》第二十九條下屬「罪行重大」所須判處的最低刑期。\n\n黃之鋒正就「民主派初選47人案」服刑，原有望於2027年1月獲釋。新增的10年刑期，其中2個月2日與「47人案」同期執行。\n\n美國喬治城大學亞洲法律中心（Georgetown Center for Asian Law）高級研究員黎恩灝分析，從技術層面而言，若無新控罪，黃之鋒原本望於明年初獲釋，故新增控罪客觀上提供方式，「令黃之鋒在更長時間無法重返公眾視野」。\n\n他表示，案件程序令人憂慮，一方面反映香港政府急於把刑事檢控武器化，若政府認為有需要，國安法控罪便可以被「反覆動用」，令特定政治犯持續留在獄中。\n\n另一方面，控方就此案提出多項指控均涉及國安法生效前的行為，政府不惜犧牲正當程序原則，以追溯方式將政治犯的行為刑事化。\n\n國際特赦組織亞太區副總監白舒然（Sarah Brooks）表示，最新的國安定罪，在黃之鋒原定刑期獲釋前數月降臨，形容「手法殘酷，甚至可能是蓄意為之」，又指判刑提醒香港的《國安法》已淪為懲罰異見的工具，而非真正保障國家安全的手段。\n\n民間組織「香港監察」（Hong Kong Watch）亦表示，香港政府應立即無條件釋放黃之鋒。\n\n英國外交部一位發言人對BBC中文稱：「對黃之鋒的判決清楚地表明，《國家安全法》正被用於針對因政治表達和參與而行使權利的個人。」\n\n「我們呼籲立即停止所有針對根據《國家安全法》被起訴人士的不公正檢控，並敦促中國及香港當局履行1984年《中英聯合聲明》所保障的香港民眾應享有的權利與自由。」\n\n香港警務處國安處總警司李桂華表示，歡迎法庭「重判黃之鋒」，形容刑期合適，但會再與律政司商討有否進一步行動。\n\n李桂華表示，黃之鋒未成年已經參與社運，18歲開始涉及不同罪行，包括觸犯兩項國安法、2019年6月包圍警總及藐視法庭個案，形容他是「犯案纍纍」，「連法庭都不放在眼內」。他稱，希望黃之鋒反省對國家及香港做過的錯事，培養守法精神及認識國家。\n\n被問到案情背景為何涉及2016年事件、案發於2020年卻延至2025年才起訴，李桂華引述法官指，2016年的資料對案件背景有作用，在2023年才根據報調查案件，兩年後律政司指示送上法院，「時間合適，並沒有任何拖延」。\n\n有媒體引述黃之鋒的求情信，指被捕時曾被執法人員稱為「敵人」，李桂華回應稱，他個人並沒有將其視為「敵人」。\n\n被問到Netflix仍上架黃之鋒紀錄片是否合法、能否在香港播放，李桂華表示，關注片中是否涉及煽動性內容，目前不能公開討論。\n\n行政長官李家超則形容，黃之鋒、羅冠聰等人「是破壞香港繁榮穩定其中的禍首」，在《香港國安法》實施後「仍毫無悔改之意，肆無忌憚地繼續充當外國和境外勢力的代理人」，「禍港賣港、怙惡不悛」。\n\n特區政府發言人表示，法庭對黃之鋒予以重判，「徹底打破危害國家安全分子披着所謂『國際線』或『國際倡議』外衣便能逃避法律追責的幻想」；法庭判刑時詳列理由，體現了黃之鋒「是在公平公開的司法程序下被判刑」。\n\n中國外交部發言人郭嘉昆表示，中國中央政府堅定支持香港，依法維護國安。「有關方面應切實尊重中國主權，尊重香港法制，停止就特區司法案件審理發表不負責任的言論，干預香港司法，干涉中國內政。」\n\n前學民思潮成員Louis Lee在判刑前表示，希望黃之鋒能盡快獲釋，早日與家人、朋友會面，「過一個他so called本來的生活」。他表示，上月底曾到監獄探望黃之鋒，其「狀態OK」，對世界有好奇，期待收到朋友的信件，但也擔心刑期。\n\n她身穿寫有「在頹垣中創造希望」字樣的上衣，表示自己「看着黃之鋒成長」，「十幾歲已經振振有詞，很有自己想法、有香港的大局觀……他會為香港未來、人權、學運行一條很艱難的路，甚至有機會令自己身陷囹圄。」\n\n她稱，不敢預期結果，僅望可公平公開審訊。「無論什麼結果都好，香港人願意一起承擔和承受，不應只是政治犯去承擔罪名。」\n\n宣判後，黃小姐表示「無罪就是一天冤獄都不應該坐」，又說希望大家除了流淚，還能保持希望和堅強。\n\n在英文的求情信中，黃之鋒表示，在原定出獄日期不足六個月之際面對判刑，「那種感覺幾乎彷彿又回到了起點。」\n\n他重申，其政治參與從來不是出於仇恨，對中國政府或香港政府並無怨恨；從未主張香港獨立、鼓吹「中國崩潰」（collapse of China）或政權更替，亦從未接受任何外國資金資助，或花費金錢聘請外國政治顧問。\n\n黃之鋒提及選擇認罪，也無意為其行為尋找藉口。他稱，在國安法實施後，已意識直接倡議制裁屬違法，故立即停止相關言論及行為；惟當時認為轉載他人帖文，或呼籲外國企業基於其自身商業判斷停止向香港警方供貨，與直接倡議制裁有所不同，後來才明白判斷錯誤。\n\n根據《香港國安法》，「勾結」罪可囚3年以上至10年以下，「罪行重大」者可判囚10年以上至無期徒刑。\n\n控罪指，黃之鋒於2020年7月1日至2020年11月23日，在香港與羅冠聰及其他身分不詳的人一同串謀，請求外國或境外機構、組織、人員，對香港或中國進行制裁、封鎖或採取其他敵對行動。\n\n控方案情指，黃之鋒與「香港眾志」創黨主席羅冠聰早在2016年達成串謀，透過國際遊說（international lobbying）達到「民主自決」主張。\n\n案情指二人在《香港國安法》生效前已展開「國際線」，要求外國制裁香港、中國，包括多次參與國際遊說，並出席歐洲議會人權小組委員會。二人在美國期間又會晤當地政要，如時任美國眾議院少數黨領袖佩洛西（Nancy Pelosi，裴洛西）、時任參議員盧比奧（Marco Rubio，魯比奧／魯比歐）等。二人被指推動《香港人權與民主法案》。\n\n該法案於2019年11月27日生效，授權美國政府可制裁侵害香港人權的個人與組織，並要求美國國務院每年審查香港是否仍擁有足夠自治、符合獲得貿易特殊地位的資格。", "body": "香港民主派活動人士黃之鋒被控告中國《香港國安法》下的「串謀勾結外國勢力危害國家安全」罪，星期四（11月5日）於香港高等法院被判囚10年。\n\n他正就「民主派初選47人案」服刑，原有望於2027年1月獲釋。新增的10年刑期，其中2個月2日與「47人案」同期執行；預料他須服刑到2036年，出獄時或已年屆40歲。\n\n這是繼壹傳媒創辦人黎智英後，第二宗在香港被起訴「勾結外國勢力」罪的案件，也是黃之鋒第二宗涉及《香港國安法》相關的案件。港府表示歡迎法庭的重判。\n\n國際特赦組織批評，當局在黃之鋒原定刑期獲釋前數月才新增定罪，「手法殘酷」。有法律學者分析，案件反映國安法控罪或可被「反覆動用」，令特定政治犯持續留在獄中。\n\n英國外交部回覆BBC中文查詢時稱，最新判決說明《香港國安法》被用於針對行使政治表達權利的人。\n\n此文包含Google YouTube提供的内容。由於這些内容會使用曲奇或小甜餅等科技，我們在加載任何内容前會尋求您的認可。 您可能在給予許可前希望閲讀Google YouTube曲奇政策和隱私政策。希望閲讀上述内容，請點擊“接受並繼續”。\n\n黃之鋒身穿深藍色長袖裇衫及卡其色長褲、戴黑框眼鏡，較以往瘦削，面有鬚根，出庭時向旁聽席點頭，沒有微笑，他不時細望旁聽席的人士，然後微微點頭打招呼。有旁聽人士輪流進場換人，與黃之鋒短暫打招呼後離去。\n\n正庭公眾席全滿，旁聽者包括：戴着黑色口罩的學民思潮前成員錢詩文、社運人士雷玉蓮、前社民連成員黃浩銘、前民陣召集人陳皓桓、「47人案」獲釋者岑子杰，以及多國領事人員。\n\n主審法官譚耀豪在判刑前，先交代判刑理由。在宣讀判刑理由時，黃之鋒戴着耳機不時手記筆記。最終判囚10年，黃之鋒聞訊後平靜低頭。\n\n有旁聽人士向黃之鋒揮手，並說「等你出來」，錢詩文與友人相擁哭泣；散庭後，有旁聽人士一向走上前欲與黃之鋒握手，被黃叫停。\n\n香港民主黨前創黨成員、社運人士曾健成（阿牛）在判決後對BBC中文說，在《國安法》下看不到輕判，黃之鋒如今要到40歲才得到自由，他感到相當難過、無奈，並反問「人生有多少個十年」。他隔空向黃之鋒喊話：「辛苦你了之鋒，頂住，希望你捱得過。」\n\n根據《香港國安法》，量刑分為兩級，「勾結」罪可囚3年以上至10年以下，「罪行重大」者可判囚10年以上至無期徒刑。\n\n法庭強調，國安法不具追溯力，被告被定罪基於法例實施後的行為；惟量刑時可將法例生效前的行為及活動作為其犯案背景的一部分來考慮，以評估罪行的嚴重性及程度。\n\n早前一辯方資深大律師陳政龍在書面陳詞中提出，本案不屬「罪行重大」。辯方指，黃之鋒並不迴避本案屬非常嚴重罪行的事實，但請法庭不要裁定本案為「罪行重大」。\n\n辯方律師提出，黃之鋒在國安法生效參與串謀的程度有限，角色屬次要；與黎智英案比較本案情節較輕，涉及的外國政府、人物及平台內容也有實質分別。\n\n另外，辯方也望法庭考慮黃之鋒在最早期已認罪、連同其他案件已羈押近6年；他的個人背景品格、檢控延近5年、整體刑期原則等。\n\n法官則認為黃之鋒與羅冠聰在本案與黎智英相似，均站在最前線，是主謀，情節嚴重。綜合本案所有情況，以13年監禁作為量刑起點，基於被告人的認罪答辯和求情，將量刑起點下調 3 年，判處監禁 10 年；即《國安法》第二十九條下屬「罪行重大」所須判處的最低刑期。\n\n黃之鋒正就「民主派初選47人案」服刑，原有望於2027年1月獲釋。新增的10年刑期，其中2個月2日與「47人案」同期執行。\n\n美國喬治城大學亞洲法律中心（Georgetown Center for Asian Law）高級研究員黎恩灝分析，從技術層面而言，若無新控罪，黃之鋒原本望於明年初獲釋，故新增控罪客觀上提供方式，「令黃之鋒在更長時間無法重返公眾視野」。\n\n他表示，案件程序令人憂慮，一方面反映香港政府急於把刑事檢控武器化，若政府認為有需要，國安法控罪便可以被「反覆動用」，令特定政治犯持續留在獄中。\n\n另一方面，控方就此案提出多項指控均涉及國安法生效前的行為，政府不惜犧牲正當程序原則，以追溯方式將政治犯的行為刑事化。\n\n國際特赦組織亞太區副總監白舒然（Sarah Brooks）表示，最新的國安定罪，在黃之鋒原定刑期獲釋前數月降臨，形容「手法殘酷，甚至可能是蓄意為之」，又指判刑提醒香港的《國安法》已淪為懲罰異見的工具，而非真正保障國家安全的手段。\n\n民間組織「香港監察」（Hong Kong Watch）亦表示，香港政府應立即無條件釋放黃之鋒。\n\n英國外交部一位發言人對BBC中文稱：「對黃之鋒的判決清楚地表明，《國家安全法》正被用於針對因政治表達和參與而行使權利的個人。」\n\n「我們呼籲立即停止所有針對根據《國家安全法》被起訴人士的不公正檢控，並敦促中國及香港當局履行1984年《中英聯合聲明》所保障的香港民眾應享有的權利與自由。」\n\n香港警務處國安處總警司李桂華表示，歡迎法庭「重判黃之鋒」，形容刑期合適，但會再與律政司商討有否進一步行動。\n\n李桂華表示，黃之鋒未成年已經參與社運，18歲開始涉及不同罪行，包括觸犯兩項國安法、2019年6月包圍警總及藐視法庭個案，形容他是「犯案纍纍」，「連法庭都不放在眼內」。他稱，希望黃之鋒反省對國家及香港做過的錯事，培養守法精神及認識國家。\n\n被問到案情背景為何涉及2016年事件、案發於2020年卻延至2025年才起訴，李桂華引述法官指，2016年的資料對案件背景有作用，在2023年才根據報調查案件，兩年後律政司指示送上法院，「時間合適，並沒有任何拖延」。\n\n有媒體引述黃之鋒的求情信，指被捕時曾被執法人員稱為「敵人」，李桂華回應稱，他個人並沒有將其視為「敵人」。\n\n被問到Netflix仍上架黃之鋒紀錄片是否合法、能否在香港播放，李桂華表示，關注片中是否涉及煽動性內容，目前不能公開討論。\n\n行政長官李家超則形容，黃之鋒、羅冠聰等人「是破壞香港繁榮穩定其中的禍首」，在《香港國安法》實施後「仍毫無悔改之意，肆無忌憚地繼續充當外國和境外勢力的代理人」，「禍港賣港、怙惡不悛」。\n\n特區政府發言人表示，法庭對黃之鋒予以重判，「徹底打破危害國家安全分子披着所謂『國際線』或『國際倡議』外衣便能逃避法律追責的幻想」；法庭判刑時詳列理由，體現了黃之鋒「是在公平公開的司法程序下被判刑」。\n\n中國外交部發言人郭嘉昆表示，中國中央政府堅定支持香港，依法維護國安。「有關方面應切實尊重中國主權，尊重香港法制，停止就特區司法案件審理發表不負責任的言論，干預香港司法，干涉中國內政。」\n\n前學民思潮成員Louis Lee在判刑前表示，希望黃之鋒能盡快獲釋，早日與家人、朋友會面，「過一個他so called本來的生活」。他表示，上月底曾到監獄探望黃之鋒，其「狀態OK」，對世界有好奇，期待收到朋友的信件，但也擔心刑期。\n\n她身穿寫有「在頹垣中創造希望」字樣的上衣，表示自己「看着黃之鋒成長」，「十幾歲已經振振有詞，很有自己想法、有香港的大局觀……他會為香港未來、人權、學運行一條很艱難的路，甚至有機會令自己身陷囹圄。」\n\n她稱，不敢預期結果，僅望可公平公開審訊。「無論什麼結果都好，香港人願意一起承擔和承受，不應只是政治犯去承擔罪名。」\n\n宣判後，黃小姐表示「無罪就是一天冤獄都不應該坐」，又說希望大家除了流淚，還能保持希望和堅強。\n\n在英文的求情信中，黃之鋒表示，在原定出獄日期不足六個月之際面對判刑，「那種感覺幾乎彷彿又回到了起點。」\n\n他重申，其政治參與從來不是出於仇恨，對中國政府或香港政府並無怨恨；從未主張香港獨立、鼓吹「中國崩潰」（collapse of China）或政權更替，亦從未接受任何外國資金資助，或花費金錢聘請外國政治顧問。\n\n黃之鋒提及選擇認罪，也無意為其行為尋找藉口。他稱，在國安法實施後，已意識直接倡議制裁屬違法，故立即停止相關言論及行為；惟當時認為轉載他人帖文，或呼籲外國企業基於其自身商業判斷停止向香港警方供貨，與直接倡議制裁有所不同，後來才明白判斷錯誤。\n\n根據《香港國安法》，「勾結」罪可囚3年以上至10年以下，「罪行重大」者可判囚10年以上至無期徒刑。\n\n控罪指，黃之鋒於2020年7月1日至2020年11月23日，在香港與羅冠聰及其他身分不詳的人一同串謀，請求外國或境外機構、組織、人員，對香港或中國進行制裁、封鎖或採取其他敵對行動。\n\n控方案情指，黃之鋒與「香港眾志」創黨主席羅冠聰早在2016年達成串謀，透過國際遊說（international lobbying）達到「民主自決」主張。\n\n案情指二人在《香港國安法》生效前已展開「國際線」，要求外國制裁香港、中國，包括多次參與國際遊說，並出席歐洲議會人權小組委員會。二人在美國期間又會晤當地政要，如時任美國眾議院少數黨領袖佩洛西（Nancy Pelosi，裴洛西）、時任參議員盧比奧（Marco Rubio，魯比奧／魯比歐）等。二人被指推動《香港人權與民主法案》。\n\n該法案於2019年11月27日生效，授權美國政府可制裁侵害香港人權的個人與組織，並要求美國國務院每年審查香港是否仍擁有足夠自治、符合獲得貿易特殊地位的資格。", "link": "https://www.bbc.com/zhongwen/articles/cm5ynepe9578o/trad?at_medium=RSS&at_campaign=rss", "time": "11月06日 00:26", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "從蔡康永、《VIVANT》到姆巴佩：北京為何區別處理「辱華」事件？", "title_zh": "從蔡康永、《VIVANT》到姆巴佩：北京為何區別處理「辱華」事件？", "summary_orig": "最近幾週，中國輿論場接連出現多宗被貼上「辱華」標籤的爭議事件：台灣藝人蔡康永、日本電視劇《VIVANT》以及法國球星姆巴佩。三宗事件看似性質相近，但官方反應與輿論熱度卻明顯不同，多位分析人士對BBC中文指出：這些差異背後是當局對於每個事件的定性並不相同。", "summary_zh": "最近幾週，中國輿論場接連出現多宗被貼上「辱華」標籤的爭議事件：台灣藝人蔡康永、日本電視劇《VIVANT》以及法國球星姆巴佩。三宗事件看似性質相近，但官方反應與輿論熱度卻明顯不同，多位分析人士對BBC中文指出：這些差異背後是當局對於每個事件的定性並不相同。", "body_orig": "", "body_zh": "近幾週，中國輿論場接連出現三宗被貼上「辱華」標籤的爭議：台灣藝人蔡康永、日本電視劇《VIVANT》以及法國足球明星姆巴佩。三宗事件看似性質相近，但官方反應、官媒投入程度和輿論熱度並不一致。\n\n蔡康永的言論被部分中國網民解讀為涉及台灣主權立場，但官方迴應有限，並未持續高調追擊；《VIVANT》則引起中國外交部、國防部及官媒接連回應；姆巴佩事件在網絡批評之外，更蔓延至品牌合作和商業層面。\n\n三宗事件分別涉及台灣、日本和西方國家，卻都被置於「辱華」的框架下討論。多名受訪學者認為，北京的處理方式並非單純取決於對象來自哪個國家或地區，而在於事件是否觸及主權、歷史記憶等核心政治議題，以及當下的雙邊關係與內外政策考量。\n\n他們指出，中國官方一方面持續借助民族主義凝聚國內共識，另一方面也試圖控制動員強度，避免影響外交關係、經濟利益和其他政策目標。三宗風波正好呈現出這種權衡與取捨。\n\n蔡康永事件最初在社交媒體發酵。部分中國網民將其言論解讀為涉及台灣主權立場，要求封殺並要求他表態，但官方和主流官媒並未持續追擊。蔡康永多年來在中國累積的知名度與市場影響力，也使事件最終未升級為大規模政治風波。\n\n相比之下，《VIVANT》引發的爭議更為持久。劇中中國情報人員對日本特務施以酷刑的情節。事件曝光後，中國外交部、國防部等官方機構先後回應，官媒亦連日發表評論，相關話題一度長時間佔據中國網絡熱搜。\n\n香港浸會大學傳播學院副教授閭丘露薇對BBC中文說，她和同事曾對外交部發言人的發言內容進行系統研究，結果顯示官方態度首先取決於議題性質。涉及領土、主權、歷史等核心利益的議題，措辭通常最嚴厲；如果牽涉日本，反應預期會更強硬。\n\n她指出，其次是對象和雙邊關係。台灣被北京視為主權問題，官方沒有退讓空間；對日本，歷史記憶和國內輿論令官方難以放軟態度；對歐美，官方則要同時權衡經貿和外交關係，反應因此相對克制。\n\n國立政治大學國家發展研究所副教授黃兆年認為，官方介入程度、回應層級和持續時間，主要取決於兩個因素：事件本身在多大程度上關乎國家尊嚴和民族情感，以及事件發生期間是否存在其他重大顧慮。\n\n他指出，對於同時出現的多宗爭議，當局會進行成本效益評估。在蔡康永事件上，北京必須考慮台灣正值選舉這一背景，也會擔心強硬表態影響統派選情。\n\n過去幾年，這類風波的輿論壓力往往不止停留在社交媒體，而是迅速擴散至商業領域。從品牌道歉、撤換代言人，到企業修改官網表述，中國龐大的消費市場已成為傳遞政治訊號的一部分。\n\n另一場風波圍繞姆巴佩展開。他被指曾發表涉及毛澤東的負面言論，引發中國網絡輿論批評。\n\n隨著事件升溫，多家與姆巴佩合作的品牌受到中國網民施壓，要求作出表態。有中國品牌迅速解約、中止轉播。官媒多次強調，中國廣告收入是姆巴佩的重要收入來源，形容他「搬起石頭砸自己的腳」，並以失去中國市場作為警告。\n\n《VIVANT》則被新華社定性為「惡意抹黑中國、炮製虛假歷史敘事」後，中國輿論場也開始追查哪些企業曾在劇中投放廣告，並要求相關企業道歉。與該劇合作的日本企業三麗鷗（Sanrio）其後公開道歉，令事件進一步擴大至商業層面。\n\n閭丘露薇認為，這種做法並不新鮮。「只要對方在乎中國市場，這種做法往往很快見效，例如品牌道歉、撤換代言人。」她說，這已成為中國對外施壓的常用工具之一，而且未來仍可能持續使用。\n\n不過，這種手段的效果取決於對方對中國市場的依賴程度。對依賴較低的國家或企業，作用有限；長遠而言，也可能促使對方分散市場，減少對中國的依賴。\n\n美國邁阿密大學（University of Miami）政治學教授金德芳（June Teufel Dreyer）表示，北京利用市場規模影響外部行為已有相當長的歷史，而且在不少案例中確實取得效果。「如果一家企業認為失去中國市場將付出巨大代價，它通常會選擇道歉或讓步。」\n\n但她也指出，近年一些國家和企業開始重新評估風險。當企業發現中國市場同時伴隨政治和監管不確定性時，便可能尋求降低依賴。\n\n美國企業研究所（American Enterprise Institute）高級研究員黃韻琪認為，民族主義動員與市場壓力很難完全分開。「中國政府不一定需要直接下達行政命令，只要市場和輿論相信某家公司觸碰了政治紅線，企業往往就會主動作出調整。」\n\n黃兆年則指出，與十年前相比，中國市場對全球企業仍然重要，但相對吸引力已不如過去。在地緣政治風險升高、供應鏈重組及中國經濟放緩的背景下，企業的計算方式正在改變。對北京而言，市場規模仍是重要籌碼，但未必像過去那樣具有壓倒性的威懾力。\n\n受訪學者認為，理解近年頻繁出現的「辱華」風波，不能只從外交或對外關係角度觀察，還要放回中國國內政治的脈絡中。\n\n閭丘露薇指出，以「百年屈辱」為核心的民族主義敘事並非近年才出現，而是在1989年後透過愛國主義教育，被系統性地推廣至教科書、媒體和文化產品。她認為，這類動員首先服務於內政，核心作用是鞏固執政合法性、凝聚社會共識；向外界傳遞政治訊號則屬於次要功能。\n\n黃兆年認為，在經濟高速增長不再被視為理所當然的背景下，民族主義對中共的重要性正在上升。當局需要持續向民眾展示自己是國家利益和民族尊嚴的捍衛者，而外部衝突和「辱華」爭議恰好提供了這樣的機會。\n\n黃韻琪也表示，中國官方對相關事件的回應，往往不僅是針對事件本身，更是在向國內受眾展示政府正在捍衛核心利益與國家尊嚴。她認為，民族主義已成為中國政府的重要政治資源。\n\n不過，受訪學者同時指出，民族主義不能無限制地被動員。黃韻琪警告，一旦民族主義情緒被全面激發，未必總能按照官方預期的方向發展。她形容，民族主義有時像被打開的「潘朵拉盒子」，既能成為動員社會的工具，也可能帶來難以完全控制的後果。\n\n近年愈來愈多「辱華」事件在網絡上引發巨大討論，卻未必能在現實社會留下同樣強烈的影響。在姆巴佩事件中，不少中國網民甚至不清楚爭議源於哪一句言論；《VIVANT》的劇情爭議對許多人而言較為遙遠；蔡康永多年來累積的知名度和觀眾緣，也使部分用戶沒有完全響應抵制呼籲。\n\n閭丘露薇部分認同民族主義動員出現疲勞的說法，但認為「疲勞」未必是最準確的描述。「我覺得更像是網絡和現實成了兩個平行的世界。」她說，演算法能決定人們在手機上看到什麼，也能在短時間內點燃強烈情緒，但這些情緒往往來得快、去得也快。\n\n在她看來，這更多反映民族主義動員的邊際效應正在下降。「類似事件越來越頻繁，議題又往往離普通人的生活很遠，每一次動員的影響力自然就減弱了。」\n\n抖音上也有用戶留言說：「月薪三千累死累活到家，發現自己民族情感被傷害了？」這類聲音反映，部分網民更在意現實生活壓力，而非遙遠的政治爭議。\n\n黃兆年認為，民族主義動員在中國長期存在，但普通人也會計算何時表態、表態到什麼程度。並非每一次官方發動，民眾都需要以同樣的熱情回應。\n\n他指出，今天的中國人與其說是被「洗腦」，不如說是被「洗嘴」：人們對表達真實意見心存忌憚，但何時、在何種程度上響應中央，是一種計算，而非真的相信。", "body": "近幾週，中國輿論場接連出現三宗被貼上「辱華」標籤的爭議：台灣藝人蔡康永、日本電視劇《VIVANT》以及法國足球明星姆巴佩。三宗事件看似性質相近，但官方反應、官媒投入程度和輿論熱度並不一致。\n\n蔡康永的言論被部分中國網民解讀為涉及台灣主權立場，但官方迴應有限，並未持續高調追擊；《VIVANT》則引起中國外交部、國防部及官媒接連回應；姆巴佩事件在網絡批評之外，更蔓延至品牌合作和商業層面。\n\n三宗事件分別涉及台灣、日本和西方國家，卻都被置於「辱華」的框架下討論。多名受訪學者認為，北京的處理方式並非單純取決於對象來自哪個國家或地區，而在於事件是否觸及主權、歷史記憶等核心政治議題，以及當下的雙邊關係與內外政策考量。\n\n他們指出，中國官方一方面持續借助民族主義凝聚國內共識，另一方面也試圖控制動員強度，避免影響外交關係、經濟利益和其他政策目標。三宗風波正好呈現出這種權衡與取捨。\n\n蔡康永事件最初在社交媒體發酵。部分中國網民將其言論解讀為涉及台灣主權立場，要求封殺並要求他表態，但官方和主流官媒並未持續追擊。蔡康永多年來在中國累積的知名度與市場影響力，也使事件最終未升級為大規模政治風波。\n\n相比之下，《VIVANT》引發的爭議更為持久。劇中中國情報人員對日本特務施以酷刑的情節。事件曝光後，中國外交部、國防部等官方機構先後回應，官媒亦連日發表評論，相關話題一度長時間佔據中國網絡熱搜。\n\n香港浸會大學傳播學院副教授閭丘露薇對BBC中文說，她和同事曾對外交部發言人的發言內容進行系統研究，結果顯示官方態度首先取決於議題性質。涉及領土、主權、歷史等核心利益的議題，措辭通常最嚴厲；如果牽涉日本，反應預期會更強硬。\n\n她指出，其次是對象和雙邊關係。台灣被北京視為主權問題，官方沒有退讓空間；對日本，歷史記憶和國內輿論令官方難以放軟態度；對歐美，官方則要同時權衡經貿和外交關係，反應因此相對克制。\n\n國立政治大學國家發展研究所副教授黃兆年認為，官方介入程度、回應層級和持續時間，主要取決於兩個因素：事件本身在多大程度上關乎國家尊嚴和民族情感，以及事件發生期間是否存在其他重大顧慮。\n\n他指出，對於同時出現的多宗爭議，當局會進行成本效益評估。在蔡康永事件上，北京必須考慮台灣正值選舉這一背景，也會擔心強硬表態影響統派選情。\n\n過去幾年，這類風波的輿論壓力往往不止停留在社交媒體，而是迅速擴散至商業領域。從品牌道歉、撤換代言人，到企業修改官網表述，中國龐大的消費市場已成為傳遞政治訊號的一部分。\n\n另一場風波圍繞姆巴佩展開。他被指曾發表涉及毛澤東的負面言論，引發中國網絡輿論批評。\n\n隨著事件升溫，多家與姆巴佩合作的品牌受到中國網民施壓，要求作出表態。有中國品牌迅速解約、中止轉播。官媒多次強調，中國廣告收入是姆巴佩的重要收入來源，形容他「搬起石頭砸自己的腳」，並以失去中國市場作為警告。\n\n《VIVANT》則被新華社定性為「惡意抹黑中國、炮製虛假歷史敘事」後，中國輿論場也開始追查哪些企業曾在劇中投放廣告，並要求相關企業道歉。與該劇合作的日本企業三麗鷗（Sanrio）其後公開道歉，令事件進一步擴大至商業層面。\n\n閭丘露薇認為，這種做法並不新鮮。「只要對方在乎中國市場，這種做法往往很快見效，例如品牌道歉、撤換代言人。」她說，這已成為中國對外施壓的常用工具之一，而且未來仍可能持續使用。\n\n不過，這種手段的效果取決於對方對中國市場的依賴程度。對依賴較低的國家或企業，作用有限；長遠而言，也可能促使對方分散市場，減少對中國的依賴。\n\n美國邁阿密大學（University of Miami）政治學教授金德芳（June Teufel Dreyer） 性，再加上近期歐洲其他惡意破壞事件，使不少人將懷疑目光投向俄羅斯，這並不令人意外。\n\n今年稍早發生一系列網路攻擊以及針對敏感設施的不明無人機目擊事件後，過去幾天又出現超市冷凍設備遭遠端駭入、血庫系統遭攻擊、波蘭與俄羅斯邊境的可疑事件，以及8月針對德國萊比錫哈勒機場（Leipzig Halle Airport）的無人機襲擊，德國內政部長當時更公開將責任歸咎於莫斯科。\n\n許多人認為，儘管目前僅有間接證據，但這很可能又是一次「混合戰爭」（hybrid warfare）、「灰色地帶行動」（grey zone warfare）或「門檻以下戰爭」（sub-threshold warfare）的案例。\n\n這類行動旨在破壞一國的基礎設施或社會運作，通常匿名進行、容易否認責任，而且不至於觸發北約第五條款，因而無法直接引發西方國家的集體回應。\n\n莫斯科確實對北約支持烏克蘭感到憤怒，因為北約的援助阻礙了克里姆林宮吞併烏克蘭、實質終結其獨立地位的計畫。\n\n俄羅斯一些部落客甚至表示，既然烏克蘭無人機已讓俄國機場變得不安全，而西方制裁又阻止俄羅斯航空公司使用歐洲領空，那麼西方國家為何不該感受同樣的痛苦？\n\n然而，截至週四（11月5日）晚間，仍沒有任何確切證據顯示這些虛假威脅與俄羅斯、伊朗，或其控制的代理人組織有關。\n\n其中一條線索，是週四上午羅馬機場當局收到的一封恐嚇電郵，寄件者自稱是「男性國家戰士」（Fighters of the Male State）。\n\n這個名稱很可能指向俄羅斯團體「男性軍團」（Muzhskoi Legion，亦稱 Male Legion）。這是一個極右翼組織，因主張極端而於2021年遭莫斯科法院取締。\n\n然而，該組織仍在Telegram保有數以萬計追隨者，並在翌年俄羅斯全面入侵烏克蘭後公開表達支持。\n\n不過，即使寄往羅馬的電子郵件確實出自該組織之手，又有誰能保證不是其他團體借用這個名義行事？\n\n因此，這封郵件恐怕無法提供警方與機場當局真正需要的線索，以查明究竟是誰製造這些虛假威脅，以及背後動機為何。\n\n對試圖查明幕後黑手、並評估未來如何降低類似事件衝擊的各國警方、機場管理單位與交通部門而言，關鍵不在於鎖定自己認為最可能的嫌疑對象，而是追查冷冰冰但可靠的證據線索──前提是他們找得到這些線索。\n\n歐洲至少21架客機及多座機場遭到炸彈威脅，這是一週內第二次發生類似事件。英國政府形容這些威脅為「惡意惡作劇」。\n\n一架由都柏林飛往羅馬的愛爾蘭航空客機，被迫改降法國空軍基地，而義大利則出動戰鬥機護送芬蘭航空（Finnair）一班由赫爾辛基飛往羅馬的航班。\n\nEasyJet表示，其由紐卡素（Newcastle）及格拉斯哥（Glasgow）飛往布拉格的航班，基於預防措施，在抵達時由警方接應。另一方面，倫敦希斯洛機場（Heathrow）及伯明翰機場收到的威脅，則被評估為不具可信性。\n\n各地搜查均未發現任何爆炸物，目前尚不清楚這些事件是否彼此相關。部分威脅則是由一個知名度不高的組織宣稱負責。\n\n發信者自稱為「男性國家戰士」（Fighters of the Male State），並聲稱其目標是「女性主義政權」，希望「在歷史上留下印記」。\n\n這些內容最先由義大利媒體披露，其後獲管理羅馬兩座機場的羅馬機場公司（Aeroporti di Roma）向BBC證實。\n\n本文原以英文撰寫，我們使用了人工智能協助翻譯，並由BBC記者在發佈前進行審核。了解更多關於我們如何使用人工智能的資訊。", "body": "除了倫敦希斯洛機場（Heathrow Airport）是明顯例外，幾乎在其他所有案例中，相關威脅都被認為具有足夠可信度，以至於當局決定讓涉事航班改道。在義大利的案例中，甚至出動戰鬥機升空伴飛護航。\n\n這些航空業惡作劇威脅同時出現、且經過協調的特性，再加上近期歐洲其他惡意破壞事件，使不少人將懷疑目光投向俄羅斯，這並不令人意外。\n\n今年稍早發生一系列網路攻擊以及針對敏感設施的不明無人機目擊事件後，過去幾天又出現超市冷凍設備遭遠端駭入、血庫系統遭攻擊、波蘭與俄羅斯邊境的可疑事件，以及8月針對德國萊比錫哈勒機場（Leipzig Halle Airport）的無人機襲擊，德國內政部長當時更公開將責任歸咎於莫斯科。\n\n許多人認為，儘管目前僅有間接證據，但這很可能又是一次「混合戰爭」（hybrid warfare）、「灰色地帶行動」（grey zone warfare）或「門檻以下戰爭」（sub-threshold warfare）的案例。\n\n這類行動旨在破壞一國的基礎設施或社會運作，通常匿名進行、容易否認責任，而且不至於觸發北約第五條款，因而無法直接引發西方國家的集體回應。\n\n莫斯科確實對北約支持烏克蘭感到憤怒，因為北約的援助阻礙了克里姆林宮吞併烏克蘭、實質終結其獨立地位的計畫。\n\n俄羅斯一些部落客甚至表示，既然烏克蘭無人機已讓俄國機場變得不安全，而西方制裁又阻止俄羅斯航空公司使用歐洲領空，那麼西方國家為何不該感受同樣的痛苦？\n\n然而，截至週四（11月5日）晚間，仍沒有任何確切證據顯示這些虛假威脅與俄羅斯、伊朗，或其控制的代理人組織有關。\n\n其中一條線索，是週四上午羅馬機場當局收到的一封恐嚇電郵，寄件者自稱是「男性國家戰士」（Fighters of the Male State）。\n\n這個名稱很可能指向俄羅斯團體「男性軍團」（Muzhskoi Legion，亦稱 Male Legion）。這是一個極右翼組織，因主張極端而於2021年遭莫斯科法院取締。\n\n然而，該組織仍在Telegram保有數以萬計追隨者，並在翌年俄羅斯全面入侵烏克蘭後公開表達支持。\n\n不過，即使寄往羅馬的電子郵件確實出自該組織之手，又有誰能保證不是其他團體借用這個名義行事？\n\n因此，這封郵件恐怕無法提供警方與機場當局真正需要的線索，以查明究竟是誰製造這些虛假威脅，以及背後動機為何。\n\n對試圖查明幕後黑手、並評估未來如何降低類似事件衝擊的各國警方、機場管理單位與交通部門而言，關鍵不在於鎖定自己認為最可能的嫌疑對象，而是追查冷冰冰但可靠的證據線索──前提是他們找得到這些線索。\n\n歐洲至少21架客機及多座機場遭到炸彈威脅，這是一週內第二次發生類似事件。英國政府形容這些威脅為「惡意惡作劇」。\n\n一架由都柏林飛往羅馬的愛爾蘭航空客機，被迫改降法國空軍基地，而義大利則出動戰鬥機護送芬蘭航空（Finnair）一班由赫爾辛基飛往羅馬的航班。\n\nEasyJet表示，其由紐卡素（Newcastle）及格拉斯哥（Glasgow）飛往布拉格的航班，基於預防措施，在抵達時由警方接應。另一方面，倫敦希斯洛機場（Heathrow）及伯明翰機場收到的威脅，則被評估為不具可信性。\n\n各地搜查均未發現任何爆炸物，目前尚不清楚這些事件是否彼此相關。部分威脅則是由一個知名度不高的組織宣稱負責。\n\n發信者自稱為「男性國家戰士」（Fighters of the Male State），並聲稱其目標是「女性主義政權」，希望「在歷史上留下印記」。\n\n這些內容最先由義大利媒體披露，其後獲管理羅馬兩座機場的羅馬機場公司（Aeroporti di Roma）向BBC證實。\n\n本文原以英文撰寫，我們使用了人工智能協助翻譯，並由BBC記者在發佈前進行審核。了解更多關於我們如何使用人工智能的資訊。", "link": "https://www.bbc.com/zhongwen/articles/c60qkk15l8d0o/trad?at_medium=RSS&at_campaign=rss", "time": "11月06日 19:14", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "美國中期選舉後，AI放緩憂慮重創全球大型科技股，韓國股市熔斷", "title_zh": "美國中期選舉後，AI放緩憂慮重創全球大型科技股，韓國股市熔斷", "summary_orig": "市場正對美國期中選舉後可能加強審查數據中心建設及人工智慧產業的前景作出反應。", "summary_zh": "市場正對美國期中選舉後可能加強審查數據中心建設及人工智慧產業的前景作出反應。", "body_orig": "", "body_zh": "在美國期中選舉引發外界對人工智慧（AI）發展放緩的憂慮之後，美國及亞洲主要科技企業市值蒸發數以千億美元計，全球股市出現大幅拋售。\n\n隨著主張放緩AI發展的民主黨候選人在選舉中勝出，科技及人工智慧相關企業股價應聲大跌。\n\n根據道瓊數據，以科技股為主的納斯達克綜合指數收市下跌超過5.5%，市值蒸發約2.5兆美元（1.9兆英鎊）；其他美國主要股指亦出現顯著跌幅，創下自2025年以來最差單日表現。\n\n這波拋售潮也反映市場原本就存在的憂慮，即企業在AI領域投入的龐大資金最終能否帶來回報。\n\n亞洲方面，以科技股為主的股市指數週五早盤大幅下跌，生產AI所需晶片及相關設備的企業股價紛紛走低。\n\n日本日經225指數早盤下跌6%，記憶體晶片製造商鎧俠（Kioxia）股價重挫逾12.6%，競爭對手東京威力科創（Tokyo Electron）則下跌9.5%。\n\n韓國晶片製造商SK海力士（SK Hynix）下跌超過11.5%，三星電子（Samsung）跌幅接近10%。\n\n首爾股市的拋售潮導致韓國綜合股價指數（Kospi）暴跌超過8.5%，並觸發所謂的「熔斷機制」（circuit breaker），即透過暫停交易來抑制恐慌性賣盤。\n\n台灣加權股價指數（Taiex）下跌超過8.3%，晶圓代工龍頭台積電（TSMC）重挫近8.5%。\n\nMarketWatch晶片產業分析師布蘭妮．阮（Britney Nguyen）表示，這反映出市場對AI基礎建設支出規模的擔憂「正在持續發酵」。\n\n民主黨候選人在全美多場選戰中主張放緩數據中心與人工智慧產業的擴張，而全國各地選票上也出現數十項旨在限制這類基礎設施發展的提案。\n\n隨著民主黨在週二期中選舉中拿下參議院與眾議院控制權，他們將在特朗普（Donald Trump）剩餘任期內掌握國會主導權。\n\n德州新當選的民主黨籍州長吉娜·伊諾霍薩（Gina Hinojosa）競選期間便大力反對數據中心擴張，並承諾暫停批准新的數據中心建設計畫。\n\n以及，「記住，不是共和黨，而是『笨主黨』（Dumocrats，嘲諷民主黨的說法）。但不用害怕，不管用什麼方法，我們很快就會變得比以往更加強大。讓美國再次偉大！」\n\n部分民主黨人士則認為，人工智慧產業在缺乏足夠監管與安全防護措施下發展過快，因此希望利用掌握國會的新權力加以約束。\n\n民主黨參議員伯尼·桑德斯（Bernie Sanders）週四在X平台發文表示：「美國人民不希望大型科技寡頭破壞環境、摧毀工作機會，並威脅人類未來。現在就應實施全國性的數據中心建設暫停令。」\n\n高度依賴AI數據中心業務的企業，包括關鍵晶片製造商與半導體公司股價週四全面重挫，突顯投資人的憂慮其實早已逐漸累積。\n\n歐洲股市週四交易時段，晶片製造商英飛凌（Infineon）股價下跌超過8.5%，科技設備製造商艾司摩爾（ASML）下跌6.5%。\n\n其他晶片製造商也同樣受挫，超微（AMD）與美光（Micron）跌幅均超過17%；英特爾（Intel）下跌10.3%；記憶卡製造商閃迪（Sandisk）更暴跌超過22%。\n\n追蹤30家大型半導體企業表現的費城半導體指數（Philadelphia Semiconductor Index）重挫超過12%。\n\n馬斯克（Elon Musk）旗下的SpaceX與特斯拉（Tesla）股價也大幅下跌，分別下跌8%和接近11%，單日合計蒸發超過3,000億美元市值。\n\n馬斯克先前曾投入近4.5億美元支持共和黨候選人，其中至少4,500萬美元協助肯·帕克斯頓（Ken Paxton）競選德州參議員席次，但德州最終仍在週二晚間出現所謂的「民主黨海嘯」，轉向支持民主黨。\n\n整體而言，包括蘋果（Apple）、輝達與特斯拉在內的所謂「科技七巨頭」（Magnificent Seven），單日市值合計蒸發約1兆美元。\n\n標普500指數（S&P 500）收盤下跌4.4%；道瓊工業平均指數（Dow Jones Industrial Average）則回吐週三所有漲幅，收跌超過3.4%。\n\n由於跌幅過大，納斯達克綜合指數（Nasdaq Composite）已進入市場人士所稱的「修正區間」（correction territory），即指數較近期高點回落至少10%。\n\n財富俱樂部（Wealth Club）首席投資策略師蘇珊娜·斯特里特（Susannah Streeter）表示，納斯達克與標普500的大幅下跌正向全球市場傳遞衝擊波。\n\n「市場原本就擔心投入AI基礎設施的龐大資金未必能帶來投資人期待的回報，如今又面臨數據中心建設可能大幅放緩的風險，兩種憂慮同時爆發。」\n\n盛寶銀行（Saxo）首席投資策略師查魯·查納納（Charu Chanana）則表示，未來數據中心審批將受到更嚴格檢視，而其對環境及電價的影響也可能拖延計畫進度並推高整體產業成本。\n\n她表示，兩大政黨都希望確保美國在科技領域維持領先，「但支持AI發展，與允許基礎設施不計代價、不受限制地擴張，是兩回事。」\n\nOpenAI總裁兼共同創辦人格雷格·布羅克曼（Greg Brockman）表示，他認為各界都對社會對數據中心的反應感到意外，而業界仍需做更多工作爭取地方社區支持。\n\n布羅克曼週三晚間在加州納帕（Napa）舉行的《華爾街日報》科技會議（WSJ Tech conference）上表示：「過去一年來，我們逐漸意識到，身在舊金山、卻想在德州、喬治亞州以及其他地方興建基礎設施時，不能只是在社群媒體上發文說『這會是件好事』。你必須真正走進那些社區。」\n\nMeta總裁黛娜·鮑威爾·麥考密克（Dina Powell McCormick）則表示，科技產業需要更努力向大眾說明AI的價值。\n\n除了期中選舉帶來的即時衝擊之外，也有愈來愈多投資人開始擔心，AI概念股可能已形成資產泡沫，而市場正迎來一次必要的修正。\n\n本文原以英文撰寫，我們使用了人工智能協助翻譯，並由BBC記者在發佈前進行審核。了解更多關於我們如何使用人工智能的資訊。", "body": "在美國期中選舉引發外界對人工智慧（AI）發展放緩的憂慮之後，美國及亞洲主要科技企業市值蒸發數以千億美元計，全球股市出現大幅拋售。\n\n隨著主張放緩AI發展的民主黨候選人在選舉中勝出，科技及人工智慧相關企業股價應聲大跌。\n\n根據道瓊數據，以科技股為主的納斯達克綜合指數收市下跌超過5.5%，市值蒸發約2.5兆美元（1.9兆英鎊）；其他美國主要股指亦出現顯著跌幅，創下自2025年以來最差單日表現。\n\n這波拋售潮也反映市場原本就存在的憂慮，即企業在AI領域投入的龐大資金最終能否帶來回報。\n\n亞洲方面，以科技股為主的股市指數週五早盤大幅下跌，生產AI所需晶片及相關設備的企業股價紛紛走低。\n\n日本日經225指數早盤下跌6%，記憶體晶片製造商鎧俠（Kioxia）股價重挫逾12.6%，競爭對手東京威力科創（Tokyo Electron）則下跌9.5%。\n\n韓國晶片製造商SK海力士（SK Hynix）下跌超過11.5%，三星電子（Samsung）跌幅接近10%。\n\n首爾股市的拋售潮導致韓國綜合股價指數（Kospi）暴跌超過8.5%，並觸發所謂的「熔斷機制」（circuit breaker），即透過暫停交易來抑制恐慌性賣盤。\n\n台灣加權股價指數（Taiex）下跌超過8.3%，晶圓代工龍頭台積電（TSMC）重挫近8.5%。\n\nMarketWatch晶片產業分析師布蘭妮．阮（Britney Nguyen）表示，這反映出市場對AI基礎建設支出規模的擔憂「正在持續發酵」。\n\n民主黨候選人在全美多場選戰中主張放緩數據中心與人工智慧產業的擴張，而全國各地選票上也出現數十項旨在限制這類基礎設施發展的提案。\n\n隨著民主黨在週二期中選舉中拿下參議院與眾議院控制權，他們將在特朗普（Donald Trump）剩餘任期內掌握國會主導權。\n\n德州新當選的民主黨籍州長吉娜·伊諾霍薩（Gina Hinojosa）競選期間便大力反對數據中心擴張，並承諾暫停批准新的數據中心建設計畫。\n\n以及，「記住，不是共和黨，而是『笨主黨』（Dumocrats，嘲諷民主黨的說法）。但不用害怕，不管用什麼方法，我們很快就會變得比以往更加強大。讓美國再次偉大！」\n\n部分民主黨人士則認為，人工智慧產業在缺乏足夠監管與安全防護措施下發展過快，因此希望利用掌握國會的新權力加以約束。\n\n民主黨參議員伯尼·桑德斯（Bernie Sanders）週四在X平台發文表示：「美國人民不希望大型科技寡頭破壞環境、摧毀工作機會，並威脅人類未來。現在就應實施全國性的數據中心建設暫停令。」\n\n高度依賴AI數據中心業務的企業，包括關鍵晶片製造商與半導體公司股價週四全面重挫，突顯投資人的憂慮其實早已逐漸累積。\n\n歐洲股市週四交易時段，晶片製造商英飛凌（Infineon）股價下跌超過8.5%，科技設備製造商艾司摩爾（ASML）下跌6.5%。\n\n其他晶片製造商也同樣受挫，超微（AMD）與美光（Micron）跌幅均超過17%；英特爾（Intel）下跌10.3%；記憶卡製造商閃迪（Sandisk）更暴跌超過22%。\n\n追蹤30家大型半導體企業表現的費城半導體指數（Philadelphia Semiconductor Index）重挫超過12%。\n\n馬斯克（Elon Musk）旗下的SpaceX與特斯拉（Tesla）股價也大幅下跌，分別下跌8%和接近11%，單日合計蒸發超過3,000億美元市值。\n\n馬斯克先前曾投入近4.5億美元支持共和黨候選人，其中至少4,500萬美元協助肯·帕克斯頓（Ken Paxton）競選德州參議員席次，但德州最終仍在週二晚間出現所謂的「民主黨海嘯」，轉向支持民主黨。\n\n整體而言，包括蘋果（Apple）、輝達與特斯拉在內的所謂「科技七巨頭」（Magnificent Seven），單日市值合計蒸發約1兆美元。\n\n標普500指數（S&P 500）收盤下跌4.4%；道瓊工業平均指數（Dow Jones Industrial Average）則回吐週三所有漲幅，收跌超過3.4%。\n\n由於跌幅過大，納斯達克綜合指數（Nasdaq Composite）已進入市場人士所稱的「修正區間」（correction territory），即指數較近期高點回落至少10%。\n\n財富俱樂部（Wealth Club）首席投資策略師蘇珊娜·斯特里特（Susannah Streeter）表示，納斯達克與標普500的大幅下跌正向全球市場傳遞衝擊波。\n\n「市場原本就擔心投入AI基礎設施的龐大資金未必能帶來投資人期待的回報，如今又面臨數據中心建設可能大幅放緩的風險，兩種憂慮同時爆發。」\n\n盛寶銀行（Saxo）首席投資策略師查魯·查納納（Charu Chanana）則表示，未來數據中心審批將受到更嚴格檢視，而其對環境及電價的影響也可能拖延計畫進度並推高整體產業成本。\n\n她表示，兩大政黨都希望確保美國在科技領域維持領先，「但支持AI發展，與允許基礎設施不計代價、不受限制地擴張，是兩回事。」\n\nOpenAI總裁兼共同創辦人格雷格·布羅克曼（Greg Brockman）表示，他認為各界都對社會對數據中心的反應感到意外，而業界仍需做更多工作爭取地方社區支持。\n\n布羅克曼週三晚間在加州納帕（Napa）舉行的《華爾街日報》科技會議（WSJ Tech conference）上表示：「過去一年來，我們逐漸意識到，身在舊金山、卻想在德州、喬治亞州以及其他地方興建基礎設施時，不能只是在社群媒體上發文說『這會是件好事』。你必須真正走進那些社區。」\n\nMeta總裁黛娜·鮑威爾·麥考密克（Dina Powell McCormick）則表示，科技產業需要更努力向大眾說明AI的價值。\n\n除了期中選舉帶來的即時衝擊之外，也有愈來愈多投資人開始擔心，AI概念股可能已形成資產泡沫，而市場正迎來一次必要的修正。\n\n本文原以英文撰寫，我們使用了人工智能協助翻譯，並由BBC記者在發佈前進行審核。了解更多關於我們如何使用人工智能的資訊。", "link": "https://www.bbc.com/zhongwen/articles/cqlyeen0z8x2o/trad?at_medium=RSS&at_campaign=rss", "time": "11月06日 13:19", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "美國中期選舉結果對中國和世界各國意味着什麼？", "title_zh": "美國中期選舉結果對中國和世界各國意味着什麼？", "summary_orig": "民主黨在美國中期選舉中取得勝利，將在特朗普總統餘下的任期內掌控國會，標誌着美國政治格局出現重大變化。從烏克蘭和中東的衝突，到美國與中國的貿易關係，BBC記者分析這次選舉結果對世界其他地區意味着什麼。", "summary_zh": "民主黨在美國中期選舉中取得勝利，將在特朗普總統餘下的任期內掌控國會，標誌着美國政治格局出現重大變化。從烏克蘭和中東的衝突，到美國與中國的貿易關係，BBC記者分析這次選舉結果對世界其他地區意味着什麼。", "body_orig": "", "body_zh": "民主黨在美國中期選舉中同時贏得參議院和眾議院的控制權，將在特朗普總統餘下的任期內掌控國會。\n\n這場選舉令美國政治格局出現重大變化，對特朗普總統構成重大挫折。他承認，伊朗戰爭和生活成本上漲，是導致多名共和黨候選人落敗的原因。\n\n美國副總統萬斯（JD Vance）說：「我們輸掉選舉的原因就是這場（伊朗）戰爭。」\n\n從烏克蘭和中東的衝突，到美國與中國的貿易關係，BBC記者分析這次選舉結果對世界其他地區意味着什麼。\n\nBBC波斯語部駐倫敦資深記者哈比比亞扎德（Ghoncheh Habibiazad）\n\n伊朗最高領袖穆傑塔巴·哈梅內伊（Mojtaba Khamenei）表示，任何認為美國政治局勢的變化會令「美國對伊朗的敵意」有所改變的人，都是「大錯特錯」。\n\n這位最高領袖的父親阿里·哈梅內伊（Ali Khamenei）在2月28日美國與以色列的聯合空襲中喪生，其後由他接任。穆傑塔巴·哈梅內伊已經數月沒有公開露面。\n\n上述言論出自他周三發表的一份長達六頁的書面聲明，當天是1979年伊朗示威者佔領美國駐德黑蘭大使館事件的周年紀念日。\n\n理論上，這次「特朗普計劃」（Project Trump）遭遇選舉挫折，在其他時候可能會被視為對海灣阿拉伯國家的一次打擊。\n\n杜拜設有一座特朗普國際高爾夫球場，卡塔爾曾向特朗普贈送一架價值4億美元的飛機，而阿聯酋、卡塔爾和沙特阿拉伯亦合共向特朗普女婿賈里德·庫什納（Jared Kushner）的公司Affinity Capital投資數十億美元。\n\n沙特與特朗普的前任、民主黨籍總統拜登（Joe Biden）關係尤其緊張。還記得2022年拜登與沙特王儲那次尷尬的碰拳嗎？\n\n海灣國家領袖對奧巴馬（Barack Obama）前總統同樣有很大疑慮，因為他未有就敘利亞總統巴沙爾·阿薩德（Bashar al-Assad）使用毒氣一事採取懲罰行動。\n\n正如一名評論員所說：「特朗普總統把海灣地區點燃了。」他指的是2月28日爆發的戰爭。海灣國家至今仍然擔心，特朗普可能再次挑起戰火，導致伊朗報復，對這些國家的關鍵基礎設施造成毀滅性破壞。\n\n特朗普在2024年競逐第二個總統任期時，曾承諾將汽油價格降至每加侖2美元以下。但今年10月的平均價格為每加侖4.31美元。他亦曾承諾，如果重返白宮，就不會再有新的戰爭。\n\n然而，就在中期選舉前一天，美國再次對伊朗一座島嶼發動空襲。特朗普向記者表示，他對發動這場戰爭毫不後悔。\n\n但伊朗最高領袖穆傑塔巴·哈梅內伊在聲明中表示，他不認為選舉結果會令美國政策有所改變。\n\n特朗普今天接受BBC在美國的新聞合作夥伴哥倫比亞廣播公司新聞部（CBS News）訪問時表示，這場衝突將在「我說結束的時候」結束。\n\n北京與華盛頓之間的關係，是本世紀的大國競爭焦點。特朗普準備在本月稍後訪問中國，習近平即將接待他，或許會認為自己在這場角力中佔了上風。\n\n但習近平採取反制措施，同樣大幅提高關稅，令特朗普的計劃適得其反。結果是許多商品在美國的價格上漲，包括玩具和衣服等普通家庭偶爾購買、用來享受生活的小商品。\n\n這場貿易戰最終以雙方達成休戰協議告一段落，但協議將於明年1月底到期。中國可能認為，特朗普在中期選舉受挫後，正忙於應對敗選的打擊，並希望達成協議。\n\n俄羅斯總統普京（Vladimir Putin）的發言人佩斯科夫（Dmitry Peskov）向俄羅斯媒體表示：「我們衷心希望特朗普繼續推動和平的努力。」\n\n佩斯科夫接着說：「我們看到了梅拉尼婭·特朗普（Melania Trump）在人道主義和平工作上取得的成功。」\n\n他指的是近期在俄羅斯佔領的烏克蘭城鎮奧萊什基（Oleshky）進行的人道主義行動。\n\n但俄羅斯大概不會怪罪特朗普，因為克里姆林宮已在與特朗普的關係上投入大量心力，而且莫斯科顯然仍希望與特朗普政府發展經濟合作。\n\n對烏克蘭、伊朗和中東各地的民眾而言，美國中期選舉的焦點不僅是美國國內政治，更是選舉結果可能對持續中的衝突帶來什麼影響。\n\n在烏克蘭，評論人士聚焦於特朗普處理俄烏戰爭的方式。記者羅曼·岑巴柳克（Roman Tsymbalyuk）揶揄特朗普說，他「解決了所有戰爭，卻輸掉了自己的戰爭」，藉此諷刺特朗普多次聲稱自己結束了世界各地的衝突。\n\n隨着俄羅斯持續襲擊烏克蘭的能源基礎設施，基輔有些人希望民主黨在選舉中取得進展，能夠加強對莫斯科實施更嚴厲制裁的支持。\n\n在莫斯科，克里姆林宮公開表示，希望特朗普繼續致力斡旋結束戰爭，俄羅斯與烏克蘭預計本月會再舉行談判。\n\n不過，俄羅斯國內支持戰爭的人士警告，民主黨控制的國會，可能限制特朗普日後與克里姆林宮達成協議，或放寬對俄制裁的能力。\n\n與此同時，伊朗領導層及與政府有關聯的媒體，將民主黨在選舉中取得的進展，形容為美國民眾對特朗普戰爭政策的否定。\n\nBBC國際部伊莎貝爾·肖（Isabel Shaw）及安德魯·韋布（Andrew Webb）編輯。\n\n本文原以英文撰寫，我們使用了人工智能協助翻譯，並由BBC記者在發佈前進行審核。了解更多關於我們如何使用人工智能的資訊。", "body": "民主黨在美國中期選舉中同時贏得參議院和眾議院的控制權，將在特朗普總統餘下的任期內掌控國會。\n\n這場選舉令美國政治格局出現重大變化，對特朗普總統構成重大挫折。他承認，伊朗戰爭和生活成本上漲，是導致多名共和黨候選人落敗的原因。\n\n美國副總統萬斯（JD Vance）說：「我們輸掉選舉的原因就是這場（伊朗）戰爭。」\n\n從烏克蘭和中東的衝突，到美國與中國的貿易關係，BBC記者分析這次選舉結果對世界其他地區意味着什麼。\n\nBBC波斯語部駐倫敦資深記者哈比比亞扎德（Ghoncheh Habibiazad）\n\n伊朗最高領袖穆傑塔巴·哈梅內伊（Mojtaba Khamenei）表示，任何認為美國政治局勢的變化會令「美國對伊朗的敵意」有所改變的人，都是「大錯特錯」。\n\n這位最高領袖的父親阿里·哈梅內伊（Ali Khamenei）在2月28日美國與以色列的聯合空襲中喪生，其後由他接任。穆傑塔巴·哈梅內伊已經數月沒有公開露面。\n\n上述言論出自他周三發表的一份長達六頁的書面聲明，當天是1979年伊朗示威者佔領美國駐德黑蘭大使館事件的周年紀念日。\n\n理論上，這次「特朗普計劃」（Project Trump）遭遇選舉挫折，在其他時候可能會被視為對海灣阿拉伯國家的一次打擊。\n\n杜拜設有一座特朗普國際高爾夫球場，卡塔爾曾向特朗普贈送一架價值4億美元的飛機，而阿聯酋、卡塔爾和沙特阿拉伯亦合共向特朗普女婿賈里德·庫什納（Jared Kushner）的公司Affinity Capital投資數十億美元。\n\n沙特與特朗普的前任、民主黨籍總統拜登（Joe Biden）關係尤其緊張。還記得2022年拜登與沙特王儲那次尷尬的碰拳嗎？\n\n海灣國家領袖對奧巴馬（Barack Obama）前總統同樣有很大疑慮，因為他未有就敘利亞總統巴沙爾·阿薩德（Bashar al-Assad）使用毒氣一事採取懲罰行動。\n\n正如一名評論員所說：「特朗普總統把海灣地區點燃了。」他指的是2月28日爆發的戰爭。海灣國家至今仍然擔心，特朗普可能再次挑起戰火，導致伊朗報復，對這些國家的關鍵基礎設施造成毀滅性破壞。\n\n特朗普在2024年競逐第二個總統任期時，曾承諾將汽油價格降至每加侖2美元以下。但今年10月的平均價格為每加侖4.31美元。他亦曾承諾，如果重返白宮，就不會再有新的戰爭。\n\n然而，就在中期選舉前一天，美國再次對伊朗一座島嶼發動空襲。特朗普向記者表示，他對發動這場戰爭毫不後悔。\n\n但伊朗最高領袖穆傑塔巴·哈梅內伊在聲明中表示，他不認為選舉結果會令美國政策有所改變。\n\n特朗普今天接受BBC在美國的新聞合作夥伴哥倫比亞廣播公司新聞部（CBS News）訪問時表示，這場衝突將在「我說結束的時候」結束。\n\n北京與華盛頓之間的關係，是本世紀的大國競爭焦點。特朗普準備在本月稍後訪問中國，習近平即將接待他，或許會認為自己在這場角力中佔了上風。\n\n但習近平採取反制措施，同樣大幅提高關稅，令特朗普的計劃適得其反。結果是許多商品在美國的價格上漲，包括玩具和衣服等普通家庭偶爾購買、用來享受生活的小商品。\n\n這場貿易戰最終以雙方達成休戰協議告一段落，但協議將於明年1月底到期。中國可能認為，特朗普在中期選舉受挫後，正忙於應對敗選的打擊，並希望達成協議。\n\n俄羅斯總統普京（Vladimir Putin）的發言人佩斯科夫（Dmitry Peskov）向俄羅斯媒體表示：「我們衷心希望特朗普繼續推動和平的努力。」\n\n佩斯科夫接着說：「我們看到了梅拉尼婭·特朗普（Melania Trump）在人道主義和平工作上取得的成功。」\n\n他指的是近期在俄羅斯佔領的烏克蘭城鎮奧萊什基（Oleshky）進行的人道主義行動。\n\n但俄羅斯大概不會怪罪特朗普，因為克里姆林宮已在與特朗普的關係上投入大量心力，而且莫斯科顯然仍希望與特朗普政府發展經濟合作。\n\n對烏克蘭、伊朗和中東各地的民眾而言，美國中期選舉的焦點不僅是美國國內政治，更是選舉結果可能對持續中的衝突帶來什麼影響。\n\n在烏克蘭，評論人士聚焦於特朗普處理俄烏戰爭的方式。記者羅曼·岑巴柳克（Roman Tsymbalyuk）揶揄特朗普說，他「解決了所有戰爭，卻輸掉了自己的戰爭」，藉此諷刺特朗普多次聲稱自己結束了世界各地的衝突。\n\n隨着俄羅斯持續襲擊烏克蘭的能源基礎設施，基輔有些人希望民主黨在選舉中取得進展，能夠加強對莫斯科實施更嚴厲制裁的支持。\n\n在莫斯科，克里姆林宮公開表示，希望特朗普繼續致力斡旋結束戰爭，俄羅斯與烏克蘭預計本月會再舉行談判。\n\n不過，俄羅斯國內支持戰爭的人士警告，民主黨控制的國會，可能限制特朗普日後與克里姆林宮達成協議，或放寬對俄制裁的能力。\n\n與此同時，伊朗領導層及與政府有關聯的媒體，將民主黨在選舉中取得的進展，形容為美國民眾對特朗普戰爭政策的否定。\n\nBBC國際部伊莎貝爾·肖（Isabel Shaw）及安德魯·韋布（Andrew Webb）編輯。\n\n本文原以英文撰寫，我們使用了人工智能協助翻譯，並由BBC記者在發佈前進行審核。了解更多關於我們如何使用人工智能的資訊。", "link": "https://www.bbc.com/zhongwen/articles/ckreyrxvg3xyo/trad?at_medium=RSS&at_campaign=rss", "time": "11月05日 05:02", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "「這是一場災難」：中期選舉慘敗，共和黨內怒火指向特朗普", "title_zh": "「這是一場災難」：中期選舉慘敗，共和黨內怒火指向特朗普", "summary_orig": "一些共和黨人告訴BBC，特朗普只顧自己的政治遺產，漠視選民關注的問題，令共和黨付出了代價。", "summary_zh": "一些共和黨人告訴BBC，特朗普只顧自己的政治遺產，漠視選民關注的問題，令共和黨付出了代價。", "body_orig": "", "body_zh": "美國共和黨內部中期選舉令人震驚的結果，最初感到錯愕，但這種情緒很快便轉化為對美國總統特朗普（Donald Trump）的憤怒。\n\n民主黨在德克薩斯州、堪薩斯州和南卡羅來納州等共和黨傳統票倉接連爆冷勝出後，一些共和黨人將矛頭指向特朗普，認為他只顧自己的政治遺產，對選民關注的問題漠不關心，導致共和黨失去國會控制權。\n\n德克薩斯州共和黨資深說客比爾·米勒（Bill Miller）告訴BBC：「責任在他，不在其他任何人身上。這是對特朗普總統徹底而全面的否定。」\n\n大多數共和黨人原本已預期會失去眾議院控制權，也清楚知道，在這個有利於在野黨的艱難選舉周期中，要保住參議院控制權並不容易。\n\n然而，一些共和黨人在接受訪問時表示，特朗普不受歡迎的政策、低迷的施政支持率，以及他對華盛頓建築工程的沉迷，拖累了共和黨的選情。\n\n明尼蘇達州共和黨策略師格雷格·佩平（Gregg Peppin）說：「他犯了一個又一個錯誤。很明顯，在一個又一個州，民眾都不喜歡總統的政策。」\n\n一名白宮盟友表示，公眾對特朗普在伊朗戰爭、關稅，以及政府打擊移民行動方面的不滿，在11月形成了一場「完美風暴」。\n\n此人表示：「黨內對整件事的發展明顯感到沮喪」，而且大部分不滿都指向特朗普。黨內對特朗普的憤怒情緒「極為強烈」。\n\nBBC訪問了十多名共和黨黨務人員、競選團隊官員、白宮盟友及其他相關人士，其中許多人要求不具名，以便坦率評價特朗普在中期選舉中的策略。\n\n對特朗普和共和黨而言，周二晚間的選舉結果事關重大。如果總統所屬政黨的表現較佳，就像2022年中期選舉那樣，當時總統拜登（Joe Biden）領導的民主黨在眾議院僅失去九個議席，並在參議院增加一席，便能為共和黨迎接2028年選舉增添動力。\n\n然而，特朗普現在將要面對由民主黨控制的國會。民主黨議員士氣高昂，急於調查特朗普政府、阻止他的司法官員提名，以及妨礙他推行餘下的施政議程。\n\n這次中期選舉令特朗普的第二個總統任期進入充滿不確定性的新階段，也可能迫使共和黨開始正視特朗普時代結束後的未來。\n\n愛荷華州共和黨全國委員會委員史蒂夫·謝弗勒（Steve Scheffler）在選舉前夕表示：「我不認為他的影響力正在減弱。」但他也說，就中期選舉而言，「有些話你會希望他換一種方式說」。\n\n特朗普在選舉當晚大部分時間保持沉默，直到民主黨被確定贏得參眾兩院控制權後，才在其社交平台Truth Social發文。\n\n特朗普寫道：「我的名字不在選票上，如果我有參選，我們一定會以壓倒性優勢獲勝！感謝各位關注此事。」\n\n特朗普告訴霍士新聞，他對選舉結果感到「有點意外」，但指出總統所屬政黨通常在中期選舉中表現不佳。\n\n雖然民主黨在2026年的斬獲未有打破紀錄，但該黨確實贏得數十場眾議院、州長及參議院選舉，包括一些民主黨數十年來一直缺乏競爭力的州份。\n\n在周二之前，民主黨自1932年以來從未在堪薩斯州贏得參議院議席，在德克薩斯州也已超過30年未曾贏得全州性選舉。\n\n民主黨亦在南卡羅來納州等長期支持共和黨的州份意外勝出。就在投票日前幾個星期，這些議席仍被視為共和黨的安全席位。\n\n特朗普和副總統萬斯（JD Vance）在中期選舉前舉行了數十場競選集會。支持特朗普的主要超級政治行動委員會「讓美國再次偉大」（MAGA Inc.）亦花費數億美元支持共和黨候選人。\n\n他們指出歷屆中期選舉的歷史趨勢，並表示共和黨在佐治亞州、密歇根州和德克薩斯州等關鍵搖擺州，都受到實力較弱的候選人拖累。\n\n另一名要求匿名的德克薩斯州共和黨黨務人員表示，該州共和黨參議院候選人肯·帕克斯頓（Ken Paxton）打了一場「全國最差的參議院選戰，無論是共和黨還是民主黨都無出其右」。\n\n他補充說，擊敗帕克斯頓的民主黨對手詹姆斯·塔拉里科（James Talarico）則打了一場「非常出色、策略精明的選戰」。\n\n其他人則為特朗普秋季的競選行程辯護，指出他必須在治理國家的本職工作與到各地拉票之間取得平衡。\n\n密歇根州共和黨青年組織主席克里什·馬特拉尼（Krish Mathrani）說：「他是總統，不可能每周七天、每天24小時都在競選。」\n\n馬特拉尼表示，特朗普的競選集會有助提高共和黨選民的熱情，「特朗普總統是一部催票機器。」\n\n但在特朗普本人沒有參選的選舉中，他引以為傲的催票機制一直未能發揮同樣的作用，2026年也不例外。\n\n特朗普聲稱，在他的領導下，美國經濟有所改善，而且他正在實現伊朗戰爭的目標，但選民並不買帳。\n\n特朗普試圖將民主黨描繪成極端社會主義者的策略也未能奏效。選民讓北卡羅來納州的羅伊·庫珀（Roy Cooper）等溫和派民主黨人勝出。\n\n庫珀競選團隊一名官員說：「這一招對庫珀根本沒用。試圖把他標籤為某種社會主義自由派，根本行不通。」\n\n在夏季，特朗普還是經常看起來對中期選舉興趣不大，而當時國會共和黨人的注意力已開始轉向選舉。\n\n這些工程包括正在興建的白宮宴會廳、白宮南草坪的直升機停機坪、當地一座高爾夫球場的翻新工程、擬在阿靈頓國家公墓附近興建的紀念拱門，以及甘迺迪中心的翻新工程。\n\n多名消息人士表示，特朗普在6月迎來80歲生日時，白宮舉辦終極格鬥冠軍賽（UFC）賽事等活動，令人覺得總統更熱衷於慶祝自己，而非贏得中期選舉。\n\n特朗普也多次淡化汽油價格上漲的問題，並經常將民眾對生活負擔能力的憂慮說成是民主黨編造的騙局。\n\n舉辦這場大會本身就是一場賭博。共和黨已有數十年未曾在中期選舉前舉行全國代表大會，而選民是否會收看，當時仍是未知之數。\n\n特朗普成為達拉斯大會的絕對主角，令一些共和黨人感到不滿。他們告訴BBC，原本希望大會能讓共和黨的中期選舉候選人獲得更多曝光。\n\n特朗普在冗長而漫無邊際的主題演說中承諾，向所有投票支持共和黨的人發放5000美元（3700英鎊）。\n\n他還公開支持帕克斯頓，但在表態支持時，卻花了很長篇幅批評這名候選人缺乏個人魅力，甚至評論他的外貌，令人側目。\n\n德克薩斯州共和黨全國委員會委員羅賓·阿姆斯特朗（Robin Armstrong）談到特朗普對帕克斯頓的批評時說：「很明顯，這種話從來都沒有幫助。」\n\n德克薩斯州民主黨執行主任特里·伯克（Terri Burke）說：「這場大會反而令共和黨弄巧反拙，因為根本沒有人關注。」\n\n他因讚揚俄亥俄州共和黨參議員約翰·赫斯特德的體格而登上新聞頭條，又因在密歇根州參議院選戰中稱阿卜杜勒·賽義德（Abdul El-Sayed）為「聖戰分子」而受到批評。\n\n凱蒂·扎卡里亞（Katie Zacharia）出任白宮新聞秘書僅五天便遭撤換；金伯利·吉爾福伊爾（Kimberly Guilfoyle）則在被揭發曾要求一名捐款人代她償還信用卡債務後，辭去美國駐希臘大使職務。\n\n這項協議令國會議員措手不及，並受到部分共和黨人譴責。就在協議達成前幾個星期，特朗普才簽署一項旨在切斷俄羅斯石油及天然氣收入的制裁法案。\n\n另一名白宮盟友表示，即使共和黨敗局逐漸明朗，總統的政治幕僚直到投票前最後幾天，仍然表現得十分樂觀。\n\n愛荷華州共和黨全國委員會委員謝弗勒說：「無論是萬斯、馬爾科·魯比奧（Marco Rubio），還是特德·克魯茲（Ted Cruz），我們都有相當龐大的人才陣容。」", "body": "美國共和黨內部中期選舉令人震驚的結果，最初感到錯愕，但這種情緒很快便轉化為對美國總統特朗普（Donald Trump）的憤怒。\n\n民主黨在德克薩斯州、堪薩斯州和南卡羅來納州等共和黨傳統票倉接連爆冷勝出後，一些共和黨人將矛頭指向特朗普，認為他只顧自己的政治遺產，對選民關注的問題漠不關心，導致共和黨失去國會控制權。\n\n德克薩斯州共和黨資深說客比爾·米勒（Bill Miller）告訴BBC：「責任在他，不在其他任何人身上。這是對特朗普總統徹底而全面的否定。」\n\n大多數共和黨人原本已預期會失去眾議院控制權，也清楚知道，在這個有利於在野黨的艱難選舉周期中，要保住參議院控制權並不容易。\n\n然而，一些共和黨人在接受訪問時表示，特朗普不受歡迎的政策、低迷的施政支持率，以及他對華盛頓建築工程的沉迷，拖累了共和黨的選情。\n\n明尼蘇達州共和黨策略師格雷格·佩平（Gregg Peppin）說：「他犯了一個又一個錯誤。很明顯，在一個又一個州，民眾都不喜歡總統的政策。」\n\n一名白宮盟友表示，公眾對特朗普在伊朗戰爭、關稅，以及政府打擊移民行動方面的不滿，在11月形成了一場「完美風暴」。\n\n此人表示：「黨內對整件事的發展明顯感到沮喪」，而且大部分不滿都指向特朗普。黨內對特朗普的憤怒情緒「極為強烈」。\n\nBBC訪問了十多名共和黨黨務人員、競選團隊官員、白宮盟友及其他相關人士，其中許多人要求不具名，以便坦率評價特朗普在中期選舉中的策略。\n\n對特朗普和共和黨而言，周二晚間的選舉結果事關重大。如果總統所屬政黨的表現較佳，就像2022年中期選舉那樣，當時總統拜登（Joe Biden）領導的民主黨在眾議院僅失去九個議席，並在參議院增加一席，便能為共和黨迎接2028年選舉增添動力。\n\n然而，特朗普現在將要面對由民主黨控制的國會。民主黨議員士氣高昂，急於調查特朗普政府、阻止他的司法官員提名，以及妨礙他推行餘下的施政議程。\n\n這次中期選舉令特朗普的第二個總統任期進入充滿不確定性的新階段，也可能迫使共和黨開始正視特朗普時代結束後的未來。\n\n愛荷華州共和黨全國委員會委員史蒂夫·謝弗勒（Steve Scheffler）在選舉前夕表示：「我不認為他的影響力正在減弱。」但他也說，就中期選舉而言，「有些話你會希望他換一種方式說」。\n\n特朗普在選舉當晚大部分時間保持沉默，直到民主黨被確定贏得參眾兩院控制權後，才在其社交平台Truth Social發文。\n\n特朗普寫道：「我的名字不在選票上，如果我有參選，我們一定會以壓倒性優勢獲勝！感謝各位關注此事。」\n\n特朗普告訴霍士新聞，他對選舉結果感到「有點意外」，但指出總統所屬政黨通常在中期選舉中表現不佳。\n\n雖然民主黨在2026年的斬獲未有打破紀錄，但該黨確實贏得數十場眾議院、州長及參議院選舉，包括一些民主黨數十年來一直缺乏競爭力的州份。\n\n在周二之前，民主黨自1932年以來從未在堪薩斯州贏得參議院議席，在德克薩斯州也已超過30年未曾贏得全州性選舉。\n\n民主黨亦在南卡羅來納州等長期支持共和黨的州份意外勝出。就在投票日前幾個星期，這些議席仍被視為共和黨的安全席位。\n\n特朗普和副總統萬斯（JD Vance）在中期選舉前舉行了數十場競選集會。支持特朗普的主要超級政治行動委員會「讓美國再次偉大」（MAGA Inc.）亦花費數億美元支持共和黨候選人。\n\n他們指出歷屆中期選舉的歷史趨勢，並表示共和黨在佐治亞州、密歇根州和德克薩斯州等關鍵搖擺州，都受到實力較弱的候選人拖累。\n\n另一名要求匿名的德克薩斯州共和黨黨務人員表示，該州共和黨參議院候選人肯·帕克斯頓（Ken Paxton）打了一場「全國最差的參議院選戰，無論是共和黨還是民主黨都無出其右」。\n\n他補充說，擊敗帕克斯頓的民主黨對手詹姆斯·塔拉里科（James Talarico）則打了一場「非常出色、策略精明的選戰」。\n\n其他人則為特朗普秋季的競選行程辯護，指出他必須在治理國家的本職工作與到各地拉票之間取得平衡。\n\n密歇根州共和黨青年組織主席克里什·馬特拉尼（Krish Mathrani）說：「他是總統，不可能每周七天、每天24小時都在競選。」\n\n馬特拉尼表示，特朗普的競選集會有助提高共和黨選民的熱情，「特朗普總統是一部催票機器。」\n\n但在特朗普本人沒有參選的選舉中，他引以為傲的催票機制一直未能發揮同樣的作用，2026年也不例外。\n\n特朗普聲稱，在他的領導下，美國經濟有所改善，而且他正在實現伊朗戰爭的目標，但選民並不買帳。\n\n特朗普試圖將民主黨描繪成極端社會主義者的策略也未能奏效。選民讓北卡羅來納州的羅伊·庫珀（Roy Cooper）等溫和派民主黨人勝出。\n\n庫珀競選團隊一名官員說：「這一招對庫珀根本沒用。試圖把他標籤為某種社會主義自由派，根本行不通。」\n\n在夏季，特朗普還是經常看起來對中期選舉興趣不大，而當時國會共和黨人的注意力已開始轉向選舉。\n\n這些工程包括正在興建的白宮宴會廳、白宮南草坪的直升機停機坪、當地一座高爾夫球場的翻新工程、擬在阿靈頓國家公墓附近興建的紀念拱門，以及甘迺迪中心的翻新工程。\n\n多名消息人士表示，特朗普在6月迎來80歲生日時，白宮舉辦終極格鬥冠軍賽（UFC）賽事等活動，令人覺得總統更熱衷於慶祝自己，而非贏得中期選舉。\n\n特朗普也多次淡化汽油價格上漲的問題，並經常將民眾對生活負擔能力的憂慮說成是民主黨編造的騙局。\n\n舉辦這場大會本身就是一場賭博。共和黨已有數十年未曾在中期選舉前舉行全國代表大會，而選民是否會收看，當時仍是未知之數。\n\n特朗普成為達拉斯大會的絕對主角，令一些共和黨人感到不滿。他們告訴BBC，原本希望大會能讓共和黨的中期選舉候選人獲得更多曝光。\n\n特朗普在冗長而漫無邊際的主題演說中承諾，向所有投票支持共和黨的人發放5000美元（3700英鎊）。\n\n他還公開支持帕克斯頓，但在表態支持時，卻花了很長篇幅批評這名候選人缺乏個人魅力，甚至評論他的外貌，令人側目。\n\n德克薩斯州共和黨全國委員會委員羅賓·阿姆斯特朗（Robin Armstrong）談到特朗普對帕克斯頓的批評時說：「很明顯，這種話從來都沒有幫助。」\n\n德克薩斯州民主黨執行主任特里·伯克（Terri Burke）說：「這場大會反而令共和黨弄巧反拙，因為根本沒有人關注。」\n\n他因讚揚俄亥俄州共和黨參議員約翰·赫斯特德的體格而登上新聞頭條，又因在密歇根州參議院選戰中稱阿卜杜勒·賽義德（Abdul El-Sayed）為「聖戰分子」而受到批評。\n\n凱蒂·扎卡里亞（Katie Zacharia）出任白宮新聞秘書僅五天便遭撤換；金伯利·吉爾福伊爾（Kimberly Guilfoyle）則在被揭發曾要求一名捐款人代她償還信用卡債務後，辭去美國駐希臘大使職務。\n\n這項協議令國會議員措手不及，並受到部分共和黨人譴責。就在協議達成前幾個星期，特朗普才簽署一項旨在切斷俄羅斯石油及天然氣收入的制裁法案。\n\n另一名白宮盟友表示，即使共和黨敗局逐漸明朗，總統的政治幕僚直到投票前最後幾天，仍然表現得十分樂觀。\n\n愛荷華州共和黨全國委員會委員謝弗勒說：「無論是萬斯、馬爾科·魯比奧（Marco Rubio），還是特德·克魯茲（Ted Cruz），我們都有相當龐大的人才陣容。」", "link": "https://www.bbc.com/zhongwen/articles/cw5ynld35e3ro/trad?at_medium=RSS&at_campaign=rss", "time": "11月05日 10:36", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}]}, {"key": "dw_cn", "name": "德国之声中文", "lang": "中文", "tab_note": "本页嵌免费全文（本轮亲测多篇可完整阅读）", "free_mark": "full_verified", "error": null, "items": [{"title_orig": "俄军导弹再袭基辅 乌总统和市长打嘴仗", "title_zh": "俄军导弹再袭基辅 乌总统和市长打嘴仗", "summary_orig": "即将入冬的乌克兰再遭俄军导弹空袭，而此次攻击的目标则以供电、供水设施为主。11月6日晚间、7日凌晨，乌克兰多地发生停电。与此同时，首都基辅市长克利奇科和总统泽连斯基在城市防御问题上发生分歧。", "summary_zh": "即将入冬的乌克兰再遭俄军导弹空袭，而此次攻击的目标则以供电、供水设施为主。11月6日晚间、7日凌晨，乌克兰多地发生停电。与此同时，首都基辅市长克利奇科和总统泽连斯基在城市防御问题上发生分歧。", "body_orig": "", "body_zh": "（德国之声中文网）乌克兰各地的气温正在持续下降，俄军也趁此再次对乌克兰的能源基础设施发动大规模打击。11月6日晚间、7日凌晨乌克兰首都基辅市中心及其周边地区多次传出爆炸声。\n\n基辅市长克利奇科(Vitali Klitschko)在Telegram上表示，此次袭击使用了高超音速弹道导弹，防空系统极难将其拦截。袭击造成多栋住宅楼受损。军政管理当局还报告称，一间幼儿园在袭击中受损，另有两人受伤。\n\n克利奇科表示，基辅目前的电力供应状况“极其困难”。此外，供水和集中供暖服务也受到了袭击的影响。一座横跨第聂伯河、连接基辅东西两岸的关键桥梁也遭到破坏。据克利奇科称，共有五人受伤。\n\n在此之前，乌克兰总统泽连斯基曾录制视频，警告俄罗斯可能再次针对能源基础设施及横跨第聂伯河的桥梁发动袭击。在基辅等地大范围停电后，泽连斯基11月7日再次批评了克利奇科，称：“这是因为市政层面未能落实相关决策，导致未能做好准备应对供暖季、应对俄罗斯袭击能源设施。”\n\n克利奇科则在Telegram上反唇相讥：“首都究竟该如何阻止这场‘俄罗斯针对乌克兰能源部门的特别行动’？”他指出，基辅自10月16日起就已经开始提供集中供暖。\n\n除了基辅，乌克兰其他地区的电网也遭到了严重破坏。泽连斯基将此次针对能源基础设施的袭击描述为一场“混合型”攻击，其中包括36枚导弹和170多架无人机。\n\n此外，在乌克兰南部村庄科米舒瓦哈(Komyschuwacha)，一处援助物资分发点遭到俄军空袭，导致55人丧生。\n\n乌克兰、俄罗斯和美国计划于下周在阿拉伯联合酋长国举行磋商——这是各方在相当长一段时间以来的首场此类谈判。据俄罗斯国际文传电讯社报道，俄方计划派遣一个由外交官和军方官员组成的高级别代表团，其中俄罗斯副外长里亚布科夫(Sergei Ryabkov)将首次加入谈判团队。\n\n不过，德国国防部长皮斯托里乌斯(Boris Pistorius)认为，近期实现停火的希望十分渺茫。他在11月7日接受德国丰克媒体集团采访时表示，局势能否出现转机，取决于俄罗斯总统普京以及美国总统特朗普的行动。“过去几个月的情况表明，特朗普采取的方式很难迅速促成停火，更不用说实现和平了。”\n\n就在两天前，美国总统特朗普刚刚声称，一项旨在结束俄乌战争的“极为重大”协议正在酝酿之中，该协议涉及俄罗斯。此前，特朗普在白宫与俄罗斯总统特使季米特里耶夫(Kirill Dmitriev)进行了一次计划外会晤。“这将是一项非常重大的协议。它所涉及的范围将不仅限于乌克兰——甚至可以说，它可能涉及整个欧洲。”特朗普还强调，结束这场战争可能需要“整个欧洲”的参与。\n\n乌克兰总统泽连斯基则在接受美国CNN电视台采访时，就特朗普政府提议的所谓“新欧洲安全秩序构想”进行了警告。“坦白说，这绝非易事，甚至可能暗藏危险。……如果他们不谈论如何结束战争，那是非常危险的。俄罗斯却想直接从构建欧洲新安全架构谈起。”泽连斯基还强调，反对大国以牺牲欧盟、北约及其国家自身利益为代价达成任何协议。他表示：“我们都生活在欧洲。我们不希望再现‘雅尔塔’。”二战末期，苏联、美国、英国在克里米亚半岛的雅尔塔举行峰会，划分了在战后欧洲的势力范围。\n\n美国总统特朗普、俄罗斯总统普京、中国国家主席习近平很有可能在11月中旬的深圳APEC峰会以及明年初的佛罗里达G20峰会上举行三方会晤。\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "body": "（德国之声中文网）乌克兰各地的气温正在持续下降，俄军也趁此再次对乌克兰的能源基础设施发动大规模打击。11月6日晚间、7日凌晨乌克兰首都基辅市中心及其周边地区多次传出爆炸声。\n\n基辅市长克利奇科(Vitali Klitschko)在Telegram上表示，此次袭击使用了高超音速弹道导弹，防空系统极难将其拦截。袭击造成多栋住宅楼受损。军政管理当局还报告称，一间幼儿园在袭击中受损，另有两人受伤。\n\n克利奇科表示，基辅目前的电力供应状况“极其困难”。此外，供水和集中供暖服务也受到了袭击的影响。一座横跨第聂伯河、连接基辅东西两岸的关键桥梁也遭到破坏。据克利奇科称，共有五人受伤。\n\n在此之前，乌克兰总统泽连斯基曾录制视频，警告俄罗斯可能再次针对能源基础设施及横跨第聂伯河的桥梁发动袭击。在基辅等地大范围停电后，泽连斯基11月7日再次批评了克利奇科，称：“这是因为市政层面未能落实相关决策，导致未能做好准备应对供暖季、应对俄罗斯袭击能源设施。”\n\n克利奇科则在Telegram上反唇相讥：“首都究竟该如何阻止这场‘俄罗斯针对乌克兰能源部门的特别行动’？”他指出，基辅自10月16日起就已经开始提供集中供暖。\n\n除了基辅，乌克兰其他地区的电网也遭到了严重破坏。泽连斯基将此次针对能源基础设施的袭击描述为一场“混合型”攻击，其中包括36枚导弹和170多架无人机。\n\n此外，在乌克兰南部村庄科米舒瓦哈(Komyschuwacha)，一处援助物资分发点遭到俄军空袭，导致55人丧生。\n\n乌克兰、俄罗斯和美国计划于下周在阿拉伯联合酋长国举行磋商——这是各方在相当长一段时间以来的首场此类谈判。据俄罗斯国际文传电讯社报道，俄方计划派遣一个由外交官和军方官员组成的高级别代表团，其中俄罗斯副外长里亚布科夫(Sergei Ryabkov)将首次加入谈判团队。\n\n不过，德国国防部长皮斯托里乌斯(Boris Pistorius)认为，近期实现停火的希望十分渺茫。他在11月7日接受德国丰克媒体集团采访时表示，局势能否出现转机，取决于俄罗斯总统普京以及美国总统特朗普的行动。“过去几个月的情况表明，特朗普采取的方式很难迅速促成停火，更不用说实现和平了。”\n\n就在两天前，美国总统特朗普刚刚声称，一项旨在结束俄乌战争的“极为重大”协议正在酝酿之中，该协议涉及俄罗斯。此前，特朗普在白宫与俄罗斯总统特使季米特里耶夫(Kirill Dmitriev)进行了一次计划外会晤。“这将是一项非常重大的协议。它所涉及的范围将不仅限于乌克兰——甚至可以说，它可能涉及整个欧洲。”特朗普还强调，结束这场战争可能需要“整个欧洲”的参与。\n\n乌克兰总统泽连斯基则在接受美国CNN电视台采访时，就特朗普政府提议的所谓“新欧洲安全秩序构想”进行了警告。“坦白说，这绝非易事，甚至可能暗藏危险。……如果他们不谈论如何结束战争，那是非常危险的。俄罗斯却想直接从构建欧洲新安全架构谈起。”泽连斯基还强调，反对大国以牺牲欧盟、北约及其国家自身利益为代价达成任何协议。他表示：“我们都生活在欧洲。我们不希望再现‘雅尔塔’。”二战末期，苏联、美国、英国在克里米亚半岛的雅尔塔举行峰会，划分了在战后欧洲的势力范围。\n\n美国总统特朗普、俄罗斯总统普京、中国国家主席习近平很有可能在11月中旬的深圳APEC峰会以及明年初的佛罗里达G20峰会上举行三方会晤。\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "link": "https://www.dw.com/zh/俄军导弹再袭基辅-乌总统和市长打嘴仗/a-79885814?maca=chi-rss-chi-all-1127-xml-mrss", "time": "11月07日 22:56", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "中期选举惨败后首次人事调整：特朗普换掉白宫幕僚长", "title_zh": "中期选举惨败后首次人事调整：特朗普换掉白宫幕僚长", "summary_orig": "共和党在中期选举中遭遇重挫后，特朗普撤换白宫幕僚长怀尔斯，由副幕僚长米勒接任。米勒是特朗普强硬移民政策的主要推手，被民主党人斥为“极端分子”。这一任命表明MAGA阵营仍主导白宫，美国政坛将迎来更多对抗。", "summary_zh": "共和党在中期选举中遭遇重挫后，特朗普撤换白宫幕僚长怀尔斯，由副幕僚长米勒接任。米勒是特朗普强硬移民政策的主要推手，被民主党人斥为“极端分子”。这一任命表明MAGA阵营仍主导白宫，美国政坛将迎来更多对抗。", "body_orig": "", "body_zh": "（德国之声中文网）美国共和党在国会中期选举中惨败后，特朗普总统作出首个人事调整：撤换白宫幕僚长怀尔斯（Susie Wiles），由副幕僚长米勒（Stephen Miller）接任。\n\n特朗普感谢现年69岁的怀尔斯所做的“出色工作”。选举前，他曾多次强调绝不可能撤换怀尔斯，如今则表示，人生中有时必须“采取步骤”。怀尔斯是美国历史上首位女性白宫幕僚长。\n\n特朗普称米勒是他“最值得信赖的顾问”之一，是“了不起的斗士”，而且“非常忠诚”。现年41岁的米勒自2016年特朗普首次竞选总统起就为其效力，曾为他撰写演讲稿，主要在移民政策上为他出谋划策。\n\n米勒是特朗普政府强硬移民政策和大规模驱逐行动的主要设计者之一。2026年初，明尼阿波利斯发生联邦移民执法人员枪杀美国公民事件，引发广泛争议。\n\n这一任命意味着，特朗普与在中期选举中获胜的民主党走向对抗。众议院民主党领袖杰弗里斯（Hakeem Jeffries）称，米勒是“危险的排外者和鲁莽的极端分子，双手沾满美国人的鲜血”。此前担任参议院少数党领袖的民主党人舒默则称，米勒是“本届政府最野蛮、最不人道政策的设计者”，并表示民主党将“在每一步上与他对抗”。\n\n怀尔斯是特朗普政府中期选举策略的主要负责人。在她的推动下，80岁的特朗普在选前一个月内赴20个州出席了30场活动，但收效甚微。部分共和党候选人甚至刻意与日益不受选民欢迎的特朗普保持距离。\n\n起用米勒表明，“让美国再次伟大”（MAGA）极端保守派阵营在中期选举后仍然主导白宫，特朗普和民主党执掌的国会将面临一段充满对抗的时期。", "body": "（德国之声中文网）美国共和党在国会中期选举中惨败后，特朗普总统作出首个人事调整：撤换白宫幕僚长怀尔斯（Susie Wiles），由副幕僚长米勒（Stephen Miller）接任。\n\n特朗普感谢现年69岁的怀尔斯所做的“出色工作”。选举前，他曾多次强调绝不可能撤换怀尔斯，如今则表示，人生中有时必须“采取步骤”。怀尔斯是美国历史上首位女性白宫幕僚长。\n\n特朗普称米勒是他“最值得信赖的顾问”之一，是“了不起的斗士”，而且“非常忠诚”。现年41岁的米勒自2016年特朗普首次竞选总统起就为其效力，曾为他撰写演讲稿，主要在移民政策上为他出谋划策。\n\n米勒是特朗普政府强硬移民政策和大规模驱逐行动的主要设计者之一。2026年初，明尼阿波利斯发生联邦移民执法人员枪杀美国公民事件，引发广泛争议。\n\n这一任命意味着，特朗普与在中期选举中获胜的民主党走向对抗。众议院民主党领袖杰弗里斯（Hakeem Jeffries）称，米勒是“危险的排外者和鲁莽的极端分子，双手沾满美国人的鲜血”。此前担任参议院少数党领袖的民主党人舒默则称，米勒是“本届政府最野蛮、最不人道政策的设计者”，并表示民主党将“在每一步上与他对抗”。\n\n怀尔斯是特朗普政府中期选举策略的主要负责人。在她的推动下，80岁的特朗普在选前一个月内赴20个州出席了30场活动，但收效甚微。部分共和党候选人甚至刻意与日益不受选民欢迎的特朗普保持距离。\n\n起用米勒表明，“让美国再次伟大”（MAGA）极端保守派阵营在中期选举后仍然主导白宫，特朗普和民主党执掌的国会将面临一段充满对抗的时期。", "link": "https://www.dw.com/zh/中期选举惨败后首次人事调整：特朗普换掉白宫幕僚长/a-79884880?maca=chi-rss-chi-all-1127-xml-mrss", "time": "11月07日 20:37", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "反AI浪潮让黄仁勋祸不单行？股票暴跌 被国会传唤", "title_zh": "反AI浪潮让黄仁勋祸不单行？股票暴跌 被国会传唤", "summary_orig": "随着民主党在中期选举后全面执掌美国国会参众两院，原先与特朗普关系密切的AI科技大佬正面临全新挑战。民主党此次胜选与选民对AI产业的反感有很大关联。金融市场担心，新一届国会将全面限制AI产业发展。与此同时，英伟达老总黄仁勋还面临间谍案传唤。", "summary_zh": "随着民主党在中期选举后全面执掌美国国会参众两院，原先与特朗普关系密切的AI科技大佬正面临全新挑战。民主党此次胜选与选民对AI产业的反感有很大关联。金融市场担心，新一届国会将全面限制AI产业发展。与此同时，英伟达老总黄仁勋还面临间谍案传唤。", "body_orig": "", "body_zh": "（德国之声中文网）美国能源部表示，原定于11月6日举行的白宫“总统科学与技术顾问委员会”会议暂时取消。该委员会包括英伟达首席执行官黄仁勋、META首席执行官扎克伯格(Mark Zuckerberg)、AMD首席执行官苏姿丰以及其他一些科技企业的高管。美国能源部网站曾短暂地将11月13日列为会议的新日期，但随后又发送了一封邮件，宣布这条通知作废。\n\n根据原本的会议通知，该委员会应为特朗普最新成立的人工智能工作小组（即“超级智能特别工作组”）提供咨询。后者囊括了多名内阁官员、白宫幕僚以及其他一些特朗普总统任命的人员。“超级智能”（Super Intelligence）是特朗普总统对人工智能所偏好的称呼。白宫没有披露此次会议为何取消或者推迟。\n\n就在前一天(11月5日)，科技股遭遇大幅抛售。金融市场日益担心由民主党掌控的新一届国会可能会放缓人工智能（AI）的发展，同时也担心在构建AI基础设施方面投入的巨额资本支出可能无法带来足够的回报。这种市场动荡促使硅谷高管和华盛顿的决策者们加强了对该行业的审视。\n\n过去两年来，许多硅谷的科技界大佬都努力拉拢和特朗普总统的关系。而随着本周共和党在美国国会中期选举里惨败，这些硅谷大佬正面临民主党执掌的国会所发出的传票威胁。在此次选举中，选民对人工智能以及相关的数据中心建设之反感情绪很大程度上影响了投票倾向。\n\n目前，国会进步党团(Congressional Progressive Caucus)主席卡萨尔(Greg Casar)已经表示：“应当传唤人工智能公司的首席执行官们，要求他们在宣誓后作证。”民主党参议员马基(Ed Markey)则向科技高管们发出警告称，鉴于国会即将发出大量传票，他们恐怕得“多植些树，好为印制这些传票提供纸张”。 新当选的密歇根州民主党籍参议员赛义德(Abdul El-Sayed)更是提出激进主张，要对最强大的人工智能研发实施“全面暂停”，还呼吁美中两国签署条约，以“暂停并禁止超级智能”，也就是超越人类智能的人工智能。\n\n随着新当选议员明年1月3日正式到任，民主党将全面掌控参众两院，届时将可以通过各个委员会强制手段要求企业高管作证或提交内部文件，否则将面临起诉风险。\n\n根据美国全国广播公司NBC的出口民调，此次选举中，56%的选民都认为，人工智能和数据中心问题是他们做出投票选择时的“关键或主要考量因素”。由多家大型科技公司资助、具有影响力的中间派联盟“进步商会”（Chamber of Progress）首席执行官科瓦切维奇（Adam Kovacevich）说，“我们不应将‘反特朗普浪潮’与‘反对科技行业的民意授权’混为一谈。”\n\n事实上，不少亲共和党势力现在也开始反对人工智能和数据中心建设。在选举当晚的直播中，由多名知名亲特朗普的科技业投资者主持的播客节目Chamath Palihapitiya就警告指出，“如果说有什么能摧毁美国经济，那一定就是人工智能产业；而要摧毁人工智能产业，唯一的办法就是摧毁数据中心。”就连以看好科技增长前景而闻名的市场分析师艾夫斯(Dan Ives)如今也估计，美国计划新建的800至1000座数据中心中，有10%“最终将不会建成”。\n\n除了美国朝野上下的反AI思潮，还有另一件事也让英伟达首席执行官黄仁勋头疼不已。路透社查阅的一封邮件显示，众议院共和党资深议员正要求黄仁勋在11月内向国会通报相关情况。不久前，《纽约时报》披露称，美国当局正在调查一名黄姓中国籍女子，她曾是总部位于新加坡的Megaspeed公司的高管，该公司从英伟达采购人工智能（AI）芯片。美国当局一直在审查Megaspeed，怀疑该公司协助北京获取了被禁止向中国出口的先进AI芯片。\n\n在11月4日发出的一封信中，众议院外交委员会主席马斯特（Brian Mast）、“美中战略竞争特别委员会”主席穆勒纳尔（John Moolenaar）以及情报委员会成员克劳福德（Eric Crawford）要求黄仁勋于11月18日进行闭门通报，内容涉及《纽约时报》的上述报道，以及英伟达“针对外国敌对势力间谍活动的安保规程”。他们在信中写道，该报道引发了“关于（中国）获取美国敏感技术和信息所带来的重大国家安全担忧”。他们补充说：“国会必须查明美国国家安全究竟在多大程度上受到了威胁，这一点至关重要。”\n\n英伟达方面表示，黄仁勋“每年都会与数以千计的客户高管进行交流”。该公司强调，其在亚洲的云服务客户所获取的仅是常规商业信息，而非英伟达的敏感商业机密，也不涉及任何与美国国家安全相关的内容。“我们经常收到美国政府关于受关注方和实体的通报，并始终据此采取相应行动。”\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "body": "（德国之声中文网）美国能源部表示，原定于11月6日举行的白宫“总统科学与技术顾问委员会”会议暂时取消。该委员会包括英伟达首席执行官黄仁勋、META首席执行官扎克伯格(Mark Zuckerberg)、AMD首席执行官苏姿丰以及其他一些科技企业的高管。美国能源部网站曾短暂地将11月13日列为会议的新日期，但随后又发送了一封邮件，宣布这条通知作废。\n\n根据原本的会议通知，该委员会应为特朗普最新成立的人工智能工作小组（即“超级智能特别工作组”）提供咨询。后者囊括了多名内阁官员、白宫幕僚以及其他一些特朗普总统任命的人员。“超级智能”（Super Intelligence）是特朗普总统对人工智能所偏好的称呼。白宫没有披露此次会议为何取消或者推迟。\n\n就在前一天(11月5日)，科技股遭遇大幅抛售。金融市场日益担心由民主党掌控的新一届国会可能会放缓人工智能（AI）的发展，同时也担心在构建AI基础设施方面投入的巨额资本支出可能无法带来足够的回报。这种市场动荡促使硅谷高管和华盛顿的决策者们加强了对该行业的审视。\n\n过去两年来，许多硅谷的科技界大佬都努力拉拢和特朗普总统的关系。而随着本周共和党在美国国会中期选举里惨败，这些硅谷大佬正面临民主党执掌的国会所发出的传票威胁。在此次选举中，选民对人工智能以及相关的数据中心建设之反感情绪很大程度上影响了投票倾向。\n\n目前，国会进步党团(Congressional Progressive Caucus)主席卡萨尔(Greg Casar)已经表示：“应当传唤人工智能公司的首席执行官们，要求他们在宣誓后作证。”民主党参议员马基(Ed Markey)则向科技高管们发出警告称，鉴于国会即将发出大量传票，他们恐怕得“多植些树，好为印制这些传票提供纸张”。 新当选的密歇根州民主党籍参议员赛义德(Abdul El-Sayed)更是提出激进主张，要对最强大的人工智能研发实施“全面暂停”，还呼吁美中两国签署条约，以“暂停并禁止超级智能”，也就是超越人类智能的人工智能。\n\n随着新当选议员明年1月3日正式到任，民主党将全面掌控参众两院，届时将可以通过各个委员会强制手段要求企业高管作证或提交内部文件，否则将面临起诉风险。\n\n根据美国全国广播公司NBC的出口民调，此次选举中，56%的选民都认为，人工智能和数据中心问题是他们做出投票选择时的“关键或主要考量因素”。由多家大型科技公司资助、具有影响力的中间派联盟“进步商会”（Chamber of Progress）首席执行官科瓦切维奇（Adam Kovacevich）说，“我们不应将‘反特朗普浪潮’与‘反对科技行业的民意授权’混为一谈。”\n\n事实上，不少亲共和党势力现在也开始反对人工智能和数据中心建设。在选举当晚的直播中，由多名知名亲特朗普的科技业投资者主持的播客节目Chamath Palihapitiya就警告指出，“如果说有什么能摧毁美国经济，那一定就是人工智能产业；而要摧毁人工智能产业，唯一的办法就是摧毁数据中心。”就连以看好科技增长前景而闻名的市场分析师艾夫斯(Dan Ives)如今也估计，美国计划新建的800至1000座数据中心中，有10%“最终将不会建成”。\n\n除了美国朝野上下的反AI思潮，还有另一件事也让英伟达首席执行官黄仁勋头疼不已。路透社查阅的一封邮件显示，众议院共和党资深议员正要求黄仁勋在11月内向国会通报相关情况。不久前，《纽约时报》披露称，美国当局正在调查一名黄姓中国籍女子，她曾是总部位于新加坡的Megaspeed公司的高管，该公司从英伟达采购人工智能（AI）芯片。美国当局一直在审查Megaspeed，怀疑该公司协助北京获取了被禁止向中国出口的先进AI芯片。\n\n在11月4日发出的一封信中，众议院外交委员会主席马斯特（Brian Mast）、“美中战略竞争特别委员会”主席穆勒纳尔（John Moolenaar）以及情报委员会成员克劳福德（Eric Crawford）要求黄仁勋于11月18日进行闭门通报，内容涉及《纽约时报》的上述报道，以及英伟达“针对外国敌对势力间谍活动的安保规程”。他们在信中写道，该报道引发了“关于（中国）获取美国敏感技术和信息所带来的重大国家安全担忧”。他们补充说：“国会必须查明美国国家安全究竟在多大程度上受到了威胁，这一点至关重要。”\n\n英伟达方面表示，黄仁勋“每年都会与数以千计的客户高管进行交流”。该公司强调，其在亚洲的云服务客户所获取的仅是常规商业信息，而非英伟达的敏感商业机密，也不涉及任何与美国国家安全相关的内容。“我们经常收到美国政府关于受关注方和实体的通报，并始终据此采取相应行动。”\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "link": "https://www.dw.com/zh/反ai浪潮让黄仁勋祸不单行？股票暴跌-被国会传唤/a-79884461?maca=chi-rss-chi-all-1127-xml-mrss", "time": "11月07日 20:07", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "深圳APEC前夕 美国催中国兑现稀土承诺", "title_zh": "深圳APEC前夕 美国催中国兑现稀土承诺", "summary_orig": "深圳APEC会议召开前不到两周，美国财政部长贝森特和贸易代表格里尔与中国国务院副总理何立峰视频会谈，要求中国\"全面、立即\"落实釜山贸易协议的承诺，何立峰则对美方近期的贸易限制表达\"严正关切\"。与此同时，中方首次证实正就中美俄三国元首会晤保持沟通。分析人士认为，三方能否会面，关键在于议程：特朗普想谈核军控，北京则拒绝被拉进美俄核谈判。", "summary_zh": "深圳APEC会议召开前不到两周，美国财政部长贝森特和贸易代表格里尔与中国国务院副总理何立峰视频会谈，要求中国\"全面、立即\"落实釜山贸易协议的承诺，何立峰则对美方近期的贸易限制表达\"严正关切\"。与此同时，中方首次证实正就中美俄三国元首会晤保持沟通。分析人士认为，三方能否会面，关键在于议程：特朗普想谈核军控，北京则拒绝被拉进美俄核谈判。", "body_orig": "", "body_zh": "（德国之声中文网）美国财政部长贝森特（Scott Bessent）和贸易代表格里尔（Jamieson Greer）周五（11月6日）与中国国务院副总理何立峰举行视频会谈，要求中国\"全面、立即\"落实2025年釜山贸易协议中的承诺。美国贸易代表办公室在声明中说，格里尔强调，中国必须采取具体行动，特别是在农产品采购、稀土和其他关键矿产方面。\n\n2025年，特朗普与习近平在韩国釜山APEC峰会期间达成贸易协议。按照协议，美国对中国商品加征的关税被限定在约20%，中国承诺采购美国大豆，并暂停实施新的稀土出口管制。特朗普政府此前曾抱怨北京没有履行稀土供应方面的承诺。今年9月习近平访美期间，双方把这项原本为期一年的协议延长至明年1月10日。\n\n据新华社报道，双方在通话中围绕落实中美元首北京和华盛顿会晤重要共识以及经贸磋商成果，就彼此关心的重要经贸问题进行了\"坦诚、深入、建设性的交流\"。中方就近期美方对华经贸限制措施表达了\"严正关切\"，但通稿没有具体说明是哪些措施。贝森特会后在X上表示，特朗普政府将继续推行有利于美国工人、农民和企业的政策。\n\n另一个焦点是中美俄三方元首会晤。中国外交部发言人毛宁周三（11月4日）首次证实，中国正就中美俄元首会晤与相关方保持沟通。\n\n彭博社认为，这一表态出现在深圳会议前两周，说明北京准备做东。而就在10月中旬，毛宁被问及此事时，还连续两天表示\"没有可以提供的信息\"。\n\n据《华尔街日报》的报道，三方会晤的提议出自普京，他在10月9日与特朗普通电话时提出了这一形式。据英国《金融时报》的报道，美俄两国都在游说北京，但北京尚未拍板。\n\n《南华早报》报道援引多位学者的话指出，议程是三方会晤能否成行的关键。中国方面的学者认为，北京愿意讨论大国关系风险、全球经济复苏、粮食和能源安全、气候变化等议题，但会拒绝\"选边站\"，也拒绝\"把中国强行拉进美俄核军控谈判\"等\"不公平的提议\"。\n\n据《金融时报》报道，特朗普希望三方聚焦核军控，而中国一直以本国核武库规模远小于美俄为由，拒绝参加三方军控谈判。\n\n另据报道，上周结束对华访问后，德国总统施泰因迈尔接受了德国电视一台（ARD）采访表示，习近平提到了即将在中国深圳举行的亚太经合组织（APEC）峰会，但认为目前根本没有筹备任何由美国、俄罗斯和中国三方参与的乌克兰问题峰会。\n\n美国智库昆西研究所的西蒙（Denis Simon）认为，三国有\"重叠的利益\"，却没有\"共同的战略愿景\"：特朗普想展示自己能绕开传统盟友、直接与另外两大国打交道；普京光是坐上谈判桌就是一场外交胜利；习近平则可能最为谨慎，因为他担心卷入一种以牺牲中国利益为代价、承认美俄势力范围的安排。", "body": "（德国之声中文网）美国财政部长贝森特（Scott Bessent）和贸易代表格里尔（Jamieson Greer）周五（11月6日）与中国国务院副总理何立峰举行视频会谈，要求中国\"全面、立即\"落实2025年釜山贸易协议中的承诺。美国贸易代表办公室在声明中说，格里尔强调，中国必须采取具体行动，特别是在农产品采购、稀土和其他关键矿产方面。\n\n2025年，特朗普与习近平在韩国釜山APEC峰会期间达成贸易协议。按照协议，美国对中国商品加征的关税被限定在约20%，中国承诺采购美国大豆，并暂停实施新的稀土出口管制。特朗普政府此前曾抱怨北京没有履行稀土供应方面的承诺。今年9月习近平访美期间，双方把这项原本为期一年的协议延长至明年1月10日。\n\n据新华社报道，双方在通话中围绕落实中美元首北京和华盛顿会晤重要共识以及经贸磋商成果，就彼此关心的重要经贸问题进行了\"坦诚、深入、建设性的交流\"。中方就近期美方对华经贸限制措施表达了\"严正关切\"，但通稿没有具体说明是哪些措施。贝森特会后在X上表示，特朗普政府将继续推行有利于美国工人、农民和企业的政策。\n\n另一个焦点是中美俄三方元首会晤。中国外交部发言人毛宁周三（11月4日）首次证实，中国正就中美俄元首会晤与相关方保持沟通。\n\n彭博社认为，这一表态出现在深圳会议前两周，说明北京准备做东。而就在10月中旬，毛宁被问及此事时，还连续两天表示\"没有可以提供的信息\"。\n\n据《华尔街日报》的报道，三方会晤的提议出自普京，他在10月9日与特朗普通电话时提出了这一形式。据英国《金融时报》的报道，美俄两国都在游说北京，但北京尚未拍板。\n\n《南华早报》报道援引多位学者的话指出，议程是三方会晤能否成行的关键。中国方面的学者认为，北京愿意讨论大国关系风险、全球经济复苏、粮食和能源安全、气候变化等议题，但会拒绝\"选边站\"，也拒绝\"把中国强行拉进美俄核军控谈判\"等\"不公平的提议\"。\n\n据《金融时报》报道，特朗普希望三方聚焦核军控，而中国一直以本国核武库规模远小于美俄为由，拒绝参加三方军控谈判。\n\n另据报道，上周结束对华访问后，德国总统施泰因迈尔接受了德国电视一台（ARD）采访表示，习近平提到了即将在中国深圳举行的亚太经合组织（APEC）峰会，但认为目前根本没有筹备任何由美国、俄罗斯和中国三方参与的乌克兰问题峰会。\n\n美国智库昆西研究所的西蒙（Denis Simon）认为，三国有\"重叠的利益\"，却没有\"共同的战略愿景\"：特朗普想展示自己能绕开传统盟友、直接与另外两大国打交道；普京光是坐上谈判桌就是一场外交胜利；习近平则可能最为谨慎，因为他担心卷入一种以牺牲中国利益为代价、承认美俄势力范围的安排。", "link": "https://www.dw.com/zh/深圳apec前夕-美国催中国兑现稀土承诺/a-79884476?maca=chi-rss-chi-all-1127-xml-mrss", "time": "11月07日 19:18", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "长平观察：西方背弃黄之锋，也在背弃自己", "title_zh": "长平观察：西方背弃黄之锋，也在背弃自己", "summary_orig": "香港民主运动人士黄之锋以“串谋勾结外国势力”罪再被判刑10年。时事评论作家长平指出，从六四后老布什密使北京，到今天对黄之锋的沉默，西方一再背弃自由斗士，必将为自己的迟钝、懦弱和堕落付出代价。", "summary_zh": "香港民主运动人士黄之锋以“串谋勾结外国势力”罪再被判刑10年。时事评论作家长平指出，从六四后老布什密使北京，到今天对黄之锋的沉默，西方一再背弃自由斗士，必将为自己的迟钝、懦弱和堕落付出代价。", "body_orig": "", "body_zh": "（德国之声中文网）1989年11月，柏林墙倒塌了。假如不是东德人获得了西德人的自由，而是相反，东德共产专制政权控制了西德，并在西德实施\"国安法\"，把任何敢于批评东德政府、呼吁恢复西德自由的人都抓起来重判入狱，世界将会怎样？\n\n2019年9月，柏林墙倒塌三十周年前夕，香港反抗运动的领袖之一黄之锋访问柏林。他在演讲中警示：\"如果现在是新冷战时期的话，那么香港就是新的柏林。\"令人痛心的是，柏林人正忙于庆祝\"历史的胜利\"，回避现实的困难，眼看着\"新的柏林\"香港沦陷，中共专制政权肆意侵蚀自由世界。\n\n周四（11月5日）黄之锋被控“串谋勾结外国势力危害国家安全罪”而再被判处10年监禁。已被关押近6年的他原本预计明年1月出狱，如今要坐到2036年年底。据港媒报道，主审法官谭耀豪指黄之锋\"罪行重大\"，称\"案发时香港正受社会动荡的严重影响\"，\"被告与罗冠聪等人串谋，持续接触外国官员或机构，呼吁制裁中国及香港官员\"。\n\n仅仅呼吁制裁正在作恶的中国及香港官员，就被判十年监禁。如此残忍的判决，正好印证了黄之锋当年呼吁的急迫性，以及被西方所忽略的后果：未能受到制裁的专制政权，将会多么疯狂地仇视人权和自由。\n\n德国《世界报》（DIE WELT）发表评论《他在捍卫西方，而西方却正在变得迟钝、怯懦和堕落》，作者波沙特（Ulf Poschardt）深刻地指出，黄之锋捍卫的是西方的价值观，那就是自由。黄之锋提醒人们，这个时代真正的冲突在哪里。那就是自由：个人的自由，以及挺身对抗威权体制和独裁政权的勇气。\n\n然而，西方自身却面临日渐迟钝、懦弱和堕落的风险：为细枝末节的小事争执不休，面对原则问题却沉默不语。\n\n波沙特批评说：\"西方正在抛弃自由斗士。乌克兰是一个典型例子，委内瑞拉、土耳其、伊朗也是如此，中国更是如此。\"他认为，无论在哪个领域，中国都不可能成为西方的伙伴；无论是个人自由和人权标准，还是民主宪政，中国都是西方的敌人。\n\n没错，西方背弃了黄之锋，也在背弃自己的信念。我还想进一步指出，西方已经为这种背弃付出代价，还将继续付出代价。东德越过柏林墙、吞并西德自由世界的历史荒诞剧，正在上演。\n\n西方背弃自由斗士并非始于今日。六四屠杀之后，中共没有受到应有的惩罚，就是其中一桩奇耻大辱。1989年，中国的学生用鲜血和生命推开了新世界的大门；随后，勇敢的东欧人继续抗争，直到柏林墙倒塌。急于欢庆胜利的西方人宣告冷战结束，却把大门轰然关上，假装世界大同。\n\n屠杀发生后的第二天，1989年6月5日，时任美国总统老布什（George H.W. Bush）在记者会上说，现在\"不是感情用事（emotional response）的时候\"，而要\"理智而谨慎地行动（reasoned, careful action）\"，既考虑美国的\"长远利益（long-term interests）\"，也要\"认识到中国复杂的国内形势（recognition of a complex internal situation in China）\"。\n\n随后，他背弃了中国成千上万的自由斗士，急于与邓小平恢复联系。邓小平不接他的电话，他便亲笔写信；邓小平回信同意接待密使后，7月初，他派国家安全顾问斯考克罗夫特（Brent Scowcroft）和副国务卿伊格尔伯格（Lawrence Eagleburger）秘密前往北京，直接与邓小平会面。\n\n我曾多次在文章中追问：三十多年过去了，老布什口中美国的\"长远利益\"在哪里？是养虎为患，让中共强大到剥夺香港的自由、威胁西方的自由吗？是让西方政客在中共面前战战兢兢，甚至不敢提及\"人权\"二字吗？是让西方企业家到中国点头哈腰，被迫分享关键技术吗？\n\n今天，西方背弃了黄之锋。我们还要再等三十年，才知道\"迟钝、懦弱和堕落\"的西方将受到什么样的惩罚吗？\n\n长平是资深媒体人、时事评论作家。他目前是德国之声专栏作家、中国数字时代执行主编以及六四记忆 · 人权博物馆总策展人。\n\n德国之声致力于为您提供客观中立的新闻报导，以及展现多种角度的评论分析。文中评论及分析仅代表作者或专家个人立场。\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "body": "（德国之声中文网）1989年11月，柏林墙倒塌了。假如不是东德人获得了西德人的自由，而是相反，东德共产专制政权控制了西德，并在西德实施\"国 {"title_orig": "“天宫”将迎来首位外籍宇航员", "title_zh": "“天宫”将迎来首位外籍宇航员", "summary_orig": "中国空间站即将迎来首位外国访客！据中国官媒报道，一名巴基斯坦宇航员将搭乘“神舟二十四号” 飞船进入中国空间站。任务成行后，他将成为首位进入中国空间站的外国公民。", "summary_zh": "中国空间站即将迎来首位外国访客！据中国官媒报道，一名巴基斯坦宇航员将搭乘“神舟二十四号” 飞船进入中国空间站。任务成行后，他将成为首位进入中国空间站的外国公民。", "body_orig": "", "body_zh": "（德国之声中文网）据中国官媒周六（11月7日）报道，一名巴基斯坦宇航员将加入中国“神舟二十四号” 载人飞行任务的乘组。他是一位巴基斯坦载荷专家。\n\n任务成行后，他将成为首位进入中国空间站的外国公民。这也将是中国载人航天工程历史上，首次由中国与外国宇航员共同执行太空飞行任务。\n\n中国载人航天工程办公室表示，这名巴基斯坦宇航员将完成一次短期在轨飞行，随后搭乘“神舟二十三号”飞船返回地球。\n\n中方报道未明确“神舟二十四号”的具体发射日期，也尚未公布这名巴基斯坦宇航员的具体身份。不过，今年早些时候，中国官媒曾报道，两名巴基斯坦预备宇航员——穆罕默德·泽尚·阿里（Muhammad Zeeshan Ali）和胡拉姆·达乌德（Khurram Daud），已经在北京开始与中国宇航员共同接受训练。按照计划，两人在中国完成各项训练并通过考核后，“其中1人将执行载人飞行任务，1人作为任务备份航天员”。\n\n此次飞行任务是中国与巴基斯坦于2025年2月签署的《关于选拔、训练巴基斯坦航天员并参与中国空间站飞行任务的合作协议》的内容之一。\n\n路透社报道指出，这是中巴两国在“一带一路”倡议框架下开展双边合作的一部分，也是中国开展“航天外交”的重要体现，被视为中国通过航天合作加强国际关系的举措。\n\n德新社的报道指出，中国目前正致力于在2030年前实现首次载人登月。美国被视为中国在航天领域的主要竞争对手，美国国家航空航天局计划2028年再次将宇航员送上月球。\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "body": "（德国之声中文网）据中国官媒周六（11月7日）报道，一名巴基斯坦宇航员将加入中国“神舟二十四号” 载人飞行任务的乘组。他是一位巴基斯坦载荷专家。\n\n任务成行后，他将成为首位进入中国空间站的外国公民。这也将是中国载人航天工程历史上，首次由中国与外国宇航员共同执行太空飞行任务。\n\n中国载人航天工程办公室表示，这名巴基斯坦宇航员将完成一次短期在轨飞行，随后搭乘“神舟二十三号”飞船返回地球。\n\n中方报道未明确“神舟二十四号”的具体发射日期，也尚未公布这名巴基斯坦宇航员的具体身份。不过，今年早些时候，中国官媒曾报道，两名巴基斯坦预备宇航员——穆罕默德·泽尚·阿里（Muhammad Zeeshan Ali）和胡拉姆·达乌德（Khurram Daud），已经在北京开始与中国宇航员共同接受训练。按照计划，两人在中国完成各项训练并通过考核后，“其中1人将执行载人飞行任务，1人作为任务备份航天员”。\n\n此次飞行任务是中国与巴基斯坦于2025年2月签署的《关于选拔、训练巴基斯坦航天员并参与中国空间站飞行任务的合作协议》的内容之一。\n\n路透社报道指出，这是中巴两国在“一带一路”倡议框架下开展双边合作的一部分，也是中国开展“航天外交”的重要体现，被视为中国通过航天合作加强国际关系的举措。\n\n德新社的报道指出，中国目前正致力于在2030年前实现首次载人登月。美国被视为中国在航天领域的主要竞争对手，美国国家航空航天局计划2028年再次将宇航员送上月球。\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "link": "https://www.dw.com/zh/天宫-将迎来首位外籍宇航员/a-79883779?maca=chi-rss-chi-all-1127-xml-mrss", "time": "11月07日 17:06", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "意大利侦结对“李老师不是你老师”跨境监视威胁案", "title_zh": "意大利侦结对“李老师不是你老师”跨境监视威胁案", "summary_orig": "米兰检察官已结束对居住在意大利的异议人士“李老师不是你老师”遭跨境跟踪、监视及威胁案件的调查，并准备申请将案件移送审判。共有10人被列为该案的犯罪嫌疑人。", "summary_zh": "米兰检察官已结束对居住在意大利的异议人士“李老师不是你老师”遭跨境跟踪、监视及威胁案件的调查，并准备申请将案件移送审判。共有10人被列为该案的犯罪嫌疑人。", "body_orig": "", "body_zh": "（德国之声中文网）此案的核心人物是网名“李老师不是你老师”的博主、自2015年起便居住在意大利的艺术家李颖。他在X平台帐号“李老师不是你老师”@whyyoutouzhele拥有220万粉丝。该账号因在2022年底中国爆发反对“清零政策”的“白纸运动”期间，转发海量来自中国民众的抗议实时图文与视频而备受关注。在这之后，该账号也经常发布由中国国内民众发送给他的视频、照片和文字叙述，内容多涉及抗议活动及其他在中国受到严格管控、或完全不予报道的政治敏感事件。\n\n根据路透社看到的案卷，米兰检察官于10月23日通知10名嫌疑人（包括8名中国公民和2名意大利公民）调查已经结束，并给予他们在可能进入审判程序前做出回应的最后机会。该文件揭示了意大利检察官所称的这场“针对海外中国政府批评者进行监控和恐吓的协同行动”。\n\n李颖对于此次调查表示欢迎。他在给路透社的一份声明中表示，由于他致力于分享关于中国普通民众的“真实故事”，他本人、家人以及关注者多年来一直遭受着“持续不断的骚扰和威胁”。 “因此，我很高兴看到此案取得进展，也非常感谢调查人员。”\n\n2024年10月，在意大利都灵，李颖通过自家门上的猫眼，拍到一名男子在他住所旁的墙上喷涂了“stupro”（意大利语，意为“强奸”）一词。检察官随后据此展开了调查。\n\n调查人员称，他们发现了一场有系统的监视行动：嫌疑人多次前往李颖被认为居住的地点，拍摄入口照片，在附近的咖啡馆监视相关建筑，翻找垃圾桶，向居民打探信息，并追踪李颖的行踪。\n\n检察官表示，其中一名嫌疑人在秘密监视行动中收集了超过4000张照片和35段视频。案卷还显示，李颖通过社交媒体和电子邮件收到了死亡威胁，其中包括“我要砍下你的头”、“我们要惩罚你”等信息，并附有突击步枪、手枪和刺刀的图片。\n\n两名为首的嫌犯被指控代表中国警方行事，同时与中国外交官及统战部成员保持联系。这两人连同另外两人，被指控参与了一个犯罪团伙，其目的是“阻挠“中国异见人士行使言论自由的权利”——根据意大利法律，这一罪名最高可判处七年监禁。\n\n案卷显示，以上四名涉嫌组织者中的一人招募了中国公民去跟踪李颖，而另一名嫌疑人则出价每天100欧元，雇人协助锁定李颖的行踪。李颖的个人信息被发布在网上，其身在中国的亲友也受到了压力。李颖深感自身安全受到威胁，被迫不断更换住所，在米兰和都灵之间辗转，试图躲避追踪。\n\n10月31日，李颖出席了《纽约时报》记者袁莉在日本东京举办的“不明白节”，这是他首次公开露面。他在访谈中谈到自己选择站出来露面的原因、遭遇跨境镇压而逃亡的经历、以及通过运营账号所窥见的中国社会百态。\n\n“李老师不是你老师”遭跨境镇压案反映出意大利正日益加强对“中国监控并施压批评者”行为的审查。意大利警方2月份表示，源自中国的网络攻击曾针对意大利内政部，旨在搜寻中国异见人士，并查明负责调查中国犯罪团伙的警务人员身份。中国外交部当时回应称，北京坚决反对黑客攻击，并驳斥了有关此事的“虚假信息”。\n\n一个月后，意大利媒体报道称，罗马方面已下令驱逐八名中国公民，这些人被怀疑受中国政府指使，对异见人士进行监视。意大利内政部当时拒绝置评。\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "body": "（德国之声中文网）此案的核心人物是网名“李老师不是你老师”的博主、自2015年起便居住在意大利的艺术家李颖。他在X平台帐号“李老师不是你老师”@whyyoutouzhele拥有220万粉丝。该账号因在2022年底中国爆发反对“清零政策”的“白纸运动”期间，转发海量来自中国民众的抗议实时图文与视频而备受关注。在这之后，该账号也经常发布由中国国内民众发送给他的视频、照片和文字叙述，内容多涉及抗议活动及其他在中国受到严格管控、或完全不予报道的政治敏 被判重刑，刑期又增加了十年。但这一次，西方世界却表现出了异乎寻常的沉默，就连左翼职业活动家们也没有高调地给中国当局发出抗议信。\n\n而黄之锋和我们并没有什么区别：他也想像我们一样自由地生活。他要捍卫西方，而西方却面临着日渐怯弱和堕落的风险：为旁支末节的小事争执不休，面对原则问题却沉默不语。黄之锋再度提醒我们，当今世界争执的焦点究竟是什么：自由、个人的自由以及反抗专制和独裁的勇气。”\n\n《世界报》的评论指出，黄之锋曾同另一位香港民主派人士邝颂晴为《世界报》撰写专栏文章，向德国读者介绍香港的局势。黄之锋被捕后，邝颂晴曾在一篇文章中写道：争取香港自由的斗争正变得越来越危险，而西方却任由中国为所欲为：\n\n“为自由而战的人们正在被西方所抛弃，乌克兰局势最具有代表性，委内瑞拉、土耳其、伊朗、尤其是中国也同样如此。无论在任何领域，中国都不可能成为西方的伙伴。无论是个人自由和人权标准，还是民主宪政的层面上，中国都是西方的敌人。\n\n我们能从中得到的唯一教训就是，在经济、外交和国防层面上，西方必须变得更加强大，文化层面上也同样如此。像黄之锋这样的人，对西方自由往往有着更加深刻的理解，远远胜过西方体制内那些安于现状、衣食无忧、而又思想懒惰的大多数人。\n\n当年黄之锋接受我采访时曾说过这样的话：‘如果我们的政治家不愿为我们的未来付出努力，那我就必须站在最前线，为自己的未来而奋斗。’黄之锋的事例清楚地表明，公民的身份早已不再取决于社会地位，而是取决于他为获取更多自由而奋斗的意愿，以及他是否愿意为制止社会各层面上自由的丧失而付出努力。这也正是当前德国社会所需要的。\n\n对于美国中期选举的结果，德国《明镜周刊》发表评论写道，民主党确实取得了胜利，但不应忘记特朗普的执政期还有八百多天，这位现年八十岁的总统仍有能力让世界与他同归于尽：\n\n“那怎么办呢？我们欧洲人应为特朗普统治的晚期准备好求生手册。如果一厢情愿地认为，最糟糕的时期已经成为过去，显然是一种不负责任的态度。当今世界的流氓们会发现特朗普已经变成‘跛脚鸭’，会认为放手一搏的机会到了，而首当其冲的就是普京。欧洲，尤其是德国，必须要义正词严地告诫这位俄罗斯当权者，乌克兰仍将获得该国自卫所需的一切。\n\n普京最擅长读懂权力的语言。只要普京意识到，特朗普的影响力正在逐渐消失，他主动邀请欧洲人重返谈判桌的意愿就会骤然上升。过去多年以来，欧洲人实际上被排除在谈判席之外。由此看来，特朗普在中期选举中的失败，或许也能为外交努力创造机会。\n\n中国的情形也大同小异，或许习近平主席会得出这样的结论：现在正是吞并台湾的最佳历史窗口。一方面，伊朗战争已经削弱了美国的军事实力。另一方面，特朗普又对习近平这类独裁者表现出了异乎寻常的偏爱。有鉴于此，欧洲必须尽快向北京表明立场：武装侵台需要付出惨痛的代价，欧盟将会大幅限制对华经贸关系。同美国不同的是，欧洲无法以军事手段威慑中国。但我们却有能力让中国经济陷入危机。仅去年一年，中国对欧出口额就高达5590亿欧元。”\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "body": "（德国之声中文网）《世界报》评论写道，中国当局再度判处香港民主派人士黄之锋十年监禁。而这一肆意专横的判决说明了一个问题：当今世界的各类冲突都同争取自由的斗争密切相关。这篇题为《他在捍卫西方，西方却在走向怯弱和堕落》的评论写道:\n\n“2024年11月，黄之锋在香港被判处四年半监禁。这一判决无疑是法治的丑闻。它显示出，中国专制政权是多么的腐朽，也显示出，那些及时指出对华依赖危害性的人，又是多么有先见之明。同时，这一判决也在提醒我们，只有提升经济实力和完善市场框架，我们才能摆脱这样的依赖。\n\n现如今，黄之锋又一次被判重刑，刑期又增加了十年。但这一次，西方世界却表现出了异乎寻常的沉默，就连左翼职业活动家们也没有高调地给中国当局发出抗议信。\n\n而黄之锋和我们并没有什么区别：他也想像我们一样自由地生活。他要捍卫西方，而西方却面临着日渐怯弱和堕落的风险：为旁支末节的小事争执不休，面对原则问题却沉默不语。黄之锋再度提醒我们，当今世界争执的焦点究竟是什么：自由、个人的自由以及反抗专制和独裁的勇气。”\n\n《世界报》的评论指出，黄之锋曾同另一位香港民主派人士邝颂晴为《世界报》撰写专栏文章，向德国读者介绍香港的局势。黄之锋被捕后，邝颂晴曾在一篇文章中写道：争取香港自由的斗争正变得越来越危险，而西方却任由中国为所欲为：\n\n“为自由而战的人们正在被西方所抛弃，乌克兰局势最具有代表性，委内瑞拉、
