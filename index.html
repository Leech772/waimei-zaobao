const DATA = {"updated": "2026年11月09日 07:02", "papers": [{"key": "nyt_cn", "name": "纽约时报中文网", "lang": "中文", "tab_note": "本页嵌免费全文（本轮亲测多篇可完整阅读）", "free_mark": "full_verified", "error": null, "items": [{"title_orig": "剥削与掌控：NewJeans秘密合同揭露K-pop阴暗面", "title_zh": "剥削与掌控：NewJeans秘密合同揭露K-pop阴暗面", "summary_orig": "长期以来，K-pop一直受到剥削艺人的指控。NewJeans与公司签署的秘密合同表明，尽管多年来业界不断承诺改革，政府也出手干预，但实际情况并没有多少改变。 Jung Yeon-Je/Agence France-Presse — Getty Images", "summary_zh": "长期以来，K-pop一直受到剥削艺人的指控。NewJeans与公司签署的秘密合同表明，尽管多年来业界不断承诺改革，政府也出手干预，但实际情况并没有多少改变。 Jung Yeon-Je/Agence France-Presse — Getty Images", "body_orig": "", "body_zh": "两年前，屡创纪录的韩国女子组合NewJeans的五名成员做出了一件近一代人以来从未有同等知名度的韩流明星做过的事：与公司解约。当时，部分成员还只有十几岁。\n\n“留在公司只会延长我们的精神痛苦，”成员之一范玉欣(Hanni Pham)对记者说。那是她们的专辑《Get Up》登顶美国排行榜约一年后。\n\n随后发生的是K-pop历史上最具爆炸性的争议之一：一场围绕艺术自由的、长达数年的法律与权力斗争。在这个行业里，娱乐公司从艺人十几岁起就对其严密控制。高管们警告说，如果NewJeans可以一走了之，价值数十亿美元的K-pop产业可能崩溃。\n\n这场争端的核心是五名成员在14岁至17岁时签署的秘密合同。当时，她们大多默默无闻，怀揣着明星梦。《纽约时报》获得了这些合同，得以罕见地窥见韩国的娱乐公司如何严密控制旗下艺人，即便是最红的明星也不例外。（合同中的姓名和家庭住址等信息已被隐去。《纽约时报》为保护个人隐私，又进一步遮盖了部分信息。）\n\n韩国政府有一套K-pop合同模板，保障受教育权以及身心健康权。NewJeans的合同删去了这些表述。合同禁止诸如“态度不真诚”、进入“不适当的恋爱关系”或批评厂牌等行为。协议包含高额退出条款，允许厂牌在合同结束后继续销售NewJeans的音乐，同时削减支付给组合的款项。它还赋予厂牌无限期使用人工智能生成的NewJeans声音的权利。\n\n长期以来，K-pop一直受到剥削艺人的指控。厂牌招募儿童，让他们接受多年高强度训练，之后往往还要求他们偿还培训费用。一些艺人表示，即使能够在座无虚席的体育场演出，他们仍被迫节食到近乎挨饿的程度，并背负长期债务。已有多名韩流“爱豆”自杀。\n\nNewJeans的合同表明，尽管多年来业界不断承诺改革，政府也出手干预，但实际情况并没有多少改变，即使对于当今最成功的组合之一也是如此。\n\n“这份合同苛刻得异乎寻常，”首尔的娱乐行业律师卢宗彦（音）说。他是为《纽约时报》审阅NewJeans合同的五名专家之一。“它对艺人自由的限制程度即使在近年来大厂牌的合同中也极为罕见。”\n\nNewJeans争议的核心是该组合与厂牌Ador的斗争。Ador是娱乐集团Hybe旗下的厂牌，Hybe是K-pop巨头，旗下拥有BTS和Katseye等组合。\n\nHybe安排四名发言人接受了一次长时间采访，并提供了一份书面声明，但要求采访和声明中的信息均以公司代表的名义发布。\n\nHybe表示，旗下厂牌的合同合法，谈判也秉持诚信原则，条款旨在保护艺人及公司的财务投资。韩国政府的合同范本不具有约束力，Hybe表示，合同中的修改得到了成员家长的认可。\n\n音乐行业的合同纠纷并不新鲜。男子组合’NSync成员兰斯·巴斯最近表示，在组合最红的时候，他每天只有35美元生活费。泰勒·斯威夫特也曾因失去对音乐母带的控制权而引起广泛关注。\n\n但曾代理布兰妮·斯皮尔斯和Cardi B等艺人的娱乐行业律师律师迪娜·拉波尔特表示，这类合同在美国基本已成为历史遗物，在K-pop业界则不然。韩国的娱乐公司同时扮演唱片公司、经纪人和代理人的角色，控制艺人生活的方方面面。\n\n“在K-pop，你要么按他们说的做，按他们说的穿，按他们说的做头发，要么就会被换掉，”拉波尔特说。\n\n在签署合同时，NewJeans的五名成员范玉昕、金玟池(Minji Kim)、李惠仁(Hyein Lee)、姜谐潾(Haerin Kang)和牟智慧(Danielle Marsh)已经接受了多年训练。她们从练习生宿舍开始自己的演艺之路，最小的一个入住时只有12岁，而且没有人能保证她们最终能够出道。\n\n据多名与该组合关系密切的人士透露，排练到凌晨两点是司空见惯的事情。由于担心遭到公司报复，他们要求匿名。\n\n训练区域安装了监控摄像头。三名与该组合关系密切的人士表示，训练期间，不鼓励她们休息。五名成员中有四人在训练期间辍学。\n\nHybe的代表表示，公司完全遵守儿童保护法律，并努力确保艺人在安全的环境中工作和训练。公司表示，从不施压要求艺人辍学，也不会因为艺人休息而惩罚他们。\n\n为保护艺人，韩国政府的模板保障身心健康、教育和睡眠权。它禁止唱片公司强迫未成年人超时工作。\n\n但NewJeans的合同删除了这些内容。专家表示，这使组合成员更难就工作条件提出异议。\n\n《纽约时报》获得的电子邮件显示，合同条款基本上没有协商余地。2022年1月，一名成员的母亲在签约前提出了几处修改要求。\n\nAdor副总裁回复说：“如果您无法接受目前的合同草案，包括上述几点，那么最好重新考虑是否签署这份合同。”\n\n世界各地的艺人都会调整自己的外在形象，但K-pop的娱乐公司经常为旗下艺人安排整容手术。这在韩国很少引起争议，因为韩国是全球整容手术比例最高的国家之一。\n\n据对前偶像的采访，K-pop厂牌敦促歌手做鼻整形或眼睑手术，哪怕有时对方只有十几岁。厂牌通常先垫付手术费用，之后再向艺人收费。\n\nNewJeans的合同规定，成员必须偿还公司在她们担任练习生期间为整容手术及其他美容项目支付的相当一部分费用\n\nNewJeans正式出道前，摄影师从多个角度为成员拍照，以便研究舞台灯光照在她们身上的效果。据两名与组合关系密切的人士透露，随后公司向其中几名成员建议接受美容整形。\n\nHybe代表在书面声明中表示，公司不要求艺人整容。“我们甚至不会违背个人意愿推荐整容手术或美容项目。”上述两名知情人士也表示，在整容十分普遍的韩国及其娱乐行业，这些建议并不被视为强迫。\n\n《纽约时报》不会披露NewJeans成员的医疗史。\n\n整容手术往往造成K-pop所谓的“练习生债务”。许多歌手职业生涯开始时，欠下训练和其他费用，然后通过演艺收入还债。\n\n在这方面，NewJeans是个例外。Hybe承担了组合早期的费用，因此成员从出道起便能获得收入，没有债务。公司代表表示，练习生费用如何处理由旗下各厂牌自行决定，NewJeans的情况由Ador决定。（Hybe目前正与Ador前首席执行官打官司。）\n\n专家表示，从财务角度看，NewJeans的合同在K-pop行业相当常见。扣除开支后，组合可以获得演唱会、广告和宣传活动约一半的利润，外加唱片销售和流媒体播放收入中的一小部分分成。\n\n拉波尔特说，这样的条款在美国会被认为“极其恶劣”，因为美国艺人可以自行聘请经纪人和代理，并保留大部分巡演收入。\n\n2024年10月，在NewJeans成为Spotify平台上最快达到10亿次播放量的K-pop艺人后，范玉欣在韩国国会作证时表示，她认为Ador憎恨她和其他成员。她指责公司员工在社交媒体上侮辱这个组合，在媒体报道中淡化她们的成就，有时甚至对她们不理不睬。\n\n但她的合同并不允许她公开发表这样的言论。合同禁止歌手传播可能损害公司声誉的“真实或虚假事实”，还禁止未成年人饮酒、吸毒，以及一些定义模糊的行为，例如“态度不真诚”“疏于自我管理”和“不适当的恋爱关系”。\n\n专家表示，这些条款给了唱片公司很大的解释空间，可以据此指控艺人违约。\n\n范玉欣作证几周后，NewJeans成员指责Ador向媒体泄露训练视频，并敦促公司改善对她们的待遇。\n\n双方协商无果后，NewJeans成员召开记者会，宣布退出该公司。这场反抗震动了整个行业。Ador随后提起诉讼，双方展开了长达数月的法律争斗。2025年3月，该组合宣布退出近一年后，法官作出有利于公司的裁决，认定NewJeans不能自行开展演艺活动。\n\n根据合同条款，这次试图反抗公司的举动使成员面临潜在诉讼和数百万美元赔偿的风险。\n\n根据提交韩国法院的一份会议记录，成员家属曾试图缓和矛盾，要求公司不要报复。\n\n公司没有给出这样的保证，称停摆已经让其损失了很多钱。\n\n2025年12月，公司终止了与NewJeans成员牟智慧的合同，并对当时20岁的她提起诉讼。公司称，她拒绝工作、未经授权独自开展项目和拍摄照片，还与第三方签订协议，违反了合同。\n\n牟智慧的律师表示，公司是在惩罚她参与此前的反抗行动。\n\n这起诉讼揭示了K-pop行业的一项特殊做法：合同通常允许公司要求支付解约金，即使是由公司而非歌手单方面终止合作关系也是如此。\n\n在牟智慧的案件中，公司向她索赔约2200万美元，其中大部分是解约赔偿金。公司声称，她的行为实际上已导致合同关系破裂。\n\n韩国政府的合同范本建议，根据艺人的平均月收入和合同剩余月数计算赔偿金额。NewJeans的合同采用了类似公式，但有所修改：计算平均收入时，不是把所有月份都计入，而是只计算组合有收入的月份。审阅合同的律师表示，这种修改可能抬高赔偿金额。\n\nHybe的代表表示，公司的解约赔偿条款符合行业标准。他们还称，实际操作中，这种计算方法不会增加赔偿金额，因为旗下艺人每个月都有收入。\n\n牟智慧的律师郑钟采（音）向韩国公平交易委员会提出投诉，指控Hybe和Ador试图终结她的演艺事业。\n\n郑钟采认为，牟智慧在公司以外开展的少量工作不过是借口，他表示，公司的真正目的是向整个行业发出警告。\n\n“如果你试图摆脱Hybe的控制，这就是你要付出的代价，”他说。\n\n根据韩国政府的合同范本，公司使用艺人姓名、肖像和声音的权利应随合同终止而结束。但NewJeans的合同并非如此。\n\n成员的合同将持续到2029年。此后，合同仍允许公司继续使用她们的身份形象，并将相关使用权授权给第三方。NewJeans成员仍有权获得报酬，但将无法控制自己的肖像和声音如何被使用，包括人工智能生成的NewJeans声音克隆和聊天机器人。\n\n法律专家表示，这些合同条款究竟能在多大程度上得到法院支持，目前尚不清楚。\n\nHybe还可以在合同结束后继续出售和重新包装NewJeans的音乐作品，同时大幅削减应支付给成员的报酬。法律专家称，这一条款并不寻常。\n\nNewJeans的未来仍充满不确定性。公司曾暗示可能推出新专辑，但组合已经一年多没有登台演出。", "body": "两年前，屡创纪录的韩国女子组合NewJeans的五名成员做出了一件近一代人以来从未有同等知名度的韩流明星做过的事：与公司解约。当时，部分成员还只有十几岁。\n\n“留在公司只会延长我们的精神痛苦，”成员之一范玉欣(Hanni Pham)对记者说。那是她们的专辑《Get Up》登顶美国排行榜约一年后。\n\n随后发生的是K-pop历史上最具爆炸性的争议之一：一场围绕艺术自由的、长达数年的法律与权力斗争。在这个行业里，娱乐公司从艺人十几岁起就对其严密控制。高管们警告说，如果NewJeans可以一走了之，价值数十亿美元的K-pop产业可能崩溃。\n\n这场争端的核心是五名成员在14岁至17岁时签署的秘密合同。当时，她们大多默默无闻，怀揣着明星梦。《纽约时报》获得了这些合同，得以罕见地窥见韩国的娱乐公司如何严密控制旗下艺人，即便是最红的明星也不例外。（合同中的姓名和家庭住址等信息已被隐去。《纽约时报》为保护个人隐私，又进一步遮盖了部分信息。）\n\n韩国政府有一套K-pop合同模板，保障受教育权以及身心健康权。NewJeans的合同删去了这些表述。合同禁止诸如“态度不真诚”、进入“不适当的恋爱关系”或批评厂牌等行为。协议包含高额退出条款，允许厂牌在合同结束后继续销售NewJeans的音乐，同时削减支付给组合的款项。它还赋予厂牌无限期使用人工智能生成的NewJeans声音的权利。\n\n长期以来，K-pop一直受到剥削艺人的指控。厂牌招募儿童，让他们接受多年高强度训练，之后往往还要求他们偿还培训费用。一些艺人表示，即使能够在座无虚席的体育场演出，他们仍被迫节食到近乎挨饿的程度，并背负长期债务。已有多名韩流“爱豆”自杀。\n\nNewJeans的合同表明，尽管多年来业界不断承诺改革，政府也出手干预，但实际情况并没有多少改变，即使对于当今最成功的组合之一也是如此。\n\n“这份合同苛刻得异乎寻常，”首尔的娱乐行业律师卢宗彦（音）说。他是为《纽约时报》审阅NewJeans合同的五名专家之一。“它对艺人自由的限制程度即使在近年来大厂牌的合同中也极为罕见。”\n\nNewJeans争议的核心是该组合与厂牌Ador的斗争。Ador是娱乐集团Hybe旗下的厂牌，Hybe是K-pop巨头，旗下拥有BTS和Katseye等组合。\n\nHybe安排四名发言人接受了一次长时间采访，并提供了一份书面声明，但要求采访和声明中的信息均以公司代表的名义发布。\n\nHybe表示，旗下厂牌的合同合法，谈判也秉持诚信原则，条款旨在保护艺人及公司的财务投资。韩国政府的合同范本不具有约束力，Hybe表示，合同中的修改得到了成员家长的认可。\n\n音乐行业的合同纠纷并不新鲜。男子组合’NSync成员兰斯·巴斯最近表示，在组合最红的时候，他每天只有35美元生活费。泰勒·斯威夫特也曾因失去对音乐母带的控制权而引起广泛关注。\n\n但曾代理布兰妮·斯皮尔斯和Cardi B等艺人的娱乐行业律师律师迪娜·拉波尔特表示，这类合同在美国基本已成为历史遗物，在K-pop业界则不然。韩国的娱乐公司同时扮演唱片公司、经纪人和代理人的角色，控制艺人生活的方方面面。\n\n“在K-pop，你要么按他们说的做，按他们说的穿，按他们说的做头发，要么就会被换掉，”拉波尔特说。\n\n在签署合同时，NewJeans的五名成员范玉昕、金玟池(Minji Kim)、李惠仁(Hyein Lee)、姜谐潾(Haerin Kang)和牟智慧(Danielle Marsh)已经接受了多年训练。她们从练习生宿舍开始自己的演艺之路，最小的一个入住时只有12岁，而且没有人能保证她们最终能够出道。\n\n据多名与该组合关系密切的人士透露，排练到凌晨两点是司空见惯的事情。由于担心遭到公司报复，他们要求匿名。\n\n训练区域安装了监控摄像头。三名与该组合关系密切的人士表示，训练期间，不鼓励她们休息。五名成员中有四人在训练期间辍学。\n\nHybe的代表表示，公司完全遵守儿童保护法律，并努力确保艺人在安全的环境中工作和训练。公司表示，从不施压要求艺人辍学，也不会因为艺人休息而惩罚他们。\n\n为保护艺人，韩国政府的模板保障身心健康、教育和睡眠权。它禁止唱片公司强迫未成年人超时工作。\n\n但NewJeans的合同删除了这些内容。专家表示，这使组合成员更难就工作条件提出异议。\n\n《纽约时报》获得的电子邮件显示，合同条款基本上没有协商余地。2022年1月，一名成员的母亲在签约前提出了几处修改要求。\n\nAdor副总裁回复说：“如果您无法接受目前的合同草案，包括上述几点，那么最好重新考虑是否签署这份合同。”\n\n世界各地的艺人都会调整自己的外在形象，但K-pop的娱乐公司经常为旗下艺人安排整容手术。这在韩国很少引起争议，因为韩国是全球整容手术比例最高的国家之一。\n\n据对前偶像的采访，K-pop厂牌敦促歌手做鼻整形或眼睑手术，哪怕有时对方只有十几岁。厂牌通常先垫付手术费用，之后再向艺人收费。\n\nNewJeans的合同规定，成员必须偿还公司在她们担任练习生期间为整容手术及其他美容项目支付的相当一部分费用\n\nNewJeans正式出道前，摄影师从多个角度为成员拍照，以便研究舞台灯光照在她们身上的效果。据两名与组合关系密切的人士透露，随后公司向其中几名成员建议接受美容整形。\n\nHybe代表在书面声明中表示，公司不要求艺人整容。“我们甚至不会违背个人意愿推荐整容手术或美容项目。”上述两名知情人士也表示，在整容十分普遍的韩国及其娱乐行业，这些建议并不被视为强迫。\n\n《纽约时报》不会披露NewJeans成员的医疗史。\n\n整容手术往往造成K-pop所谓的“练习生债务”。许多歌手职业生涯开始时，欠下训练和其他费用，然后通过演艺收入还债。\n\n在这方面，NewJeans是个例外。Hybe承担了组合早期的费用，因此成员从出道起便能获得收入，没有债务。公司代表表示，练习生费用如何处理由旗下各厂牌自行决定，NewJeans的情况由Ador决定。（Hybe目前正与Ador前首席执行官打官司。）\n\n专家表示，从财务角度看，NewJeans的合同在K-pop行业相当常见。扣除开支后，组合可以获得演唱会、广告和宣传活动约一半的利润，外加唱片销售和流媒体播放收入中的一小部分分成。\n\n拉波尔特说，这样的条款在美国会被认为“极其恶劣”，因为美国艺人可以自行聘请经纪人和代理，并保留大部分巡演收入。\n\n2024年10月，在NewJeans成为Spotify平台上最快达到10亿次播放量的K-pop艺人后，范玉欣在韩国国会作证时表示，她认为Ador憎恨她和其他成员。她指责公司员工在社交媒体上侮辱这个组合，在媒体报道中淡化她们的成就，有时甚至对她们不理不睬。\n\n但她的合同并不允许她公开发表这样的言论。合同禁止歌手传播可能损害公司声誉的“真实或虚假事实”，还禁止未成年人饮酒、吸毒，以及一些定义模糊的行为，例如“态度不真诚”“疏于自我管理”和“不适当的恋爱关系”。\n\n专家表示，这些条款给了唱片公司很大的解释空间，可以据此指控艺人违约。\n\n范玉欣作证几周后，NewJeans成员指责Ador向媒体泄露训练视频，并敦促公司改善对她们的待遇。\n\n双方协商无果后，NewJeans成员召开记者会，宣布退出该公司。这场反抗震动了整个行业。Ador随后提起诉讼，双方展开了长达数月的法律争斗。2025年3月，该组合宣布退出近一年后，法官作出有利于公司的裁决，认定NewJeans不能自行开展演艺活动。\n\n根据合同条款，这次试图反抗公司的举动使成员面临潜在诉讼和数百万美元赔偿的风险。\n\n根据提交韩国法院的一份会议记录，成员家属曾试图缓和矛盾，要求公司不要报复。\n\n公司没有给出这样的保证，称停摆已经让其损失了很多钱。\n\n2025年12月，公司终止了与NewJeans成员牟智慧的合同，并对当时20岁的她提起诉讼。公司称，她拒绝工作、未经授权独自开展项目和拍摄照片，还与第三方签订协议，违反了合同。\n\n牟智慧的律师表示，公司是在惩罚她参与此前的反抗行动。\n\n这起诉讼揭示了K-pop行业的一项特殊做法：合同通常允许公司要求支付解约金，即使是由公司而非歌手单方面终止合作关系也是如此。\n\n在牟智慧的案件中，公司向她索赔约2200万美元，其中大部分是解约赔偿金。公司声称，她的行为实际上已导致合同关系破裂。\n\n韩国政府的合同范本建议，根据艺人的平均月收入和合同剩余月数计算赔偿金额。NewJeans的合同采用了类似公式，但有所修改：计算平均收入时，不是把所有月份都计入，而是只计算组合有收入的月份。审阅合同的律师表示，这种修改可能抬高赔偿金额。\n\nHybe的代表表示，公司的解约赔偿条款符合行业标准。他们还称，实际操作中，这种计算方法不会增加赔偿金额，因为旗下艺人每个月都有收入。\n\n牟智慧的律师郑钟采（音）向韩国公平交易委员会提出投诉，指控Hybe和Ador试图终结她的演艺事业。\n\n郑钟采认为，牟智慧在公司以外开展的少量工作不过是借口，他表示，公司的真正目的是向整个行业发出警告。\n\n“如果你试图摆脱Hybe的控制，这就是你要付出的代价，”他说。\n\n根据韩国政府的合同范本，公司使用艺人姓名、肖像和声音的权利应随合同终止而结束。但NewJeans的合同并非如此。\n\n成员的合同将持续到2029年。此后，合同仍允许公司继续使用她们的身份形象，并将相关使用权授权给第三方。NewJeans成员仍有权获得报酬，但将无法控制自己的肖像和声音如何被使用，包括人工智能生成的NewJeans声音克隆和聊天机器人。\n\n法律专家表示，这些合同条款究竟能在多大程度上得到法院支持，目前尚不清楚。\n\nHybe还可以在合同结束后继续出售和重新包装NewJeans的音乐作品，同时大幅削减应支付给成员的报酬。法律专家称，这一条款并不寻常。\n\nNewJeans的未来仍充满不确定性。公司曾暗示可能推出新专辑，但组合已经一年多没有登台演出。", "link": "https://cn.nytimes.com/culture/20261106/kpop-newjeans-contract/?utm_source=RSS", "time": "11月06日 03:22", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "“敌人是我们自己”：揭秘特朗普团队的历史性溃败", "title_zh": "“敌人是我们自己”：揭秘特朗普团队的历史性溃败", "summary_orig": "特朗普在经济等诸多问题上失去了公众信任。时报采访了多名内部人士，详细解释了一位不受欢迎的总统和一场不受欢迎的战争如何为民主党的中期选举中全面胜利提供了机会。 Doug Mills/The New York Times 上个月，特朗普总统在蒙大拿州卡利斯佩尔市参加了一场竞选集会。", "summary_zh": "特朗普在经济等诸多问题上失去了公众信任。时报采访了多名内部人士，详细解释了一位不受欢迎的总统和一场不受欢迎的战争如何为民主党的中期选举中全面胜利提供了机会。 Doug Mills/The New York Times 上个月，特朗普总统在蒙大拿州卡利斯佩尔市参加了一场竞选集会。", "body_orig": "", "body_zh": "选举前六天，唐纳德·特朗普总统的二十多名高级策略师连入了一场私密的视频通话。\n\n“你们是想先吃白药丸，还是黑药丸？”总统的首席民调专家托尼·法布里齐奥问道。\n\n共和党顶级数据顾问之一蒂姆·萨勒给出了两种可能情形。第一个是拥有4亿美元经费的超级政治行动委员会“MAGA公司”(MAGA Inc.)有效动员了他们想动员且预计会投票的选民。“这是乐观的设想，”他说。\n\n据参与通话的四人透露，离开白宫转而负责监督总统的中期选举策略的詹姆斯·布莱尔在笑声中说：“我正在安排后事。我建议大家也早做准备。”\n\n在大约30分钟的时间里，通话内容充斥着黑色幽默：葬礼安排、监狱伙食、总统赦免，甚至还一度聊到流亡海外。\n\n“至少比比赢了。他会保护我们的，”在提及以色列总理本雅明·内塔尼亚胡时，布莱尔讽刺地说道，内塔尼亚胡的国家在前一天举行了投票。（内塔尼亚胡的阵营未能获得多数席位，其党派随后声称选举存在舞弊。）\n\n“也许我们能在以色列获得庇护，”法布里齐奥说。\n\n民主党人以压倒性优势夺得众议院多数席位，并赢得了参议院的控制权。这是一场了不起的胜利，得益于民主党人在堪萨斯州、南卡罗来纳州和得克萨斯州等共和党重镇的胜利。一年前几乎无人能够预料到这样的结果。\n\n本文记述的共和党崩溃基于对70多人的采访，受访者包括直接参与中期选举的议员、政治策略师、党派领袖、民调专家、白宫官员和国会助手。其中许多人获准匿名发言，以便披露不为外界所知的谈话内容和决策过程。\n\n共和党人拥有创纪录的筹款规模、世界首富的支持、最高法院一项有利于竞选资金的裁决，并且面对着一个士气低落且不受欢迎的反对党。\n\n在参议院，目前的竞选版图使得民主党人不得不在几十年未曾赢过的州展开竞争。\n\n而在众议院，特朗普团队打破了每十年重划一次国会选区的传统，试图通过划定新选区来帮助共和党巩固其微弱的多数席位。\n\n共和党人无法克服的难关在于，总统在经济及其他诸多问题上失去了公众信任。他们未曾料到的是，一场在中东发生的不受欢迎的战争——这场战争导致霍尔木兹海峡关闭，并将汽油价格推高至每加仑4美元以上——会一路蔓延，贯穿整个选举。\n\n而这一次，民主党人做好了准备，抓住了共和党人的失误。\n\n布莱尔今夏分发给白宫西翼官员的演示文稿展现出了严峻的形势。\n\n其中一张幻灯片将共和党的民调数据与伊朗战争的时间表联系在了一起。\n\n它展示了民主党的优势如何在激烈的敌对行动期间扩大，在“谅解备忘录”谈判期间缩小，随后在停火破裂时再度飙升。\n\n截至7月底，民主党人在国会选票上已经占据了10个百分点的优势。\n\n最终的“结论”显而易见。内容用荧光黄标出：如果民主党人只有4个百分点的优势，共和党人仍然有可能赢得众议院。“但这必须在停火延长、霍尔木兹海峡开放且汽油价格下降的情况下才会发生，”幻灯片警告称。\n\n“接近D+10的最终结果可能会让我们失去参议院。”\n\n周二的实际结果甚至更糟：根据《纽约时报》估计，特朗普的共和党在全国国会选举总票数上预计将以约13个百分点的劣势落败。这将是自​​水门事件之后，半个世纪以来最惨重的败局。\n\n甚至在投票站关闭之前，特朗普就已经开始反复回想原本可能发生的情况。\n\n“如果我们当初没有卷入伊朗，你认为中期选举会发生什么？”据一位与总统交谈过的人士透露，总统曾私下这样问道。\n\n这场战争之所以成为如此巨大的影响因素，是因为它向选民讲述了一个简单的故事。\n\n作为候选人，特朗普曾承诺不发动新战争，但他发动了一场新战争。\n\n他承诺降低物价，但汽油价格飙升，通货膨胀加剧。\n\n共和党中期选举崩盘的故事不仅是一个打破承诺的故事，也是一个激进越权的故事。在特朗普从2021年1月6日之后的政治弃儿状态中回归后，一些顾问认为他已经开始相信，政治规则唯独对他不再适用。那种错觉在周二晚上被彻底粉碎了。\n\n近两年里，傲慢已经成为特朗普第二任期的治理哲学。\n\n层出不穷的调查报道揭露，特朗普、他的家人及其亲密伙伴利用总统职位明目张胆地为自己敛财。这些报道开始引起选民的共鸣；福克斯新闻10月初的一项民调显示，腐败是选民最关心的问题。（白宫发言人安娜·凯利表示：“总统行事只考虑美国人民的最大利益。不存在利益冲突。”）\n\n2025年，特朗普对全世界发动了一场贸易战——一年多后，堪萨斯州、得克萨斯州和爱荷华州的农场依然能真切感受到由此导致的痛苦，这些州的竞选争夺也突然间激烈起来。\n\n他的团队的一些成员感到恼火，因为比起边境问题，特朗普似乎更多地在谈论他的新宴会厅；比起食品价格，他更关心高尔夫球场；比起通货膨胀，他更在意室内装饰。\n\n在中期选举前夕，他将最后的陈述重点放在他对国家广场倒影池的翻修上，并开玩笑说他正考虑用自己的名字取代亚伯拉罕·林肯的命名。\n\n与过去不同的是，民主党人很大程度上忽略了特朗普每天转移注意力的举动，而是试图将腐败与生活成本联系起来。他们还讲述了一个政府只关注精英、普通人却在苦苦挣扎的故事——这其中包括受保护的杰弗里·爱泼斯坦同伙，以及总统个人赚取的22亿美元。\n\n在众议院，民主党人迅速而意外地反击了特朗普的重划选区计划，并派遣强有力的候选人深入红色阵营以扩大版图。在参议院，他们找到了一批优质的候选人，让曾经不可撼动的州也变得充满悬念。在竞选最后那狂乱的几周里，共和党人不得不将资金从北卡罗来纳州和佐治亚州等传统的摇摆州转移出来，试图稳固南卡罗来纳州甚至密西西比州的传统基本盘。\n\n少数党领袖、如今已是候任议长的纽约州民主党众议员哈基姆·杰弗里斯表示，伊朗战争加剧了两党之间的对比。\n\n共和党人曾试图将中期选举定性为“常识与疯狂”之间的选择，并无情地攻击左翼中不断崛起的民主社会主义派。\n\n然而，特朗普自己的民调专家在选举前两周进行的最终调查显示，尽管MAGA共和党的品牌和民主社会主义者在选民中都不受欢迎，但MAGA背负了更多的包袱。当不打算投票的共和党人被问及需要什么才能赢回他们的选票时，他们排名前两位的回答是结束战争和解决通货膨胀。\n\n“MAGA公司”超级政治行动委员会发言人亚历克斯·法伊弗表示，该组织“对政治环境的清醒客观认识”促使他们将资金投入到了共和党在缅因州、佛罗里达州、田纳西州、纽约州和得克萨斯州处于领先的众议院竞选中。\n\n“那些兜售这些捏造的引语和虚假流言的人不仅贬低和轻视了总统为该党中期选举所作的历史性的、慷慨的投资，还诽谤了许多为这一努力做出贡献的人的辛勤工作，”他在一份声明中表示。“他们是懦夫和失败者。”\n\n一位拒绝具名的白宫官员在回应本文的报道时说：“特朗普总统不在选票上，而事实证明，当他在选票上时，他的选民就会出来投票。候选人的素质很重要，而特朗普总统在推介选票上的许多候选人方面做得比候选人自己还要出色。”\n\n事实证明，没有哪个候选人比丑闻缠身的得克萨斯州总检察长肯·帕克斯顿让共和党付出的代价更大。特朗普选择支持帕克斯顿而不是在任共和党参议员约翰·科宁，尽管一年来一直有人在警告，帕克斯顿会让这个席位陷入险境。共和党最终被迫在得州投入近3亿美元，这笔钱本可用于巩固其他州的候选人。帕克斯顿以12个百分点的差距落败。\n\n在最近的另一次通话中，特朗普团队嘲笑了他们试图助选的一些共和党人的倒霉相。\n\n“我看到了敌人，”布莱尔一周前对该团队说。“那正是我们自己。”\n\n法布里齐奥回答道：“在很多地方都是这样。”\n\n2025年5月，舒默来到位于纽约哈德逊河谷的高档度假村野花农场，与捐助者和党派官员进行了一次秘密闭门会议。他迫切需要扩大参议院的选举版图。\n\n为了夺取参议院控制权，民主党人需要保住他们现有的所有席位，并至少翻盘四个席位，其中包括特朗普在2024年轻松获胜的州。\n\n舒默花了数月时间争取北卡罗来纳州颇受欢迎的民主党前州长罗伊·库珀，并至少三次前往俄亥俄州，劝说前参议员谢罗德·布朗出山，布朗虽在2024年败选，但他的民粹主义风格恰好契合了当时全国的民情。\n\n“如果你退休了，而我们以一票之差失去多数席位，你将无法安享退休生活，”舒默回忆起他对73岁的布朗说的话。\n\n在众议院，民主党人在2024年以三席之差落败。这次招募人员前往特朗普曾以10个百分点或更大优势拿下的选区寻找候选人，他们早早押注这位气焰嚣张的总统将会越权行事。\n\n他们开始招募具有独特背景的候选人：退伍军人、医生、农民、空降消防员、特哈诺音乐明星——几乎涵盖了任何不具有典型职业政治人士特征的人。\n\n与此同时，特朗普正试图重绘众议院选区版图本身。\n\n2025年春，时任副幕僚长布莱尔向总统提交了一项在十年中期重新划定国会选区版图的计划，以确保共和党人的席位更加稳固。这场选区划分操纵行动始于得克萨斯州，很快蔓延至其他由共和党主导的州。\n\n从一开始，布莱尔对他的重划选区计划就非常自信，他和总统都无视了那些担心此举会适得其反的共和党人的担忧。\n\n但到了2026年4月，民主党人有充分理由相信，他们通过在几个蓝州重划选区已经化解了这一威胁。杰弗里斯举行了一场庆祝新闻发布会，展示了一张印有特朗普和布莱尔面孔的海报，上面还印着《纽约时报》一篇关于重划选区文章中的匿名引语：“随时随地进行最高级别的战争。”\n\n当布莱尔看到这张海报时，他给杰弗里斯的一位高级助手吉迪恩·布拉金发短信说：“你能把这海报复印一份送到我办公室吗？”\n\n他未能如愿，这张海报一直留在众议院民主党总部，直到选举日那天，一股蓝色的浪潮甚至席卷了许多原本被划定为有利于共和党的选区。\n\n2026年伊始，政府加强移民执法的行动在明尼阿波利斯演变成了暴力事件，两名抗议者被联邦特工开枪打死。这两起枪杀事件都被视频记录了下来。\n\n明尼阿波利斯事件发生后不久，民主党内部的民调显示，该党首次在移民问题上占据了优势。据总统的一位高级策略师表示，曾是特朗普长期优势之一的议题在一段时间内成了他最大的包袱。\n\n随后，在第二起枪击事件发生大约五周后，特朗普带领国家在伊朗卷入了战争。\n\n布莱尔起初认同他老板的乐观情绪，认为战争会迅速取得胜利。他向持怀疑态度的同事保证，冲突不会像某些人担心的那样成为一场政治灾难，因为一些国防部官员曾向白宫保证，冲突会迅速得到解决。", "body": "选举前六天，唐纳德·特朗普总统的二十多名高级策略师连入了一场私密的视频通话。\n\n“你们是想先吃白药丸，还是黑药丸？”总统的首席民调专家托尼·法布里齐奥问道。\n\n共和党顶级数据顾问之一蒂姆·萨勒给出了两种可能情形。第一个是拥有4亿美元经费的超级政治行动委员会“MAGA公司”(MAGA Inc.)有效动员了他们想动员且预计会投票的选民。“这是乐观的设想，”他说。\n\n据参与通话的四人透露，离开白宫转而负责监督总统的中期选举策略的詹姆斯·布莱尔在笑声中说：“我正在安排后事。我建议大家也早做准备。”\n\n在大约30分钟的时间里，通话内容充斥着黑色幽默：葬礼安排、监狱伙食、总统赦免，甚至还一度聊到流亡海外。\n\n“至少比比赢了。他会保护我们的，”在提及以色列总理本雅明·内塔尼亚胡时，布莱尔讽刺地说道，内塔尼亚胡的国家在前一天举行了投票。（内塔尼亚胡的阵营未能获得多数席位，其党派随后声称选举存在舞弊。）\n\n“也许我们能在以色列获得庇护，”法布里齐奥说。\n\n民主党人以压倒性优势夺得众议院多数席位，并赢得了参议院的控制权。这是一场了不起的胜利，得益于民主党人在堪萨斯州、南卡罗来纳州和得克萨斯州等共和党重镇的胜利。一年前几乎无人能够预料到这样的结果。\n\n本文记述的共和党崩溃基于对70多人的采访，受访者包括直接参与中期选举的议员、政治策略师、党派领袖、民调专家、白宫官员和国会助手。其中许多人获准匿名发言，以便披露不为外界所知的谈话内容和决策过程。\n\n共和党人拥有创纪录的筹款规模、世界首富的支持、最高法院一项有利于竞选资金的裁决，并且面对着一个士气低落且不受欢迎的反对党。\n\n在参议院，目前的竞选版图使得民主党人不得不在几十年未曾赢过的州展开竞争。\n\n而在众议院，特朗普团队打破了每十年重划一次国会选区的传统，试图通过划定新选区来帮助共和党巩固其微弱的多数席位。\n\n共和党人无法克服的难关在于，总统在经济及其他诸多问题上失去了公众信任。他们未曾料到的是，一场在中东发生的不受欢迎的战争——这场战争导致霍尔木兹海峡关闭，并将汽油价格推高至每加仑4美元以上——会一路蔓延，贯穿整个选举。\n\n而这一次，民主党人做好了准备，抓住了共和党人的失误。\n\n布莱尔今夏分发给白宫西翼官员的演示文稿展现出了严峻的形势。\n\n其中一张幻灯片将共和党的民调数据与伊朗战争的时间表联系在了一起。\n\n它展示了民主党的优势如何在激烈的敌对行动期间扩大，在“谅解备忘录”谈判期间缩小，随后在停火破裂时再度飙升。\n\n截至7月底，民主党人在国会选票上已经占据了10个百分点的优势。\n\n最终的“结论”显而易见。内容用荧光黄标出：如果民主党人只有4个百分点的优势，共和党人仍然有可能赢得众议院。“但这必须在停火延长、霍尔木兹海峡开放且汽油价格下降的情况下才会发生，”幻灯片警告称。\n\n“接近D+10的最终结果可能会让我们失去参议院。”\n\n周二的实际结果甚至更糟：根据《纽约时报》估计，特朗普的共和党在全国国会选举总票数上预计将以约13个百分点的劣势落败。这将是自​​水门事件之后，半个世纪以来最惨重的败局。\n\n甚至在投票站关闭之前，特朗普就已经开始反复回想原本可能发生的情况。\n\n“如果我们当初没有卷入伊朗，你认为中期选举会发生什么？”据一位与总统交谈过的人士透露，总统曾私下这样问道。\n\n这场战争之所以成为如此巨大的影响因素，是因为它向选民讲述了一个简单的故事。\n\n作为候选人，特朗普曾承诺不发动新战争，但他发动了一场新战争。\n\n他承诺降低物价，但汽油价格飙升，通货膨胀加剧。\n\n共和党中期选举崩盘的故事不仅是一个打破承诺的故事，也是一个激进越权的故事。在特朗普从2021年1月6日之后的政治弃儿状态中回归后，一些顾问认为他已经开始相信，政治规则唯独对他不再适用。那种错觉在周二晚上被彻底粉碎了。\n\n近两年里，傲慢已经成为特朗普第二任期的治理哲学。\n\n层出不穷的调查报道揭露，特朗普、他的家人及其亲密伙伴利用总统职位明目张胆地为自己敛财。这些报道开始引起选民的共鸣；福克斯新闻10月初的一项民调显示，腐败是选民最关心的问题。（白宫发言人安娜·凯利表示：“总统行事只考虑美国人民的最大利益。不存在利益冲突。”）\n\n2025年，特朗普对全世界发动了一场贸易战——一年多后，堪萨斯州、得克萨斯州和爱荷华州的农场依然能真切感受到由此导致的痛苦，这些州的竞选争夺也突然间激烈起来。\n\n他的团队的一些成员感到恼火，因为比起边境问题，特朗普似乎更多地在谈论他的新宴会厅；比起食品价格，他更关心高尔夫球场；比起通货膨胀，他更在意室内装饰。\n\n在中期选举前夕，他将最后的陈述重点放在他对国家广场倒影池的翻修上，并开玩笑说他正考虑用自己的名字取代亚伯拉罕·林肯的命名。\n\n与过去不同的是，民主党人很大程度上忽略了特朗普每天转移注意力的举动，而是试图将腐败与生活成本联系起来。他们还讲述了一个政府只关注精英、普通人却在苦苦挣扎的故事——这其中包括受保护的杰弗里·爱泼斯坦同伙，以及总统个人赚取的22亿美元。\n\n在众议院，民主党人迅速而意外地反击了特朗普的重划选区计划，并派遣强有力的候选人深入红色阵营以扩大版图。在参议院，他们找到了一批优质的候选人，让曾经不可撼动的州也变得充满悬念。在竞选最后那狂乱的几周里，共和党人不得不将资金从北卡罗来纳州和佐治亚州等传统的摇摆州转移出来，试图稳固南卡罗来纳州甚至密西西比州的传统基本盘。\n\n少数党领袖、如今已是候任议长的纽约州民主党众议员哈基姆·杰弗里斯表示，伊朗战争加剧了两党之间的对比。\n\n共和党人曾试图将中期选举定性为“常识与疯狂”之间的选择，并无情地攻击左翼中不断崛起的民主社会主义派。\n\n然而，特朗普自己的民调专家在选举前两周进行的最终调查显示，尽管MAGA共和党的品牌和民主社会主义者在选民中都不受欢迎，但MAGA背负了更多的包袱。当不打算投票的共和党人被问及需要什么才能赢回他们的选票时，他们排名前两位的回答是结束战争和解决通货膨胀。\n\n“MAGA公司”超级政治行动委员会发言人亚历克斯·法伊弗表示，该组织“对政治环境的清醒客观认识”促使他们将资金投入到了共和党在缅因州、佛罗里达州、田纳西州、纽约州和得克萨斯州处于领先的众议院竞选中。\n\n“那些兜售这些捏造的引语和虚假流言的人不仅贬低和轻视了总统为该党中期选举所作的历史性的、慷慨的投资，还诽谤了许多为这一努力做出贡献的人的辛勤工作，”他在一份声明中表示。“他们是懦夫和失败者。”\n\n一位拒绝具名的白宫官员在回应本文的报道时说：“特朗普总统不在选票上，而事实证明，当他在选票上时，他的选民就会出来投票。候选人的素质很重要，而特朗普总统在推介选票上的许多候选人方面做得比候选人自己还要出色。”\n\n事实证明，没有哪个候选人比丑闻缠身的得克萨斯州总检察长肯·帕克斯顿让共和党付出的代价更大。特朗普选择支持帕克斯顿而不是在任共和党参议员约翰·科宁，尽管一年来一直有人在警告，帕克斯顿会让这个席位陷入险境。共和党最终被迫在得州投入近3亿美元，这笔钱本可用于巩固其他州的候选人。帕克斯顿以12个百分点的差距落败。\n\n在最近的另一次通话中，特朗普团队嘲笑了他们试图助选的一些共和党人的倒霉相。\n\n“我看到了敌人，”布莱尔一周前对该团队说。“那正是我们自己。”\n\n法布里齐奥回答道：“在很多地方都是这样。”\n\n2025年5月，舒默来到位于纽约哈德逊河谷的高档度假村野花农场，与捐助者和党派官员进行了一次秘密闭门会议。他迫切需要扩大参议院的选举版图。\n\n为了夺取参议院控制权，民主党人需要保住他们现有的所有席位，并至少翻盘四个席位，其中包括特朗普在2024年轻松获胜的州。\n\n舒默花了数月时间争取北卡罗来纳州颇受欢迎的民主党前州长罗伊·库珀，并至少三次前往俄亥俄州，劝说前参议员谢罗德·布朗出山，布朗虽在2024年败选，但他的民粹主义风格恰好契合了当时全国的民情。\n\n“如果你退休了，而我们以一票之差失去多数席位，你将无法安享退休生活，”舒默回忆起他对73岁的布朗说的话。\n\n在众议院，民主党人在2024年以三席之差落败。这次招募人员前往特朗普曾以10个百分点或更大优势拿下的选区寻找候选人，他们早早押注这位气焰嚣张的总统将会越权行事。\n\n他们开始招募具有独特背景的候选人：退伍军人、医生、农民、空降消防员、特哈诺音乐明星——几乎涵盖了任何不具有典型职业政治人士特征的人。\n\n与此同时，特朗普正试图重绘众议院选区版图本身。\n\n2025年春，时任副幕僚长布莱尔向总统提交了一项在十年中期重新划定国会选区版图的计划，以确保共和党人的席位更加稳固。这场选区划分操纵行动始于得克萨斯州，很快蔓延至其他由共和党主导的州。\n\n从一开始，布莱尔对他的重划选区计划就非常自信，他和总统都无视了那些担心此举会适得其反的共和党人的担忧。\n\n但到了2026年4月，民主党人有充分理由相信，他们通过在几个蓝州重划选区已经化解了这一威胁。杰弗里斯举行了一场庆祝新闻发布会，展示了一张印有特朗普和布莱尔面孔的海报，上面还印着《纽约时报》一篇关于重划选区文章中的匿名引语：“随时随地进行最高级别的战争。”\n\n当布莱尔看到这张海报时，他给杰弗里斯的一位高级助手吉迪恩·布拉金发短信说：“你能把这海报复印一份送到我办公室吗？”\n\n他未能如愿，这张海报一直留在众议院民主党总部，直到选举日那天，一股蓝色的浪潮甚至席卷了许多原本被划定为有利于共和党的选区。\n\n2026年伊始，政府加强移民执法的行动在明尼阿波利斯演变成了暴力事件，两名抗议者被联邦特工开枪打死。这两起枪杀事件都被视频记录了下来。\n\n明尼阿波利斯事件发生后不久，民主党内部的民调显示，该党首次在移民问题上占据了优势。据总统的一位高级策略师表示，曾是特朗普长期优势之一的议题在一段时间内成了他最大的包袱。\n\n随后，在第二起枪击事件发生大约五周后，特朗普带领国家在伊朗卷入了战争。\n\n布莱尔起初认同他老板的乐观情绪，认为战争会迅速取得胜利。他向持怀疑态度的同事保证，冲突不会像某些人担心的那样成为一场政治灾难，因为一些国防部官员曾向白宫保证，冲突会迅速得到解决。", "link": "https://cn.nytimes.com/usa/20261106/trump-midterms-losses-republicans/?utm_source=RSS", "time": "11月06日 03:19", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "中期选举结果引发对人工智能监管焦虑，美股暴跌", "title_zh": "中期选举结果引发对人工智能监管焦虑，美股暴跌", "summary_orig": "民主党获胜后，投资人担心人工智能行业可能面临更严格监管，这加剧了此前已有的对科技企业支出失控、债务攀升的忧虑。美股遭遇近两年来最惨重单日跌幅。 By The New York Times 标准普尔500指数每日变化。数据来源：LSEG。", "summary_zh": "民主党获胜后，投资人担心人工智能行业可能面临更严格监管，这加剧了此前已有的对科技企业支出失控、债务攀升的忧虑。美股遭遇近两年来最惨重单日跌幅。 By The New York Times 标准普尔500指数每日变化。数据来源：LSEG。", "body_orig": "", "body_zh": "民主党在美国中期选举中获胜后，投资者担心人工智能行业可能面临更严格的监管，加之对该行业自身弱点的忧虑再度浮现，美股遭遇近两年来最惨重的单日跌幅。\n\n周四，标普500指数下跌4.4%，创下自2025年4月以来的最大单日跌幅。当时，特朗普总统宣布对全球实施大规模关税。\n\n以科技股为主的纳斯达克综合指数下跌5.5%，进入回调区间，也就是较近期高点下跌至少10%。作为半导体行业基准指标的费城半导体指数暴跌逾12%。自10月初以来，该指数累计下跌超过30%，较6月的峰值已下跌近40%。\n\n民主党赢得众议院和参议院多数席位后，市场周三最初上涨。投资者普遍乐见华盛顿陷入政治僵局，因为这意味着政府出台新法律法规、加强对企业监管的可能性降低。\n\n但到了周四上午，市场开始担心中期选举可能开启一个人工智能行业受到更严格审查的时期，这进一步加剧了此前已持续数周对科技企业支出失控、债务攀升的忧虑。\n\n一些分析师指出，民主党在几个正逐渐成为重要数据中心枢纽的州夺得了州长职位，这可能对人工智能基础设施建设构成实质性阻碍。\n\n当天股市跌势愈演愈烈，标普500指数所有板块无一幸免。股价暴跌之际，被视为市场动荡时期避险资产的10年期美国国债价格上涨，收益率随之降至4.83%，创下9月以来的最低水平。\n\nCetera金融集团首席投资官吉恩·戈德曼表示，随着抛售在当天不断加速，市场跌势已经有些“过头”。他预计股市将会出现反弹。\n\n“牛市中的回调通常不会持续太久，”他说。“现在的情况确实很难看，但我们确实认为市场很快就会反弹。”\n\n周四的下跌重新点燃了在选举前夕暂停的抛售。上周，当Meta和亚马逊等科技巨头公布季度业绩、披露了庞大的人工智能支出计划时，引发更猛烈的抛售。投资者愈发担心，这些投资究竟需要多久才能转化为利润增长。\n\n周四跌幅最大的一些股票来自芯片制造商。大型芯片制造商高通周四股价下跌9.5%。此前，该公司下调了盈利预期，表示芯片需求旺盛使其自身成本上升速度快于其提价能力。高通股价大跌也反映出市场更广泛的担忧：人工智能基础设施建设热潮造成的供应瓶颈可能拖慢整个行业的增长，进而延长投资者从人工智能投资中获得回报所需的时间。\n\n另一家芯片制造商安谋控股因进军人工智能领域的业务收入不及预期，股价下跌13.1%。\n\n芯片行业领头羊英伟达下跌9.3%，使其今年以来的累计涨幅化为乌有，转为下跌。\n\n埃隆·马斯克旗下的特斯拉和SpaceX股价连续第二天大幅下跌。这两家公司均由世界首富、共和党巨额捐款人马斯克掌管。 选举结束后，两家公司受到格外密切的关注 ，未来它们可能面临调查和更严格的监管审查。\n\n相比整体市场，Alphabet和微软等大型“超大规模云计算服务商”周四的股价跌幅较小。一些分析师认为，人工智能基础设施建设竞赛如果放缓，反而可能有利于这些根基稳固的大型企业，既能巩固它们的主导地位，也能减缓此前令其承受压力的快速支出增长。\n\n“这里的基本逻辑是，建设速度放缓，对那些花钱投资的企业可能相对有利，而对那些收取投资资金的企业则未必是好事，”城堡证券宏观策略主管弗兰克·弗莱特说。\n\n分析师总体上仍对股市前景乐观，预计一旦当前波动消退，主要指数将反弹，不过，也有人认为，市场的剧烈震荡可能持续到年底。\n\n许多分析师认为，此轮科技股抛售是市场资金轮动的一部分。资金正从此前引领股市上涨的部分企业撤出，转向下一批有望从人工智能技术普及中受益的公司，例如医疗保健和金融企业。\n\n不少分析师还指出，自第二次世界大战以来，每次美国中期选举结束后的12个月里，标普500指数均实现上涨。今年以来，该指数仍累计上涨7.4%。\n\n“其中一些股票的估值此前已经被炒得过高，因此如今出现这样的情况，并不完全令人意外，”Regions Bank首席投资官艾伦·麦克奈特说。", "body": "民主党在美国中期选举中获胜后，投资者担心人工智能行业可能面临更严格的监管，加之对该行业自身弱点的忧虑再度浮现，美股遭遇近两年来最惨重的单日跌幅。\n\n周四，标普500指数下跌4.4%，创下自2025年4月以来的最大单日跌幅。当时，特朗普总统宣布对全球实施大规模关税。\n\n以科技股为主的纳斯达克综合指数下跌5.5%，进入回调区间，也就是较近期高点下跌至少10%。作为半导体行业基准指标的费城半导体指数暴跌逾12%。自10月初以来，该指数累计下跌超过30%，较6月的峰值已下跌近40%。\n\n民主党赢得众议院和参议院多数席位后，市场周三最初上涨。投资者普遍乐见华盛顿陷入政治僵局，因为这意味着政府出台新法律法规、加强对企业监管的可能性降低。\n\n但到了周四上午，市场开始担心中期选举可能开启一个人工智能行业受到更严格审查的时期，这进一步加剧了此前已持续数周对科技企业支出失控、债务攀升的忧虑。\n\n一些分析师指出，民主党在几个正逐渐成为重要数据中心枢纽的州夺得了州长职位，这可能对人工智能基础设施建设构成实质性阻碍。\n\n当天股市跌势愈演愈烈，标普500指数所有板块无一幸免。股价暴跌之际，被视为市场动荡时期避险资产的10年期美国国债价格上涨，收益率随之降至4.83%，创下9月以来的最低水平。\n\nCetera金融集团首席投资官吉恩·戈德曼表示，随着抛售在当天不断加速，市场跌势已经有些“过头”。他预计股市将会出现反弹。\n\n“牛市中的回调通常不会持续太久，”他说。“现在的情况确实很难看，但我们确实认为市场很快就会反弹。”\n\n周四的下跌重新点燃了在选举前夕暂停的抛售。上周，当Meta和亚马逊等科技巨头公布季度业绩、披露了庞大的人工智能支出计划时，引发更猛烈的抛售。投资者愈发担心，这些投资究竟需要多久才能转化为利润增长。\n\n周四跌幅最大的一些股票来自芯片制造商。大型芯片制造商高通周四股价下跌9.5%。此前，该公司下调了盈利预期，表示芯片需求旺盛使其自身成本上升速度快于其提价能力。高通股价大跌也反映出市场更广泛的担忧：人工智能基础设施建设热潮造成的供应瓶颈可能拖慢整个行业的增长，进而延长投资者从人工智能投资中获得回报所需的时间。\n\n另一家芯片制造商安谋控股因进军人工智能领域的业务收入不及预期，股价下跌13.1%。\n\n芯片行业领头羊英伟达下跌9.3%，使其今年以来的累计涨幅化为乌有，转为下跌。\n\n埃隆·马斯克旗下的特斯拉和SpaceX股价连续第二天大幅下跌。这两家公司均由世界首富、共和党巨额捐款人马斯克掌管。 选举结束后，两家公司受到格外密切的关注 ，未来它们可能面临调查和更严格的监管审查。\n\n相比整体市场，Alphabet和微软等大型“超大规模云计算服务商”周四的股价跌幅较小。一些分析师认为，人工智能基础设施建设竞赛如果放缓，反而可能有利于这些根基稳固的大型企业，既能巩固它们的主导地位，也能减缓此前令其承受压力的快速支出增长。\n\n“这里的基本逻辑是，建设速度放缓，对那些花钱投资的企业可能相对有利，而对那些收取投资资金的企业则未必是好事，”城堡证券宏观策略主管弗兰克·弗莱特说。\n\n分析师总体上仍对股市前景乐观，预计一旦当前波动消退，主要指数将反弹，不过，也有人认为，市场的剧烈震荡可能持续到年底。\n\n许多分析师认为，此轮科技股抛售是市场资金轮动的一部分。资金正从此前引领股市上涨的部分企业撤出，转向下一批有望从人工智能技术普及中受益的公司，例如医疗保健和金融企业。\n\n不少分析师还指出，自第二次世界大战以来，每次美国中期选举结束后的12个月里，标普500指数均实现上涨。今年以来，该指数仍累计上涨7.4%。\n\n“其中一些股票的估值此前已经被炒得过高，因此如今出现这样的情况，并不完全令人意外，”Regions Bank首席投资官艾伦·麦克奈特说。", "link": "https://cn.nytimes.com/business/20261106/stocks-midterms-artificial-intelligence/?utm_source=RSS", "time": "11月06日 11:08", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "众议院领导人要求黄仁勋出席简报会，说明与中国高管往来", "title_zh": "众议院领导人要求黄仁勋出席简报会，说明与中国高管往来", "summary_orig": "三名共和党领导人要求黄仁勋自愿出席闭门简报会，说明他与一名中国高管的往来。此前时报报道，黄仁勋与该高管关系密切，此人被认定向中国情报机构输送信息。 Manuel Orbegozo for The New York Times 要求英伟达首席执行官黄仁勋出席简报会标志着共和党国会领导层态度的转变——此前他们对科技行业大多采取放任态度。", "summary_zh": "三名共和党领导人要求黄仁勋自愿出席闭门简报会，说明他与一名中国高管的往来。此前时报报道，黄仁勋与该高管关系密切，此人被认定向中国情报机构输送信息。 Manuel Orbegozo for The New York Times 要求英伟达首席执行官黄仁勋出席简报会标志着共和党国会领导层态度的转变——此前他们对科技行业大多采取放任态度。", "body_orig": "", "body_zh": "三个有影响力的众议院委员会的共和党领导人周四要求英伟达首席执行官黄仁勋自愿出席一场闭门简报会，说明他与一家新加坡公司一名高管的往来。美国官员认定，这名高管向中国情报机构输送信息。\n\n提出这一 要求 的是众议院外交事务委员会主席布赖恩·马斯特、众议院中共问题特别委员会主席约翰·穆勒纳尔，以及情报特别委员会主席里克·克劳福德。\n\n上周 《纽约时报》报道 ，黄仁勋与Megaspeed公司高管爱丽丝·黄（中文名黄乐，音）关系密切。 美国政府怀疑 该公司帮助中国规避美国禁令，获取英伟达的人工智能芯片。\n\n这些众议院领导人要求黄仁勋于11月18日出席简报会，就其与黄乐的往来，以及英伟达为防范外国对手间谍活动而制定的安全政策进行说明。\n\n他们写道：“国会必须确定美国国家安全所面临的风险程度，这一点至关重要。”\n\n英伟达发言人约翰·里佐拒绝评论黄仁勋是否会出席。“我们的首席执行官有一支优秀的安全团队，在需要时会随行，”里佐在声明中说。\n\n这一要求标志着共和党国会领导人的转变。此前，他们大多追随特朗普总统，对科技行业采取不干预态度。过去两年，黄仁勋与特朗普建立了密切关系，两人经常谈论技术问题。\n\n这三名共和党人的举动也发生在中期选举之后。选民在选举中明确表示，他们担心科技行业对自身生活的影响，从人工智能可能消除工作岗位，到社区内大型数据中心的建设。\n\n反科技情绪大体上有利于民主党候选人，而共和党人周四的举动是一个早期迹象，表明他们不想把这一具有政治影响力的议题拱手让给民主党。\n\n美国间谍机构通过对黄乐的监视得知了这一关系，这在联邦政府内部引发警报，因为她可能从黄仁勋那里搜集重要的贸易或国家安全信息。\n\n2025年4月，穆勒纳尔和专注于北京国家安全威胁的众议院中共问题特别委员会 对英伟达在亚洲销售芯片展开调查 。\n\n但在随后几个月里，特朗普政府放宽了对英伟达向中国销售芯片的限制。\n\n在特朗普总统的首次中东外交之行中，黄仁勋陪同在侧，期间总统提到了向阿联酋和沙特阿拉伯出售大规模芯片的交易。英伟达还向白宫宴会厅厅捐赠超过2000万美元，并承诺在美国制造业投资5000亿美元。\n\n6月，黄仁勋拒绝了马萨诸塞州民主党参议员伊丽莎白·沃伦的 要求 ，未出席参议院听证会。该委员会监督有关海外芯片销售的规则。\n\n上周，在《纽约时报》报道黄仁勋与黄乐的关系后，沃伦 再次呼吁 黄仁勋出席听证会。\n\n2025年，一家鲜为人知的公司Megaspeed横空出世，购买数十亿美元的人工智能芯片。黄乐是中国公民，在公司成立最初八个月被列为董事总经理，后来在公司文件中不再担任该职务。公司后来任命了一名来自新加坡、常驻上海的董事。\n\n根据从贸易平台ImportGenius获得的贸易记录，从2024年6月到2026年2月，Megaspeed在马来西亚的姊妹公司购买了至少48亿美元包含英伟达芯片和技术的先进人工智能设备。\n\n美国政府自2024年底以来一直在调查Megaspeed。当时一名商务部官员访问了该公司的马来西亚数据中心，发现该场所情况可疑。英伟达设备仍装在箱子里，表明设备是被运进或运出，而非安装在那里。\n\n英伟达表示，公司遵守法律，没有证据表明其芯片被走私到中国。里佐上周在一份声明中说，黄仁勋“与黄女士的互动并非不同寻常或出人意料”。他还说：“与客户会面是首席执行官工作的一部分；黄仁勋每年与数以千计客户高管交谈。”", "body": "三个有影响力的众议院委员会的共和党领导人周四要求英伟达首席执行官黄仁勋自愿出席一场闭门简报会，说明他与一家新加坡公司一名高管的往来。美国官员认定，这名高管向中国情报机构输送信息。\n\n提出这一 要求 的是众议院外交事务委员会主席布赖恩·马斯特、众议院中共问题特别委员会主席约翰·穆勒纳尔，以及情报特别委员会主席里克·克劳福德。\n\n上周 《纽约时报》报道 ，黄仁勋与Megaspeed公司高管爱丽丝·黄（中文名黄乐，音）关系密切。 美国政府怀疑 该公司帮助中国规避美国禁令，获取英伟达的人工智能芯片。\n\n这些众议院领导人要求黄仁勋于11月18日出席简报会，就其与黄乐的往来，以及英伟达为防范外国对手间谍活动而制定的安全政策进行说明。\n\n他们写道：“国会必须确定美国国家安全所面临的风险程度，这一点至关重要。”\n\n英伟达发言人约翰·里佐拒绝评论黄仁勋是否会出席。“我们的首席执行官有一支优秀的安全团队，在需要时会随行，”里佐在声明中说。\n\n这一要求标志着共和党国会领导人的转变。此前，他们大多追随特朗普总统，对科技行业采取不干预态度。过去两年，黄仁勋与特朗普建立了密切关系，两人经常谈论技术问题。\n\n这三名共和党人的举动也发生在中期选举之后。选民在选举中明确表示，他们担心科技行业对自身生活的影响，从人工智能可能消除工作岗位，到社区内大型数据中心的建设。\n\n反科技情绪大体上有利于民主党候选人，而共和党人周四的举动是一个早期迹象，表明他们不想把这一具有政治影响力的议题拱手让给民主党。\n\n美国间谍机构通过对黄乐的监视得知了这一关系，这在联邦政府内部引发警报，因为她可能从黄仁勋那里搜集重要的贸易或国家安全信息。\n\n2025年4月，穆勒纳尔和专注于北京国家安全威胁的众议院中共问题特别委员会 对英伟达在亚洲销售芯片展开调查 。\n\n但在随后几个月里，特朗普政府放宽了对英伟达向中国销售芯片的限制。\n\n在特朗普总统的首次中东外交之行中，黄仁勋陪同在侧，期间总统提到了向阿联酋和沙特阿拉伯出售大规模芯片的交易。英伟达还向白宫宴会厅厅捐赠超过2000万美元，并承诺在美国制造业投资5000亿美元。\n\n6月，黄仁勋拒绝了马萨诸塞州民主党参议员伊丽莎白·沃伦的 要求 ，未出席参议院听证会。该委员会监督有关海外芯片销售的规则。\n\n上周，在《纽约时报》报道黄仁勋与黄乐的关系后，沃伦 再次呼吁 黄仁勋出席听证会。\n\n2025年，一家鲜为人知的公司Megaspeed横空出世，购买数十亿美元的人工智能芯片。黄乐是中国公民，在公司成立最初八个月被列为董事总经理，后来在公司文件中不再担任该职务。公司后来任命了一名来自新加坡、常驻上海的董事。\n\n根据从贸易平台ImportGenius获得的贸易记录，从2024年6月到2026年2月，Megaspeed在马来西亚的姊妹公司购买了至少48亿美元包含英伟达芯片和技术的先进人工智能设备。\n\n美国政府自2024年底以来一直在调查Megaspeed。当时一名商务部官员访问了该公司的马来西亚数据中心，发现该场所情况可疑。英伟达设备仍装在箱子里，表明设备是被运进或运出，而非安装在那里。\n\n英伟达表示，公司遵守法律，没有证据表明其芯片被走私到中国。里佐上周在一份声明中说，黄仁勋“与黄女士的互动并非不同寻常或出人意料”。他还说：“与客户会面是首席执行官工作的一部分；黄仁勋每年与数以千计客户高管交谈。”", "link": "https://cn.nytimes.com/usa/20261106/house-republicans-nvidia-jensen-huang-china/?utm_source=RSS", "time": "11月06日 09:51", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "中国阻止软银以54亿美元收购ABB机器人业务", "title_zh": "中国阻止软银以54亿美元收购ABB机器人业务", "summary_orig": "瑞士-瑞典工业公司ABB表示，将其机器人部门出售给软银的交易遭到中国监管机构否决。此举表明中国正采取更为强硬的方式审查涉及关键技术和敏感行业的外国企业交易。 Moritz Hager/Reuters 中国是ABB最大的机器人业务市场，该公司为中国客户生产的机器绝大部分在当地制造。", "summary_zh": "瑞士-瑞典工业公司ABB表示，将其机器人部门出售给软银的交易遭到中国监管机构否决。此举表明中国正采取更为强硬的方式审查涉及关键技术和敏感行业的外国企业交易。 Moritz Hager/Reuters 中国是ABB最大的机器人业务市场，该公司为中国客户生产的机器绝大部分在当地制造。", "body_orig": "", "body_zh": "中国监管部门阻止了日本科技巨头软银一项价值数十亿美元的机器人业务扩张计划，显示出北京愿意干预可能影响自身技术发展雄心的全球商业交易。\n\n周四，瑞士-瑞典工业公司ABB 表示 ，去年宣布的以54亿美元将其机器人部门出售给软银的交易遭到中国一家负责对外国投资进行国家安全审查的监管机构否决。\n\n软银的这笔收购需要获得中国批准，部分原因是ABB有很大一部分销售收入来自中国。ABB在上海设有一家工厂，生产多种产品，主要用于制造业，以及重型物料搬运、抛光等作业的自动化。\n\n中国正采取更为强硬的方式审查涉及关键技术和敏感行业的外国企业交易。今年4月，监管机构迫使Meta撤销了以20亿美元收购中国人工智能初创企业Manus的交易。\n\n在阻止Manus收购案时，中国当局以国家安全问题为由采取行动。外界认为，此举表明中国政府决心防止重要技术和优秀工程人才被外国企业收购。\n\n随着技术发展在政府规划中的战略地位日益突出，中国对外国企业交易的严格审查也让企业对在华经营产生了更多顾虑。美国、欧盟和英国的监管机构同样曾干预涉及半导体、量子计算及其他技术领域的交易。\n\nABB总部位于苏黎世，与中国制造业企业有着长达数十年的联系，因此能够获取宝贵的机器人技术数据。中国是ABB最大的机器人业务市场，该公司为中国客户生产的机器约有90%在当地制造。ABB在中国雇用了数千名员工。\n\n据最先报道这笔交易遭到否决的 《金融时报》 称，中国当局担心机器人相关数据被转移至海外，用于训练人工智能模型。\n\n中国的干预对软银及其创始人孙正义是一个重大打击，他是科技行业最坚定的人工智能支持者之一。他把公司的未来押在这项技术上，并认为机器人是连接人工智能与现实物理世界的关键纽带。\n\n然而，外界越来越担心孙正义过度押注人工智能。软银已向ChatGPT的开发商OpenAI投资约650亿美元，并向数据中心业务投入了数十亿美元。\n\n周四，软银股价下跌近7%，过去一年累计跌幅接近30%。民主党在周二美国中期选举中的全面胜利，也拖累了一些大型科技公司的股价，因为许多胜选的州长和议员一直主张 加强对人工智能基础设施建设的监管 ，这可能拖慢相关项目的扩张步伐。", "body": "中国监管部门阻止了日本科技巨头软银一项价值数十亿美元的机器人业务扩张计划，显示出北京愿意干预可能影响自身技术发展雄心的全球商业交易。\n\n周四，瑞士-瑞典工业公司ABB 表示 ，去年宣布的以54亿美元将其机器人部门出售给软银的交易遭到中国一家负责对外国投资进行国家安全审查的监管机构否决。\n\n软银的这笔收购需要获得中国批准，部分原因是ABB有很大一部分销售收入来自中国。ABB在上海设有一家工厂，生产多种产品，主要用于制造业，以及重型物料搬运、抛光等作业的自动化。\n\n中国正采取更为强硬的方式审查涉及关键技术和敏感行业的外国企业交易。今年4月，监管机构迫使Meta撤销了以20亿美元收购中国人工智能初创企业Manus的交易。\n\n在阻止Manus收购案时，中国当局以国家安全问题为由采取行动。外界认为，此举表明中国政府决心防止重要技术和优秀工程人才被外国企业收购。\n\n随着技术发展在政府规划中的战略地位日益突出，中国对外国企业交易的严格审查也让企业对在华经营产生了更多顾虑。美国、欧盟和英国的监管机构同样曾干预涉及半导体、量子计算及其他技术领域的交易。\n\nABB总部位于苏黎世，与中国制造业企业有着长达数十年的联系，因此能够获取宝贵的机器人技术数据。中国是ABB最大的机器人业务市场，该公司为中国客户生产的机器约有90%在当地制造。ABB在中国雇用了数千名员工。\n\n据最先报道这笔交易遭到否决的 《金融时报》 称，中国当局担心机器人相关数据被转移至海外，用于训练人工智能模型。\n\n中国的干预对软银及其创始人孙正义是一个重大打击，他是科技行业最坚定的人工智能支持者之一。他把公司的未来押在这项技术上，并认为机器人是连接人工智能与现实物理世界的关键纽带。\n\n然而，外界越来越担心孙正义过度押注人工智能。软银已向ChatGPT的开发商OpenAI投资约650亿美元，并向数据中心业务投入了数十亿美元。\n\n周四，软银股价下跌近7%，过去一年累计跌幅接近30%。民主党在周二美国中期选举中的全面胜利，也拖累了一些大型科技公司的股价，因为许多胜选的州长和议员一直主张 加强对人工智能基础设施建设的监管 ，这可能拖慢相关项目的扩张步伐。", "link": "https://cn.nytimes.com/business/20261106/softbank-robotics-china-block/?utm_source=RSS", "time": "11月06日 08:26", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "“一夜爆红”能否拯救她妈妈的中餐馆？", "title_zh": "“一夜爆红”能否拯救她妈妈的中餐馆？", "summary_orig": "数百万人浏览了丽莎关于她母亲在爱丁堡经营的中餐馆生意惨淡的视频，丽莎希望为母亲做点什么，设法挽救这家餐馆。网络成名带来了源源不断的新客人，也造成了新的问题。 Robert Ormerod for The New York Times", "summary_zh": "数百万人浏览了丽莎关于她母亲在爱丁堡经营的中餐馆生意惨淡的视频，丽莎希望为母亲做点什么，设法挽救这家餐馆。网络成名带来了源源不断的新客人，也造成了新的问题。 Robert Ormerod for The New York Times", "body_orig": "", "body_zh": "即使鲜有顾客上门，索菲·李每天仍会在丽都擦桌子、扫地，那是她开的中餐馆。\n\n近20年来，位于苏格兰爱丁堡的这家中餐馆既是索菲毕生的心血，也是她难以卸下的重担。生意好的时候，餐馆收入稳定，足以养活她和两个女儿，还能供她们上大学。\n\n但今年年初，餐馆几乎总是空空荡荡。尽管如此，年近70的索菲仍省吃俭用，每周七天辛勤劳作，维持丽都的经营。\n\n“我这个人，宁可吃苦，也不愿受辱。”她说。\n\n在伦敦，她的小女儿丽莎·贺担心母亲身体会拖垮。她专程北上苏格兰，并在社交媒体上发布视频求助。\n\n“我妈妈的中餐馆快要倒闭了，”今年4月，29岁的丽莎在Instagram的一段 视频 中说。她决定抽出几个月时间，设法挽救这家餐馆。\n\n“关注接下来的故事，看看我能不能扭转局面，”她说。\n\n短短几天，这段视频的播放量就达到数百万次。网红博主和富有同情心的当地居民突然蜂拥而至，让这家只有13张餐桌的小餐馆应接不暇。\n\n丽莎和母亲都没有做好在网上走红的准备。她怀疑自己是不是做错了。\n\n“真是糟透了，”丽莎说。“要是店本身已经撑不下去了，”在网上火了“也帮不上什么忙”。\n\n门口的鱼缸里游着几条胆小怕人的鱼，窗台上摆着招财猫。一场多年前婚礼留下的装饰品至今仍挂在后墙上。餐馆里的碗碟依然靠人工清洗。\n\n索菲原名李薇（音）。1993年，她随丈夫从中国大陆移居爱丁堡。当时，丈夫正在爱丁堡大学攻读博士学位。移民后，她给自己取了英文名Sophie，因为喜欢这个名字听起来带有的高贵气质，也希望自己能活出与之相称的人生。为了养家，她做过洗碗工，也当过服务员。\n\n但在这个新的家园，她始终感到不自在。她担心丽莎和姐姐艾玛无法融入当地社会。1997年，她向亲友借钱开了一家餐馆。十年后，餐馆搬到了如今的地址，位于繁忙的西梅特兰街，门口高挂着一块红色大招牌，上面用金色写着“丽都”。\n\n“我刚来的时候觉得自己低人一等，”她说。她希望孩子们“能昂首挺胸”。\n\n她的厨师来自香港和中国南方，做的是一种在战后英国逐渐发展出独特风格的中餐：椒盐菜、糖醋鸡、炒面和咖喱菜。后来，索菲干脆准备了两份菜单：一份供中国顾客点菜，另一份面向当地人。\n\n她每天工作15个小时，每晚只睡几个小时。早晨打扫卫生、准备食材，接着忙午餐。她自己端盘子、招呼客人，还亲自送外卖。餐馆一直营业到午夜，即使圣诞节也不休息。\n\n岁月流逝。丈夫回了中国，两个女儿搬去了伦敦。索菲也终于还清了丽都的房贷。\n\n然而，随着爱丁堡不断有新的中餐馆开张，竞争日趋激烈，这家餐馆渐渐成了她的负担。上门顾客越来越少，生意日益依赖网络订单，而平台抽取的佣金又不断蚕食利润。餐馆的网上评分也开始下降。\n\n索菲说自己不懂科技，因此没有看到顾客在网上抱怨菜量太少、炒饭淡而无味的评论。关节炎让她做起事来越来越吃力，她也感到孤独。\n\n“我觉得已经没什么希望了，”她说。“但我必须坚持下去。我没有别的路可走。”\n\n在伦敦，靠当演员和律师助理谋生的丽莎·贺经常登录餐馆的监控系统，查看丽都的情况。她看到母亲疲惫不堪的样子。今年年初，她订了回家的行程，希望能让母亲歇一歇。\n\n“我回来是因为太想救我妈妈了，而不是为了救这家餐馆，”她说。\n\n丽莎对餐馆生活有着复杂的感情。她还是婴儿时，母亲就带着她去上班，把她放在餐馆侧间的一个临时婴儿床里。上学后，每当看到母亲如此辛苦地工作，她都会感到内疚。\n\n“我经常觉得，为了去餐馆帮忙，我不得不放弃自己的社交生活，”她说。\n\n今年4月之前，丽莎的社交媒体账号上主要是她跳舞或参加电影排练的照片。\n\n但在这段视频中，她把镜头对准了母亲和丽都，坦率地指出了许多商家宁愿遮掩的问题：从毫无吸引力的门面到过时的菜单，各种问题。她还邀请网友关注自己如何努力扭转母女俩的处境。\n\n也许是因为丽莎的坦率，也许是因为视频的纪录片风格，这段视频吸引了很多人。又或许，在一个大公司和连锁企业遍布的世界里，网友们觉得自己还有机会阻止又一家家庭小店消失。\n\n丽莎的评论区充满了提供帮助的留言，从改进设计到更新菜单。食客们承诺会来。还有餐馆老板鼓励他们重新思考这个生意。“别放弃，”有网友说。“没到最后一刻就不算完。”\n\n丽莎在一个周日发布了视频。周二，她发现自己回到餐馆厨房，竭力应付一场母女俩完全没有准备好的局面。\n\n视频爆红后的几天里，美食博主和新顾客挤满了餐馆。索菲直到视频火了才知道女儿发了这段内容，她惊呆了。\n\n突然之间，母女俩不得不在楼上楼下奔忙，接待顾客点餐。两名厨师原本每天只需要应付零星几单生意，如今却要马不停蹄地出菜。\n\n紧张情绪最终爆发。一天午餐时段，餐厅座无虚席，顾客都在等着上菜，一名忍无可忍的厨师愤而离开，以示抗议。母女俩实在招架不住，只好决定暂时关门。\n\n关注丽都困境的网友纷纷给丽莎留言，提出餐馆要想生存下去应该做出哪些改变。她决定采纳其中一些建议。\n\n她说服母亲精简菜单，增加中国酒，雇用更多服务员，并安装电子点单系统。大约一周后，餐馆重新开门营业，但缩短了营业时间，并开始每周一休息。\n\n她继续在Instagram上发布餐馆的最新动态，如今已有超过20万个账号关注她。\n\n视频爆红五个月后，丽莎仍在餐厅里忙碌，招待客人、调制饮品。今年9月的一个星期四，餐馆里坐满了看过她视频的顾客。吸引他们前来的不仅是食物，还有这个关于女儿孝心和家庭小店艰难求生的故事。\n\n“通常第二代移民都不愿意再做餐馆生意，”来自加拿大的顾客张咏（音）说。“我觉得她是个孝顺的女儿。”\n\n索菲重新焕发了干劲，已经无法想象放弃丽都的生活。她希望有一天女儿能够接手餐馆。今年夏天，餐馆的营业收入比去年同期增长两倍多，网上走红还为她们带来了商业赞助。\n\n她发现，要兼顾所有事情实在太难了：发布社交媒体内容、每天长时间工作，还有繁重的体力劳动。储藏室漏水，卫生间的马桶座圈也需要修理。\n\n这些琐事背后，是一个人们熟悉的代际难题：为了维持母亲的生意，她不得不暂时搁置自己的事业以及从事表演和舞蹈的梦想。\n\n今年夏天，她在一篇帖子中发问：网络爆红究竟让她们的生活变得更好了，还是仅仅让她们更加忙碌？在她看来，也许是时候放手，让丽都关门，让母亲退休，自己则回到伦敦。\n\n她的视频取得了成功，却也揭示出母女俩对未来的不同设想。\n\n“如果我和妈妈每天都累得要死，”一天午餐前的片刻清静中，她在餐馆里说，“那我真的不觉得这算什么成功。”\n\n眼下，关于未来的决定只能暂时搁置。多年来，餐馆第一次接到了大量12月节日期间的预订，还有许多活等着她们去干：折餐巾、分虾片、洗杯子。第二天，她们还会回来，日复一日地重复这一切。", "body": "即使鲜有顾客上门，索菲·李每天仍会在丽都擦桌子、扫地，那是她开的中餐馆。\n\n近20年来，位于苏格兰爱丁堡的这家中餐馆既是索菲毕生的心血，也是她难以卸下的重担。生意好的时候，餐馆收入稳定，足以养活她和两个女儿，还能供她们上大学。\n\n但今年年初，餐馆几乎总是空空荡荡。尽管如此，年近70的索菲仍省吃俭用，每周七天辛勤劳作，维持丽都的经营。\n\n“我这个人，宁可吃苦，也不愿受辱。”她说。\n\n在伦敦，她的小女儿丽莎·贺担心母亲身体会拖垮。她专程北上苏格兰，并在社交媒体上发布视频求助。\n\n“我妈妈的中餐馆快要倒闭了，”今年4月，29岁的丽莎在Instagram的一段 视频 中说。她决定抽出几个月时间，设法挽救这家餐馆。\n\n“关注接下来的故事，看看我能不能扭转局面，”她说。\n\n短短几天，这段视频的播放量就达到数百万次。网红博主和富有同情心的当地居民突然蜂拥而至，让这家只有13张餐桌的小餐馆应接不暇。\n\n丽莎和母亲都没有做好在网上走红的准备。她怀疑自己是不是做错了。\n\n“真是糟透了，”丽莎说。“要是店本身已经撑不下去了，”在网上火了“也帮不上什么忙”。\n\n门口的鱼缸里游着几条胆小怕人的鱼，窗台上摆着招财猫。一场多年前婚礼留下的装饰品至今仍挂在后墙上。餐馆里的 子中发问：网络爆红究竟让她们的生活变得更好了，还是仅仅让她们更加忙碌？在她看来，也许是时候放手，让丽都关门，让母亲退休，自己则回到伦敦。\n\n她的视频取得了成功，却也揭示出母女俩对未来的不同设想。\n\n“如果我和妈妈每天都累得要死，”一天午餐前的片刻清静中，她在餐馆里说，“那我真的不觉得这算什么成功。”\n\n眼下，关于未来的决定只能暂时搁置。多年来，餐馆第一次接到了大量12月节日期间的预订，还有许多活等着她们去干：折餐巾、分虾片、洗杯子。第二天，她们还会回来，日复一日地重复这一切。", "link": "https://cn.nytimes.com/world/20261105/chinese-restaurant-edinburgh-viral-social-media/?utm_source=RSS", "time": "11月05日 02:55", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "黄之锋因“勾结外国势力”被判10年监禁", "title_zh": "黄之锋因“勾结外国势力”被判10年监禁", "summary_orig": "法官裁定黄之锋“罪行重大”。黄之锋是香港民主抗议活动的关键人物之一，此前已因另一起国家安全案件中被定罪，服刑近六年。法律专家称新判决旨在削弱黄之锋的影响力。 Lam Yik Fei for The New York Times 2021年，在香港一场针对47名被控违反国家安全法的反对派人士的聆讯结束后，民主活动人士黄之锋抵达监狱。", "summary_zh": "法官裁定黄之锋“罪行重大”。黄之锋是香港民主抗议活动的关键人物之一，此前已因另一起国家安全案件中被定罪，服刑近六年。法律专家称新判决旨在削弱黄之锋的影响力。 Lam Yik Fei for The New York Times 2021年，在香港一场针对47名被控违反国家安全法的反对派人士的聆讯结束后，民主活动人士黄之锋抵达监狱。", "body_orig": "", "body_zh": "周四，香港民主抗议活动的关键人物黄之锋被香港一家法院以串谋勾结外国势力的罪名判处10年监禁，这是一项国家安全罪。\n\n法官谭耀豪周四在法庭上裁定，黄之锋“罪行重大”，根据国家安全法的规定，须判处不少于10年的监禁。\n\n谭耀豪表示，黄之锋与已逃往英国的另一名活动人士罗冠聪是串谋游说外国政府并“公然呼吁制裁和敌对措施”的“主谋”，有必要通过严厉的惩罚来起到威慑作用。\n\n站在被告席后的黄之锋身穿海军蓝衬衫，在法官讲话时做着笔记，并在宣布刑期时显得十分沮丧。在被警察带走前，黄之锋看向公众席和记者席。他微笑着用粤语说道：“多谢大家”。\n\n30岁的黄之锋于2025年被控串谋游说立法者（尤其是美国立法者）对香港和中国实施制裁。勾结外国势力罪的最高刑罚为终身监禁。黄之锋此前已认罪。\n\n乔治城大学亚洲法学中心执行主任托马斯·凯洛格表示，由于几乎所有的国家安全案件都以定罪告终，越来越多的活动人士选择认罪以换取三分之一的减刑，将其作为一种“减害策略”。\n\n黄之锋从14岁起便开始参与社会活动。他因在另一起国家安全案件中被定罪，已在狱中度过了近六年。据朋友们说，在受到新指控之前，他一直在期盼着再过几个月等到明年1月获释。\n\n黄之锋的朋友们表示，他对可能面临的又一个漫长刑期感到痛苦。在被指控新的罪名后曾去狱中探望他的钱诗文在接受采访时说，他看起来就像“希望从他眼中消失了”。\n\n法律专家在周四的判决前表示，此举旨在削弱黄之锋的影响力。\n\n德国纽伦堡大学国际人权法教授伊娃·皮尔斯说：“对许多观察人士而言，他代表了香港民主运动的未来：他不仅年轻、富有魅力、沟通天赋出众，还是一名愿意承担巨大个人风险的活动人士。”\n\n“将黄之锋关押在狱中这么多年，目的可能是为了削弱他在公众心目中的存在感，让他的形象渐渐淡出，”她还说。\n\n2020年，北京在香港实施了国家安全法，明确将呼吁制裁及其他形式的异议行为定为犯罪。\n\n伦敦亚非学院中国研究院院长曾锐生表示：“‘串谋勾结外国势力’的指控实际上将他描绘成了一个叛国者。”他补充道，中国共产党已将香港2019年的民主运动定性为反党的“公开叛乱”。“黄之锋被视为引导香港‘不爱国’行为的人物，”他说。\n\n2012年，14岁的黄之锋 参与创立了学生团体“学民思潮”，反对政府推行强制性的 “德育及国民教育”课程计划 ，他称该课程等同于政治灌输和“洗脑”。数以万计的抗议者聚集在政府总部外支持 黄之锋的诉求，政府最终被迫搁置了该计划。\n\n两年后的2014年，他成为呼吁在香港举行更自由选举的年轻活动人士中的标志性面孔。该团体在政府总部外举行了学生罢课，并搭起帐篷，导致该市中央商务区的交通瘫痪了数周。这场抗议活动后来被称为雨伞运动。\n\n现居台湾的著名民主活动人士、香港中文大学前社会学教授陈健民说，当2019年一项不受欢迎的引渡法案引发数月的反政府抗议时，“涌现出了许多个黄之锋。”\n\n但作为一名具有开拓性的青年活动人士，黄之锋具备其他人所缺乏的优势：国际知名度。\n\n“他当时已经是一个偶像。西方很多人都认识他。因此他能够会见美国的政治重量级人物，”陈健民说，“也正是这种特殊的角色，导致他陷入了如此艰难的境地。”\n\n黄之锋的朋友在接受采访时表示，在狱中的五年里，他保持着规律的作息，广泛阅读、学习商业课程、锻炼身体并写信。\n\n“一般人通常会花八到十年时间发展事业，然后才有精力投入公益，”他在1月写给朋友的一封信中写道。“但对于我们大多数90后来说，情况恰恰相反。”时报查阅了该信件。\n\n他在信中表示，自己期待着2027年获释，并希望能在2032年与朋友们重聚，以纪念他们创立“学民思潮”20周年。\n\n经常探视并给黄之锋写信的路易·李表示，尽管未来充满不确定性，但他从未放弃过。\n\n在同样由《纽约时报》查阅的一封2025年的信中，黄之锋写道，“这个世界对我一点也不温柔，”但他会坚持下去。\n\n“在这个行动似乎徒劳无功的世界里，我依然会倾尽全力去奋斗，”他写道。", "body": "周四，香港民主抗议活动的关键人物黄之锋被香港一家法院以串谋勾结外国势力的罪名判处10年监禁，这是一项国家安全罪。\n\n法官谭耀豪周四在法庭上裁定，黄之锋“罪行重大”，根据国家安全法的规定，须判处不少于10年的监禁。\n\n谭耀豪表示，黄之锋与已逃往英国的另一名活动人士罗冠聪是串谋游说外国政府并“公然呼吁制裁和敌对措施”的“主谋”，有必要通过严厉的惩罚来起到威慑作用。\n\n站在被告席后的黄之锋身穿海军蓝衬衫，在法官讲话时做着笔记，并在宣布刑期时显得十分沮丧。在被警察带走前，黄之锋看向公众席和记者席。他微笑着用粤语说道：“多谢大家”。\n\n30岁的黄之锋于2025年被控串谋游说立法者（尤其是美国立法者）对香港和中国实施制裁。勾结外国势力罪的最高刑罚为终身监禁。黄之锋此前已认罪。\n\n乔治城大学亚洲法学中心执行主任托马斯·凯洛格表示，由于几乎所有的国家安全案件都以定罪告终，越来越多的活动人士选择认罪以换取三分之一的减刑，将其作为一种“减害策略”。\n\n黄之锋从14岁起便开始参与社会活动。他因在另一起国家安全案件中被定罪，已在狱中度过了近六年。据朋友们说，在受到新指控之前，他一直在期盼着再过几个月等到明年1月获释。\n\n黄之锋的朋友们表示，他对可能面临的又一个漫长刑期感到痛苦。在被指控新的罪名后曾去狱中探望他的钱诗文在接受采访时说，他看起来就像“希望从他眼中消失了”。\n\n法律专家在周四的判决前表示，此举旨在削弱黄之锋的影响力。\n\n德国纽伦堡大学国际人权法教授伊娃·皮尔斯说：“对许多观察人士而言，他代表了香港民主运动的未来：他不仅年轻、富有魅力、沟通天赋出众，还是一名愿意承担巨大个人风险的活动人士。”\n\n“将黄之锋关押在狱中这么多年，目的可能是为了削弱他在公众心目中的存在感，让他的形象渐渐淡出，”她还说。\n\n2020年，北京在香港实施了国家安全法，明确将呼吁制裁及其他形式的异议行为定为犯罪。\n\n伦敦亚非学院中国研究院院长曾锐生表示：“‘串谋勾结外国势力’的指控实际上将他描绘成了一个叛国者。”他补充道，中国共产党已将香港2019年的民主运动定性为反党的“公开叛乱”。“黄之锋被视为引导香港‘不爱国’行为的人物，”他说。\n\n2012年，14岁的黄之锋 参与创立了学生团体“学民思潮”，反对政府推行强制性的 “德育及国民教育”课程计划 ，他称该课程等同于政治灌输和“洗脑”。数以万计的抗议者聚集在政府总部外支持 黄之锋的诉求，政府最终被迫搁置了该计划。\n\n两年后的2014年，他成为呼吁在香港举行更自由选举的年轻活动人士中的标志性面孔。该团体在政府总部外举行了学生罢课，并搭起帐篷，导致该市中央商务区的交通瘫痪了数周。这场抗议活动后来被称为雨伞运动。\n\n现居台湾的著名民主活动人士、香港中文大学前社会学教授陈健民说，当2019年一项不受欢迎的引渡法案引发数月的反政府抗议时，“涌现出了许多个黄之锋。”\n\n但作为一名具有开拓性的青年活动人士，黄之锋具备其他人所缺乏的优势：国际知名度。\n\n“他当时已经是一个偶像。西方很多人都认识他。因此他能够会见美国的政治重量级人物，”陈健民说，“也正是这种特殊的角色，导致他陷入了如此艰难的境地。”\n\n黄之锋的朋友在接受采访时表示，在狱中的五 特朗普需要关注，就像大多数人需要氧气一样，”前新泽西州州长、正考虑2028年再次竞选总统的共和党人克里斯·克里斯蒂说。“他离不开它，而现在他将首次在政治生涯中体验跛脚鸭的滋味。所以他需要做的就是比平常更加卖力表演，转移你对2028年竞选的注意力。”\n\n特朗普迄今对自己未来两年的计划含糊其辞。他周二在接受播客主持人、前联邦调查局高级官员丹·邦吉诺采访时说，他有“很多很多事情正在筹备中”。\n\n他没有详细说明，而是转向竞选演讲的惯用论调：“你知道，现在美国正在建设的工厂和厂房比历史上任何时候都多，这超过了咆哮的20年代，意味着所有——以前从来没有过这样的事。”（根据全国制造商协会的数据，制造业 实际上自2024年以来已经放缓 。）\n\n他在采访中表示，他可能会在债务上限和移民执法方面寻求与政治对手合作，这两个棘手的政策问题曾困扰历届政府。\n\n他还反复提及自己否决立法的能力，含蓄强调他在最后两年任期内将面临多么严峻的防守局面。\n\n周三，在选举日后的首次公开露面中，特朗普在白宫面对记者，谈的不是吸取任何教训，也不是共和党的前进道路，而是谈起自己的宴会厅项目和自身的未来，尤其是弹劾这个话题。\n\n“我认为，如果他们那么做——毫无理由地弹劾——会毁掉民主党，”特朗普说。“为什么，就因为国家成功？我们的国家现在比历史上任何时候都更成功。”\n\n“看那根钢梁升起来，”他说。“现在想象一下，到处都是吊灯。”\n\n几名高级助手已经在规划，如果共和党失去国会一院或两院，特朗普仅靠行政权力能完成什么。据一名要求匿名描述内部讨论的白宫官员说，参与者包括米勒、白宫预算主任拉塞尔·沃特以及白宫立法事务团队成员。这名人士说，总统很快将收到一份“备选方案清单”。\n\n周二晚上，白宫内部上演了一场关于特朗普总统任期及其身边人接下来会怎样的低声交谈。特朗普在东厅召集助手和内阁成员，结果变成一场阴郁的观选派对。据两名出席者说，当总统观看结果并接听电话时，他身边一些人私下讨论特朗普是否会留任内阁成员或幕僚长苏西·威尔斯。\n\n政府官员和特朗普盟友说，总统及其团队正在为国会调查和剩余任期内的高层更替做好准备。\n\n一些人表示焦虑，除了今年早些时候一次关于如何应对国会监督的一般性简报外，工作人员几乎没有收到关于若被卷入调查应如何应对的指导。\n\n随着政治话题转向下一个周期，特朗普表示他尚未准备指定政治继承人，或支持2028年接替他的候选人。周二深夜，福克斯新闻的玛莎·麦卡勒姆问他是否希望举行共和党初选来决定2028年总统候选人，总统说：“我认为最后情况大概会是那样。”\n\n到周三上午，副总统万斯已在社交媒体发布长文， 把共和党失利归咎于 对伊朗开战的决定，显然是在试图与特朗普保持距离。\n\n几位接近总统的人说，他们认为特朗普不太可能很快背书万斯——或者任何其他人。他们说，特朗普首先是一个表演者，他会想要留在聚光灯下。", "body": "在他的一生中，唐纳德·特朗普曾欣然接受许多身份：酒店开发商。真人秀明星。总统。煽动者。\n\n如今，80岁的他正面对一个他并不想要的身份：跛脚鸭。\n\n选民制约了他在第二任期行使的广泛权力，让民主党控制众议院和参议院。之后数小时里，特朗普似乎正在经历悲伤的各个阶段。他否认席卷全国的蓝色浪潮是他的错，也不是他对伊朗开战决定的直接结果。（副总统明确 表示 并非如此。）他 接受 了选举结果。当他意识到自己在任期的最后两年里权力将日渐式微时，他开始讨价还价，说他愿与民主党合作，同时紧握手中那支用于行使否决权的Sharpie签字笔。\n\n“我大概能和民主党人相处得来，除非他们想搞破坏，”特朗普周三对记者说，当时他站在一根正在安装的钢梁前面——这是他心爱的白宫宴会厅项目的一部分。\n\n他指出自己拥有“否决权”，然后转向一个他似乎更急于谈论的话题：他的翻修工程。\n\n特朗普是否会采取务实的交易姿态仍有待观察——一名盟友形容，总统在周二惨败后显得“茫然失措”。\n\n在2020年总统竞选失败后——这是特朗普上一次面对重大政治挫折——他退居马阿拉歌庄园，在那里积蓄着愤怒，然后策划了一次挑衅性的回归。重返白宫后，特朗普对妥协不屑一顾。\n\n在经历了一段作为政治弃儿和刑事被告的时期后，特朗普喜欢说，自己从猎物变成了猎人。在第二任期内，他的政府追查政治敌人，发动暴力的打击移民行动，并发动了一场导致美国人生活成本上升的战争。他做这一切都不需要国会批准。\n\n但周二，这种态势再次翻转。民主党人 誓言调查 政府滥权行为、总统亲信涉嫌腐败，以及移民和海关执法局的强硬手段。据一名了解讨论的人士说，众议院议员计划审查参与政府移民议程的高级官员，包括白宫副幕僚长史蒂芬·米勒、特朗普的边境事务负责人汤姆·霍曼和国土安全部长马克韦恩 ummary_zh": "六人在波兰第二大城市克拉科夫主要广场发生的一宗随机枪击案中丧生，其后警方在袭击者家中发现另外三具遗体。", "body_orig": "", "body_zh": "在波兰第二大城市克拉科夫（Krakow）市中心，一名疑与极右翼有关的枪手开火，至少六人丧生，另有十多人受伤。\n\n波兰国家检察院克拉科夫分院星期天（11月8日）表示，已就枪击案展开调查。检察官表示，该事件构成「恐怖主义罪行」。波兰内政部宣布全国哀悼两天。\n\n袭击于当地时间星期六（7日）15:00前不久（格林尼治标准时间14:00）在克拉科夫中央集市广场（Main Market Square）开始。这里是该市繁忙的中心地带，也是深受游客欢迎的地点。\n\n官员表示，武装警员迅速赶赴现场，并与疑犯驳火。袭击开始三分钟内，疑犯即被击中，从而阻止了进一步的大规模屠杀。\n\n经BBC事实查核（BBC Verify）核实令人不安的片段显示，一名警员在地面上与疑犯对峙，随后多次开枪。\n\n警方表示，在迪耶特拉街（Dietla）与斯特拉多姆斯卡街（Stradomska）交界发现的疑犯汽车已接受爆炸装置检查，但未发现任何爆炸物。行动进行期间，附近建筑物居民一度被疏散。\n\n已确认有六人死亡，包括四名女性及两名男性，其中包括一名英国公民。三名死者是波兰人，另有两人身份尚未确认。\n\n16人被送往医院，包括五名外国公民、两名警员及袭击者本人。波兰内政部其后表示，外国伤者分别来自奥地利、英国、德国、葡萄牙及俄罗斯。\n\n波兰总理唐纳德·图斯克（Donald Tusk）其后公布受伤警员身份，分别为高级警员雅各布·库利克（Jakub Kulik）及高级警员阿图尔·莫兰斯基（Artur Morański）。\n\n警方发言人表示，疑犯身穿「军事风格服装」，并持有军用级武器，但当局指出他并非军人。\n\n其位于奥斯特罗维茨—希维恩托克日斯基（Ostrowiec Świętokrzyski）的住所已遭搜查。该市距离克拉科夫约200公里（125英里），反恐警察亦参与了行动。\n\n来自英国伊普斯威奇（Ipswich；叶士域治）的乔纳森·巴尔肖（Jonathan Balshaw）当时与其波兰女友多米尼卡（Dominika）身处现场。枪击发生时，两人正在广场一角的圣母圣殿（St Mary's Basilica）外。\n\n乔纳森表示：「我们沿着教堂旁边奔跑，穿过侧门进去，与其他几人一起躲藏，直到枪声平息。」\n\n「开了很多枪，超过20响，而且听起来像是来自多种不同枪械，有两种明显不同的声音。」\n\n来自纽卡斯尔（Newcastle；纽卡素）的凯特琳·沙斯比（Caitlin Shasby）星期五（6日）与朋友乔恩（Jon）抵达克拉科夫，度过一个长周末假期。\n\n她表示，两人在酒店房间里听到枪声，但起初不知道发生什么事，直到酒店致电通知他们，要「留在房间内，直至另行通知」。\n\n总理图斯克前往克拉科夫后表示：「直到现在之前，波兰尚未出现过如此严重的恐怖主义事件⋯⋯这就是我们必须如何称呼这宗在克拉科夫夺去人命的残酷袭击。」\n\n克拉科夫市长武卡什·吉巴瓦（Łukasz Gibała）已签署命令，宣布全市进入哀悼期，将持续至星期三（11日）。\n\n英国首相贝安德（Andy Burnham）表示：「我对今天在克拉科夫发生的可怕枪击事件感到震惊和悲痛。」\n\n他补充说：「我与失去亲人的家庭、所有伤者以及所有受这宗毫无意义暴力事件影响的人同在。英国与波兰人民站在一起。」\n\n英国外交大臣文立彬（Ed Miliband）在社交媒体表示，英国政府对在这宗「骇人听闻的袭击」中丧生的人表示「深切哀悼」。\n\n欧盟外交与安全政策高级代表卡娅·卡拉斯（Kaja Kallas）表示，这宗枪击事件是一场「其影响将远超波兰的悲剧」。\n\n邻国乌克兰总统泽连斯基（Volodymyr Zelensky）形容枪击事件「令人震惊」。\n\n他在社交媒体写道：「我谨代表乌克兰人民，并以我个人名义，向遇难者家属及亲友致以诚挚慰问。」\n\n本文原以英文撰写，我们使用了人工智能协助翻译，并由BBC记者在发布前进行审核。了解更多关于我们如何使用人工智能的资讯。", "body": "在波兰第二大城市克拉科夫（Krakow）市中心，一名疑与极右翼有关的枪手开火，至少六人丧生，另有十多人受伤。\n\n波兰国家检察院克拉科夫分院星期天（11月8日）表示，已就枪击案展开调查。检察官表示，该事件构成「恐怖主义罪行」。波兰内政部宣布全国哀悼两天。\n\n袭击于当地时间星期六（7日）15:00前不久（格林尼治标准时间14:00）在克拉科夫中央集市广场（Main Market Square）开始。这里是该 ，甚至令一名来自美国北卡罗来纳州、网名为 Ensito 的超级粉丝，于2024年辞去科技行业工作，全职制作 Labubu 相关内容，并远赴意大利和西班牙追寻最新发售产品。\n\nEnsito 至今已花费超过5万美元（36万元人民币；160万元新台币），收藏逾400个 Labubu。他对BBC说，这是一个「说出来都觉得不好意思」的数字。\n\n他甚至请牙医制作了一排仿照Labubu锯齿形牙齿造型的订制假牙，供出席活动时佩戴。\n\nEnsito 如今已把重心转向 Hello Kitty（凯蒂猫／哈啰凯蒂／吉蒂猫）及「捏捏乐」（Squishies，即按压后慢回弹的柔软纾压玩具）等其他潮流产品。\n\n这显示 Labubu 热潮可能正逐渐失去动力。此前，这股风潮曾令母公司泡泡玛特（Pop Mart）的市值超越美国玩具巨头孩之宝（Hasbro）和美泰（Mattel）的总和。\n\n泡泡玛特并非「盲盒」（blind box）概念的发明者，但旗下公仔无疑推动了这种销售模式在全球普及。\n\n从事市场营销的凯特琳·卡尔森（Katelynn Carlson）表示，盲盒带来的吸引力之一，在于它唤起人们儿时拆礼物时的感觉，令收藏过程充满「怀旧感」。\n\n卡尔森透过社交媒体认识 Labubu，目前已收藏36个。她表示，自己早期购入的其中一个 Labubu 属于稀有款式，令整个体验变得「更加刺激」。\n\n2019年推出的 Labubu，是泡泡玛特最成功的玩具系列。这些小怪兽后来成为时尚潮流象征，美国名人金·卡戴珊（Kim Kardashian）及韩国（南韩）女团 Blackpink 成员 Lisa 等名人均曾公开展示相关产品。\n\nLabubu 经常吸引大批顾客排队抢购，热潮甚至一度令泡泡玛特因顾客争抢产品而暂时把相关玩具从英国门市下架。曾有收藏家花费超过15万美元购入一个真人大小的 Labubu。\n\n新加坡国立大学市场学讲师萨默尔·埃尔—哈贾尔博士（Samer El Hajjar）表示，Labubu 其中一个主要吸引力，在于部分款式极难入手。为了抽中心仪款式，不少粉丝会反复购买盲盒，进一步推高热潮。\n\n泡泡玛特目前在30多个国家设有500家门店，并在全球营运2,000部自动贩卖机。这家于2020年在香港上市的公司市值仍接近240亿美元，尽管其股价较去年高位已下跌逾50%，仍然是全球市值最高的玩具企业之一。\n\n埃尔—哈贾尔表示，投资者担心，泡泡玛特的全球成功只是一次病毒式爆红现象，而非由长期顾客忠诚度推动的可持续增长。\n\n他说：「现在已经没有那种感觉了。我走进泡泡玛特门店，整个 Labubu 系列都放在那里。」\n\n中国市场研究公司超赞（ChoZan）创办人艾熙丽（Ashley Dudarenok）表示，随着泡泡玛特为满足市场需求而大幅提高产量，那种独特和稀有的感觉亦逐渐消失。\n\nSonny Angel——一种赤身裸体、宛如小天使般的玩偶——等盲盒收藏品，以及夜光 Smiski 迷你公仔近期持续热卖。如今，就连小马宝莉（My Little Pony；彩虹小马）及Kpop 猎魔女团（KPop Demon Hunters）等品牌亦推出了盲盒产品。\n\n总部位于中国广州的名创优品（Miniso），目前在全球超过8,000家门店销售迪士尼（Disney）及漫威（Marvel）角色系列盲盒。\n\n名创优品管理人员黄铮（Vincent Huang）今年较早前表示：「消费者其实并不特别在意品牌来自哪里。」\n\n分析师布斯塔尼（Boustani）认为，在这方面，Hello Kitty 母公司三丽鸥（Sanrio）明显占有优势。三丽鸥截至今年3月止财政年度录得创纪录业绩。\n\n部分专家认为，泡泡玛特近年已大举投资扩展品牌影响力，包括在北京开设主题乐园，以及宣布开拍 Labubu 电影，做法与迪士尼（Disney）和乐高（Lego）等特许经营巨头相似。\n\n不过，艾熙丽表示，与迪士尼先透过故事塑造角色、再销售玩具不同，泡泡玛特正走相反路线。\n\n她说：「明年真正的考验，是泡泡玛特能否在没有名人加持的情况下，仍然让人们爱上一个角色。」\n\n图像来源，Smith Collection/Gado via Getty Images\n\n在花费巨额金钱收藏这些小怪兽后，Ensito 表示，每当有新潮流出现时，他如今开始反思人们究竟投入了多少时间和金钱在收藏品上。\n\n来自墨尔本的内容创作者劳伦斯·余（Lawrence Yu）则表示，在追逐 Labubu 两年后，未来若要为自己约50个 Labubu 收藏增添新成员，他很可能会变得「更加挑剔」。\n\n他的 Labubu 购买及开箱影片过去曾录得高达100万次观看，但随着热潮消退，他如今已很少再制作相关内容。\n\n他说：「我确实认为这股热潮已经放缓⋯⋯人们会疯狂追捧一段时间，然后热度就慢慢消散。」\n\n来自加拿大的克拉拉·巴贝罗（Clara Barbero）则认为，Labubu 已经成为一个「过气潮流」，但她仍会留意是否有值得收藏的新产品推出。\n\n她说：「我现在会更有意识地整理自己的收藏，只购买那些我认为未来几年仍然会喜欢的款式，而不是每逢有新系列推出就买。」\n\n来自利物浦的海蒂·哈立德（Hedy Khaled）表示，尽管这些公仔的热潮正在降温，但她对自己收藏的70个泡泡玛特公仔依然同样喜爱。\n\n她认为，追逐潮流的人与「真正的粉丝」之间存在明显分别，因此销售下滑未必代表 Labubu 已失去吸引力。\n\n对卡尔森而言，让她持续收藏的原因并非一时的网络热潮，而是这些公仔带来的快乐。她至今仍会因泡泡玛特推出的新产品而感到兴奋，例如近期推出的猫咪主题 Labubu 系列，已成为她最喜欢的系列之一。\n\n她说：「我认为，拥抱内心的小孩，并单纯因为某些事物能令自己快乐而去喜欢它，当中有种特别的意义。」\n\n本文原以英文撰写，我们使用了人工智能协助翻译，并由BBC记者在发布前进行审核。了解更多关于我们如何使用人工智能的资讯。", "body": "无论大人还是小孩，都争相购买装有这些古怪小怪兽的「盲盒」（blind boxes）。这些密封神秘包装每个售价往往达15美元（108元人民币；480元新台币）或以上。\n\n围绕Labubu的热潮，甚至令一名来自美国北卡罗来纳州、网名为 Ensito 的超级粉丝，于2024年辞去科技行业工作，全职制作 Labubu 相关内容，并远赴意大利和西班牙追寻最新发售产品。\n\nEnsito 至今已花费超过5万美元（36万元人民币；160万元新台币），收藏逾400个 Labubu。他对BBC说，这是一个「说出来都觉得不好意思」的数字。\n\n他甚至请牙医制作了一排仿照Labubu锯齿形牙齿造型的订制假牙，供出席活动时佩戴。\n\nEnsito 如今已把重心转向 Hello Kitty（凯蒂猫／哈啰凯蒂／吉蒂猫）及「捏捏乐」（Squishies，即按压后慢回弹的柔软纾压玩具）等其他潮流产品。\n\n这显示 Labubu 热潮可能正逐渐失去动力。此前，这股风潮曾令母公司泡泡玛特（Pop Mart）的市值超越美国玩具巨头孩之宝（Hasbro）和美泰（Mattel）的总和。\n\n泡泡玛特并非「盲盒」（blind box）概念的发明者，但旗下公仔无疑推动了这种销售模式在全球普及。\n\n从事市场营销的凯特琳·卡尔森（Katelynn Carlson）表示，盲盒带来的吸引力之一，在于它唤起人们儿时拆礼物时的感觉，令收藏过程充满「怀旧感」。\n\n卡尔森透过社交媒体认识 Labubu，目前已收藏36个。她表示，自己早期购入的其中一个 Labubu 属于稀有款式，令整个体验变得「更加刺激」。\n\n2019年推出的 Labubu，是泡泡玛特最成功的玩具系列。这些小怪兽后来成为时尚潮流象征，美国名人金·卡戴珊（Kim Kardashian）及韩国（南韩）女团 Blackpink 成员 Lisa 等名人均曾公开展示相关产品。\n\nLabubu 经常吸引大批顾客排队抢购，热潮甚至一度令泡泡玛特因顾客争抢产品而暂时把相关玩具从英国门市下架。曾有收藏家花费超过15万美元购入一个真人大小的 Labubu。\n\n新加坡国立大学市场学讲师萨默尔·埃尔—哈贾尔博士（Samer El Hajjar）表示，Labubu 其中一个主要吸引力，在于部分款式极难入手。为了抽中心仪款式，不少粉丝会反复购买盲盒，进一步推高热潮。\n\n泡泡玛特目前在30多个国家设有500家门店，并在全球营运2,000部自动贩卖机。这家于2020年在香港上市的公司市值仍接近240亿美元，尽管其股价较去年高位已下跌逾50%，仍然是全球市值最高的玩具企业之一。\n\n埃尔—哈贾尔表示，投资者担心，泡泡玛特的全球成功只是一次病毒式爆红现象，而非由长期顾客忠诚度推动的可持续增长。\n\n他说：「现在已经没有那种感觉了。我走进泡泡玛特门店，整个 Labubu 系列都放在那里。」\n\n中国市场研究公司超赞（ChoZan）创办人艾熙丽（Ashley Dudarenok）表示，随着泡泡玛特为满足市场需求而大幅提高产量，那种独特和稀有的感觉亦逐渐消失。\n\nSonny Angel——一种赤身裸体、宛如小天使般的玩偶——等盲盒收藏品，以及夜光 Smiski 迷你公仔近期持续热卖。如今，就连小马宝莉（My Little Pony；彩虹小马）及Kpop 猎魔女团（KPop Demon Hunters）等品牌亦推出了盲盒产品。\n\n总部位于中国广州的名创优品（Miniso），目前在全球超过8,000家门店销售迪士尼（Disney）及漫威（Marvel）角色系列盲盒。\n\n名创优品管理人员黄铮（Vincent Huang）今年较早前表示：「消费者其实并不特别在意品牌来自哪里。」\n\n分析师布斯塔尼（Boustani）认为，在这方面，Hello Kitty 母公司三丽鸥（Sanrio）明显占有优势。三丽鸥截至今年3月止财政年度录得创纪录业绩。\n\n部分专家认为，泡泡玛特近年已大举投资扩展品牌影响力，包括在北京开设主题乐园，以及宣布开拍 Labubu 电影，做法与迪士尼（Disney）和乐高（Lego）等特许经营巨头相似。\n\n不过，艾熙丽表示，与迪士尼先透过故事塑造角色、再销售玩具不同，泡泡玛特正走相反路线。\n\n她说：「明年真正的考验，是泡泡玛特能否在没有名人加持的情况下，仍然让人们爱上一个角色。」\n\n图像来源，Smith Collection/Gado via Getty Images\n\n在花费巨额金钱收藏这些小怪兽后，Ensito 表示，每当有新潮流出现时，他如今开始反思人们究竟投入了多少时间和金钱在收藏品上。\n\n来自墨尔本的内容创作者劳伦斯·余（Lawrence Yu）则表示，在追逐 Labubu 两年后，未来若要为自己约50个 Labubu 收藏增添新成员，他很可能会变得「更加挑剔」。\n\n他的 Labubu 购买及开箱影片过去曾录得高达100万次观看，但随着热潮消退，他如今已很少再制作相关内容。\n\n他说：「我确实认为这股热潮已经放缓⋯⋯人们会疯狂追捧一段时间，然后热度就慢慢消散。」\n\n来自加拿大的克拉拉·巴贝罗（Clara Barbero）则认为，Labubu 已经成为一个「过气潮流」，但她仍会留意是否有值得收藏的新产品推出。\n\n她说：「我现在会更有意识地整理自己的收藏，只购买那些我认为未来几年仍然会喜欢的款式，而不是每逢有新系列推出就买。」\n\n来自利物浦的海蒂·哈立德（Hedy Khaled）表示，尽管这些公仔的热潮正在降温，但她对自己收藏的70个泡泡玛特公仔依然同样喜爱。\n\n她认为，追逐潮流的人与「真正的粉丝」之间存在明显分别，因此销售下滑未必代表 Labubu 已失去吸引力。\n\n对卡尔森而言，让她持续收藏的原因并非一时的网络热潮，而是这些公仔带来的快乐。她至今仍会因泡泡玛特推出的新产品而感到兴奋，例如近期推出的猫咪主题 Labubu 系列，已成为她最喜欢的系列之一。\n\n她说：「我认为，拥抱内心的小孩，并单纯因为某些事物能令自己快乐而去喜欢它，当中有种特别的意义。」\n\n本文原以英文撰写，我们使用了人工智能协助翻译，并由BBC记者在发布前进行审核。了解更多关于我们如何使用人工智能的资讯。", "link": "https://www.bbc.com/zhongwen/articles/c6r7yg9xkdy8o/trad?at_medium=RSS&at_campaign=rss", "time": "11月08日 15:35", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "原欧盟脱欧谈判代表巴尼耶：英国不能「挑肥拣瘦」", "title_zh": "原欧盟脱欧谈判代表巴尼耶：英国不能「挑肥拣瘦」", "summary_orig": "这位前脱欧谈判代表表示，欧盟国家将拒绝英国任何「单点」选择遵守经济规则的企图。", "summary_zh": "这位前脱欧谈判代表表示，欧盟国家将拒绝英国任何「单点」选择遵守经济规则的企图。", "body_orig": "", "body_zh": "在贝安德（Andy Burnham）表示希望探索与欧洲建立更紧密经济联系之后，欧盟前英国脱欧（Brexit）谈判代表警告，英国不能对其参与的单一市场内容「挑肥拣瘦」。\n\n英国首相曾表示，英国退出欧盟近六年之后，重新加入欧盟内部市场是他可能采取重塑英欧关系的方案之一。\n\n但米歇尔·巴尼耶（Michel Barnier）向BBC节目《劳拉·昆斯伯格周日访谈》（Sunday with Laura Kuenssberg）表示，欧盟成员国将坚持要求英国重新接受某些条件，例如人员自由流动，以换取市场准入。\n\n巴尼耶在2016年至2021年间领导欧盟脱欧谈判代表团，并曾于2024年担任法国总理三个月。他表示，欧洲方面对英国重新作为欧盟成员加入仍然「敞开大门」。\n\n但他坚称，任何重新加入单一市场的举措，都将要求英国遵守与其他成员相同的条件。单一市场允许货物自由流通，无需接受边境检查。\n\n他补充说，这包括遵守旨在促进货物、服务、资本及人员流通的规则。这些规则在欧盟体系内被统称为「四大自由」。\n\n「不可能只要其中一项自由，而不要其他自由。四大自由显然是身处单一市场的四项条件。」\n\n自7月出任首相以来，贝安德一直表示，他可能承诺让工党寻求与欧洲建立更紧密的未来关系，包括申请重新作为正式成员加入该组织。不过，他已排除在下次大选前作出重大改变。\n\n双方希望利用10天后在布鲁塞尔举行的会议，公布有关食品标准、青年签证以及让英国产业重新接入欧盟碳排放交易机制的协议。\n\n在人员自由流动、货物自由流动、服务自由流动及资本自由流动这四大自由中，人员自由流动在2016年脱欧公投期间是关键议题之一。该机制允许欧盟公民无需签证即可在欧盟其他国家生活和工作。\n\n贝安德的前任施纪贤爵士（Sir Keir Starmer）已在工党2024年大选政纲中排除恢复英国的人员自由流动。若未来再次主张恢复，将成为与保守党及英国改革党之间的重要分歧之一。\n\n贝安德近日在一次访问中表示，若无全民公投，他不会恢复人员自由流动。此言促使唐宁街澄清，他目前并未主张恢复该制度。\n\n他此前曾表示，希望在本月稍后于布鲁塞尔举行的峰会上提出与欧洲关系的「不同选项」，然后尝试与英国公众就新的双边关系达成共识。\n\n巴尼耶还预测，欧盟国家将拒绝恢复英国财政回扣制度。该制度最初于1985年谈判达成，在英国仍为成员国期间，可降低其对欧盟年度预算的缴款额。\n\n他表示，英国脱离欧盟已经创造出「新的局面」，因此新的回扣安排将「不在考虑范围内」。\n\n巴尼耶还将英国改革党（Reform UK）领袖奈杰尔·法拉奇（Nigel Farage）与法国政治人物马琳·勒庞（Marine Le Pen）作比较。他表示：「我们也有自己的法拉奇。那就是勒庞女士。同样的民粹主义，同样的谎言，同样的虚假承诺。」\n\n当劳拉·昆斯伯格（Laura Kuenssberg）要求他说明所指的「谎言」时，巴尼耶表示：「例如，当法拉奇先生和约翰逊先生（Boris Johnson）承诺英国人民每星期可收回3.5亿英镑时，那不是真的，也不可能实现。那是一个谎言。」\n\n支持脱欧的「Vote Leave」阵营中，约翰逊是关键人物之一。该阵营此前曾因其竞选巴士上的标语受到批评，标语称英国每周向欧盟支付3.5亿英镑（4.6亿美元、33亿元人民币；147亿元新台币），并写道：「让我们把这笔钱用于资助国民保健制度（NHS）吧。」\n\n约翰逊于2017年表示：「一旦我们结清账目，我们每周将重新掌控约3.5亿英镑。如果正如许多人指出的那样，其中大量资金投入NHS，那将是一件好事。」\n\n批评者指出，每周3.5亿英镑只是约数，代表英国的「总缴款额」，并未计入英国每周7500万英镑的回扣，也未计入欧盟对英国的投资。\n\n后来担任过英国首相的约翰逊此后一直为此说法辩护，称3.5亿英镑是根据英国向欧盟缴纳的总金额计算，实际上甚至被低估了，因为英国的缴款额原本还将增加。\n\n在2024年出版的回忆录中，约翰逊表示，欧盟在英国花费的资金「并非由英国人民民主控制」，而且「即使净额只有1.75亿英镑，那仍然是一大笔钱」。\n\n法拉奇曾领导「Leave UK」阵营，但并非「Vote Leave」阵营成员，因此与3.5亿英镑的说法无关。他表示：「这还是一如既往的巴尼耶，自大、脱离现实，而且仗势欺人。每当他开口说话时，都证明我们离开欧盟的决定是正确的。」\n\n本文原以英文撰写，我们使用了人工智能协助翻译，并由BBC记者在发布前进行审核。了解更多关于我们如何使用人工智能的资讯。", "body": "在贝安德（Andy Burnham）表示希望探索与欧洲建立更紧密经济联系之后，欧盟前英国脱欧（Brexit）谈判代表警告，英国不能对其参与的单一市场内容「挑肥拣瘦」。\n\n英国首相曾表示，英国退出欧盟近六年之后，重新加入欧盟内部市场是他可能采取重塑英欧关系的方案之一。\n\n但米歇尔·巴尼耶（Michel Barnier）向BBC节目《劳拉·昆斯伯格周日访谈》（Sunday with Laura Kuenssberg）表示，欧盟成员国将坚持要求英国重新接受某些条件，例如人员自由流动，以换取市场准入。\n\n巴尼耶在2016年至2021年间领导欧盟脱欧谈判代表团，并曾于2024年担任法国总理三个月。他表示，欧洲方面对英国重新作为欧盟成员加入仍然「敞开大门」。\n\n但他坚称，任何重新加入单一市场的举措，都将要求英国遵守与其他成员相同的条件。单一市场允许货物自由流通，无需接受边境检查。\n\n他补充说，这包括遵守旨在促进货物、服务、资本及人员流通的规则。这些规则在欧盟体系内被统称为「四大自由」。\n\n「不可 的共产主义统治期间，谁曾监视邻居、同事、朋友和亲属。\n\n对一些人而言，这提供了一个期待已久的机会，去追寻有关在共产主义政权及其庞大间谍网络手中遭逮捕、盘问和失踪事件的解释。\n\n作为1980年代共产主义统治下匈牙利的反对派活动人士，巴林特·马扎尔（Bálint Magyar）知道自己一直受到严密监视。\n\n此后，他设法取得国家秘密搜集的部分个人资料，其中包括一份警方线人的报告，记录了他在1987年向一群教师发表的演讲。报告称，他「表明我国很快将会发生政权更迭」。\n\n如今，马扎尔已能以幽默的角度看待此事。他对BBC国际部（BBC World Service）说：「我不记得自己那么早就已经在谈论政权更迭的可能性了。」\n\n他仍不知道那名线人是谁，也不清楚监视其活动行动的任何细节，但这些答案可能很快就会揭晓。\n\n他说：「整套机器本身以及其运作方式，从未向公众公开。也许，让所有文件都能完全公开查阅，将有助于让所有人更清楚地了解整个制度。」\n\n首批档案从11月4日起公开，当天正值苏联武力镇压匈牙利1956年民主运动起义70周年。\n\n匈牙利建立了一套庞大的监控体系。合作者从公众中招募而来，通常透过勒索或贿赂方式，负责监视其所在社群。匈牙利国家安全历史档案馆负责人格尔戈·本代古兹·切赫（Gergő Bendegúz Cseh）表示，档案中记录了5万至6万名这类人士的姓名。\n\n切赫说：「我们正在扫描并公开所有前特工的档案，因此，人们将能够从现存的文件中了解，不仅某人曾被招募，而且还能了解招募依据是甚么、招募过程如何进行、他们受到何种勒索，以及他们如何执行任务。」\n\n彼得尔·「西亚米」·米勒（Péter \"Sziámi\" Müller）曾是1980年代匈牙利地下摇滚圈的一员，该圈子具有颠覆体制色彩。警方线人总是混在人群中监视。\n\n他说：「我并不完全认同这样的想法，即是经过这么多年后，社会仍需要透过这种清算或宣泄来达成和解，必须把人挑出来、羞辱他们、让他们蒙羞并加以惩罚；毕竟他们不是已经去世，就是已经进入人生另一个阶段。」\n\n在4月以压倒性优势击败维克托·欧尔班（Viktor Orbán）赢得大选后，总理彼得·马扎尔（Péter Magyar）表示，其政府将「兑现民主转型最重要的承诺之一，我们将把现有纪录向公众公开，并提供搜寻功能」。\n\n在共产主义垮台后，包括波兰和德国在内的一些国家更早便开放了档案。然而，并非所有纪录都已数码化，而且查阅范围有时仅限于个人或家族纪录。\n\n他说：「问题已不再主要是谁应被追究责任，或谁仍可被追究责任，因为那一代人大多已不在人世，而其他人也早已离开活跃的工作岗位。」\n\n在共产主义垮台后成为国会议员及政府部长的巴林特·马扎尔，现为布达佩斯中欧大学民主研究所（Central European University Democracy Institute, Budapest）高级研究员。\n\n他说：「一个国家不可能一直活在谎言之中，而不以某种方式正视自身的过去。（解密档案）肯定有助于匈牙利做到这一点。」\n\n支持这项措施的人认为，这是迈向历史和解道路上的重要一步；但对一些人而言，面对这些秘密将会十分痛苦。\n\n本文原以英文撰写，我们使用了人工智能协助翻译，并由BBC记者在发布前进行审核。了解更多关于我们如何使用人工智能的资讯。", "body": "匈牙利正将其完整的国家安全纪录档案库上载至互联网，这些档案可能揭示在1989年前长达40年的共产主义统治期间，谁曾监视邻居、同事、朋友和亲属。\n\n对一些人而言，这提供了一个期待已久的机会，去追寻有关在共产主义政权及其庞大间谍网络手中遭逮捕、盘问和失踪事件的解释。\n\n作为1980年代共产主义统治下匈牙利的反对派活动人士，巴林特·马扎尔（Bálint Magyar）知道自己一直受到严密监视。\n\n此后，他设法取得国家秘密搜集的部分个人资料，其中包括一份警方线人的报告，记录了他在1987年向一群教师发表的演讲。报告称，他「表明我国很快将会发生政权更迭」。\n\n如今，马扎尔已能以幽默的角度看待此事。他对BBC国际部（BBC World Service）说：「我不记得自己那么早就已经在谈论政权更迭的可能性了。」\n\n他仍不知道那名线人是谁，也不清楚监视其活动行动的任何细节，但这些答案可能很快就会揭晓。\n\n他说：「整套机器本身以及其运作方式，从未向公众公开。也许，让所有文件都能完全公开查阅，将有助于让所有人更清楚地了解整个制度。」\n\n首批档案从11月4日起公开，当天正值苏联武力镇压匈牙利1956年民主运动起义70周年。\n\n匈牙利建立了一套庞大的监控体系。合作者从公众中招募而来，通常透过勒索或贿赂方式，负 最终未升级为大规模政治风波。\n\n相比之下，《VIVANT》引发的争议更为持久。剧中中国情报人员对日本特务施以酷刑的情节。事件曝光后，中国外交部、国防部等官方机构先后回应，官媒亦连日发表评论，相关话题一度长时间占据中国网络热搜。\n\n香港浸会大学传播学院副教授闾丘露薇对BBC中文说，她和同事曾对外交部发言人的发言内容进行系统研究，结果显示官方态度首先取决于议题性质。涉及领土、主权、历史等核心利益的议题，措辞通常最严厉；如果牵涉日本，反应预期会更强硬。\n\n她指出，其次是对象和双边关系。台湾被北京视为主权问题，官方没有退让空间；对日本，历史记忆和国内舆论令官方难以放软态度；对欧美，官方则要同时权衡经贸和外交关系，反应因此相对克制。\n\n国立政治大学国家发展研究所副教授黄兆年认为，官方介入程度、回应层级和持续时间，主要取决于两个因素：事件本身在多大程度上关乎国家尊严和民族情感，以及事件发生期间是否存在其他重大顾虑。\n\n他指出，对于同时出现的多宗争议，当局会进行成本效益评估。在蔡康永事件上，北京必须考虑台湾正值选举这一背景，也会担心强硬表态影响统派选情。\n\n过去几年，这类风波的舆论压力往往不止停留在社交媒体，而是迅速扩散至商业领域。从品牌道歉、撤换代言人，到企业修改官网表述，中国庞大的消费市场已成为传递政治讯号的一部分。\n\n另一场风波围绕姆巴佩展开。他被指曾发表涉及毛泽东的负面言论，引发中国网络舆论批评。\n\n随著事件升温，多家与姆巴佩合作的品牌受到中国网民施压，要求作出表态。有中国品牌迅速解约、中止转播。官媒多次强调，中国广告收入是姆巴佩的重要收入来源，形容他「搬起石头砸自己的脚」，并以失去中国市场作为警告。\n\n《VIVANT》则被新华社定性为「恶意抹黑中国、炮制虚假历史叙事」后，中国舆论场也开始追查哪些企业曾在剧中投放广告，并要求相关企业道歉。与该剧合作的日本企业三丽鸥（Sanrio）其后公开道歉，令事件进一步扩大至商业层面。\n\n闾丘露薇认为，这种做法并不新鲜。「只要对方在乎中国市场，这种做法往往很快见效，例如品牌道歉、撤换代言人。」她说，这已成为中国对外施压的常用工具之一，而且未来仍可能持续使用。\n\n不过，这种手段的效果取决于对方对中国市场的依赖程度。对依赖较低的国家或企业，作用有限；长远而言，也可能促使对方分散市场，减少对中国的依赖。\n\n美国迈阿密大学（University of Miami）政治学教授金德芳（June Teufel Dreyer）表示，北京利用市场规模影响外部行为已有相当长的历史，而且在不少案例中确实取得效果。「如果一家企业认为失去中国市场将付出巨大代价，它通常会选择道歉或让步。」\n\n但她也指出，近年一些国家和企业开始重新评估风险。当企业发现中国市场同时伴随政治和监管不确定性时，便可能寻求降低依赖。\n\n美国企业研究所（American Enterprise Institute）高级研究员黄韵琪认为，民族主义动员与市场压力很难完全分开。「中国政府不一定需要直接下达行政命令，只要市场和舆论相信某家公司触碰了政治红线，企业往往就会主动作出调整。」\n\n黄兆年则指出，与十年前相比，中国市场对全球企业仍然重要，但相对吸引力已不如过去。在地缘政治风险升高、供应链重组及中国经济放缓的背景下，企业的计算方式正在改变。对北京而言，市场规模仍是重要筹码，但未必像过去那样具有压倒性的威慑力。\n\n受访学者认为，理解近年频繁出现的「辱华」风波，不能只从外交或对外关系角度观察，还要放回中国国内政治的脉络中。\n\n闾丘露薇指出，以「百年屈辱」为核心的民族主义叙事并非近年才出现，而是在1989年后透过爱国主义教育，被系统性地推广至教科书、媒体和文化产品。她认为，这类动员首先服务于内政，核心作用是巩固执政合法性、凝聚社会共识；向外界传递政治讯号则属于次要功能。\n\n黄兆年认为，在经济高速增长不再被视为理所当然的背景下，民族主义对中共的重要性正在上升。当局需要持续向民众展示自己是国家利益和民族尊严的捍卫者，而外部冲突和「辱华」争议恰好提供了这样的机会。\n\n黄韵琪也表示，中国官方对相关事件的回应，往往不仅是针对事件本身，更是在向国内受众展示政府正在捍卫核心利益与国家尊严。她认为，民族主义已成为中国政府的重要政治资源。\n\n不过，受访学者同时指出，民族主义不能无限制地被动员。黄韵琪警告，一旦民族主义情绪被全面激发，未必总能按照官方预期的方向发展。她形容，民族主义有时像被打开的「潘朵拉盒子」，既能成为动员社会的工具，也可能带来难以完全控制的后果。\n\n近年愈来愈多「辱华」事件在网络上引发巨大讨论，却未必能在现实社会留下同样强烈的影响。在姆巴佩事件中，不少中国网民甚至不清楚争议源于哪一句言论；《VIVANT》的剧情争议对许多人而言较为遥远；蔡康永多年来累积的知名度和观众缘，也使部分用户没有完全响应抵制呼吁。\n\n闾丘露薇部分认同民族主义动员出现疲劳的说法，但认为「疲劳」未必是最准确的描述。「我觉得更像是网络和现实成了两个平行的世界。」她说，演算法能决定人们在手机上看到什么，也能在短时间内点燃强烈情绪，但这些情绪往往来得快、去得也快。\n\n在她看来，这更多反映民族主义动员的边际效应正在下降。「类似事件越来越频繁，议题又往往离普通人的生活很远，每一次动员的影响力自然就减弱了。」\n\n抖音上也有用户留言说：「月薪三千累死累活到家，发现自己民族情感被伤害了？」这类声音反映，部分网民更在意现实生活压力，而非遥远的政治争议。\n\n黄兆年认为，民族主义动员在中国长期存在，但普通人也会计算何时表态、表态到什么程度。并非每一次官方发动，民众都需要以同样的热情回应。\n\n他指出，今天的中国人与其说是被「洗脑」，不如说是被「洗嘴」：人们对表达真实意见心存忌惮，但何时、在何种程度上响应中央，是一种计算，而非真的相信。", "body": "近几周，中国舆论场接连出现三宗被贴上「辱华」标签的争议：台湾艺人蔡康永、日本电视剧《VIVANT》以及法国足球明星姆巴佩。三宗事件看似性质相近，但官方反应、官媒投入程度和舆论热度并不一致。\n\n蔡康永的言论被部分中国网民解读为涉及台湾主权立场，但官方回应有限，并未持续高调追击；《VIVANT》则引起中国外交部、国防部及官媒接连回应；姆巴佩事件在网络批评之外，更蔓延至品牌合作和商业层面。\n\n三宗事件分别涉及台湾、日本和西方国家，却都被置于「辱华」的框架下讨论。多名受访学者认为，北京的处理方式并非单纯取决于对象来自哪个国家或地区，而在于事件是否触及主权、历史记忆等核心政治议题，以及当下的双边关系与内外政策考量。\n\n他们指出，中国官方一方面持续借助民族主义凝聚国内共识，另一方面也试图控制动员强度，避免影响外交关系、经济利益和其他政策目标。三宗风波正好呈现出这种权衡与取舍。\n\n蔡康永事件最初在社交媒体发酵。部分中国网民将其言论解读为涉及台湾主权立场，要求封杀并要求他表态，但官方和主流官媒并未持续追击。蔡康永多年来在中国累积的知名度与市场影响力，也使事件最终未升级为大规模政治风波。\n\n相比之下，《VIVANT》引发的争议更为持久。剧中中国情报人员对日本特务施以酷刑的情节。事件曝光后，中国外交部、国防部等官方机构先后回应，官媒亦连日发表评论，相关话题一度长时间占据中国网络热搜。\n\n香港浸会大学传播学院副教授闾丘露薇对BBC中文说，她和同事曾对外交部发言人的发言内容进行系统研究，结果显示官方态度首先取决于议题性质。涉及领土、主权、历史等核心利益的议题，措辞通常最严厉；如果牵涉日本，反应预期会更强硬。\n\n她指出，其次是对象和双边关系。台湾被北京视为主权问题，官方没有退让空间；对日本，历史记忆和国内舆论令官方难以放软态度；对欧美，官方则要同时权衡经贸和外交关系，反应因此相对克制。\n\n国立政治大学国家发展研究所副教授黄兆年认为，官方介入程度、回应层级和持续时间，主要取决于两个因素：事件本身在多大程度上关乎国家尊严和民族情感，以及事件发生期间是否存在其他重大顾虑。\n\n他指出，对于同时出现的多宗争议，当局会进行成本效益评估。在蔡康永事件上，北京必须考虑台湾正值选举这一背景，也会担心强硬表态影响统派选情。\n\n过去几年，这类风波的舆论压力往往不止停留在社交媒体，而是迅速扩散至商业领域。从品牌道歉、撤换代言人，到企业修改官网表述，中国庞大的消费市场已成为传递政治讯号的一部分。\n\n另一场风波围绕姆巴佩展开。他被指曾发表涉及毛泽东的负面言论，引发中国网络舆论批评。\n\n随著事件升温，多家与姆巴佩合作的品牌受到中国网民施压，要求作出表态。有中国品牌迅速解约、中止转播。官媒多次强调，中国广告收入是姆巴佩的重要收入来源，形容他「搬起石头砸自己的脚」，并以失去中国市场作为警告。\n\n《VIVANT》则被新华社定性为「恶意抹黑中国、炮制虚假历史叙事」后，中国舆论场也开始追查哪些企业曾在剧中投放广告，并要求相关企业道歉。与该剧合作的日本企业三丽鸥（Sanrio）其后公开道歉，令事件进一步扩大至商业层面。\n\n闾丘露薇认为，这种做法并不新鲜。「只要对方在乎中国市场，这种做法往往很快见效，例如品牌道歉、撤换代言人。」她说，这已成为中国对外施压的常用工具之一，而且未来仍可能持续使用。\n\n不过，这种手段的效果取决于对方对中国市场的依赖程度。对依赖较低的国家或企业，作用有限；长远而言，也可能促使对方分散市场，减少对中国的依赖。\n\n美国迈阿密大学（University of Miami）政治学教授金德芳（June Teufel Dreyer）表示，北京利用市场规模影响外部行为已有相当长的历史，而且在不少案例中确实取得效果。「如果一家企业认为失去中国市场将付出巨大代价，它通常会选择道歉或让步。」\n\n但她也指出，近年一些国家和企业开始重新评估风险。当企业发现中国市场同时伴随政治和监管不确定性时，便可能寻求降低依赖。\n\n美国企业研究所（American Enterprise Institute）高级研究员黄韵琪认为，民族主义动员与市场压力很难完全分开。「中国政府不一定需要直接下达行政命令，只要市场和舆论相信某家公司触碰了政治红线，企业往往就会主动作出调整。」\n\n黄兆年则指出，与十年前相比，中国市场对全球企业仍然重要，但相对吸引力已不如过去。在地缘政治风险升高、供应链重组及中国经济放缓的背景下，企业的计算方式正在改变。对北京而言，市场规模仍是重要筹码，但未必像过去那样具有压倒性的威慑力。\n\n受访学者认为，理解近年频繁出现的「辱华」风波，不能只从外交或对外关系角度观察，还要放回中国国内政治的脉络中。\n\n闾丘露薇指出，以「百年屈辱」为核心的民族主义叙事并非近年才出现，而是在1989年后透过爱国主义教育，被系统性地推广至教科书、媒体和文化产品。她认为，这类动员首先服务于内政，核心作用是巩固执政合法性、凝聚社会共识；向外界传递政治讯号则属于次要功能。\n\n黄兆年认为，在经济高速增长不再被视为理所当然的背景下，民族主义对中共的重要性正在上升。当局需要持续向民众展示自己是国家利益和民族尊严的捍卫者，而外部冲突和「辱华」争议恰好提供了这样的机会。\n\n黄韵琪也表示，中国官方对相关事件的回应，往往不仅是针对事件本身，更是在向国内受众展示政府正在捍卫核心利益与国家尊严。她认为，民族主义已成为中国政府的重要政治资源。\n\n不过，受访学者同时指出，民族主义不能无限制地被动员。黄韵琪警告，一旦民族主义情绪被全面激发，未必总能按照官方预期的方向发展。她形容，民族主义有时像被打开的「潘朵拉盒子」，既能成为动员社会的工具，也可能带来难以完全控制的后果。\n\n近年愈来愈多「辱华」事件在网络上引发巨大讨论，却未必能在现实社会留下同样强烈的影响。在姆巴佩事件中，不少中国网民甚至不清楚争议源于哪一句言论；《VIVANT》的剧情争议对许多人而言较为遥远；蔡康永多年来累积的知名度和观众缘，也使部分用户没有完全响应抵制呼吁。\n\n闾丘露薇部分认同民族主义动员出现疲劳的说法，但认为「疲劳」未必是最准确的描述。「我觉得更像是网络和现实成了两个平行的世界。」她说，演算法能决定人们在手机上看到什么，也能在短时间内点燃强烈情绪，但这些情绪往往来得快、去得也快。\n\n在她看来，这更多反映民族主义动员的边际效应正在下降。「类似事件越来越频繁，议题又往往离普通人的生活很远，每一次动员的影响力自然就减弱了。」\n\n抖音上也有用户留言说：「月薪三千累死累活到家，发现自己民族情感被伤害了？」这类声音反映，部分网民更在意现实生活压力，而非遥远的政治争议。\n\n黄兆年认为，民族主义动员在中国长期存在，但普通人也会计算何时表态、表态到什么程度。并非每一次官方发动，民众都需要以同样的热情回应。\n\n他指出，今天的中国人与其说是被「洗脑」，不如说是被「洗嘴」：人们对表达真实意见心存忌惮，但何时、在何种程度上响应中央，是一种计算，而非真的相信。", "link": "https://www.bbc.com/zhongwen/articles/c6gm0rdzm0rdo/trad?at_medium=RSS&at_campaign=rss", "time": "11月06日 08:21", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "美国中期选举：共和党失去两院，对华政策与对台军售会转向吗？", "title_zh": "美国中期选举：共和党失去两院，对华政策与对台军售会转向吗？", "summary_orig": "美国期中选举民主党取得两院多数后，专家普遍认为，特朗普（川普）以个人外交主导的中国政策与对台军售节奏将面临国会更多监督与拉锯，但总统仍掌握主要决策权。", "summary_zh": "美国期中选举民主党取得两院多数后，专家普遍认为，特朗普（川普）以个人外交主导的中国政策与对台军售节奏将面临国会更多监督与拉锯，但总统仍掌握主要决策权。", "body_orig": "", "body_zh": "美国中期选举结果出炉，民主党在参众两院同时翻盘，共和党总统特朗普（Donald Trump，又译川普）的第二任期后半段将在「跛脚」状态下展开。这场选举不只改变华盛顿的权力版图，也可能牵动美中关系与台湾议题的走向。\n\n时机尤其敏感。11月18至19日，亚太经合组织（APEC）领导人峰会将在深圳举行；12月中，特朗普与习近平还可能在迈阿密G20峰会再度会面。价值140亿美元的对台军售案正卡在特朗普手中，他今年5月曾公开称这笔军售是「很好的谈判筹码」。民主党掌控国会后，出口管制、晶片限制与军售节奏会否出现新的拉锯，成为观察焦点。\n\n多位专家向BBC中文分析，美国两党在对华问题上的共识深厚，总统仍是政策主导者，大方向不会因国会易主而改变；真正的变化在于监督力度，民主党将透过听证会、传票、《国防授权法》与拨款法案，严格审视特朗普与北京达成的贸易休战。\n\n与此同时，多位长期支持台湾的共和党「台湾连线」议员落马，也意味著台北必须重新经营与新生代民主党议员的关系。\n\n美国智库太平洋论坛（Pacific Forum）兼任研究员蓝若思（Elizabeth Larus）向BBC中文表示，无论国会由哪个党派掌握多数，美国对台湾的支持及对华政策都不会改变，两党都会试图推动特朗普批准桌上那笔140亿美元的对台军售案。\n\n「自1979年以来，每一任美国总统都维持了《台湾关系法》、『六项保证』以及美国的『一个中国』政策，这些都不会因为民主党掌控国会而改变。」她说。\n\n美国智库德国马歇尔基金会（German Marshall Fund, GMF）亚洲计划主任葛来仪（Bonnie Glaser）预测，民主党将掌控拨款程序与参议院议程，很可能在《国防授权法》（NDAA）与拨款法案中加入多项要求：加速交付已核准的对台武器、新的对外军售（FMS）案件通报、对台使用外国军事融资（FMF），以及台湾安全合作倡议（Taiwan Security Cooperation Initiative）资金。《六项保证法案》（Six Assurances Act）也可能获得更多推进动能。\n\n葛来仪还指出，民主党大胜后，美国可能加强对中国取得先进晶片的限制，《安全晶片法案》（Safe Chips Act）有机会通过。但特朗普拥有否决权，民主党票数不足以推翻，除非部分共和党议员倒戈支持。\n\n新加坡南洋理工大学公共政策与全球事务副教授骆明辉（Dylan Loh）对BBC中文表示：「美国对中国存在广泛共识，整体关系的塑造仍主要由总统主导。」\n\n新加坡独立分析师邓铭杰也不认为民主党大胜会带来更温和的对华政策。两大党在出口管制、晶片限制与供应链措施上立场一致，实际变化在于监督力度：民主党将透过听证会与传票，严格审视贸易休战和「建设性战略稳定」框架。\n\n此文包含Google YouTube提供的内容。由于这些内容会使用曲奇或小甜饼等科技，我们在加载任何内容前会寻求您的认可。 您可能在给予许可前希望阅读Google YouTube曲奇政策和隐私政策。希望阅读上述内容，请点击“接受并继续”。\n\n中国近年对特朗普的战略，核心是「以经贸换稳定、以个人关系控风险」。第一任期时，北京透过贸易谈判与大规模采购美国农产品，换取特朗普在台海议题上的相对克制。\n\n专家认为，第二任期北京更进一步，把对台军售直接纳入美中高层谈判，并以贸易休战、稀土与供应链议题作为杠杆，试图让特朗普把台湾问题「交易化」。\n\n习近平多次强调台湾是「最重要议题」，并在此前的峰会上要求美方明确反对台湾独立，同时暗示稳定关系取决于限制对台支持。北京判断特朗普重视交易成果多于长期承诺，因此采取「耐心施压、避免正面冲突」的策略，等待他任期内的窗口，同时为「后特朗普」时期预做准备。\n\n至于中期选举本身，骆明辉认为，北京自然会关注结果，但不会过度在意谁胜谁负：无论牌局如何发展，中南海都会积极规划，并把战略目光放在特朗普任期结束之后。\n\n特朗普任内的对台军售呈现「先放后卡」的节奏。第一任期他多次批准军售，规模与频率高于前任，涵盖战机、坦克与飞弹系统，并强化高层军事交流；2025年12月，他更批准约111亿美元的大规模军售案，创下纪录。\n\n转折出现在2026年初。涉及爱国者飞弹、雷达与指挥系统、用于台湾「T-Dome」防空体系的140亿美元新案被长期搁置，特朗普在与习近平会谈后持续延迟。\n\n美国前外交官、捍卫民主基金会（Foundation for Defense of Democracies, FDD）中国项目主任辛格顿（Craig Singleton）本周在\n\n警告，延迟对台军售正在制造「危险的误解」，「今天为避免摩擦而搁置，可能为明天更危险的对抗创造条件」。他认为，数十年来美中靠精心拿捏的语言和战略模糊处理台湾问题，但如今习近平可能将延迟军售解读为华盛顿默认「稳定美中关系取决于限制对台支持」的前提。军售拖得越久，北京越可能把未来任何推进视为背叛，反而引发特朗普试图避免的不稳定。\n\n除了军售，美台在情报分享、联合演训、不对称战力与无人机上的合作仍在持续，但节奏受白宫与北京谈判牵制。\n\n第一个观察点，邓铭杰向BBC中文透露，有美国官员早前表示，此案被「拆包」成较小规模方案的机率已大幅上升；布鲁金斯学会的何瑞恩（Ryan Hass）也预期，APEC与G20之后会出现较小规模的军售案。\n\n年底的《国防授权法》是第二个观察点。参议院版本加入了对台战争储备库存，并将台湾纳入涵盖菲律宾的更广泛「第一岛链」倡议。邓铭杰认为，这些条款能否在最终版本中保留，值得关注。\n\n第三则是政治修辞。特朗普今年5月曾说他「不希望有人走向独立」，若类似表述出现在深圳或迈阿密峰会的书面声明中，将是真正的转变。\n\n此次选举中，多位「台湾连线」的共和党议员遭淘汰。这些友台议员长期推动对台军售、加强军事合作并监督行政部门，每年都有成员拜访台湾；取而代之的，是许多首次进入众议院的年轻民主党人，他们对台湾乃至中国事务是否熟悉，都是问号。\n\n台美关系研究社群「美国台湾观测站」分析指出，胜选的新生代议员多数对国际议题鲜少著墨，或强调外交优先、减少军事干预，民主党内年轻「进步派」是否会走更多元的外交路线，值得观察。\n\n蓝若思则提醒另一层矛盾：特朗普呼吁增加支出以重建美国海军，应对中国海军的扩张；但民主党更关注「奶油」而非「枪砲」，民主党主导的国会将优先扩大医疗补助与气候政策等福利支出，进而压缩国防预算，使军事科技投资更难推动。\n\n「美国台湾观测站」也分析，从历史经验看，历届总统任期最后几年常把重心转向海外事务，白宫自今年4月起已开始盘点移民、关税、住房等不需国会的行动，特朗普更自称「否决先生」（Mr. Veto）。外交仍主要由行政权主导，因此即便特朗普「跛脚」，对台美关系影响有限。\n\n台湾国防安全研究院助理研究员钟志东早前在台北一场会议上提出类似判断：当前的中美关系可用「短多长空」理解。他强调，台美关系必须放在中美关系的整体结构中看待，1979年美国即便需要联合北京抗衡苏联，也未接受停止对台军售的要求；在中美战略竞争持续升温的今天，美国在此议题上让步的空间反而更低。即使短期内不会宣布大手笔军售，也不代表美国正在台湾议题上向中国妥协。\n\n中期选举改变的是华盛顿由谁来提问，但关于台湾的最终答案，仍掌握在特朗普手中。邓铭杰向BBC中文强调，台湾最大的风险在于优先顺序的落差：北京几乎把台湾置于一切之上，而特朗普同时在处理贸易、稀土与其他议题。\n\n接下来，台北必须同时与新国会和白宫打交道。在岛内「疑美论」不断发酵的背景下，不同政党对美国的期待本就分歧，华盛顿的权力重组，只会让台北的说服工作更加复杂。", "body": "美国中期选举结果出炉，民主党在参众两院同时翻盘，共和党总统特朗普（Donald Trump，又译川普）的第二任期后半段将在「跛脚」状态下展开。这场选举不只改变华盛顿的权力版图，也可能牵动美中关系与台湾议题的走向。\n\n时机尤其敏感。11月18至19日，亚太经合组织（APEC）领导人峰会将在深圳举行；12月中，特朗普与习近平还可能在迈阿密G20峰会再度会面。价值140亿美元的对台军售案正卡在特朗普手中，他今年5月曾公开称这笔军售是「很好的谈判筹码」。民主党掌控国会后，出口管制、晶片限制与军售节奏会否出现新的拉锯，成为观察焦点。\n\n多位专家向BBC中文分析，美国两党在对华问题上的共识深厚，总统仍是政策主导者，大方向不会因国会易主而改变；真正的变化在于监督力度，民主党将透过听证会、传票、《国防授权法》与拨款法案，严格审视特朗普与北京达成的贸易休战。\n\n与此同时，多位长期支持台湾的共和党「台湾连线」议员落马，也意味著台北必须重新经营与新生代民主党议员的关系。\n\n美国智库太平洋论坛（Pacific Forum）兼任研究员蓝若思（Elizabeth Larus）向BBC中文表示，无论国会由哪个党派掌握多数，美国对台湾的支持及对华政策都不会改变，两党都会试图推动特朗普批准桌上那笔140亿美元的对台军售案。\n\n「自1979年以来，每一任美国总统都维持了《台湾关系法》、『六项保证』以及美国的『一个中国』政策，这些都不会因为民主党掌控国会而改变。」她说。\n\n美国智库德国马歇尔基金会（German Marshall Fund, GMF）亚洲计划主任葛来仪（Bonnie Glaser）预测，民主党将掌控拨款程序与参议院议程，很可能在《国防授权法》（NDAA）与拨款法案中加入多项要求：加速交付已核准的对台武器、新的对外军售（FMS）案件通报、对台使用外国军事融资（FMF），以及台湾安全合作倡议（Taiwan Security Cooperation Initiative）资金。《六项保证法案》（Six Assurances Act）也可能获得更多推进动能。\n\n葛来仪还指出，民主党大胜后，美国可能加强对中国取得先进晶片的限制，《安全晶片法案》（Safe Chips Act）有机会通过。但特朗普拥有否决权，民主党票数不足以推翻，除非部分共和党议员倒戈支持。\n\n新加坡南洋理工大学公共政策与全球事务副教授骆明辉（Dylan Loh）对BBC中文表示：「美国对中国存在广泛共识，整体关系的塑造仍主要由总统主导。」\n\n新加坡独立分析师邓铭杰也不认为民主党大胜会带来更温和的对华政策。两大党在出口管制、晶片限制与供应链措施上立场一致，实际变化在于监督力度：民主党将透过听证会与传票，严格审视贸易休战和「建设性战略稳定」框架。\n\n此文包含Google YouTube提供的内容。由于这些内容会使用曲奇或小甜饼等科技，我们在加载任何内容前会寻求您的认可。 您可能在给予许可前希望阅读Google YouTube曲奇政策和隐私政策。希望阅读上述内容，请点击“接受并继续”。\n\n中国近年对特朗普的战略，核心是「以经贸换稳定、以个人关系控风险」。第一任期时，北京透过贸易谈判与大规模采购美国农产品，换取特朗普在台海议题上的相对克制。\n\n专家认为，第二任期北京更进一步，把对台军售直接纳入美中高层谈判，并以贸易休战、稀土与供应链议题作为杠杆，试图让特朗普把台湾问题「交易化」。\n\n习近平多次强调台湾是「最重要议题」，并在此前的峰会上要求美方明确反对台湾独立，同时暗示稳定关系取决于限制对台支持。北京判断特朗普重视交易成果多于长期承诺，因此采取「耐心施压、避免正面冲突」的策略，等待他任期内的窗口，同时为「后特朗普」时期预做准备。\n\n至于中期选举本身，骆明辉认为，北京自然会关注结果，但不会过度在意谁胜谁负：无论牌局如何发展，中南海都会积极规划，并把战略目光放在特朗普任期结束之后。\n\n特朗普任内的对台军售呈现「先放后卡」的节奏。第一任期他多次批准军售，规模与频率高于前任，涵盖战机、坦克与飞弹系统，并强化高层军事交流；2025年12月，他更批准约111亿美元的大规模军售案，创下纪录。\n\n转折出现在2026年初。涉及爱国者飞弹、雷达与指挥系统、用于台湾「T-Dome」防空体系的140亿美元新案被长期搁置，特朗普在与习近平会谈后持续延迟。\n\n美国前外交官、捍卫民主基金会（Foundation for Defense of Democracies, FDD）中国项目主任辛格顿（Craig Singleton）本周在\n\n警告，延迟对台军售正在制造「危险的误解」，「今天为避免摩擦而搁置，可能为明天更危险的对抗创造条件」。他认为，数十年来美中靠精心拿捏的语言和战略模糊处理台湾问题，但如今习近平可能将延迟军售解读为华盛顿默认「稳定美中关系取决于限制对台支持」的前提。军售拖得越久，北京越可能把未来任何推进视为背叛，反而引发特朗普试图避免的不稳定。\n\n除了军售，美台在情报分享、联合演训、不对称战力与无人机上的合作仍在持续，但节奏受白宫与北京谈判牵制。\n\n第一个观察点，邓铭杰向BBC中文透露，有美国官员早前表示，此案被「拆包」成较小规模方案的机率已大幅上升；布鲁金斯学会的何瑞恩（Ryan Hass）也预期，APEC与G20之后会出现较小规模的军售案。\n\n年底的《国防授权法》是第二个观察点。参议院版本加入了对台战争储备库存，并将台湾纳入涵盖菲律宾的更广泛「第一岛链」倡议。邓铭杰认为，这些条款能否在最终版本中保留，值得关注。\n\n第三则是政治修辞。特朗普今年5月曾说他「不希望有人走向独立」，若类似表述出现在深圳或迈阿密峰会的书面声明中，将是真正的转变。\n\n此次选举中，多位「台湾连线」的共和党议员遭淘汰。这些友台议员长期推动对台军售、加强军事合作并监督行政部门，每年都有成员拜访台湾；取而代之的，是许多首次进入众议院的年轻民主党人，他们对台湾乃至中国事务是否熟悉，都是问号。\n\n台美关系研究社群「美国台湾观测站」分析指出，胜选的新生代议员多数对国际议题鲜少著墨，或强调外交优先、减少军事干预，民主党内年轻「进步派」是否会走更多元的外交路线，值得观察。\n\n蓝若思则提醒另一层矛盾：特朗普呼吁增加支出以重建美国海军，应对中国海军的扩张；但民主党更关注「奶油」而非「枪砲」，民主党主导的国会将优先扩大医疗补助与气候政策等福利支出，进而压缩国防预算，使军事科技投资更难推动。\n\n「美国台湾观测站」也分析，从历史经验看，历届总统任期最后几年常把重心转向海外事务，白宫自今年4月起已开始盘点移民、关税、住房等不需国会的行动，特朗普更自称「否决先生」（Mr. Veto）。外交仍主要由行政权主导，因此即便特朗普「跛脚」，对台美关系影响有限。\n\n台湾国防安全研究院助理研究员钟志东早前在台北一场会议上提出类似判断：当前的中美关系可用「短多长空」理解。他强调，台美关系必须放在中美关系的整体结构中看待，1979年美国即便需要联合北京抗衡苏联，也未接受停止对台军售的要求；在中美战略竞争持续升温的今天，美国在此议题上让步的空间反而更低。即使短期内不会宣布大手笔军售，也不代表美国正在台湾议题上向中国妥协。\n\n中期选举改变的是华盛顿由谁来提问，但关于台湾的最终答案，仍掌握在特朗普手中。邓铭杰向BBC中文强调，台湾最大的风险在于优先顺序的落差：北京几乎把台湾置于一切之上，而特朗普同时在处理贸易、稀土与其他议题。\n\n接下来，台北必须同时与新国会和白宫打交道。在岛内「疑美论」不断发酵的背景下，不同政党对美国的期待本就分歧，华盛顿的权力重组，只会让台北的说服工作更加复杂。", "link": "https://www.bbc.com/zhongwen/articles/cqr7ydkrnpxno/trad?at_medium=RSS&at_campaign=rss", "time": "11月06日 18:21", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "美国中期选举后，AI放缓忧虑重创全球大型科技股，韩国股市熔断", "title_zh": "美国中期选举后，AI放缓忧虑重创全球大型科技股，韩国股市熔断", "summary_orig": "市场正对美国期中选举后可能加强审查数据中心建设及人工智慧产业的前景作出反应。", "summary_zh": "市场正对美国期中选举后可能加强审查数据中心建设及人工智慧产业的前景作出反应。", "body_orig": "", "body_zh": "在美国期中选举引发外界对人工智慧（AI）发展放缓的忧虑之后，美国及亚洲主要科技企业市值蒸发数以千亿美元计，全球股市出现大幅抛售。\n\n随著主张放缓AI发展的民主党候选人在选举中胜出，科技及人工智慧相关企业股价应声大跌。\n\n根据道琼数据，以科技股为主的纳斯达克综合指数收市下跌超过5.5%，市值蒸发约2.5兆美元（1.9兆英镑）；其他美国主要股指亦出现显著跌幅，创下自2025年以来最差单日表现。\n\n这波抛售潮也反映市场原本就存在的忧虑，即企业在AI领域投入的庞大资金最终能否带来回报。\n\n亚洲方面，以科技股为主的股市指数周五早盘大幅下跌，生产AI所需晶片及相关设备的企业股价纷纷走低。\n\n日本日经225指数早盘下跌6%，记忆体晶片制造商铠侠（Kioxia）股价重挫逾12.6%，竞争对手东京威力科创（Tokyo Electron）则下跌9.5%。\n\n韩国晶片制造商SK海力士（SK Hynix）下跌超过11.5%，三星电子（Samsung）跌幅接近10%。\n\n首尔股市的抛售潮导致韩国综合股价指数（Kospi）暴跌超过8.5%，并触发所谓的「熔断机制」（circuit breaker），即透过暂停交易来抑制恐慌性卖盘。\n\n台湾加权股价指数（Taiex）下跌超过8.3%，晶圆代工龙头台积电（TSMC）重挫近8.5%。\n\nMarketWatch晶片产业分析师布兰妮．阮（Britney Nguyen）表示，这反映出市场对AI基础建设支出规模的担忧「正在持续发酵」。\n\n民主党候选人在全美多场选战中主张放缓数据中心与人工智慧产业的扩张，而全国各地选票上也出现数十项旨在限制这类基础设施发展的提案。\n\n随著民主党在周二期中选举中拿下参议院与众议院控制权，他们将在特朗普（Donald Trump）剩余任期内掌握国会主导权。\n\n德州新当选的民主党籍州长吉娜·伊诺霍萨（Gina Hinojosa）竞选期间便大力反对数据中心扩张，并承诺暂停批准新的数据中心建设计划。\n\n以及，「记住，不是共和党，而是『笨主党』（Dumocrats，嘲讽民主党的说法）。但不用害怕，不管用什么方法，我们很快就会变得比以往更加强大。让美国再次伟大！」\n\n部分民主党人士则认为，人工智慧产业在缺乏足够监管与安全防护措施下发展过快，因此希望利用掌握国会的新权力加以约束。\n\n民主党参议员伯尼·桑德斯（Bernie Sanders）周四在X平台发文表示：「美国人民不希望大型科技寡头破坏环境、摧毁工作机会，并威胁人类未来。现在就应实施全国性的数据中心建设暂停令。」\n\n高度依赖AI数据中心业务的企业，包括关键晶片制造商与半导体公司股价周四全面重挫，突显投资人的忧虑其实早已逐渐累积。\n\n欧洲股市周四交易时段，晶片制造商英飞凌（Infineon）股价下跌超过8.5%，科技设备制造商艾司摩尔（ASML）下跌6.5%。\n\n其他晶片制造商也同样受挫，超微（AMD）与美光（Micron）跌幅均超过17%；英特尔（Intel）下跌10.3%；记忆卡制造商闪迪（Sandisk）更暴跌超过22%。\n\n追踪30家大型半导体企业表现的费城半导体指数（Philadelphia Semiconductor Index）重挫超过12%。\n\n马斯克（Elon Musk）旗下的SpaceX与特斯拉（Tesla）股价也大幅下跌，分别下跌8%和接近11%，单日合计蒸发超过3,000亿美元市值。\n\n马斯克先前曾投入近4.5亿美元支持共和党候选人，其中至少4,500万美元协助肯·帕克斯顿（Ken Paxton）竞选德州参议员席次，但德州最终仍在周二晚间出现所谓的「民主党海啸」，转向支持民主党。\n\n整体而言，包括苹果（Apple）、辉达与特斯拉在内的所谓「科技七巨头」（Magnificent Seven），单日市值合计蒸发约1兆美元。\n\n标普500指数（S&P 500）收盘下跌4.4%；道琼工业平均指数（Dow Jones Industrial Average）则回吐周三所有涨幅，收跌超过3.4%。\n\n由于跌幅过大，纳斯达克综合指数（Nasdaq Composite）已进入市场人士所称的「修正区间」（correction territory），即指数较近期高点回落至少10%。\n\n财富俱乐部（Wealth Club）首席投资策略师苏珊娜·斯特里特（Susannah Streeter）表示，纳斯达克与标普500的大幅下跌正向全球市场传递冲击波。\n\n「市场原本就担心投入AI基础设施的庞大资金未必能带来投资人期待的回报，如今又面临数据中心建设可能大幅放缓的风险，两种忧虑同时爆发。」\n\n盛宝银行（Saxo）首席投资策略师查鲁·查纳纳（Charu Chanana）则表示，未来数据中心审批将受到更严格检视，而其对环境及电价的影响也可能拖延计划进度并推高整体产业成本。\n\n她表示，两大政党都希望确保美国在科技领域维持领先，「但支持AI发展，与允许基础设施不计代价、不受限制地扩张，是两回事。」\n\nOpenAI总裁兼共同创办人格雷格·布罗克曼（Greg Brockman）表示，他认为各界都对社会对数据中心的反应感到意外，而业界仍需做更多工作争取地方社区支持。\n\n布罗克曼周三晚间在加州纳帕（Napa）举行的《华尔街日报》科技会议（WSJ Tech conference）上表示：「过去一年来，我们逐渐意识到，身在旧金山、却想在德州、乔治亚州以及其他地方兴建基础设施时，不能只是在社群媒体上发文说『这会是件好事』。你必须真正走进那些社区。」\n\nMeta总裁黛娜·鲍威尔·麦考密克（Dina Powell McCormick）则表示，科技产业需要更努力向大众说明AI的价值。\n\n除了期中选举带来的即时冲击之外，也有愈来愈多投资人开始担心，AI概念股可能已形成资产泡沫，而市场正迎来一次必要的修正。\n\n本文原以英文撰写，我们使用了人工智能协助翻译，并由BBC记者在发布前进行审核。了解更多关于我们如何使用人工智能的资讯。", "body": "在美国期中选举引发外界对人工智慧（AI）发展放缓的忧虑之后，美国及亚洲主要科技企业市值蒸发数以千亿美元计，全球股市出现大幅抛售。\n\n随著主张放缓AI发展的民主党候选人在选举中胜出，科技及人工智慧相关企业股价应声大跌。\n\n根据道琼数据，以科技股为主的纳斯达克综合指数收市下跌超过5.5%，市值蒸发约2.5兆美元（1.9兆英镑）；其他美国主要股指亦出现显著跌幅，创下自2025年以来最差单日表现。\n\n这波抛售潮也反映市场原本就存在的忧虑，即企业在AI领域投入的庞大资金最终能否带来回报。\n\n亚洲方面，以科技股为主的股市指数周五早盘大幅下跌，生产AI所需晶片及相关设备的企业股价纷纷走低。\n\n日本日经225指数早盘下跌6%，记忆体晶片制造商铠侠（Kioxia）股价重挫逾12.6%，竞争对手东京威力科创（Tokyo Electron）则下跌9.5%。\n\n韩国晶片制造商SK海力士（SK Hynix）下跌超过11.5%，三星电子（Samsung）跌幅接近10%。\n\n首尔股市的抛售潮导致韩国综合股价指数（Kospi）暴跌超过8.5%，并触发所谓的「熔断机制」（circuit breaker），即透过暂停交易来抑制恐慌性卖盘。\n\n台湾加权股价指数（Taiex）下跌超过8.3%，晶圆代工龙头台积电（TSMC）重挫近8.5%。\n\nMarketWatch晶片产业分析师布兰妮．阮（Britney Nguyen）表示，这反映出市场对AI基础建设支出规模的担忧「正在持续发酵」。\n\n民主党候选人在全美多场选战中主张放缓数据中心与人工智慧产业的扩张，而全国各地选票上也出现数十项旨在限制这类基础设施发展的提案。\n\n随著民主党在周二期中选举中拿下参议院与众议院控制权，他们将在特朗普（Donald Trump）剩余任期内掌握国会主导权。\n\n德州新当选的民主党籍州长吉娜·伊诺霍萨（Gina Hinojosa）竞选期间便大力反对数据中心扩张，并承诺暂停批准新的数据中心建设计划。\n\n以及，「记住，不是共和党，而是『笨主党』（Dumocrats，嘲讽民主党的说法）。但不用害怕，不管用什么方法，我们很快就会变得比以往更加强大。让美国再次伟大！」\n\n部分民主党人士则认为，人工智慧产业在缺乏足够监管与安全防护措施下发展过快，因此希望利用掌握国会的新权力加以约束。\n\n民主党参议员伯尼·桑德斯（Bernie Sanders）周四在X平台发文表示：「美国人民不希望大型科技寡头破坏环境、摧毁工作机会，并威胁人类未来。现在就应实施全国性的数据中心建设暂停令。」\n\n高度依赖AI数据中心业务的企业，包括关键晶片制造商与半导体公司股价周四全面重挫，突显投资人的忧虑其实早已逐渐累积。\n\n欧洲股市周四交易时段，晶片制造商英飞凌（Infineon）股价下跌超过8.5%，科技设备制造商艾司摩尔（ASML）下跌6.5%。\n\n其他晶片制造商也同样受挫，超微（AMD）与美光（Micron）跌幅均超过17%；英特尔（Intel）下跌10.3%；记忆卡制造商闪迪（Sandisk）更暴跌超过22%。\n\n追踪30家大型半导体企业表现的费城半导体指数（Philadelphia Semiconductor Index）重挫超过12%。\n\n马斯克（Elon Musk）旗下的SpaceX与特斯拉（Tesla）股价也大幅下跌，分别下跌8%和接近11%，单日合计蒸发超过3,000亿美元市值。\n\n马斯克先前曾投入近4.5亿美元支持共和党候选人，其中至少4,500万美元协助肯·帕克斯顿（Ken Paxton）竞选德州参议员席次，但德州最终仍在周二晚间出现所谓的「民主党海啸」，转向支持民主党。\n\n整体而言，包括苹果（Apple）、辉达与特斯拉在内的所谓「科技七巨头」（Magnificent Seven），单日市值合计蒸发约1兆美元。\n\n标普500指数（S&P 500）收盘下跌4.4%；道琼工业平均指数（Dow Jones Industrial Average）则回吐周三所有涨幅，收跌超过3.4%。\n\n由于跌幅过大，纳斯达克综合指数（Nasdaq Composite）已进入市场人士所称的「修正区间」（correction territory），即指数较近期高点回落至少10%。\n\n财富俱乐部（Wealth Club）首席投资策略师苏珊娜·斯特里特（Susannah Streeter）表示，纳斯达克与标普500的大幅下跌正向全球市场传递冲击波。\n\n「市场原本就担心投入AI基础设施的庞大资金未必能带来投资人期待的回报，如今又面临数据中心建设可能大幅放缓的风险，两种忧虑同时爆发。」\n\n盛宝银行（Saxo）首席投资策略师查鲁·查纳纳（Charu Chanana）则表示，未来数据中心审批将受到更严格检视，而其对环境及电价的影响也可能拖延计划进度并推高整体产业成本。\n\n她表示，两大政党都希望确保美国在科技领域维持领先，「但支持AI发展，与允许基础设施不计代价、不受限制地扩张，是两回事。」\n\nOpenAI总裁兼共同创办人格雷格·布罗克曼（Greg Brockman）表示，他认为各界都对社会对数据中心的反应感到意外，而业界仍需做更多工作争取地方社区支持。\n\n布罗克曼周三晚间在加州纳帕（Napa）举行的《华尔街日报》科技会议（WSJ Tech conference）上表示：「过去一年来，我们逐渐意识到，身在旧金山、却想在德州、乔治亚州以及其他地方兴建基础设施时，不能只是在社群媒体上发文说『这会是件好事』。你必须真正走进那些社区。」\n\nMeta总裁黛娜·鲍威尔·麦考密克（Dina Powell McCormick）则表示，科技产业需要更努力向大众说明AI的价值。\n\n除了期中选举带来的即时冲击之外，也有愈来愈多投资人开始担心，AI概念股可能已形成资产泡沫，而市场正迎来一次必要的修正。\n\n本文原以英文撰写，我们使用了人工智能协助翻译，并由BBC记者在发布前进行审核。了解更多关于我们如何使用人工智能的资讯。", "link": "https://www.bbc.com/zhongwen/articles/cqlyeen0z8x2o/trad?at_medium=RSS&at_campaign=rss", "time": "11月06日 13:19", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "美国中期选举结果对中国和世界各国意味着什么？", "title_zh": "美国中期选举结果对中国和世界各国意味着什么？", "summary_orig": "民主党在美国中期选举中取得胜利，将在特朗普总统余下的任期内掌控国会，标志着美国政治格局出现重大变化。从乌克兰和中东的冲突，到美国与中国的贸易关系，BBC记者分析这次选举结果对世界其他地区意味着什么。", "summary_zh": "民主党在美国中期选举中取得胜利，将在特朗普总统余下的任期内掌控国会，标志着美国政治格局出现重大变化。从乌克兰和中东的冲突，到美国与中国的贸易关系，BBC记者分析这次选举结果对世界其他地区意味着什么。", "body_orig": "", "body_zh": "民主党在美国中期选举中同时赢得参议院和众议院的控制权，将在特朗普总统余下的任期内掌控国会。\n\n这场选举令美国政治格局出现重大变化，对特朗普总统构成重大挫折。他承认，伊朗战争和生活成本上涨，是导致多名共和党候选人落败的原因。\n\n美国副总统万斯（JD Vance）说：「我们输掉选举的原因就是这场（伊朗）战争。」\n\n从乌克兰和中东的冲突，到美国与中国的贸易关系，BBC记者分析这次选举结果对世界其他地区意味着什么。\n\nBBC波斯语部驻伦敦资深记者哈比比亚扎德（Ghoncheh Habibiazad）\n\n伊朗最高领袖穆杰塔巴·哈梅内伊（Mojtaba Khamenei）表示，任何认为美国政治局势的变化会令「美国对伊朗的敌意」有所改变的人，都是「大错特错」。\n\n这位最高领袖的父亲阿里·哈梅内伊（Ali Khamenei）在2月28日美国与以色列的联合空袭中丧生，其后由他接任。穆杰塔巴·哈梅内伊已经数月没有公开露面。\n\n上述言论出自他周三发表的一份长达六页的书面声明，当天是1979年伊朗示威者占领美国驻德黑兰大使馆事件的周年纪念日。\n\n理论上，这次「特朗普计划」（Project Trump）遭遇选举挫折，在其他时候可能会被视为对海湾阿拉伯国家的一次打击。\n\n杜拜设有一座特朗普国际高尔夫球场，卡塔尔曾向特朗普赠送一架价值4亿美元的飞机，而阿联酋、卡塔尔和沙特阿拉伯亦合共向特朗普女婿贾里德·库什纳（Jared Kushner）的公司Affinity Capital投资数十亿美元。\n\n沙特与特朗普的前任、民主党籍总统拜登（Joe Biden）关系尤其紧张。还记得2022年拜登与沙特王储那次尴尬的碰拳吗？\n\n海湾国家领袖对奥巴马（Barack Obama）前总统同样有很大疑虑，因为他未有就叙利亚总统巴沙尔·阿萨德（Bashar al-Assad）使用毒气一事采取惩罚行动。\n\n正如一名评论员所说：「特朗普总统把海湾地区点燃了。」他指的是2月28日爆发的战争。海湾国家至今仍然担心，特朗普可能再次挑起战火，导致伊朗报复，对这些国家的关键基础设施造成毁灭性破坏。\n\n特朗普在2024年竞逐第二个总统任期时，曾承诺将汽油价格降至每加仑2美元以下。但今年10月的平均价格为每加仑4.31美元。他亦曾承诺，如果重返白宫，就不会再有新的战争。\n\n然而，就在中期选举前一天，美国再次对伊朗一座岛屿发动空袭。特朗普向记者表示，他对发动这场战争毫不后悔。\n\n但伊朗最高领袖穆杰塔巴·哈梅内伊在声明中表示，他不认为选举结果会令美国政策有所改变。\n\n特朗普今天接受BBC在美国的新闻合作伙伴哥伦比亚广播公司新闻部（CBS News）访问时表示，这场冲突将在「我说结束的时候」结束。\n\n北京与华盛顿之间的关系，是本世纪的大国竞争焦点。特朗普准备在本月稍后访问中国，习近平即将接待他，或许会认为自己在这场角力中占了上风。\n\n但习近平采取反制措施，同样大幅提高关税，令特朗普的计划适得其反。结果是许多商品在美国的价格上涨，包括玩具和衣服等普通家庭偶尔购买、用来享受生活的小商品。\n\n这场贸易战最终以双方达成休战协议告一段落，但协议将于明年1月底到期。中国可能认为，特朗普在中期选举受挫后，正忙于应对败选的打击，并希望达成协议。\n\n俄罗斯总统普京（Vladimir Putin）的发言人佩斯科夫（Dmitry Peskov）向俄罗斯媒体表示：「我们衷心希望特朗普继续推动和平的努力。」\n\n佩斯科夫接着说：「我们看到了梅拉尼娅·特朗普（Melania Trump）在人道主义和平工作上取得的成功。」\n\n他指的是近期在俄罗斯占领的乌克兰城镇奥莱什基（Oleshky）进行的人道主义行动。\n\n但俄罗斯大概不会怪罪特朗普，因为克里姆林宫已在与特朗普的关系上投入大量心力，而且莫斯科显然仍希望与特朗普政府发展经济合作。\n\n对乌克兰、伊朗和中东各地的民众而言，美国中期选举的焦点不仅是美国国内政治，更是选举结果可能对持续中的冲突带来什么影响。\n\n在乌克兰，评论人士聚焦于特朗普处理俄乌战争的方式。记者罗曼·岑巴柳克（Roman Tsymbalyuk）揶揄特朗普说，他「解决了所有战争，却输掉了自己的战争」，借此讽刺特朗普多次声称自己结束了世界各地的冲突。\n\n随着俄罗斯持续袭击乌克兰的能源基础设施，基辅有些人希望民主党在选举中取得进展，能够加强对莫斯科实施更严厉制裁的支持。\n\n在莫斯科，克里姆林宫公开表示，希望特朗普继续致力斡旋结束战争，俄罗斯与乌克兰预计本月会再举行谈判。\n\n不过，俄罗斯国内支持战争的人士警告，民主党控制的国会，可能限制特朗普日后与克里姆林宫达成协议，或放宽对俄制裁的能力。\n\n与此同时，伊朗领导层及与政府有关联的媒体，将民主党在选举中取得的进展，形容为美国民众对特朗普战争政策的否定。\n\nBBC国际部伊莎贝尔·肖（Isabel Shaw）及安德鲁·韦布（Andrew Webb）编辑。\n\n本文原以英文撰写，我们使用了人工智能协助翻译，并由BBC记者在发布前进行审核。了解更多关于我们如何使用人工智能的资讯。", "body": "民主党在美国中期选举中同时赢得参议院和众议院的控制权，将在特朗普总统余下的任期内掌控国会。\n\n这场选举令美国政治格局出现重大变化，对特朗普总统构成重大挫折。他承认，伊朗战争和生活成本上涨，是导致多名共和党候选人落败的原因。\n\n美国副总统万斯（JD Vance）说：「我们输掉选举的原因就是这场（伊朗）战争。」\n\n从乌克兰和中东的冲突，到美国与中国的贸易关系，BBC记者分析这次选举结果对世界其他地区意味着什么。\n\nBBC波斯语部驻伦敦资深记者哈比比亚扎德（Ghoncheh Habibiazad）\n\n伊朗最高领袖穆杰塔巴·哈梅内伊（Mojtaba Khamenei）表示，任何认为美国政治局势的变化会令「美国对伊朗的敌意」有所改变的人，都是「大错特错」。\n\n这位最高领袖的父亲阿里·哈梅内伊（Ali Khamenei）在2月28日美国与以色列的联合空袭中丧生，其后由他接任。穆杰塔巴·哈梅内伊已经数月没有公开露面。\n\n上述言论出自他周三发表的一份长达六页的书面声明，当天是1979年伊朗示威者占领美国驻德黑兰大使馆事件的周年纪念日。\n\n理论上，这次「特朗普计划」（Project Trump）遭遇选举挫折，在其他时候可能会被视为对海湾阿拉伯国家的一次打击。\n\n杜拜设有一座特朗普国际高尔夫球场，卡塔尔曾向特朗普赠送一架价值4亿美元的飞机，而阿联酋、卡塔尔和沙特阿拉伯亦合共向特朗普女婿贾里德·库什纳（Jared Kushner）的公司Affinity Capital投资数十亿美元。\n\n沙特与特朗普的前任、民主党籍总统拜登（Joe Biden）关系尤其紧张。还记得2022年拜登与沙特王储那次尴尬的碰拳吗？\n\n海湾国家领袖对奥巴马（Barack Obama）前总统同样有很大疑虑，因为他未有就叙利亚总统巴沙尔·阿萨德（Bashar al-Assad）使用毒气一事采取惩罚行动。\n\n正如一名评论员所说：「特朗普总统把海湾地区点燃了。」他指的是2月28日爆发的战争。海湾国家至今仍然担心，特朗普可能再次挑起战火，导致伊朗报复，对这些国家的关键基础设施造成毁灭性破坏。\n\n特朗普在2024年竞逐第二个总统任期时，曾承诺将汽油价格降至每加仑2美元以下。但今年10月的平均价格为每加仑4.31美元。他亦曾承诺，如果重返白宫，就不会再有新的战争。\n\n然而，就在中期选举前一天，美国再次对伊朗一座岛屿发动空袭。特朗普向记者表示，他对发动这场战争毫不后悔。\n\n但伊朗最高领袖穆杰塔巴·哈梅内伊在声明中表示，他不认为选举结果会令美国政策有所改变。\n\n特朗普今天接受BBC在美国的新闻合作伙伴哥伦比亚广播公司新闻部（CBS News）访问时表示，这场冲突将在「我说结束的时候」结束。\n\n北京与华盛顿之间的关系，是本世纪的大国竞争焦点。特朗普准备在本月稍后访问中国，习近平即将接待他，或许会认为自己在这场角力中占了上风。\n\n但习近平采取反制措施，同样大幅提高关税，令特朗普的计划适得其反。结果是许多商品在美国的价格上涨，包括玩具和衣服等普通家庭偶尔购买、用来享受生活的小商品。\n\n这场贸易战最终以双方达成休战协议告一段落，但协议将于明年1月底到期。中国可能认为，特朗普在中期选举受挫后，正忙于应对败选的打击，并希望达成协议。\n\n俄罗斯总统普京（Vladimir Putin）的发言人佩斯科夫（Dmitry Peskov）向俄罗斯媒体表示：「我们衷心希望特朗普继续推动和平的努力。」\n\n佩斯科夫接着说：「我们看到了梅拉尼娅·特朗普（Melania Trump）在人道主义和平工作上取得的成功。」\n\n他指的是近期在俄罗斯占领的乌克兰城镇奥莱什基（Oleshky）进行的人道主义行动。\n\n但俄罗斯大概不会怪罪特朗普，因为克里姆林宫已在与特朗普的关系上投入大量心力，而且莫斯科显然仍希望与特朗普政府发展经济合作。\n\n对乌克兰、伊朗和中东各地的民众而言，美国中期选举的焦点不仅是美国国内政治，更是选举结果可能对持续中的冲突带来什么影响。\n\n在乌克兰，评论人士聚焦于特朗普处理俄乌战争的方式。记者罗曼·岑巴柳克（Roman Tsymbalyuk）揶揄特朗普说，他「解决了所有战争，却输掉了自己的战争」，借此讽刺特朗普多次声称自己结束了世界各地的冲突。\n\n随着俄罗斯持续袭击乌克兰的能源基础设施，基辅有些人希望民主党在选举中取得进展，能够加强对莫斯科实施更严厉制裁的支持。\n\n在莫斯科，克里姆林宫公开表示，希望特朗普继续致力斡旋结束战争，俄罗斯与乌克兰预计本月会再举行谈判。\n\n不过，俄罗斯国内支持战争的人士警告，民主党控制的国会，可能限制特朗普日后与克里姆林宫达成协议，或放宽对俄制裁的能力。\n\n与此同时，伊朗领导层及与政府有关联的媒体，将民主党在选举中取得的进展，形容为美国民众对特朗普战争政策的否定。\n\nBBC国际部伊莎贝尔·肖（Isabel Shaw）及安德鲁·韦布（Andrew Webb）编辑。\n\n本文原以英文撰写，我们使用了人工智能协助翻译，并由BBC记者在发布前进行审核。了解更多关于我们如何使用人工智能的资讯。", "link": "https://www.bbc.com/zhongwen/articles/ckreyrxvg3xyo/trad?at_medium=RSS&at_campaign=rss", "time": "11月05日 05:02", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}]}, {"key": "dw_cn", "name": "德国之声中文", "lang": "中文", "tab_note": "本页嵌免费全文（本轮亲测多篇可完整阅读）", "free_mark": "full_verified", "error": null, "items": [{"title_orig": "墙外文摘：黄之锋再判10年，提早出狱的人交出了什么？", "title_zh": "墙外文摘：黄之锋再判10年，提早出狱的人交出了什么？", "summary_orig": "黄之锋被再判10年，同一周，另一些人提前出狱、获准离境，甚至到深圳\"体验发展\"。有评论指出，这两种结局是同一场悲剧的两面：一边用尊严换自由，一边用自由守价值。", "summary_zh": "黄之锋被再判10年，同一周，另一些人提前出狱、获准离境，甚至到深圳\"体验发展\"。有评论指出，这两种结局是同一场悲剧的两面：一边用尊严换自由，一边用自由守价值。", "body_orig": "", "body_zh": "（德国之声中文网）香港壹传媒前行政总裁张剑虹提前出狱后，公开现身中国内地的参访行程与官媒访问；11月5日，黄之锋承认\"串谋勾结外国势力\"，被判刑10年，连同先前刑期，预计2036年才能出狱。台湾网络媒体《新头壳》本周刊出吴恭铭的评论《挨了社会主义铁拳之后 香港\"电视认罪\"背后》。\n\n文章说，这两件事要放在一起看：\"宽恕与自由需付出代价，当极权体制递出'提早释放'或'出境许可'的条件时，背后无一例外都是精密算计的政治与法理交易。\"作者列举\n\n近年几桩获释或获准离境的案例后写道：\"每一段经历都揭示了同一个残酷现实：天下没有免费的午餐。\"\n\n作者指出，张剑虹在庭上指证黎智英是第一步，此后参加内地参访团、接受官媒访问是第二步：\"那些能够走出来、甚至能在镜头前大摇大摆去深圳'体验发展'的人，并非得到了幸运神的眷顾，而是因为他们交出了体制所需要的筹码，付够了对价。\"\n\n吴恭铭认为，这套安排的目的不止于惩罚：\"体制需要向社会大众传递一个讯息：无论你过去多么坚定、立场多么鲜明，在社会主义铁拳面前，最终都必须低下头来，为当年的抗争感到悔恨。\"他进一步写道：\"中共体制不仅要惩罚肉体，更要剥夺个人的道德主体性，让人在重获自由的同时，不得不亲手毁灭自己过去所坚持的一切。\"\n\n文章把两桩案子并置：\"张剑虹的'电视认罪'与黄之锋的判刑宣告，不过是同场悲剧的两种表现形式：前者是用尊严换取自由的生存交易，后者则是用自由捍卫价值的代价。\n\n美国期中选举11月3日举行。台湾网络媒体《镜报》论坛同日刊出台杰客的评论《期中选举能改变特朗普对台政策吗？》。\n\n文章认为，国会席次变化可能改变特朗普对台政策的部分内容与执行方式，却不保证改变整体方向，关键在于国会是否动用立法、预算与监督权：\"国会有多少人支持台湾，与这些支持能否影响白宫，是两个不同的问题。\"\n\n作者以立法为例说明国会确曾塑造对台政策：\"《台湾关系法》的核心安全规定，正是国会修改行政部门原案的重要成果。\"他同时指出国会权力的边界——多数可能被否决权或超级多数门槛挡下，\"总统可以谈判、签署条约，却仍须取得参议院同意，才能完成批准程序。\"\n\n文章把军售、政策承诺与危机支援分开处理，并介绍一项\"六项保证\"法案草案：行政部门若要改变特定对台政策，\n\n须先通知国会并经审查，\"在此期间，除非批准相关行动的联合决议成为法律，行政部门不得执行该行动。\"文章结尾提醒：\"国会友台表态，并不等同于美国必然出兵的保证。\"\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "body": "（德国之声中文网）香港壹传媒前行政总裁张剑虹提前出狱后，公开现身中国内地的参访行程与官媒访问；11月5日，黄之锋承认\"串谋勾结外国势力\"，被判刑10年，连同先前刑期，预计2036年才能出狱。台湾网络媒体《新头壳》本周刊出吴恭铭的评论《挨了社会主义铁拳之后 香港\"电视认罪\"背后》。\n\n文章说，这两件事要放在一起看：\"宽恕与自由需付出代价，当极权体制递出'提早释放'或'出境许可'的条件时，背后无一例外都是精密算计的政治与法理交易。\"作者列举\n\n近年几桩获释或获准离境的案例后写道：\"每一段经历都揭示了同一个残酷现实：天下没有免费的午餐。\"\n\n作者指出，张剑虹在庭上指证黎智英是第一步，此后参加内地参访团、接受官媒访问是第二步：\"那些能够走出来、甚至能在镜头前大摇大摆去深圳'体验发展'的人，并非得到了幸运神的眷顾，而是因为他们交出了体制所需要的筹码，付够了对价。\"\n\n吴恭铭认为，这套安排的目的不止于惩罚：\"体制需要向社会大众传递一个讯息：无论你过去多么坚定、立场多么鲜明，在社会主义铁拳面前，最终都必须低下头来，为当年的抗争感到悔恨。\"他进一步写道：\"中共体制不仅要惩罚肉体，更要剥夺个人的道德主体性，让人在重获自由的同时，不得不亲手毁灭自己过去所坚持的一切。\"\n\n文章把两桩案子并置：\"张剑虹的'电视认罪'与黄之锋的判刑宣告，不过是同场悲剧的两种表现形式：前者是用尊严换取自由的生存交易，后者则是用自由捍卫价值的代价。\n\n美国期中选举11月3日举行。台湾网络媒体《镜报》论坛同日刊出台杰客的评论《期中选举能改变特朗普对台政策吗？》。\n\n文章认为，国会席次变化可能改变特朗普对台政策的部分内容与执行方式，却不保证改变整体方向，关键在于国会是否动用立法、预算与监督权：\"国会有多少人支持台湾，与这些支持能否影响白宫，是两个不同的问题。\"\n\n作者以立法为例说明国会确曾塑造对台政策：\"《台湾关系法》的核心安全规定，正是国会修改行政部门原案的重要成果。\"他同时指出国会权力的边界——多数可能被否决权或超级多数门槛挡下，\"总统可以谈判、签署条约，却仍须取得参议院同意，才能完成批准程序。\"\n\n文章把军售、政策承诺与危机支援分开处理，并介绍一项\"六项保证\"法案草案：行政部门若要改变特定对台政策，\n\n须先通知国会并经审查，\"在此期间，除非批准相关行动的联合决议成为法律，行政部门不得执行该行动。\"文章结尾提醒：\"国会友台表态，并不等同于美国必然出兵的保证。\"\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "link": "https://www.dw.com/zh/墙外文摘：黄之锋再判10年，提早出狱的人交出了什么？/a-79892036?maca=chi-rss-chi-all-1127-xml-mrss", "time": "11月08日 23:50", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "法国周末再示威 抗议者数量减少", "title_zh": "法国周末再示威 抗议者数量减少", "summary_orig": "法国连续第四个周末出现针对高昂生活成本以及教育系统积弊的示威抗议。不过，和此前几次相比，本周末的抗议人数明显减少。", "summary_zh": "法国连续第四个周末出现针对高昂生活成本以及教育系统积弊的示威抗议。不过，和此前几次相比，本周末的抗议人数明显减少。", "body_orig": "", "body_zh": "（德国之声中文网）法国多地民众本周末再次响应工会、青年组织、“黄马甲运动”发出的抗议号召。根据组织者的说法，全国共有25万人参加了11月7日的抗议活动；而法国内政部公布的数据则为14.6万人。而在上周六，抗议人数规模在32万至50万人。11月5日（周四）的罢工示威活动也有约60万人参加（内政部数据）。\n\n法国内政部表示，在图卢兹、马赛、里昂、波尔多和斯特拉斯堡等主要城市，集会过程中出现了动荡及各类事件。在巴黎，游行本身保持了和平，但傍晚时分局势趋于紧张；现场画面显示出现了催泪瓦斯烟雾和火光。内政部报告称全国共有200余人被捕。\n\n为保护市中心区域，多个城市都在部分街区实施示威禁令。比如在第二大城市里昂，据媒体报道，民众在未经官方许可的情况下聚集抗议，警方随即动用了催泪瓦斯。\n\n在巴黎，“黄马甲运动”原计划举行的一场集会被禁止，而由工会组织的一场示威活动则获准进行。尽管如此，在“黄马甲运动”发出行动号召后，仍有不少人聚集在市中心的协和广场。据法国媒体报道，两名“黄马甲运动”的协调员在巴黎被捕。\n\n法国民众正在抗议高昂生活成本、教育系统积弊等多项议题。法国全国学生联合会(UNEF)秘书长莫雷(Manon Moret)表示，年轻人依然态度坚决且感到愤怒，并指出政府未能回应他们的诉求。\n\n法国总理塞巴斯蒂安·勒科尔尼(Lecornu)计划在11月9日与工会及雇主协会举行一场社会议题会议，并和中学生、大学生代表进行磋商。此外，11月10日也有计划举行进一步的抗议活动。\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "body": "（德国之声中文网）法国多地民众本周末再次响应工会、青年组织、“黄马甲运动”发出的抗议号召。根据组织者的说法，全国共有25万人参加了11月7日的抗议活动；而法国内政部公布的数据则为14.6万人。而在上周六，抗议人数规模在32万至50万人。11月5日（周四）的罢工示威活动也有约60万人参加（内政部数据）。\n\n法国内政部表示，在图卢兹、马赛、里昂、波尔多和斯特拉斯堡等主要城市，集会过程中出现了动荡及各类事件。在巴黎，游行本身保持了和平，但傍晚时分局势趋于紧张；现场画面显示出现了催泪瓦斯烟雾和火光。内政部报告称全国共有200余人被捕。\n\n为保护市中心区域，多个城市都在部分街区实施示威禁令。比如在第二大城市里昂，据媒体报道，民众在未经官方许可的情况下聚集抗议，警方随即动用了催泪瓦斯。\n\n在巴黎，“黄马甲运动”原计划举行的一场集会被禁止，而由工会组织的一场示威活动则获准进行。尽管如此，在“黄马甲运动”发出行动号召后，仍有不少人聚集在市中心的协和广场。据法国媒体报道，两名“黄马甲运动”的协调员在巴黎被捕。\n\n法国民众正在抗议高昂生活成本、教育系统积弊等多项议题。法国全国学生联合会(UNEF)秘书长莫雷(Manon Moret)表示，年轻人依然态度坚决且感到愤怒，并指出政府未能回应他们的诉求。\n\n法国总理塞巴斯蒂安·勒科尔尼(Lecornu)计划在11月9日与工会及雇主协会举行一场社会议题会议，并和中学生、大学生代表进行磋商。此外，11月10日也有计划举行进一步的抗议活动。\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "link": "https://www.dw.com/zh/法国周末再示威-抗议者数量减少/a-79891873?maca=chi-rss-chi-all-1127-xml-mrss", "time": "11月08日 23:32", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "查尔斯三世希望访华？", "title_zh": "查尔斯三世希望访华？", "summary_orig": "英国王室一名幕僚表示，国王查尔斯三世正在考虑访华事宜。如果能够成行，这将是英国君主有史以来的第二次中国之行。", "summary_zh": "英国王室一名幕僚表示，国王查尔斯三世正在考虑访华事宜。如果能够成行，这将是英国君主有史以来的第二次中国之行。", "body_orig": "", "body_zh": "（德国之声中文网）英国王室一名高级幕僚表示，“如果政府问国王是否愿意访问中国，我认为，我们将会认真考虑此事。”\n\n1986年10月，已故英国女王伊丽莎白二世及丈夫菲利普亲王共同访问了中国。当时，女王夫妇访问了北京、上海和广州。英国女王访华前两年，中英签署了联合声明，规范了香港主权回归中国的事宜，并推动了中英两国关系的发展。\n\n英王查尔斯三世结束为期九天的加勒比访问行程之际，这名王室幕僚对媒体表示：“今年恰逢上一次英王访华四十周年之际。”\n\n查尔斯三世此次加勒比之行的一个重要议题是棘手的奴隶贸易赔偿问题。英国政府正在考虑是否应就历史上的奴隶贸易问题做出正式道歉之际，查尔斯三世将跨大西洋奴隶贸易称为“惨无人道的不公正行为”。\n\n这名幕僚表示：“我认为，我们正在看到一个明显的趋势，那就是政府越来越希望国王前往政治敏感且充满挑战的地区。”他表示，尽管国王在政治上保持中立，但由于他热衷扮演‘棘手角色’，因此国王查尔斯三世已经成为英国政府的“秘密武器”。\n\n这位幕僚表示：“无论是促进环保、还是更新、改善同一些棘手国家的外交关系，都是国王非常热衷的事情。”\n\n查尔斯三世目前已经年近78岁，并正在接受癌症治疗。今年年初，英王查尔斯出访美国会晤特朗普总统时所表现出的睿智和风度，受到广泛好评。\n\n过去几年来，受英国前殖民地香港政治局势、中国糟糕的人权纪录以及间谍指控等问题的影响，伦敦和北京的关系一直处于紧张状态。不过，英国新首相伯纳姆正在延续其前任斯塔默开启的审慎对华路线。今年一月，斯塔默曾访问北京。国王查尔斯的这位幕僚表示：“中国是一个非常重要，但也非常复杂的国家。因此安排访问行程时，需要考虑到各种复杂因素。”\n\n1997年，查尔斯以威尔士亲王身份代表英国，同中国国家主席江泽民共同出席了香港主权移交仪式。\n\n当被问及伯纳姆首相是否会建议查尔斯三世访华时，他的发言人对法新社表示：相关问题应由英国王室来回答。\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "body": "（德国之声中文网）英国王室一名高级幕僚表示，“如果政府问国王是否愿意访问中国，我认为，我们将会认真考虑此事。”\n\n1986年10月，已故英国女王伊丽莎白二世及丈夫菲利普亲王共同访问了中国。当时，女王夫妇访问了北京、上海和广州。英国女王访华前两年，中英签署了联合声明，规范了香港主权回归中国的事宜，并推动了中英两国关系的发展。\n\n英王查尔斯三世结束为期九天的加勒比访问行程之际，这名王室幕僚对媒体表示：“今年恰逢上一次英王访华四十周年之际。”\n\n查尔斯三世此次加勒比之行的一个重要议题是棘手的奴隶贸易赔偿问题。英国政府正在考虑是否应就历史上的奴隶贸易问题做出正式道歉之际，查尔斯三世将跨大西洋奴隶贸易称为“惨无人道的不公正行为”。\n\n这名幕僚表示：“我认为，我们正在看到一个明显的趋势，那就是政府越来越希望国王前往政治敏感且充满挑战的地区。”他表示，尽管国王在政治上保持中立，但由于他热衷扮演‘棘手角色’，因此国王查尔斯三世已经成为英国政府的“秘密武器”。\n\n这位幕僚表示：“无论是促进环保、还是更新、改善同一些棘手国家的外交关系，都是国王非常热衷的事情。”\n\n查尔斯三世目前已经年近78岁，并正在接受癌症治疗。今年年初，英王查尔斯出访美国会晤特朗普总统时所表现出的睿智和风度，受到广泛好评。\n\n过去几年来，受英国前殖民地香港政治局势、中国糟糕的人权纪录以及间谍指控等问题的影响，伦敦和北京的关系一直处于紧张状态。不过，英国新首相伯纳姆正在延续其前任斯塔默开启的审慎对华路线。今年一月，斯塔默曾访问北京。国王查尔斯的这位幕僚表示：“中国是一个非常重要，但也非常复杂的国家。因此安排访问行程时，需要考虑到各种复杂因素。”\n\n1997年，查尔斯以威尔士亲王身份代表英
