、以个人关系控风险」。第一任期时，北京透过贸易谈判与大规模采购美国农产品，换取特朗普在台海议题上的相对克制。\n\n专家认为，第二任期北京更进一步，把对台军售直接纳入美中高层谈判，并以贸易休战、稀土与供应链议题作为杠杆，试图让特朗普把台湾问题「交易化」。\n\n习近平多次强调台湾是「最重要议题」，并在此前的峰会上要求美方明确反对台湾独立，同时暗示稳定关系取决于限制对台支持。北京判断特朗普重视交易成果多于长期承诺，因此采取「耐心施压、避免正面冲突」的策略，等待他任期内的窗口，同时为「后特朗普」时期预做准备。\n\n至于中期选举本身，骆明辉认为，北京自然会关注结果，但不会过度在意谁胜谁负：无论牌局如何发展，中南海都会积极规划，并把战略目光放在特朗普任期结束之后。\n\n特朗普任内的对台军售呈现「先放后卡」的节奏。第一任期他多次批准军售，规模与频率高于前任，涵盖战机、坦克与飞弹系统，并强化高层军事交流；2025年12月，他更批准约111亿美元的大规模军售案，创下纪录。\n\n转折出现在2026年初。涉及爱国者飞弹、雷达与指挥系统、用于台湾「T-Dome」防空体系的140亿美元新案被长期搁置，特朗普在与习近平会谈后持续延迟。\n\n美国前外交官、捍卫民主基金会（Foundation for Defense of Democracies, FDD）中国项目主任辛格顿（Craig Singleton）本周在\n\n警告，延迟对台军售正在制造「危险的误解」，「今天为避免摩擦而搁置，可能为明天更危险的对抗创造条件」。他认为，数十年来美中靠精心拿捏的语言和战略模糊处理台湾问题，但如今习近平可能将延迟军售解读为华盛顿默认「稳定美中关系取决于限制对台支持」的前提。军售拖得越久，北京越可能把未来任何推进视为背叛，反而引发特朗普试图避免的不稳定。\n\n除了军售，美台在情报分享、联合演训、不对称战力与无人机上的合作仍在持续，但节奏受白宫与北京谈判牵制。\n\n第一个观察点，邓铭杰向BBC中文透露，有美国官员早前表示，此案被「拆包」成较小规模方案的机率已大幅上升；布鲁金斯学会的何瑞恩（Ryan Hass）也预期，APEC与G20之后会出现较小规模的军售案。\n\n年底的《国防授权法》是第二个观察点。参议院版本加入了对台战争储备库存，并将台湾纳入涵盖菲律宾的更广泛「第一岛链」倡议。邓铭杰认为，这些条款能否在最终版本中保留，值得关注。\n\n第三则是政治修辞。特朗普今年5月曾说他「不希望有人走向独立」，若类似表述出现在深圳或迈阿密峰会的书面声明中，将是真正的转变。\n\n此次选举中，多位「台湾连线」的共和党议员遭淘汰。这些友台议员长期推动对台军售、加强军事合作并监督行政部门，每年都有成员拜访台湾；取而代之的，是许多首次进入众议院的年轻民主党人，他们对台湾乃至中国事务是否熟悉，都是问号。\n\n台美关系研究社群「美国台湾观测站」分析指出，胜选的新生代议员多数对国际议题鲜少著墨，或强调外交优先、减少军事干预，民主党内年轻「进步派」是否会走更多元的外交路线，值得观察。\n\n蓝若思则提醒另一层矛盾：特朗普呼吁增加支出以重建美国海军，应对中国海军的扩张；但民主党更关注「奶油」而非「枪砲」，民主党主导的国会将优先扩大医疗补助与气候政策等福利支出，进而压缩国防预算，使军事科技投资更难推动。\n\n「美国台湾观测站」也分析，从历史经验看，历届总统任期最后几年常把重心转向海外事务，白宫自今年4月起已开始盘点移民、关税、住房等不需国会的行动，特朗普更自称「否决先生」（Mr. Veto）。外交仍主要由行政权主导，因此即便特朗普「跛脚」，对台美关系影响有限。\n\n台湾国防安全研究院助理研究员钟志东早前在台北一场会议上提出类似判断：当前的中美关系可用「短多长空」理解。他强调，台美关系必须放在中美关系的整体结构中看待，1979年美国即便需要联合北京抗衡苏联，也未接受停止对台军售的要求；在中美战略竞争持续升温的今天，美国在此议题上让步的空间反而更低。即使短期内不会宣布大手笔军售，也不代表美国正在台湾议题上向中国妥协。\n\n中期选举改变的是华盛顿由谁来提问，但关于台湾的最终答案，仍掌握在特朗普手中。邓铭杰向BBC中文强调，台湾最大的风险在于优先顺序的落差：北京几乎把台湾置于一切之上，而特朗普同时在处理贸易、稀土与其他议题。\n\n接下来，台北必须同时与新国会和白宫打交道。在岛内「疑美论」不断发酵的背景下，不同政党对美国的期待本就分歧，华盛顿的权力重组，只会让台北的说服工作更加复杂。", "body": "美国中期选举结果出炉，民主党在参众两院同时翻盘，共和党总统特朗普（Donald Trump，又译川普）的第二任期后半段将在「跛脚」状态下展开。这场选举不只改变华盛顿的权力版图，也可能牵动美中关系与台湾议题的走向。\n\n时机尤其敏感。11月18至19日，亚太经合组织（APEC）领导人峰会将在深圳举行；12月中，特朗普与习近平还可能在迈阿密G20峰会再度会面。价值140亿美元的对台军售案正卡在特朗普手中，他今年5月曾公开称这笔军售是「很好的谈判筹码」。民主党掌控国会后，出口管制、晶片限制与军售节奏会否出现新的拉锯，成为观察焦点。\n\n多位专家向BBC中文分析，美国两党在对华问题上的共识深厚，总统仍是政策主导者，大方向不会因国会易主而改变；真正的变化在于监督力度，民主党将透过听证会、传票、《国防授权法》与拨款法案，严格审视特朗普与北京达成的贸易休战。\n\n与此同时，多位长期支持台湾的共和党「台湾连线」议员落马，也意味著台北必须重新经营与新生代民主党议员的关系。\n\n美国智库太平洋论坛（Pacific Forum）兼任研究员蓝若思（Elizabeth Larus）向BBC中文表示，无论国会由哪个党派掌握多数，美国对台湾的支持及对华政策都不会改变，两党都会试图推动特朗普批准桌上那笔140亿美元的对台军售案。\n\n「自1979年以来，每一任美国总统都维持了《台湾关系法》、『六项保证』以及美国的『一个中国』政策，这些都不会因为民主党掌控国会而改变。」她说。\n\n美国智库德国马歇尔基金会（German Marshall Fund, GMF）亚洲计划主任葛来仪（Bonnie Glaser）预测，民主党将掌控拨款程序与参议院议程，很可能在《国防授权法》（NDAA）与拨款法案中加入多项要求：加速交付已核准的对台武器、新的对外军售（FMS）案件通报、对台使用外国军事融资（FMF），以及台湾安全合作倡议（Taiwan Security Cooperation Initiative）资金。《六项保证法案》（Six Assurances Act）也可能获得更多推进动能。\n\n葛来仪还指出，民主党大胜后，美国可能加强对中国取得先进晶片的限制，《安全晶片法案》（Safe Chips Act）有机会通过。但特朗普拥有否决权，民主党票数不足以推翻，除非部分共和党议员倒戈支持。\n\n新加坡南洋理工大学公共政策与全球事务副教授骆明辉（Dylan Loh）对BBC中文表示：「美国对中国存在广泛共识，整体关系的塑造仍主要由总统主导。」\n\n新加坡独立分析师邓铭杰也不认为民主党大胜会带来更温和的对华政策。两大党在出口管制、晶片限制与供应链措施上立场一致，实际变化在于监督力度：民主党将透过听证会与传票，严格审视贸易休战和「建设性战略稳定」框架。\n\n此文包含Google YouTube提供的内容。由于这些内容会使用曲奇或小甜饼等科技，我们在加载任何内容前会寻求您的认可。 您可能在给予许可前希望阅读Google YouTube曲奇政策和隐私政策。希望阅读上述内容，请点击“接受并继续”。\n\n中国近年对特朗普的战略，核心是「以经贸换稳定、以个人关系控风险」。第一任期时，北京透过贸易谈判与大规模采购美国农产品，换取特朗普在台海议题上的相对克制。\n\n专家认为，第二任期北京更进一步，把对台军售直接纳入美中高层谈判，并以贸易休战、稀土与供应链议题作为杠杆，试图让特朗普把台湾问题「交易化」。\n\n习近平多次强调台湾是「最重要议题」，并在此前的峰会上要求美方明确反对台湾独立，同时暗示稳定关系取决于限制对台支持。北京判断特朗普重视交易成果多于长期承诺，因此采取「耐心施压、避免正面冲突」的策略，等待他任期内的窗口，同时为「后特朗普」时期预做准备。\n\n至于中期选举本身，骆明辉认为，北京自然会关注结果，但不会过度在意谁胜谁负：无论牌局如何发展，中南海都会积极规划，并把战略目光放在特朗普任期结束之后。\n\n特朗普任内的对台军售呈现「先放后卡」的节奏。第一任期他多次批准军售，规模与频率高于前任，涵盖战机、坦克与飞弹系统，并强化高层军事交流；2025年12月，他更批准约111亿美元的大规模军售案，创下纪录。\n\n转折出现在2026年初。涉及爱国者飞弹、雷达与指挥系统、用于台湾「T-Dome」防空体系的140亿美元新案被长期搁置，特朗普在与习近平会谈后持续延迟。\n\n美国前外交官、捍卫民主基金会（Foundation for Defense of Democracies, FDD）中国项目主任辛格顿（Craig Singleton）本周在\n\n警告，延迟对台军售正在制造「危险的误解」，「今天为避免摩擦而搁置，可能为明天更危险的对抗创造条件」。他认为，数十年来美中靠精心拿捏的语言和战略模糊处理台湾问题，但如今习近平可能将延迟军售解读为华盛顿默认「稳定美中关系取决于限制对台支持」的前提。军售拖得越久，北京越可能把未来任何推进视为背叛，反而引发特朗普试图避免的不稳定。\n\n除了军售，美台在情报分享、联合演训、不对称战力与无人机上的合作仍在持续，但节奏受白宫与北京谈判牵制。\n\n第一个观察点，邓铭杰向BBC中文透露，有美国官员早前表示，此案被「拆包」成较小规模方案的机率已大幅上升；布鲁金斯学会的何瑞恩（Ryan Hass）也预期，APEC与G20之后会出现较小规模的军售案。\n\n年底的《国防授权法》是第二个观察点。参议院版本加入了对台战争储备库存，并将台湾纳入涵盖菲律宾的更广泛「第一岛链」倡议。邓铭杰认为，这些条款能否在最终版本中保留，值得关注。\n\n第三则是政治修辞。特朗普今年5月曾说他「不希望有人走向独立」，若类似表述出现在深圳或迈阿密峰会的书面声明中，将是真正的转变。\n\n此次选举中，多位「台湾连线」的共和党议员遭淘汰。这些友台议员长期推动对台军售、加强军事合作并监督行政部门，每年都有成员拜访台湾；取而代之的，是许多首次进入众议院的年轻民主党人，他们对台湾乃至中国事务是否熟悉，都是问号。\n\n台美关系研究社群「美国台湾观测站」分析指出，胜选的新生代议员多数对国际议题鲜少著墨，或强调外交优先、减少军事干预，民主党内年轻「进步派」是否会走更多元的外交路线，值得观察。\n\n蓝若思则提醒另一层矛盾：特朗普呼吁增加支出以重建美国海军，应对中国海军的扩张；但民主党更关注「奶油」而非「枪砲」，民主党主导的国会将优先扩大医疗补助与气候政策等福利支出，进而压缩国防预算，使军事科技投资更难推动。\n\n「美国台湾观测站」也分析，从历史经验看，历届总统任期最后几年常把重心转向海外事务，白宫自今年4月起已开始盘点移民、关税、住房等不需国会的行动，特朗普更自称「否决先生」（Mr. Veto）。外交仍主要由行政权主导，因此即便特朗普「跛脚」，对台美关系影响有限。\n\n台湾国防安全研究院助理研究员钟志东早前在台北一场会议上提出类似判断：当前的中美关系可用「短多长空」理解。他强调，台美关系必须放在中美关系的整体结构中看待，1979年美国即便需要联合北京抗衡苏联，也未接受停止对台军售的要求；在中美战略竞争持续升温的今天，美国在此议题上让步的空间反而更低。即使短期内不会宣布大手笔军售，也不代表美国正在台湾议题上向中国妥协。\n\n中期选举改变的是华盛顿由谁来提问，但关于台湾的最终答案，仍掌握在特朗普手中。邓铭杰向BBC中文强调，台湾最大的风险在于优先顺序的落差：北京几乎把台湾置于一切之上，而特朗普同时在处理贸易、稀土与其他议题。\n\n接下来，台北必须同时与新国会和白宫打交道。在岛内「疑美论」不断发酵的背景下，不同政党对美国的期待本就分歧，华盛顿的权力重组，只会让台北的说服工作更加复杂。", "link": "https://www.bbc.com/zhongwen/articles/cqr7ydkrnpxno/trad?at_medium=RSS&at_campaign=rss", "time": "11月06日 18:21", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "澳门国安首案宣判：区锦新囚12年半，妻子斥「莫须有迫害」", "title_zh": "澳门国安首案宣判：区锦新囚12年半，妻子斥「莫须有迫害」", "summary_orig": "这是澳门首宗国安案，案件过程并不公开，区锦新由「指派律师」辩护，审理法官及律师身份不明。从预审、开审到宣判，外界只能从政府新闻稿得知消息。", "summary_zh": "这是澳门首宗国安案，案件过程并不公开，区锦新由「指派律师」辩护，审理法官及律师身份不明。从预审、开审到宣判，外界只能从政府新闻稿得知消息。", "body_orig": "", "body_zh": "星期五（11月6日），澳门完成史上首宗国安审判。民主派领袖、前立法会议员区锦新被控「颠覆国家政权」等罪名，于初级法院被判囚12年6个月。\n\n现年69岁的他预料须服刑到2039年，出狱时已年届82岁。根据澳门《刑法典》规定， 服刑至三分之二可申请假释。\n\n判决后，区锦新妻子郑妙珊表示裁决不可接受，她发公开信指区案是政治审判，「是人格羞辱的莫须有迫害」。家属曾表示，接近一年都无法探望区锦新。\n\n这是澳门首宗国安案，案件过程并不公开，区锦新由「指派律师」辩护，审理法官及律师身份不明。从预审、开审到宣判，外界只能从政府新闻稿得知消息。\n\n澳门政府表示尊重并支持法院裁决，指维护国安、捍卫法治的立场坚定不移。中国外交部发言人表示，中央政府坚定支持澳门依法惩治危害国安的行为。\n\n区锦新的海外法律代表批评这是「一场虚假的审判」，强调区是葡萄牙公民，葡萄牙政府和欧盟应努力让他离开澳门。\n\n根据法院裁决，在7月2日的预审中，区锦新原被起诉七宗罪：三项「颠覆国家政权罪」、三项「与境外组织联系危害国家安全」罪，以及《刑法典》下一项「违反保密」罪。\n\n法院在新闻稿指出，由于区锦新「没有自行聘请律师」，由法院「指派律师」辩护。法院称，「律师与紧密沟通、联系」。\n\n就行为一，法庭指出，区锦新各干犯「颠覆国家政权罪」及「与境外组织联系危害国家安全」罪，但因两罪存在表面竞合关系，以较重罪的「颠覆国家政权罪」作处罚。\n\n就行为二，区锦新被起诉两项「颠覆国家政权罪」及两项「与境外组织联系危害国家安全」罪。法庭指出，因嫌犯行为是否达至「推翻、破坏程度」的要求存在疑问，「颠覆国家政权罪」罪名不成立。但就「与境外组织联系危害国家安全」罪则完全符合犯罪构成要件，两项罪名均成立。\n\n另外就《刑法典》下「违反保密罪」一罪，法庭指于2021年身为时任立法会议员期间，区锦新把立法会有关赌牌续期闭门会议的秘密内容向境外组织泄漏，认定该罪罪成。\n\n法院称在庭审中，区锦新对大部分基础事实无异议，承认勾结和串通多个境外组织的事实行为构成犯罪，并「认同辩护律师为其辩护的意见」。\n\n法院作出判案理由，指出尽管区为初犯，且承认相当部分的犯罪事实，「惟其故意程度极高，有关犯罪的不法性程度及可能造成的后果均十分严重」。\n\n在判决后，区锦新妻子郑妙珊发公开信。她表示从闭门审讯到公开宣判，「是政治审判」，「是人格羞辱的莫须有迫害」。\n\n她表示作为家属，只望往后能够得到当局允许，能「不附加条件」地跟获得丈夫书信和定期探访的权利，「至于其他，相信一切主观愿望只会换来更大的失望，是故不想多想亦无谓多讲」。\n\n区锦新女儿区翰怡则向BBC中文表示，对判决「深感悲痛和愤慨」。她形容其父亲是一位爱好和平的人、慈爱的父亲。\n\n「他毕生致力于服务澳门人民。几十年来，他一直为民主挺身而出，为社区争取权益，帮助那些需要帮助的人。想到他要因为一些不该被视为犯罪的行为而身陷囹圄12年半，我简直无法忍受。」\n\n区翰怡表示，希望澳门人记住父亲的正直、勇气、慈悲和为澳门人所作出贡献。她呼吁葡萄牙政府和欧盟采取行动，尽一切可能确保他返回葡萄牙。\n\n今年7月，区锦新羁押满一年前夕，其女儿区翰怡曾向葡新社表示，过去一年家人无法探望，只能透过当局安排的社工了解情况。「（社工）只说他吃得好，一切都好。」\n\n区锦新获法院分发「指派律师」后，区翰怡说家人亦不知道该律师身份：「无论我们发送多少封电子邮件、联系哪个部门，他们都置之不理。」\n\n法院则在新闻稿中，称指定代表律师与区有「紧密沟通、联系」，法庭亦依法批准家属定期探视嫌犯的申请。\n\n区锦新的海外法律代表迈克尔·波拉克（Michael Polak）在判刑后发声明，批评这是「一场虚假的审判」，形容区被定罪心不仅令澳门蒙羞，也将影响国际社会从法治角度对澳门的看法。\n\n他指出，区锦新不应该仅因为他的「非暴力信仰」被拘捕。波拉克又强调区是葡萄牙公民，葡萄牙政府和欧盟应当努力让他离开澳门，「而不是让他因莫须有的罪名在狱中度过十余年 。」\n\n在法院外，道路被封，现场有大量保安和警察看守。法院对出空地设有传媒区，大批无法进入法院的传媒只能在此等候，现场约有20人。\n\n是次宣判消息公布来得突然。11月5日初级法院于下午3点发新闻稿，表示区案将于明早10点公开宣判。欲旁听的公众及传媒须分别在4点起到法院及新闻局的线上系统登记。\n\n但有市民发文表示，4点02分左右到达法院，已有职员表示「已经取完筹，额满了」。当局没透露旁听席数量为何。另据BBC中文了解，有本地媒体表示成功在新闻局系统登记后，获告知「没有足够的位置」无法旁听。\n\n今早新闻局向现场媒体确认，只得四间传媒出席旁听，包括澳门广播电视中文及葡文台、澳门日报及大众报。BBC中文联系新闻局确认消息，截至发稿前未有回复。\n\n法院判决后指，「数十名市民、传媒以及嫌犯家属出席了今天的公开宣判」。惟在场记者所见，现场仅有零星做运动的市民及多名便衣警员。\n\n曾在澳门执业多年的葡裔律师何睿智（Jorge Menezes）向BBC中文指出，澳门当局透过刑期传递讯息：「澳门社会必须受到震慑、外界必须看到一个可以交代的结果，以及当局想像中的北京。」\n\n在他看来，审判同时反映当局的软弱，「一个有自信的政府，根本会把这种虚构出来的威胁当作笑话。澳门如今却是在用手榴弹打蚊子。」\n\n对于区锦新或在狱中渡过余生，何睿智认为这是当局「刻意采取的手段」：「对待一个人的方式越不人道，对其他人的警告就越强烈」。\n\n多年研究澳门政治的学者余永逸博士则向BBC中文分析，区案是政府划出「清楚红线」的基准：「澳门居民可以做什么、不可以做什么，有什么是不能接受」。\n\n至于判决对社会的影响，余永逸认为自2021年立法会候选人遭集体DQ事件后，市民已目睹澳门变成「自我审查」、「不能够表达意见」的社会，今日判决未必再对社会带来多大冲击。\n\n何睿智持相同看法。他同意判决象征的政治界线非常明确：不要与境外人士谈论澳门政治，服从权威，不得批评北京。\n\n他强调，目前判决内容依然含糊，没有点名任何「敌对外部组织」，亦无列出具体的「虚假信息」或出版物，而这是当局「刻意为之」——「模糊的界线会促使人们为了自保而选择退缩，在此之后，威胁本身就会发挥作用，进而引发自我审查。」\n\n人权观察亚洲区副主任王松莲（Maya Wang）表示，国安定罪向澳门「所有以和平方式提出批评的人士发出了令人不寒而栗的信号」。\n\n她指出，区案司法程序存在「严重违反正当程序和公平审判权利的问题」，呼吁葡萄牙、欧盟及其他相关国家政府应强烈要求当局立即无条件释放区锦新。\n\n中联办发言人对裁决表示坚决支持。其指澳门首宗国安案件的宣判有力表明，「国家安全底线不容触碰，澳门的法治精神不容挑战」。\n\n区锦新原是一名小学老师。在1989年六四事件发生后，与吴国昌等人筹组「澳门民主发展联委会」，提出「回应中国民主运动、推动澳门民主发展」，成为澳门此后30年「六四烛光晚会」的组织者。\n\n他自1993年起担任澳门市政议员，在1999年主权移交后与吴国昌相继成为立法会议员；连同于2016年当选的苏嘉豪，成为立法会内唯一三名民主派议员。\n\n2021年，担任超过20年议员的区锦新宣布不再寻求连任。拍档吴国昌与苏嘉豪则于同年被撤销参选资格。澳门特区终审法院驳回吴苏二人上诉，理由是组织六四悼念属「诽谤」中国政府、可视为不拥护澳门《基本法》。民联会后因压力于2023年解散。\n\n不过，区锦新在卸任议员后，仍常在Facebook和媒体采访中评论时政。他最后一则Facebook帖文写在被捕当日，评论澳门第四条与氹仔的跨海大桥。\n\n2025年7月30日，拥有葡国籍的区锦新被捕后，欧盟对外行动署谴责中方抓捕欧洲公民，形容事情的发展加剧了人们对澳门「政治多元化和言论自由持续受到侵蚀的担忧」。\n\n中国外交部驻澳门公署其后批评欧盟「蓄意攻击澳门法治、粗暴干涉澳门事务和中国内政」，「敦促欧盟立即停止对澳门事务说三道四、无端指责，立即停止干预澳门事务和中国内政」。\n\n2025年9月，葡萄牙总理蒙特内格罗（Luís Montenegro） 访问澳门，当时蒙特内格罗向葡语记者表示，二人没有谈及区锦新案，又称处理此案需要「必要的谨慎」及「某种程度低调」，但他保证没有遗忘此事。", "body": "星期五（11月6日），澳门完成史上首宗国安审判。民主派领袖、前立法会议员区锦新被控「颠覆国家政权」等罪名，于初级法院被判囚12年6个月。\n\n现年69岁的他预料须服刑到2039年，出狱时已年届82岁。根据澳门《刑法典》规定， 服刑至三分之二可申请假释。\n\n判决后，区锦新妻子郑妙珊表示裁决不可接受，她发公开信指区案是政治审判，「是人格羞辱的莫须有迫害」。家属曾表示，接近一年都无法探望区锦新。\n\n这是澳门首宗国安案，案件过程并不公开，区锦新由「指派律师」辩护，审理法官及律师身份不明。从预审、开审到宣判，外界只能从政府新闻稿得知消息。\n\n澳门政府表示尊重并支持法院裁决，指维护国安、捍卫法治的立场坚定不移。中国外交部发言人表示，中央政府坚定支持澳门依法惩治危害国安的行为。\n\n区锦新的海外法律代表批评这是「一场虚假的审判」，强调区是葡萄牙公民，葡萄牙政府和欧盟应努力让他离开澳门。\n\n根据法院裁决，在7月2日的预审中，区锦新原被起诉七宗罪：三项「颠覆国家政权罪」、三项「与境外组织联系危害国家安全」罪，以及《刑法典》下一项「违反保密」罪。\n\n法院在新闻稿指出，由于区锦新「没有自行聘请律师」，由法院「指派律师」辩护。法院称，「律师与紧密沟通、联系」。\n\n就行为一，法庭指出，区锦新各干犯「颠覆国家政权罪」及「与境外组织联系危害国家安全」罪，但因两罪存在表面竞合关系，以较重罪的「颠覆国家政权罪」作处罚。\n\n就行为二，区锦新被起诉两项「颠覆国家政权罪」及两项「与境外组织联系危害国家安全」罪。法庭指出，因嫌犯行为是否达至「推翻、破坏程度」的要求存在疑问，「颠覆国家政权罪」罪名不成立。但就「与境外组织联系危害国家安全」罪则完全符合犯罪构成要件，两项罪名均成立。\n\n另外就《刑法典》下「违反保密罪」一罪，法庭指于2021年身为时任立法会议员期间，区锦新把立法会有关赌牌续期闭门会议的秘密内容向境外组织泄漏，认定该罪罪成。\n\n法院称在庭审中，区锦新对大部分基础事实无异议，承认勾结和串通多个境外组织的事实行为构成犯罪，并「认同辩护律师为其辩护的意见」。\n\n法院作出判案理由，指出尽管区为初犯，且承认相当部分的犯罪事实，「惟其故意程度极高，有关犯罪的不法性程度及可能造成的后果均十分严重」。\n\n在判决后，区锦新妻子郑妙珊发公开信。她表示从闭门审讯到公开宣判，「是政治审判」，「是人格羞辱的莫须有迫害」。\n\n她表示作为家属，只望往后能够得到当局允许，能「不附加条件」地跟获得丈夫书信和定期探访的权利，「至于其他，相信一切主观愿望只会换来更大的失望，是故不想多想亦无谓多讲」。\n\n区锦新女儿区翰怡则向BBC中文表示，对判决「深感悲痛和愤慨」。她形容其父亲是一位爱好和平的人、慈爱的父亲。\n\n「他毕生致力于服务澳门人民。几十年来，他一直为民主挺身而出，为社区争取权益，帮助那些需要帮助的人。想到他要因为一些不该被视为犯罪的行为而身陷囹圄12年半，我简直无法忍受。」\n\n区翰怡表示，希望澳门人记住父亲的正直、勇气、慈悲和为澳门人所作出贡献。她呼吁葡萄牙政府和欧盟采取行动，尽一切可能确保他返回葡萄牙。\n\n今年7月，区锦新羁押满一年前夕，其女儿区翰怡曾向葡新社表示，过去一年家人无法探望，只能透过当局安排的社工了解情况。「（社工）只说他吃得好，一切都好。」\n\n区锦新获法院分发「指派律师」后，区翰怡说家人亦不知道该律师身份：「无论我们发送多少封电子邮件、联系哪个部门，他们都置之不理。」\n\n法院则在新闻稿中，称指定代表律师与区有「紧密沟通、联系」，法庭亦依法批准家属定期探视嫌犯的申请。\n\n区锦新的海外法律代表迈克尔·波拉克（Michael Polak）在判刑后发声明，批评这是「一场虚假的审判」，形容区被定罪心不仅令澳门蒙羞，也将影响国际社会从法治角度对澳门的看法。\n\n他指出，区锦新不应该仅因为他的「非暴力信仰」被拘捕。波拉克又强调区是葡萄牙公民，葡萄牙政府和欧盟应当努力让他离开澳门，「而不是让他因莫须有的罪名在狱中度过十余年 。」\n\n在法院外，道路被封，现场有大量保安和警察看守。法院对出空地设有传媒区，大批无法进入法院的传媒只能在此等候，现场约有20人。\n\n是次宣判消息公布来得突然。11月5日初级法院于下午3点发新闻稿，表示区案将于明早10点公开宣判。欲旁听的公众及传媒须分别在4点起到法院及新闻局的线上系统登记。\n\n但有市民发文表示，4点02分左右到达法院，已有职员表示「已经取完筹，额满了」。当局没透露旁听席数量为何。另据BBC中文了解，有本地媒体表示成功在新闻局系统登记后，获告知「没有足够的位置」无法旁听。\n\n今早新闻局向现场媒体确认，只得四间传媒出席旁听，包括澳门广播电视中文及葡文台、澳门日报及大众报。BBC中文联系新闻局确认消息，截至发稿前未有回复。\n\n法院判决后指，「数十名市民、传媒以及嫌犯家属出席了今天的公开宣判」。惟在场记者所见，现场仅有零星做运动的市民及多名便衣警员。\n\n曾在澳门执业多年的葡裔律师何睿智（Jorge Menezes）向BBC中文指出，澳门当局透过刑期传递讯息：「澳门社会必须受到震慑、外界必须看到一个可以交代的结果，以及当局想像中的北京。」\n\n在他看来，审判同时反映当局的软弱，「一个有自信的政府，根本会把这种虚构出来的威胁当作笑话。澳门如今却是在用手榴弹打蚊子。」\n\n对于区锦新或在狱中渡过余生，何睿智认为这是当局「刻意采取的手段」：「对待一个人的方式越不人道，对其他人的警告就越强烈」。\n\n多年研究澳门政治的学者余永逸博士则向BBC中文分析，区案是政府划出「清楚红线」的基准：「澳门居民可以做什么、不可以做什么，有什么是不能接受」。\n\n至于判决对社会的影响，余永逸认为自2021年立法会候选人遭集体DQ事件后，市民已目睹澳门变成「自我审查」、「不能够表达意见」的社会，今日判决未必再对社会带来多大冲击。\n\n何睿智持相同看法。他同意判决象征的政治界线非常明确：不要与境外人士谈论澳门政治，服从权威，不得批评北京。\n\n他强调，目前判决内容依然含糊，没有点名任何「敌对外部组织」，亦无列出具体的「虚假信息」或出版物，而这是当局「刻意为之」——「模糊的界线会促使人们为了自保而选择退缩，在此之后，威胁本身就会发挥作用，进而引发自我审查。」\n\n人权观察亚洲区副主任王松莲（Maya Wang）表示，国安定罪向澳门「所有以和平方式提出批评的人士发出了令人不寒而栗的信号」。\n\n她指出，区案司法程序存在「严重违反正当程序和公平审判权利的问题」，呼吁葡萄牙、欧盟及其他相关国家政府应强烈要求当局立即无条件释放区锦新。\n\n中联办发言人对裁决表示坚决支持。其指澳门首宗国安案件的宣判有力表明，「国家安全底线不容触碰，澳门的法治精神不容挑战」。\n\n区锦新原是一名小学老师。在1989年六四事件发生后，与吴国昌等人筹组「澳门民主发展联委会」，提出「回应中国民主运动、推动澳门民主发展」，成为澳门此后30年「六四烛光晚会」的组织者。\n\n他自1993年起担任澳门市政议员，在1999年主权移交后与吴国昌相继成为立法会议员；连同于2016年当选的苏嘉豪，成为立法会内唯一三名民主派议员。\n\n2021年，担任超过20年议员的区锦新宣布不再寻求连任。拍档吴国昌与苏嘉豪则于同年被撤销参选资格。澳门特区终审法院驳回吴苏二人上诉，理由是组织六四悼念属「诽谤」中国政府、可视为不拥护澳门《基本法》。民联会后因压力于2023年解散。\n\n不过，区锦新在卸任议员后，仍常在Facebook和媒体采访中评论时政。他最后一则Facebook帖文写在被捕当日，评论澳门第四条与氹仔的跨海大桥。\n\n2025年7月30日，拥有葡国籍的区锦新被捕后，欧盟对外行动署谴责中方抓捕欧洲公民，形容事情的发展加剧了人们对澳门「政治多元化和言论自由持续受到侵蚀的担忧」。\n\n中国外交部驻澳门公署其后批评欧盟「蓄意攻击澳门法治、粗暴干涉澳门事务和中国内政」，「敦促欧盟立即停止对澳门事务说三道四、无端指责，立即停止干预澳门事务和中国内政」。\n\n2025年9月，葡萄牙总理蒙特内格罗（Luís Montenegro） 访问澳门，当时蒙特内格罗向葡语记者表示，二人没有谈及区锦新案，又称处理此案需要「必要的谨慎」及「某种程度低调」，但他保证没有遗忘此事。", "link": "https://www.bbc.com/zhongwen/articles/cw62yyejjrlro/trad?at_medium=RSS&at_campaign=rss", "time": "11月06日 21:11", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "黄之锋勾结罪国安案：重判10年，料出狱已届40岁", "title_zh": "黄之锋勾结罪国安案：重判10年，料出狱已届40岁", "summary_orig": "香港民主派活动人士黄之锋原有望于数月内获释，但最新的10年判刑使他要继续服刑到2036年，出狱时或已年届40岁。法律学者分析，案件反映《香港国安法》或可被「反复动用」，令特定政治犯持续留在狱中。", "summary_zh": "香港民主派活动人士黄之锋原有望于数月内获释，但最新的10年判刑使他要继续服刑到2036年，出狱时或已年届40岁。法律学者分析，案件反映《香港国安法》或可被「反复动用」，令特定政治犯持续留在狱中。", "body_orig": "", "body_zh": "香港民主派活动人士黄之锋被控告中国《香港国安法》下的「串谋勾结外国势力危害国家安全」罪，星期四（11月5日）于香港高等法院被判囚10年。\n\n他正就「民主派初选47人案」服刑，原有望于2027年1月获释。新增的10年刑期，其中2个月2日与「47人案」同期执行；预料他须服刑到2036年，出狱时或已年届40岁。\n\n这是继壹传媒创办人黎智英后，第二宗在香港被起诉「勾结外国势力」罪的案件，也是黄之锋第二宗涉及《香港国安法》相关的案件。港府表示欢迎法庭的重判。\n\n国际特赦组织批评，当局在黄之锋原定刑期获释前数月才新增定罪，「手法残酷」。有法律学者分析，案件反映国安法控罪或可被「反复动用」，令特定政治犯持续留在狱中。\n\n英国外交部回复BBC中文查询时称，最新判决说明《香港国安法》被用于针对行使政治表达权利的人。\n\n此文包含Google YouTube提供的内容。由于这些内容会使用曲奇或小甜饼等科技，我们在加载任何内容前会寻求您的认可。 您可能在给予许可前希望阅读Google YouTube曲奇政策和隐私政策。希望阅读上述内容，请点击“接受并继续”。\n\n黄之锋身穿深蓝色长袖裇衫及卡其色长裤、戴黑框眼镜，较以往瘦削，面有须根，出庭时向旁听席点头，没有微笑，他不时细望旁听席的人士，然后微微点头打招呼。有旁听人士轮流进场换人，与黄之锋短暂打招呼后离去。\n\n正庭公众席全满，旁听者包括：戴着黑色口罩的学民思潮前成员钱诗文、社运人士雷玉莲、前社民连成员黄浩铭、前民阵召集人陈皓桓、「47人案」获释者岑子杰，以及多国领事人员。\n\n主审法官谭耀豪在判刑前，先交代判刑理由。在宣读判刑理由时，黄之锋戴着耳机不时手记笔记。最终判囚10年，黄之锋闻讯后平静低头。\n\n有旁听人士向黄之锋挥手，并说「等你出来」，钱诗文与友人相拥哭泣；散庭后，有旁听人士一向走上前欲与黄之锋握手，被黄叫停。\n\n香港民主党前创党成员、社运人士曾健成（阿牛）在判决后对BBC中文说，在《国安法》下看不到轻判，黄之锋如今要到40岁才得到自由，他感到相当难过、无奈，并反问「人生有多少个十年」。他隔空向黄之锋喊话：「辛苦你了之锋，顶住，希望你挨得过。」\n\n根据《香港国安法》，量刑分为两级，「勾结」罪可囚3年以上至10年以下，「罪行重大」者可判囚10年以上至无期徒刑。\n\n法庭强调，国安法不具追溯力，被告被定罪基于法例实施后的行为；惟量刑时可将法例生效前的行为及活动作为其犯案背景的一部分来考虑，以评估罪行的严重性及程度。\n\n早前一辩方资深大律师陈政龙在书面陈词中提出，本案不属「罪行重大」。辩方指，黄之锋并不回避本案属非常严重罪行的事实，但请法庭不要裁定本案为「罪行重大」。\n\n辩方律师提出，黄之锋在国安法生效参与串谋的程度有限，角色属次要；与黎智英案比较本案情节较轻，涉及的外国政府、人物及平台内容也有实质分别。\n\n另外，辩方也望法庭考虑黄之锋在最早期已认罪、连同其他案件已羁押近6年；他的个人背景品格、检控延近5年、整体刑期原则等。\n\n法官则认为黄之锋与罗冠聪在本案与黎智英相似，均站在最前线，是主谋，情节严重。综合本案所有情况，以13年监禁作为量刑起点，基于被告人的认罪答辩和求情，将量刑起点下调 3 年，判处监禁 10 年；即《国安法》第二十九条下属「罪行重大」所须判处的最低刑期。\n\n黄之锋正就「民主派初选47人案」服刑，原有望于2027年1月获释。新增的10年刑期，其中2个月2日与「47人案」同期执行。\n\n美国乔治城大学亚洲法律中心（Georgetown Center for Asian Law）高级研究员黎恩灏分析，从技术层面而言，若无新控罪，黄之锋原本望于明年初获释，故新增控罪客观上提供方式，「令黄之锋在更长时间无法重返公众视野」。\n\n他表示，案件程序令人忧虑，一方面反映香港政府急于把刑事检控武器化，若政府认为有需要，国安法控罪便可以被「反复动用」，令特定政治犯持续留在狱中。\n\n另一方面，控方就此案提出多项指控均涉及国安法生效前的行为，政府不惜牺牲正当程序原则，以追溯方式将政治犯的行为刑事化。\n\n国际特赦组织亚太区副总监白舒然（Sarah Brooks）表示，最新的国安定罪，在黄之锋原定刑期获释前数月降临，形容「手法残酷，甚至可能是蓄意为之」，又指判刑提醒香港的《国安法》已沦为惩罚异见的工具，而非真正保障国家安全的手段。\n\n民间组织「香港监察」（Hong Kong Watch）亦表示，香港政府应立即无条件释放黄之锋。\n\n英国外交部一位发言人对BBC中文称：「对黄之锋的判决清楚地表明，《国家安全法》正被用于针对因政治表达和参与而行使权利的个人。」\n\n「我们呼吁立即停止所有针对根据《国家安全法》被起诉人士的不公正检控，并敦促中国及香港当局履行1984年《中英联合声明》所保障的香港民众应享有的权利与自由。」\n\n香港警务处国安处总警司李桂华表示，欢迎法庭「重判黄之锋」，形容刑期合适，但会再与律政司商讨有否进一步行动。\n\n李桂华表示，黄之锋未成年已经参与社运，18岁开始涉及不同罪行，包括触犯两项国安法、2019年6月包围警总及藐视法庭个案，形容他是「犯案累累」，「连法庭都不放在眼内」。他称，希望黄之锋反省对国家及香港做过的错事，培养守法精神及认识国家。\n\n被问到案情背景为何涉及2016年事件、案发于2020年却延至2025年才起诉，李桂华引述法官指，2016年的资料对案件背景有作用，在2023年才根据报调查案件，两年后律政司指示送上法院，「时间合适，并没有任何拖延」。\n\n有媒体引述黄之锋的求情信，指被捕时曾被执法人员称为「敌人」，李桂华回应称，他个人并没有将其视为「敌人」。\n\n被问到Netflix仍上架黄之锋纪录片是否合法、能否在香港播放，李桂华表示，关注片中是否涉及煽动性内容，目前不能公开讨论。\n\n行政长官李家超则形容，黄之锋、罗冠聪等人「是破坏香港繁荣稳定其中的祸首」，在《香港国安法》实施后「仍毫无悔改之意，肆无忌惮地继续充当外国和境外势力的代理人」，「祸港卖港、怙恶不悛」。\n\n特区政府发言人表示，法庭对黄之锋予以重判，「彻底打破危害国家安全分子披着所谓『国际线』或『国际倡议』外衣便能逃避法律追责的幻想」；法庭判刑时详列理由，体现了黄之锋「是在公平公开的司法程序下被判刑」。\n\n中国外交部发言人郭嘉昆表示，中国中央政府坚定支持香港，依法维护国安。「有关方面应切实尊重中国主权，尊重香港法制，停止就特区司法案件审理发表不负责任的言论，干预香港司法，干涉中国内政。」\n\n前学民思潮成员Louis Lee在判刑前表示，希望黄之锋能尽快获释，早日与家人、朋友会面，「过一个他so called本来的生活」。他表示，上月底曾到监狱探望黄之锋，其「状态OK」，对世界有好奇，期待收到朋友的信件，但也担心刑期。\n\n她身穿写有「在颓垣中创造希望」字样的上衣，表示自己「看着黄之锋成长」，「十几岁已经振振有词，很有自己想法、有香港的大局观……他会为香港未来、人权、学运行一条很艰难的路，甚至有机会令自己身陷囹圄。」\n\n她称，不敢预期结果，仅望可公平公开审讯。「无论什么结果都好，香港人愿意一起承担和承受，不应只是政治犯去承担罪名。」\n\n宣判后，黄小姐表示「无罪就是一天冤狱都不应该坐」，又说希望大家除了流泪，还能保持希望和坚强。\n\n在英文的求情信中，黄之锋表示，在原定出狱日期不足六个月之际面对判刑，「那种感觉几乎仿佛又回到了起点。」\n\n他重申，其政治参与从来不是出于仇恨，对中国政府或香港政府并无怨恨；从未主张香港独立、鼓吹「中国崩溃」（collapse of China）或政权更替，亦从未接受任何外国资金资助，或花费金钱聘请外国政治顾问。\n\n黄之锋提及选择认罪，也无意为其行为寻找借口。他称，在国安法实施后，已意识直接倡议制裁属违法，故立即停止相关言论及行为；惟当时认为转载他人帖文，或呼吁外国企业基于其自身商业判断停止向香港警方供货，与直接倡议制裁有所不同，后来才明白判断错误。\n\n根据《香港国安法》，「勾结」罪可囚3年以上至10年以下，「罪行重大」者可判囚10年以上至无期徒刑。\n\n控罪指，黄之锋于2020年7月1日至2020年11月23日，在香港与罗冠聪及其他身分不详的人一同串谋，请求外国或境外机构、组织、人员，对香港或中国进行制裁、封锁或采取其他敌对行动。\n\n控方案情指，黄之锋与「香港众志」创党主席罗冠聪早在2016年达成串谋，透过国际游说（international lobbying）达到「民主自决」主张。\n\n案情指二人在《香港国安法》生效前已展开「国际线」，要求外国制裁香港、中国，包括多次参与国际游说，并出席欧洲议会人权小组委员会。二人在美国期间又会晤当地政要，如时任美国众议院少数党领袖佩洛西（Nancy Pelosi，裴洛西）、时任参议员卢比奥（Marco Rubio，鲁比奥／鲁比欧）等。二人被指推动《香港人权与民主法案》。\n\n该法案于2019年11月27日生效，授权美国政府可制裁侵害香港人权的个人与组织，并要求美国国务院每年审查香港是否仍拥有足够自治、符合获得贸易特殊地位的资格。", "body": "香港民主派活动人士黄之锋被控告中国《香港国安法》下的「串谋勾结外国势力危害国家安全」罪，星期四（11月5日）于香港高等法院被判囚10年。\n\n他正就「民主派初选47人案」服刑，原有望于2027年1月获释。新增的10年刑期，其中2个月2日与「47人案」同期执行；预料他须服刑到2036年，出狱时或已年届40岁。\n\n这是继壹传媒创办人黎智英后，第二宗在香港被起诉「勾结外国势力」罪的案件，也是黄之锋第二宗涉及《香港国安法》相关的案件。港府表示欢迎法庭的重判。\n\n国际特赦组织批评，当局在黄之锋原定刑期获释前数月才新增定罪，「手法残酷」。有法律学者分析，案件反映国安法控罪或可被「反复动用」，令特定政治犯持续留在狱中。\n\n英国外交部回复BBC中文查询时称，最新判决说明《香港国安法》被用于针对行使政治表达权利的人。\n\n此文包含Google YouTube提供的内容。由于这些内容会使用曲奇或小甜饼等科技，我们在加载任何内容前会寻求您的认可。 您可能在给予许可前希望阅读Google YouTube曲奇政策和隐私政策。希望阅读上述内容，请点击“接受并继续”。\n\n黄之锋身穿深蓝色长袖裇衫及卡其色长裤、戴黑框眼镜，较以往瘦削，面有须根，出庭时向旁听席点头，没有微笑，他不时细望旁听席的人士，然后微微点头打招呼。有旁听人士轮流进场换人，与黄之锋短暂打招呼后离去。\n\n正庭公众席全满，旁听者包括：戴着黑色口罩的学民思潮前成员钱诗文、社运人士雷玉莲、前社民连成员黄浩铭、前民阵召集人陈皓桓、「47人案」获释者岑子杰，以及多国领事人员。\n\n主审法官谭耀豪在判刑前，先交代判刑理由。在宣读判刑理由时，黄之锋戴着耳机不时手记笔记。最终判囚10年，黄之锋闻讯后平静低头。\n\n有旁听人士向黄之锋挥手，并说「等你出来」，钱诗文与友人相拥哭泣；散庭后，有旁听人士一向走上前欲与黄之锋握手，被黄叫停。\n\n香港民主党前创党成员、社运人士曾健成（阿牛）在判决后对BBC中文说，在《国安法》下看不到轻判，黄之锋如今要到40岁才得到自由，他感到相当难过、无奈，并反问「人生有多少个十年」。他隔空向黄之锋喊话：「辛苦你了之锋，顶住，希望你挨得过。」\n\n根据《香港国安法》，量刑分为两级，「勾结」罪可囚3年以上至10年以下，「罪行重大」者可判囚10年以上至无期徒刑。\n\n法庭强调，国安法不具追溯力，被告被定罪基于法例实施后的行为；惟量刑时可将法例生效前的行为及活动作为其犯案背景的一部分来考虑，以评估罪行的严重性及程度。\n\n早前一辩方资深大律师陈政龙在书面陈词中提出，本案不属「罪行重大」。辩方指，黄之锋并不回避本案属非常严重罪行的事实，但请法庭不要裁定本案为「罪行重大」。\n\n辩方律师提出，黄之锋在国安法生效参与串谋的程度有限，角色属次要；与黎智英案比较本案情节较轻，涉及的外国政府、人物及平台内容也有实质分别。\n\n另外，辩方也望法庭考虑黄之锋在最早期已认罪、连同其他案件已羁押近6年；他的个人背景品格、检控延近5年、整体刑期原则等。\n\n法官则认为黄之锋与罗冠聪在本案与黎智英相似，均站在最前线，是主谋，情节严重。综合本案所有情况，以13年监禁作为量刑起点，基于被告人的认罪答辩和求情，将量刑起点下调 3 年，判处监禁 10 年；即《国安法》第二十九条下属「罪行重大」所须判处的最低刑期。\n\n黄之锋正就「民主派初选47人案」服刑，原有望于2027年1月获释。新增的10年刑期，其中2个月2日与「47人案」同期执行。\n\n美国乔治城大学亚洲法律中心（Georgetown Center for Asian Law）高级研究员黎恩灏分析，从技术层面而言，若无新控罪，黄之锋原本望于明年初获释，故新增控罪客观上提供方式，「令黄之锋在更长时间无法重返公众视野」。\n\n他表示，案件程序令人忧虑，一方面反映香港政府急于把刑事检控武器化，若政府认为有需要，国安法控罪便可以被「反复动用」，令特定政治犯持续留在狱中。\n\n另一方面，控方就此案提出多项指控均涉及国安法生效前的行为，政府不惜牺牲正当程序原则，以追溯方式将政治犯的行为刑事化。\n\n国际特赦组织亚太区副总监白舒然（Sarah Brooks）表示，最新的国安定罪，在黄之锋原定刑期获释前数月降临，形容「手法残酷，甚至可能是蓄意为之」，又指判刑提醒香港的《国安法》已沦为惩罚异见的工具，而非真正保障国家安全的手段。\n\n民间组织「香港监察」（Hong Kong Watch）亦表示，香港政府应立即无条件释放黄之锋。\n\n英国外交部一位发言人对BBC中文称：「对黄之锋的判决清楚地表明，《国家安全法》正被用于针对因政治表达和参与而行使权利的个人。」\n\n「我们呼吁立即停止所有针对根据《国家安全法》被起诉人士的不公正检控，并敦促中国及香港当局履行1984年《中英联合声明》所保障的香港民众应享有的权利与自由。」\n\n香港警务处国安处总警司李桂华表示，欢迎法庭「重判黄之锋」，形容刑期合适，但会再与律政司商讨有否进一步行动。\n\n李桂华表示，黄之锋未成年已经参与社运，18岁开始涉及不同罪行，包括触犯两项国安法、2019年6月包围警总及藐视法庭个案，形容他是「犯案累累」，「连法庭都不放在眼内」。他称，希望黄之锋反省对国家及香港做过的错事，培养守法精神及认识国家。\n\n被问到案情背景为何涉及2016年事件、案发于2020年却延至2025年才起诉，李桂华引述法官指，2016年的资料对案件背景有作用，在2023年才根据报调查案件，两年后律政司指示送上法院，「时间合适，并没有任何拖延」。\n\n有媒体引述黄之锋的求情信，指被捕时曾被执法人员称为「敌人」，李桂华回应称，他个人并没有将其视为「敌人」。\n\n被问到Netflix仍上架黄之锋纪录片是否合法、能否在香港播放，李桂华表示，关注片中是否涉及煽动性内容，目前不能公开讨论。\n\n行政长官李家超则形容，黄之锋、罗冠聪等人「是破坏香港繁荣稳定其中的祸首」，在《香港国安法》实施后「仍毫无悔改之意，肆无忌惮地继续充当外国和境外势力的代理人」，「祸港卖港、怙恶不悛」。\n\n特区政府发言人表示，法庭对黄之锋予以重判，「彻底打破危害国家安全分子披着所谓『国际线』或『国际倡议』外衣便能逃避法律追责的幻想」；法庭判刑时详列理由，体现了黄之锋「是在公平公开的司法程序下被判刑」。\n\n中国外交部发言人郭嘉昆表示，中国中央政府坚定支持香港，依法维护国安。「有关方面应切实尊重中国主权，尊重香港法制，停止就特区司法案件审理发表不负责任的言论，干预香港司法，干涉中国内政。」\n\n前学民思潮成员Louis Lee在判刑前表示，希望黄之锋能尽快获释，早日与家人、朋友会面，「过一个他so called本来的生活」。他表示，上月底曾到监狱探望黄之锋，其「状态OK」，对世界有好奇，期待收到朋友的信件，但也担心刑期。\n\n她身穿写有「在颓垣中创造希望」字样的上衣，表示自己「看着黄之锋成长」，「十几岁已经振振有词，很有自己想法、有香港的大局观……他会为香港未来、人权、学运行一条很艰难的路，甚至有机会令自己身陷囹圄。」\n\n她称，不敢预期结果，仅望可公平公开审讯。「无论什么结果都好，香港人愿意一起承担和承受，不应只是政治犯去承担罪名。」\n\n宣判后，黄小姐表示「无罪就是一天冤狱都不应该坐」，又说希望大家除了流泪，还能保持希望和坚强。\n\n在英文的求情信中，黄之锋表示，在原定出狱日期不足六个月之际面对判刑，「那种感觉几乎仿佛又回到了起点。」\n\n他重申，其政治参与从来不是出于仇恨，对中国政府或香港政府并无怨恨；从未主张香港独立、鼓吹「中国崩溃」（collapse of China）或政权更替，亦从未接受任何外国资金资助，或花费金钱聘请外国政治顾问。\n\n黄之锋提及选择认罪，也无意为其行为寻找借口。他称，在国安法实施后，已意识直接倡议制裁属违法，故立即停止相关言论及行为；惟当时认为转载他人帖文，或呼吁外国企业基于其自身商业判断停止向香港警方供货，与直接倡议制裁有所不同，后来才明白判断错误。\n\n根据《香港国安法》，「勾结」罪可囚3年以上至10年以下，「罪行重大」者可判囚10年以上至无期徒刑。\n\n控罪指，黄之锋于2020年7月1日至2020年11月23日，在香港与罗冠聪及其他身分不详的人一同串谋，请求外国或境外机构、组织、人员，对香港或中国进行制裁、封锁或采取其他敌对行动。\n\n控方案情指，黄之锋与「香港众志」创党主席罗冠聪早在2016年达成串谋，透过国际游说（international lobbying）达到「民主自决」主张。\n\n案情指二人在《香港国安法》生效前已展开「国际线」，要求外国制裁香港、中国，包括多次参与国际游说，并出席欧洲议会人权小组委员会。二人在美国期间又会晤当地政要，如时任美国众议院少数党领袖佩洛西（Nancy Pelosi，裴洛西）、时任参议员卢比奥（Marco Rubio，鲁比奥／鲁比欧）等。二人被指推动《香港人权与民主法案》。\n\n该法案于2019年11月27日生效，授权美国政府可制裁侵害香港人权的个人与组织，并要求美国国务院每年审查香港是否仍拥有足够自治、符合获得贸易特殊地位的资格。", "link": "https://www.bbc.com/zhongwen/articles/cm5ynepe9578o/trad?at_medium=RSS&at_campaign=rss", "time": "11月06日 00:26", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "从蔡康永、《VIVANT》到姆巴佩：北京为何区别处理「辱华」事件？", "title_zh": "从蔡康永、《VIVANT》到姆巴佩：北京为何区别处理「辱华」事件？", "summary_orig": "最近几周，中国舆论场接连出现多宗被贴上「辱华」标签的争议事件：台湾艺人蔡康永、日本电视剧《VIVANT》以及法国球星姆巴佩。三宗事件看似性质相近，但官方反应与舆论热度却明显不同，多位分析人士对BBC中文指出：这些差异背后是当局对于每个事件的定性并不相同。", "summary_zh": "最近几周，中国舆论场接连出现多宗被贴上「辱华」标签的争议事件：台湾艺人蔡康永、日本电视剧《VIVANT》以及法国球星姆巴佩。三宗事件看似性质相近，但官方反应与舆论热度却明显不同，多位分析人士对BBC中文指出：这些差异背后是当局对于每个事件的定性并不相同。", "body_orig": "", "body_zh": "近几周，中国舆论场接连出现三宗被贴上「辱华」标签的争议：台湾艺人蔡康永、日本电视剧《VIVANT》以及法国足球明星姆巴佩。三宗事件看似性质相近，但官方反应、官媒投入程度和舆论热度并不一致。\n\n蔡康永的言论被部分中国网民解读为涉及台湾主权立场，但官方回应有限，并未持续高调追击；《VIVANT》则引起中国外交部、国防部及官媒接连回应；姆巴佩事件在网络批评之外，更蔓延至品牌合作和商业层面。\n\n三宗事件分别涉及台湾、日本和西方国家，却都被置于「辱华」的框架下讨论。多名受访学者认为，北京的处理方式并非单纯取决于对象来自哪个国家或地区，而在于事件是否触及主权、历史记忆等核心政治议题，以及当下的双边关系与内外政策考量。\n\n他们指出，中国官方一方面持续借助民族主义凝聚国内共识，另一方面也试图控制动员强度，避免影响外交关系、经济利益和其他政策目标。三宗风波正好呈现出这种权衡与取舍。\n\n蔡康永事件最初在社交媒体发酵。部分中国网民将其言论解读为涉及台湾主权立场，要求封杀并要求他表态，但官方和主流官媒并未持续追击。蔡康永多年来在中国累积的知名度与市场影响力，也使事件最终未升级为大规模政治风波。\n\n相比之下，《VIVANT》引发的争议更为持久。剧中中国情报人员对日本特务施以酷刑的情节。事件曝光后，中国外交部、国防部等官方机构先后回应，官媒亦连日发表评论，相关话题一度长时间占据中国网络热搜。\n\n香港浸会大学传播学院副教授闾丘露薇对BBC中文说，她和同事曾对外交部发言人的发言内容进行系统研究，结果显示官方态度首先取决于议题性质。涉及领土、主权、历史等核心利益的议题，措辞通常最严厉；如果牵涉日本，反应预期会更强硬。\n\n她指出，其次是对象和双边关系。台湾被北京视为主权问题，官方没有退让空间；对日本，历史记忆和国内舆论令官方难以放软态度；对欧美，官方则要同时权衡经贸和外交关系，反应因此相对克制。\n\n国立政治大学国家发展研究所副教授黄兆年认为，官方介入程度、回应层级和持续时间，主要取决于两个因素：事件本身在多大程度上关乎国家尊严和民族情感，以及事件发生期间是否存在其他重大顾虑。\n\n他指出，对于同时出现的多宗争议，当局会进行成本效益评估。在蔡康永事件上，北京必须考虑台湾正值选举这一背景，也会担心强硬表态影响统派选情。\n\n过去几年，这类风波的舆论压力往往不止停留在社交媒体，而是迅速扩散至商业领域。从品牌道歉、撤换代言人，到企业修改官网表述，中国庞大的消费市场已成为传递政治讯号的一部分。\n\n另一场风波围绕姆巴佩展开。他被指曾发表涉及毛泽东的负面言论，引发中国网络舆论批评。\n\n随著事件升温，多家与姆巴佩合作的品牌受到中国网民施压，要求作出表态。有中国品牌迅速解约、中止转播。官媒多次强调，中国广告收入是姆巴佩的重要收入来源，形容他「搬起石头砸自己的脚」，并以失去中国市场作为警告。\n\n《VIVANT》则被新华社定性为「恶意抹黑中国、炮制虚假历史叙事」后，中国舆论场也开始追查哪些企业曾在剧中投放广告，并要求相关企业道歉。与该剧合作的日本企业三丽鸥（Sanrio）其后公开道歉，令事件进一步扩大至商业层面。\n\n闾丘露薇认为，这种做法并不新鲜。「只要对方在乎中国市场，这种做法往往很快见效，例如品牌道歉、撤换代言人。」她说，这已成为中国对外施压的常用工具之一，而且未来仍可能持续使用。\n\n不过，这种手段的效果取决于对方对中国市场的依赖程度。对依赖较低的国家或企业，作用有限；长远而言，也可能促使对方分散市场，减少对中国的依赖。\n\n美国迈阿密大学（University of Miami）政治学教授金德芳（June Teufel Dreyer）表示，北京利用市场规模影响外部行为已有相当长的历史，而且在不少案例中确实取得效果。「如果一家企业认为失去中国市场将付出巨大代价，它通常会选择道歉或让步。」\n\n但她也指出，近年一些国家和企业开始重新评估风险。当企业发现中国市场同时伴随政治和监管不确定性时，便可能寻求降低依赖。\n\n美国企业研究所（American Enterprise Institute）高级研究员黄韵琪认为，民族主义动员与市场压力很难完全分开。「中国政府不一定需要直接下达行政命令，只要市场和舆论相信某家公司触碰了政治红线，企业往往就会主动作出调整。」\n\n黄兆年则指出，与十年前相比，中国市场对全球企业仍然重要，但相对吸引力已不如过去。在地缘政治风险升高、供应链重组及中国经济放缓的背景下，企业的计算方式正在改变。对北京而言，市场规模仍是重要筹码，但未必像过去那样具有压倒性的威慑力。\n\n受访学者认为，理解近年频繁出现的「辱华」风波，不能只从外交或对外关系角度观察，还要放回中国国内政治的脉络中。\n\n闾丘露薇指出，以「百年屈辱」为核心的民族主义叙事并非近年才出现，而是在1989年后透过爱国主义教育，被系统性地推广至教科书、媒体和文化产品。她认为，这类动员首先服务于内政，核心作用是巩固执政合法性、凝聚社会共识；向外界传递政治讯号则属于次要功能。\n\n黄兆年认为，在经济高速增长不再被视为理所当然的背景下，民族主义对中共的重要性正在上升。当局需要持续向民众展示自己是国家利益和民族尊严的捍卫者，而外部冲突和「辱华」争议恰好提供了这样的机会。\n\n黄韵琪也表示，中国官方对相关事件的回应，往往不仅是针对事件本身，更是在向国内受众展示政府正在捍卫核心利益与国家尊严。她认为，民族主义已成为中国政府的重要政治资源。\n\n不过，受访学者同时指出，民族主义不能无限制地被动员。黄韵琪警告，一旦民族主义情绪被全面激发，未必总能按照官方预期的方向发展。她形容，民族主义有时像被打开的「潘朵拉盒子」，既能成为动员社会的工具，也可能带来难以完全控制的后果。\n\n近年愈来愈多「辱华」事件在网络上引发巨大讨论，却未必能在现实社会留下同样强烈的影响。在姆巴佩事件中，不少中国网民甚至不清楚争议源于哪一句言论；《VIVANT》的剧情争议对许多人而言较为遥远；蔡康永多年来累积的知名度和观众缘，也使部分用户没有完全响应抵制呼吁。\n\n闾丘露薇部分认同民族主义动员出现疲劳的说法，但认为「疲劳」未必是最准确的描述。「我觉得更像是网络和现实成了两个平行的世界。」她说，演算法能决定人们在手机上看到什么，也能在短时间内点燃强烈情绪，但这些情绪往往来得快、去得也快。\n\n在她看来，这更多反映民族主义动员的边际效应正在下降。「类似事件越来越频繁，议题又往往离普通人的生活很远，每一次动员的影响力自然就减弱了。」\n\n抖音上也有用户留言说：「月薪三千累死累活到家，发现自己民族情感被伤害了？」这类声音反映，部分网民更在意现实生活压力，而非遥远的政治争议。\n\n黄兆年认为，民族主义动员在中国长期存在，但普通人也会计算何时表态、表态到什么程度。并非每一次官方发动，民众都需要以同样的热情回应。\n\n他指出，今天的中国人与其说是被「洗脑」，不如说是被「洗嘴」：人们对表达真实意见心存忌惮，但何时、在何种程度上响应中央，是一种计算，而非真的相信。", "body": "近几周，中国舆论场接连出现三宗被贴上「辱华」标签的争议：台湾艺人蔡康永、日本电视剧《VIVANT》以及法国足球明星姆巴佩。三宗事件看似性质相近，但官方反应、官媒投入程度和舆论热度并不一致。\n\n蔡康永的言论被部分中国网民解读为涉及台湾主权立场，但官方回应有限，并未持续高调追击；《VIVANT》则引起中国外交部、国防部及官媒接连回应；姆巴佩事件在网络批评之外，更蔓延至品牌合作和商业层面。\n\n三宗事件分别涉及台湾、日本和西方国家，却都被置于「辱华」的框架下讨论。多名受访学者认为，北京的处理方式并非单纯取决于对象来自哪个国家或地区，而在于事件是否触及主权、历史记忆等核心政治议题，以及当下的双边关系与内外政策考量。\n\n他们指出，中国官方一方面持续借助民族主义凝聚国内共识，另一方面也试图控制动员强度，避免影响外交关系、经济利益和其他政策目标。三宗风波正好呈现出这种权衡与取舍。\n\n蔡康永事件最初在社交媒体发酵。部分中国网民将其言论解读为涉及台湾主权立场，要求封杀并要求他表态，但官方和主流官媒并未持续追击。蔡康永多年来在中国累积的知名度与市场影响力，也使事件最终未升级为大规模政治风波。\n\n相比之下，《VIVANT》引发的争议更为持久。剧中中国情报人员对日本特务施以酷刑的情节。事件曝光后，中国外交部、国防部等官方机构先后回应，官媒亦连日发表评论，相关话题一度长时间占据中国网络热搜。\n\n香港浸会大学传播学院副教授闾丘露薇对BBC中文说，她和同事曾对外交部发言人的发言内容进行系统研究，结果显示官方态度首先取决于议题性质。涉及领土、主权、历史等核心利益的议题，措辞通常最严厉；如果牵涉日本，反应预期会更强硬。\n\n她指出，其次是对象和双边关系。台湾被北京视为主权问题，官方没有退让空间；对日本，历史记忆和国内舆论令官方难以放软态度；对欧美，官方则要同时权衡经贸和外交关系，反应因此相对克制。\n\n国立政治大学国家发展研究所副教授黄兆年认为，官方介入程度、回应层级和持续时间，主要取决于两个因素：事件本身在多大程度上关乎国家尊严和民族情感，以及事件发生期间是否存在其他重大顾虑。\n\n他指出，对于同时出现的多宗争议，当局会进行成本效益评估。在蔡康永事件上，北京必须考虑台湾正值选举这一背景，也会担心强硬表态影响统派选情。\n\n过去几年，这类风波的舆论压力往往不止停留在社交媒体，而是迅速扩散至商业领域。从品牌道歉、撤换代言人，到企业修改官网表述，中国庞大的消费市场已成为传递政治讯号的一部分。\n\n另一场风波围绕姆巴佩展开。他被指曾发表涉及毛泽东的负面言论，引发中国网络舆论批评。\n\n随著事件升温，多家与姆巴佩合作的品牌受到中国网民施压，要求作出表态。有中国品牌迅速解约、中止转播。官媒多次强调，中国广告收入是姆巴佩的重要收入来源，形容他「搬起石头砸自己的脚」，并以失去中国市场作为警告。\n\n《VIVANT》则被新华社定性为「恶意抹黑中国、炮制虚假历史叙事」后，中国舆论场也开始追查哪些企业曾在剧中投放广告，并要求相关企业道歉。与该剧合作的日本企业三丽鸥（Sanrio）其后公开道歉，令事件进一步扩大至商业层面。\n\n闾丘露薇认为，这种做法并不新鲜。「只要对方在乎中国市场，这种做法往往很快见效，例如品牌道歉、撤换代言人。」她说，这已成为中国对外施压的常用工具之一，而且未来仍可能持续使用。\n\n不过，这种手段的效果取决于对方对中国市场的依赖程度。对依赖较低的国家或企业，作用有限；长远而言，也可能促使对方分散市场，减少对中国的依赖。\n\n美国迈阿密大学（University of Miami）政治学教授金德芳（June Teufel Dreyer） 性，再加上近期欧洲其他恶意破坏事件，使不少人将怀疑目光投向俄罗斯，这并不令人意外。\n\n今年稍早发生一系列网路攻击以及针对敏感设施的不明无人机目击事件后，过去几天又出现超市冷冻设备遭远端骇入、血库系统遭攻击、波兰与俄罗斯边境的可疑事件，以及8月针对德国莱比锡哈勒机场（Leipzig Halle Airport）的无人机袭击，德国内政部长当时更公开将责任归咎于莫斯科。\n\n许多人认为，尽管目前仅有间接证据，但这很可能又是一次「混合战争」（hybrid warfare）、「灰色地带行动」（grey zone warfare）或「门槛以下战争」（sub-threshold warfare）的案例。\n\n这类行动旨在破坏一国的基础设施或社会运作，通常匿名进行、容易否认责任，而且不至于触发北约第五条款，因而无法直接引发西方国家的集体回应。\n\n莫斯科确实对北约支持乌克兰感到愤怒，因为北约的援助阻碍了克里姆林宫吞并乌克兰、实质终结其独立地位的计划。\n\n俄罗斯一些部落客甚至表示，既然乌克兰无人机已让俄国机场变得不安全，而西方制裁又阻止俄罗斯航空公司使用欧洲领空，那么西方国家为何不该感受同样的痛苦？\n\n然而，截至周四（11月5日）晚间，仍没有任何确切证据显示这些虚假威胁与俄罗斯、伊朗，或其控制的代理人组织有关。\n\n其中一条线索，是周四上午罗马机场当局收到的一封恐吓电邮，寄件者自称是「男性国家战士」（Fighters of the Male State）。\n\n这个名称很可能指向俄罗斯团体「男性军团」（Muzhskoi Legion，亦称 Male Legion）。这是一个极右翼组织，因主张极端而于2021年遭莫斯科法院取缔。\n\n然而，该组织仍在Telegram保有数以万计追随者，并在翌年俄罗斯全面入侵乌克兰后公开表达支持。\n\n不过，即使寄往罗马的电子邮件确实出自该组织之手，又有谁能保证不是其他团体借用这个名义行事？\n\n因此，这封邮件恐怕无法提供警方与机场当局真正需要的线索，以查明究竟是谁制造这些虚假威胁，以及背后动机为何。\n\n对试图查明幕后黑手、并评估未来如何降低类似事件冲击的各国警方、机场管理单位与交通部门而言，关键不在于锁定自己认为最可能的嫌疑对象，而是追查冷冰冰但可靠的证据线索──前提是他们找得到这些线索。\n\n欧洲至少21架客机及多座机场遭到炸弹威胁，这是一周内第二次发生类似事件。英国政府形容这些威胁为「恶意恶作剧」。\n\n一架由都柏林飞往罗马的爱尔兰航空客机，被迫改降法国空军基地，而义大利则出动战斗机护送芬兰航空（Finnair）一班由赫尔辛基飞往罗马的航班。\n\nEasyJet表示，其由纽卡素（Newcastle）及格拉斯哥（Glasgow）飞往布拉格的航班，基于预防措施，在抵达时由警方接应。另一方面，伦敦希斯洛机场（Heathrow）及伯明翰机场收到的威胁，则被评估为不具可信性。\n\n各地搜查均未发现任何爆炸物，目前尚不清楚这些事件是否彼此相关。部分威胁则是由一个知名度不高的组织宣称负责。\n\n发信者自称为「男性国家战士」（Fighters of the Male State），并声称其目标是「女性主义政权」，希望「在历史上留下印记」。\n\n这些内容最先由义大利媒体披露，其后获管理罗马两座机场的罗马机场公司（Aeroporti di Roma）向BBC证实。\n\n本文原以英文撰写，我们使用了人工智能协助翻译，并由BBC记者在发布前进行审核。了解更多关于我们如何使用人工智能的资讯。", "body": "除了伦敦希斯洛机场（Heathrow Airport）是明显例外，几乎在其他所有案例中，相关威胁都被认为具有足够可信度，以至于当局决定让涉事航班改道。在义大利的案例中，甚至出动战斗机升空伴飞护航。\n\n这些航空业恶作剧威胁同时出现、且经过协调的特性，再加上近期欧洲其他恶意破坏事件，使不少人将怀疑目光投向俄罗斯，这并不令人意外。\n\n今年稍早发生一系列网路攻击以及针对敏感设施的不明无人机目击事件后，过去几天又出现超市冷冻设备遭远端骇入、血库系统遭攻击、波兰与俄罗斯边境的可疑事件，以及8月针对德国莱比锡哈勒机场（Leipzig Halle Airport）的无人机袭击，德国内政部长当时更公开将责任归咎于莫斯科。\n\n许多人认为，尽管目前仅有间接证据，但这很可能又是一次「混合战争」（hybrid warfare）、「灰色地带行动」（grey zone warfare）或「门槛以下战争」（sub-threshold warfare）的案例。\n\n这类行动旨在破坏一国的基础设施或社会运作，通常匿名进行、容易否认责任，而且不至于触发北约第五条款，因而无法直接引发西方国家的集体回应。\n\n莫斯科确实对北约支持乌克兰感到愤怒，因为北约的援助阻碍了克里姆林宫吞并乌克兰、实质终结其独立地位的计划。\n\n俄罗斯一些部落客甚至表示，既然乌克兰无人机已让俄国机场变得不安全，而西方制裁又阻止俄罗斯航空公司使用欧洲领空，那么西方国家为何不该感受同样的痛苦？\n\n然而，截至周四（11月5日）晚间，仍没有任何确切证据显示这些虚假威胁与俄罗斯、伊朗，或其控制的代理人组织有关。\n\n其中一条线索，是周四上午罗马机场当局收到的一封恐吓电邮，寄件者自称是「男性国家战士」（Fighters of the Male State）。\n\n这个名称很可能指向俄罗斯团体「男性军团」（Muzhskoi Legion，亦称 Male Legion）。这是一个极右翼组织，因主张极端而于2021年遭莫斯科法院取缔。\n\n然而，该组织仍在Telegram保有数以万计追随者，并在翌年俄罗斯全面入侵乌克兰后公开表达支持。\n\n不过，即使寄往罗马的电子邮件确实出自该组织之手，又有谁能保证不是其他团体借用这个名义行事？\n\n因此，这封邮件恐怕无法提供警方与机场当局真正需要的线索，以查明究竟是谁制造这些虚假威胁，以及背后动机为何。\n\n对试图查明幕后黑手、并评估未来如何降低类似事件冲击的各国警方、机场管理单位与交通部门而言，关键不在于锁定自己认为最可能的嫌疑对象，而是追查冷冰冰但可靠的证据线索──前提是他们找得到这些线索。\n\n欧洲至少21架客机及多座机场遭到炸弹威胁，这是一周内第二次发生类似事件。英国政府形容这些威胁为「恶意恶作剧」。\n\n一架由都柏林飞往罗马的爱尔兰航空客机，被迫改降法国空军基地，而义大利则出动战斗机护送芬兰航空（Finnair）一班由赫尔辛基飞往罗马的航班。\n\nEasyJet表示，其由纽卡素（Newcastle）及格拉斯哥（Glasgow）飞往布拉格的航班，基于预防措施，在抵达时由警方接应。另一方面，伦敦希斯洛机场（Heathrow）及伯明翰机场收到的威胁，则被评估为不具可信性。\n\n各地搜查均未发现任何爆炸物，目前尚不清楚这些事件是否彼此相关。部分威胁则是由一个知名度不高的组织宣称负责。\n\n发信者自称为「男性国家战士」（Fighters of the Male State），并声称其目标是「女性主义政权」，希望「在历史上留下印记」。\n\n这些内容最先由义大利媒体披露，其后获管理罗马两座机场的罗马机场公司（Aeroporti di Roma）向BBC证实。\n\n本文原以英文撰写，我们使用了人工智能协助翻译，并由BBC记者在发布前进行审核。了解更多关于我们如何使用人工智能的资讯。", "link": "https://www.bbc.com/zhongwen/articles/c60qkk15l8d0o/trad?at_medium=RSS&at_campaign=rss", "time": "11月06日 19:14", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "美国中期选举后，AI放缓忧虑重创全球大型科技股，韩国股市熔断", "title_zh": "美国中期选举后，AI放缓忧虑重创全球大型科技股，韩国股市熔断", "summary_orig": "市场正对美国期中选举后可能加强审查数据中心建设及人工智慧产业的前景作出反应。", "summary_zh": "市场正对美国期中选举后可能加强审查数据中心建设及人工智慧产业的前景作出反应。", "body_orig": "", "body_zh": "在美国期中选举引发外界对人工智慧（AI）发展放缓的忧虑之后，美国及亚洲主要科技企业市值蒸发数以千亿美元计，全球股市出现大幅抛售。\n\n随著主张放缓AI发展的民主党候选人在选举中胜出，科技及人工智慧相关企业股价应声大跌。\n\n根据道琼数据，以科技股为主的纳斯达克综合指数收市下跌超过5.5%，市值蒸发约2.5兆美元（1.9兆英镑）；其他美国主要股指亦出现显著跌幅，创下自2025年以来最差单日表现。\n\n这波抛售潮也反映市场原本就存在的忧虑，即企业在AI领域投入的庞大资金最终能否带来回报。\n\n亚洲方面，以科技股为主的股市指数周五早盘大幅下跌，生产AI所需晶片及相关设备的企业股价纷纷走低。\n\n日本日经225指数早盘下跌6%，记忆体晶片制造商铠侠（Kioxia）股价重挫逾12.6%，竞争对手东京威力科创（Tokyo Electron）则下跌9.5%。\n\n韩国晶片制造商SK海力士（SK Hynix）下跌超过11.5%，三星电子（Samsung）跌幅接近10%。\n\n首尔股市的抛售潮导致韩国综合股价指数（Kospi）暴跌超过8.5%，并触发所谓的「熔断机制」（circuit breaker），即透过暂停交易来抑制恐慌性卖盘。\n\n台湾加权股价指数（Taiex）下跌超过8.3%，晶圆代工龙头台积电（TSMC）重挫近8.5%。\n\nMarketWatch晶片产业分析师布兰妮．阮（Britney Nguyen）表示，这反映出市场对AI基础建设支出规模的担忧「正在持续发酵」。\n\n民主党候选人在全美多场选战中主张放缓数据中心与人工智慧产业的扩张，而全国各地选票上也出现数十项旨在限制这类基础设施发展的提案。\n\n随著民主党在周二期中选举中拿下参议院与众议院控制权，他们将在特朗普（Donald Trump）剩余任期内掌握国会主导权。\n\n德州新当选的民主党籍州长吉娜·伊诺霍萨（Gina Hinojosa）竞选期间便大力反对数据中心扩张，并承诺暂停批准新的数据中心建设计划。\n\n以及，「记住，不是共和党，而是『笨主党』（Dumocrats，嘲讽民主党的说法）。但不用害怕，不管用什么方法，我们很快就会变得比以往更加强大。让美国再次伟大！」\n\n部分民主党人士则认为，人工智慧产业在缺乏足够监管与安全防护措施下发展过快，因此希望利用掌握国会的新权力加以约束。\n\n民主党参议员伯尼·桑德斯（Bernie Sanders）周四在X平台发文表示：「美国人民不希望大型科技寡头破坏环境、摧毁工作机会，并威胁人类未来。现在就应实施全国性的数据中心建设暂停令。」\n\n高度依赖AI数据中心业务的企业，包括关键晶片制造商与半导体公司股价周四全面重挫，突显投资人的忧虑其实早已逐渐累积。\n\n欧洲股市周四交易时段，晶片制造商英飞凌（Infineon）股价下跌超过8.5%，科技设备制造商艾司摩尔（ASML）下跌6.5%。\n\n其他晶片制造商也同样受挫，超微（AMD）与美光（Micron）跌幅均超过17%；英特尔（Intel）下跌10.3%；记忆卡制造商闪迪（Sandisk）更暴跌超过22%。\n\n追踪30家大型半导体企业表现的费城半导体指数（Philadelphia Semiconductor Index）重挫超过12%。\n\n马斯克（Elon Musk）旗下的SpaceX与特斯拉（Tesla）股价也大幅下跌，分别下跌8%和接近11%，单日合计蒸发超过3,000亿美元市值。\n\n马斯克先前曾投入近4.5亿美元支持共和党候选人，其中至少4,500万美元协助肯·帕克斯顿（Ken Paxton）竞选德州参议员席次，但德州最终仍在周二晚间出现所谓的「民主党海啸」，转向支持民主党。\n\n整体而言，包括苹果（Apple）、辉达与特斯拉在内的所谓「科技七巨头」（Magnificent Seven），单日市值合计蒸发约1兆美元。\n\n标普500指数（S&P 500）收盘下跌4.4%；道琼工业平均指数（Dow Jones Industrial Average）则回吐周三所有涨幅，收跌超过3.4%。\n\n由于跌幅过大，纳斯达克综合指数（Nasdaq Composite）已进入市场人士所称的「修正区间」（correction territory），即指数较近期高点回落至少10%。\n\n财富俱乐部（Wealth Club）首席投资策略师苏珊娜·斯特里特（Susannah Streeter）表示，纳斯达克与标普500的大幅下跌正向全球市场传递冲击波。\n\n「市场原本就担心投入AI基础设施的庞大资金未必能带来投资人期待的回报，如今又面临数据中心建设可能大幅放缓的风险，两种忧虑同时爆发。」\n\n盛宝银行（Saxo）首席投资策略师查鲁·查纳纳（Charu Chanana）则表示，未来数据中心审批将受到更严格检视，而其对环境及电价的影响也可能拖延计划进度并推高整体产业成本。\n\n她表示，两大政党都希望确保美国在科技领域维持领先，「但支持AI发展，与允许基础设施不计代价、不受限制地扩张，是两回事。」\n\nOpenAI总裁兼共同创办人格雷格·布罗克曼（Greg Brockman）表示，他认为各界都对社会对数据中心的反应感到意外，而业界仍需做更多工作争取地方社区支持。\n\n布罗克曼周三晚间在加州纳帕（Napa）举行的《华尔街日报》科技会议（WSJ Tech conference）上表示：「过去一年来，我们逐渐意识到，身在旧金山、却想在德州、乔治亚州以及其他地方兴建基础设施时，不能只是在社群媒体上发文说『这会是件好事』。你必须真正走进那些社区。」\n\nMeta总裁黛娜·鲍威尔·麦考密克（Dina Powell McCormick）则表示，科技产业需要更努力向大众说明AI的价值。\n\n除了期中选举带来的即时冲击之外，也有愈来愈多投资人开始担心，AI概念股可能已形成资产泡沫，而市场正迎来一次必要的修正。\n\n本文原以英文撰写，我们使用了人工智能协助翻译，并由BBC记者在发布前进行审核。了解更多关于我们如何使用人工智能的资讯。", "body": "在美国期中选举引发外界对人工智慧（AI）发展放缓的忧虑之后，美国及亚洲主要科技企业市值蒸发数以千亿美元计，全球股市出现大幅抛售。\n\n随著主张放缓AI发展的民主党候选人在选举中胜出，科技及人工智慧相关企业股价应声大跌。\n\n根据道琼数据，以科技股为主的纳斯达克综合指数收市下跌超过5.5%，市值蒸发约2.5兆美元（1.9兆英镑）；其他美国主要股指亦出现显著跌幅，创下自2025年以来最差单日表现。\n\n这波抛售潮也反映市场原本就存在的忧虑，即企业在AI领域投入的庞大资金最终能否带来回报。\n\n亚洲方面，以科技股为主的股市指数周五早盘大幅下跌，生产AI所需晶片及相关设备的企业股价纷纷走低。\n\n日本日经225指数早盘下跌6%，记忆体晶片制造商铠侠（Kioxia）股价重挫逾12.6%，竞争对手东京威力科创（Tokyo Electron）则下跌9.5%。\n\n韩国晶片制造商SK海力士（SK Hynix）下跌超过11.5%，三星电子（Samsung）跌幅接近10%。\n\n首尔股市的抛售潮导致韩国综合股价指数（Kospi）暴跌超过8.5%，并触发所谓的「熔断机制」（circuit breaker），即透过暂停交易来抑制恐慌性卖盘。\n\n台湾加权股价指数（Taiex）下跌超过8.3%，晶圆代工龙头台积电（TSMC）重挫近8.5%。\n\nMarketWatch晶片产业分析师布兰妮．阮（Britney Nguyen）表示，这反映出市场对AI基础建设支出规模的担忧「正在持续发酵」。\n\n民主党候选人在全美多场选战中主张放缓数据中心与人工智慧产业的扩张，而全国各地选票上也出现数十项旨在限制这类基础设施发展的提案。\n\n随著民主党在周二期中选举中拿下参议院与众议院控制权，他们将在特朗普（Donald Trump）剩余任期内掌握国会主导权。\n\n德州新当选的民主党籍州长吉娜·伊诺霍萨（Gina Hinojosa）竞选期间便大力反对数据中心扩张，并承诺暂停批准新的数据中心建设计划。\n\n以及，「记住，不是共和党，而是『笨主党』（Dumocrats，嘲讽民主党的说法）。但不用害怕，不管用什么方法，我们很快就会变得比以往更加强大。让美国再次伟大！」\n\n部分民主党人士则认为，人工智慧产业在缺乏足够监管与安全防护措施下发展过快，因此希望利用掌握国会的新权力加以约束。\n\n民主党参议员伯尼·桑德斯（Bernie Sanders）周四在X平台发文表示：「美国人民不希望大型科技寡头破坏环境、摧毁工作机会，并威胁人类未来。现在就应实施全国性的数据中心建设暂停令。」\n\n高度依赖AI数据中心业务的企业，包括关键晶片制造商与半导体公司股价周四全面重挫，突显投资人的忧虑其实早已逐渐累积。\n\n欧洲股市周四交易时段，晶片制造商英飞凌（Infineon）股价下跌超过8.5%，科技设备制造商艾司摩尔（ASML）下跌6.5%。\n\n其他晶片制造商也同样受挫，超微（AMD）与美光（Micron）跌幅均超过17%；英特尔（Intel）下跌10.3%；记忆卡制造商闪迪（Sandisk）更暴跌超过22%。\n\n追踪30家大型半导体企业表现的费城半导体指数（Philadelphia Semiconductor Index）重挫超过12%。\n\n马斯克（Elon Musk）旗下的SpaceX与特斯拉（Tesla）股价也大幅下跌，分别下跌8%和接近11%，单日合计蒸发超过3,000亿美元市值。\n\n马斯克先前曾投入近4.5亿美元支持共和党候选人，其中至少4,500万美元协助肯·帕克斯顿（Ken Paxton）竞选德州参议员席次，但德州最终仍在周二晚间出现所谓的「民主党海啸」，转向支持民主党。\n\n整体而言，包括苹果（Apple）、辉达与特斯拉在内的所谓「科技七巨头」（Magnificent Seven），单日市值合计蒸发约1兆美元。\n\n标普500指数（S&P 500）收盘下跌4.4%；道琼工业平均指数（Dow Jones Industrial Average）则回吐周三所有涨幅，收跌超过3.4%。\n\n由于跌幅过大，纳斯达克综合指数（Nasdaq Composite）已进入市场人士所称的「修正区间」（correction territory），即指数较近期高点回落至少10%。\n\n财富俱乐部（Wealth Club）首席投资策略师苏珊娜·斯特里特（Susannah Streeter）表示，纳斯达克与标普500的大幅下跌正向全球市场传递冲击波。\n\n「市场原本就担心投入AI基础设施的庞大资金未必能带来投资人期待的回报，如今又面临数据中心建设可能大幅放缓的风险，两种忧虑同时爆发。」\n\n盛宝银行（Saxo）首席投资策略师查鲁·查纳纳（Charu Chanana）则表示，未来数据中心审批将受到更严格检视，而其对环境及电价的影响也可能拖延计划进度并推高整体产业成本。\n\n她表示，两大政党都希望确保美国在科技领域维持领先，「但支持AI发展，与允许基础设施不计代价、不受限制地扩张，是两回事。」\n\nOpenAI总裁兼共同创办人格雷格·布罗克曼（Greg Brockman）表示，他认为各界都对社会对数据中心的反应感到意外，而业界仍需做更多工作争取地方社区支持。\n\n布罗克曼周三晚间在加州纳帕（Napa）举行的《华尔街日报》科技会议（WSJ Tech conference）上表示：「过去一年来，我们逐渐意识到，身在旧金山、却想在德州、乔治亚州以及其他地方兴建基础设施时，不能只是在社群媒体上发文说『这会是件好事』。你必须真正走进那些社区。」\n\nMeta总裁黛娜·鲍威尔·麦考密克（Dina Powell McCormick）则表示，科技产业需要更努力向大众说明AI的价值。\n\n除了期中选举带来的即时冲击之外，也有愈来愈多投资人开始担心，AI概念股可能已形成资产泡沫，而市场正迎来一次必要的修正。\n\n本文原以英文撰写，我们使用了人工智能协助翻译，并由BBC记者在发布前进行审核。了解更多关于我们如何使用人工智能的资讯。", "link": "https://www.bbc.com/zhongwen/articles/cqlyeen0z8x2o/trad?at_medium=RSS&at_campaign=rss", "time": "11月06日 13:19", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "美国中期选举结果对中国和世界各国意味着什么？", "title_zh": "美国中期选举结果对中国和世界各国意味着什么？", "summary_orig": "民主党在美国中期选举中取得胜利，将在特朗普总统余下的任期内掌控国会，标志着美国政治格局出现重大变化。从乌克兰和中东的冲突，到美国与中国的贸易关系，BBC记者分析这次选举结果对世界其他地区意味着什么。", "summary_zh": "民主党在美国中期选举中取得胜利，将在特朗普总统余下的任期内掌控国会，标志着美国政治格局出现重大变化。从乌克兰和中东的冲突，到美国与中国的贸易关系，BBC记者分析这次选举结果对世界其他地区意味着什么。", "body_orig": "", "body_zh": "民主党在美国中期选举中同时赢得参议院和众议院的控制权，将在特朗普总统余下的任期内掌控国会。\n\n这场选举令美国政治格局出现重大变化，对特朗普总统构成重大挫折。他承认，伊朗战争和生活成本上涨，是导致多名共和党候选人落败的原因。\n\n美国副总统万斯（JD Vance）说：「我们输掉选举的原因就是这场（伊朗）战争。」\n\n从乌克兰和中东的冲突，到美国与中国的贸易关系，BBC记者分析这次选举结果对世界其他地区意味着什么。\n\nBBC波斯语部驻伦敦资深记者哈比比亚扎德（Ghoncheh Habibiazad）\n\n伊朗最高领袖穆杰塔巴·哈梅内伊（Mojtaba Khamenei）表示，任何认为美国政治局势的变化会令「美国对伊朗的敌意」有所改变的人，都是「大错特错」。\n\n这位最高领袖的父亲阿里·哈梅内伊（Ali Khamenei）在2月28日美国与以色列的联合空袭中丧生，其后由他接任。穆杰塔巴·哈梅内伊已经数月没有公开露面。\n\n上述言论出自他周三发表的一份长达六页的书面声明，当天是1979年伊朗示威者占领美国驻德黑兰大使馆事件的周年纪念日。\n\n理论上，这次「特朗普计划」（Project Trump）遭遇选举挫折，在其他时候可能会被视为对海湾阿拉伯国家的一次打击。\n\n杜拜设有一座特朗普国际高尔夫球场，卡塔尔曾向特朗普赠送一架价值4亿美元的飞机，而阿联酋、卡塔尔和沙特阿拉伯亦合共向特朗普女婿贾里德·库什纳（Jared Kushner）的公司Affinity Capital投资数十亿美元。\n\n沙特与特朗普的前任、民主党籍总统拜登（Joe Biden）关系尤其紧张。还记得2022年拜登与沙特王储那次尴尬的碰拳吗？\n\n海湾国家领袖对奥巴马（Barack Obama）前总统同样有很大疑虑，因为他未有就叙利亚总统巴沙尔·阿萨德（Bashar al-Assad）使用毒气一事采取惩罚行动。\n\n正如一名评论员所说：「特朗普总统把海湾地区点燃了。」他指的是2月28日爆发的战争。海湾国家至今仍然担心，特朗普可能再次挑起战火，导致伊朗报复，对这些国家的关键基础设施造成毁灭性破坏。\n\n特朗普在2024年竞逐第二个总统任期时，曾承诺将汽油价格降至每加仑2美元以下。但今年10月的平均价格为每加仑4.31美元。他亦曾承诺，如果重返白宫，就不会再有新的战争。\n\n然而，就在中期选举前一天，美国再次对伊朗一座岛屿发动空袭。特朗普向记者表示，他对发动这场战争毫不后悔。\n\n但伊朗最高领袖穆杰塔巴·哈梅内伊在声明中表示，他不认为选举结果会令美国政策有所改变。\n\n特朗普今天接受BBC在美国的新闻合作伙伴哥伦比亚广播公司新闻部（CBS News）访问时表示，这场冲突将在「我说结束的时候」结束。\n\n北京与华盛顿之间的关系，是本世纪的大国竞争焦点。特朗普准备在本月稍后访问中国，习近平即将接待他，或许会认为自己在这场角力中占了上风。\n\n但习近平采取反制措施，同样大幅提高关税，令特朗普的计划适得其反。结果是许多商品在美国的价格上涨，包括玩具和衣服等普通家庭偶尔购买、用来享受生活的小商品。\n\n这场贸易战最终以双方达成休战协议告一段落，但协议将于明年1月底到期。中国可能认为，特朗普在中期选举受挫后，正忙于应对败选的打击，并希望达成协议。\n\n俄罗斯总统普京（Vladimir Putin）的发言人佩斯科夫（Dmitry Peskov）向俄罗斯媒体表示：「我们衷心希望特朗普继续推动和平的努力。」\n\n佩斯科夫接着说：「我们看到了梅拉尼娅·特朗普（Melania Trump）在人道主义和平工作上取得的成功。」\n\n他指的是近期在俄罗斯占领的乌克兰城镇奥莱什基（Oleshky）进行的人道主义行动。\n\n但俄罗斯大概不会怪罪特朗普，因为克里姆林宫已在与特朗普的关系上投入大量心力，而且莫斯科显然仍希望与特朗普政府发展经济合作。\n\n对乌克兰、伊朗和中东各地的民众而言，美国中期选举的焦点不仅是美国国内政治，更是选举结果可能对持续中的冲突带来什么影响。\n\n在乌克兰，评论人士聚焦于特朗普处理俄乌战争的方式。记者罗曼·岑巴柳克（Roman Tsymbalyuk）揶揄特朗普说，他「解决了所有战争，却输掉了自己的战争」，借此讽刺特朗普多次声称自己结束了世界各地的冲突。\n\n随着俄罗斯持续袭击乌克兰的能源基础设施，基辅有些人希望民主党在选举中取得进展，能够加强对莫斯科实施更严厉制裁的支持。\n\n在莫斯科，克里姆林宫公开表示，希望特朗普继续致力斡旋结束战争，俄罗斯与乌克兰预计本月会再举行谈判。\n\n不过，俄罗斯国内支持战争的人士警告，民主党控制的国会，可能限制特朗普日后与克里姆林宫达成协议，或放宽对俄制裁的能力。\n\n与此同时，伊朗领导层及与政府有关联的媒体，将民主党在选举中取得的进展，形容为美国民众对特朗普战争政策的否定。\n\nBBC国际部伊莎贝尔·肖（Isabel Shaw）及安德鲁·韦布（Andrew Webb）编辑。\n\n本文原以英文撰写，我们使用了人工智能协助翻译，并由BBC记者在发布前进行审核。了解更多关于我们如何使用人工智能的资讯。", "body": "民主党在美国中期选举中同时赢得参议院和众议院的控制权，将在特朗普总统余下的任期内掌控国会。\n\n这场选举令美国政治格局出现重大变化，对特朗普总统构成重大挫折。他承认，伊朗战争和生活成本上涨，是导致多名共和党候选人落败的原因。\n\n美国副总统万斯（JD Vance）说：「我们输掉选举的原因就是这场（伊朗）战争。」\n\n从乌克兰和中东的冲突，到美国与中国的贸易关系，BBC记者分析这次选举结果对世界其他地区意味着什么。\n\nBBC波斯语部驻伦敦资深记者哈比比亚扎德（Ghoncheh Habibiazad）\n\n伊朗最高领袖穆杰塔巴·哈梅内伊（Mojtaba Khamenei）表示，任何认为美国政治局势的变化会令「美国对伊朗的敌意」有所改变的人，都是「大错特错」。\n\n这位最高领袖的父亲阿里·哈梅内伊（Ali Khamenei）在2月28日美国与以色列的联合空袭中丧生，其后由他接任。穆杰塔巴·哈梅内伊已经数月没有公开露面。\n\n上述言论出自他周三发表的一份长达六页的书面声明，当天是1979年伊朗示威者占领美国驻德黑兰大使馆事件的周年纪念日。\n\n理论上，这次「特朗普计划」（Project Trump）遭遇选举挫折，在其他时候可能会被视为对海湾阿拉伯国家的一次打击。\n\n杜拜设有一座特朗普国际高尔夫球场，卡塔尔曾向特朗普赠送一架价值4亿美元的飞机，而阿联酋、卡塔尔和沙特阿拉伯亦合共向特朗普女婿贾里德·库什纳（Jared Kushner）的公司Affinity Capital投资数十亿美元。\n\n沙特与特朗普的前任、民主党籍总统拜登（Joe Biden）关系尤其紧张。还记得2022年拜登与沙特王储那次尴尬的碰拳吗？\n\n海湾国家领袖对奥巴马（Barack Obama）前总统同样有很大疑虑，因为他未有就叙利亚总统巴沙尔·阿萨德（Bashar al-Assad）使用毒气一事采取惩罚行动。\n\n正如一名评论员所说：「特朗普总统把海湾地区点燃了。」他指的是2月28日爆发的战争。海湾国家至今仍然担心，特朗普可能再次挑起战火，导致伊朗报复，对这些国家的关键基础设施造成毁灭性破坏。\n\n特朗普在2024年竞逐第二个总统任期时，曾承诺将汽油价格降至每加仑2美元以下。但今年10月的平均价格为每加仑4.31美元。他亦曾承诺，如果重返白宫，就不会再有新的战争。\n\n然而，就在中期选举前一天，美国再次对伊朗一座岛屿发动空袭。特朗普向记者表示，他对发动这场战争毫不后悔。\n\n但伊朗最高领袖穆杰塔巴·哈梅内伊在声明中表示，他不认为选举结果会令美国政策有所改变。\n\n特朗普今天接受BBC在美国的新闻合作伙伴哥伦比亚广播公司新闻部（CBS News）访问时表示，这场冲突将在「我说结束的时候」结束。\n\n北京与华盛顿之间的关系，是本世纪的大国竞争焦点。特朗普准备在本月稍后访问中国，习近平即将接待他，或许会认为自己在这场角力中占了上风。\n\n但习近平采取反制措施，同样大幅提高关税，令特朗普的计划适得其反。结果是许多商品在美国的价格上涨，包括玩具和衣服等普通家庭偶尔购买、用来享受生活的小商品。\n\n这场贸易战最终以双方达成休战协议告一段落，但协议将于明年1月底到期。中国可能认为，特朗普在中期选举受挫后，正忙于应对败选的打击，并希望达成协议。\n\n俄罗斯总统普京（Vladimir Putin）的发言人佩斯科夫（Dmitry Peskov）向俄罗斯媒体表示：「我们衷心希望特朗普继续推动和平的努力。」\n\n佩斯科夫接着说：「我们看到了梅拉尼娅·特朗普（Melania Trump）在人道主义和平工作上取得的成功。」\n\n他指的是近期在俄罗斯占领的乌克兰城镇奥莱什基（Oleshky）进行的人道主义行动。\n\n但俄罗斯大概不会怪罪特朗普，因为克里姆林宫已在与特朗普的关系上投入大量心力，而且莫斯科显然仍希望与特朗普政府发展经济合作。\n\n对乌克兰、伊朗和中东各地的民众而言，美国中期选举的焦点不仅是美国国内政治，更是选举结果可能对持续中的冲突带来什么影响。\n\n在乌克兰，评论人士聚焦于特朗普处理俄乌战争的方式。记者罗曼·岑巴柳克（Roman Tsymbalyuk）揶揄特朗普说，他「解决了所有战争，却输掉了自己的战争」，借此讽刺特朗普多次声称自己结束了世界各地的冲突。\n\n随着俄罗斯持续袭击乌克兰的能源基础设施，基辅有些人希望民主党在选举中取得进展，能够加强对莫斯科实施更严厉制裁的支持。\n\n在莫斯科，克里姆林宫公开表示，希望特朗普继续致力斡旋结束战争，俄罗斯与乌克兰预计本月会再举行谈判。\n\n不过，俄罗斯国内支持战争的人士警告，民主党控制的国会，可能限制特朗普日后与克里姆林宫达成协议，或放宽对俄制裁的能力。\n\n与此同时，伊朗领导层及与政府有关联的媒体，将民主党在选举中取得的进展，形容为美国民众对特朗普战争政策的否定。\n\nBBC国际部伊莎贝尔·肖（Isabel Shaw）及安德鲁·韦布（Andrew Webb）编辑。\n\n本文原以英文撰写，我们使用了人工智能协助翻译，并由BBC记者在发布前进行审核。了解更多关于我们如何使用人工智能的资讯。", "link": "https://www.bbc.com/zhongwen/articles/ckreyrxvg3xyo/trad?at_medium=RSS&at_campaign=rss", "time": "11月05日 05:02", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "「这是一场灾难」：中期选举惨败，共和党内怒火指向特朗普", "title_zh": "「这是一场灾难」：中期选举惨败，共和党内怒火指向特朗普", "summary_orig": "一些共和党人告诉BBC，特朗普只顾自己的政治遗产，漠视选民关注的问题，令共和党付出了代价。", "summary_zh": "一些共和党人告诉BBC，特朗普只顾自己的政治遗产，漠视选民关注的问题，令共和党付出了代价。", "body_orig": "", "body_zh": "美国共和党内部中期选举令人震惊的结果，最初感到错愕，但这种情绪很快便转化为对美国总统特朗普（Donald Trump）的愤怒。\n\n民主党在德克萨斯州、堪萨斯州和南卡罗来纳州等共和党传统票仓接连爆冷胜出后，一些共和党人将矛头指向特朗普，认为他只顾自己的政治遗产，对选民关注的问题漠不关心，导致共和党失去国会控制权。\n\n德克萨斯州共和党资深说客比尔·米勒（Bill Miller）告诉BBC：「责任在他，不在其他任何人身上。这是对特朗普总统彻底而全面的否定。」\n\n大多数共和党人原本已预期会失去众议院控制权，也清楚知道，在这个有利于在野党的艰难选举周期中，要保住参议院控制权并不容易。\n\n然而，一些共和党人在接受访问时表示，特朗普不受欢迎的政策、低迷的施政支持率，以及他对华盛顿建筑工程的沉迷，拖累了共和党的选情。\n\n明尼苏达州共和党策略师格雷格·佩平（Gregg Peppin）说：「他犯了一个又一个错误。很明显，在一个又一个州，民众都不喜欢总统的政策。」\n\n一名白宫盟友表示，公众对特朗普在伊朗战争、关税，以及政府打击移民行动方面的不满，在11月形成了一场「完美风暴」。\n\n此人表示：「党内对整件事的发展明显感到沮丧」，而且大部分不满都指向特朗普。党内对特朗普的愤怒情绪「极为强烈」。\n\nBBC访问了十多名共和党党务人员、竞选团队官员、白宫盟友及其他相关人士，其中许多人要求不具名，以便坦率评价特朗普在中期选举中的策略。\n\n对特朗普和共和党而言，周二晚间的选举结果事关重大。如果总统所属政党的表现较佳，就像2022年中期选举那样，当时总统拜登（Joe Biden）领导的民主党在众议院仅失去九个议席，并在参议院增加一席，便能为共和党迎接2028年选举增添动力。\n\n然而，特朗普现在将要面对由民主党控制的国会。民主党议员士气高昂，急于调查特朗普政府、阻止他的司法官员提名，以及妨碍他推行余下的施政议程。\n\n这次中期选举令特朗普的第二个总统任期进入充满不确定性的新阶段，也可能迫使共和党开始正视特朗普时代结束后的未来。\n\n爱荷华州共和党全国委员会委员史蒂夫·谢弗勒（Steve Scheffler）在选举前夕表示：「我不认为他的影响力正在减弱。」但他也说，就中期选举而言，「有些话你会希望他换一种方式说」。\n\n特朗普在选举当晚大部分时间保持沉默，直到民主党被确定赢得参众两院控制权后，才在其社交平台Truth Social发文。\n\n特朗普写道：「我的名字不在选票上，如果我有参选，我们一定会以压倒性优势获胜！感谢各位关注此事。」\n\n特朗普告诉霍士新闻，他对选举结果感到「有点意外」，但指出总统所属政党通常在中期选举中表现不佳。\n\n虽然民主党在2026年的斩获未有打破纪录，但该党确实赢得数十场众议院、州长及参议院选举，包括一些民主党数十年来一直缺乏竞争力的州份。\n\n在周二之前，民主党自1932年以来从未在堪萨斯州赢得参议院议席，在德克萨斯州也已超过30年未曾赢得全州性选举。\n\n民主党亦在南卡罗来纳州等长期支持共和党的州份意外胜出。就在投票日前几个星期，这些议席仍被视为共和党的安全席位。\n\n特朗普和副总统万斯（JD Vance）在中期选举前举行了数十场竞选集会。支持特朗普的主要超级政治行动委员会「让美国再次伟大」（MAGA Inc.）亦花费数亿美元支持共和党候选人。\n\n他们指出历届中期选举的历史趋势，并表示共和党在佐治亚州、密歇根州和德克萨斯州等关键摇摆州，都受到实力较弱的候选人拖累。\n\n另一名要求匿名的德克萨斯州共和党党务人员表示，该州共和党参议院候选人肯·帕克斯顿（Ken Paxton）打了一场「全国最差的参议院选战，无论是共和党还是民主党都无出其右」。\n\n他补充说，击败帕克斯顿的民主党对手詹姆斯·塔拉里科（James Talarico）则打了一场「非常出色、策略精明的选战」。\n\n其他人则为特朗普秋季的竞选行程辩护，指出他必须在治理国家的本职工作与到各地拉票之间取得平衡。\n\n密歇根州共和党青年组织主席克里什·马特拉尼（Krish Mathrani）说：「他是总统，不可能每周七天、每天24小时都在竞选。」\n\n马特拉尼表示，特朗普的竞选集会有助提高共和党选民的热情，「特朗普总统是一部催票机器。」\n\n但在特朗普本人没有参选的选举中，他引以为傲的催票机制一直未能发挥同样的作用，2026年也不例外。\n\n特朗普声称，在他的领导下，美国经济有所改善，而且他正在实现伊朗战争的目标，但选民并不买帐。\n\n特朗普试图将民主党描绘成极端社会主义者的策略也未能奏效。选民让北卡罗来纳州的罗伊·库珀（Roy Cooper）等温和派民主党人胜出。\n\n库珀竞选团队一名官员说：「这一招对库珀根本没用。试图把他标签为某种社会主义自由派，根本行不通。」\n\n在夏季，特朗普还是经常看起来对中期选举兴趣不大，而当时国会共和党人的注意力已开始转向选举。\n\n这些工程包括正在兴建的白宫宴会厅、白宫南草坪的直升机停机坪、当地一座高尔夫球场的翻新工程、拟在阿灵顿国家公墓附近兴建的纪念拱门，以及甘迺迪中心的翻新工程。\n\n多名消息人士表示，特朗普在6月迎来80岁生日时，白宫举办终极格斗冠军赛（UFC）赛事等活动，令人觉得总统更热衷于庆祝自己，而非赢得中期选举。\n\n特朗普也多次淡化汽油价格上涨的问题，并经常将民众对生活负担能力的忧虑说成是民主党编造的骗局。\n\n举办这场大会本身就是一场赌博。共和党已有数十年未曾在中期选举前举行全国代表大会，而选民是否会收看，当时仍是未知之数。\n\n特朗普成为达拉斯大会的绝对主角，令一些共和党人感到不满。他们告诉BBC，原本希望大会能让共和党的中期选举候选人获得更多曝光。\n\n特朗普在冗长而漫无边际的主题演说中承诺，向所有投票支持共和党的人发放5000美元（3700英镑）。\n\n他还公开支持帕克斯顿，但在表态支持时，却花了很长篇幅批评这名候选人缺乏个人魅力，甚至评论他的外貌，令人侧目。\n\n德克萨斯州共和党全国委员会委员罗宾·阿姆斯特朗（Robin Armstrong）谈到特朗普对帕克斯顿的批评时说：「很明显，这种话从来都没有帮助。」\n\n德克萨斯州民主党执行主任特里·伯克（Terri Burke）说：「这场大会反而令共和党弄巧反拙，因为根本没有人关注。」\n\n他因赞扬俄亥俄州共和党参议员约翰·赫斯特德的体格而登上新闻头条，又因在密歇根州参议院选战中称阿卜杜勒·赛义德（Abdul El-Sayed）为「圣战分子」而受到批评。\n\n凯蒂·扎卡里亚（Katie Zacharia）出任白宫新闻秘书仅五天便遭撤换；金伯利·吉尔福伊尔（Kimberly Guilfoyle）则在被揭发曾要求一名捐款人代她偿还信用卡债务后，辞去美国驻希腊大使职务。\n\n这项协议令国会议员措手不及，并受到部分共和党人谴责。就在协议达成前几个星期，特朗普才签署一项旨在切断俄罗斯石油及天然气收入的制裁法案。\n\n另一名白宫盟友表示，即使共和党败局逐渐明朗，总统的政治幕僚直到投票前最后几天，仍然表现得十分乐观。\n\n爱荷华州共和党全国委员会委员谢弗勒说：「无论是万斯、马尔科·鲁比奥（Marco Rubio），还是特德·克鲁兹（Ted Cruz），我们都有相当庞大的人才阵容。」", "body": "美国共和党内部中期选举令人震惊的结果，最初感到错愕，但这种情绪很快便转化为对美国总统特朗普（Donald Trump）的愤怒。\n\n民主党在德克萨斯州、堪萨斯州和南卡罗来纳州等共和党传统票仓接连爆冷胜出后，一些共和党人将矛头指向特朗普，认为他只顾自己的政治遗产，对选民关注的问题漠不关心，导致共和党失去国会控制权。\n\n德克萨斯州共和党资深说客比尔·米勒（Bill Miller）告诉BBC：「责任在他，不在其他任何人身上。这是对特朗普总统彻底而全面的否定。」\n\n大多数共和党人原本已预期会失去众议院控制权，也清楚知道，在这个有利于在野党的艰难选举周期中，要保住参议院控制权并不容易。\n\n然而，一些共和党人在接受访问时表示，特朗普不受欢迎的政策、低迷的施政支持率，以及他对华盛顿建筑工程的沉迷，拖累了共和党的选情。\n\n明尼苏达州共和党策略师格雷格·佩平（Gregg Peppin）说：「他犯了一个又一个错误。很明显，在一个又一个州，民众都不喜欢总统的政策。」\n\n一名白宫盟友表示，公众对特朗普在伊朗战争、关税，以及政府打击移民行动方面的不满，在11月形成了一场「完美风暴」。\n\n此人表示：「党内对整件事的发展明显感到沮丧」，而且大部分不满都指向特朗普。党内对特朗普的愤怒情绪「极为强烈」。\n\nBBC访问了十多名共和党党务人员、竞选团队官员、白宫盟友及其他相关人士，其中许多人要求不具名，以便坦率评价特朗普在中期选举中的策略。\n\n对特朗普和共和党而言，周二晚间的选举结果事关重大。如果总统所属政党的表现较佳，就像2022年中期选举那样，当时总统拜登（Joe Biden）领导的民主党在众议院仅失去九个议席，并在参议院增加一席，便能为共和党迎接2028年选举增添动力。\n\n然而，特朗普现在将要面对由民主党控制的国会。民主党议员士气高昂，急于调查特朗普政府、阻止他的司法官员提名，以及妨碍他推行余下的施政议程。\n\n这次中期选举令特朗普的第二个总统任期进入充满不确定性的新阶段，也可能迫使共和党开始正视特朗普时代结束后的未来。\n\n爱荷华州共和党全国委员会委员史蒂夫·谢弗勒（Steve Scheffler）在选举前夕表示：「我不认为他的影响力正在减弱。」但他也说，就中期选举而言 政治幕僚直到投票前最后几天，仍然表现得十分乐观。\n\n爱荷华州共和党全国委员会委员谢弗勒说：「无论是万斯、马尔科·鲁比奥（Marco Rubio），还是特德·克鲁兹（Ted Cruz），我们都有相当庞大的人才阵容。」", "link": "https://www.bbc.com/zhongwen/articles/cw5ynld35e3ro/trad?at_medium=RSS&at_campaign=rss", "time": "11月05日 10:36", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}]}, {"key": "dw_cn", "name": "德国之声中文", "lang": "中文", "tab_note": "本页嵌免费全文（本轮亲测多篇可完整阅读）", "free_mark": "full_verified", "error": null, "items": [{"title_orig": "俄军导弹再袭基辅 乌总统和市长打嘴仗", "title_zh": "俄军导弹再袭基辅 乌总统和市长打嘴仗", "summary_orig": "即将入冬的乌克兰再遭俄军导弹空袭，而此次攻击的目标则以供电、供水设施为主。11月6日晚间、7日凌晨，乌克兰多地发生停电。与此同时，首都基辅市长克利奇科和总统泽连斯基在城市防御问题上发生分歧。", "summary_zh": "即将入冬的乌克兰再遭俄军导弹空袭，而此次攻击的目标则以供电、供水设施为主。11月6日晚间、7日凌晨，乌克兰多地发生停电。与此同时，首都基辅市长克利奇科和总统泽连斯基在城市防御问题上发生分歧。", "body_orig": "", "body_zh": "（德国之声中文网）乌克兰各地的气温正在持续下降，俄军也趁此再次对乌克兰的能源基础设施发动大规模打击。11月6日晚间、7日凌晨乌克兰首都基辅市中心及其周边地区多次传出爆炸声。\n\n基辅市长克利奇科(Vitali Klitschko)在Telegram上表示，此次袭击使用了高超音速弹道导弹，防空系统极难将其拦截。袭击造成多栋住宅楼受损。军政管理当局还报告称，一间幼儿园在袭击中受损，另有两人受伤。\n\n克利奇科表示，基辅目前的电力供应状况“极其困难”。此外，供水和集中供暖服务也受到了袭击的影响。一座横跨第聂伯河、连接基辅东西两岸的关键桥梁也遭到破坏。据克利奇科称，共有五人受伤。\n\n在此之前，乌克兰总统泽连斯基曾录制视频，警告俄罗斯可能再次针对能源基础设施及横跨第聂伯河的桥梁发动袭击。在基辅等地大范围停电后，泽连斯基11月7日再次批评了克利奇科，称：“这是因为市政层面未能落实相关决策，导致未能做好准备应对供暖季、应对俄罗斯袭击能源设施。”\n\n克利奇科则在Telegram上反唇相讥：“首都究竟该如何阻止这场‘俄罗斯针对乌克兰能源部门的特别行动’？”他指出，基辅自10月16日起就已经开始提供集中供暖。\n\n除了基辅，乌克兰其他地区的电网也遭到了严重破坏。泽连斯基将此次针对能源基础设施的袭击描述为一场“混合型”攻击，其中包括36枚导弹和170多架无人机。\n\n此外，在乌克兰南部村庄科米舒瓦哈(Komyschuwacha)，一处援助物资分发点遭到俄军空袭，导致55人丧生。\n\n乌克兰、俄罗斯和美国计划于下周在阿拉伯联合酋长国举行磋商——这是各方在相当长一段时间以来的首场此类谈判。据俄罗斯国际文传电讯社报道，俄方计划派遣一个由外交官和军方官员组成的高级别代表团，其中俄罗斯副外长里亚布科夫(Sergei Ryabkov)将首次加入谈判团队。\n\n不过，德国国防部长皮斯托里乌斯(Boris Pistorius)认为，近期实现停火的希望十分渺茫。他在11月7日接受德国丰克媒体集团采访时表示，局势能否出现转机，取决于俄罗斯总统普京以及美国总统特朗普的行动。“过去几个月的情况表明，特朗普采取的方式很难迅速促成停火，更不用说实现和平了。”\n\n就在两天前，美国总统特朗普刚刚声称，一项旨在结束俄乌战争的“极为重大”协议正在酝酿之中，该协议涉及俄罗斯。此前，特朗普在白宫与俄罗斯总统特使季米特里耶夫(Kirill Dmitriev)进行了一次计划外会晤。“这将是一项非常重大的协议。它所涉及的范围将不仅限于乌克兰——甚至可以说，它可能涉及整个欧洲。”特朗普还强调，结束这场战争可能需要“整个欧洲”的参与。\n\n乌克兰总统泽连斯基则在接受美国CNN电视台采访时，就特朗普政府提议的所谓“新欧洲安全秩序构想”进行了警告。“坦白说，这绝非易事，甚至可能暗藏危险。……如果他们不谈论如何结束战争，那是非常危险的。俄罗斯却想直接从构建欧洲新安全架构谈起。”泽连斯基还强调，反对大国以牺牲欧盟、北约及其国家自身利益为代价达成任何协议。他表示：“我们都生活在欧洲。我们不希望再现‘雅尔塔’。”二战末期，苏联、美国、英国在克里米亚半岛的雅尔塔举行峰会，划分了在战后欧洲的势力范围。\n\n美国总统特朗普、俄罗斯总统普京、中国国家主席习近平很有可能在11月中旬的深圳APEC峰会以及明年初的佛罗里达G20峰会上举行三方会晤。\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "body": "（德国之声中文网）乌克兰各地的气温正在持续下降，俄军也趁此再次对乌克兰的能源基础设施发动大规模打击。11月6日晚间、7日凌晨乌克兰首都基辅市中心及其周边地区多次传出爆炸声。\n\n基辅市长克利奇科(Vitali Klitschko)在Telegram上表示，此次袭击使用了高超音速弹道导弹，防空系统极难将其拦截。袭击造成多栋住宅楼受损。军政管理当局还报告称，一间幼儿园在袭击中受损，另有两人受伤。\n\n克利奇科表示，基辅目前的电力供应状况“极其困难”。此外，供水和集中供暖服务也受到了袭击的影响。一座横跨第聂伯河、连接基辅东西两岸的关键桥梁也遭到破坏。据克利奇科称，共有五人受伤。\n\n在此之前，乌克兰总统泽连斯基曾录制视频，警告俄罗斯可能再次针对能源基础设施及横跨第聂伯河的桥梁发动袭击。在基辅等地大范围停电后，泽连斯基11月7日再次批评了克利奇科，称：“这是因为市政层面未能落实相关决策，导致未能做好准备应对供暖季、应对俄罗斯袭击能源设施。”\n\n克利奇科则在Telegram上反唇相讥：“首都究竟该如何阻止这场‘俄罗斯针对乌克兰能源部门的特别行动’？”他指出，基辅自10月16日起就已经开始提供集中供暖。\n\n除了基辅，乌克兰其他地区的电网也遭到了严重破坏。泽连斯基将此次针对能源基础设施的袭击描述为一场“混合型”攻击，其中包括36枚导弹和170多架无人机。\n\n此外，在乌克兰南部村庄科米舒瓦哈(Komyschuwacha)，一处援助物资分发点遭到俄军空袭，导致55人丧生。\n\n乌克兰、俄罗斯和美国计划于下周在阿拉伯联合酋长国举行磋商——这是各方在相当长一段时间以来的首场此类谈判。据俄罗斯国际文传电讯社报道，俄方计划派遣一个由外交官和军方官员组成的高级别代表团，其中俄罗斯副外长里亚布科夫(Sergei Ryabkov)将首次加入谈判团队。\n\n不过，德国国防部长皮斯托里乌斯(Boris Pistorius)认为，近期实现停火的希望十分渺茫。他在11月7日接受德国丰克媒体集团采访时表示，局势能否出现转机，取决于俄罗斯总统普京以及美国总统特朗普的行动。“过去几个月的情况表明，特朗普采取的方式很难迅速促成停火，更不用说实现和平了。”\n\n就在两天前，美国总统特朗普刚刚声称，一项旨在结束俄乌战争的“极为重大”协议正在酝酿之中，该协议涉及俄罗斯。此前，特朗普在白宫与俄罗斯总统特使季米特里耶夫(Kirill Dmitriev)进行了一次计划外会晤。“这将是一项非常重大的协议。它所涉及的范围将不仅限于乌克兰——甚至可以说，它可能涉及整个欧洲。”特朗普还强调，结束这场战争可能需要“整个欧洲”的参与。\n\n乌克兰总统泽连斯基则在接受美国CNN电视台采访时，就特朗普政府提议的所谓“新欧洲安全秩序构想”进行了警告。“坦白说，这绝非易事，甚至可能暗藏危险。……如果他们不谈论如何结束战争，那是非常危险的。俄罗斯却想直接从构建欧洲新安全架构谈起。”泽连斯基还强调，反对大国以牺牲欧盟、北约及其国家自身利益为代价达成任何协议。他表示：“我们都生活在欧洲。我们不希望再现‘雅尔塔’。”二战末期，苏联、美国、英国在克里米亚半岛的雅尔塔举行峰会，划分了在战后欧洲的势力范围。\n\n美国总统特朗普、俄罗斯总统普京、中国国家主席习近平很有可能在11月中旬的深圳APEC峰会以及明年初的佛罗里达G20峰会上举行三方会晤。\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "link": "https://www.dw.com/zh/俄军导弹再袭基辅-乌总统和市长打嘴仗/a-79885814?maca=chi-rss-chi-all-1127-xml-mrss", "time": "11月07日 22:56", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "中期选举惨败后首次人事调整：特朗普换掉白宫幕僚长", "title_zh": "中期选举惨败后首次人事调整：特朗普换掉白宫幕僚长", "summary_orig": "共和党在中期选举中遭遇重挫后，特朗普撤换白宫幕僚长怀尔斯，由副幕僚长米勒接任。米勒是特朗普强硬移民政策的主要推手，被民主党人斥为“极端分子”。这一任命表明MAGA阵营仍主导白宫，美国政坛将迎来更多对抗。", "summary_zh": "共和党在中期选举中遭遇重挫后，特朗普撤换白宫幕僚长怀尔斯，由副幕僚长米勒接任。米勒是特朗普强硬移民政策的主要推手，被民主党人斥为“极端分子”。这一任命表明MAGA阵营仍主导白宫，美国政坛将迎来更多对抗。", "body_orig": "", "body_zh": "（德国之声中文网）美国共和党在国会中期选举中惨败后，特朗普总统作出首个人事调整：撤换白宫幕僚长怀尔斯（Susie Wiles），由副幕僚长米勒（Stephen Miller）接任。\n\n特朗普感谢现年69岁的怀尔斯所做的“出色工作”。选举前，他曾多次强调绝不可能撤换怀尔斯，如今则表示，人生中有时必须“采取步骤”。怀尔斯是美国历史上首位女性白宫幕僚长。\n\n特朗普称米勒是他“最值得信赖的顾问”之一，是“了不起的斗士”，而且“非常忠诚”。现年41岁的米勒自2016年特朗普首次竞选总统起就为其效力，曾为他撰写演讲稿，主要在移民政策上为他出谋划策。\n\n米勒是特朗普政府强硬移民政策和大规模驱逐行动的主要设计者之一。2026年初，明尼阿波利斯发生联邦移民执法人员枪杀美国公民事件，引发广泛争议。\n\n这一任命意味着，特朗普与在中期选举中获胜的民主党走向对抗。众议院民主党领袖杰弗里斯（Hakeem Jeffries）称，米勒是“危险的排外者和鲁莽的极端分子，双手沾满美国人的鲜血”。此前担任参议院少数党领袖的民主党人舒默则称，米勒是“本届政府最野蛮、最不人道政策的设计者”，并表示民主党将“在每一步上与他对抗”。\n\n怀尔斯是特朗普政府中期选举策略的主要负责人。在她的推动下，80岁的特朗普在选前一个月内赴20个州出席了30场活动，但收效甚微。部分共和党候选人甚至刻意与日益不受选民欢迎的特朗普保持距离。\n\n起用米勒表明，“让美国再次伟大”（MAGA）极端保守派阵营在中期选举后仍然主导白宫，特朗普和民主党执掌的国会将面临一段充满对抗的时期。", "body": "（德国之声中文网）美国共和党在国会中期选举中惨败后，特朗普总统作出首个人事调整：撤换白宫幕僚长怀尔斯（Susie Wiles），由副幕僚长米勒（Stephen Miller）接任。\n\n特朗普感谢现年69岁的怀尔斯所做的“出色工作”。选举前，他曾多次强调绝不可能撤换怀尔斯，如今则表示，人生中有时必须“采取步骤”。怀尔斯是美国历史上首位女性白宫幕僚长。\n\n特朗普称米勒是他“最值得信赖的顾问”之一，是“了不起的斗士”，而且“非常忠诚”。现年41岁的米勒自2016年特朗普首次竞选总统起就为其效力，曾为他撰写演讲稿，主要在移民政策上为他出谋划策。\n\n米勒是特朗普政府强硬移民政策和大规模驱逐行动的主要设计者之一。2026年初，明尼阿波利斯发生联邦移民执法人员枪杀美国公民事件，引发广泛争议。\n\n这一任命意味着，特朗普与在中期选举中获胜的民主党走向对抗。众议院民主党领袖杰弗里斯（Hakeem Jeffries）称，米勒是“危险的排外者和鲁莽的极端分子，双手沾满美国人的鲜血”。此前担任参议院少数党领袖的民主党人舒默则称，米勒是“本届政府最野蛮、最不人道政策的设计者”，并表示民主党将“在每一步上与他对抗”。\n\n怀尔斯是特朗普政府中期选举策略的主要负责人。在她的推动下，80岁的特朗普在选前一个月内赴20个州出席了30场活动，但收效甚微。部分共和党候选人甚至刻意与日益不受选民欢迎的特朗普保持距离。\n\n起用米勒表明，“让美国再次伟大”（MAGA）极端保守派阵营在中期选举后仍然主导白宫，特朗普和民主党执掌的国会将面临一段充满对抗的时期。", "link": "https://www.dw.com/zh/中期选举惨败后首次人事调整：特朗普换掉白宫幕僚长/a-79884880?maca=chi-rss-chi-all-1127-xml-mrss", "time": "11月07日 20:37", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "反AI浪潮让黄仁勋祸不单行？股票暴跌 被国会传唤", "title_zh": "反AI浪潮让黄仁勋祸不单行？股票暴跌 被国会传唤", "summary_orig": "随着民主党在中期选举后全面执掌美国国会参众两院，原先与特朗普关系密切的AI科技大佬正面临全新挑战。民主党此次胜选与选民对AI产业的反感有很大关联。金融市场担心，新一届国会将全面限制AI产业发展。与此同时，英伟达老总黄仁勋还面临间谍案传唤。", "summary_zh": "随着民主党在中期选举后全面执掌美国国会参众两院，原先与特朗普关系密切的AI科技大佬正面临全新挑战。民主党此次胜选与选民对AI产业的反感有很大关联。金融市场担心，新一届国会将全面限制AI产业发展。与此同时，英伟达老总黄仁勋还面临间谍案传唤。", "body_orig": "", "body_zh": "（德国之声中文网）美国能源部表示，原定于11月6日举行的白宫“总统科学与技术顾问委员会”会议暂时取消。该委员会包括英伟达首席执行官黄仁勋、META首席执行官扎克伯格(Mark Zuckerberg)、AMD首席执行官苏姿丰以及其他一些科技企业的高管。美国能源部网站曾短暂地将11月13日列为会议的新日期，但随后又发送了一封邮件，宣布这条通知作废。\n\n根据原本的会议通知，该委员会应为特朗普最新成立的人工智能工作小组（即“超级智能特别工作组”）提供咨询。后者囊括了多名内阁官员、白宫幕僚以及其他一些特朗普总统任命的人员。“超级智能”（Super Intelligence）是特朗普总统对人工智能所偏好的称呼。白宫没有披露此次会议为何取消或者推迟。\n\n就在前一天(11月5日)，科技股遭遇大幅抛售。金融市场日益担心由民主党掌控的新一届国会可能会放缓人工智能（AI）的发展，同时也担心在构建AI基础设施方面投入的巨额资本支出可能无法带来足够的回报。这种市场动荡促使硅谷高管和华盛顿的决策者们加强了对该行业的审视。\n\n过去两年来，许多硅谷的科技界大佬都努力拉拢和特朗普总统的关系。而随着本周共和党在美国国会中期选举里惨败，这些硅谷大佬正面临民主党执掌的国会所发出的传票威胁。在此次选举中，选民对人工智能以及相关的数据中心建设之反感情绪很大程度上影响了投票倾向。\n\n目前，国会进步党团(Congressional Progressive Caucus)主席卡萨尔(Greg Casar)已经表示：“应当传唤人工智能公司的首席执行官们，要求他们在宣誓后作证。”民主党参议员马基(Ed Markey)则向科技高管们发出警告称，鉴于国会即将发出大量传票，他们恐怕得“多植些树，好为印制这些传票提供纸张”。 新当选的密歇根州民主党籍参议员赛义德(Abdul El-Sayed)更是提出激进主张，要对最强大的人工智能研发实施“全面暂停”，还呼吁美中两国签署条约，以“暂停并禁止超级智能”，也就是超越人类智能的人工智能。\n\n随着新当选议员明年1月3日正式到任，民主党将全面掌控参众两院，届时将可以通过各个委员会强制手段要求企业高管作证或提交内部文件，否则将面临起诉风险。\n\n根据美国全国广播公司NBC的出口民调，此次选举中，56%的选民都认为，人工智能和数据中心问题是他们做出投票选择时的“关键或主要考量因素”。由多家大型科技公司资助、具有影响力的中间派联盟“进步商会”（Chamber of Progress）首席执行官科瓦切维奇（Adam Kovacevich）说，“我们不应将‘反特朗普浪潮’与‘反对科技行业的民意授权’混为一谈。”\n\n事实上，不少亲共和党势力现在也开始反对人工智能和数据中心建设。在选举当晚的直播中，由多名知名亲特朗普的科技业投资者主持的播客节目Chamath Palihapitiya就警告指出，“如果说有什么能摧毁美国经济，那一定就是人工智能产业；而要摧毁人工智能产业，唯一的办法就是摧毁数据中心。”就连以看好科技增长前景而闻名的市场分析师艾夫斯(Dan Ives)如今也估计，美国计划新建的800至1000座数据中心中，有10%“最终将不会建成”。\n\n除了美国朝野上下的反AI思潮，还有另一件事也让英伟达首席执行官黄仁勋头疼不已。路透社查阅的一封邮件显示，众议院共和党资深议员正要求黄仁勋在11月内向国会通报相关情况。不久前，《纽约时报》披露称，美国当局正在调查一名黄姓中国籍女子，她曾是总部位于新加坡的Megaspeed公司的高管，该公司从英伟达采购人工智能（AI）芯片。美国当局一直在审查Megaspeed，怀疑该公司协助北京获取了被禁止向中国出口的先进AI芯片。\n\n在11月4日发出的一封信中，众议院外交委员会主席马斯特（Brian Mast）、“美中战略竞争特别委员会”主席穆勒纳尔（John Moolenaar）以及情报委员会成员克劳福德（Eric Crawford）要求黄仁勋于11月18日进行闭门通报，内容涉及《纽约时报》的上述报道，以及英伟达“针对外国敌对势力间谍活动的安保规程”。他们在信中写道，该报道引发了“关于（中国）获取美国敏感技术和信息所带来的重大国家安全担忧”。他们补充说：“国会必须查明美国国家安全究竟在多大程度上受到了威胁，这一点至关重要。”\n\n英伟达方面表示，黄仁勋“每年都会与数以千计的客户高管进行交流”。该公司强调，其在亚洲的云服务客户所获取的仅是常规商业信息，而非英伟达的敏感商业机密，也不涉及任何与美国国家安全相关的内容。“我们经常收到美国政府关于受关注方和实体的通报，并始终据此采取相应行动。”\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "body": "（德国之声中文网）美国能源部表示，原定于11月6日举行的白宫“总统科学与技术顾问委员会”会议暂时取消。该委员会包括英伟达首席执行官黄仁勋、META首席执行官扎克伯格(Mark Zuckerberg)、AMD首席执行官苏姿丰以及其他一些科技企业的高管。美国能源部网站曾短暂地将11月13日列为会议的新日期，但随后又发送了一封邮件，宣布这条通知作废。\n\n根据原本的会议通知，该委员会应为特朗普最新成立的人工智能工作小组（即“超级智能特别工作组”）提供咨询。后者囊括了多名内阁官员、白宫幕僚以及其他一些特朗普总统任命的人员。“超级智能”（Super Intelligence）是特朗普总统对人工智能所偏好的称呼。白宫没有披露此次会议为何取消或者推迟。\n\n就在前一天(11月5日)，科技股遭遇大幅抛售。金融市场日益担心由民主党掌控的新一届国会可能会放缓人工智能（AI）的发展，同时也担心在构建AI基础设施方面投入的巨额资本支出可能无法带来足够的回报。这种市场动荡促使硅谷高管和华盛顿的决策者们加强了对该行业的审视。\n\n过去两年来，许多硅谷的科技界大佬都努力拉拢和特朗普总统的关系。而随着本周共和党在美国国会中期选举里惨败，这些硅谷大佬正面临民主党执掌的国会所发出的传票威胁。在此次选举中，选民对人工智能以及相关的数据中心建设之反感情绪很大程度上影响了投票倾向。\n\n目前，国会进步党团(Congressional Progressive Caucus)主席卡萨尔(Greg Casar)已经表示：“应当传唤人工智能公司的首席执行官们，要求他们在宣誓后作证。”民主党参议员马基(Ed Markey)则向科技高管们发出警告称，鉴于国会即将发出大量传票，他们恐怕得“多植些树，好为印制这些传票提供纸张”。 新当选的密歇根州民主党籍参议员赛义德(Abdul El-Sayed)更是提出激进主张，要对最强大的人工智能研发实施“全面暂停”，还呼吁美中两国签署条约，以“暂停并禁止超级智能”，也就是超越人类智能的人工智能。\n\n随着新当选议员明年1月3日正式到任，民主党将全面掌控参众两院，届时将可以通过各个委员会强制手段要求企业高管作证或提交内部文件，否则将面临起诉风险。\n\n根据美国全国广播公司NBC的出口民调，此次选举中，56%的选民都认为，人工智能和数据中心问题是他们做出投票选择时的“关键或主要考量因素”。由多家大型科技公司资助、具有影响力的中间派联盟“进步商会”（Chamber of Progress）首席执行官科瓦切维奇（Adam Kovacevich）说，“我们不应将‘反特朗普浪潮’与‘反对科技行业的民意授权’混为一谈。”\n\n事实上，不少亲共和党势力现在也开始反对人工智能和数据中心建设。在选举当晚的直播中，由多名知名亲特朗普的科技业投资者主持的播客节目Chamath Palihapitiya就警告指出，“如果说有什么能摧毁美国经济，那一定就是人工智能产业；而要摧毁人工智能产业，唯一的办法就是摧毁数据中心。”就连以看好科技增长前景而闻名的市场分析师艾夫斯(Dan Ives)如今也估计，美国计划新建的800至1000座数据中心中，有10%“最终将不会建成”。\n\n除了美国朝野上下的反AI思潮，还有另一件事也让英伟达首席执行官黄仁勋头疼不已。路透社查阅的一封邮件显示，众议院共和党资深议员正要求黄仁勋在11月内向国会通报相关情况。不久前，《纽约时报》披露称，美国当局正在调查一名黄姓中国籍女子，她曾是总部位于新加坡的Megaspeed公司的高管，该公司从英伟达采购人工智能（AI）芯片。美国当局一直在审查Megaspeed，怀疑该公司协助北京获取了被禁止向中国出口的先进AI芯片。\n\n在11月4日发出的一封信中，众议院外交委员会主席马斯特（Brian Mast）、“美中战略竞争特别委员会”主席穆勒纳尔（John Moolenaar）以及情报委员会成员克劳福德（Eric Crawford）要求黄仁勋于11月18日进行闭门通报，内容涉及《纽约时报》的上述报道，以及英伟达“针对外国敌对势力间谍活动的安保规程”。他们在信中写道，该报道引发了“关于（中国）获取美国敏感技术和信息所带来的重大国家安全担忧”。他们补充说：“国会必须查明美国国家安全究竟在多大程度上受到了威胁，这一点至关重要。”\n\n英伟达方面表示，黄仁勋“每年都会与数以千计的客户高管进行交流”。该公司强调，其在亚洲的云服务客户所获取的仅是常规商业信息，而非英伟达的敏感商业机密，也不涉及任何与美国国家安全相关的内容。“我们经常收到美国政府关于受关注方和实体的通报，并始终据此采取相应行动。”\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "link": "https://www.dw.com/zh/反ai浪潮让黄仁勋祸不单行？股票暴跌-被国会传唤/a-79884461?maca=chi-rss-chi-all-1127-xml-mrss", "time": "11月07日 20:07", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "深圳APEC前夕 美国催中国兑现稀土承诺", "title_zh": "深圳APEC前夕 美国催中国兑现稀土承诺", "summary_orig": "深圳APEC会议召开前不到两周，美国财政部长贝森特和贸易代表格里尔与中国国务院副总理何立峰视频会谈，要求中国\"全面、立即\"落实釜山贸易协议的承诺，何立峰则对美方近期的贸易限制表达\"严正关切\"。与此同时，中方首次证实正就中美俄三国元首会晤保持沟通。分析人士认为，三方能否会面，关键在于议程：特朗普想谈核军控，北京则拒绝被拉进美俄核谈判。", "summary_zh": "深圳APEC会议召开前不到两周，美国财政部长贝森特和贸易代表格里尔与中国国务院副总理何立峰视频会谈，要求中国\"全面、立即\"落实釜山贸易协议的承诺，何立峰则对美方近期的贸易限制表达\"严正关切\"。与此同时，中方首次证实正就中美俄三国元首会晤保持沟通。分析人士认为，三方能否会面，关键在于议程：特朗普想谈核军控，北京则拒绝被拉进美俄核谈判。", "body_orig": "", "body_zh": "（德国之声中文网）美国财政部长贝森特（Scott Bessent）和贸易代表格里尔（Jamieson Greer）周五（11月6日）与中国国务院副总理何立峰举行视频会谈，要求中国\"全面、立即\"落实2025年釜山贸易协议中的承诺。美国贸易代表办公室在声明中说，格里尔强调，中国必须采取具体行动，特别是在农产品采购、稀土和其他关键矿产方面。\n\n2025年，特朗普与习近平在韩国釜山APEC峰会期间达成贸易协议。按照协议，美国对中国商品加征的关税被限定在约20%，中国承诺采购美国大豆，并暂停实施新的稀土出口管制。特朗普政府此前曾抱怨北京没有履行稀土供应方面的承诺。今年9月习近平访美期间，双方把这项原本为期一年的协议延长至明年1月10日。\n\n据新华社报道，双方在通话中围绕落实中美元首北京和华盛顿会晤重要共识以及经贸磋商成果，就彼此关心的重要经贸问题进行了\"坦诚、深入、建设性的交流\"。中方就近期美方对华经贸限制措施表达了\"严正关切\"，但通稿没有具体说明是哪些措施。贝森特会后在X上表示，特朗普政府将继续推行有利于美国工人、农民和企业的政策。\n\n另一个焦点是中美俄三方元首会晤。中国外交部发言人毛宁周三（11月4日）首次证实，中国正就中美俄元首会晤与相关方保持沟通。\n\n彭博社认为，这一表态出现在深圳会议前两周，说明北京准备做东。而就在10月中旬，毛宁被问及此事时，还连续两天表示\"没有可以提供的信息\"。\n\n据《华尔街日报》的报道，三方会晤的提议出自普京，他在10月9日与特朗普通电话时提出了这一形式。据英国《金融时报》的报道，美俄两国都在游说北京，但北京尚未拍板。\n\n《南华早报》报道援引多位学者的话指出，议程是三方会晤能否成行的关键。中国方面的学者认为，北京愿意讨论大国关系风险、全球经济复苏、粮食和能源安全、气候变化等议题，但会拒绝\"选边站\"，也拒绝\"把中国强行拉进美俄核军控谈判\"等\"不公平的提议\"。\n\n据《金融时报》报道，特朗普希望三方聚焦核军控，而中国一直以本国核武库规模远小于美俄为由，拒绝参加三方军控谈判。\n\n另据报道，上周结束对华访问后，德国总统施泰因迈尔接受了德国电视一台（ARD）采访表示，习近平提到了即将在中国深圳举行的亚太经合组织（APEC）峰会，但认为目前根本没有筹备任何由美国、俄罗斯和中国三方参与的乌克兰问题峰会。\n\n美国智库昆西研究所的西蒙（Denis Simon）认为，三国有\"重叠的利益\"，却没有\"共同的战略愿景\"：特朗普想展示自己能绕开传统盟友、直接与另外两大国打交道；普京光是坐上谈判桌就是一场外交胜利；习近平则可能最为谨慎，因为他担心卷入一种以牺牲中国利益为代价、承认美俄势力范围的安排。", "body": "（德国之声中文网）美国财政部长贝森特（Scott Bessent）和贸易代表格里尔（Jamieson Greer）周五（11月6日）与中国国务院副总理何立峰举行视频会谈，要求中国\"全面、立即\"落实2025年釜山贸易协议中的承诺。美国贸易代表办公室在声明中说，格里尔强调，中国必须采取具体行动，特别是在农产品采购、稀土和其他关键矿产方面。\n\n2025年，特朗普与习近平在韩国釜山APEC峰会期间达成贸易协议。按照协议，美国对中国商品加征的关税被限定在约20%，中国承诺采购美国大豆，并暂停实施新的稀土出口管制。特朗普政府此前曾抱怨北京没有履行稀土供应方面的承诺。今年9月习近平访美期间，双方把这项原本为期一年的协议延长至明年1月10日。\n\n据新华社报道，双方在通话中围绕落实中美元首北京和华盛顿会晤重要共识以及经贸磋商成果，就彼此关心的重要经贸问题进行了\"坦诚、深入、建设性的交流\"。中方就近期美方对华经贸限制措施表达了\"严正关切\"，但通稿没有具体说明是哪些措施。贝森特会后在X上表示，特朗普政府将继续推行有利于美国工人、农民和企业的政策。\n\n另一个焦点是中美俄三方元首会晤。中国外交部发言人毛宁周三（11月4日）首次证实，中国正就中美俄元首会晤与相关方保持沟通。\n\n彭博社认为，这一表态出现在深圳会议前两周，说明北京准备做东。而就在10月中旬，毛宁被问及此事时，还连续两天表示\"没有可以提供的信息\"。\n\n据《华尔街日报》的报道，三方会晤的提议出自普京，他在10月9日与特朗普通电话时提出了这一形式。据英国《金融时报》的报道，美俄两国都在游说北京，但北京尚未拍板。\n\n《南华早报》报道援引多位学者的话指出，议程是三方会晤能否成行的关键。中国方面的学者认为，北京愿意讨论大国关系风险、全球经济复苏、粮食和能源安全、气候变化等议题，但会拒绝\"选边站\"，也拒绝\"把中国强行拉进美俄核军控谈判\"等\"不公平的提议\"。\n\n据《金融时报》报道，特朗普希望三方聚焦核军控，而中国一直以本国核武库规模远小于美俄为由，拒绝参加三方军控谈判。\n\n另据报道，上周结束对华访问后，德国总统施泰因迈尔接受了德国电视一台（ARD）采访表示，习近平提到了即将在中国深圳举行的亚太经合组织（APEC）峰会，但认为目前根本没有筹备任何由美国、俄罗斯和中国三方参与的乌克兰问题峰会。\n\n美国智库昆西研究所的西蒙（Denis Simon）认为，三国有\"重叠的利益\"，却没有\"共同的战略愿景\"：特朗普想展示自己能绕开传统盟友、直接与另外两大国打交道；普京光是坐上谈判桌就是一场外交胜利；习近平则可能最为谨慎，因为他担心卷入一种以牺牲中国利益为代价、承认美俄势力范围的安排。", "link": "https://www.dw.com/zh/深圳apec前夕-美国催中国兑现稀土承诺/a-79884476?maca=chi-rss-chi-all-1127-xml-mrss", "time": "11月07日 19:18", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "长平观察：西方背弃黄之锋，也在背弃自己", "title_zh": "长平观察：西方背弃黄之锋，也在背弃自己", "summary_orig": "香港民主运动人士黄之锋以“串谋勾结外国势力”罪再被判刑10年。时事评论作家长平指出，从六四后老布什密使北京，到今天对黄之锋的沉默，西方一再背弃自由斗士，必将为自己的迟钝、懦弱和堕落付出代价。", "summary_zh": "香港民主运动人士黄之锋以“串谋勾结外国势力”罪再被判刑10年。时事评论作家长平指出，从六四后老布什密使北京，到今天对黄之锋的沉默，西方一再背弃自由斗士，必将为自己的迟钝、懦弱和堕落付出代价。", "body_orig": "", "body_zh": "（德国之声中文网）1989年11月，柏林墙倒塌了。假如不是东德人获得了西德人的自由，而是相反，东德共产专制政权控制了西德，并在西德实施\"国安法\"，把任何敢于批评东德政府、呼吁恢复西德自由的人都抓起来重判入狱，世界将会怎样？\n\n2019年9月，柏林墙倒塌三十周年前夕，香港反抗运动的领袖之一黄之锋访问柏林。他在演讲中警示：\"如果现在是新冷战时期的话，那么香港就是新的柏林。\"令人痛心的是，柏林人正忙于庆祝\"历史的胜利\"，回避现实的困难，眼看着\"新的柏林\"香港沦陷，中共专制政权肆意侵蚀自由世界。\n\n周四（11月5日）黄之锋被控“串谋勾结外国势力危害国家安全罪”而再被判处10年监禁。已被关押近6年的他原本预计明年1月出狱，如今要坐到2036年年底。据港媒报道，主审法官谭耀豪指黄之锋\"罪行重大\"，称\"案发时香港正受社会动荡的严重影响\"，\"被告与罗冠聪等人串谋，持续接触外国官员或机构，呼吁制裁中国及香港官员\"。\n\n仅仅呼吁制裁正在作恶的中国及香港官员，就被判十年监禁。如此残忍的判决，正好印证了黄之锋当年呼吁的急迫性，以及被西方所忽略的后果：未能受到制裁的专制政权，将会多么疯狂地仇视人权和自由。\n\n德国《世界报》（DIE WELT）发表评论《他在捍卫西方，而西方却正在变得迟钝、怯懦和堕落》，作者波沙特（Ulf Poschardt）深刻地指出，黄之锋捍卫的是西方的价值观，那就是自由。黄之锋提醒人们，这个时代真正的冲突在哪里。那就是自由：个人的自由，以及挺身对抗威权体制和独裁政权的勇气。\n\n然而，西方自身却面临日渐迟钝、懦弱和堕落的风险：为细枝末节的小事争执不休，面对原则问题却沉默不语。\n\n波沙特批评说：\"西方正在抛弃自由斗士。乌克兰是一个典型例子，委内瑞拉、土耳其、伊朗也是如此，中国更是如此。\"他认为，无论在哪个领域，中国都不可能成为西方的伙伴；无论是个人自由和人权标准，还是民主宪政，中国都是西方的敌人。\n\n没错，西方背弃了黄之锋，也在背弃自己的信念。我还想进一步指出，西方已经为这种背弃付出代价，还将继续付出代价。东德越过柏林墙、吞并西德自由世界的历史荒诞剧，正在上演。\n\n西方背弃自由斗士并非始于今日。六四屠杀之后，中共没有受到应有的惩罚，就是其中一桩奇耻大辱。1989年，中国的学生用鲜血和生命推开了新世界的大门；随后，勇敢的东欧人继续抗争，直到柏林墙倒塌。急于欢庆胜利的西方人宣告冷战结束，却把大门轰然关上，假装世界大同。\n\n屠杀发生后的第二天，1989年6月5日，时任美国总统老布什（George H.W. Bush）在记者会上说，现在\"不是感情用事（emotional response）的时候\"，而要\"理智而谨慎地行动（reasoned, careful action）\"，既考虑美国的\"长远利益（long-term interests）\"，也要\"认识到中国复杂的国内形势（recognition of a complex internal situation in China）\"。\n\n随后，他背弃了中国成千上万的自由斗士，急于与邓小平恢复联系。邓小平不接他的电话，他便亲笔写信；邓小平回信同意接待密使后，7月初，他派国家安全顾问斯考克罗夫特（Brent Scowcroft）和副国务卿伊格尔伯格（Lawrence Eagleburger）秘密前往北京，直接与邓小平会面。\n\n我曾多次在文章中追问：三十多年过去了，老布什口中美国的\"长远利益\"在哪里？是养虎为患，让中共强大到剥夺香港的自由、威胁西方的自由吗？是让西方政客在中共面前战战兢兢，甚至不敢提及\"人权\"二字吗？是让西方企业家到中国点头哈腰，被迫分享关键技术吗？\n\n今天，西方背弃了黄之锋。我们还要再等三十年，才知道\"迟钝、懦弱和堕落\"的西方将受到什么样的惩罚吗？\n\n长平是资深媒体人、时事评论作家。他目前是德国之声专栏作家、中国数字时代执行主编以及六四记忆 · 人权博物馆总策展人。\n\n德国之声致力于为您提供客观中立的新闻报导，以及展现多种角度的评论分析。文中评论及分析仅代表作者或专家个人立场。\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "body": "（德国之声中文网）1989年11月，柏林墙倒塌了。假如不是东德人获得了西德人的自由，而是相反，东德共产专制政权控制了西德，并在西德实施\"国 {"title_orig": "“天宫”将迎来首位外籍宇航员", "title_zh": "“天宫”将迎来首位外籍宇航员", "summary_orig": "中国空间站即将迎来首位外国访客！据中国官媒报道，一名巴基斯坦宇航员将搭乘“神舟二十四号” 飞船进入中国空间站。任务成行后，他将成为首位进入中国空间站的外国公民。", "summary_zh": "中国空间站即将迎来首位外国访客！据中国官媒报道，一名巴基斯坦宇航员将搭乘“神舟二十四号” 飞船进入中国空间站。任务成行后，他将成为首位进入中国空间站的外国公民。", "body_orig": "", "body_zh": "（德国之声中文网）据中国官媒周六（11月7日）报道，一名巴基斯坦宇航员将加入中国“神舟二十四号” 载人飞行任务的乘组。他是一位巴基斯坦载荷专家。\n\n任务成行后，他将成为首位进入中国空间站的外国公民。这也将是中国载人航天工程历史上，首次由中国与外国宇航员共同执行太空飞行任务。\n\n中国载人航天工程办公室表示，这名巴基斯坦宇航员将完成一次短期在轨飞行，随后搭乘“神舟二十三号”飞船返回地球。\n\n中方报道未明确“神舟二十四号”的具体发射日期，也尚未公布这名巴基斯坦宇航员的具体身份。不过，今年早些时候，中国官媒曾报道，两名巴基斯坦预备宇航员——穆罕默德·泽尚·阿里（Muhammad Zeeshan Ali）和胡拉姆·达乌德（Khurram Daud），已经在北京开始与中国宇航员共同接受训练。按照计划，两人在中国完成各项训练并通过考核后，“其中1人将执行载人飞行任务，1人作为任务备份航天员”。\n\n此次飞行任务是中国与巴基斯坦于2025年2月签署的《关于选拔、训练巴基斯坦航天员并参与中国空间站飞行任务的合作协议》的内容之一。\n\n路透社报道指出，这是中巴两国在“一带一路”倡议框架下开展双边合作的一部分，也是中国开展“航天外交”的重要体现，被视为中国通过航天合作加强国际关系的举措。\n\n德新社的报道指出，中国目前正致力于在2030年前实现首次载人登月。美国被视为中国在航天领域的主要竞争对手，美国国家航空航天局计划2028年再次将宇航员送上月球。\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "body": "（德国之声中文网）据中国官媒周六（11月7日）报道，一名巴基斯坦宇航员将加入中国“神舟二十四号” 载人飞行任务的乘组。他是一位巴基斯坦载荷专家。\n\n任务成行后，他将成为首位进入中国空间站的外国公民。这也将是中国载人航天工程历史上，首次由中国与外国宇航员共同执行太空飞行任务。\n\n中国载人航天工程办公室表示，这名巴基斯坦宇航员将完成一次短期在轨飞行，随后搭乘“神舟二十三号”飞船返回地球。\n\n中方报道未明确“神舟二十四号”的具体发射日期，也尚未公布这名巴基斯坦宇航员的具体身份。不过，今年早些时候，中国官媒曾报道，两名巴基斯坦预备宇航员——穆罕默德·泽尚·阿里（Muhammad Zeeshan Ali）和胡拉姆·达乌德（Khurram Daud），已经在北京开始与中国宇航员共同接受训练。按照计划，两人在中国完成各项训练并通过考核后，“其中1人将执行载人飞行任务，1人作为任务备份航天员”。\n\n此次飞行任务是中国与巴基斯坦于2025年2月签署的《关于选拔、训练巴基斯坦航天员并参与中国空间站飞行任务的合作协议》的内容之一。\n\n路透社报道指出，这是中巴两国在“一带一路”倡议框架下开展双边合作的一部分，也是中国开展“航天外交”的重要体现，被视为中国通过航天合作加强国际关系的举措。\n\n德新社的报道指出，中国目前正致力于在2030年前实现首次载人登月。美国被视为中国在航天领域的主要竞争对手，美国国家航空航天局计划2028年再次将宇航员送上月球。\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "link": "https://www.dw.com/zh/天宫-将迎来首位外籍宇航员/a-79883779?maca=chi-rss-chi-all-1127-xml-mrss", "time": "11月07日 17:06", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "意大利侦结对“李老师不是你老师”跨境监视威胁案", "title_zh": "意大利侦结对“李老师不是你老师”跨境监视威胁案", "summary_orig": "米兰检察官已结束对居住在意大利的异议人士“李老师不是你老师”遭跨境跟踪、监视及威胁案件的调查，并准备申请将案件移送审判。共有10人被列为该案的犯罪嫌疑人。", "summary_zh": "米兰检察官已结束对居住在意大利的异议人士“李老师不是你老师”遭跨境跟踪、监视及威胁案件的调查，并准备申请将案件移送审判。共有10人被列为该案的犯罪嫌疑人。", "body_orig": "", "body_zh": "（德国之声中文网）此案的核心人物是网名“李老师不是你老师”的博主、自2015年起便居住在意大利的艺术家李颖。他在X平台帐号“李老师不是你老师”@whyyoutouzhele拥有220万粉丝。该账号因在2022年底中国爆发反对“清零政策”的“白纸运动”期间，转发海量来自中国民众的抗议实时图文与视频而备受关注。在这之后，该账号也经常发布由中国国内民众发送给他的视频、照片和文字叙述，内容多涉及抗议活动及其他在中国受到严格管控、或完全不予报道的政治敏感事件。\n\n根据路透社看到的案卷，米兰检察官于10月23日通知10名嫌疑人（包括8名中国公民和2名意大利公民）调查已经结束，并给予他们在可能进入审判程序前做出回应的最后机会。该文件揭示了意大利检察官所称的这场“针对海外中国政府批评者进行监控和恐吓的协同行动”。\n\n李颖对于此次调查表示欢迎。他在给路透社的一份声明中表示，由于他致力于分享关于中国普通民众的“真实故事”，他本人、家人以及关注者多年来一直遭受着“持续不断的骚扰和威胁”。 “因此，我很高兴看到此案取得进展，也非常感谢调查人员。”\n\n2024年10月，在意大利都灵，李颖通过自家门上的猫眼，拍到一名男子在他住所旁的墙上喷涂了“stupro”（意大利语，意为“强奸”）一词。检察官随后据此展开了调查。\n\n调查人员称，他们发现了一场有系统的监视行动：嫌疑人多次前往李颖被认为居住的地点，拍摄入口照片，在附近的咖啡馆监视相关建筑，翻找垃圾桶，向居民打探信息，并追踪李颖的行踪。\n\n检察官表示，其中一名嫌疑人在秘密监视行动中收集了超过4000张照片和35段视频。案卷还显示，李颖通过社交媒体和电子邮件收到了死亡威胁，其中包括“我要砍下你的头”、“我们要惩罚你”等信息，并附有突击步枪、手枪和刺刀的图片。\n\n两名为首的嫌犯被指控代表中国警方行事，同时与中国外交官及统战部成员保持联系。这两人连同另外两人，被指控参与了一个犯罪团伙，其目的是“阻挠“中国异见人士行使言论自由的权利”——根据意大利法律，这一罪名最高可判处七年监禁。\n\n案卷显示，以上四名涉嫌组织者中的一人招募了中国公民去跟踪李颖，而另一名嫌疑人则出价每天100欧元，雇人协助锁定李颖的行踪。李颖的个人信息被发布在网上，其身在中国的亲友也受到了压力。李颖深感自身安全受到威胁，被迫不断更换住所，在米兰和都灵之间辗转，试图躲避追踪。\n\n10月31日，李颖出席了《纽约时报》记者袁莉在日本东京举办的“不明白节”，这是他首次公开露面。他在访谈中谈到自己选择站出来露面的原因、遭遇跨境镇压而逃亡的经历、以及通过运营账号所窥见的中国社会百态。\n\n“李老师不是你老师”遭跨境镇压案反映出意大利正日益加强对“中国监控并施压批评者”行为的审查。意大利警方2月份表示，源自中国的网络攻击曾针对意大利内政部，旨在搜寻中国异见人士，并查明负责调查中国犯罪团伙的警务人员身份。中国外交部当时回应称，北京坚决反对黑客攻击，并驳斥了有关此事的“虚假信息”。\n\n一个月后，意大利媒体报道称，罗马方面已下令驱逐八名中国公民，这些人被怀疑受中国政府指使，对异见人士进行监视。意大利内政部当时拒绝置评。\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "body": "（德国之声中文网）此案的核心人物是网名“李老师不是你老师”的博主、自2015年起便居住在意大利的艺术家李颖。他在X平台帐号“李老师不是你老师”@whyyoutouzhele拥有220万粉丝。该账号因在2022年底中国爆发反对“清零政策”的“白纸运动”期间，转发海量来自中国民众的抗议实时图文与视频而备受关注。在这之后，该账号也经常发布由中国国内民众发送给他的视频、照片和文字叙述，内容多涉及抗议活动及其他在中国受到严格管控、或完全不予报道的政治敏 被判重刑，刑期又增加了十年。但这一次，西方世界却表现出了异乎寻常的沉默，就连左翼职业活动家们也没有高调地给中国当局发出抗议信。\n\n而黄之锋和我们并没有什么区别：他也想像我们一样自由地生活。他要捍卫西方，而西方却面临着日渐怯弱和堕落的风险：为旁支末节的小事争执不休，面对原则问题却沉默不语。黄之锋再度提醒我们，当今世界争执的焦点究竟是什么：自由、个人的自由以及反抗专制和独裁的勇气。”\n\n《世界报》的评论指出，黄之锋曾同另一位香港民主派人士邝颂晴为《世界报》撰写专栏文章，向德国读者介绍香港的局势。黄之锋被捕后，邝颂晴曾在一篇文章中写道：争取香港自由的斗争正变得越来越危险，而西方却任由中国为所欲为：\n\n“为自由而战的人们正在被西方所抛弃，乌克兰局势最具有代表性，委内瑞拉、土耳其、伊朗、尤其是中国也同样如此。无论在任何领域，中国都不可能成为西方的伙伴。无论是个人自由和人权标准，还是民主宪政的层面上，中国都是西方的敌人。\n\n我们能从中得到的唯一教训就是，在经济、外交和国防层面上，西方必须变得更加强大，文化层面上也同样如此。像黄之锋这样的人，对西方自由往往有着更加深刻的理解，远远胜过西方体制内那些安于现状、衣食无忧、而又思想懒惰的大多数人。\n\n当年黄之锋接受我采访时曾说过这样的话：‘如果我们的政治家不愿为我们的未来付出努力，那我就必须站在最前线，为自己的未来而奋斗。’黄之锋的事例清楚地表明，公民的身份早已不再取决于社会地位，而是取决于他为获取更多自由而奋斗的意愿，以及他是否愿意为制止社会各层面上自由的丧失而付出努力。这也正是当前德国社会所需要的。\n\n对于美国中期选举的结果，德国《明镜周刊》发表评论写道，民主党确实取得了胜利，但不应忘记特朗普的执政期还有八百多天，这位现年八十岁的总统仍有能力让世界与他同归于尽：\n\n“那怎么办呢？我们欧洲人应为特朗普统治的晚期准备好求生手册。如果一厢情愿地认为，最糟糕的时期已经成为过去，显然是一种不负责任的态度。当今世界的流氓们会发现特朗普已经变成‘跛脚鸭’，会认为放手一搏的机会到了，而首当其冲的就是普京。欧洲，尤其是德国，必须要义正词严地告诫这位俄罗斯当权者，乌克兰仍将获得该国自卫所需的一切。\n\n普京最擅长读懂权力的语言。只要普京意识到，特朗普的影响力正在逐渐消失，他主动邀请欧洲人重返谈判桌的意愿就会骤然上升。过去多年以来，欧洲人实际上被排除在谈判席之外。由此看来，特朗普在中期选举中的失败，或许也能为外交努力创造机会。\n\n中国的情形也大同小异，或许习近平主席会得出这样的结论：现在正是吞并台湾的最佳历史窗口。一方面，伊朗战争已经削弱了美国的军事实力。另一方面，特朗普又对习近平这类独裁者表现出了异乎寻常的偏爱。有鉴于此，欧洲必须尽快向北京表明立场：武装侵台需要付出惨痛的代价，欧盟将会大幅限制对华经贸关系。同美国不同的是，欧洲无法以军事手段威慑中国。但我们却有能力让中国经济陷入危机。仅去年一年，中国对欧出口额就高达5590亿欧元。”\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "body": "（德国之声中文网）《世界报》评论写道，中国当局再度判处香港民主派人士黄之锋十年监禁。而这一肆意专横的判决说明了一个问题：当今世界的各类冲突都同争取自由的斗争密切相关。这篇题为《他在捍卫西方，西方却在走向怯弱和堕落》的评论写道:\n\n“2024年11月，黄之锋在香港被判处四年半监禁。这一判决无疑是法治的丑闻。它显示出，中国专制政权是多么的腐朽，也显示出，那些及时指出对华依赖危害性的人，又是多么有先见之明。同时，这一判决也在提醒我们，只有提升经济实力和完善市场框架，我们才能摆脱这样的依赖。\n\n现如今，黄之锋又一次被判重刑，刑期又增加了十年。但这一次，西方世界却表现出了异乎寻常的沉默，就连左翼职业活动家们也没有高调地给中国当局发出抗议信。\n\n而黄之锋和我们并没有什么区别：他也想像我们一样自由地生活。他要捍卫西方，而西方却面临着日渐怯弱和堕落的风险：为旁支末节的小事争执不休，面对原则问题却沉默不语。黄之锋再度提醒我们，当今世界争执的焦点究竟是什么：自由、个人的自由以及反抗专制和独裁的勇气。”\n\n《世界报》的评论指出，黄之锋曾同另一位香港民主派人士邝颂晴为《世界报》撰写专栏文章，向德国读者介绍香港的局势。黄之锋被捕后，邝颂晴曾在一篇文章中写道：争取香港自由的斗争正变得越来越危险，而西方却任由中国为所欲为：\n\n“为自由而战的人们正在被西方所抛弃，乌克兰局势最具有代表性，委内瑞拉、
