tle_zh": "内塔尼亚胡时代的终结？以色列反对党获委任组阁", "summary_orig": "以色列总统赫尔佐格11月7日晚间宣布，已经委任现反对党领导人艾森科特去组建新一届内阁，后者将有28天的时间去组建联合政府。如果这一中间派政党领袖成为新总理，将意味着右翼连续20年执政的终结。", "summary_zh": "以色列总统赫尔佐格11月7日晚间宣布，已经委任现反对党领导人艾森科特去组建新一届内阁，后者将有28天的时间去组建联合政府。如果这一中间派政党领袖成为新总理，将意味着右翼连续20年执政的终结。", "body_orig": "", "body_zh": "（德国之声中文网）根据赫尔佐格总统(Isaac Herzog)办公室发布的消息，当前在野的中间派政党“亚沙尔”(Yashar)领袖艾森科特(Gadi Eisenkot)获邀在11月8日下午前往耶路撒冷总统官邸。此前，总统与大选后的新一届议会各派别进行了磋商，代表120个议席中67席的多个政党均建议由艾森科特领衔组建新政府。\n\n组建政府预计将极其困难且复杂。在10月27日举行的议会大选中，无论是现任总理内塔尼亚胡(Benjamin Netanyahu)的执政联盟，还是艾森科特所在的反对派阵营，均未能获得组阁所需的过半席位（61席）。\n\n艾森科特曾经是以色列国防军总参谋长。他所代表的“反内塔尼亚胡”阵营尽管持中间派政治立场，但是近期却出现了潜在的拉拢宗教极端正统派(Ultra-Orthodox)的迹象。后者曾经是现总理内塔尼亚胡的执政盟友。中间派与宗教极端正统派能够联手达到执政所需的过半议席，但是宗教极端正统派学生是否具有服兵役义务将是双方的重大摩擦点。\n\n艾森科特的阵营此前一直拒绝和阿拉伯政党合作。不过，在磋商期间，后者依然有几名政治人物表达了对艾森科特的支持。这两个阵营合作同样能达到过半议席。\n\n不久前，现总理内塔尼亚胡曾录制视频，呼吁反对党组建一个“民族团结政府”，但并未明确究竟应由谁来领导这样一个联合政府。内塔尼亚胡在视频中还警告反对党切勿组建一个依靠两个阿拉伯政党支持的内阁，认为这会让以色列“从内部被摧毁”。\n\n艾森科特则在社媒平台X（推特）上发帖，驳斥内塔尼亚胡的言论是“廉价的公关秀”。艾森科特认为，正是内塔尼亚胡本人分裂了以色列社会、播下了不和的种子；如今，当他意识到自己的执政时日无多时，却又开始大谈“团结”了。艾森科特还补充说，内塔尼亚胡从未履行过他与政治伙伴签署的任何协议；如果内塔尼亚胡领导的利库德集团及其盟友真的对“团结”和组建具有广泛基础的政府感兴趣，那么他们大可公开宣布与极端分子断绝联盟，并表明愿意加入由艾森科特领导的新政府。\n\n现年66岁的艾森科特现在有28天的时间来组建联合政府，并可选择申请14天的延长期。如果此次尝试失败，总统将委任另一位议员组阁，期限同样为28天。\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "body": "（德国之声中文网）根据赫尔佐格总统(Isaac Herzog)办公室发布的消息，当前在野的中间派政党“亚沙尔”(Yashar)领袖艾森科特(Gadi Eisenkot)获邀在11月8日下午前往耶路撒冷总统官邸。此前，总统与大选后的新一届议会各派别进行了磋商，代表120个议席中67席的多个政党均建议由艾森科特领衔组建新政府。\n\n组建政府预计将极其困难且复杂。在10月27日举行的议会大选中，无论是现任总理内塔尼亚胡(Benjamin Netanyahu)的执政联盟，还是艾森科特所在的反对派阵营，均未能获得组阁所需的过半席位（61席）。\n\n艾森科特曾经是以色列国防军总参谋长。他所代表的“反内塔尼亚胡”阵营尽管持中间派政治立场，但是近期却出现了潜在的拉拢宗教极端正统派(Ultra-Orthodox)的迹象。后者曾经是现总理内塔尼亚胡的执政盟友。中间派与宗教极端正统派能够联手达到执政所需的过半议席，但是宗教极端正统派学生是否具有服兵役义务将是双方的重大摩擦点。\n\n艾森科特的阵营此前一直拒绝和阿拉伯政党合作。不过，在磋商期间，后者依然有几名政治人物表达了对艾森科特的支持。这两个阵营合作同样能达到过半议席。\n\n不久前，现总理内塔尼亚胡曾录制视频，呼吁反对党组建一个“民族团结政府”，但并未明确究竟应由谁来领导这样一个联合政府。内塔尼亚胡在视频中还警告反对党切勿组建一个依靠两个阿拉伯政党支持的内阁，认为这会让以色列“从内部被摧毁”。\n\n艾森科特则在社媒平台X（推特）上发帖，驳斥内塔尼亚胡的言论是“廉价的公关秀”。艾森科特认为，正是内塔尼亚胡本人分裂了以色列社会、播下了不和的种子；如今，当他意识到自己的执政时日无多时，却又开始大谈“团结”了。艾森科特还补充说，内塔尼亚胡从未履行过他与政治伙伴签署的任何协议；如果内塔尼亚胡领导的利库德集团及其盟友真的对“团结”和组建具有广泛基础的政府感兴趣，那么他们大可公开宣布与极端分子断绝联盟，并表明愿意加入由艾森科特领导的新政府。\n\n现年66岁的艾森科特现在有28天的时间来组建联合政府，并可选择申请14天的延长期。如果此次尝试失败，总统将委任另一位议员组阁，期限同样为28天。\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "link": "https://www.dw.com/zh/内塔尼亚胡时代的终结？以色列反对党获委任组阁/a-79889923?maca=chi-rss-chi-all-1127-xml-mrss", "time": "11月08日 19:12", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "克拉科夫发生枪击惨案 波兰举行全国哀悼", "title_zh": "克拉科夫发生枪击惨案 波兰举行全国哀悼", "summary_orig": "周六下午，一名男子在波兰旅游城市克拉科夫市中心开枪扫射，造成六人丧生，多人受伤。疑凶的作案动机目前尚不明了，波兰总统已下令全国哀悼。", "summary_zh": "周六下午，一名男子在波兰旅游城市克拉科夫市中心开枪扫射，造成六人丧生，多人受伤。疑凶的作案动机目前尚不明了，波兰总统已下令全国哀悼。", "body_orig": "", "body_zh": "（德国之声中文网）周六当地时间下午三点，一名男子驾车来到克拉科夫市中心，并从行驶的车辆中向人群开枪。从目前掌握的线索来看，袭击行动似乎并没有明确目标，而是随机进行的。波兰警方表示，嫌疑人使用的可能是一支军用步枪。 中央集市广场是克拉科夫的心脏地带。袭击行动发生时，广场上聚集了大量当地居民和游客。目击者拍摄的视频上短时间内连续多次枪声，总共21声。\n\n此次枪击案中，共有15人受伤，6人丧生。波兰警察总长博隆（ Marek Boron）表示，死者中包括三名波兰人和一名英国公民，另外两名死者的身份尚未查清。伤者当中也包括5名外国人。\n\n波兰警方还表示，这名男子试图逃离市中心时，遭警方拦截，并同警方发生枪战。凶嫌本人被击中后遭逮捕，两名警员则身负重伤。\n\n凶嫌被逮捕后，警方逐步通报了更多案情细节。据称，这名男子生于2002年，波兰公民，居住在波兰南部一小城内。警方表示，此人是一名射击运动员。\n\n警方发言人表示：“这名男子拥有持枪证，他的家人也同样拥有持枪证。”波兰内政部长凯尔文斯基（Marcin Kierwiński）还透露，警方还在“嫌疑人的车辆内发现了更多的枪支和子弹”“种种迹象显示，此人是极右思想的狂热追随者。”不过，调查人员仍需对相关线索进行进一步的核查。\n\n克尔考夫枪击案发生当晚，波兰一支反恐小分队搜查了嫌疑人的住家，并在室内发现了三具尸体。波兰总理图斯克已经向媒体证实了上述消息：“死者当中有两名女性，和一名男子。他们极可能是疑凶的家庭成员。”据称，三名死者有可能是疑凶的父母及妹妹。\n\n当地居民在社媒中发布了一系列来自市中心的影像资料。画面中可以看到，市中心集市广场上仍有大量警车，大片区域已被警方封锁。市中心玛丽亚教堂钟楼每隔一小时都会响起的传统小号曲Hejnal的音乐声中，时而也伴随着刺耳的警笛声。\n\n一名路人对波兰电视台表示：“发生这样的事件，让我非常悲伤。这里以前从来没有发生过这样的事情。”过去几年以来，波兰从未发生过如此严重的袭击事件。\n\n目前，波兰政治局势异常紧张。本周三，11月11日是波兰重要节日-独立日。然而，袭击案件已经让整个波兰陷入了巨大的悲痛之中。波兰总统纳夫罗茨基（Karol Nawrocki）已下令，今明两天举行全国哀悼。\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "body": "（德国之声中文网）周六当地时间下午三点，一名男子驾车来到克拉科夫市中心，并 他和团队平时居住在布拉格，只在处理\"国家事务\"时才奔赴这片土地——尽管他本人多次被克罗地亚当局阻止入境，甚至曾遭逮捕，并被禁止入境克罗地亚长达五年。\n\n利伯兰奉行彻底的自由意志主义（Libertarianism）：无强制税收，社区贡献完全自愿，政府管理全面数字化。但杰德利卡的政治构想远不止于此。在他的设想中，一个人为社会创造的财富越多，就应当拥有越大的政治话语权。\n\n他说：\"为什么一个对国家财政贡献了2000万美元的人，其话语权竟然跟一个把银行烧了、造成同等损失的人完全一样？民主制度会把整个社会的意见平均化。每一个明智的决定，可能都会被另一个愚蠢的决定抵消。我们只想要一块七平方公里、能够自治的土地，来证明我们的理念。\"\n\n这种\"能者多权\"的逻辑，在传统政治语境下颇具争议，但在自由意志主义者和加密货币圈子里引发了强烈共鸣。\n\n2024年10月，加密货币富豪孙宇晨当选利伯兰\"总理\"，利伯兰方面称他为\"全球最富有的总理\"。孙宇晨是波场（TRON）区块链的创始人，曾以450万美元拍得与巴菲特共进午餐的机会。他的加入，让利伯兰在加密货币社群中的曝光度大幅提升。此后，利伯兰宣布与太空初创公司 LifeShip 合作，将自己的\"国旗\"送上了小行星。\n\n然而回到多瑙河边，现实截然不同。目前整片土地上唯一的永久建筑，只有两座树屋。记者进入时遭到克罗地亚当局严密盘查，拍摄被明令禁止。利伯兰宣称已有约1300名\"公民\"，申请方式有两种：支付1万美元，或通过志愿服务换取资格。\n\n来自意大利的安东内拉是一名软件公司项目经理。税负过重、规定繁琐——她越来越觉得自己被困住了。\"你真的会产生一种错觉，好像这些东西是属于你的，但实际上，你什么都做不了主。\"她已申请利伯兰公民身份。两天后，她花了数千欧元，拿到了那本利伯兰护照——印刷精美，却几乎毫无实际用处：没有任何真正的国家承认这本证件。\n\n英国退休男性科林·伍德（Colin Wood）已在距利伯兰约10公里的塞尔维亚私人营地\"方舟村\"（Ark Village）居住两年。他骄傲地展示自己的利伯兰护照，并相信克罗地亚当局终将无力阻拦：\"克罗地亚警方到底还能负担多少警力，来阻止我们进入呢？\"\n\n每年，利伯兰支持者都会在方舟村举办\"Liberpulco\"年度聚会。来者背景极为多元——嬉皮士、科技创业者、加密货币投资人，甚至还有阴谋论者。知名阴谋论者加雷斯·艾克（Gareth Icke）在此受到明星般的追捧。大多数与会者不愿接受媒体采访，担心自己的话被断章取义。\n\n英国研究员瓦西姆·阿尔辛迪（Waseem Al-Sindi）长期研究区块链与加密货币生态。他说：\"他们觉得自己的自由或主权正在被侵蚀——税太高，或者某些领域受到过度监管。很多时候，这些人是创业者，他们寻找的是一种监管套利空间。\"\n\n但阿尔辛迪也指出，这种对财富与精英话语权的强调，背后隐藏着更值得警惕的逻辑：\"自由意志主义思想的历史与种族科学和优生学之间存在关联——认为并非所有人都是平等的，认为自己比他人更优秀。因此在他们看来，民主制度会导致次优结果，因为多数人的头脑不如少数人。\"\n\n更进一步，他认为部分支持者并非只是在寻找另一种生活方式：\"他们正在有意识地期待并推动现有社会和国家体系的崩溃。而他们的希望，正是建立在这一点之上。\"\n\n杰德利卡计划扩大外交网络、推进基础设施建设，甚至在利伯兰推出证券交易所。前美国国会议员罗恩·保罗和阿根廷总统米莱都曾公开表态支持。他说：\"利伯兰最富有的十个人，财富加起来比克罗地亚最富有的十个人还要多。这不是幻觉，事实就是如此。\"\n\n克罗地亚外交部将利伯兰定性为\"缺乏任何法律依据的挑衅行为\"。一名退休德国人罗兰（Roland）定期在此驻守，营地设施却屡遭破坏——淋浴系统、水箱、热水器相继消失。杰德利卡认为，破坏者正是克罗地亚当局。\n\n十年过去，这里依然更像一处临时营地。支持者们说：\"建立一个国家，不可能一夜之间完成。\"\"如果那么容易，大家早就去做了。\"\"先有梦想，才有现实。\"\n\n这句话，既可以是信念，也可以是自我安慰。至于利伯兰究竟会走向何方——时间，或许是唯一的裁判。\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "body": "（德国之声中文网）多瑙河畔，克罗地亚与塞尔维亚的边境争议地带，一片约7平方公里的无主之地——这里既没有城市，没有道路，甚至没有任何一栋可供长期居住的建筑。然而，它有 成。\"\"如果那么容易，大家早就去做了。\"\"先有梦想，才有现实。\"\n\n这句话，既可以是信念，也可以是自我安慰。至于利伯兰究竟会走向何方——时间，或许是唯一的裁判。\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "link": "https://www.dw.com/zh/利伯兰：币圈富豪的自由乌托邦/a-79840469?maca=chi-rss-chi-all-1127-xml-mrss", "time": "11月08日 16:41", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "柬埔寨打击诈骗园区引发人道危机 大量外籍人员受困街头", "title_zh": "柬埔寨打击诈骗园区引发人道危机 大量外籍人员受困街头", "summary_orig": "在国际压力下，柬埔寨今年加大力度清剿境内网络诈骗园区，释放出数以万计曾在园区工作的外籍人员。然而，美联社调查显示，许多人疑似为人口贩运受害者，却在行动后面临任意拘押、警方骚扰、无处栖身和返乡困难。与此同时，批评人士称，真正支撑诈骗产业的柬埔寨政商精英尚未受到有效追责。", "summary_zh": "在国际压力下，柬埔寨今年加大力度清剿境内网络诈骗园区，释放出数以万计曾在园区工作的外籍人员。然而，美联社调查显示，许多人疑似为人口贩运受害者，却在行动后面临任意拘押、警方骚扰、无处栖身和返乡困难。与此同时，批评人士称，真正支撑诈骗产业的柬埔寨政商精英尚未受到有效追责。", "body_orig": "", "body_zh": "（德国之声中文网）面对日益增长的国际压力，柬埔寨加大了打击力度，关闭了在该国蓬勃发展的诈骗中心。\n\n今年年初，柬埔寨全国范围内的打击犯罪行动全面展开，导致数万名前诈骗人员流落街头，引发了一场人道主义危机。\n\n美联社采访了前诈骗人员、致力于调查人口贩运的非营利组织和其他专家，揭示了柬埔寨打击行动所造成的危机的严重程度。这些前诈骗人员表示，他们遭遇任意拘押、警方骚扰，并因政府禁止为他们提供住房而被迫露宿街头。近一年过去了，仍有数百人滞留当地。\n\n批评人士指出，许多前诈骗人员是人口贩运的受害者，政府应该对他们进行调查，以查明他们在诈骗园区内是否曾遭受虐待。“政府通常将落入诈骗中心的移民视为罪犯，我们没有看到任何证据表明当局作出了充分努力，按照国际公认的人口贩运识别指标对他们进行筛查。”致力于调查人口贩运的非营利组织Eos Collective的李玲（音译）说道。\n\n在柬埔寨，网络诈骗是一个价值数十亿美元的规模产业。据估计，约有10万名从业人员在戒备森严的大型园区内从事网络诈骗，他们住在宿舍里，不被允许离开。有些人明知自己参与的是非法活动，但许多人是被高薪工作的虚假承诺诱骗，并陷入复杂的人口贩运网络。\n\n据追踪诈骗地点的监督机构 CyberScamMonitor收集的数据，柬埔寨至少有182个已确认的诈骗窝点，但该机构掌握的证据显示实际窝点数量约为300个。\n\n2025年末，一名韩国留学生被迫进入诈骗园区后死亡，以及美国起诉一名出生于中国的柬埔寨企业集团创始人（该集团涉嫌大规模加密货币诈骗），使得此类诈骗活动引起了全球关注。\n\n今年9月，柬埔寨宣布已捣毁所有大型诈骗窝点，并正在对与这些诈骗案相关的案件提起诉讼。上个月，柬埔寨表示已从一个涉嫌诈骗网络中查获价值10亿美元的资产，并请求国际刑警组织协助追捕29名团伙头目。\n\n但柬埔寨并未提供任何证据表明，其正在对这些骗局背后的犯罪操盘手，或帮助其发展壮大的柬埔寨政商精英采取行动。这些精英通过提供资金、设施和人脉关系，使诈骗产业风生水起。据美国国会称，其中包括高级政客以及首相洪玛奈的亲属，美国国会已呼吁对其实施制裁。\n\n“他们需要开始追究有证据支持的精英犯罪分子的责任，而不是捏造的、无关痛痒的中层调查，应追究的是那些内阁级成员、参议员以及首相家族成员。”哈佛大学亚洲中心访问学者、跨国犯罪专家雅各布·丹尼尔·西姆斯 (Jacob Daniel Sims) 表示。\n\n柬埔寨新闻部长奈特·帕克特拉 (Neth Pheaktra) 没有回复美联社通过Telegram发送的详细问题，这些问题涉及柬埔寨如何处理诈骗犯，外界要求起诉其高级政客的呼声，以及其正在进行的任何刑事案件。\n\n今年早些时候，在回应美联社有关被打击行动波及的前诈骗从业人员待遇问题时，帕特拉表示，“柬埔寨否认其未能保护人口贩运受害者或容忍与诈骗窝点相关的虐待行为。”他声称，“所有人员都经过筛选，以区分受害者和犯罪者，受害者将获得保护、住所、医疗服务以及安全返回的援助。”但他没有提供任何此类程序的证据。\n\n警方突袭这些窝点后，诈骗犯纷纷逃离，数万人涌入金边。许多前从业人员没有钱购买回国机票，也几乎得不到本国大使馆的帮助。\n\n虽然目前尚无关于有多少诈骗犯离开诈骗园区的完整数据，但来自邻国的报道让我们得以一窥这一群体的规模和多样性。据中国央视报道，中国在6月份表示，已有遣返了2万多名与诈骗园区相关人员被遣返。越南一个边境省份表示，2026年上半年接收了超过1700名前劳工。\n\n印尼大使馆9月份表示，已收到12940名印尼公民的回国援助请求，另有700人仍滞留在柬埔寨。乌干达驻该地区大使表示，已帮助1000名非洲人返回家园。\n\n许多前从业人员的护照被诈骗团伙扣押，并因在柬埔寨逾期滞留、没有有效签证而面临罚款。即便他们有能力支付罚款，柬埔寨政府也已禁止住宿场所向这些前从业人员出租房间。许多人最终流落街头，甚至连着几天没东西吃。\n\n警方还进行了多次清查行动，将前从业人员带往拘留中心。他们必须留在那里，直到能够买到回国机票。两名前从业人员告诉美联社，他们曾被关押在一个名为“芒果2号”（Mango 2）的拘留中心。在那里，他们和前从业人员挤在一起，睡在地上，直到后来获得援助组织提供的回国机票。\n\nDW中文有Instagram！欢迎搜寻dw.chinese，看更多深入浅出的图文与影音报道。\n\n© 2026年德国之声版权声明：本文所有内容受到著作权法保护，如无德国之声特别授权，不得擅自使用。任何不当行为都将导致追偿，并受到刑事追究。", "body": "（德国之声中文网）面对日益增长的国际压力，柬埔寨加大了打击力度，关闭了在该国蓬勃发展的诈骗中心。\n\n今年年初，柬埔寨全国范围内的打击犯罪行动全面展开，导致数万名前诈骗人员流落街头，引发了一场人道主义危机。\n\n美联社采访了前诈骗人员、致力于调查人口贩运的非营利组织和其他专家，揭示了柬埔寨打击行动所造成的危机的严重程度。这些前诈骗人员表示，他们遭遇任意拘押、警方骚扰，并因政府禁止为他们提供住房而被迫露宿街头。近一年过去了，仍有数百人滞留当地。\n\n批评人士指出，许多前诈骗人员是人口贩运的受害者，政府应该对他们进行调查，以查明他们在诈骗园区内是否曾遭受虐待。“政府通常将落入诈骗中心的移民视为罪犯，我们没有看到任何证据表明当局作出了充分努力，按照国际公认的人口贩运识别指标对他们进行筛查。”致力于调查人口贩运的非营利组织Eos Collective的李玲（音译）说道。\n\n在柬埔寨，网络诈骗是一个价值数十亿美元的规模产业。据估计，约有10万名从业人员在戒备森严的大型园区内从事网络诈骗，他们住在宿舍里，不被允许离开。有些人明知自己参与的是非法活动，但许多人是被高薪工作的虚假承诺诱骗，并陷入复杂的人口贩运网络。\n\n据追踪诈骗地点的监督机构 CyberScamMonitor收集的数据，柬埔寨至少有182个已确认的诈骗窝点，但该机构掌握的证据显示实际窝点数量约为300个。\n\n2025年末，一名韩国留学生被迫进入诈骗园区后死亡，以及美国起诉一名出生于中国的柬埔寨企业集团创始人（该集团涉嫌大规模加密货币诈骗），使得此类诈骗活动引起了全球关注。\n\n今年9月，柬埔寨宣布已捣毁所有大型诈骗窝点，并正在对与这些诈骗案相关的案件提起诉讼。上个月，柬埔寨表示已从一个涉嫌诈骗网络中查获价值10亿美元的资产，并请求国际刑警组织协助追捕29名团伙头目。\n\n但柬埔寨并未提供任何证据表明，其正在对这些骗局背后的犯罪操盘手，或帮助其发展壮大的柬埔寨政商精英采取行动。这些精英通过提供资金、设施和人脉关系，使诈骗产业风生水起。据美国国会称，其中包括高级政客以及首相洪玛奈的亲属，美国国会已呼吁对其实施制裁。\n\n“他们需要开始追究有证据支持的精英犯罪分子的责任，而不是捏造的、无关痛痒的中层调查，应追究的是那些内阁级成员、参议员以及首相家族成员。”哈佛大学亚洲中心访问学者、跨国犯罪专家雅各布·丹尼尔·西姆斯 (Jacob Daniel Sims) 表示。\n\n柬埔寨新闻部长奈特·帕克特拉 (Neth Pheaktra) 没有回复美联社通过Telegram发送的详细问题，这些问题涉及柬埔寨如何处理诈骗犯，外界要求起诉其高级政客的呼声，以及其正在进行的任何刑事案件。\n\n今年早些时候，在回应美联社有关被打击行动波及的前诈骗从业人员待遇问题时，帕特拉表示，“柬埔寨否认其未能保护人口贩运受害者或容忍与诈骗窝点相关的虐待行为。”他声称，“所有人员都经过筛选，以区分受 常现实。她说： “我们收到的电子邮件中有一半是某种形式的人工智能。”，并补充说，尽管她在这个职位上有十年的经验，但这使得阅读和处理请求和投诉变得更加复杂和耗时。“这绝对是更费力的。”继续阅读……", "body_orig": "MPs, local authorities, lawyers, schools and more are receiving floods of grievances, requests and legal challenges, often complex to read and respond to\n\n‘It started as a trickle in 2024 and now it’s an onslaught.” Hollie Wickens, a senior caseworker in a Labour MP’s office, is explaining the daily reality of dealing with surging volumes of artificial intelligence-generated correspondence.\n\n“Half the emails we receive are some form of AI,” she says, adding that this has made requests and complaints much more complex and time-consuming to read and deal with, despite her decade of experience in the role. “It is definitely more taxing.”\n\nAt the start of this decade, applying for a job, writing a complaint or objecting to a local planning application typically required considerable effort: time to research a topic, fill in a form or write a formal-sounding email, with specialist knowledge often also required.\n\nThat was until the rapid growth of ChatGPT – which turns four later this month – Claude, Copilot, Gemini and other generative AI tools over the past couple of years. These chatbots are helping turn laypeople into experts by giving access to a free – albeit sometimes unreliable – legal adviser, administrator or personal assistant.\n\nThe developers of AI tools promised huge productivity gains for employers and their staff: dull, routine tasks could be automated and carried out far more quickly, giving the human workforce more time for creative endeavours. There are signs of those gains in parts of the economy, with AI credited for some of this year’s better than expected UK GDP growth.\n\nHowever, UK businesses, local authorities, courts, schools and other public bodies are reporting being swamped by a flood of AI-generated complaints, letters and legal challenges that are massively increasing their workload, at a time of already stretched resources.\n\nThis phenomenon has been called “AI clog” by commenters.\n\nWith the concept of low-quality “AI slop” now mainstream, organisations are sounding the alarm that their operations are being gummed up by ever greater volumes of correspondence.\n\nThese only take moments for users to create, but huge amounts of time for human employees to sift through and respond to. Bombarding public bodies with AI-generated requests has been labelled “agentic flooding” by researchers at the centre for digital governance at the Hertie School in Berlin, the Cooperative AI Foundation and GovAI.\n\n“Every sector is experiencing very similar issues,” says Deborah Evans, the chief executive of Lawyers in Local Government (LLG), an organisation that represents 5,600 lawyers working in local authorities.\n\n“Obviously AI is a wonderful tool that enables people to do things very, very quickly and it can make a complaint sound incredibly professional, very formal.”\n\nLocal authorities are experiencing surging numbers of complaints, which can relate to issues from adult social care services to missed bin collections or objections to planning applications. “Local authorities have one pot of money and don’t get extra money because of more complaints,” Evans says.\n\nLocal authorities believe the length of correspondence is an indication that it has been artificially generated, as does the inclusion of certain phrases or use of bullet points.\n\n“It’s a real problem,” says councillor Alessandro Georgiou, the leader of Enfield council. “More and more residents are using it to appeal decisions of the council, such as a significant uptick in parking appeals.”\n\nThe information rights watchdog, the Information Commissioner’s Office (ICO), found that many public authorities received more requests in 2025. It noted that AI-generated requests can be “very long, repetitive and contain unrelated comments or misdirected demands”, have a greater scope, and be written in a way that makes it harder to identify what information is being requested.\n\nBefore the widespread use of chatbots, the average length of complaints received by local authorities was about two pages. The majority are now 10 times longer, says Evans. “You get some huge ones. The worst one I’m aware of at the moment is about 200 pages long,” she says.\n\nDespite this, the ICO cautions that requests that appear to be drafted using AI and contain inaccuracies still need to be answered by humans.\n\nAI tools can often treat complaints as a legal claim, Evans says. “It will start referring to statute and pull out case law, but not necessarily tied to the jurisdictional boundaries in which you operate. It might find some great case law from Canada or somewhere. [AI] is also slightly prone to hallucinations so it does occasionally make things up.”\n\nSome business owners worry that AI’s tendency to be overly supportive and validating can give people misplaced confidence to pursue a legal case.\n\n“Everyone’s got a free lawyer now,” complains the founder of one technology start-up. One of its former employees, who was let go on performance grounds, is challenging their dismissal through an employment tribunal, although the entrepreneur insists the process was handled correctly. “You can tell by the wording [that the complaint is AI-generated] and it has a different tone.”\n\nAmid a long backlog of employment tribunal cases, the founder expects they will have spent £30,000 on legal fees by the time the case is heard.\n\nThe number of employment tribunal claims opened between April and June soared by 28% compared with a year earlier, representing 14,000 cases from single claimants, according to the most recent government figures. The number of concluded cases also fell during the quarter, resulting in 70,000 open single claims at the end of June.\n\nThe founder’s experience is by no means unique, according to Jim Moore, an employee relations expert at Hamilton Nash. Many of his clients are receiving correspondence that is either entirely AI-generated or relies heavily on wording from AI tools.\n\nThe complaints received by employers are described as “unnecessarily verbose” and containing “embellished or exaggerated claims that portray relatively minor incidents as major offences”.\n\nMoore says many AI-generated complaints “miss out on the most important point of a complaint – what resolution are you looking for? Most of the time, they’re worded to sound intimidating but forget to set out what solution the complainant wants.”\n\nThe statutory response times for some requests are putting further pressure on public bodies clogged up by AI-generated correspondence.\n\nTransport for London (TfL), the public body responsible for the capital’s public transport system, received a record 4,769 freedom of information (FoI) requests in 2025-26, a 5% increase on the previous peak in 2023-24.\n\nThe number of appeals sent to TfL is also rising, according to the minutes of a recent meeting of its audit and assurance committee. It reported a “noted increase” in appeals that appeared to be generated by AI “which often contain highly technical and often inaccurate assertions and assumptions”.\n\nThe offices of some MPs are also struggling to cope.\n\nVonnie Sandlan, the head of office for Graeme Downie, the Labour MP for Dunfermline and Dollar, says dealing with a surge in AI-generated requests has left her staff “exhausted”. “They are stretched to the limits and working more hours than they are paid,” she says.\n\nShe notes that AI agents could aid those who would struggle to draft correspondence without help, but says her office has recently decided to stop responding to automated “click to email your MP” campaigns, to allow them to focus on constituents’ requests.\n\nThe GMB union, which represents MPs’ office staff, has found soaring casework levels to be widespread. “AI is not lightening the load in MPs’ offices,” says Lisa Gillmore, the president of the MPs’ and peers’ staff branch. “Where offices keep their own figures, that casework has doubled or more and staff are carrying it with no let-up.”\n\nEvans warns that every pound spent by local authorities on dealing with complaints “is a pound that’s not being spent on something else, which is why getting things under control is important”. Some ombudsman services are now imposing word limits for complaints, she says, or designing online templates to restrict how much information can be attached.\n\nOthers fear that organisations might start using AI tools to sift through AI-generated correspondence, with machine talking to machine. But this doesn’t come without cost and “losing the human touch”, as Evans puts it.\n\nWiltshire council has said it is exploring using AI tools to summarise long emails and draft initial responses, while a committee at Stroud district council in Gloucestershire has discussed how it uses Microsoft’s Copilot to help with writing reports and presenting information.", "body_zh": "议员、地方当局、律师、学校等正收到大量的申诉、请求和法律挑战，往往难以阅读和应对\n\n“它始于2024年的涓涓细流，现在它是一次冲击。” 工党议员办公室的高级个案工作者霍莉·威肯斯（ Hollie Wickens ）正在解释处理大量人工智能生成的通信的日常现实。\n\n她说： “我们收到的电子邮件有一半是某种形式的人工智能。”ays ，并补充说，尽管她在这个职位上有十年的经验，但这使得阅读和处理请求和投诉变得更加复杂和耗时。 “这绝对是更费力的。”\n\n在本世纪初，申请工作、写投诉或反对当地规划申请通常需要付出相当大的努力：花时间研究一个主题、填写表格或写一封正式的电子邮件，并具备专业知识或ften也是必需的。\n\n直到ChatGPT的快速增长--本月晚些时候将迎来四个月-- Claude、Copilot、Gemini和其他生成式人工智能工具在过去几年中。 这些聊天机器人通过提供免费（尽管有时不可靠）的法律顾问、管理员或个人助理，帮助外行人成为专家。\n\n人工智能工具的开发人员承诺为雇主及其员工带来巨大的生产力提升：沉闷，日常任务可以自动化并更快地执行，从而为人类劳动力提供更多时间进行创造性的努力。 部分经济体出现了这些增长的迹象，人工智能被认为是今年英国GDP增长好于预期的部分原因。\n\n然而，英国企业、地方当局、法院、学校和其他公共机构报告说，人工智能引发的大量投诉、信件和法律挑战e在资源已经捉襟见肘的情况下，他们的工作量大幅增加。\n\n这种现象被评论者称为“AI堵塞”。\n\n随着低质量“AI SLOP”的概念成为主流，组织正在敲响警钟，他们的运营正被越来越多的通信量所吞噬。\n\n这些只需要用户创建片刻，但人类员工需要花费大量时间来筛选和响应。Bombardhertie Sc数字治理中心的研究人员将具有人工智能生成请求的公共机构标记为“代理洪水”", "body": "议员、地方当局、律师、学校等正收到大量的申诉、请求和法律挑战，往往难以阅读和应对\n\n“它始于2024年的涓涓细流，现在它是一次冲击。” 工党议员办公室的高级个案工作者霍莉·威肯斯（ Hollie Wickens ）正在解释处理大量人工智能生成的通信的日常现实。\n\n她说： “我们收到的电子邮件有一半是某种形式的人工智能。”ays ，并补充说，尽管她在这个职位上有十年的经验，但这使得阅读和处理请求和投诉变得更加复杂和耗时。 “这绝对是更费力的。”\n\n在本世纪初，申请工作、写投诉或反对当地规划申请通常需要付出相当大的努力：花时间研究一个主题、填写表格或写一封正式的电子邮件，并具备专业知识或ften也是必需的。\n\n直到ChatGPT的快速增长--本月晚些时候将迎来四个月-- Claude、Copilot、Gemini和其他生成式人工智能工具在过去几年中。 这些聊天机器人通过提供免费（尽管有时不可靠）的法律顾问、管理员或个人助理，帮助外行人成为专家。\n\n人工智能工具的开发人员承诺为雇主及其员工带来巨大的生产力提升：沉闷，日常任务可以自动化并更快地执行，从而为人类劳动力提供更多时间进行创造性的努力。 部分经济体出现了这些增长的迹象，人工智能被认为是今年英国GDP增长好于预期的部分原因。\n\n然而，英国企业、地方当局、法院、学校和其他公共机构报告说，人工智能引发的大量投诉、信件和法律挑战e在资源已经捉襟见肘的情况下，他们的工作量大幅增加。\n\n这种现象被评论者称为“AI堵塞”。\n\n随着低质量“AI SLOP”的概念成为主流，组织正在敲响警钟，他们的运营正被越来越多的通信量所吞噬。\n\n这些只需要用户创建片刻，但人类员工需要花费大量时间来筛选和响应。Bombardhertie Sc数字治理中心的研究人员将具有人工智能生成请求的公共机构标记为“代理洪水”", "link": "https://www.theguardian.com/technology/2026/nov/08/ai-clog-public-bodies-local-authorities-onslaught-chatbot-generated-correspondence", "time": "11月08日 16:00", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}, {"title_orig": "1-0 to humankind? US midterms vote puts AI, datacentres and the broligarchy back in their box | Heather Stewart", "title_zh": "人类以1比0获胜？美国中期投票将人工智能、数据中心和共产主义政权重新放回他们的盒子里| Heather Stewart", "summary_orig": "Election results appear to have turbo-charged an already growing social, political and financial market rethink about AI ‘AI clog’: UK battles onslaught of chatbot-generated complaints Editorial: the AI backlash – Silicon Valley’s political power is cracking Last week’s midterms may not have cowed Donald Trump, but they should be a wake-up call for the grinning tech broligarchs who lined up at his inauguration two chaotic years ago. Clearly, the cost of living squeeze unleashed by Trump’s war in Iran was a big driver of the Democrat wave. But AI was also on the ballot – in many places, literally. Continue reading...", "summary_zh": "选举结果似乎加剧了已经不断增长的社会、政治和金融市场对人工智能“人工智能堵塞”的重新思考：英国因聊天机器人引发的投诉而猛烈抨击社论：人工智能反弹–硅谷的政治力量正在崩溃上周的中期选举可能没有吓倒唐纳德·特朗普，但对于两年前在他的就职典礼上排队等候的咧着嘴笑的科技小政府来说，这应该是一个警钟。显然，特朗普在伊朗的战争所引发的生活成本压力是民主党浪潮的一大驱动力。但人工智能也在选票上–在许多地方，从字面上看。继续阅读...", "body_orig": "Election results appear to have turbo-charged an already growing social, political and financial market rethink about AI\n\n‘AI clog’: UK battles onslaught of chatbot-generated complaints\n\nEditorial: the AI backlash – Silicon Valley’s political power is cracking\n\nLast week’s midterms may not have cowed Donald Trump, but they should be a wake-up call for the grinning tech broligarchs who lined up at his inauguration two chaotic years ago.\n\nClearly, the cost of living squeeze unleashed by Trump’s war in Iran was a big driver of the Democrat wave. But AI was also on the ballot – in many places, literally.\n\nDozens of measures calling for limits on datacentre expansion were passed. And elsewhere, reining in the unchecked expansion of the power-hungry mega-sheds was a rallying cry.\n\nAt a campaign event, the Texas senator-elect James Talarico recalled meeting a mother who told him the lights from the neighbouring datacentre were so bright, her son thought it was daytime in the middle of the night.\n\nWhether the tech sell-off resumes this week remains to be seen; but the anti-AI sentiment evident in last week’s results appears to have punctured at least one narrative that was sustaining the market boom.\n\nEvery bubble needs a story, and for AI, one chapter involves carpeting the US in debt-funded datacentres, which will become necessary – and viable – as demand for the technology increases.\n\nThat looks a lot less feasible after last week. It turns out, chucking up hundreds of these humming warehouses, while simultaneously warning workers they may be superseded by an army of superhuman bots, is not great PR.\n\nThe public were meant to set aside their qualms, for the greater good that AI would bring the economy. But the positive benefits many people may derive from interacting with chatbots – the shopfront of AI for most of us – coexist with very obvious downsides.\n\nJust to name a few: the sea of online slop; those pervert glasses; and tech firms’ insistence on shoehorning the technology unbidden into every app, platform and device – the latest example of what tech writer Cory Doctorow calls “enshittification”.\n\nAt the same time, voters have watched the leaders of the big tech firms become obscenely rich, while average consumers continue to be hammered by inflation. So perhaps it should not be surprising that the US electorate seems to have decided: enough.\n\nUltimately, all businesses in a democracy – even those embraced by the US president – have to operate within the bounds set by society. And the tech bros have done a terrible job of winning over the public.\n\nElon Musk’s approach in Texas, where he poured hundreds of millions of dollars into trying to buy the electorate, just became a selling point for the Democrats.\n\nIt remains to be seen whether objections to datacentres are the start of a more radical shift in opinion that will eventually tame the tech companies, redolent of when Teddy Roosevelt swept into the White House at the turn of the 20th century to set about breaking up the oil and railway monopolies.\n\nHowever, at the very least, the opposition seems likely to put the brakes on the hectic pace of investment in building out AI’s physical infrastructure.\n\nAnd this shift seems to have accelerated a market rethink that was already under way. As Joe Maher of Capital Economics put it last week: “Sentiment towards the AI trade was already looking fragile and the US equity market was showing many late-cycle signs. As such, this [the midterms] could plausibly become the catalyst that leads to a more long-lasting unwind of the AI equity boom.”\n\nTwo things can both be true: AI is a transformative technology that will bring welcome productivity benefits; but they won’t be big enough to justify current market valuations.\n\nAs the economist Dario Perkins, of TS Lombard, put it in a brilliant recent note, written in the past tense as if in the aftermath of a future AI crash: “What people who worked in tech and finance didn’t realise was that people outside the ecosystem – you know, regular people – just weren’t that interested in AI.\n\n“Yes, it made web search easier (sort of); but contrary to the assumption in Silicon Valley, regular people were never going to use AI to organise their lives or ‘run workflow’. Tech insiders were living in a bubble – in at least two senses of that phrase.”\n\nPerkins described the industry in late 2026 as essentially “$200bn in current revenues supporting more than $1tn in future commitments from just two companies [Anthropic and Open AI]”.\n\nA reckoning was already in the offing, even without the intervention of US voters. The tech-heavy Nasdaq peaked a month ago; and a growing number of voices were sounding the alarm.\n\nAs just one example, the International Monetary Fund pointed last month to“growing evidence” that the successful rollout of AI “may not require investment on the massive scale being undertaken by ‘hyperscaler’ firms”, and that “potential economic gains may not be as large as expected”.\n\nThe IMF highlighted the growing capabilities of lower-cost Chinese models and pointed to the circular financing that has become rife within the AI sector.\n\nMore recent reports have also highlighted a string of corporate AI users either slapping limits on staff use of costly products such as Anthropic’s Claude, or turning to much cheaper models, hosted on their own servers.\n\nThe datacentre backlash appears to have brought new focus to some of these pre-existing concerns. Whether the stock sell-off persists or not, opposition has thrown down the gauntlet for the AI lobby to prove what the tech can do for societies – including those well beyond the US – which are reluctant to accept the very obvious costs.", "body_zh": "选举结果似乎掀起了社会、政治和金融市场对人工智能不断增长的反思\n\n“AI堵塞” ：英国对抗聊天机器人引发的投诉\n\n社论：人工智能的反弹–硅谷的政治力量正在崩溃\n\n上周的中期选举可能没有吓倒唐纳德·特朗普(Donald Trump) ，但对于两年前在他混乱的就职典礼上排队等候的咧着嘴笑的科技大亨来说，这应该是一个警钟。\n\n很显然，特朗普在伊朗的战争所引发的生活成本压力是民主党浪潮的一大驱动力。 但人工智能也在选票上–在许多地方，从字面上看。\n\n通过了数十项要求限制数据中心扩展的措施。 在其他地方，控制急需电力的大型棚屋的无节制扩张是一个团结的口号。\n\n在一次竞选活动中，德克萨斯州当选参议员詹姆斯·塔拉里科（ James Talarico ）回忆说，他遇到了一位母亲，邻近的数据中心非常明亮，她的儿子认为这是半夜的白天。\n\n科技股本周是否会恢复抛售仍有待观察；但上周业绩中明显的反人工智能情绪似乎至少刺破了一个支撑市场繁荣的叙述。\n\n每个泡沫都需要一个故事，而对于人工智能来说，一个章节涉及在债务资助的数据中心中为美国铺设地毯，这将成为必要–nd可行–随着对技术需求的增加。\n\n与上周相比，这似乎不太可行。 事实证明，扔掉数百个这些嗡嗡作响的仓库，同时警告工人他们可能会被一群超人机器人取代，这不是很好的公关。\n\n公众应该抛开他们的疑虑，因为人工智能将为经济带来更大的利益。 但许多人可能从与CH的互动中获得的积极好处atbots--我们大多数人的人工智能店面--与非常明显的缺点共存。\n\n仅举几例：在线邋遢的海洋；那些变态的眼镜；以及科技公司坚持将这项技术无限制地应用到每个应用程序、平台和设备中--这是科技作家科里·多克托罗（ Cory Doctorow ）所说的“神秘化”的最新例子。\n\n与此同时，选民们看到大型科技公司的领导人变得非常富有，而平均消费eRS继续受到通货膨胀的打击。 因此，也许美国选民似乎已经决定：够了，这并不奇怪。\n\n最终， al", "body": "选举结果似乎掀起了社会、政治和金融市场对人工智能不断增长的反思\n\n“AI堵塞” ：英国对抗聊天机器人引发的投诉\n\n社论：人工智能的反弹–硅谷的政治力量正在崩溃\n\n上周的中期选举可能没有吓倒唐纳德·特朗普(Donald Trump) ，但对于两年前在他混乱的就职典礼上排队等候的咧着嘴笑的科技大亨来说，这应该是一个警钟。\n\n很显然，特朗普在伊朗的战争所引发的生活成本压力是民主党浪潮的一大驱动力。 但人工智能也在选票上–在许多地方，从字面上看。\n\n通过了数十项要求限制数据中心扩展的措施。 在其他地方，控制急需电力的大型棚屋的无节制扩张是一个团结的口号。\n\n在一次竞选活动中，德克萨斯州当选参议员詹姆斯·塔拉里科（ James Talarico ）回忆说，他遇到了一位母亲，邻近的数据中心非常明亮，她的儿子认为这是半夜的白天。\n\n科技股本周是否会恢复抛售仍有待观察；但上周业绩中明显的反人工智能情绪似乎至少刺破了一个支撑市场繁荣的叙述。\n\n每个泡沫都需要一个故事，而对于人工智能来说，一个章节涉及在债务资助的数据中心中为美国铺设地毯，这将成为必要–nd可行–随着对技术需求的增加。\n\n与上周相比，这似乎不太可行。 事实证明，扔掉数百个这些嗡嗡作响的仓库，同时警告工人他们可能会被一群超人机器人取代，这不是很好的公关。\n\n公众应该抛开他们的疑虑，因为人工智能将为经济带来更大的利益。 但许多人可能从与CH的互动中获得的积极好处atbots--我们大多数人的人工智能店面--与非常明显的缺点共存。\n\n仅举几例：在线邋遢的海洋；那些变态的眼镜；以及科技公司坚持将这项技术无限制地应用到每个应用程序、平台和设备中--这是科技作家科里·多克托罗（ Cory Doctorow ）所说的“神秘化”的最新例子。\n\n与此同时，选民们看到大型科技公司的领导人变得非常富有，而平均消费eRS继续受到通货膨胀的打击。 因此，也许美国选民似乎已经决定：够了，这并不奇怪。\n\n最终， al", "link": "https://www.theguardian.com/business/2026/nov/08/us-midterms-ai-datacentres-broligarchy-voter-backlash", "time": "11月08日 20:05", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}, {"title_orig": "UK spent £100m on zombie Brexit border inspection posts", "title_zh": "英国在僵尸英国退欧边境检查站上花费了1亿美元£", "summary_orig": "Five of seven facilities in England and Wales never reached operational stage as Tories vacillated over plans to check goods The UK wasted at least £100m in taxpayers’ money to set up zombie Brexit border inspection posts that were never used, it has been revealed. The overall cost of Brexit was put at an estimated £4.7bn by the National Audit Office last year but this included years-long transformation of the software used for customs declarations and other systems built to cope with the UK leaving the single market. Continue reading...", "summary_zh": "据透露，英格兰和威尔士的七个设施中有五个从未达到运营阶段，因为保守党对检查货物的计划犹豫不决英国浪费了至少1亿英镑的纳税人资金来建立从未使用过的僵尸英国退欧边境检查站。国家审计署去年估计英国脱欧的总成本为47亿英镑，但这包括用于海关申报的软件长达数年的改造以及为应对英国退出单一市场而构建的其他系统。继续阅读...", "body_orig": "Five of seven facilities in England and Wales never reached operational stage as Tories vacillated over plans to check goods\n\nThe UK wasted at least £100m in taxpayers’ money to set up zombie Brexit border inspection posts that were never used, it has been revealed.\n\nThe overall cost of Brexit was put at an estimated £4.7bn by the National Audit Office last year but this included years-long transformation of the software used for customs declarations and other systems built to cope with the UK leaving the single market.\n\nNow fresh information from HMRC on the exact spend on the seven “inland border facilities” has come to light. The sites were built but quickly decommissioned as the Conservative government at the time vacillated over plans to check goods coming in from the continent.\n\nFive of the seven “inland border facilities” in England and Wales never got to operational stage because the Tories decided not to implement all the border checks after concluding food coming from the EU would be the same high standard as it was before Brexit.\n\nPortsmouth port, which is owned by the city council, spent £23m on building its border control post, which has never been used at full capacity because of the decision to scale back the checks.\n\nThe port received £17.1m in government funding for the project, leaving the council to make up the £6m shortfall, which could otherwise have been spent on essential services.\n\nThe EU launched all the checks in Calais, Dublin and other European ports from day one as the UK was treated as a “third country” overnight. The most controversial British zombie facility was known as “Dover white cliffs”. Furious residents at the village of Guston were told of the plans for the inland border facility on 31 December 2020, just hours before a “transition year” ended and Brexit was due to be implemented with supposed checks on all lorries coming across the Channel.\n\nInformation from HMRC, released under a freedom of information request, shows the facility has so far cost the taxpayer £28m, even though it remains a field. The Department for Transport paid £21m to procure the site and spent a further £7m on initial ground works, including an archaeological survey for any roman remains.\n\nAnother £17m was spent on a border facility in Birmingham planned at the airport car park. Newly released information shows it cost £11m to build with £6m in “closure costs”.\n\nAnother £20m was spent on sites in Warrington and in Ebbsfleet, a town just south of the Dartford Bridge on the Thames estuary. The Warrington site, on the former Shearings holidays coach stop at Appleton Thorn, was chosen because there were no suitable sites available for lorries coming from Ireland into Liverpool, Holyhead and Heysham ports.\n\nLocal people vehemently opposed the site at the time. It cost £7m to buy, £9m to build and £1m to decommission.\n\nAnother £10m was spent preparing customs and other checks at the former car park at Eurostar Ebbsfleet International train station, which cost £4m to convert into a lorry park and £6m to close, according to HMRC data.\n\nA further £5m was spent on another site tucked away off the M11, just south of Stansted, at North Weald airfield. This airfield was commandeered for the same purpose, to avert congestion on the M25. It cost £3m to build and £2m to close down.\n\nHMRC said Birmingham, Ebbsfleet and North Weald “did not require the acquisition of land”. The decision to build Brexit lorry parks so far from Dover underlined the lack of preparation for the UK’s departure from the EU.\n\nMost of the UK’s lorry traffic is concentrated in Dover, but as a designated area of outstanding beauty it was impossible to conduct the post-Brexit customs and standard checks near the port.\n\nThe UK finally opted for a site 20 miles inland at Sevington in Kent, but even that was last minute. The government previously revealed in a parliamentary question that total capital costs ran to £154m.\n\nThis included £30m on the acquisition of farmland between Sevington and Mersham for Britain’s principal Brexit border facility and another £70m to build.\n\nHMRC has revealed through freedom of information that the operational costs have run to £179m, money that would not have been spent had Brexit not happened.\n\nThe second site that remains operational is Holyhead – a small site close to the main road to the port which receives goods from Ireland. According to the FoI, the site cost £14m to acquire and another £23m to build.\n\nThe figures are separate to investments made by Eurotunnel, the Port of Dover and other ports including Portsmouth. Eurotunnel spent €50m (£41.7m) on building the infrastructure for Brexit checks for trucks and €90m on changes for passengers, including an entry and exit system that has never been activated by the French.\n\nThe £23m border control post at Portsmouth, the UK’s second-busiest cross-Channel port, now faces an uncertain future. The hi-tech facility was built to government specifications to handle post-Brexit checks. Two trailer checks take place on average each day, according to the port’s director, Mike Sellers, compared with the 80 checks originally envisioned.\n\nHe said: “Given the border post’s location within the operational port, ideally we would look to repurpose it rather than demolish it, but it will cost us almost as much to repurpose as to demolish. It was bespoke and built for food import checks and biosecurity, it is not suitable for general warehousing and will have to be changed.”\n\nSellers and Portsmouth city council’s leader are among the ports calling on the government to provide compensation for the border posts that will become redundant when the UK government’s deal with the EU comes into force.", "body_zh": "英格兰和威尔士的七家工厂中有五家从未达到运营阶段，因为保守党对检查货物的计划犹豫不决\n\n据透露，英国浪费了至少1亿英镑的纳税人资金来建立从未使用过的僵尸英国脱欧边境检查站。\n\n国家审计署去年估计英国脱欧的总成本为47亿英镑，但这包括用于海关申报的软件长达数年的改造iONS和其他为应对英国退出单一市场而构建的系统。\n\n现在，英国皇家税务与海关总署（ HMRC ）关于七个“内陆边境设施”的确切支出的新信息已经曝光。 这些遗址已经建成，但由于当时保守党政府对检查来自非洲大陆的货物的计划犹豫不决，因此很快就退役了。\n\n英格兰和威尔士的七个“内陆边境设施”中有五个从未进入运营阶段，因为保守党在得出结论认为来自欧盟的食品将与英国脱欧前的高标准相同后，决定不实施所有边境检查。\n\n由市议会拥有的朴茨茅斯港花费了2300万£建造其边境检查站，由于决定缩减检查，该检查站从未被满负荷使用。\n\n该港口为该项目获得了1710万£的政府资金，使理事会得以弥补e缺口为600万£ ，否则可用于基本服务。\n\n欧盟从第一天开始在加来、都柏林和其他欧洲港口启动所有检查，因为英国一夜之间被视为“第三国”。 最具争议的英国僵尸设施被称为“多佛白色悬崖”。 Guston村的愤怒居民于2020年12月31日被告知内陆边境设施的计划，就在“中转”前几个小时。n年”结束，英国脱欧将通过对所有穿越海峡的卡车进行所谓的检查来实施。\n\nHMRC根据信息自由请求发布的信息显示，该设施迄今已花费纳税人2800万英镑，尽管它仍然是一个领域。 交通部支付了2100万£购买该场地，并花费了700万£用于最初的地面工程，包括对任何罗马遗骸的考古调查。\n\n另一个£ 1计划在机场停车场的伯明翰边境设施花费了700万英镑。新发布的信息显示，它的建造成本为£ 1100万，其中£ 600万“c", "body": "英格兰和威尔士的七家工厂中有五家从未达到运营阶段，因为保守党对检查货物的计划犹豫不决\n\n据透露，英国浪费了至少1亿英镑的纳税人资金来建立从未使用过的僵尸英国脱欧边境检查站。\n\n国家审计署去年估计英国脱欧的总成本为47亿英镑，但这包括用于海关申报的软件长达数年的改造iONS和其他为应对英国退出单一市场而构建的系统。\n\n现在，英国皇家税务与海关总署（ HMRC ）关于七个“内陆边境设施”的确切支出的新信息已经曝光。 这些遗址已经建成，但由于当时保守党政府对检查来自非洲大陆的货物的计划犹豫不决，因此很快就退役了。\n\n英格兰和威尔士的七个“内陆边境设施”中有五个从未进入运营阶段，因为保守党在得出结论认为来自欧盟的食品将与英国脱欧前的高标准相同后，决定不实施所有边境检查。\n\n由市议会拥有的朴茨茅斯港花费了2300万£建造其边境检查站，由于决定缩减检查，该检查站从未被满负荷使用。\n\n该港口为该项目获得了1710万£的政府资金，使理事会得以弥补e缺口为600万£ ，否则可用于基本服务。\n\n欧盟从第一天开始在加来、都柏林和其他欧洲港口启动所有检查，因为英国一夜之间被视为“第三国”。 最具争议的英国僵尸设施被称为“多佛白色悬崖”。 Guston村的愤怒居民于2020年12月31日被告知内陆边境设施的计划，就在“中转”前几个小时。n年”结束，英国脱欧将通过对所有穿越海峡的卡车进行所谓的检查来实施。\n\nHMRC根据信息自由请求发布的信息显示，该设施迄今已花费纳税人2800万英镑，尽管它仍然是一个领域。 交通部支付了2100万£购买该场地，并花费了700万£用于最初的地面工程，包括对任何罗马遗骸的考古调查。\n\n另一个£ 1计划在机场停车场的伯明翰边境设施花费了700万英镑。新发布的信息显示，它的建造成本为£ 1100万，其中£ 600万“c", "link": "https://www.theguardian.com/politics/2026/nov/08/uk-zombie-brexit-border-inspection-posts-check-goods", "time": "11月08日 21:32", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}, {"title_orig": "Hot fridges, a fake nuclear alert and a $6bn heist: are we in the foothills of a hacking epidemic?", "title_zh": "热冰箱、虚假的核警报和60亿美元的抢劫：我们正处于黑客流行病的山脚下吗？", "summary_orig": "As AI exposes flaws in IT systems and geopolitics plays out on the cyber frontline, some experts say the events of recent weeks could soon be a common occurrence Alex Pearce was doing the morning rounds at his fruit and vegetable wholesale business in London on Monday last week when he noticed something odd. The defrost light on refrigeration unit 2 was on, and the panel reading was 150C. Unit 4 was the same. Continue reading...", "summary_zh": "由于人工智能暴露了IT系统的缺陷，地缘政治在网络前线发挥作用，一些专家表示，最近几周发生的事件可能很快就会成为亚历克斯·皮尔斯（ Alex Pearce ）上周一在伦敦的水果和蔬菜批发业务中进行早间检查的常见事件，当时他注意到了一些奇怪的事情。制冷机组2上的除霜灯亮着，面板读数为150C。第4单元是一样的，继续阅读……", "body_orig": "As AI exposes flaws in IT systems and geopolitics plays out on the cyber frontline, some experts say the events of recent weeks could soon be a common occurrence\n\nAlex Pearce was doing the morning rounds at his fruit and vegetable wholesale business in London on Monday last week when he noticed something odd.\n\nThe defrost light on refrigeration unit 2 was on, and the panel reading was 150C. Unit 4 was the same.\n\nAs he approached his biggest unit, its defrost light also blinked on.\n\nIt was at this point that Pearce thought: is this a cyber-attack? He walked over to the box connecting the units to the internet and yanked out the cable.\n\nOn the same day, retailers in Belgium, Estonia, Ireland, Finland, Luxembourg, the Netherlands and Sweden reported similar problems, with refrigerators and freezers in some shops soaring to as high as 50C (122F).\n\n“If it had happened on a Saturday morning, when I don’t tend to be here, it could ultimately have led to a fire,” Pearce said.\n\nBut it is not just Pearce and a disparate group of retailers, as well as French blood banks, that have been suffering.\n\nThe hacking attack was one of three over a number of days. On 30 October, the world’s largest cryptocurrency exchange, Binance, was robbed of $6.3bn (£4.7bn) in a record heist and on 1 November hackers targeted Ukraine’s emergency alert app, sending people in Kyiv a fake nuclear strike alert.\n\nThe official message after the fridge attacks is: expect more disruption. We are in the “foothills” of a new hacking landscape, the head of the UK’s National Cyber Security Centre said this week.\n\nReferring to flaws in IT systems that are being exposed by AI technology, the NCSC boss, Richard Horne, said: “There are so many vulnerabilities out there that … you could say are waiting to be exploited.”\n\nHe added: “The most serious risk we face in the short term is just a huge rise in the volume of incidents … and I think you could probably point to the last few months and say we’ve started to see that.”\n\nWebsites around the world were temporarily taken out of service as a precaution last month when AI technology from the ChatGPT developer OpenAI helped discover a flaw in PHP, a computer language used to build much of the world wide web. French supermarket fridges were also attacked last month in what could have been a trial run for the more expansive foray this week.\n\nTo Azeem Azhar, a tech entrepreneur and commentator, the way AI models were discovering flaws that assailants could harness recalled China’s Covid ground zero. This was, he said, a “Wuhan moment”.\n\nAzar’s assertion headlined a Substack post that also quoted the cybersecurity executive Matthew Prince, who said last month: “We’re going to have a couple of years where every single week it’s going to feel like the sky is falling.”\n\nNot long afterwards, Pearce’s defrost lights went on.\n\nThere are two factors underpinning the NCSC warnings: geopolitics and AI. At least one expert has said the fridge attacks bear Russian hallmarks, while the Binance hack has been attributed to the North Korean state, and Russia is naturally a suspect in the Ukraine incident.\n\nThe NCSC said last week that AI-powered malicious software was “highly likely” to be used in hacking attacks against the UK’s power stations, airports and hospitals by 2028. AI would help attackers with tasks such as scouting targets, locating weaknesses in IT networks and writing malicious code, the organisation said.\n\nBut there are caveats. The NCSC’s director of operations, Paul Chichester, said the cold storage hackers “really didn’t need” to use AI to discover the fridge flaws because they were already out there, including default access passwords that were published in one fridge operating company’s manuals.\n\nSophos, a leading cybersecurity firm, said it had not seen any major incidents among its clients related to the PHP glitch, although – like others in the industry – it had seen a significant number of attempts to take advantage of the vulnerability.\n\nAnd one expert said we had been here before. Ciaran Martin, the founding chief executive of NCSC, played down the “Wuhan moment” comparison. This was not the first time the world had faced a concerted threat, he said, pointing to the NotPetya and WannaCry cyber-attacks in 2017, which have been blamed on Russia and North Korea respectively, and a surge in ransomware attacks in 2021. North Korea, hobbled by sanctions and starved of cash, has a well-established reputation as a crypto hacker.\n\n“It’s a bad run, but it’s not unprecedented,” Martin said. “The idea that we are having a Wuhan moment is not true. We are having one of those waves of incidents that happen every few years.”\n\nNonetheless, AI is exposing vulnerabilities. This is the term for a flaw in an IT system that a hacker can exploit, a door that is ajar and unnoticed or ignored by its owner. Since April, when the AI startup Anthropic released its Mythos model, which has a startling ability to flag IT flaws, the amount of vulnerabilities found by leading tech companies has soared eight-fold.\n\nAttacks have not increased by the same volume, however. The cybersecurity expert Tal Be’ery has speculated that criminal hackers are struggling to make money from these flaws, as shown by a recent decline in revenues from ransomware attacks.\n\n“It seems that currently the surge in vulns [vulnerabilities] does not translate to a surge in breaches,” Be’ery wrote last month.\n\nThe fridge targeting is carried out by attacking the companies that provide operating systems for commercial refrigeration units. These systems are connected to the internet, giving the hackers a remote access route to the ultimate victims. The Danish firm Danfoss, one of the affected system providers, said most of the affected equipment was old and no longer received security updates. It said it had “long recommended” customers install updates or replace obsolete software.\n\nThe NCSC, part of the GCHQ spy agency, said the hacks were a reminder of the vulnerability of everyday objects with internet access, from smart speakers to broadband routers. Ollie Whitehouse, NCSC’s chief technology officer, said this week it was “quite clear” that such devices could be “susceptible” to hackers. Manufacturers need to invest more in making their products secure and consumers need to be willing to pay more for the most robust products – and to keep updating them.\n\nA key flaw targeted by hackers, including in the fridge attacks, is “end of life” versions of products that are no longer being produced by companies or receiving glitch-eradicating software updates.\n\nReferring to the prospect of more attacks on internet-connected domestic devices, Whitehouse said: “To be worried, I think, is [too] strong. But we need to be more mindful, definitely.”\n\nPearce said he now realised his fridge monitoring system, by the US firm Copeland, which was installed in 2018, would need updating.\n\n“Have we learned a lesson? Yes,” he said. “There is a vulnerability we probably should have been aware of, but luckily the ramifications for us were not severe.”\n\nThe need for mindfulness is heightened by the nation state threat. Criminal gangs carry out ransomware attacks, where a victim’s computer files are encrypted and assailants demand a cryptocurrency “ransom” to unlock them. But there is a cyber frontline where nation states operate too. Geopolitics, exemplified by Russia’s hybrid warfare campaign against Europe, have made this conflict grey zone a particular source of concern.\n\nLast month, the UK government launched the Be Ready campaign, urging people to stock up on three days’ worth of food and up to nine litres of bottled water in case of a weather, cyber or other serious emergency. Wes Streeting, the defence secretary, said the country needed to prepare for the threat of “state-sponsored terrorism” targeting everyday infrastructure.\n\nOne expert said he believed the fridge attacks, for all the simplicity of the weaknesses they exploited, showed Russian traits. Xavier Bellekens, the chief executive of the cybersecurity firm Lupovis, said his startup set up “honeypot” traps involving the same fridge controllers targeted by the Europe attackers. The techniques used by the lured hackers included using internet service providers that were particularly tolerant of malicious activity – a tactic linked with previous malicious activity carried out by Russians.\n\n“Are we certain they are Russian groups? We are not. But elements of this point in that direction,” he said.\n\nOn the frontline of the grey war, there is no shock at recent events. Experts and officials in Finland said the fridge attacks were not a surprise, but part of a pattern they had seen growing for years.", "body_zh": "随着人工智能暴露IT系统的缺陷，地缘政治在网络前线发挥作用，一些专家表示，最近几周的事件可能很快就会成为常态\n\n亚历克斯·皮尔斯（ Alex Pearce ）上周一在伦敦的水果和蔬菜批发业务上做早间巡回演出时，他注意到了一些奇怪的事情。\n\n制冷机组2上的除霜灯亮着，面板读数为150C。 单元4是一样的。\n\n当他接近他最大的部队时，它的除霜灯也闪烁着。\n\n就在这时，皮尔斯想：这是网络攻击吗？ 他走到将单元连接到互联网的盒子前，拔出电缆。\n\n同一天 ntellectual property breaches on Land Rover Defender Bailiffs acting for Jaguar Land Rover raided the Dutch offices of a Chinese “copycat” rival before a legal showdown this week over whether its “Defender clone” infringes intellectual property rights. Bailiffs acting on behalf of JLR reportedly seized digital records from the offices of Chinese carmaker BYD in Schiedam and Hoofddorp in August, according to the Sunday Times. Continue reading...", "summary_zh": "据报道，法警在法庭审理涉嫌侵犯路虎卫士知识产权的案件之前没收了数字记录。法警代表捷豹路虎突击搜查了中国“模仿者”竞争对手的荷兰办事处，然后在本周就其“卫士克隆”是否侵犯知识产权进行了法律摊牌。据报道，代表捷豹路虎的法警从中国汽车制造商比亚迪在Schiedam和d据《星期日泰晤士报》报道， 8月份的Hoofddorp。继续阅读...", "body_orig": "Bailiffs reportedly seized digital records before court case over alleged intellectual property breaches on Land Rover Defender\n\nBailiffs acting for Jaguar Land Rover raided the Dutch offices of a Chinese “copycat” rival before a legal showdown this week over whether its “Defender clone” infringes intellectual property rights.\n\nBailiffs acting on behalf of JLR reportedly seized digital records from the offices of Chinese carmaker BYD in Schiedam and Hoofddorp in August, according to the Sunday Times.\n\nThe raid took place before a court case in the The Hague this week which will decide whether the BYD has a case to answer over allegations that its Ti7 SUV infringes the intellectual property of the Land Rover Defender.\n\nMotoring experts have likened BYD’s seven-seat plug-in hybrid SUV to the Defender since it went on sale in China in September last year. The company is scheduled to launch the vehicle, which the BBC’s Top Gear magazine called the “Chinese Defender clone”, in the UK market in January at a price of £47,995, undercutting the Defender by more than £20,000.\n\nBYD says on its website that “an unapologetically boxy profile delivers the imposing, chunky design that finds favour among SUV buyers, yet delivers a contemporary look”.\n\nThe price of JLR’s seven-seat Defender 110 starts from £68,465and is one of the country’s bestselling cars. The UK-based carmaker, which is owned by India’s Tata Motors, sold 29,500 Defenders to retail customers between July and September this year, compared with 25,370a year earlier.\n\nThe raid in the Netherlands was carried out by court-ordered bailiffs, with JLR suspecting that BYD reverse-engineered some of the technology that could be used in the Ti7, the Times reported. JLR wanted to secure the digital records before they could be destroyed.\n\nJLR and BYD declined to comment on the “ongoing legal proceedings”.\n\nThe dispute with BYD is not the first legal case JLR has pursed against a Chinese company over copycat allegations. It won a legal case to stop Jiangling Motor Corporation selling a copycat vehicle in 2019 after a three-year court battle.\n\nIn some cases JLR has taken a collaborative approach to dealing with the rise of China’s carmakers. It agreed to form a joint venture with Chery in a 2012 deal which later included licensing its discontinued Freelander brand with the company.\n\nChery’s Jaecoo model, which is not part of the joint venture, has been called the Temu Range Rover because of its similarities to the JLR vehicle after years of collaboration between the pair. It costs £10,000 less than JLR’s Range Rover.\n\nThe Jaecoo was the bestselling car in the UK in October, with 10,813 registrations, taking its market share from 2.07% to 4.30%, according to the Society of Motor Manufacturers & Traders. JLR’s sales of the Range Rover fell to 43,300 in the third quarter of this year, from 47,196 cars sold in the same months last year.", "body_zh": "据报道，法警在法庭审理涉嫌侵犯Land Rover Defender知识产权的案件之前扣押了数字记录\n\n代表捷豹路虎的法警在本周就其“捍卫者克隆”是否侵犯知识产权进行法律摊牌之前，突击搜查了中国“模仿者”竞争对手的荷兰办事处。\n\n据报道，代表捷豹路虎的法警从中国汽车制造商比亚迪在Schiedam的办公室没收了数字记录和Hoofddorp ，据《星期日泰晤士报》报道。\n\n这次突袭发生在本周海牙的一个法庭案件之前，该案件将决定比亚迪是否有一个案件来回答有关其Ti7 SUV侵犯路虎卫士知识产权的指控。\n\n自去年9月在中国上市以来，汽车专家将比亚迪的七座插电式混合动力SUV比作Defender。 该公司计划推出英国广播公司的Top Gear杂志称之为“中国防御者克隆”的车辆于1月在英国市场以47,995 £的价格出售，比防御者减少了超过£ 20,000。\n\ t over: the establishment of Great British Railways could be wrapped up by Christmas, at least in law. But with a renationalised industry facing fresh storms in 2027, some in the railway world are wondering if they should be careful what they wish for. The legislation that will rip up how rail has been run , anticipated for the best part of a decade, is being chewed over in its final stages in the House of Lords. It now has, the rail minister, Peter Hendy, told an industry conference in London this week, “a fair chance of getting royal assent” before parliament’s winter break, allowing a new arm’s-length body with overall control of Britain’s railway, spanning the track and train services. Continue reading...", "summary_zh": "专家预测， 2027年大不列颠共和国将面临一场火灾洗礼，可能出现的问题包括拍手的火车和轨道，以及与极端天气有关的压力。部长带来的好消息是，等待即将结束：至少在法律上，大不列颠铁路的建立可以在圣诞节前结束。但是，随着一个重新国有化的行业在2027年面临新的风暴，铁路界的一些人想知道他们是否应该小心，在他们希望的时候。预计在十年的最后阶段，将撕毁铁路运行方式的立法正在上议院的最后阶段被咀嚼。铁路大臣彼得·亨迪（ Peter Hendy ）本周在伦敦举行的一次行业会议上表示，在议会寒假之前，它现在有“获得皇家同意的公平机会” ，允许一个新的公平的机构全面控制英国的铁路，跨越轨道和aIN服务。继续阅读...", "body_orig": "Experts predict a baptism of fire for GBR in 2027, with likely issues ranging from clapped-out trains and track to extreme weather-related stress\n\nThe glad tidings brought by the minister were that the wait was almost over: the establishment of Great British Railways could be wrapped up by Christmas, at least in law. But with a renationalised industry facing fresh storms in 2027, some in the railway world are wondering if they should be careful what they wish for.\n\nThe legislation that will rip up how rail has been run, anticipated for the best part of a decade, is being chewed over in its final stages in the House of Lords. It now has, the rail minister, Peter Hendy, told an industry conference in London this week, “a fair chance of getting royal assent” before parliament’s winter break, allowing a new arm’s-length body with overall control of Britain’s railway, spanning the track and train services.\n\nGreat Western Railway will come into the government stable in December, with the remaining private train operations, East Midland Railway, Avanti and CrossCountry, due to be nationalised next year.\n\nThere will be plenty to fix, as politicians and rail bosses acknowledged. Lord Hendy opened the Railway Industry Association’s conference by describing every train in the north of England as “clapped out”; Jeremy Westlake, the chief executive of infrastructure manager Network Rail, concluded the event by bringing up the two derailments in 24 hours at the peak of a summer of delays.\n\nSome of the solutions may appear easier within an integrated, nationalised industry. The site of the future Great British Railways (GBR) HQ in Derby has now been picked, even if it remains unclear how many of rail’s leaders fancy decamping there, and exactly where the power will lie.\n\nIt won’t be, said Hendy, an all-powerful “Kremlin in Derby”, with control instead largely given to regional managing directors, something so far instigated at South Western and Southeastern. For Hendy, the rewards of the new structure will be a single point of accountability, and the end of a “culture of blame” under privatisation where contracts pitted operators against Network Rail, especially in times of disruption or delay.\n\nPersonifying for now the GBR ideal of track and train in harmony are Westlake and Alex Hynes, the chief executive of DFTO, the state operator managing the renationalised train services, who discussed their bromance in another joint appearance on stage at the London conference. Hynes said he had told train staff to “go find your new best friend on the trackside … We try to role-model it.”\n\nIt remains to be seen if either will be for the chop next year, when the newly appointed chair of GBR, John Kingman, picks one overall integrated boss. The flip side of the road to reform and integration for some, especially non-frontline managerial staff, has been prolonged uncertainty, as roles merge or disappear.\n\nBut GBR should mean being able to move resources more easily around the railway, be it people or trains. Hendy cited Great Western’s problems with former Transport for Wales trains, which had deteriorated after being replaced in service: “There’s nothing more stupid than watching some trains halfway through their lives that have been parked in a field … miserably failing on a daily basis because the industry wasn’t coherent enough. You can’t believe how stupid that is.”\n\nLikewise, he said, most train companies “have been desperately short of drivers … That’s crackers. We can fix that – and I think it’s really important to fix those basic things. They will take time.”\n\nSome, though, wonder where the GBR legislation will land rail under future governments. One of the missions was to end the micromanagement of rail by central government: when the 73-year-old Hendy, a railwayman and politician, eventually steps away, the separation – or lack of it – may become clearer.\n\nHendy said GBR would at last give the railway a long-term strategy; opponents argue it does not bind it clearly enough. Others are worried that the Treasury could step in more than ever, threatening rail’s limited financial independence. Darren Caplan, the chief executive of the Railway Industry Association, said his organisation remained “very concerned that a future secretary of state could reopen five-year funding settlements, making funding even less certain”.\n\nRichard Holden, the Conservative shadow transport secretary, warned that rail could “lose out to the competing demands of that day [and] have to get in the queue. Will a new train win out over a new hospital? I doubt it.”\n\nOlly Glover, the transport spokesperson for the Lib Dems, who are more positive about the bill but also voted against it in its current form, said: “They’ve raised a lot of expectation as a result of so-called nationalisation. But the truth of it is the benefits will take time and are only going to materialise if the Treasury is willing to sanction more spending.”\n\nMoney has been tight, even though the railway hopes fare revenues are finally on track to match pre-pandemic income in the coming years. For now, the state of the railway has reflected spending on renewing it: cut from nearly £5bn a year to less than £4bn in the last five years, according to the regulator, the Office of Rail and Road. It was, said the ORR’s interim CEO, Feras Alshaker, “expected that its reliability would decline in the period”.\n\nAs record levels of compensation for delayed journeys this summer show, it certainly has. That level was compounded by the extreme temperatures and changing climate; but as several speakers at this week’s conference pointed out, the outlook is for much worse as GBR takes shape, with a “super El Niño” event likely to test the infrastructure as never before.", "body_zh": "专家预测， 2027年大堡礁将发生火灾洗礼，可能出现的问题包括拍手列车和轨道到极端天气相关的压力\n\n大臣带来的好消息是，等待即将结束：至少在法律上，大不列颠铁路的建立可以在圣诞节前完成。 但是，随着一个重新国有化的行业在2027年面临新的风暴，铁路界的一些人想知道他们是否应该小心谨慎，他们想要的帽子。\n\n预计在十年的最后阶段，将撕毁铁路运行方式的立法正在上议院的最后阶段被咀嚼。 铁路大臣彼得·亨迪（ Peter Hendy ）本周在伦敦举行的一次行业会议上表示，在议会寒假之前，它现在有“获得皇家同意的公平机会” ，允许一个新的公平的机构全面控制英国的铁路，跨越轨道和雨水服务。\n\n大西部铁路将于12月进入政府稳定，其余的私人火车运营，东米德兰铁路， Avanti和CrossCountry ，将于明年国有化。\n\n正如政客和铁路老板所承认的那样，还有很多问题需要解决。 亨迪勋爵开启了铁路行业协会的会议，他将英格兰北部的每列火车都描述为“鼓掌” ；杰里米·韦斯特莱克，首席前基础设施经理Network Rail的ecutive在夏季延误高峰期的24小时内提出了两次出轨事件。\n\n在一个综合的国有化行业中，一些解决方案可能看起来更容易。 德比未来的大不列颠铁路（ GBR ）总部所在地现已选定，尽管目前尚不清楚有多少铁路领导人喜欢在那里露营，以及权力究竟在哪里。\n\n不会的，亨迪说，他是一个全能的“德比克里姆林宫” ，控制权主要交给区域董事总经理，迄今为止在西南部和东南部煽动了这一点。 对于Hendy来说，新结构的回报将是单一的问责点，并结束私有化下的“责任文化” ，其中合同使运营商与网络铁路对立，特别是在中断或延误的时候。\n\n暂时拟人化大堡礁i和谐的轨道和火车交易是Westlake和DFTO的首席执行官Alex Hynes ， DFTO是管理重新国有化火车服务的国家运营商", "body": "专家预测， 2027年大堡礁将发生火灾洗礼，可能出现的问题包括拍手列车和轨道到极端天气相关的压力\n\n大臣带来的好消息是，等待即将结束：至少在法律上，大不列颠铁路的建立可以在圣诞节前完成。 但是，随着一个重新国有化的行业在2027年面临新的风暴，铁路界的一些人想知道他们是否应该小心谨慎，他们想要的帽子。\n\n预计在十年的最后阶段，将撕毁铁路运行方式的立法正在上议院的最后阶段被咀嚼。 铁路大臣彼得·亨迪（ Peter Hendy ）本周在伦敦举行的一次行业会议上表示，在议会寒假之前，它现在有“获得皇家同意的公平机会” ，允许一个新的公平的机构全面控制英国的铁路，跨越轨道和雨水服务。\n\n大西部铁路将于12月进入政府稳定，其余的私人火车运营，东米德兰铁路， Avanti和CrossCountry ，将于明年国有化。\n\n正如政客和铁路老板所承认的那样，还有很多问题需要解决。 亨迪勋爵开启了铁路行业协会的会议，他将英格兰北部的每列火车都描述为“鼓掌” ；杰里米·韦斯特莱克，首席前基础设施经理Network Rail的ecutive在夏季延误高峰期的24小时内提出了两次出轨事件。\n\n在一个综合的国有化行业中，一些解决方案可能看起来更容易。 德比未来的大不列颠铁路（ GBR ）总部所在地现已选定，尽管目前尚不清楚有多少铁路领导人喜欢在那里露营，以及权力究竟在哪里。\n\n不会的，亨迪说，他是一个全能的“德比克里姆林宫” ，控制权主要交给区域董事总经理，迄今为止在西南部和东南部煽动了这一点。 对于Hendy来说，新结构的回报将是单一的问责点，并结束私有化下的“责任文化” ，其中合同使运营商与网络铁路对立，特别是在中断或延误的时候。\n\n暂时拟人化大堡礁i和谐的轨道和火车交易是Westlake和DFTO的首席执行官Alex Hynes ， DFTO是管理重新国有化火车服务的国家运营商", "link": "https://www.theguardian.com/business/2026/nov/07/great-british-railways-new-dawn-for-a-new-network-but-with-plenty-of-old-problems-to-fix", "time": "11月07日 21:00", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}, {"title_orig": "‘Very strange, very sad’: Paraguay bank collapse fells a presidency and leaves millions broke", "title_zh": "“非常奇怪，非常悲伤” ：巴拉圭银行倒闭导致总统职位下台，数百万人破产", "summary_orig": "Santiago Peña charged over alleged role in crisis as prosecutors request he be placed in preventive custody Pedro Volpe had just woken up last Tuesday when he saw a message from a friend asking whether his bank account was down too. It was a day after payday, and Volpe, 50, a writer and lawyer, opened his banking app and panicked: he could not even see his balance. Continue reading...", "summary_zh": "圣地亚哥·佩尼亚（ Santiago Peña ）因涉嫌在危机中扮演角色而被起诉，因为检察官要求将他置于预防性监护之下，佩德罗·沃尔普（ Pedro Volpe ）上周二刚刚醒来，当时他看到一位朋友发来的一条消息，询问他的银行账户是否也就在发薪日的第二天， 50岁的作家兼律师沃尔普打开了银行应用程序，惊慌失措：他甚至看不到自己的余额。继续阅读……", "body_orig": "Santiago Peña charged over alleged role in crisis as prosecutors request he be placed in preventive custody\n\nPedro Volpe had just woken up last Tuesday when he saw a message from a friend asking whether his bank account was down too.\n\nIt was a day after payday, and Volpe, 50, a writer and lawyer, opened his banking app and panicked: he could not even see his balance.\n\nVolpe was among nearly 3 million Paraguayans, about 60% of the country’s adult population, whose accounts had been frozen overnight. All were customers of Ueno Bank, a digital lender that aggressively expanded across the South American country in recent years, and which, on Monday night, the central bank ordered into resolution over insolvency.\n\nUeno is at the centre of a political and economic crisis that has brought Paraguay’s banking system to the brink of collapse. On Friday, it led to the impeachment and house arrest of the rightwing president, Santiago Peña.\n\nPeña had resigned the day before in a vain attempt to retain the special jurisdiction afforded to former presidents – who, under the constitution, become senators for life. Lawmakers stripped him of the seat anyway, meaning Peña will face criminal proceedings in the ordinary courts.\n\nParaguayan prosecutors on Saturday brought charges against Peña for his alleged role in a banking crisis and requested he be placed in preventive custody.\n\n“The public prosecutor’s office has filed charges against the former president of the Republic, Mr Santiago Peña,” prosecutor Nancy Salomon told a press conference, accusing him of “breach of trust and administration for personal gain.”\n\nIn just a few days, he went from being a market favourite among Latin American presidents and one of Donald Trump’s key allies in the region to facing fierce mass protests, being voted out and placed under house arrest.\n\nThe now former president is the subject of an investigation by the public prosecutor’s office over alleged favouritism towards Ueno, which, in just a few years since Peña took office in 2023, went from an obscure digital lender to the bank of choice for most Paraguayans.\n\n“It was very easy to use and to open an account,” said Volpe, recalling that everything could be done quickly on a mobile phone. The bank also offered far more generous investment returns than its competitors did.\n\n“Now I’m having to work miracles to pay my bills,” added Volpe. “A lot of people can’t even afford basic everyday things like food; luckily, I still had some money saved elsewhere, but that has only got me this far. I don’t know what I’ll do next week.”\n\nUeno was so popular – sponsoring the national football team, the league and the country’s biggest football clubs – and served such a large share of the population that businesses have already reported an overall fall in sales of up to 80% this week.\n\nMedia outlets belonging to the same financial group as the bank had their operations suspended, including radio stations and the century-old newspaper La Tribuna.\n\nThe impact on ordinary Paraguayans was perhaps even wider reaching. The media freeze meant 300 workers had their salaries suspended, initially for 90 days. About 32,000 pensioners whose public pension funds had been invested in the bank were left without payments.\n\n“A lot of people are also not working because they can’t get paid or make payments,” said the historian and political analyst Fabián Chamorro. “Meanwhile, the protests were growing every day, and Peña’s impeachment was the way congress found to prevent a popular explosion.”\n\nA former finance minister and ex-employee of the central bank and the International Monetary Fund, Peña was elected by promising to restore a “great Paraguay” and attract foreign investment.\n\nSoon after taking office at age 44 as the youngest president in Paraguay’s democratic history, he appointed Carlos Carvallo Spalding, who had until then been Ueno’s chief executive, to lead the central bank. Less than three months later, Spalding authorised Ueno, then a finance company, to become a digital bank.\n\nPeña himself had about $1m in shares he bought in 2019 in a company that would become Ueno Holding in 2022, the parent company of the conglomerate that controlled Ueno Bank. Even after becoming president, he only disposed of the shares in April 2025. He said he had bought them purely as an “investor”.\n\n“During Peña’s administration, Ueno began receiving various benefits, and the government relaxed the rules to allow public funds to be invested in the bank,” said Chamorro. An estimated $800m to $860m in state and pension funds were invested in Ueno.\n\nA series of internal central bank reports pointing to irregularities – including loans to companies within the same group – were revealed by local media in recent months but Peña dismissed them as a “false media campaign” against his government.\n\nWith the bank having less than half the solvency required to meet its obligations, the central bank ordered it into resolution only after mounting pressure from other banks and opposition lawmakers.\n\nSpalding resigned and, like Peña, was ordered arrested on Friday night. During the week, police had already arrested eight senior executives and directors of Ueno and its controlling group on suspicion of concealing the bank’s deteriorating financial position for months.\n\nThe public prosecutor’s office is investigating Peña on suspicion of illicit enrichment, money laundering and influence peddling. He denies all the allegations, and his lawyers said there is no evidence he directed the allocation of pension funds to the bank.\n\nMeanwhile, most affected people still have no access to their own money.\n\nA guarantee fund covers deposits of up to $38,000, which would apply to more than 90% of individual account holders. On Friday, the central bank began making payments to customers with up to $1,565, no outstanding debts and an existing account at another institution.\n\nPaola Benítez, a 25-year-old chef from the capital, Asunción, met all three requirements, but by late Friday afternoon had not yet recovered the money she had been saving for her wedding.\n\n“This has made me a bit anxious, a bit desperate too, because honestly, who am I supposed to go to and ask about this? It’s very strange, very confusing, very sad,” she said.", "body_zh": "圣地亚哥·佩尼亚（ Santiago Peña ）因涉嫌在危机中发挥作用而被起诉，因为检察官要求对他进行预防性拘留\n\n佩德罗·沃尔普（ Pedro Volpe ）上周二刚刚醒来，就看到一位朋友发来的一条消息，询问 reme weather during this year’s super El Niño event Banana producers in Latin America are calling for better pay to help cope with the impact of the climate crisis, as they face big drops in production resulting from extreme weather during this year’s super El Niño event. High winds in parts of Colombia, one of the biggest suppliers to the UK market where droughts are predicted in some regions this year, and heavy rainfall in Peru and Ecuador are already affecting production, according to the Fairtrade Foundation ethical trade body. In the Dominican Republic, farmers are expected to face drought conditions, with forecasts of drier and warmer than usual conditions. Continue reading...", "summary_zh": "农民在今年的超级厄尔尼诺现象期间面临极端天气导致的产量大幅下降拉丁美洲的香蕉生产商呼吁提高工资，以帮助应对气候危机的影响，因为他们在今年的超级厄尔尼诺现象期间面临极端天气导致的产量大幅下降。哥伦比亚部分地区的大风，这是英国市场最大的供应商之一，预计今年一些地区将出现干旱，根据公平贸易基金会道德贸易机构的数据，秘鲁和厄瓜多尔的强降雨已经影响到生产。在多米尼加共和国，预计农民将面临干旱状况，预计干旱和温暖状况将比平时更严重。继续阅读...", "body_orig": "Farmers face big drop in production from extreme weather during this year’s super El Niño event\n\nBanana producers in Latin America are calling for better pay to help cope with the impact of the climate crisis, as they face big drops in production resulting from extreme weather during this year’s super El Niño event.\n\nHigh winds in parts of Colombia, one of the biggest suppliers to the UK market where droughts are predicted in some regions this year, and heavy rainfall in Peru and Ecuador are already affecting production, according to the Fairtrade Foundation ethical trade body. In the Dominican Republic, farmers are expected to face drought conditions, with forecasts of drier and warmer than usual conditions.\n\nFairtrade research suggests that during the previous El Niño cycle, productivity across its farmers and workers dropped by 13% in the Dominican Republic, 22% in Ecuador, and 6% in Peru compared with the year before. The El Niño event in 1983 – one of the strongest ever recorded – affected 15% of total planted banana area in Ecuador, with a reduction in exports of 36%.\n\nDr Carley-Jane Stanton, a climate and environment lead at Fairtrade, says this El Niño is expected to lead to more extreme weather, including heavy rainfall and strong winds and “we expect the impacts for producers to be more severe” than in the 23-24 cycle.\n\nEvidence is mounting to fuel those fears. Exports from the Colombian Caribbean region fell 32% to $122m (£91m) between July and September this year, according to the Association of Banana Growers of Magdalena and La Guajira, as reported by the trade publication Fruitnet.\n\nIt said that in September alone, shipments were down 42% year on year, with earnings close to halving to $40m from $70m.\n\n“Given the risks threatening the continuity of banana production, we are calling on international markets to foster commercial conditions that recognise actual production costs and contribute to the sector’s sustainability,” the association said.\n\nIt said that climate-related productivity losses and a decline in earnings from exports made worse by currency issues was “undermining the economic sustainability of the industry”.\n\nEver Antonio Flores Muños, a worker at the Agrosiete banana producer in Colombia, told Fairtrade: “Over the past 10 years the climate has changed a lot. It’s been getting much hotter … it’s really intense. Some places have had losses due to the climate, flooding, strong winds. It’s going to affect all of us – our workers, colleagues – everything will be at great risk, and our wages will decrease.”\n\nFairtrade is calling for legislation in the UK to tackle unfair trading practices, such as low or late payments to farmers and contracts which push risk down the supply chain, so that producers can invest more into improving their crops’ resilience to severe weather and more likelihood of pests and diseases. Worker health is also expected to be affected by more extreme weather.\n\nWhile some businesses, including Sainsbury’s, the Co-op and Waitrose, have taken voluntary steps by sourcing only Faitrade bananas, which guarantee a minimum price, it says there is more work to do.\n\nEleanor Harrison, the chief executive of Fairtade, said: “The UK’s banana supply depends on the people growing our bananas having the resources they need to adapt to climate change, and to invest in their future. Fair prices, climate resilience and decent work go hand in hand.”\n\nWhile bananas are becoming harder and more expensive to produce, supermarket prices have remained unchanged for almost 40 years despite rising costs for fertiliser, fuel and labour.\n\nCaoimhe Buckley, the chief corporate affairs officer at the large supplier Fyffes, said: “The long-term sustainability of the banana sector … cannot be separated from purchasing practices. The price of bananas in the supermarket needs to recognise the real and sustainable cost of production, including labour and decent wages, environmental management, human-rights due diligence and the investment necessary to adapt to climate change.”\n\nResearch by the Ethical Trading Initiative found that prices paid to suppliers in 2026 did not even cover basic production costs for 66.7% of them.\n\nIt said producers need more help to adapt or mitigate climatic changes, which could mean suitable land for banana cultivation could shrink by an average of 61% across Latin America and the Caribbean by 2050, according to research for the Inter-American Development Bank published in 2020.", "body_zh": "在今年的超级厄尔尼诺现象期间，农民面临极端天气导致的产量大幅下降\n\n拉丁美洲的香蕉生产商呼吁提高工资，以帮助应对气候危机的影响，因为他们在今年的超级厄尔尼诺现象期间面临极端天气导致的产量大幅下降。\n\n哥伦比亚部分地区的大风，这是英国市场最大的供应商之一，预计一些地区会出现干旱，根据公平贸易基金会道德贸易机构的数据，秘鲁和厄瓜多尔的暴雨已经影响到生产。 在多米尼加共和国，预计农民将面临干旱状况，预计干旱和温暖状况将比平时更严重。\n\n公平贸易研究表明，在上一个厄尔尼诺现象周期中，多米尼加共和国的农民和工人的生产率下降了13% ，厄瓜多尔下降了22% ，秘鲁与前一年相比。 1983年的厄尔尼诺现象--有史以来最严重的厄尔尼诺现象之一--影响了厄瓜多尔15%的香蕉种植面积，出口减少了36%。\n\n公平贸易气候和环境负责人Carley-Jane Stanton博士表示，预计厄尔尼诺现象将导致更极端的天气，包括大雨和强风， “我们预计对生产者的影响将比23-24周期更严重”。越来越多的证据加剧了这些担忧。 据贸易出版物Fruitnet报道，根据马格达莱纳和瓜希拉香蕉种植者协会的数据，今年7月至9月，哥伦比亚加勒比地区的出口额下降32% ，至1.22亿美元（ 9100万英镑）。\n\n该公司表示，仅在9月份，出货量同比下降42% ，盈利从7000万美元降至近4000万美元。\n\n“考虑到威胁香蕉延续性的风险我们呼吁国际市场培育认识到实际生产成本的商业条件，并为该行业的可持续性做出贡献， ”该协会表示。\n\n它表示，与气候相关的生产力损失和出口收入的下降因货币问题而恶化， “破坏了该行业的经济可持续性”。\n\nEver Antonio Flores Muños ， C区Agrosiete香蕉生产商的工人olombia告诉公平贸易： “在过去的10年里，气候发生了很大变化。天气越来越热了……真的很激烈。有些地方", "body": "在今年的超级厄尔尼诺现象期间，农民面临极端天气导致的产量大幅下降\n\n拉丁美洲的香蕉生产商呼吁提高工资，以帮助应对气候危机的影响，因为他们在今年的超级厄尔尼诺现象期间面临极端天气导致的产量大幅下降。\n\n哥伦比亚部分地区的大风，这是英国市场最大的供应商之一，预计一些地区会出现干旱，根据公平贸易基金会道德贸易机构的数据，秘鲁和厄瓜多尔的暴雨已经影响到生产。 在多米尼加共和国，预计农民将面临干旱状况，预计干旱和温暖状况将比平时更严重。\n\n公平贸易研究表明，在上一个厄尔尼诺现象周期中，多米尼加共和国的农民和工人的生产率下降了13% ，厄瓜多尔下降了22% ，秘鲁与前一年相比。 1983年的厄尔尼诺现象--有史以来最严重的厄尔尼诺现象之一--影响了厄瓜多尔15%的香蕉种植面积，出口减少了36%。\n\n公平贸易气候和环境负责人Carley-Jane Stanton博士表示，预计厄尔尼诺现象将导致更极端的天气，包括大雨和强风， “我们预计对生产者的影响将比23-24周期更严重”。越来越多的证据加剧了这些担忧。 据贸易出版物Fruitnet报道，根据马格达莱纳和瓜希拉香蕉种植者协会的数据，今年7月至9月，哥伦比亚加勒比地区的出口额下降32% ，至1.22亿美元（ 9100万英镑）。\n\n该公司表示，仅在9月份，出货量同比下降42% ，盈利从7000万美元降至近4000万美元。\n\n“考虑到威胁香蕉延续性的风险我们呼吁国际市场培育认识到实际生产成本的商业条件，并为该行业的可持续性做出贡献， ”该协会表示。\n\n它表示，与气候相关的生产力损失和出口收入的下降因货币问题而恶化， “破坏了该行业的经济可持续性”。\n\nEver Antonio Flores Muños ， C区Agrosiete香蕉生产商的工人olombia告诉公平贸易： “在过去的10年里，气候发生了很大变化。天气越来越热了……真的很激烈。有些地方", "link": "https://www.theguardian.com/business/2026/nov/08/banana-producers-in-latin-america-want-better-pay-to-cope-with-effects-of-climate-crisis", "time": "11月08日 15:00", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}]}, {"key": "npr_biz", "name": "美国公共广播财经节目", "lang": "英文", "tab_note": "本页嵌免费全文（本轮亲测多篇可完整阅读，含中文对照）", "free_mark": "full_verified", "error": null, "items": [{"title_orig": "The Cybertruck's 'cause of death?' Insufficient demand", "title_zh": "赛博卡车的“死因？”需求不足", "summary_orig": "One of the most polarizing vehicles to hit the road will soon be a thing of history. Tesla will wind down manufacturing of its Cybertruck at the company's Gigafactory Texas mid-next year.", "summary_zh": "上路的最两极分化的车辆之一将很快成为历史。明年年中，特斯拉将在德克萨斯州的Gigafactory工厂停产Cybertruck。", "body_orig": "One of the most polarizing vehicles to hit the r
