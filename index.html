in’s largest windfarm – from green sources. But when the Guardian raised questions about the pledge , it said the arrangement was “subject to final commercial agreements, planning, grid and consenting processes”. Continue reading...", "summary_zh": "DataVita已修订了Chapelhall开发计划，完全由1GW的可再生能源供电。一家数据中心公司表示，它将用可再生能源为格拉斯哥附近的大规模人工智能开发提供动力，该公司承认，该计划将完全由国家电网提供服务。DataVita是英国人工智能战略的关键板块，它曾承诺拉纳克郡项目将消耗1GW--相当于一座小型核反应堆或英国最大的风电场–来自绿色来源。但当《卫报》对这一承诺提出质疑时，它表示，这一安排“取决于最终的商业协议、规划、电网和同意程序”。继续阅读……", "body_orig": "DataVita has revised plan for Chapelhall development to be wholly powered by 1GW of renewable energy\n\nA datacentre company that said it would power a massive AI development near Glasgow with renewable energy has admitted that the scheme will be entirely served by the National Grid.\n\nDataVita, a key plank of the UK’s AI strategy, had promised that the Lanarkshire project would draw 1GW – the equivalent output of a small nuclear reactor, or Britain’s largest windfarm – from green sources. But when the Guardian raised questions about the pledge, it said the arrangement was “subject to final commercial agreements, planning, grid and consenting processes”.\n\nNow, the company, which says its proposals would transform the economy of the village of Chapelhall, outside Airdrie, has quietly revised the plan. It now says the datacentres will be “fully grid served” with the possibility that solar and windfarms “could connect in the future”.\n\nDataVita says the power it draws from the grid will be largely renewable energy. The company remains in receipt of £202m of public money in the form of wealth guarantees from Britain’s national wealth fund.\n\nWhile the shift may appear to have been inevitable given the implausibility of the claimed renewables provision, it could present a problem for both DataVita and Britain’s AI strategy.\n\nUnder the former prime minister Keir Starmer, Britain’s AI strategy was to build massive datacentres in zones across the country. Their developers would get incentives – including, potentially, discounts on energy and expedited planning approvals. DataVita was to build one of the key developments associated with this strategy, an “AI growth zone” in Lanarkshire.\n\nBut this strategy began to founder just over a year after it was announced, when the Guardian’s investigations demonstrated that there was little solidity behind many announced plans.\n\nAI datacentres are some of the most energy-intensive structures humanity has ever built, and energy costs are higher in Britain than in most of Europe. There is a years-long wait for the UK developments to connect to the grid.\n\nTwo key UK AI investments – announced with great fanfare by Starmer’s government – are on shaky ground after questions emerged over their ability to power themselves, or pay the high energy costs necessary to realise their stated ambitions. Now DataVita, which was supposed to bring 3,400 jobs to Lanarkshire by building a 500MW datacentre, also appears to be backtracking on its energy plans.\n\nIn a response to the Guardian, the company said it had not misrepresented its intention to supply renewables to the site earlier this year. “Our commitment to renewable energy is unchanged,” said a spokesperson. However, they added: “Our datacentres are being designed to be grid served … Our grid supply will be through a renewable power purchase agreement.”\n\nThis appears to contradict an earlier announcement, in which the company said: “More than 1GW of renewable energy capacity, including wind, solar, and battery storage, will be delivered through private wire connections directly linked to the datacentres.”\n\nDataVita left open the possibility that its datacentres would connect to renewable energy in the future, through a wind and solar park it proposes to build in North Lanarkshire.\n\nKat Jones, the director of the Edinburgh-based charity Action to Protect Rural Scotland, said DataVita’s apparent change in direction was “emblematic of the hyperbolic claims being made by datacentre developers in Scotland”.\n\n“Hyperscale AI datacentres simply cannot run on renewable power alone, they absolutely need a highly reliable source of grid power,” she said. “It is not surprising that the goalposts have now changed.”", "body_zh": "DataVita已修订Chapelhall开发计划，完全由1GW的可再生能源供电\n\n一家数据中心公司表示，它将利用可再生能源为格拉斯哥附近的大规模人工智能开发提供动力，该公司承认，该计划将完全由国家电网提供服务。\n\nDataVita是英国人工智能战略的关键板块，它曾承诺拉纳克郡项目将耗电1GW ，相当于一座小型核反应堆或英国最大的风电场–来自绿色资源。 但当《卫报》对这一承诺提出质疑时，它表示，这一安排“取决于最终的商业协议、规划、电网和同意程序”。\n\n现在，该公司表示，其提案将改变Airdrie郊外的Chapelhall村的经济，该公司已悄悄修改了该计划。 它现在表示，数据中心将“完全网格化” ，太阳能和风电场“将来可能会连接起来”。\n\nDataVita表示，它从电网中获取的电力将主要来自可再生能源。 该公司仍然收到英国国家财富基金以财富担保形式提供的2.02亿英镑公共资金。\n\n虽然鉴于所声称的可再生能源供应的不可信度，这种转变似乎是不可避免的，但它可能会给DataVita和英国的人工智能战略带来问题。\n\n在for下英国首相凯尔·斯塔默（ Keir Starmer ）表示，英国的人工智能战略是在全国各地建立大规模的数据中心。 他们的开发商将获得激励--包括潜在的能源折扣和加快规划审批。 DataVita将建立与该战略相关的关键发展之一，即拉纳克郡的“人工智能增长区”。\n\n但这一策略在宣布一年多后才开始创立，当时《卫报》的调查表明，许多宣布的计划背后几乎没有坚实性。\n\n人工智能数据中心是人类有史以来建造的最能源密集型结构之一，英国的能源成本高于欧洲大部分地区。 英国的发展项目要连接到电网需要等待多年。\n\nStarmer政府大张旗鼓地宣布的两项关键的英国人工智能投资，在他们有能力为自己提供动力，或支付实现其既定目标所需的高昂能源成本。现在DataVita ，它应该带来3", "body": "DataVita已修订Chapelhall开发计划，完全由1GW的可再生能源供电\n\n一家数据中心公司表示，它将利用可再生能源为格拉斯哥附近的大规模人工智能开发提供动力，该公司承认，该计划将完全由国家电网提供服务。\n\nDataVita是英国人工智能战略的关键板块，它曾承诺拉纳克郡项目将耗电1GW ，相当于一座小型核反应堆或英国最大的风电场–来自绿色资源。 但当《卫报》对这一承诺提出质疑时，它表示，这一安排“取决于最终的商业协议、规划、电网和同意程序”。\n\n现在，该公司表示，其提案将改变Airdrie郊外的Chapelhall村的经济，该公司已悄悄修改了该计划。 它现在表示，数据中心将“完全网格化” ，太阳能和风电场“将来可能会连接起来”。\n\nDataVita表示，它从电网中获取的电力将主要来自可再生能源。 该公司仍然收到英国国家财富基金以财富担保形式提供的2.02亿英镑公共资金。\n\n虽然鉴于所声称的可再生能源供应的不可信度，这种转变似乎是不可避免的，但它可能会给DataVita和英国的人工智能战略带来问题。\n\n在for下英国首相凯尔·斯塔默（ Keir Starmer ）表示，英国的人工智能战略是在全国各地建立大规模的数据中心。 他们的开发商将获得激励--包括潜在的能源折扣和加快规划审批。 DataVita将建立与该战略相关的关键发展之一，即拉纳克郡的“人工智能增长区”。\n\n但这一策略在宣布一年多后才开始创立，当时《卫报》的调查表明，许多宣布的计划背后几乎没有坚实性。\n\n人工智能数据中心是人类有史以来建造的最能源密集型结构之一，英国的能源成本高于欧洲大部分地区。 英国的发展项目要连接到电网需要等待多年。\n\nStarmer政府大张旗鼓地宣布的两项关键的英国人工智能投资，在他们有能力为自己提供动力，或支付实现其既定目标所需的高昂能源成本。现在DataVita ，它应该带来3", "link": "https://www.theguardian.com/uk-news/2026/nov/07/lanarkshire-ai-datacentre-datavita-chapelhall-national-grid-renewable-energy", "time": "11月07日 18:00", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}, {"title_orig": "Reform UK councillor promoted collapsed $1.9bn ‘Ponzi scheme’ HyperVerse that left victims suicidal", "title_zh": "改革英国议员推动的19亿美元“庞氏骗局” HyperVerse崩溃，使受害者自杀", "summary_orig": "Susan Lawrence, elected to Wolverhampton city council, sits on committee overseeing financial reporting of multimillion-pound budget A woman who promoted a notorious cryptocurrency scam has been elected as a Reform UK councillor and now sits on the audit and risk committee of a major city council. Susan Lawrence was one of the main UK promoters of the HyperVerse cryptocurrency scheme, which was named in US court documents as an alleged “pyramid and Ponzi scheme” that cheated investors worldwide out of a “staggering” $1.89bn (£1.41bn). Continue reading...", "summary_zh": "苏珊·劳伦斯（ Susan Lawrence ）当选为伍尔弗汉普顿市议会成员，是监督数百万英镑预算财务报告的委员会成员。一位推动臭名昭著的加密货币骗局的女性当选为改革英国议员，现在是主要市议会的审计和风险委员会成员。Susan Lawrence是HyperVerse加密货币计划的主要英国发起人之一，该计划在美国法院文件中被称为nd庞氏骗局”，欺骗了全球投资者的“惊人”$ 18.9亿（ £ 14.1亿）。继续阅读...", "body_orig": "Susan Lawrence, elected to Wolverhampton city council, sits on committee overseeing financial reporting of multimillion-pound budget\n\nA woman who promoted a notorious cryptocurrency scam has been elected as a Reform UK councillor and now sits on the audit and risk committee of a major city council.\n\nSusan Lawrence was one of the main UK promoters of the HyperVerse cryptocurrency scheme, which was named in US court documents as an alleged “pyramid and Ponzi scheme” that cheated investors worldwide out of a “staggering” $1.89bn (£1.41bn).\n\nThe HyperVerse scheme spread through the US and the UK from 2020 to 2022, and also targeted investors in developing countries across Asia, Africa and the Pacific before its eventual collapse left many people unable to access funds.\n\nIn some cases, people who took out bank loans to buy packages in the scheme said they felt suicidal when they were unable to withdraw their money, with some cases of self-harm.\n\nLawrence is now a Reform councillor on Wolverhampton city council and sits on the authority’s audit and risk committee, which independently reviews governance and risk management and oversees the financial reporting relating to a multimillion-pound budget.\n\nLawrence, who has not personally been accused of wrongdoing by authorities, promoted the HyperVerse scheme, or later variations of it, even after the UK’s Financial Conduct Authority (FCA) issued a consumer warning that the firm may have been promoting financial services or products without the regulator’s permission.\n\n“You should avoid dealing with this firm and beware of scams,” the FCA said in a 2021 warning.\n\nIn a 2022 presentation, Lawrence addressed members of the HyperVerse community who were concerned they could no longer access their invested funds.\n\nLawrence, who worked with a fraudster whose company was later forcibly shut down by the UK high court, participated in lengthy promotional videos and webinars to market the project to the public and recruit new participants.\n\nShe is also linked to various other cryptocurrency schemes that were promoted by HyperVerse’s alleged co-founder Sam Lee, an Australian bitcoin entrepreneur who moved to Dubai in 2021.\n\nLee was charged in the US in 2024 with both civil and criminal offences for his role in the HyperVerse schemes. He has denied all charges.\n\nLawrence travelled to Dubai to meet Lee, and was filmed promoting two other related investment schemes. She was also referred to as a “super leader” for one of Lee’s investment platforms called “Vidilook”. The status of a group participant is usually based on how many other people they recruit into the scheme.\n\nLawrence continued to promote iterations of the same network, including one that was later subject to a cease and desist order by US federal authorities which described it as a “fraudulent pyramid and Ponzi scheme”. US authorities said: “It does not sell or purport to sell any actual product and has no apparent source of revenue other than funds received from investors.”\n\nShe promoted the Ponzi schemes alongside Desmond Amey, the scams’ key UK-based promoter. The UK’s high court acted to shut down the company used by him to funnel millions of pounds into the platforms.\n\nLawrence did not respond when approached by the Guardian. A spokesperson for Reform UK said: “Cllr Lawrence was one of many victims of this scam, losing her pension and tens of thousands of pounds on a scheme she believed was genuine.\n\n“She later became involved with HyperNation in an attempt to recoup the money she had lost.\n\n“She was not employed by Des Amey and has not been questioned by any authority over her links. Cllr Lawrence has no current involvement in any of these companies or any similar schemes.”\n\nReform, which has been under renewed pressure over its vetting processes amid new allegations about the conduct of councillors and candidates, did not respond to a question about whether its vetting team had picked up on Lawrence’s background.", "body_zh": "苏珊·劳伦斯（ Susan Lawrence ）当选伍尔弗汉普顿市议会成员，是监督数百万英镑预算财务报告的委员会成员\n\n一名推动臭名昭著的加密货币骗局的女性当选为改革英国议员，现在是主要市议会的审计和风险委员会成员。\n\nSusan Lawrence是HyperVerse加密货币计划的英国主要发起人之一，该计划在美国法院文件中被称为和庞氏骗局”，欺骗了全球投资者的“惊人”$ 18.9亿（ £ 14.1亿）。\n\nHyperVerse计划从2020年到2022年在美国和英国蔓延，并在最终崩溃之前瞄准了亚洲、非洲和太平洋地区发展中国家的投资者，导致许多人无法获得资金。\n\n在某些情况下，在该计划中借银行贷款购买套餐的人表示，当他们无法o提取他们的钱，有一些自我伤害的案例。\n\n劳伦斯现在是伍尔弗汉普顿市议会的改革议员，也是该管理局审计和风险委员会的成员，该委员会独立审查治理和风险管理，并监督与数百万英镑预算有关的财务报告。\n\n劳伦斯本人没有被当局指控犯有不法行为，他推动了HyperVerse计划，或后来的变体，在英国金融行为监管局（ FCA ）发布消费者警告称，该公司可能在未经监管机构许可的情况下推广金融服务或产品。\n\n“你应该避免与这家公司打交道，小心诈骗，” FCA在2021年的一份警告中表示。\n\n在2022年的演讲中，劳伦斯向HyperVerse社区的成员发表讲话，他们担心自己无法再获得投资资金。\n\n劳伦斯，曾在其公司后来被英国高等法院强行关闭的欺诈者参与了冗长的宣传视频和网络研讨会，向公众推销该项目并招募新参与者。\n\n她还与HyperVerse的联合创始人Sam Lee推广的各种其他加密货币计划有关，后者是澳大利亚比特币企业家，于2021年移居迪拜。\n\nLee于2024年在美国被指控犯有民事和刑事罪因其在HyperVerse计划中的角色而被定罪。 他否认了所有指控。\n\n劳伦斯前往迪拜与李会面，并拍摄了两部", "body": "苏珊·劳伦斯（ Susan Lawrence ）当选伍尔弗汉普顿市议会成员，是监督数百万英镑预算财务报告的委员会成员\n\n一名推动臭名昭著的加密货币骗局的女性当选为改革英国议员，现在是主要市议会的审计和风险委员会成员。\n\nSusan Lawrence是HyperVerse加密货币计划的英国主要发起人之一，该计划在美国法院文件中被称为和庞氏骗局”，欺骗了全球投资者的“惊人”$ 18.9亿（ £ 14.1亿）。\n\nHyperVerse计划从2020年到2022年在美国和英国蔓延，并在最终崩溃之前瞄准了亚洲、非洲和太平洋地区发展中国家的投资者，导致许多人无法获得资金。\n\n在某些情况下，在该计划中借银行贷款购买套餐的人表示，当他们无法o提取他们的钱，有一些自我伤害的案例。\n\n劳伦斯现在是伍尔弗汉普顿市议会的改革议员，也是该管理局审计和风险委员会的成员，该委员会独立审查治理和风险管理，并监督与数百万英镑预算有关的财务报告。\n\n劳伦斯本人没有被当局指控犯有不法行为，他推动了HyperVerse计划，或后来的变体，在英国金融行为监管局（ FCA ）发布消费者警告称，该公司可能在未经监管机构许可的情况下推广金融服务或产品。\n\n“你应该避免与这家公司打交道，小心诈骗，” FCA在2021年的一份警告中表示。\n\n在2022年的演讲中，劳伦斯向HyperVerse社区的成员发表讲话，他们担心自己无法再获得投资资金。\n\n劳伦斯，曾在其公司后来被英国高等法院强行关闭的欺诈者参与了冗长的宣传视频和网络研讨会，向公众推销该项目并招募新参与者。\n\n她还与HyperVerse的联合创始人Sam Lee推广的各种其他加密货币计划有关，后者是澳大利亚比特币企业家，于2021年移居迪拜。\n\nLee于2024年在美国被指控犯有民事和刑事罪因其在HyperVerse计划中的角色而被定罪。 他否认了所有指控。\n\n劳伦斯前往迪拜与李会面，并拍摄了两部", "link": "https://www.theguardian.com/politics/2026/nov/07/reform-uk-councillor-promoted-alleged-ponzi-scheme-hyperverse", "time": "11月07日 15:00", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}, {"title_orig": "Job cuts, lost customers and a £22bn debt pile: what has gone wrong at Virgin Media O2?", "title_zh": "裁员、客户流失和220亿英镑的债务：维珍媒体O2出了什么问题？", "summary_orig": "The company has lost 182,000 broadband and 644,000 mobile customers in two years and is operating in an increasingly competitive market competition Mike Fries may be totting up swingeing job cuts, a £22bn debt pile and the loss of hundreds of thousands of customers, but he appears to be putting a brave face on the situation. “In our minds, anyway, this is not a crisis,” the boss of the co-owner of Virgin Media O2 said this week. The UK telecoms company, which offers broadband, TV, landline and mobile services, had just announced £800m in cost savings, including potentially cutting up to a quarter of staff. Fries, the chief executive of Liberty Global, faced searching questions on its future and a potential refinancing of its huge debt pile next year. “We made it clear, we have nothing to add to where we sit today,” he said. Continue reading...", "summary_zh": "该公司在两年内失去了182,000个宽带和644,000个移动客户，并且在竞争日益激烈的市场竞争中运营， Mike Fries可能正在加剧裁员， 220亿英镑的债务堆积和数十万客户的损失，但他似乎正在勇敢地面对这种情况。“无论如何，在我们看来，这不是一场危机，”维珍媒体O2的共同所有者老板本周表示。英国电信c提供宽带、电视、固定电话和移动服务的ompany刚刚宣布节省8亿英镑的成本，包括可能削减多达四分之一的员工。Liberty Global首席执行官弗里斯面临着有关其未来以及明年对其巨额债务进行再融资的潜在问题。他说： “我们已经明确表示，我们没有什么可以增加我们今天所处的位置。”继续阅读...", "body_orig": "The company has lost 182,000 broadband and 644,000 mobile customers in two years and is operating in an increasingly competitive market competition\n\nMike Fries may be totting up swingeing job cuts, a £22bn debt pile and the loss of hundreds of thousands of customers, but he appears to be putting a brave face on the situation. “In our minds, anyway, this is not a crisis,” the boss of the co-owner of Virgin Media O2 said this week.\n\nThe UK telecoms company, which offers broadband, TV, landline and mobile services, had just announced £800m in cost savings, including potentially cutting up to a quarter of staff. Fries, the chief executive of Liberty Global, faced searching questions on its future and a potential refinancing of its huge debt pile next year. “We made it clear, we have nothing to add to where we sit today,” he said.\n\nHowever, for the company’s 16,000 UK staff, the job cuts, and a raft of other measures including abandoning investing in upgrading its cable network to full fibre, are symptomatic of a business if not in crisis, then under extreme pressure. And it has left industry watchers wondering: what has gone wrong at Virgin Media O2?\n\nFive years ago, Virgin Media-owner Liberty Global and Telefónica, owner of mobile network O2, completed a £31bn mega-merger that paved the way for a new “national champion” to challenge BT. It represented the latest upheaval for a company defined by a deal to bring together cable firms NTL and Telewest with Sir Richard Branson’s Virgin Mobile for a 2007 rebrand.\n\nThe post-merger mission, however, has proved tougher than bullish management, led by Fries’s lieutenant, Lutz Schüler, perhaps expected.\n\nIn the last two years the company has lost 182,000 broadband and 644,000 mobile customers, although overall numbers still remain up since the merger, according to Enders Analysis.\n\nVMO2 is operating in a market that has seen an explosion of competition including the emergence of about 100 so-called alt-nets laying fibre networks, and BT’s belated decision to “build like fury” to replace its ageing copper lines. This fight for customers has kept prices low and put profitability and revenues under pressure.\n\n“There are challenges everywhere in telecoms, but at VMO2 a lot of the problems boil down to operational execution,” says one senior industry executive. “They once used Usain Bolt in ads to trumpet that they had the fastest speed broadband, now the cables they have in the ground are slower than competitors.\n\n“Marketing, pricing, customer service, IT, billing, set top boxes, you name it and they have just not been good at executing on strategy. Yes, it is a highly competitive industry but there has been a major executional problem.”\n\nIn July, Virgin Media was fined a record £28m by telecoms regulator Ofcom after an investigation found millions of calls made by customers between January 2022 and September 2024 were probably mishandled.\n\nThe investigation showed that Virgin Media, which has repeatedly been among Ofcom’s most complained about companies in its quarterly reports, used deliberate tactics to repeatedly prevent customers from cancelling their contracts and moving to a new supplier.\n\nLast year, its O2 mobile arm prompted a backlash after implementing a surprise monthly bill increase, 40% higher than customers had been informed when they signed up to their contracts.\n\nSchüler later admitted that the move, which he estimated resulted in the loss of about 110,000 customers and a rebuke from the then-chancellor, Rachel Reeves, “wasn’t the best decision”.\n\nA pledge to focus on improving customer service, and developments including a new voice AI agent to handle broadband fault calls, has paid off.\n\nIn its results earlier this week, the company pointed to Ofcom’s latest data showing significant reductions in complaints across its business, and the lowest of any leading broadband provider.\n\nSome industry sources argue the management style since the creation of VMO2 has had echoes of hard-nosed private equity tactics – £5bn has been paid to shareholders in dividends since the merger, according to filings. Those funds could have been ploughed into fixing problems, they say.\n\nOn the call with analysts this week, Fries pointed to the importance and focus of the UK operation’s management team who were “making extraordinary efforts to bring meaningful operating free cashflow to the business”.\n\nVMO2, which has invested £11bn in the UK since the merger, is expected to make £200m in free cashflow this year, and has significantly boosted profit margins from about 34% to just over 40% since the merger.\n\nSome analysts believe the timing of the cost-savings announcements, which also includes a potential deal with BT to use Openreach to extend its footprint from 19m to up to 25m homes, at least in part relates to VMO2’s outrage at recent decisions relating to deals in the sector.\n\nEarlier this month, VMO2, which declined to comment for this article, lashed out at a decision to fast-track BT’s £400m rescue of TalkTalk.\n\nAt the same time, the competition regulator had signalled that it might block the £2bn takeover of the UK’s second-largest altnet, Netomnia, by Nexfibre, whose investors include Liberty Global and Telefonica, which would thwart plans to challenge Openreach.\n\n“A number of audiences may be in mind in constructing [VMO2’s] statement,” said Karen Egan, managing director of telecoms at Enders Analysis. “The Liberty Global shareholders, the VMO2 bondholders, and those with potential influence over the Competition and Markets Authority’s decision on the Netomnia acquisition.”\n\nWhile multiple sources talk of tension between VMO2’s co-owners they argue that many of the issues facing the company date back to when cable licences were first awarded in 1984.\n\n“You could ask if anything has gone right since 1984,” said one TV industry executive. “The original sin was licensing 135 separate franchises with the ultimate endgame finally coming down to one in Virgin Media in 2007.\n\n“However, the end result was such a hotchpotch of systems and technologies it was easy to compete against, and they have never really fixed it, a problem the company is still dealing with today.\n\n“With the level of competition, telecoms services have become a commodity, hard to make money out of given the investment needed, and for VMO2 and the wider industry I don’t really see what turns that around.”", "body_zh": "该公司在两年内失去了182,000个宽带和644,000个移动客户，并在竞争日益激烈的市场竞争中运营\n\n迈克·弗里斯（ Mike Fries ）可能正在加紧裁员、220亿英镑的债务累积和数十万客户的流失，但他似乎正在勇敢地面对这种情况。 “无论如何，在我们看来，这不是一场危机，”维珍媒体O2的共同所有者老板本周表示。\n\n英国电信该公司提供宽带、电视、固定电话和移动服务，刚刚宣布节省8亿英镑的成本，包括可能削减多达四分之一的员工。 Liberty Global首席执行官弗里斯面临着有关其未来以及明年对其巨额债务进行再融资的潜在问题。 “我们明确表示，我们没有什么可以增加我们今天所处的位置，”他说。\n\n然而，对于该公司的16,000名英国员工来说，裁员一系列其他措施，包括放弃将其有线网络升级到全光纤的投资，如果没有陷入危机，那就是企业的症状，然后承受着极大的压力。 这让行业观察家们想知道：维珍媒体O2出了什么问题？\n\n五年前，维珍媒体的所有者Liberty Global和移动网络O2的所有者Telefónica完成了310亿英镑的巨额合并，为新的“全国冠军”的挑战铺平了道路。e BT。它代表了一家公司的最新动荡，该公司通过将有线电视公司NTL和Telewest与理查德·布兰森爵士（ Sir Richard Branson ）的维珍移动（ Virgin Mobile ）进行2007年品牌重塑的交易进行了定义。\n\n然而，事实证明，合并后的任务比弗里斯的中尉卢茨·舒勒（ Lutz Schüler ）领导的看涨管理更加艰难。\n\n在过去两年中，该公司失去了182,000个宽带和644,000个移动客户，尽管总体数字仍然是p根据Enders Analysis的数据，自合并以来。\n\nVMO2正在一个竞争激烈的市场中运营，包括大约100个所谓的alt-nets铺设光纤网络的出现，以及英国电信迟来的“像愤怒一样建造”以取代其老化的铜线的决定。 这场争夺客户的斗争使价格保持在低位，并使盈利能力和收入面临压力。\n\n“电信领域到处都存在挑战，但在VMO2中，问题可以归结为运营执行， ”一位行业高级管理人员说。“他们曾经在广告中使用Usain Bolt来吹嘘他们拥有", "body": "该公司在两年内失去了182,000个宽带和644,000个移动客户，并在竞争日益激烈的市场竞争中运营\n\n迈克·弗里斯（ Mike Fries ）可能正在加紧裁员、220亿英镑的债务累积和数十万客 of getting royal assent” before parliament’s winter break, allowing a new arm’s-length body with overall control of Britain’s railway, spanning the track and train services. Continue reading...", "summary_zh": "专家预测， 2027年大不列颠共和国将面临一场火灾洗礼，可能出现的问题包括拍手的火车和轨道，以及与极端天气有关的压力。部长带来的好消息是，等待即将结束：至少在法律上，大不列颠铁路的建立可以在圣诞节前结束。但是，随着一个重新国有化的行业在2027年面临新的风暴，铁路界的一些人想知道他们是否应该小心，在他们希望的时候。预计在十年的最后阶段，将撕毁铁路运行方式的立法正在上议院的最后阶段被咀嚼。铁路大臣彼得·亨迪（ Peter Hendy ）本周在伦敦举行的一次行业会议上表示，在议会寒假之前，它现在有“获得皇家同意的公平机会” ，允许一个新的公平的机构全面控制英国的铁路，跨越轨道和aIN服务。继续阅读...", "body_orig": "Experts predict a baptism of fire for GBR in 2027, with likely issues ranging from clapped-out trains and track to extreme weather-related stress\n\nThe glad tidings brought by the minister were that the wait was almost over: the establishment of Great British Railways could be wrapped up by Christmas, at least in law. But with a renationalised industry facing fresh storms in 2027, some in the railway world are wondering if they should be careful what they wish for.\n\nThe legislation that will rip up how rail has been run, anticipated for the best part of a decade, is being chewed over in its final stages in the House of Lords. It now has, the rail minister, Peter Hendy, told an industry conference in London this week, “a fair chance of getting royal assent” before parliament’s winter break, allowing a new arm’s-length body with overall control of Britain’s railway, spanning the track and train services.\n\nGreat Western Railway will come into the government stable in December, with the remaining private train operations, East Midland Railway, Avanti and CrossCountry, due to be nationalised next year.\n\nThere will be plenty to fix, as politicians and rail bosses acknowledged. Lord Hendy opened the Railway Industry Association’s conference by describing every train in the north of England as “clapped out”; Jeremy Westlake, the chief executive of infrastructure manager Network Rail, concluded the event by bringing up the two derailments in 24 hours at the peak of a summer of delays.\n\nSome of the solutions may appear easier within an integrated, nationalised industry. The site of the future Great British Railways (GBR) HQ in Derby has now been picked, even if it remains unclear how many of rail’s leaders fancy decamping there, and exactly where the power will lie.\n\nIt won’t be, said Hendy, an all-powerful “Kremlin in Derby”, with control instead largely given to regional managing directors, something so far instigated at South Western and Southeastern. For Hendy, the rewards of the new structure will be a single point of accountability, and the end of a “culture of blame” under privatisation where contracts pitted operators against Network Rail, especially in times of disruption or delay.\n\nPersonifying for now the GBR ideal of track and train in harmony are Westlake and Alex Hynes, the chief executive of DFTO, the state operator managing the renationalised train services, who discussed their bromance in another joint appearance on stage at the London conference. Hynes said he had told train staff to “go find your new best friend on the trackside … We try to role-model it.”\n\nIt remains to be seen if either will be for the chop next year, when the newly appointed chair of GBR, John Kingman, picks one overall integrated boss. The flip side of the road to reform and integration for some, especially non-frontline managerial staff, has been prolonged uncertainty, as roles merge or disappear.\n\nBut GBR should mean being able to move resources more easily around the railway, be it people or trains. Hendy cited Great Western’s problems with former Transport for Wales trains, which had deteriorated after being replaced in service: “There’s nothing more stupid than watching some trains halfway through their lives that have been parked in a field … miserably failing on a daily basis because the industry wasn’t coherent enough. You can’t believe how stupid that is.”\n\nLikewise, he said, most train companies “have been desperately short of drivers … That’s crackers. We can fix that – and I think it’s really important to fix those basic things. They will take time.”\n\nSome, though, wonder where the GBR legislation will land rail under future governments. One of the missions was to end the micromanagement of rail by central government: when the 73-year-old Hendy, a railwayman and politician, eventually steps away, the separation – or lack of it – may become clearer.\n\nHendy said GBR would at last give the railway a long-term strategy; opponents argue it does not bind it clearly enough. Others are worried that the Treasury could step in more than ever, threatening rail’s limited financial independence. Darren Caplan, the chief executive of the Railway Industry Association, said his organisation remained “very concerned that a future secretary of state could reopen five-year funding settlements, making funding even less certain”.\n\nRichard Holden, the Conservative shadow transport secretary, warned that rail could “lose out to the competing demands of that day [and] have to get in the queue. Will a new train win out over a new hospital? I doubt it.”\n\nOlly Glover, the transport spokesperson for the Lib Dems, who are more positive about the bill but also voted against it in its current form, said: “They’ve raised a lot of expectation as a result of so-called nationalisation. But the truth of it is the benefits will take time and are only going to materialise if the Treasury is willing to sanction more spending.”\n\nMoney has been tight, even though the railway hopes fare revenues are finally on track to match pre-pandemic income in the coming years. For now, the state of the railway has reflected spending on renewing it: cut from nearly £5bn a year to less than £4bn in the last five years, according to the regulator, the Office of Rail and Road. It was, said the ORR’s interim CEO, Feras Alshaker, “expected that its reliability would decline in the period”.\n\nAs record levels of compensation for delayed journeys this summer show, it certainly has. That level was compounded by the extreme temperatures and changing climate; but as several speakers at this week’s conference pointed out, the outlook is for much worse as GBR takes shape, with a “super El Niño” event likely to test the infrastructure as never before.", "body_zh": "专家预测， 2027年大堡礁将发生火灾洗礼，可能出现的问题包括拍手列车和轨道到极端天气相关的压力\n\n大臣带来的好消息是，等待即将结束：至少在法律上，大不列颠铁路的建立可以在圣诞节前完成。 但是，随着一个重新国有化的行业在2027年面临新的风暴，铁路界的一些人想知道他们是否应该小心谨慎，他们想要的帽子。\n\n预计在十年的最后阶段，将撕毁铁路运行方式的立法正在上议院的最后阶段被咀嚼。 铁路大臣彼得·亨迪（ Peter Hendy ）本周在伦敦举行的一次行业会议上表示，在议会寒假之前，它现在有“获得皇家同意的公平机会” ，允许一个新的公平的机构全面控制英国的铁路，跨越轨道和雨水服务。\n\n大西部铁路将于12月进入政府稳定，其余的私人火车运营，东米德兰铁路， Avanti和CrossCountry ，将于明年国有化。\n\n正如政客和铁路老板所承认的那样，还有很多问题需要解决。 亨迪勋爵开启了铁路行业协会的会议，他将英格兰北部的每列火车都描述为“鼓掌” ；杰里米·韦斯特莱克，首席前基础设施经理Network Rail的ecutive在夏季延误高峰期的24小时内提出了两次出轨事件。\n\n在一个综合的国有化行业中，一些解决方案可能看起来更容易。 德比未来的大不列颠铁路（ GBR ）总部所在地现已选定，尽管目前尚不清楚有多少铁路领导人喜欢在那里露营，以及权力究竟在哪里。\n\n不会的，亨迪说，他是一个全能的“德比克里姆林宫” ，控制权主要交给区域董事总经理，迄今为止在西南部和东南部煽动了这一点。 对于Hendy来说，新结构的回报将是单一的问责点，并结束私有化下的“责任文化” ，其中合同使运营商与网络铁路对立，特别是在中断或延误的时候。\n\n暂时拟人化大堡礁i和谐的轨道和火车交易是Westlake和DFTO的首席执行官Alex Hynes ， DFTO是管理重新国有化火车服务的国家运营商", "body": "专家预测， 2027年大堡礁将发生火灾洗礼，可能出现的问题包括拍手列车和轨道到极端天气相关的压力\n\n大臣带来的好消息是，等待即将结束：至少在法律上，大不列颠铁路的建立可以在圣诞节前完成。 但是，随着一个重新国有化的行业在2027年面临新的风暴，铁路界的一些人想知道他们是否应该小心谨慎，他们想要的帽子。\n\n预计在十年的最后阶段，将撕毁铁路运行方式的立法正在上议院的最后阶段被咀嚼。 铁路大臣彼得·亨迪（ Peter Hendy ）本周在伦敦举行的一次行业会议上表示，在议会寒假之前，它现在有“获得皇家同意的公平机会” ，允许一个新的公平的机构全面控制英国的铁路，跨越轨道和雨水服务。\n\n大西部铁路将于12月进入政府稳定，其余的私人火车运营，东米德兰铁路， Avanti和CrossCountry ，将于明年国有化。\n\n正如政客和铁路老板所承认的那样，还有很多问题需要解决。 亨迪勋爵开启了铁路行业协会的会议，他将英格兰北部的每列火车都描述为“鼓掌” ；杰里米·韦斯特莱克，首席前基础设施经理Network Rail的ecutive在夏季延误高峰期的24小时内提出了两次出轨事件。\n\n在一个综合的国有化行业中，一些解决方案可能看起来更容易。 德比未来的大不列颠铁路（ GBR ）总部所在地现已选定，尽管目前尚不清楚有多少铁路领导人喜欢在那里露营，以及权力究竟在哪里。\n\n不会的，亨迪说，他是一个全能的“德比克里姆林宫” ，控制权主要交给区域董事总经理，迄今为止在西南部和东南部煽动了这一点。 对于Hendy来说，新结构的回报将是单一的问责点，并结束私有化下的“责任文化” ，其中合同使运营商与网络铁路对立，特别是在中断或延误的时候。\n\n暂时拟人化大堡礁i和谐的轨道和火车交易是Westlake和DFTO的首席执行官Alex Hynes ， DFTO是管理重新国有化火车服务的国家运营商", "link": "https://www.theguardian.com/business/2026/nov/07/great-british-railways-new-dawn-for-a-new-network-but-with-plenty-of-old-problems-to-fix", "time": "11月07日 21:00", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}, {"title_orig": "Five European leaders call for closer EU-UK ties ahead of Brussels summit", "title_zh": "五位欧洲领导人呼吁在布鲁塞尔峰会之前加强欧盟与英国的关系", "summary_orig": "Germany, Belgium, Netherlands, Luxembourg and Denmark say cooperation on clean energy will benefit both sides Five European leaders have called for closer ties with Britain ahead of a keenly anticipated EU-UK summit. The leaders of Germany, Belgium, the Netherlands, Luxembourg and Denmark, said deeper cooperation on clean energy would benefit both sides in a letter to Ursula von der Leyen and António Costa. Continue reading...", "summary_zh": "德国、比利时、荷兰、卢森堡和丹麦表示，清洁能源合作将使双方受益。五位欧洲领导人呼吁在期待已久的欧盟-英国峰会之前与英国建立更紧密的联系。德国、比利时、荷兰、卢森堡和丹麦领导人在致乌苏拉·冯德莱恩和安东尼奥·科斯塔的一封信中表示，深化清洁能源合作将使双方受益。继续阅读...", "body_orig": "Germany, Belgium, Netherlands, Luxembourg and Denmark say cooperation on clean energy will benefit both sides\n\nFive European leaders have called for closer ties with Britain ahead of a keenly anticipated EU-UK summit.\n\nThe leaders of Germany, Belgium, the Netherlands, Luxembourg and Denmark, said deeper cooperation on clean energy would benefit both sides in a letter to Ursula von der Leyen and António Costa.\n\nVon der Leyen, the president of the European Commission, and Costa, who leads the European Council, will meet Andy Burnham on 20 November in Brussels, where they hope to sign deals on food and drink, carbon emissions and youth exchange.\n\nThe five countries also want the two sides to speed up work on another strand of negotiations: Britain’s return to the EU’s internal electricity market. “We call on you and the UK to agree during the summit on a path towards the conclusion of these negotiations,” states the letter seen by the Guardian from the German chancellor, Friedrich Merz; the Dutch prime minister, Rob Jetten; Belgium’s prime minister, Bart De Wever; Luc Frieden, the prime minister of Luxembourg; and Denmark’s prime minister, Mette Frederiksen.\n\nDescribing the UK as a “close partner in the energy transition”, the leaders said Britain’s integration into the EU’s internal electricity market was “necessary to unlock the full potential of the North Sea area and transform it into the largest clean energy hub in the world”.\n\nThe UK and nine other European countries signed a pact earlier this year to accelerate the rollout of offshore windfarms in the 2030s and build a power grid in the North Sea. Britain’s exit from the EU’s internal electricity market is seen as cramping the development of North Sea energy and adding to costs.\n\nBringing Britain into the internal electricity market could be controversial, however, because the UK would be required to make a contribution to the EU budget, specifically to cohesion funds that promote economic development in poorer regions. British officials are wary of a deal in which taxpayers’ money could be used to fund infrastructure projects in central and eastern Europe.\n\nLast year negotiations on Britain’s entry into a €150bn (£125bn) EU defence fund collapsed over a dispute about the size of the UK’s contribution.\n\nIn an attempt to head off another row over money, North Sea member states are stressing the potential for the deal to bring about lower and more stable energy prices for British billpayers. “The UK would not simply be paying into EU cohesion funds,” a EU diplomat said. “The UK would be investing in access to a more integrated, secure and competitive European energy market.\n\n“This will lead to more efficient electricity trading, resulting in lower costs for UK consumers.”\n\nAccording to figures from the industry body Energy UK, published in 2024, if the current energy relationship remains unchanged, Britain could pay extra costs of £10bn from 2024-29, through higher energy bills and lower Treasury revenues.\n\nThe industry group argues that Brexit barriers will become more significant over time, frustrating the UK’s potential to realise the full benefits of growth in offshore wind power.\n\nSince he became prime minister, Burnham has said the government would examine the options in the UK’s relationship with the EU, including a customs union, return to the single market or to “go all the way” with full membership.\n\nHowever, the EU’s former Brexit negotiator Michel Barnier has said the UK could not rejoin the single market “à la carte”. Speaking to the BBC’s Laura Kuenssberg, Barnier said: “I said very, very often during these negotiations, the Brexit, there is no cherry picking.\n\n“There will be no possibility to have one freedom and not the other. The four freedoms are clearly the four conditions to be inside a single market.”\n\nLabour MPs have supported calls for greater ties. Stella Creasy, the chair of the Labour Movement for Europe, who is campaigning for a de-facto second referendum to be included in the party’s next manifesto said there were “plenty of sensible changes” that could be done in the meantime.\n\nSpeaking to the BBC Today’s programme on Saturday, Creasy said: “Our exports are down because we know that it had hit our economy substantially to have left the European Union because you can fight many things in life, but geography really isn’t one of them.\n\n“The biggest trading bloc in the world is on our doorstep, and we walked out of it, which means that we now face a huge amount of friction to trade with them.”\n\nShe called recent comments by Burnham, who expressed a desire to form a closer relationship with the EU, as “telling the truth”.", "body_zh": "德国、比利时、荷兰、卢森堡和丹麦表示，清洁能源合作将使双方受益\n\n五位欧洲领导人呼吁在备受期待的欧盟-英国峰会之前与英国建立更紧密的联系。\n\n德国、比利时、荷兰、卢森堡和丹麦领导人在致乌苏拉·冯德莱恩和安东尼奥·科斯塔的一封信中表示，深化清洁能源合作将使双方受益。\n\n冯·德·莱恩（ Von der Leyen ） ，美国总统欧盟委员会和欧洲理事会负责人科斯塔将于11月20日在布鲁塞尔会见安迪·伯纳姆（ Andy Burnham ） ，他们希望在布鲁塞尔签署有关食品和饮料、碳排放和青年交流的协议。\n\n五国还希望双方加快另一方面的谈判工作：英国重返欧盟内部电力市场。 “我们呼吁您和英国在峰会期间就达成这些协议的途径达成一致。《卫报》看到了德国总理弗里德里希·默茨、荷兰首相罗布·杰滕、比利时首相巴特·德韦弗、卢森堡首相吕克·弗里登和丹麦首相梅特·弗雷德里克森的信。\n\n领导人将英国描述为“能源转型的密切合作伙伴” ，并表示英国融入欧盟内部电力市场是“解锁充分发挥北海地区的潜力，并将其转变为世界上最大的清洁能源中心。”\n\n今年早些时候，英国和其他九个欧洲国家签署了一项协议，以加快本世纪30年代海上风电场的部署，并在北海建立电网。 英国退出欧盟内部电力市场被视为限制了北海能源的发展并增加了成本。\n\n将英国带入国内经济然而，词汇市场可能存在争议，因为英国将被要求为欧盟预算做出贡献，特别是为促进贫困地区经济发展的凝聚力基金做出贡献。 英国官员对纳税人的钱可用于资助中欧和东欧的基础设施项目的交易持谨慎态度。\n\n去年，有关英国加入1500亿欧元（ 1250亿英镑）欧盟防务基金的谈判因关于英国贡献规模的争论。\n\n为了遏制另一场资金纠纷，北海成员国正在强调", "body": "德国、比利时、荷兰、卢森堡和丹麦表示，清洁能源合作将使双方受益\n\n五位欧洲领导人呼吁在备受期待的欧盟-英国峰会之前与英国建立更紧密的联系。\n\n德国、比利时、荷兰、卢森堡和丹麦领导人在致乌苏拉·冯德莱恩和安东尼奥·科斯塔的一封信中表示，深化清洁能源合作将使双方受益。\n\n冯·德·莱恩（ Von der Leyen ） ，美国总统欧盟委员会和欧洲理事会负责人科斯塔将于11月20日在布鲁塞尔会见安迪·伯纳姆（ Andy Burnham ） ，他们希望在布鲁塞尔签署有关食品和饮料、碳排放和青年交流的协议。\n\n五国还希望双方加快另一方面的谈判工作：英国重返欧盟内部电力市场。 “我们呼吁您和英国在峰会期间就达成这些协议的途径达成一致。《卫报》看到了德国总理弗里德里希·默茨、荷兰首相罗布·杰滕、比利时首相巴特·德韦弗、卢森堡首相吕克·弗里登和丹麦首相梅特·弗雷德里克森的信。\n\n领导人将英国描述为“能源转型的密切合作伙伴” ，并表示英国融入欧盟内部电力市场是“解锁充分发挥北海地区的潜力，并将其转变为世界上最大的清洁能源中心。”\n\n今年早些时候，英国和其他九个欧洲国家签署了一项协议，以加快本世纪30年代海上风电场的部署，并在北海建立电网。 英国退出欧盟内部电力市场被视为限制了北海能源的发展并增加了成本。\n\n将英国带入国内经济然而，词汇市场可能存在争议，因为英国将被要求为欧盟预算做出贡献，特别是为促进贫困地区经济发展的凝聚力基金做出贡献。 英国官员对纳税人的钱可用于资助中欧和东欧的基础设施项目的交易持谨慎态度。\n\n去年，有关英国加入1500亿欧元（ 1250亿英镑）欧盟防务基金的谈判因关于英国贡献规模的争论。\n\n为了遏制另一场资金纠纷，北海成员国正在强调", "link": "https://www.theguardian.com/world/2026/nov/07/europe-leaders-call-closer-eu-uk-ties-brussels-summit", "time": "11月07日 23:30", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}, {"title_orig": "Gotta buy ’em all: how Pokémon card collecting became race against scalpers", "title_zh": "全部买下：收集精灵宝可梦卡牌是如何变成与黄牛赛跑的", "summary_orig": "Fans trying to access latest releases are being priced out in a cut-throat market driven by crypto-like hype The runaway demand for Pokemon cards is because they are being hyped “like crypto”, according to one young fan who had spent the night queueing outside a London store to make sure he did not miss out on the latest card release. Before its 10am opening on Friday, the line outside the pop culture store Forbidden Planet in central London snaked past five others and, despite its strict sales policy, was probably “50/50” fans and resellers, said Kai, who had been there since 3am. Continue reading...", "summary_zh": "一位年轻的粉丝曾在伦敦一家商店外排队，以确保自己不会错过最新的卡片发行。据一位年轻的粉丝说，试图访问最新版本的粉丝在一个由加密货币般的炒作推动的残酷市场中被定价。对口袋妖怪卡片的失控需求是因为它们被炒作“像加密货币一样”。在周五上午10点开放之前，伦敦市中心的流行文化商店Forbidden Planet外的线路kai说，尽管有严格的销售政策，但可能是“50/50”的粉丝和经销商，他从凌晨3点就一直在那里。继续阅读...", "body_orig": "Fans trying to access latest releases are being priced out in a cut-throat market driven by crypto-like hype\n\nThe runaway demand for Pokemon cards is because they are being hyped “like crypto”, according to one young fan who had spent the night queueing outside a London store to make sure he did not miss out on the latest card release.\n\nBefore its 10am opening on Friday, the line outside the pop culture store Forbidden Planet in central London snaked past five others and, despite its strict sales policy, was probably “50/50” fans and resellers, said Kai, who had been there since 3am.\n\nThe 25-year-old has loved Pokémon since he was a child but the immense rise in reselling and scalping in recent years means fans like him are being priced out. “The cards used to be cheap but they have ballooned in price,” he says.\n\nKai blames the fact that “people in the crypto space have got into Pokémon” for fuelling the now rabid interest in buying cards for profit, and even gambling, with fans targeted by livestreams to bid on cards.\n\nThe signs on the door of Forbidden Planet spell out the rules. Like other stores, it limits high-demand products – in this case the £49.99 Delta Reign “elite trainer” box – to one a customer. (The set will be selling with big markups on eBay by the end of the day.)\n\nIt also has what it calls a “supplier-requested unsealing policy”. This approach deters some resellers because an opened product cannot be sold on as brand new.\n\n“It’s calmer here,” said Kai of the queue of more than 120 people. “The people and workers are nice here.”\n\nLike others in the queue he has (Pokémon) war stories of fights and overwhelmed security staff.\n\nThe clamour for cards has the most determined buyers zooming from store to store by e-bike. Others reportedly get around purchase limits by changing clothes or paying cash for other people’s hauls.\n\nThe traders were identifiable by their multiple shopping bags, said Kai, who added that “as a collector there is no reason to have that many”.\n\nSome stores, such as Argos, only sell the trading cards online. On Amazon, high-demand lines are sold by an “invite-only” process designed to combat scalper bots.\n\nWith tattoos of his favourite Pokémon, Gengar and Dragonite ,on his leg and arm, Anthony, 26, started collecting when he was five. He secured the third queue spot after coming straight from his waiting shift at 1am.\n\nHe admits to doing “everything” – buying, selling and exchanging cards – and using the sale proceeds to subsidise his collection.\n\nLike Luke, second in the queue, and Hiep, who secured first place at 11pm, he wanted to buy the expensive elite trainer sets. Luke, 30, said nostalgia around Pokémon’s 30th anniversary this year was the “straw that broke me”.\n\nHe had a binder with placeholders for missing cards. It was an “expensive” hobby with scalpers being the reason “people like us turn up so early”.\n\nFrustrated parents are increasingly found lurking in Reddit threads and Facebook groups looking for advice on how to buy cards for their children.\n\nEven though Pokémon produces about 10bn cards a year, Calvin Innes, a fandom and pop culture strategist, said the demand had “outrun the machines, so everything else – bots, scalpers, queues etc – sits on the fact that there is a hard supply limit”.\n\n“It’s not impossible for kids to get cards but the buying experience has gotten really ugly,” said Innes, author of Fandom Power: Marketing in the Age of Nerd Culture. “As a father of three kids who are all into Pokémon, it sucks.”\n\nWhile elite trainer and booster box sets, plus Pokémon Center exclusives, were the hardest products to get, Innes said single packs and blisters were more accessible, although smaller high street retailers sold out quickly.\n\nHe also advised parents to buy singles from a UK card shop, singles marketplace, such as Cardmarket, or top-rated sellers on eBay UK.\n\nAnother option for parents was to go to a prerelease or league event at a game shop. Innes said they typically cost £25-£30 and the child usually got guaranteed cards, and the opportunity to play the game.\n\nDaniel Garnett, who owns the Hull Pops Gaming Centre in Hessle, East Yorkshire, runs a free kids club and said he tries to keep product back for regular players. “We teach kids all about the Pokémon game, about the cards and how to play. We also have a qualified Pokémon judge that helps out.\n\n“Sadly, however, about a month ago, we had lots of parents bring their kids in purely to buy product, and had no intention of playing or staying for the session.”", "body_zh": "在类似加密货币的炒作推动下，试图访问最新版本的粉丝在残酷的市场中定价过高\n\n一位年轻的粉丝说，对精灵宝可梦卡的需求失控是因为他们被炒作“像加密货币一样” ，他在伦敦一家商店外排队，以确保他不会错过最新的卡片发布。\n\n在周五上午10点开放之前，伦敦市中心的流行文化商店Forbidden Planet外的线路kai说，尽管有严格的销售政策，但可能是“50/50”的粉丝和经销商，他从凌晨3点就一直在那里。\n\n这位25岁的老人从小就喜欢神奇宝贝，但近年来转售和剥头皮的激增意味着像他这样的粉丝正在被淘汰。 他说： “这些卡曾经很便宜，但价格飞涨。”\n\nKai指责“加密货币领域的人已经进入了精灵宝可梦”激发了人们现在对购买卡片以获取利润甚至赌博的狂热兴趣，直播的目标是粉丝竞标卡片。\n\n禁忌星球门上的标志说明了规则。 与其他商店一样，它将高需求产品（在这种情况下为£ 49.99 Delta Reign “精英培训师”包装盒）限制为一个客户。 （该套装将在当天结束前在eBay上以大额加价出售。）\n\n它还具有所谓的“供应商请求的开封政策”。这种方法阻止了一些经销商，因为打开的产品不能作为全新的销售。\n\n“这里比较平静，” Kai谈到排着120多人的队伍时说。 “这里的人和工人都很好。”\n\n和队伍中的其他人一样，他有（精灵宝可梦）关于战斗和不堪重负的保安人员的战争故事。\n\n卡片的喧嚣让最坚定的买家乘坐电动自行车从一家商店飞驰到另一家商店。 据报道，其他人绕过购买通过换衣服或为别人的运输支付现金来限制。\n\n凯说，贸易商可以通过他们的多个购物袋来识别，他补充说， “作为一个收藏家，没有理由拥有这么多”。\n\n一些商店，如Argos ，只在网上销售交易卡。 在亚马逊上，高需求产品线通过“仅限受邀者”的流程出售，旨在打击黄牛机器人。\n\n他最喜欢的神奇宝贝Gengar和Dragonite的纹身在他的腿上26岁的安东尼（ Anthony ）在五岁时开始收集。 凌晨1点下班后，他直接进入第三个排队位置。\n\n他钦佩", "body": "在类似加密货币的炒作推动下，试图访问最新版本的粉丝在残酷的市场中定价过高\n\n一位年轻的粉丝说，对精灵宝可 ssage from a friend asking whether his bank account was down too.\n\nIt was a day after payday, and Volpe, 50, a writer and lawyer, opened his banking app and panicked: he could not even see his balance.\n\nVolpe was among nearly 3 million Paraguayans, about 60% of the country’s adult population, whose accounts had been frozen overnight. All were customers of Ueno Bank, a digital lender that aggressively expanded across the South American country in recent years, and which, on Monday night, the central bank ordered into resolution over insolvency.\n\nUeno is at the centre of a political and economic crisis that has brought Paraguay’s banking system to the brink of collapse. On Friday, it led to the impeachment and house arrest of the rightwing president, Santiago Peña.\n\nPeña had resigned the day before in a vain attempt to retain the special jurisdiction afforded to former presidents – who, under the constitution, become senators for life. Lawmakers stripped him of the seat anyway, meaning Peña will face criminal proceedings in the ordinary courts.\n\nParaguayan prosecutors on Saturday brought charges against Peña for his alleged role in a banking crisis and requested he be placed in preventive custody.\n\n“The public prosecutor’s office has filed charges against the former president of the Republic, Mr Santiago Peña,” prosecutor Nancy Salomon told a press conference, accusing him of “breach of trust and administration for personal gain.”\n\nIn just a few days, he went from being a market favourite among Latin American presidents and one of Donald Trump’s key allies in the region to facing fierce mass protests, being voted out and placed under house arrest.\n\nThe now former president is the subject of an investigation by the public prosecutor’s office over alleged favouritism towards Ueno, which, in just a few years since Peña took office in 2023, went from an obscure digital lender to the bank of choice for most Paraguayans.\n\n“It was very easy to use and to open an account,” said Volpe, recalling that everything could be done quickly on a mobile phone. The bank also offered far more generous investment returns than its competitors did.\n\n“Now I’m having to work miracles to pay my bills,” added Volpe. “A lot of people can’t even afford basic everyday things like food; luckily, I still had some money saved elsewhere, but that has only got me this far. I don’t know what I’ll do next week.”\n\nUeno was so popular – sponsoring the national football team, the league and the country’s biggest football clubs – and served such a large share of the population that businesses have already reported an overall fall in sales of up to 80% this week. Media outlets belonging to the same financial group as the bank had their operations suspended, including radio stations and the century-old newspaper La Tribuna.\n\nThe impact on ordinary Paraguayans was perhaps even wider reaching. The media freeze meant 300 workers had their salaries suspended, initially for 90 days. About 32,000 pensioners whose public pension funds had been invested in the bank were left without payments.\n\n“A lot of people are also not working because they can’t get paid or make payments,” said the historian and political analyst Fabián Chamorro. “Meanwhile, the protests were growing every day, and Peña’s impeachment was the way congress found to prevent a popular explosion.”\n\nA former finance minister and ex-employee of the central bank and the International Monetary Fund, Peña was elected by promising to restore a “great Paraguay” and attract foreign investment.\n\nSoon after taking office at age 44 as the youngest president in Paraguay’s democratic history, he appointed Carlos Carvallo Spalding, who had until then been Ueno’s chief executive, to lead the central bank. Less than three months later, Spalding authorised Ueno, then a finance company, to become a digital bank.\n\nPeña himself had about $1m in shares he bought in 2019 in a company that would become Ueno Holding in 2022, the parent company of the conglomerate that controlled Ueno Bank. Even after becoming president, he only disposed of the shares in April 2025. He said he had bought them purely as an “investor”.\n\n“During Peña’s administration, Ueno began receiving various benefits, and the government relaxed the rules to allow public funds to be invested in the bank,” said Chamorro. An estimated $800m to $860m in state and pension funds were invested in Ueno.\n\nA series of internal central bank reports pointing to irregularities – including loans to companies within the same group – were revealed by local media in recent months but Peña dismissed them as a “false media campaign” against his government.\n\nWith the bank having less than half the solvency required to meet its obligations, the central bank ordered it into resolution only after mounting pressure from other banks and opposition lawmakers.\n\nSpalding resigned and, like Peña, was ordered arrested on Friday night. During the week, police had already arrested eight senior executives and directors of Ueno and its controlling group on suspicion of concealing the bank’s deteriorating financial position for months.\n\nThe public prosecutor’s office is investigating Peña on suspicion of illicit enrichment, money laundering and influence peddling. He denies all the allegations, and his lawyers said there is no evidence he directed the allocation of pension funds to the bank.\n\nMeanwhile, most affected people still have no access to their own money.\n\nA guarantee fund covers deposits of up to $38,000, which would apply to more than 90% of individual account holders. On Friday, the central bank began making payments to customers with up to $1,565, no outstanding debts and an existing account at another institution.\n\nPaola Benítez, a 25-year-old chef from the capital, Asunción, met all three requirements, but by late Friday afternoon had not yet recovered the money she had been saving for her wedding.\n\n“This has made me a bit anxious, a bit desperate too, because honestly, who am I supposed to go to and ask about this? It’s very strange, very confusing, very sad,” she said.", "body_zh": "圣地亚哥·佩尼亚（ Santiago Peña ）因涉嫌在危机中发挥作用而被起诉，因为检察官要求对他进行预防性拘留\n\n佩德罗·沃尔普（ Pedro Volpe ）上周二刚刚醒来，就看到一位朋友发来的一条消息，询问他的银行账户是否也被关闭了。\n\n就在发薪日之后的一天， 50岁的作家和律师沃尔普打开了他的银行应用程序，惊慌失措：他甚至看不到自己的余额。\n\n沃尔普是近300万巴拉圭人中的一员，约占该国成年人口的60 ％人口，他们的账户在一夜之间被冻结。 所有人都是上野银行的客户，上野银行是一家数字贷款机构，近年来在南美国家积极扩张，周一晚上，中央银行下令解决破产问题。\n\n上野处于政治和经济危机的中心，这场危机使巴拉圭的银行系统濒临崩溃的边缘。 周五，它导致弹劾和软禁f右翼总统圣地亚哥·佩尼亚。\n\n佩尼亚前一天辞职，徒劳地试图保留给予前总统的特别管辖权--根据宪法，前总统终身担任参议员。 无论如何，立法者剥夺了他的席位，这意味着Peña将在普通法院面临刑事诉讼。\n\n巴拉圭检察官周六指控Peña涉嫌在银行危机中发挥作用，并要求他被预防性拘留。\n\n检察官南希·萨洛蒙（ Nancy Salomon ）在新闻发布会上说： “检察官办公室已对共和国前总统圣地亚哥·佩尼亚（ Santiago Peña ）提出指控，指控他“为了个人利益而违反信任和管理”。\n\n在短短几天内，他从拉丁美洲总统和唐纳德特朗普在该地区的主要盟友之一的市场最爱，变成了面临激烈的大规模抗议活动，投票淘汰并被软禁。\n\n这位现任前总统因涉嫌偏袒上野而受到检察官办公室的调查，上野在2023年佩尼亚上任后的短短几年内就从一家默默无闻的数字贷款机构变成了大多数巴拉圭人的首选银行。\n\n沃尔普回忆说，一切都可以在手机上快速完成，他说： “使用起来非常简单，开设账户也非常方便。”aNK还提供了比竞争对手更慷慨的投资回报。\n\n“现在我不得不创造奇迹来支付我的账单，”沃尔普补充道。“", "body": "圣地亚哥·佩尼亚（ Santiago Peña ）因涉嫌在危机中发挥作用而被起诉，因为检察官要求对他进行预防性拘留\n\n佩德罗·沃尔普（ Pedro Volpe ）上周二刚刚醒来，就看到一位朋友发来的一条消息，询问他的银行账户是否也被关闭了。\n\n就在发薪日之后的一天， 50岁的作家和律师沃尔普打开了他的银行应用程序，惊慌失措：他甚至看不到自己的余额。\n\n沃尔普是近300万巴拉圭人中的一员，约占该国成年人口的60 ％人口，他们的账户在一夜之间被冻结。 所有人都是上野银行的客户，上野银行是一家数字贷款机构，近年来在南美国家积极扩张，周一晚上，中央银行下令解决破产问题。\n\n上野处于政治和经济危机的中心，这场危机使巴拉圭的银行系统濒临崩溃的边缘。 周五，它导致弹劾和软禁f右翼总统圣地亚哥·佩尼亚。\n\n佩尼亚前一天辞职，徒劳地试图保留给予前总统的特别管辖权--根据宪法，前总统终身担任参议员。 无论如何，立法者剥夺了他的席位，这意味着Peña将在普通法院面临刑事诉讼。\n\n巴拉圭检察官周六指控Peña涉嫌在银行危机中发挥作用，并要求他被预防性拘留。\n\n检察官南希·萨洛蒙（ Nancy Salomon ）在新闻发布会上说： “检察官办公室已对共和国前总统圣地亚哥·佩尼亚（ Santiago Peña ）提出指控，指控他“为了个人利益而违反信任和管理”。\n\n在短短几天内，他从拉丁美洲总统和唐纳德特朗普在该地区的主要盟友之一的市场最爱，变成了面临激烈的大规模抗议活动，投票淘汰并被软禁。\n\n这位现任前总统因涉嫌偏袒上野而受到检察官办公室的调查，上野在2023年佩尼亚上任后的短短几年内就从一家默默无闻的数字贷款机构变成了大多数巴拉圭人的首选银行。\n\n沃尔普回忆说，一切都可以在手机上快速完成，他说： “使用起来非常简单，开设账户也非常方便。”aNK还提供了比竞争对手更慷慨的投资回报。\n\n“现在我不得不创造奇迹来支付我的账单，”沃尔普补充道。“", "link": "https://www.theguardian.com/world/2026/nov/07/paraguay-ueno-bank-collapse-santiago-pena", "time": "11月08日 03:00", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}, {"title_orig": "National Trust votes to seek banking partner more in tune with its environmental policies", "title_zh": "National Trust投票决定寻找更符合其环境政策的银行合作伙伴", "summary_orig": "Charity’s AGM decides overwhelmingly to begin tendering process amid criticism of Barclays’ fossil fuel investments The National Trust has voted overwhelmingly to seek a new banking partner in a significant victory for members who have long argued that its relationship with Barclays was at odds with its commitment to protecting the natural world. The resolution, passed at the charity’s annual general meeting on Saturday with the backing of its board of trustees, instructs the organisation to begin a competitive tendering process for its banking arrangements. Continue reading...", "summary_zh": "慈善机构的年度股东大会以压倒性多数决定开始招标过程，因为巴克莱的化石燃料投资受到批评国民信托以压倒性多数投票寻求新的银行合作伙伴，为长期以来一直认为其与巴克莱的关系与其保护自然的承诺不一致的成员赢得了重大胜利世界。该决议在周六的慈善机构年度股东大会上获得通过，并得到了董事会的支持。受托人，指示组织开始其银行安排的竞争性招标过程。继续阅读...", "body_orig": "Charity’s AGM decides overwhelmingly to begin tendering process amid criticism of Barclays’ fossil fuel investments\n\nThe National Trust has voted overwhelmingly to seek a new banking partner in a significant victory for members who have long argued that its relationship with Barclays was at odds with its commitment to protecting the natural world.\n\nThe resolution, passed at the charity’s annual general meeting on Saturday with the backing of its board of trustees, instructs the organisation to begin a competitive tendering process for its banking arrangements.\n\nThat process will, for the first time, centre on the condition that the new bank demonstrates a positive commitment to protecting biodiversity and reducing the human-induced climate crisis.\n\nCampaigners said the result, 53,256 votes for and 4,094 against, sent a message that charities should apply the same environmental standards to their financial relationships as they do to their investments and suppliers.\n\nOthers questioned the significance of the success, with insiders suggesting that the tendering process will not take place for at least a year.\n\nDespite supporting the vote the National Trust sounded a qualifying note, with Sandy Nairne, deputy chair of the board of trustees, warning: “The outcome of the ballot provides the board with an important indication of members’ views, but it is not binding on the trustees.\n\n“The trustees will carefully consider the result alongside the discussion we have heard today as part of their future decision making,” he added.\n\n“This result highlights a profound shift in NGO accountability,” said Drew James, a proposer of the resolution and a member of Christian Climate Action.\n\n“Civil society looks to charities, universities and faith groups to sever ties with financial institutions failing to match their ethical standards.”\n\nThe move follows years of pressure from members concerned about Barclays’ financing of the fossil fuel industry. The bank has been criticised for its support for oil and gas expansion, including fracking and methane gas infrastructure, while the National Trust has repeatedly identified the climate emergency and the decline of nature as the greatest threats to the landscapes, wildlife and historic properties in its care.\n\nThe vote came as the trust faces mounting consequences of extreme weather across its portfolio of countryside, coastline and historic buildings. A wildfire at Dunwich Heath in Suffolk in July destroyed 104 hectares (256 acres) of ancient heathland, with campaigners estimating that the damage would take 25 years to recover. Other trust properties have faced the effects of flash flooding, prolonged drought and increasingly severe weather.\n\nJames said the relationship with Barclays was particularly difficult to reconcile with the Trust’s public position on the climate crisis. “For years, our trustees have declared climate change and the decline in nature to be the biggest threat to the places in our care. Each is human-induced, and the pace is quickening,” he said.\n\nHe pointed to comments made by the trust’s chief executive at a seminar during the Labour party conference, in which the executive identified keeping fossil fuels in the ground as the most significant response to the climate breakdown.\n\n“Meanwhile our bank, Barclays, undermines our conservation mission by channelling billions of dollars into fossil fuel expansion,” James said.\n\nThe resolution’s supporters argued that the trust’s association with the bank was inconsistent with its responsibilities under the National Trust Act 1907, which established its duty to preserve places of historic interest and natural beauty for the benefit of the nation.\n\nThey also pointed to the Trust’s previous advice to the public, encouraging them to bank ethically. “It is contradictory for the organisation to hold its own banking provider to a lower standard than its suppliers and investment portfolio,” said James.\n\nHowever, the National Trust has made clear that the tender will not be restricted to specialist ethical banks. In its supporting statement for the vote, the board said the tender “must remain open to the major UK clearing banks”.\n\nIt added that “while some members may understandably aspire to the use of a specialist ethical bank, the evidence presented to the board of trustees indicates that no such provider currently has the combination of cash handling capability, lending capacity, payments infrastructure and operational scale required to support an organisation of the Trust’s size and complexity”.\n\nBarclays has defended its relationship with the National Trust and its wider approach to financing the energy sector. A spokesperson said: “It is our privilege to support and bank the National Trust and we value their engagement on these important topics.\n\n“As a leading energy financier, we recognise the interconnectedness of economic growth, energy security and affordability and decarbonisation to meet society’s needs. Over the past three years, we have facilitated more than $300bn (£225bn) of sustainable and transition finance, including billions for cleaner energy projects here in the UK, and invested millions into climate tech.”\n\nCampaigners, however, dispute the significance of the $300bn fund, pointing to Barclays’ latest annual report which states that fossil fuel entities can access it, provided the money is not designated directly for oil and gas activity.\n\n“This means that a reduction in carbon intensity, such as a switch from tar sands extraction to natural gas, could qualify for sustainability backing even if it results in a net increase in total carbon emissions,” said James.\n\nRestore Trust, a group of National Trust members, has said the vote shows the organisation is straying from its core purpose.\n\nCornelia van der Poll, its chair, called the vote “a distraction from the National Trust’s charitable purpose of properly maintaining all the historic buildings and countryside in its care”.", "body_zh": "由于巴克莱的化石燃料投资受到批评，慈善机构的年度股东大会以压倒性多数决定开始招标程序\n\n对于长期以来一直认为其与巴克莱的关系与其保护自然世界的承诺背道而驰的成员来说，国民信托以压倒性多数投票寻求新的银行合作伙伴，这是一场重大胜利。\n\n该决议在周六的慈善机构年度股东大会上通过，并得到了董事会，指示该组织开始其银行安排的竞争性招标程序。\n\n这一进程将首次以新银行对保护生物多样性和减少人为气候危机的积极承诺为条件。\n\n活动人士表示， 53,256票赞成， 4,094票反对的结果发出了一个信息，即慈善机构应该应用相同的环境标准他们的财务关系，就像他们对待投资和供应商一样。\n\n其他人质疑这一成功的重要性，内部人士表示，招标过程至少要一年才能进行。\n\n尽管国家信托基金支持投票，但董事会副主席桑迪·奈恩（ Sandy Nairne ）警告说： “投票结果为董事会提供了一个重要的成员标志rs的观点，但它对受托人没有约束力。\n\n他补充说： “受托人将在我们今天听到的讨论的同时仔细考虑结果，作为他们未来决策的一部分。”\n\n该决议提案人、基督教气候行动成员德鲁·詹姆斯（ Drew James ）表示： “这一结果凸显了非政府组织问责制的深刻转变。”\n\n“民间社会希望慈善机构、大学和信仰团体切断与金融机构的联系不符合他们的道德标准。”\n\n此举是在担心巴克莱对化石燃料行业融资的成员多年的压力下做出的。 该银行因其对石油和天然气扩张的支持而受到批评，包括压裂和甲烷天然气基础设施，而国家信托基金已多次将气候紧急情况和自然的衰退确定为对景观，野生动物和历史的最大威胁其护理中的ic属性。\n\n投票之际，信托面临着极端天气对其农村，海岸线和", "body": "由于巴克莱的化石燃料投资受到批评，慈善机构的年度股东大会以压倒性多数决定开始招标程序\n\n对于长期以来一直认为其与巴克莱的关系与其保护自然世界的承诺背道而驰的成员来说，国民信托以压倒性多数投票寻求新的银行合作伙伴，这是一场重大胜利。\n\n该决议在周六的慈善机构年度股东大会上通过，并得到 the month. Scott Olson/Getty Images North America hide caption\n\nThe U.S. job market picked up steam last month.\n\nEmployers added 165,000 jobs in October, according to a report Friday from the Labor Department. The unemployment rate dipped to 4.1%, from 4.2% the previous month.\n\nEmployment gains for August and September were revised up by a total of 84,000 jobs.\n\nIndustries adding jobs last month include health care, manufacturing, and business services. Meanwhile, restaurants and construction companies cut jobs during the month.\n\nOne sign of the strengthening job market was slightly larger wage gains. Average wages in October were up 3.1% from a year ago. That's a bigger annual increase than the previous month, but still probably not enough to keep pace with rising prices.\n\nInflation climbed to 3.7% in September. The cost of living has been going up faster than wages for much of this year, since the war with Iran triggered a sharp jump in energy prices.\n\n\"Workers are losing ground right now,\" says Cory Stahle, an economist with the Indeed job-search website. \"The longer it wears on, the more and more they're going to feel that.\"\n\nVoters' frustration with high prices was a big factor in the midterm elections, which cost Republicans their majorities in both the House and Senate.\n\nThe unemployment rate remains historically low, which has allowed the Federal Reserve to focus its attention on fighting inflation. The central bank held its benchmark interest rate steady last week, but investors expect the Fed to raise rates when policymakers meet in December.\n\nNPR does not offer or accept money for coverage or interviews. Anyone who makes such an offer or request is not an NPR employee and does not represent NPR.", "body_zh": "美国雇主在10月份增加了165,000个工作岗位，失业率降至4.1%。 本月仓储和运输行业增加了25,000个工作岗位。 Scott Olson/Getty Images北美隐藏说明\n\n上个月，美国就业市场蓬勃发展。\n\n根据劳工部周五的一份报告，雇主在10月份增加了165,000个工作岗位。 失业率从上个月的4.2%降至4.1%。\n\n就业增长8月和9月共增加了84,000个工作岗位。\n\n上个月新增就业岗位的行业包括医疗保健、制造业和商业服务业。 与此同时，餐馆和建筑公司在本月裁员。\n\n就业市场走强的一个迹象是工资涨幅略大。 10月份的平均工资比一年前增长了3.1%。 这比上个月的年增长率更大，但仍可能不算以跟上价格上涨的步伐。\n\n9月份通货膨胀率攀升至3.7%。 自与伊朗的战争引发能源价格大幅上涨以来，今年大部分时间的生活成本上涨速度都快于工资上涨速度。\n\nIndeed求职网站的经济学家Cory Stahle说： “工人现在正在失去优势。” “它穿的时间越长，他们就越能感觉到。”\n\n选民对高价的沮丧是一个很大的事实或中期选举，这使共和党人在众议院和参议院都失去了多数席位。\n\n失业率仍处于历史低位，这使得美联储能够将注意力集中在打击通货膨胀上。 美联储上周维持基准利率不变，但投资者预计美联储将在12月政策制定者开会时加息。\n\nNPR不为报道或采访提供或接受报酬。任何人提出此类要约或请求的人不是NPR员工，也不代表NPR。", "body": "美国雇主在10月份增加了165,000个工作岗位，失业率降至4.1%。 本月仓储和运输行业增加了25,000个工作岗位。 Scott Olson/Getty Images北美隐藏说明\n\n上个月，美国就业市场蓬勃发展。\n\n根据劳工部周五的一份报告，雇主在10月份增加了165,000个工作岗位。 失业率从上个月的4.2%降至4.1%。\n\n就业增长8月和9月共增加了84,000个工作岗位。\n\n上个月新增就业岗位的行业包括医疗保健、制造业和商业服务业。 与此同时，餐馆和建筑公司在本月裁员。\n\n就业市场走强的一个迹象是工资涨幅略大。 10月份的平均工资比一年前增长了3.1%。 这比上个月的年增长率更大，但仍可能不算以跟上价格上涨的步伐。\n\n9月份通货膨胀率攀升至3.7%。 自与伊朗的战争引发能源价格大幅上涨以来，今年大部分时间的生活成本上涨速度都快于工资上涨速度。\n\nIndeed求职网站的经济学家Cory Stahle说： “工人现在正在失去优势。” “它穿的时间越长，他们就越能感觉到。”\n\n选民对高价的沮丧是一个很大的事实或中期选举，这使共和党人在众议院和参议院都失去了多数席位。\n\n失业率仍处于历史低位，这使得美联储能够将注意力集中在打击通货膨胀上。 美联储上周维持基准利率不变，但投资者预计美联储将在12月政策制定者开会时加息。\n\nNPR不为报道或采访提供或接受报酬。任何人提出此类要约或请求的人不是NPR员工，也不代表NPR。", "link": "https://www.npr.org/2026/11/06/nx-s1-6030867/jobs-labor-market-economy-wages-inflation", "time": "11月06日 21:49", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}, {"title_orig": "Why gold prices are surprisingly low", "title_zh": "为什么黄金价格出人意料地低", "summary_orig": "Gold tends to go up when there's uncertainty in the economy. For a while, the price reflected that. But this week, it dropped from a nearly $5,600 in January to below $4,000. What's going on?", "summary_zh": "当经济存在不确定性时，黄金往往会上涨。有一段时间，价格反映了这一点。但本周，它从1月份的近5,600 $跌至4,000 $以下。怎么回事？", "body_orig": "Scammers can even make money off of people starved for FAN fiction. That's my takeaway from a fake website popping up that tried to sell computer-generated audiobooks of fan fiction, which is content created by ANYONE based off of existing works. \"Fifty Shades of Grey\" started as a fanfic of Twilight, for example.\n\nThis scam website popped up in the wake of the uber-popular fan fiction website AO3, Archive of our Own, going down for an estimated two to four weeks after a \"security incident.\" People are starved for their stories and apparently will click on anything. Lucky for the world, the scam website has been taken down.\n\nWhat to know: North Korea just loves stealing crypto. They love it! It's become a major part of their economy. Last week, a state-sponsored hacking group called \"TraderTraitor\" executed the largest crypto theft in history, stealing $6.43 billion from Binance, a massive cryptocurrency exchange. $2.85 billion has been frozen or seized, according to Elliptic, a crypto analytics & compliance firm. But $3.35 billion is still linked to the group. \"TraderTraitor\" is actively trying to launder this money (yes, crypto is surprisingly traceable). A huge part of the stolen funds are in stablecoin, which can be frozen. Whatever isn't already frozen, the hacking group is trying to launder it and FAST. So how are they doing it?\n\n\"TraderTraitor\" is trying to quickly turn Stablecoin into Ether, a harder to freeze crypto PETER PARKS/AFP via Getty Images/AFP hide caption\n\nHow are the criminals laundering these assets?: Laundering this much crypto is NOT simple. The intelligence firm Elliptic broke down how \"TraderTraitor\" is trying to quickly protect its newfound loot. First of all, they want to turn any Stablecoin into assets that cannot be frozen, like Ether (ETH). From there, the group is using automation to create LOTS of new wallets to filter small amounts of crypto, so as not to trigger alarms for moving assets worth a bazillion dollars. From there, launderers want to move the money across networks like Ethereum to Bitcoin then pull it from a mixed pool with a bunch of other people's assets. The goal: make the crypto's origins hazy. \"TraderTraitor\" is moving fast. On Tuesday, Elliptic reported the group has made more than 40,000 transactions, creating a new wallet every 25 seconds.\n\nOne interesting detail: Binance has promised to make customers whole, but investors have already pulled billions from the exchange.\n\nWhat to know: This week, gold fell below $4,000 per ounce after hitting nearly $5,600 per ounce in January. It's typically seen as a safe-haven asset, which is why investors were shoveling money into it earlier this year. As you know, things have been a bit volatile from the Iran War to the criminal probe into the Federal Reserve chair. But today, there's still economic uncertainty, no? The war with Iran rages on. So why are gold prices falling? I took my question to Planet Money co-host Jeff Guo to find out. I asked him: could gold be going down because Treasury bond yields are up? That could mean there are MORE reliable ways to make money.\n\nWhy is gold going down?: Our answer, courtesy of Jeff Guo!\n\nJeff: I think you are right that rising Treasury yields are the story. As you know, gold tends to be seen as a \"safe\" asset and an inflation hedge; but the problem is that gold doesn't earn any income/interest on its own. Meanwhile, you could buy a 10 year TIPS (Treasury Inflation-Protected Securities) bond right now that does earn income, above and beyond inflation. Sure, the Iran war is a source of political instability that might drive investors toward gold. But the main effect of the war so far seems to be raising the price of oil. And higher oil prices are one of the factors pushing interest rates up, making bonds more attractive relative to gold.\n\nWhat to know: People do not want data centers and the election left us with numbers to prove it. Apparently voters either BANNED or placed restrictions on data centers in at least 38 jurisdictions across the country. The numbers within the ballot measures were fascinating. It's also notable that Texas' new governor, Democrat Gina Hinojosa, ran on a platform of reining in data centers. She called for a moratorium on new projects and pushing for more aggressive protections on both ratepayers and the environment. A Democrat hasn't been governor in Texas in more than 30 years.\n\nWhy it matters: All this local opposition could actually make an impact on what big tech wants to do. Local opposition has already made a difference in data center world. S&P Global has tracked projects nationwide and found more than 146 were delayed or canceled through early August. 75% of those were tied to local opposition. Several big tech companies are dropping contract provisions that have drawn the public's ire – one that keeps early phases of data center projects a secret, for example. We will be keeping an eye on this.\n\nIf you're buying a house, you have a choice on what kind of mortgage to get. The \"fixed-rate\" mortgage has become dominant in the U.S. The \"adjustable-rate\" mortgage (ARM) makes up only five percent of mortgages here. They used to be much more popular until the 2008 financial crisis showed adjustable rates can be risky! In 2008, a man in Colorado saw his interest rate rise to NINE percent. He and his wife owed more than the house was worth.\n\n\" I am on the Titanic, watching it sink I don't even have a lifeboat,\" he told NPR at the time.\n\nBut now, the adjustable-rate mortgage is rising in popularity again. They represented 11% of new mortgage applications, the highest in more than a year. What's going on?\n\nThe origins of this story: The show Planet Money was actually born out of a collaborative story between NPR and This American Life called The Giant Pool of Money explaining the 2008 financial crisis. The episode moves through the housing crash by following a chain of people relevant to the market collapsing. It includes a guy (not the Colorado guy) who took out an adjustable-rate mortgage and things did NOT end well for him. His mortgage rate adjusted upwards by more than $2,000 per month due to his adjustable rate.\n\nRest of the WeekWhy is Pakistan cozying up to the crypto industry?\n\nCan Anthropic make enough money to justify its value?\n\nProducer Angel Carreras is reading DC's Absolute Martian Manhunter\n\nI swear I read real books and NBER [National Bureau of Economic Research] papers, but I must recommend another comic: DC's Absolute Martian Manhunter.\n\nInstead of the cartoon alien who loves Oreos and beats up other alien bad guys, this run turns John Jones (FKA J'onn J'onnz) into an FBI agent who survives a suicide bombing and merges with an alien entity. What follows is a psychedelic, politically charged comic, one that's deeply attuned to modern anxieties from the police state and climate dread to the slow erosion of the social contract and xenophobia.\n\nSounds heavy, but it's so wildly inventive with the medium (hold this page up to the sun! cut these bits out of the next page!) that you won't be able to put it down.\n\nNPR does not offer or accept money for coverage or interviews. Anyone who makes such an offer or request is not an NPR employee and does not represent NPR.", "body_zh": "诈骗者甚至可以从那些渴望粉丝小说的人身上赚钱。 这是我从一个假网站上得到的结论，该网站试图出售计算机生成的粉丝小说有声读物，这些内容是任何人根据现有作品创作的。 例如，《五十度灰》就是从《暮光之城》开始的。\n\n这个诈骗网站是在超级受欢迎的粉丝小说网站AO3 ，我们自己的档案之后出现的，估计“安全事件”发生后两到四周。 人们渴望他们的故事，显然会点击任何东西。 幸运的是，诈骗网站已被删除。\n\n要知道：朝鲜只是喜欢窃取加密货币。 他们喜欢它！它已成为他们经济的重要组成部分。 上周，一个名为“TraderTraitor”的国家资助的黑客组织执行了历史上最大的加密货币盗窃案，从Binance窃取了64.3亿美元$ ，加密货币交易所。根据加密分析与合规公司Elliptic的数据， 28.5亿美元已被冻结或扣押。但仍有33.5亿美元与该集团有关。“TraderTraitor”正在积极尝试洗钱（是的，加密货币令人惊讶地可追踪）。被盗资金的很大一部分是稳定币，可以被冻结。无论什么东西还没有被冻结，黑客组织都试图快速清洗它。那么他们是怎么做的ng它？\n\n“TraderTraitor”正试图迅速将Stablecoin转变为以太币，这是一种更难冻结的加密货币PETER Parks/法新社通过Getty Images/法新社隐藏标题\n\n犯罪分子是如何清洗这些资产的？：清洗这么多加密货币并不简单。 情报公司Elliptic打破了“TraderTraitor”试图快速保护其新发现的战利品的方式。 首先，他们希望将任何稳定币转化为无法冻结的资产，如以太币（ ETH ）。从那里，该组织正在使用自动化来创建大量新钱包来过滤少量加密货币，以免触发移动价值数十亿美元资产的警报。从那里，洗钱者希望将资金通过以太坊等网络转移到比特币，然后将其从与其他人资产的混合池中提取出来。目标：让加密货币的起源变得模糊。“TraderTraitor”行动迅速。周二， Elliptic报告了p已完成超过40,000笔交易，每25秒创建一个新钱包。\n\n一个有趣的细节：币安承诺让客户", "body": "诈骗者甚至可以从那些渴望粉丝小说的人身上赚钱。 这是我从一个假网站上得到的结论，该网站试图出售计算机生成的粉丝小说有声读物，这些内容是任何人根据现有作品创作的。 例如，《五十度灰》就是从《暮光之城  Dow Jones and S&P also sank.\n\nThe losses were a stark reversal from Wednesday, when investors had initially sent shares higher across the board, relieved that the midterms did not end with the fate of Congress undecided.\n\nThe sobering-up seen across markets on Thursday reflected investors' concern about a big signal sent by voters: They revolted against AI data centers, which many people worry will gobble up water and energy resources. Those voters supported Democrats who have vowed to push back against the proliferation of these projects.\n\nBut many AI companies — including Meta and Alphabet, the parent company of Google — need to keep building out these data centers to continue developing the technology.\n\nThe Nasdaq's decline comes after what has already been a rough year of technology shares on Wall Street, with investors starting to question whether the massive investments companies have plowed into AI will pay off anytime soon.\n\n\"There is some concern regarding AI regulation, and fears that there could be far more regulations coming to AI technology, as well as a pushback on the buildout of data centers across the country,\" says David Busch, chief investment officer of Trajan Wealth.\n\nAI-related or AI-dependent stocks of all kinds were among the biggest decliners on Thursday, with Tesla and SpaceX — both controlled by billionaire Elon Musk — falling particularly sharply. Musk spent hundreds of millions of dollars in an unsuccessful attempt to elect more Republicans, and investors fear he and his companies could also come under Democratic scrutiny when the new Congress is seated in January.\n\nIt's not only Congress, however. Democrats who vowed to slow down AI development also won at the state level, most prominently Gina Hinojosa, who won the Texas governor's race in stunning fashion.\n\nIt's unclear whether the AI stock rout will continue — or spread beyond tech stocks. AI has become a big driver of the U.S. economy, helping it post a solid annual growth of 3.4% in the July-September quarter.\n\nAnd sophisticated Wall Street investors are not the only ones who own a lot of shares in AI companies. Average Americans also own them through their retirement investment portfolios — such as 401(k)s or pension funds — leaving them also vulnerable to a prolonged AI rout.\n\nNPR does not offer or accept money for coverage or interviews. Anyone who makes such an offer or request is not an NPR employee and does not represent NPR.", "body_zh": "由于投资者担心即将到来的民主党国会和全国各州可能会打击人工智能行业和数据中心，股市下跌。 Timothy A. Clary/法新社通过Getty Images隐藏标题\n\n民主党在全国中期选举和全国各州竞选中以压倒性优势获胜两天后，投资者开始接受潜在的后果。\n\n担心即将到来的民主党国会会受到打击让科技巨头纳斯达克下跌逾5% ，市值蒸发了逾2万$。 道琼斯指数和标准普尔指数也下跌。\n\n从周三开始，亏损出现了明显逆转，当时投资者最初将股价全面上涨，这让人松了一口气，因为中期选举并没有随着国会的命运而结束。\n\n周四市场的清醒反映出投资者对选民发出的一个大信号的担忧：许多人担心会吞噬水和能源资源的人工智能数据中心。 这些选民支持民主党人，他们发誓要抵制这些项目的扩散。\n\n但许多人工智能公司--包括谷歌的母公司Meta和Alphabet--需要继续建设这些数据中心，以继续开发这项技术。\n\n纳斯达克指数的下跌发生在科技股经历了艰难的一年之后华尔街的nology股票，投资者开始质疑公司对AI的大规模投资是否会很快得到回报。\n\nTrajan Wealth首席投资官David Busch表示： “人们对人工智能监管存在一些担忧，并担心人工智能技术可能会受到更多监管，以及对全国数据中心建设的抵制。”\n\n与人工智能相关或依赖于人工智能的股票各类股票周四下跌幅度最大，特斯拉和SpaceX （均由亿万富翁埃隆·马斯克（ Elon Musk ）控制）下跌幅度特别大。 马斯克花费数亿美元试图选出更多的共和党人，但没有成功，投资者担心，在明年1月新一届国会就职时，他和他的公司也可能受到民主党的审查。\n\n然而，这不仅仅是国会。 发誓要放慢人工智能速度的民主党人发展也赢得了州一级的胜利，最突出的是Gina Hinojosa ，她以惊人的方式赢得了德克萨斯州州长的竞选。\n\n目前尚不清楚", "body": "由于投资者担心即将到来的民主党国会和全国各州可能会打击人工智能行业和数据中心，股市下跌。 Timothy A. Clary/法新社通过Getty Images隐藏标题\n\n民主党在全国中期选举和全国各州竞选中以压倒性优势获胜两天后，投资者开始接受潜在的后果。\n\n担心即将到来的民主党国会会受到打击让科技巨头纳斯达克下跌逾5% ，市值蒸发了逾2万$。 道琼斯指数和标准普尔指数也下跌。\n\n从周三开始，亏损出现了明显逆转，当时投资者最初将股价全面上涨，这让人松了一口气，因为中期选举并没有随着国会的命运而结束。\n\n周四市场的清醒反映出投资者对选民发出的一个大信号的担忧：许多人担心会吞噬水和能源资源的人工智能数据中心。 这些选民支持民主党人，他们发誓要抵制这些项目的扩散。\n\n但许多人工智能公司--包括谷歌的母公司Meta和Alphabet--需要继续建设这些数据中心，以继续开发这项技术。\n\n纳斯达克指数的下跌发生在科技股经历了艰难的一年之后华尔街的nology股票，投资者开始质疑公司对AI的大规模投资是否会很快得到回报。\n\nTrajan Wealth首席投资官David Busch表示： “人们对人工智能监管存在一些担忧，并担心人工智能技术可能会受到更多监管，以及对全国数据中心建设的抵制。”\n\n与人工智能相关或依赖于人工智能的股票各类股票周四下跌幅度最大，特斯拉和SpaceX （均由亿万富翁埃隆·马斯克（ Elon Musk ）控制）下跌幅度特别大。 马斯克花费数亿美元试图选出更多的共和党人，但没有成功，投资者担心，在明年1月新一
