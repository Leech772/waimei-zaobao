: "", "translated": true}, {"title_orig": "Hiring jumps: The economy added 165,000 jobs last month", "title_zh": "招聘人数激增：上个月经济增加了165,000个工作岗位", "summary_orig": "The U.S. job market improved last month, according to a report from the Labor Department Friday. Employers added more jobs than forecasters had expected and the unemployment rate dipped to 4.1%.", "summary_zh": "根据劳工部周五的一份报告，美国就业市场上个月有所改善。雇主增加的工作岗位比预测者预期的要多，失业率降至4.1%。", "body_orig": "U.S. employers added 165,000 jobs in October as the unemployment rate fell to 4.1%. The warehouse and transportation industry added 25,000 jobs during the month. Scott Olson/Getty Images North America hide caption\n\nThe U.S. job market picked up steam last month.\n\nEmployers added 165,000 jobs in October, according to a report Friday from the Labor Department. The unemployment rate dipped to 4.1%, from 4.2% the previous month.\n\nEmployment gains for August and September were revised up by a total of 84,000 jobs.\n\nIndustries adding jobs last month include health care, manufacturing, and business services. Meanwhile, restaurants and construction companies cut jobs during the month.\n\nOne sign of the strengthening job market was slightly larger wage gains. Average wages in October were up 3.1% from a year ago. That's a bigger annual increase than the previous month, but still probably not enough to keep pace with rising prices.\n\nInflation climbed to 3.7% in September. The cost of living has been going up faster than wages for much of this year, since the war with Iran triggered a sharp jump in energy prices.\n\n\"Workers are losing ground right now,\" says Cory Stahle, an economist with the Indeed job-search website. \"The longer it wears on, the more and more they're going to feel that.\"\n\nVoters' frustration with high prices was a big factor in the midterm elections, which cost Republicans their majorities in both the House and Senate.\n\nThe unemployment rate remains historically low, which has allowed the Federal Reserve to focus its attention on fighting inflation. The central bank held its benchmark interest rate steady last week, but investors expect the Fed to raise rates when policymakers meet in December.\n\nNPR does not offer or accept money for coverage or interviews. Anyone who makes such an offer or request is not an NPR employee and does not represent NPR.", "body_zh": "美国雇主在10月份增加了165,000个工作岗位，失业率降至4.1%。 本月仓储和运输行业增加了25,000个工作岗位。 Scott Olson/Getty Images北美隐藏说明\n\n上个月，美国就业市场蓬勃发展。\n\n根据劳工部周五的一份报告，雇主在10月份增加了165,000个工作岗位。 失业率从上个月的4.2%降至4.1%。\n\n就业增长8月和9月共增加了84,000个工作岗位。\n\n上个月新增就业岗位的行业包括医疗保健、制造业和商业服务业。 与此同时，餐馆和建筑公司在本月裁员。\n\n就业市场走强的一个迹象是工资涨幅略大。 10月份的平均工资比一年前增长了3.1%。 这比上个月的年增长率更大，但仍可能不算以跟上价格上涨的步伐。\n\n9月份通货膨胀率攀升至3.7%。 自与伊朗的战争引发能源价格大幅上涨以来，今年大部分时间的生活成本上涨速度都快于工资上涨速度。\n\nIndeed求职网站的经济学家Cory Stahle说： “工人现在正在失去优势。” “它穿的时间越长，他们就越能感觉到。”\n\n选民对高价的沮丧是一个很大的事实或中期选举，这使共和党人在众议院和参议院都失去了多数席位。\n\n失业率仍处于历史低位，这使得美联储能够将注意力集中在打击通货膨胀上。 美联储上周维持基准利率不变，但投资者预计美联储将在12月政策制定者开会时加息。\n\nNPR不为报道或采访提供或接受报酬。任何人提出此类要约或请求的人不是NPR员工，也不代表NPR。", "body": "美国雇主在10月份增加了165,000个工作岗位，失业率降至4.1%。 本月仓储和运输行业增加了25,000个工作岗位。 Scott Olson/Getty Images北美隐藏说明\n\n上个月，美国就业市场蓬勃发展。\n\n根据劳工部周五的一份报告，雇主在10月份增加了165,000个工作岗位。 失业率从上个月的4.2%降至4.1%。\n\n就业增长8月和9月共增加了84,000个工作岗位。\n\n上个月新增就业岗位的行业包括医疗保健、制造业和商业服务业。 与此同时，餐馆和建筑公司在本月裁员。\n\n就业市场走强的一个迹象是工资涨幅略大。 10月份的平均工资比一年前增长了3.1%。 这比上个月的年增长率更大，但仍可能不算以跟上价格上涨的步伐。\n\n9月份通货膨胀率攀升至3.7%。 自与伊朗的战争引发能源价格大幅上涨以来，今年大部分时间的生活成本上涨速度都快于工资上涨速度。\n\nIndeed求职网站的经济学家Cory Stahle说： “工人现在正在失去优势。” “它穿的时间越长，他们就越能感觉到。”\n\n选民对高价的沮丧是一个很大的事实或中期选举，这使共和党人在众议院和参议院都失去了多数席位。\n\n失业率仍处于历史低位，这使得美联储能够将注意力集中在打击通货膨胀上。 美联储上周维持基准利率不变，但投资者预计美联储将在12月政策制定者开会时加息。\n\nNPR不为报道或采访提供或接受报酬。任何人提出此类要约或请求的人不是NPR员工，也不代表NPR。", "link": "https://www.npr.org/2026/11/06/nx-s1-6030867/jobs-labor-market-economy-wages-inflation", "time": "11月06日 21:49", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}, {"title_orig": "Why gold prices are surprisingly low", "title_zh": "为什么黄金价格出人意料地低", "summary_orig": "Gold tends to go up when there's uncertainty in the economy. For a while, the price reflected that. But this week, it dropped from a nearly $5,600 in January to below $4,000. What's going on?", "summary_zh": "当经济存在不确定性时，黄金往往会上涨。有一段时间，价格反映了这一点。但本周，它从1月份的近5,600 $跌至4,000 $以下。怎么回事？", "body_orig": "Scammers can even make money off of people starved for FAN fiction. That's my takeaway from a fake website popping up that tried to sell computer-generated audiobooks of fan fiction, which is content created by ANYONE based off of existing works. \"Fifty Shades of Grey\" started as a fanfic of Twilight, for example.\n\nThis scam website popped up in the wake of the uber-popular fan fiction website AO3, Archive of our Own, going down for an estimated two to four weeks after a \"security incident.\" People are starved for their stories and apparently will click on anything. Lucky for the world, the scam website has been taken down.\n\nWhat to know: North Korea just loves stealing crypto. They love it! It's become a major part of their economy. Last week, a state-sponsored hacking group called \"TraderTraitor\" executed the largest crypto theft in history, stealing $6.43 billion from Binance, a massive cryptocurrency exchange. $2.85 billion has been frozen or seized, according to Elliptic, a crypto analytics & compliance firm. But $3.35 billion is still linked to the group. \"TraderTraitor\" is actively trying to launder this money (yes, crypto is surprisingly traceable). A huge part of the stolen funds are in stablecoin, which can be frozen. Whatever isn't already frozen, the hacking group is trying to launder it and FAST. So how are they doing it?\n\n\"TraderTraitor\" is trying to quickly turn Stablecoin into Ether, a harder to freeze crypto PETER PARKS/AFP via Getty Images/AFP hide caption\n\nHow are the criminals laundering these assets?: Laundering this much crypto is NOT simple. The intelligence firm Elliptic broke down how \"TraderTraitor\" is trying to quickly protect its newfound loot. First of all, they want to turn any Stablecoin into assets that cannot be frozen, like Ether (ETH). From there, the group is using automation to create LOTS of new wallets to filter small amounts of crypto, so as not to trigger alarms for moving assets worth a bazillion dollars. From there, launderers want to move the money across networks like Ethereum to Bitcoin then pull it from a mixed pool with a bunch of other people's assets. The goal: make the crypto's origins hazy. \"TraderTraitor\" is moving fast. On Tuesday, Elliptic reported the group has made more than 40,000 transactions, creating a new wallet every 25 seconds.\n\nOne interesting detail: Binance has promised to make customers whole, but investors have already pulled billions from the exchange.\n\nWhat to know: This week, gold fell below $4,000 per ounce after hitting nearly $5,600 per ounce in January. It's typically seen as a safe-haven asset, which is why investors were shoveling money into it earlier this year. As you know, things have been a bit volatile from the Iran War to the criminal probe into the Federal Reserve chair. But today, there's still economic uncertainty, no? The war with Iran rages on. So why are gold prices falling? I took my question to Planet Money co-host Jeff Guo to find out. I asked him: could gold be going down because Treasury bond yields are up? That could mean there are MORE reliable ways to make money.\n\nWhy is gold going down?: Our answer, courtesy of Jeff Guo!\n\nJeff: I think you are right that rising Treasury yields are the story. As you know, gold tends to be seen as a \"safe\" asset and an inflation hedge; but the problem is that gold doesn't earn any income/interest on its own. Meanwhile, you could buy a 10 year TIPS (Treasury Inflation-Protected Securities) bond right now that does earn income, above and beyond inflation. Sure, the Iran war is a source of political instability that might drive investors toward gold. But the main effect of the war so far seems to be raising the price of oil. And higher oil prices are one of the factors pushing interest rates up, making bonds more attractive relative to gold.\n\nWhat to know: People do not want data centers and the election left us with numbers to prove it. Apparently voters either BANNED or placed restrictions on data centers in at least 38 jurisdictions across the country. The numbers within the ballot measures were fascinating. It's also notable that Texas' new governor, Democrat Gina Hinojosa, ran on a platform of reining in data centers. She called for a moratorium on new projects and pushing for more aggressive protections on both ratepayers and the environment. A Democrat hasn't been governor in Texas in more than 30 years.\n\nWhy it matters: All this local opposition could actually make an impact on what big tech wants to do. Local opposition has already made a difference in data center world. S&P Global has tracked projects nationwide and found more than 146 were delayed or canceled through early August. 75% of those were tied to local opposition. Several big tech companies are dropping contract provisions that have drawn the public's ire – one that keeps early phases of data center projects a secret, for example. We will be keeping an eye on this.\n\nIf you're buying a house, you have a choice on what kind of mortgage to get. The \"fixed-rate\" mortgage has become dominant in the U.S. The \"adjustable-rate\" mortgage (ARM) makes up only five percent of mortgages here. They used to be much more popular until the 2008 financial crisis showed adjustable rates can be risky! In 2008, a man in Colorado saw his interest rate rise to NINE percent. He and his wife owed more than the house was worth.\n\n\" I am on the Titanic, watching it sink I don't even have a lifeboat,\" he told NPR at the time.\n\nBut now, the adjustable-rate mortgage is rising in popularity again. They represented 11% of new mortgage applications, the highest in more than a year. What's going on?\n\nThe origins of this story: The show Planet Money was actually born out of a collaborative story between NPR and This American Life called The Giant Pool of Money explaining the 2008 financial crisis. The episode moves through the housing crash by following a chain of people relevant to the market collapsing. It includes a guy (not the Colorado guy) who took out an adjustable-rate mortgage and things did NOT end well for him. His mortgage rate adjusted upwards by more than $2,000 per month due to his adjustable rate.\n\nRest of the WeekWhy is Pakistan cozying up to the crypto industry?\n\nCan Anthropic make enough money to justify its value?\n\nProducer Angel Carreras is reading DC's Absolute Martian Manhunter\n\nI swear I read real books and NBER [National Bureau of Economic Research] papers, but I must recommend another comic: DC's Absolute Martian Manhunter.\n\nInstead of the cartoon alien who loves Oreos and beats up other alien bad guys, this run turns John Jones (FKA J'onn J'onnz) into an FBI agent who survives a suicide bombing and merges with an alien entity. What follows is a psychedelic, politically charged comic, one that's deeply attuned to modern anxieties from the police state and climate dread to the slow erosion of the social contract and xenophobia.\n\nSounds heavy, but it's so wildly inventive with the medium (hold this page up to the sun! cut these bits out of the next page!) that you won't be able to put it down.\n\nNPR does not offer or accept money for coverage or interviews. Anyone who makes such an offer or request is not an NPR employee and does not represent NPR.", "body_zh": "诈骗者甚至可以从那些渴望粉丝小说的人身上赚钱。 这是我从一个假网站上得到的结论，该网站试图出售计算机生成的粉丝小说有声读物，这些内容是任何人根据现有作品创作的。 例如，《五十度灰》就是从《暮光之城》开始的。\n\n这个诈骗网站是在超级受欢迎的粉丝小说网站AO3 ，我们自己的档案之后出现的，估计“安全事件”发生后两到四周。 人们渴望他们的故事，显然会点击任何东西。 幸运的是，诈骗网站已被删除。\n\n要知道：朝鲜只是喜欢窃取加密货币。 他们喜欢它！它已成为他们经济的重要组成部分。 上周，一个名为“TraderTraitor”的国家资助的黑客组织执行了历史上最大的加密货币盗窃案，从Binance窃取了64.3亿美元$ ，加密货币交易所。根据加密分析与合规公司Elliptic的数据， 28.5亿美元已被冻结或扣押。但仍有33.5亿美元与该集团有关。“TraderTraitor”正在积极尝试洗钱（是的，加密货币令人惊讶地可追踪）。被盗资金的很大一部分是稳定币，可以被冻结。无论什么东西还没有被冻结，黑客组织都试图快速清洗它。那么他们是怎么做的ng它？\n\n“TraderTraitor”正试图迅速将Stablecoin转变为以太币，这是一种更难冻结的加密货币PETER Parks/法新社通过Getty Images/法新社隐藏标题\n\n犯罪分子是如何清洗这些资产的？：清洗这么多加密货币并不简单。 情报公司Elliptic打破了“TraderTraitor”试图快速保护其新发现的战利品的方式。 首先，他们希望将任何稳定币转化为无法冻结的资产，如以太币（ ETH ）。从那里，该组织正在使用自动化来创建大量新钱包来过滤少量加密货币，以免触发移动价值数十亿美元资产的警报。从那里，洗钱者希望将资金通过以太坊等网络转移到比特币，然后将其从与其他人资产的混合池中提取出来。目标：让加密货币的起源变得模糊。“TraderTraitor”行动迅速。周二， Elliptic报告了p已完成超过40,000笔交易，每25秒创建一个新钱包。\n\n一个有趣的细节：币安承诺让客户", "body": "诈骗者甚至可以从那些渴望粉丝小说的人身上赚钱。 这是我从一个假网站上得到的结论，该网站试图出售计算机生成的粉丝小说有声读物，这些内容是任何人根据现有作品创作的。 例如，《五十度灰》就是从《暮光之城》开始的。\n\n这个诈骗网站是在超级受欢迎的粉丝小说网站AO3 ，我们自己的档案之后出现的，估计“安全事件”发生后两到四周。 人们渴望他们的故事，显然会点击任何东西。 幸运的是，诈骗网站已被删除。\n\n要知道：朝鲜只是喜欢窃取加密货币。 他们喜欢它！它已成为他们经济的重要组成部分。 上周，一个名为“TraderTraitor”的国家资助的黑客组织执行了历史上最大的加密货币盗窃案，从Binance窃取了64.3亿美元$ ，加密货币交易所。根据加密分析与合规公司Elliptic的数据， 28.5亿美元已被冻结或扣押。但仍有33.5亿美元与该集团有关。“TraderTraitor”正在积极尝试洗钱（是的，加密货币令人惊讶地可追踪）。被盗资金的很大一部分是稳定币，可以被冻结。无论什么东西还没有被冻结，黑客组织都试图快速清洗它。那么他们是怎么做的ng它？\n\n“TraderTraitor”正试图迅速将Stablecoin转变为以太币，这是一种更难冻结的加密货币PETER Parks/法新社通过Getty Images/法新社隐藏标题\n\n犯罪分子是如何清洗这些资产的？：清洗这么多加密货币并不简单。 情报公司Elliptic打破了“TraderTraitor”试图快速保护其新发现的战利品的方式。 首先，他们希望将任何稳定币转化为无法冻结的资产，如以太币（ ETH ）。从那里，该组织正在使用自动化来创建大量新钱包来过滤少量加密货币，以免触发移动价值数十亿美元资产的警报。从那里，洗钱者希望将资金通过以太坊等网络转移到比特币，然后将其从与其他人资产的混合池中提取出来。目标：让加密货币的起源变得模糊。“TraderTraitor”行动迅速。周二， Elliptic报告了p已完成超过40,000笔交易，每25秒创建一个新钱包。\n\n一个有趣的细节：币安承诺让客户", "link": "https://www.npr.org/sections/planet-money/2026/11/06/nx-s1-6030995/why-gold-prices-are-surprisingly-low", "time": "11月06日 20:00", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}, {"title_orig": "Fears of an AI crackdown after midterms spark $2 trillion rout in tech stocks", "title_zh": "对中期后人工智能打击的担忧引发了2万亿美元的科技股溃败", "summary_orig": "Shares sank, with the tech-heavy Nasdaq dropping over 5%, as investors reacted with fear that a Democratic Congress — and states across the country -— would crack down on AI and data centers.", "summary_zh": "随着投资者担心民主党国会和全国各州将打击人工智能和数据中心，股价下跌，以科技股为主的纳斯达克指数下跌超过5%。", "body_orig": "Stocks sank as investors fear an incoming Democratic Congress — and states across the country — could crack down on the AI industry and data centers. Timothy A. Clary/AFP via Getty Images hide caption\n\nTwo days after Democrats won overwhelmingly in the national midterm elections — and in state races across the country — investors started to come to terms with the potential consequences.\n\nFears that an incoming Democratic Congress would crack down on AI sent the tech-heavy Nasdaq down more than 5% and wiped out more than $2 trillion in market value. The Dow Jones and S&P also sank.\n\nThe losses were a stark reversal from Wednesday, when investors had initially sent shares higher across the board, relieved that the midterms did not end with the fate of Congress undecided.\n\nThe sobering-up seen across markets on Thursday reflected investors' concern about a big signal sent by voters: They revolted against AI data centers, which many people worry will gobble up water and energy resources. Those voters supported Democrats who have vowed to push back against the proliferation of these projects.\n\nBut many AI companies — including Meta and Alphabet, the parent company of Google — need to keep building out these data centers to continue developing the technology.\n\nThe Nasdaq's decline comes after what has already been a rough year of technology shares on Wall Street, with investors starting to question whether the massive investments companies have plowed into AI will pay off anytime soon.\n\n\"There is some concern regarding AI regulation, and fears that there could be far more regulations coming to AI technology, as well as a pushback on the buildout of data centers across the country,\" says David Busch, chief investment officer of Trajan Wealth.\n\nAI-related or AI-dependent stocks of all kinds were among the biggest decliners on Thursday, with Tesla and SpaceX — both controlled by billionaire Elon Musk — falling particularly sharply. Musk spent hundreds of millions of dollars in an unsuccessful attempt to elect more Republicans, and investors fear he and his companies could also come under Democratic scrutiny when the new Congress is seated in January.\n\nIt's not only Congress, however. Democrats who vowed to slow down AI development also won at the state level, most prominently Gina Hinojosa, who won the Texas governor's race in stunning fashion.\n\nIt's unclear whether the AI stock rout will continue — or spread beyond tech stocks. AI has become a big driver of the U.S. economy, helping it post a solid annual growth of 3.4% in the July-September quarter.\n\nAnd sophisticated Wall Street investors are not the only ones who own a lot of shares in AI companies. Average Americans also own them through their retirement investment portfolios — such as 401(k)s or pension funds — leaving them also vulnerable to a prolonged AI rout.\n\nNPR does not offer or accept money for coverage or interviews. Anyone who makes such an offer or request is not an NPR employee and does not represent NPR.", "body_zh": "由于投资者担心即将到来的民主党国会和全国各州可能会打击人工智能行业和数据中心，股市下跌。 Timothy A. Clary/法新社通过Getty Images隐藏标题\n\n民主党在全国中期选举和全国各州竞选中以压倒性优势获胜两天后，投资者开始接受潜在的后果。\n\n担心即将到来的民主党国会会受到打击让科技巨头纳斯达克下跌逾5% ，市值蒸发了逾2万$。 道琼斯指数和标准普尔指数也下跌。\n\n从周三开始，亏损出现了明显逆转，当时投资者最初将股价全面上涨，这让人松了一口气，因为中期选举并没有随着国会的命运而结束。\n\n周四市场的清醒反映出投资者对选民发出的一个大信号的担忧：许多人担心会吞噬水和能源资源的人工智能数据中心。 这些选民支持民主党人，他们发誓要抵制这些项目的扩散。\n\n但许多人工智能公司--包括谷歌的母公司Meta和Alphabet--需要继续建设这些数据中心，以继续开发这项技术。\n\n纳斯达克指数的下跌发生在科技股经历了艰难的一年之后华尔街的nology股票，投资者开始质疑公司对AI的大规模投资是否会很快得到回报。\n\nTrajan Wealth首席投资官David Busch表示： “人们对人工智能监管存在一些担忧，并担心人工智能技术可能会受到更多监管，以及对全国数据中心建设的抵制。”\n\n与人工智能相关或依赖于人工智能的股票各类股票周四下跌幅度最大，特斯拉和SpaceX （均由亿万富翁埃隆·马斯克（ Elon Musk ）控制）下跌幅度特别大。 马斯克花费数亿美元试图选出更多的共和党人，但没有成功，投资者担心，在明年1月新一届国会就职时，他和他的公司也可能受到民主党的审查。\n\n然而，这不仅仅是国会。 发誓要放慢人工智能速度的民主党人发展也赢得了州一级的胜利，最突出的是Gina Hinojosa ，她以惊人的方式赢得了德克萨斯州州长的竞选。\n\n目前尚不清楚", "body": "由于投资者担心即将到来的民主党国会和全国各州可能会打击人工智能行业和数据中心，股市下跌。 Timothy A. Clary/法新社通过Getty Images隐藏标题\n\n民 e some programming produced by third parties; NPR cannot guarantee transcripts for that content and some transcripts may be produced using automated or other tools.\n\nNPR does not offer or accept money for coverage or interviews. Anyone who makes such an offer or request is not an NPR employee and does not represent NPR.", "body_zh": "一种难以发现和消灭的入侵性昆虫对农业经济构成了数十亿美元的威胁—给已经因高成本而捉襟见肘的农民带来了另一种压力。\n\n版权所有© 2026 NPR。 保留所有权利。有关更多信息，请访问我们的网站使用条款和权限页面： www.npr.org。\n\nNPR节目成绩单的准确性和可用性可能有所不同。 也可以修改成绩单文本以更正错误rs或将更新与音频匹配。 音频可以在原始广播或发布后进行编辑。 NPR节目的权威记录是音频记录。 请注意， NPR平台和产品还包括一些由第三方制作的节目； NPR无法保证该内容的成绩单，某些成绩单可能会使用自动或其他工具制作。\n\nNPR不为报道或采访提供或接受报酬。任何提出此类要约或要求的人不是NPR员工，也不代表NPR。", "body": "一种难以发现和消灭的入侵性昆虫对农业经济构成了数十亿美元的威胁—给已经因高成本而捉襟见肘的农民带来了另一种压力。\n\n版权所有© 2026 NPR。 保留所有权利。有关更多信息，请访问我们的网站使用条款和权限页面： www.npr.org。\n\nNPR节目成绩单的准确性和可用性可能有所不同。 也可以修改成绩单文本以更正错误rs或将更新与音频匹配。 音频可以在原始广播或发布后进行编辑。 NPR节目的权威记录是音频记录。 请注意， NPR平台和产品还包括一些由第三方制作的节目； NPR无法保证该内容的成绩单，某些成绩单可能会使用自动或其他工具制作。\n\nNPR不为报道或采访提供或接受报酬。任何提出此类要约或要求的人不是NPR员工，也不代表NPR。", "link": "https://www.npr.org/2026/11/05/nx-s1-6018539/pasture-mealybugs-have-killed-off-huge-swaths-of-grasses-in-the-southeast", "time": "11月06日 07:00", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}, {"title_orig": "First-time homebuyers remain scarce, but a record share of them pay all cash", "title_zh": "首次购房者仍然很少，但其中创纪录的份额支付所有现金", "summary_orig": "A new report finds generational wealth is widening the divide between homebuyers and those priced out. The median age of first-time buyers also remains at a record high.", "summary_zh": "一份新的报告发现，代际财富正在扩大购房者和被淘汰者之间的鸿沟。首次购房者的年龄中位数也保持在创纪录的高位。", "body_orig": "A \"for sale\" sign is posted in front of a home on July 09, 2026 in Los Angeles, Calif. A new report finds generational wealth is helping a record share of first-time homebuyers pay with all cash. Justin Sullivan/Getty Images hide caption\n\nThe share of first-time homebuyers remains at a near-record low of 22% as a housing shortage and high prices sideline many, according to a new report by the National Association of Realtors. But those who are managing to buy are older and wealthier than in the past, and 1 in 10 paid all cash, a record high since such data was collected starting in 2003.\n\n\"Inheritances are really driving this,\" said Jessica Lautz, deputy chief economist at the NAR.\n\nFirst-time buyers who paid all-cash were more likely than those who financed a house to use an inheritance (28%) or proceeds from the sale of an inherited property (21%). They were also older.\n\nNAR finds the median age of all first-time buyers remains at 40, a record high. For first-time buyers who financed a purchase it was 38, while for those who paid all-cash it was 54. \"They waited a significant period of time for that generational transfer of wealth to come through,\" Lautz said.\n\nFor first-time buyers overall, personal savings was the biggest source of funding for a down payment. But in another shift, more people used assets – like a 401(k), stocks, or cryptocurrency – than financial help from family or friends. Older buyers have had more time to save up, Lautz said, but she thinks there's another factor: \"I think it's uncomfortable to ask mom and dad for a gift or loan when you're hitting 40 versus your young 30s.\"\n\nThe share of first time buyers using an inheritance is likely to grow in coming years as boomers reach their 80's and beyond. As the report noted, \"there is a growing divide among those who are saving independently and priced out of homeownership, versus those who are waiting on the sidelines but then given a generational transfer of wealth.\"\n\nReal estate agents around the country are seeing the change.\n\n\"I would say in the first 15 years of my career, I saw virtually zero first-time home buyers paying all cash,\" said Jason Miller, a broker with Trust Real Estate Company in St. Cloud, Minn.\n\nBut he's had a number of them since the COVID-19 pandemic, when homebuying surged. \"They knew they had to absolutely have the most sterling offer possible to compete in the competitive marketplace,\" he said.\n\nHigh mortgage rates are also driving all-cash bids, Miller said, since they make it far more expensive to finance a home for 30 years. And not all families wait until death to pass on wealth. Miller sees more clients getting help from family members who may have paid off their own home, or have equity in a second property they can sell and \"are gifting some or all of that money.\" They're viewing it as a kind of \"future inheritance,\" he said.\n\nFor some younger first-time buyers, relatives may only be \"lending them the cash\" to make a bid more attractive, said Nate Johnson, a broker associate with RedKey Realty Leaders in St. Louis. Even with much of the national housing market in a major slump, he said his local market is still intensely competitive for buyers.\n\n\"They just know that if we're looking at five or six offers on the table, let's call it 10 offers on the table, which is not uncommon…maybe three of those offers will be all cash,\" he said.\n\nAfter closing on a property, Johnson has seen some buyers refinance into a mortgage and pay back their family member.\n\nThe rise of all-cash offers makes the market even tougher for those who struggle to save up for a down payment with today's sky-high home prices.\n\n\"For a long time I thought I wanted to buy a house,\" said Seth Daphne Esmeson, who lives in Seattle and will soon turn 33. They and their spouse have good jobs, but also debt, including a car payment and student loans. Not only does Esmeson think they may never be in a position to buy, they've also decided it does not make sense at today's prices.\n\nSeth Daphne Esmeson, who lives in Seattle and will soon turn 33, has decided to put off buying a home, in part due to debts like a car payment and student loans. Jane Corbit hide caption\n\n\"Being that debt burdened, and also having to fix things on your home, like, it sounds really terrible,\" they said.\n\nEsmeson is also not convinced that home equity would outpace other investments. They like their current rental and landlord so are sticking with it for now.\n\nStill, it's frustrating that the housing market worked better for previous generations. \"We have the short end of the deal,\" they said, and \"the gap is expanding.\"\n\nThere's probably only one way they might ever be able to buy. \"If I received an inheritance,\" they said. But \"I love my mom dearly and I don't want to look forward to that, or really want to strategize around that.\"\n\nNPR does not offer or accept money for coverage or interviews. Anyone who makes such an offer or request is not an NPR employee and does not represent NPR.", "body_zh": "2026年7月9日，在加利福尼亚州洛杉矶的一栋房屋前张贴了一个“待售”标志。 一份新的报告发现，代际财富正在帮助首次购房者用所有现金支付创纪录的份额。 Justin Sullivan/Getty Images隐藏标题\n\n根据全国房地产经纪人协会(National Association of Realtors)的一份新报告，由于住房短缺和房价高企，首次购房者的比例仍接近创纪录的22%。 但那些谁是妈妈愿意购买的人比过去更年长、更富有，十分之一的人支付了所有现金，这是自2003年开始收集此类数据以来的最高纪录。\n\nNAR副首席经济学家杰西卡·劳茨（ Jessica Lautz ）说： “继承确实推动了这一点。”\n\n支付全现金的首次购房者比出资购房者更有可能使用遗产（ 28% ）或出售遗产的收益（ 21% ）。 他们也年纪大了。\n\nNAR查找所有首次购房者的中位年龄仍为40岁，创历史新高。 对于资助购买的首次购房者来说，它是38 ，而对于那些支付全现金的人来说，它是54。 劳茨说： “他们等了很长一段时间才实现财富的世代转移。”\n\n首次购买", "body": "2026年7月9日，在加利福尼亚州洛杉矶的一栋房屋前张贴了一个“待售”标志。 一份新的报告发现，代际财富正在帮助首次购房者用所有现金支付创纪录的份额。 Justin Sullivan/Getty Images隐藏标题\n\n根据全国房地产经纪人协会(National Association of Realtors)的一份新报告，由于住房短缺和房价高企，首次购房者的比例仍接近创纪录的22%。 但那些谁是妈妈愿意购买的人比过去更年长、更富有，十分之一的人支付了所有现金，这是自2003年开始收集此类数据以来的最高纪录。\n\nNAR副首席经济学家杰西卡·劳茨（ Jessica Lautz ）说： “继承确实推动了这一点。”\n\n支付全现金的首次购房者比出资购房者更有可能使用遗产（ 28% ）或出售遗产的收益（ 21% ）。 他们也年纪大了。\n\nNAR查找所有首次购房者的中位年龄仍为40岁，创历史新高。 对于资助购买的首次购房者来说，它是38 ，而对于那些支付全现金的人来说，它是54。 劳茨说： “他们等了很长一段时间才实现财富的世代转移。”\n\n首次购买", "link": "https://www.npr.org/2026/11/05/nx-s1-6022491/real-estate-all-cash-offer", "time": "11月05日 23:00", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}, {"title_orig": "As budgets tighten, people are breaking out their library cards", "title_zh": "随着预算收紧，人们开始掏出借书证", "summary_orig": "Some Americans squeezed by high prices are relying more on their local libraries for things like books, streaming services and high-priced items like musical instruments and sewing machines.", "summary_zh": "一些受高价挤压的美国人越来越依赖当地图书馆提供书籍、流媒体服务以及乐器和缝纫机等高价物品。", "body_orig": "People study in the Rose Main Reading Room of the New York Public Library in midtown Manhattan on July 06, 2021. Michael M. Santiago/Getty Images hide caption\n\nIzzy Rivera reads at least one book every week, but buying them new isn't in her budget. As she saves up for law school, some expenses don't make the cut.\n\n\"Say I'm buying a few a month,\" she said, \"it just isn't realistic.\"\n\nThat's why Rivera has recently been leaning more on local libraries near her home in Topeka, Kan., checking out both physical books and digital copies on the Libby app. (Some of her recent reads: Sour Cherry by Natalia Theodoridou, Spoilt Creatures by Amy Twigg and Plastic Inc. by Beth Gardiner.) Rivera also went to her library's used book sale last month, where she picked up 15 books for about $20.\n\nThe library's money-saving potential doesn't end there for her. Rivera also watches movies on the streaming app Kanopy, reads the New York Times at no cost and often passes the time at a local branch.\n\n\"It's somewhere I can go where I'm not expected to spend money,\" she said. \"If I were to go to a coffee shop just to get out and do something, the expectation would be to buy a coffee, even though I probably didn't want a coffee.\"\n\nIt is something of a truism in the library world that, when economic conditions worsen, people use libraries more. Patrons and librarians across the U.S. tell NPR they're seeing that pan out now.\n\nPrices for food and other everyday items continue to rise in part because of the war with Iran, and affordability was a top concern among voters heading into the midterm elections. According to a Pew Research Center survey released in mid-October, 44% of Americans say they've struggled in the past year to afford at least one basic necessity, such as medical care or their rent or mortgage payment. Seventy percent of adults also said they've cut back on \"extras,\" such as subscriptions to streaming services.\n\nData shared with NPR by several of the largest public library systems in the U.S. show recent upticks in cardholder membership, circulation and event attendance. Librarians say part of that can be attributed to the rising cost of living — and the growing recognition that libraries' resources extend far beyond physical books.\n\n\"People start off with Audible and then a friend tells them, 'Why are you paying for that? You can get that at the library if you're a smidgen bit patient,'\" said Jeremy Reeder, director of the Maricopa County Library District in Arizona.\n\nOf course, the rising cost of living is not the only factor driving more people to check out libraries. Many institutions have gotten better at marketing themselves, librarians say, and social media has helped foster a renewed cultural interest in reading.\n\n\"Libraries have been popular for a really long time, but I think that there's heightened awareness of the wide range of offerings that our libraries are providing,\" said Maria McCauley, president of the American Library Association. \"They are especially popular right now, I think, because people are aware that everything that we provide is free or very low cost.\"\n\nThere is historical precedent for the idea that economic slumps are a boon to libraries.\n\nAn analysis by the American Library Association found that circulation increased at 18 large public library systems during a brief U.S. recession in 2001. Another study of 541 libraries found that library use was higher during the Great Recession than in previous years. (However, a 1986 article that tried to draw a similar correlation found no data to support that theory.)\n\nThough it's unclear to what extent affordability concerns are pushing people to libraries now, several large public systems have reported growth in recent years.\n\nUsage of the Los Angeles Public Library's makerspace grew 37% between the last two fiscal years, while digital circulation and library visits were both up over 20%. In-person visits, adult library card applications and Wi-Fi sessions at the Chicago Public Library all jumped by more than 11% year-over-year from January through July. The Maricopa County Library District, which has seen its cardholder base grow sharply as it moved its application process online, recorded a 34% increase in Kanopy use and a 78% surge in Hoopla use over the past three years.\n\nThe Topeka and Shawnee County Public Library, where Izzy Rivera goes, logged an 8.1% increase in digital media checkouts last year, though physical circulation is down. There's also been a surge in requests for tech support, such as help with online job applications.\n\nOverDrive, the company that owns Kanopy, reported a 41% spike in users of the streaming service last year alone.\n\nIn general, libraries are on a cultural come-up: They're increasingly popular among Gen Z and Millennials — even those who aren't big readers. And there's more interest in reading writ large, as social media phenomena such as #BookTok fuel book sales.\n\nAnother change in library use began during the pandemic, when lockdowns forced users to acclimate to digital media, such as the e-books and streaming apps offered by libraries. \"It was already a trend pre-pandemic,\" said Los Angeles Public Library senior librarian Edwin Rodarte, \"but the pandemic sort of boosted it and it just skyrocketed afterward.\"\n\nYet the growing popularity of libraries also comes at a time when their federal funding is under threat. Last year, the Trump administration attempted to gut the federal Institute of Museum and Library Services and cancel the grants it provides to libraries across the country. The attorneys general of 21 states sued to block the move, and the administration ultimately reinstated the grants.\n\nBut the IMLS appears to still be on the Trump administration's radar. When the White House released its budget proposal in April for the current fiscal year, it recommended zeroing out funding for the agency.\n\nMaria McCauley, who is also director of the Cambridge Public Library in Massachusetts, said libraries rely on a combination of federal, state and local funding to operate.\n\n\"Every year, libraries have to make a case for their funding, and especially when it's uncertain, it can be harder to get all the resources that we need,\" she said.\n\n\"All that money we are providing back out to the community in terms of expertise, in terms of beautiful facilities for our community members\" as well as collections and programs, McCauley added.\n\nLibrarians note that libraries are also quick to respond to public needs, and have been a community resource for locals facing issues such as homelessness or food insecurity. One survey found that 56% of libraries offered food security support services last year, the same year a Republican tax and spending bill signed by President Trump ushered in major changes to the Supplemental Nutrition Assistance Program, or SNAP, and millions of Americans started to lose food benefits.\n\nMany libraries also offer classes, meetups and what's often called a \"library of things,\" where they lend out items that patrons may be unable to afford or prefer not to buy: WiFi hotspots, induction cooktops, birding kits, camping gear.\n\nAt a biweekly crafting meetup called \"Sew What?!\" at the Free Library of Philadelphia's Parkway Central Branch, the library provides sewing machines and materials at no cost. Chloe deBeus, who was working on her Halloween costume during a recent event, said attendees can try their hand at sewing and other crafts without having to pay the potentially steep upfront costs.\n\n\"You do need to purchase yarn or you do need to purchase fabric. Maybe if you want to sew, you do need to get a machine,\" deBeus said. \"The question is do I even enjoy it enough to purchase these things up front?\"\n\nDown the hall, Nathaniel Muns was playing a keyboard inside the branch's music department. His own keyboard had broken, and he hadn't replaced it yet. \"Sometimes having a keyboard in your home is not accessible and not doable,\" he said.\n\nAs he practiced the jazz standard \"All the Things You Are\" and other songs, Muns said the cost of living had risen \"astronomically.\" The library offered him, a recent college graduate who now works with an AI startup, a place to go.\n\n\"Being able to come to the library really helps me kind of decompress at the end of the day,\" he said.\n\nNPR does not offer or accept money for coverage or interviews. Anyone who makes such an offer or request is not an NPR employee and does not represent NPR.", "body_zh": "2021年7月6日，人们在曼哈顿中城纽约公共图书馆的玫瑰主阅览室学习。 Michael M. Santiago/Getty Images隐藏标题\n\nIzzy Rivera每周至少读一本书，但买新书不在她的预算之内。 当她为法学院攒钱时，有些费用没有削减。\n\n“假设我每月买几个，”她说， “这太不现实了。”\n\n这就是为什么里维拉最近更多地依靠当地的图书馆她在堪萨斯州托皮卡的家附近，在Libby应用程序上查看实体书籍和数字副本。 （她最近的一些读物： Natalia Theodoridou的《酸樱桃》、Amy Twigg的《Spoilt Creatures》和Beth Gardiner的《Plastic Inc.》。） Rivera上个月还去了图书馆的二手书拍卖会，在那里她以约20 $的价格买了15本书。\n\n图书馆的省钱潜力并不止于此。 Rivera还在流媒体AP上观看电影p Kanopy ，免费阅读《纽约时报》，并经常在当地分支机构消磨时间。\n\n“这是我可以去的地方，我不需要花钱，”她说。 “如果我去咖啡馆只是为了出去做点什么，人们的期望是买一杯咖啡，尽管我可能", "body": "2021年7月6日，人们在曼哈顿中城纽约公共图书馆的玫瑰主阅览室学习。 Michael M. Santiago/Getty Images隐藏标题\n\nIzzy Rivera每周至少读一本书，但买新书不在她的预算之内。 当她为法学院攒钱时，有些费用没有削减。\n\n“假设我每月买几个，”她说， “这太不现实了。”\n\n这就是为什么里维拉最近更多地依靠当地的图书馆她在堪萨斯州托皮卡的家附近，在Libby应用程序上查看实体书籍和数字副本。 （她最近的一些读物： Natalia Theodoridou的《酸樱桃》、Amy Twigg的《Spoilt Creatures》和Beth Gardiner的《Plastic Inc.》。） Rivera上个月还去了图书馆的二手书拍卖会，在那里她以约20 $的价格买了15本书。\n\n图书馆的省钱潜力并不止于此。 Rivera还在流媒体AP上观看电影p Kanopy ，免费阅读《纽约时报》，并经常在当地分支机构消磨时间。\n\n“这是我可以去的地方，我不需要花钱，”她说。 “如果我去咖啡馆只是为了出去做点什么，人们的期望是买一杯咖啡，尽管我可能", "link": "https://www.npr.org/2026/11/05/nx-s1-5992908/libraries-and-cos const tabs = document.getElementById('tabs');
const list = document.getElementById('list');
const meta = document.getElementById('meta');
let cur = 0;
let mode = 'zh';

function esc(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function shortTime(s){
  const m = String(s||'').match(/(\d{1,2})[月日:].*?(\d{1,2}):(\d{2})/);
  if(m) return m[2]+':'+m[3];
  const m2 = String(s||'').match(/(\d{1,2}):(\d{2})/);
  return m2 ? m2[1]+':'+m2[2] : (s||'—').slice(-5);
}
function fillCounts(){
  const nP = (DATA.papers||[]).length;
  const nI = (DATA.papers||[]).reduce((a,p)=>a+((p.items||[]).length),0);
  document.getElementById('cPapers').textContent = nP;
  document.getElementById('cItems').textContent = nI;
  document.getElementById('cTime').textContent = shortTime(DATA.updated);
}
function renderTabs(){
  tabs.innerHTML = DATA.papers.map((p,i)=>{
    const n = (p.items||[]).length;
    return `<button type="button" class="${i===cur?'on':''}" data-i="${i}">${esc(p.name)}（${n}）</button>`;
  }).join('');
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i; render();});
}
function blockFor(it){
  const tZh = it.title_zh || it.title_orig || '';
  const tOrig = it.title_orig || '';
  const sZh = it.summary_zh || '';
  const sOrig = it.summary_orig || '';
  const bZh = it.body_zh || it.body || '';
  const bOrig = it.body_orig || '';
  const showZh = mode==='zh' || mode==='bi';
  const showOrig = mode==='orig' || mode==='bi';
  const needOrigTitle = tOrig && tOrig !== tZh;
  let html = '<div class="badges">';
  html += `<span class="badge ${esc(it.badge_cls||'warn')}">${esc(it.badge||'未验证')}</span>`;
  if(it.note) html += `<span class="badge">${esc(it.note)}</span>`;
  html += '</div>';
  if(showZh) html += `<h2 class="zh">${esc(tZh)}</h2>`;
  if(showOrig && needOrigTitle) html += `<h2 class="orig">${esc(tOrig)}</h2>`;
  if(showOrig && !needOrigTitle && mode==='orig') html += `<h2 class="orig">${esc(tOrig||tZh)}</h2>`;
  if(showZh && sZh) html += `<p class="summary zh">${esc(sZh)}</p>`;
  if(showOrig && sOrig && sOrig !== sZh) html += `<p class="summary orig">${esc(sOrig)}</p>`;
  if(mode==='bi' && (bZh || bOrig)) html += `<div class="bi-sep"></div>`;
  if(showZh && bZh){
    html += `<div class="body zh">${esc(bZh)}</div>`;
    if(mode==='zh' && bOrig && bOrig.length > Math.max(500, bZh.length + 200)){
      html += `<p class="summary">（以上为译文节选；以下为原文全文）</p>`;
      html += `<div class="body orig">${esc(bOrig)}</div>`;
    }
  }
  if(showOrig && bOrig) html += `<div class="body orig">${esc(bOrig)}</div>`;
  if(showOrig && !bOrig && mode==='orig' && bZh) html += `<div class="body">${esc(bZh)}</div>`;
  return html;
}
function render(){
  renderTabs();
  document.querySelectorAll('.langbar .pill').forEach(b=>{
    b.classList.toggle('on', b.dataset.mode===mode);
  });
  const p = DATA.papers[cur];
  const n = (p.items||[]).length;
  meta.textContent = `《${p.name}》· ${p.lang} · ${p.tab_note} · 本栏 ${n} 条 · 数据时间 ${DATA.updated}`;
  if(p.error){ list.innerHTML = `<div class="empty">${esc(p.error)}</div>`; return; }
  if(!n){ list.innerHTML = `<div class="empty">暂无条目</div>`; return; }
  list.innerHTML = p.items.map(it=>`<article class="card">${blockFor(it)}
    <div class="row"><span>${esc(it.time||'')}</span><a href="${esc(it.link)}" target="_blank" rel="noopener">打开原文</a></div>
  </article>`).join('');
}
document.querySelectorAll('.langbar .pill').forEach(b=>{
  b.onclick=()=>{ mode=b.dataset.mode; render(); };
});

/* 全屏：真全屏优先，不行则沉浸模式 */
const FS_IMM_KEY='newsapp4_imm_v1';
function $(id){return document.getElementById(id);}
function realFs(){const d=document;return !!(d.fullscreenElement||d.webkitFullscreenElement);}
function immOn(){return document.documentElement.classList.contains('immersive');}
function fsLabel(){const b=$('btnFs');if(!b)return;b.textContent=(realFs()||immOn())?'退出全屏':'全屏';}
function fsTip(t){const el=$('fsTip');if(!el)return;$('fsTipTxt').textContent=t;el.classList.add('show');clearTimeout(fsTip._t);fsTip._t=setTimeout(()=>el.classList.remove('show'),9000);}
function setImm(on){document.documentElement.classList.toggle('immersive',!!on);try{sessionStorage.setItem(FS_IMM_KEY,on?'1':'0');}catch(e){}fsLabel();try{window.scrollTo(0,on?1:0);}catch(e){}}
function toggleFs(){
  const d=document,el=d.documentElement;
  if(realFs()||immOn()){try{if(realFs())(d.exitFullscreen||d.webkitExitFullscreen).call(d);}catch(e){}setImm(false);return;}
  setImm(true);
  const fn=el.requestFullscreen||el.webkitRequestFullscreen;
  const ua=navigator.userAgent||'';
  const ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
  const standalone=window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches);
  if(standalone){return;}
  let ok=false;
  if(fn&&!ios){try{const p=fn.call(el);if(p&&p.then){p.then(()=>{},()=>{fsTip('这个浏览器不让网页进入真全屏，已切到沉浸模式。想去掉地址栏：用浏览器打开后「添加到主屏幕」，再从桌面图标打开。');});}ok=true;}catch(e){}}
  if(!ok){fsTip(ios?'苹果手机的浏览器不允许网页真全屏，已切到沉浸模式。想彻底没有地址栏：点分享 → 添加到主屏幕，以后从桌面图标打开。':'这个浏览器不支持网页真全屏，已切到沉浸模式。想更全屏：用浏览器打开后「添加到主屏幕」。');}
}
$('btnFs').onclick=toggleFs;
$('fsTipOk').onclick=()=>$('fsTip').classList.remove('show');
document.addEventListener('fullscreenchange',()=>{if(!realFs()&&immOn()){setImm(false);}fsLabel();});
document.addEventListener('webkitfullscreenchange',()=>{if(!realFs()&&immOn()){setImm(false);}fsLabel();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&immOn()&&!realFs()){setImm(false);}});
try{if(sessionStorage.getItem(FS_IMM_KEY)==='1')setImm(true);}catch(e){}
fsLabel();

fillCounts();
render();
</script>
