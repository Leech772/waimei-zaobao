ns at 40, a record high. For first-time buyers who financed a purchase it was 38, while for those who paid all-cash it was 54. \"They waited a significant period of time for that generational transfer of wealth to come through,\" Lautz said.\n\nFor first-time buyers overall, personal savings was the biggest source of funding for a down payment. But in another shift, more people used assets – like a 401(k), stocks, or cryptocurrency – than financial help from family or friends. Older buyers have had more time to save up, Lautz said, but she thinks there's another factor: \"I think it's uncomfortable to ask mom and dad for a gift or loan when you're hitting 40 versus your young 30s.\"\n\nThe share of first time buyers using an inheritance is likely to grow in coming years as boomers reach their 80's and beyond. As the report noted, \"there is a growing divide among those who are saving independently and priced out of homeownership, versus those who are waiting on the sidelines but then given a generational transfer of wealth.\"\n\nReal estate agents around the country are seeing the change.\n\n\"I would say in the first 15 years of my career, I saw virtually zero first-time home buyers paying all cash,\" said Jason Miller, a broker with Trust Real Estate Company in St. Cloud, Minn.\n\nBut he's had a number of them since the COVID-19 pandemic, when homebuying surged. \"They knew they had to absolutely have the most sterling offer possible to compete in the competitive marketplace,\" he said.\n\nHigh mortgage rates are also driving all-cash bids, Miller said, since they make it far more expensive to finance a home for 30 years. And not all families wait until death to pass on wealth. Miller sees more clients getting help from family members who may have paid off their own home, or have equity in a second property they can sell and \"are gifting some or all of that money.\" They're viewing it as a kind of \"future inheritance,\" he said.\n\nFor some younger first-time buyers, relatives may only be \"lending them the cash\" to make a bid more attractive, said Nate Johnson, a broker associate with RedKey Realty Leaders in St. Louis. Even with much of the national housing market in a major slump, he said his local market is still intensely competitive for buyers.\n\n\"They just know that if we're looking at five or six offers on the table, let's call it 10 offers on the table, which is not uncommon…maybe three of those offers will be all cash,\" he said.\n\nAfter closing on a property, Johnson has seen some buyers refinance into a mortgage and pay back their family member.\n\nThe rise of all-cash offers makes the market even tougher for those who struggle to save up for a down payment with today's sky-high home prices.\n\n\"For a long time I thought I wanted to buy a house,\" said Seth Daphne Esmeson, who lives in Seattle and will soon turn 33. They and their spouse have good jobs, but also debt, including a car payment and student loans. Not only does Esmeson think they may never be in a position to buy, they've also decided it does not make sense at today's prices.\n\nSeth Daphne Esmeson, who lives in Seattle and will soon turn 33, has decided to put off buying a home, in part due to debts like a car payment and student loans. Jane Corbit hide caption\n\n\"Being that debt burdened, and also having to fix things on your home, like, it sounds really terrible,\" they said.\n\nEsmeson is also not convinced that home equity would outpace other investments. They like their current rental and landlord so are sticking with it for now.\n\nStill, it's frustrating that the housing market worked better for previous generations. \"We have the short end of the deal,\" they said, and \"the gap is expanding.\"\n\nThere's probably only one way they might ever be able to buy. \"If I received an inheritance,\" they said. But \"I love my mom dearly and I don't want to look forward to that, or really want to strategize around that.\"\n\nNPR does not offer or accept money for coverage or interviews. Anyone who makes such an offer or request is not an NPR employee and does not represent NPR.", "body_zh": "2026年7月9日，在加利福尼亚州洛杉矶的一栋房屋前张贴了一个“待售”标志。 一份新的报告发现，代际财富正在帮助首次购房者用所有现金支付创纪录的份额。 Justin Sullivan/Getty Images隐藏标题\n\n根据全国房地产经纪人协会(National Association of Realtors)的一份新报告，由于住房短缺和房价高企，首次购房者的比例仍接近创纪录的22%。 但那些谁是妈妈愿意购买的人比过去更年长、更富有，十分之一的人支付了所有现金，这是自2003年开始收集此类数据以来的最高纪录。\n\nNAR副首席经济学家杰西卡·劳茨（ Jessica Lautz ）说： “继承确实推动了这一点。”\n\n支付全现金的首次购房者比出资购房者更有可能使用遗产（ 28% ）或出售遗产的收益（ 21% ）。 他们也年纪大了。\n\nNAR查找所有首次购房者的中位年龄仍为40岁，创历史新高。 对于资助购买的首次购房者来说，它是38 ，而对于那些支付全现金的人来说，它是54。 劳茨说： “他们等了很长一段时间才实现财富的世代转移。”\n\n首次购买", "body": "2026年7月9日，在加利福尼亚州洛杉矶的一栋房屋前张贴了一个“待售”标志。 一份新的报告发现，代际财富正在帮助首次购房者用所有现金支付创纪录的份额。 Justin Sullivan/Getty Images隐藏标题\n\n根据全国房地产经纪人协会(National Association of Realtors)的一份新报告，由于住房短缺和房价高企，首次购房者的比例仍接近创纪录的22%。 但那些谁是妈妈愿意购买的人比过去更年长、更富有，十分之一的人支付了所有现金，这是自2003年开始收集此类数据以来的最高纪录。\n\nNAR副首席经济学家杰西卡·劳茨（ Jessica Lautz ）说： “继承确实推动了这一点。”\n\n支付全现金的首次购房者比出资购房者更有可能使用遗产（ 28% ）或出售遗产的收益（ 21% ）。 他们也年纪大了。\n\nNAR查找所有首次购房者的中位年龄仍为40岁，创历史新高。 对于资助购买的首次购房者来说，它是38 ，而对于那些支付全现金的人来说，它是54。 劳茨说： “他们等了很长一段时间才实现财富的世代转移。”\n\n首次购买", "link": "https://www.npr.org/2026/11/05/nx-s1-6022491/real-estate-all-cash-offer", "time": "11月05日 23:00", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}, {"title_orig": "As budgets tighten, people are breaking out their library cards", "title_zh": "随着预算收紧，人们开始掏出借书证", "summary_orig": "Some Americans squeezed by high prices are relying more on their local libraries for things like books, streaming services and high-priced items like musical instruments and sewing machines.", "summary_zh": "一些受高价挤压的美国人越来越依赖当地图书馆提供书籍、流媒体服务以及乐器和缝纫机等高价物品。", "body_orig": "People study in the Rose Main Reading Room of the New York Public Library in midtown Manhattan on July 06, 2021. Michael M. Santiago/Getty Images hide caption\n\nIzzy Rivera reads at least one book every week, but buying them new isn't in her budget. As she saves up for law school, some expenses don't make the cut.\n\n\"Say I'm buying a few a month,\" she said, \"it just isn't realistic.\"\n\nThat's why Rivera has recently been leaning more on local libraries near her home in Topeka, Kan., checking out both physical books and digital copies on the Libby app. (Some of her recent reads: Sour Cherry by Natalia Theodoridou, Spoilt Creatures by Amy Twigg and Plastic Inc. by Beth Gardiner.) Rivera also went to her library's used book sale last month, where she picked up 15 books for about $20.\n\nThe library's money-saving potential doesn't end there for her. Rivera also watches movies on the streaming app Kanopy, reads the New York Times at no cost and often passes the time at a local branch.\n\n\"It's somewhere I can go where I'm not expected to spend money,\" she said. \"If I were to go to a coffee shop just to get out and do something, the expectation would be to buy a coffee, even though I probably didn't want a coffee.\"\n\nIt is something of a truism in the library world that, when economic conditions worsen, people use libraries more. Patrons and librarians across the U.S. tell NPR they're seeing that pan out now.\n\nPrices for food and other everyday items continue to rise in part because of the war with Iran, and affordability was a top concern among voters heading into the midterm elections. According to a Pew Research Center survey released in mid-October, 44% of Americans say they've struggled in the past year to afford at least one basic necessity, such as medical care or their rent or mortgage payment. Seventy percent of adults also said they've cut back on \"extras,\" such as subscriptions to streaming services.\n\nData shared with NPR by several of the largest public library systems in the U.S. show recent upticks in cardholder membership, circulation and event attendance. Librarians say part of that can be attributed to the rising cost of living — and the growing recognition that libraries' resources extend far beyond physical books.\n\n\"People start off with Audible and then a friend tells them, 'Why are you paying for that? You can get that at the library if you're a smidgen bit patient,'\" said Jeremy Reeder, director of the Maricopa County Library District in Arizona.\n\nOf course, the rising cost of living is not the only factor driving more people to check out libraries. Many institutions have gotten better at marketing themselves, librarians say, and social media has helped foster a renewed cultural interest in reading.\n\n\"Libraries have been popular for a really long time, but I think that there's heightened awareness of the wide range of offerings that our libraries are providing,\" said Maria McCauley, president of the American Library Association. \"They are especially popular right now, I think, because people are aware that everything that we provide is free or very low cost.\"\n\nThere is historical precedent for the idea that economic slumps are a boon to libraries.\n\nAn analysis by the American Library Association found that circulation increased at 18 large public library systems during a brief U.S. recession in 2001. Another study of 541 libraries found that library use was higher during the Great Recession than in previous years. (However, a 1986 article that tried to draw a similar correlation found no data to support that theory.)\n\nThough it's unclear to what extent affordability concerns are pushing people to libraries now, several large public systems have reported growth in recent years.\n\nUsage of the Los Angeles Public Library's makerspace grew 37% between the last two fiscal years, while digital circulation and library visits were both up over 20%. In-person visits, adult library card applications and Wi-Fi sessions at the Chicago Public Library all jumped by more than 11% year-over-year from January through July. The Maricopa County Library District, which has seen its cardholder base grow sharply as it moved its application process online, recorded a 34% increase in Kanopy use and a 78% surge in Hoopla use over the past three years.\n\nThe Topeka and Shawnee County Public Library, where Izzy Rivera goes, logged an 8.1% increase in digital media checkouts last year, though physical circulation is down. There's also been a surge in requests for tech support, such as help with online job applications.\n\nOverDrive, the company that owns Kanopy, reported a 41% spike in users of the streaming service last year alone.\n\nIn general, libraries are on a cultural come-up: They're increasingly popular among Gen Z and Millennials — even those who aren't big readers. And there's more interest in reading writ large, as social media phenomena such as #BookTok fuel book sales.\n\nAnother change in library use began during the pandemic, when lockdowns forced users to acclimate to digital media, such as the e-books and streaming apps offered by libraries. \"It was already a trend pre-pandemic,\" said Los Angeles Public Library senior librarian Edwin Rodarte, \"but the pandemic sort of boosted it and it just skyrocketed afterward.\"\n\nYet the growing popularity of libraries also comes at a time when their federal funding is under threat. Last year, the Trump administration attempted to gut the federal Institute of Museum and Library Services and cancel the grants it provides to libraries across the country. The attorneys general of 21 states sued to block the move, and the administration ultimately reinstated the grants.\n\nBut the IMLS appears to still be on the Trump administration's radar. When the White House released its budget proposal in April for the current fiscal year, it recommended zeroing out funding for the agency.\n\nMaria McCauley, who is also director of the Cambridge Public Library in Massachusetts, said libraries rely on a combination of federal, state and local funding to operate.\n\n\"Every year, libraries have to make a case for their funding, and especially when it's uncertain, it can be harder to get all the resources that we need,\" she said.\n\n\"All that money we are providing back out to the community in terms of expertise, in terms of beautiful facilities for our community members\" as well as collections and programs, McCauley added.\n\nLibrarians note that libraries are also quick to respond to public needs, and have been a community resource for locals facing issues such as homelessness or food insecurity. One survey found that 56% of libraries offered food security support services last year, the same year a Republican tax and spending bill signed by President Trump ushered in major changes to the Supplemental Nutrition Assistance Program, or SNAP, and millions of Americans started to lose food benefits.\n\nMany libraries also offer classes, meetups and what's often called a \"library of things,\" where they lend out items that patrons may be unable to afford or prefer not to buy: WiFi hotspots, induction cooktops, birding kits, camping gear.\n\nAt a biweekly crafting meetup called \"Sew What?!\" at the Free Library of Philadelphia's Parkway Central Branch, the library provides sewing machines and materials at no cost. Chloe deBeus, who was working on her Halloween costume during a recent event, said attendees can try their hand at sewing and other crafts without having to pay the potentially steep upfront costs.\n\n\"You do need to purchase yarn or you do need to purchase fabric. Maybe if you want to sew, you do need to get a machine,\" deBeus said. \"The question is do I even enjoy it enough to purchase these things up front?\"\n\nDown the hall, Nathaniel Muns was playing a keyboard inside the branch's music department. His own keyboard had broken, and he hadn't replaced it yet. \"Sometimes having a keyboard in your home is not accessible and not doable,\" he said.\n\nAs he practiced the jazz standard \"All the Things You Are\" and other songs, Muns said the cost of living had risen \"astronomically.\" The library offered him, a recent college graduate who now works with an AI startup, a place to go.\n\n\"Being able to come to the library really helps me kind of decompress at the end of the day,\" he said.\n\nNPR does not offer or accept money for coverage or interviews. Anyone who makes such an offer or request is not an NPR employee and does not represent NPR.", "body_zh": "2021年7月6日，人们在曼哈顿中城纽约公共图书馆的玫瑰主阅览室学习。 Michael M. Santiago/Getty Images隐藏标题\n\nIzzy Rivera每周至少读一本书，但买新书不在她的预算之内。 当她为法学院攒钱时，有些费用没有削减。\n\n“假设我每月买几个，”她说， “这太不现实了。”\n\n这就是为什么里维拉最近更多地依靠当地的图书馆她在堪萨斯州托皮卡的家附近，在Libby应用程序上查看实体书籍和数字副本。 （她最近的一些读物： Natalia Theodoridou的《酸樱桃》、Amy Twigg的《Spoilt Creatures》和Beth Gardiner的《Plastic Inc.》。） Rivera上个月还去了图书馆的二手书拍卖会，在那里她以约20 $的价格买了15本书。\n\n图书馆的省钱潜力并不止于此。 Rivera还在流媒体AP上观看电影p Kanopy ，免费阅读《纽约时报》，并经常在当地分支机构消磨时间。\n\n“这是我可以去的地方，我不需要花钱，”她说。 “如果我去咖啡馆只是为了出去做点什么，人们的期望是买一杯咖啡，尽管我可能", "body": "2021年7月6日，人们在曼哈顿中城纽约公共图书馆的玫瑰主阅览室学习。 Michael M. Santiago/Getty Images隐藏标题\n\nIzzy Rivera每周至少读一本书，但买新书不在她的预算之内。 当她为法学院攒钱时，有些费用没有削减。\n\n“假设我每月买几个，”她说， “这太不现实了。”\n\n这就是为什么里维拉最近更多地依靠当地的图书馆她在堪萨斯州托皮卡的家附近，在Libby应用程序上查看实体书籍和数字副本。 （她最近的一些读物： Natalia Theodoridou的《酸樱桃》、Amy Twigg的《Spoilt Creatures》和Beth Gardiner的《Plastic Inc.》。） Rivera上个月还去了图书馆的二手书拍卖会，在那里她以约20 $的价格买了15本书。\n\n图书馆的省钱潜力并不止于此。 Rivera还在流媒体AP上观看电影p Kanopy ，免费阅读《纽约时报》，并经常在当地分支机构消磨时间。\n\n“这是我可以去的地方，我不需要花钱，”她说。 “如果我去咖啡馆只是为了出去做点什么，人们的期望是买一杯咖啡，尽管我可能", "link": "https://www.npr.org/2026/11/05/nx-s1-5992908/libraries-and-cost-of-living", "time": "11月05日 18:00", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": true}]}, {"key": "zaobao", "name": "联合早报", "lang": "中文", "tab_note": "本页嵌免费全文（本轮亲测多篇可完整阅读；抓公开国际栏目）", "free_mark": "full_verified", "error": null, "items": [{"title_orig": "国际特稿：选票难熄中东战火 美以政局洗牌为何难阻对伊战争", "title_zh": "国际特稿：选票难熄中东战火 美以政局洗牌为何难阻对伊战争", "summary_orig": "", "summary_zh": "10月27日以色列大选“无果而终”后，紧接着的11月3日美国中期选举也尘埃落定。短短一周之内，主导中东战局走向的两个战略中枢接连经历政局洗牌。\n\n在耶路撒冷，高度割裂的议会版图令政局深陷泥潭。支持与反对现任总理内坦亚胡的两大阵营都未能跨过61席的执政门槛。内坦亚胡虽暂以看守总理身份留任，但权力根基已严重动摇。\n\n然而，这绝不意味白宫会向德黑兰示弱。无论是美国", "body_orig": "", "body_zh": "10月27日以色列大选“无果而终”后，紧接着的11月3日美国中期选举也尘埃落定。短短一周之内，主导中东战局走向的两个战略中枢接连经历政局洗牌。\n\n在耶路撒冷，高度割裂的议会版图令政局深陷泥潭。支持与反对现任总理内坦亚胡的两大阵营都未能跨过61席的执政门槛。内坦亚胡虽暂以看守总理身份留任，但权力根基已严重动摇。\n\n然而，这绝不意味白宫会向德黑兰示弱。无论是美国宪政赋予总统的对外用兵特权，还是中东盘根错节的安全死结，美以两国内政的剧烈震荡不仅未能给对伊强硬路线踩下刹车，反而进一步锁死外交斡旋的妥协空间。\n\n中东外交消息人士透露，伊朗此前密切追踪美国中期选情，并在霍尔木兹海峡升级对商船的袭扰，意图推高国际能源价格与通胀预期向美国选民施压，借此迫使特朗普政府在战事与制裁僵局中让步。\n\n民主党横扫国会两院的消息一传出，德黑兰便迅速将此归功于自身的极限施压策略。伊朗议会议长兼首席谈判代表卡利巴夫宣称，国会易手的结果证明，美国选民正借由选票向对外动武投下明确的“反对票”。\n\n然而，在国际政治观察家眼中，德黑兰的乐观研判过于一厢情愿。专家学者普遍指出，国会掣肘虽会收紧行政当局的内政预算，却无法实质束缚白宫升级对伊军事威慑的手脚。\n\n投票日当天，特朗普接受《金融时报》专访时释放了耐人寻味的战术信号。他一方面表明美国暂无立即打击伊朗的计划，另一方面坚称美军随时“严阵以待”。\n\n这番在战术节奏上踩刹车、却维持引信待发的表态，被外界解读为巩固战场筹码后的心理战，绝非战略层面的收手或退让。\n\n美国得克萨斯州南方卫理公会大学政治学教授吉尔森（Cal Jillson）接受《联合早报》访问时指出：“虽然国会可以通过举行听证会、发起质询及限制资金拨付等手段对白宫施压，但总统在行使总司令权力与对外用兵方面拥有极大的灵活性，尤其是在武装力量已经投入行动之后。”\n\n从美国战时宪政史来看，国会对总统行使战争权力的制约，在强势的行政首长意志面前往往成效有限。\n\n2006年中期选举民主党挟反战浪潮夺回两院，时任总统小布什仍在2007年初宣布向伊拉克大规模增兵，并屡次动用总统否决权化解撤军时间表。\n\n从尼克逊无视反战声浪推进空袭、克林顿绕过众院授权推进北约军事干预，到奥巴马未经国会明确批准介入利比亚战事，白宫在对外动武上的行动逻辑一脉相承。\n\n这意味着，即便新一届民主党国会意图通过预算听证与限缩拨款对总统施压，中东战局的升级与降温，最终走势依然牢牢由椭圆形办公室独断。\n\n特朗普在选前未曾放松对伊朗港口与航道的封锁，选后更不可能将波斯湾的地缘主导权拱手让出。\n\n另一方面，自2023年10月7日多线战火爆发以来，以色列的战略安全思维已彻底重塑。\n\n在耶路撒冷跨党派共识中，无论最终由谁出任总理，伊朗都被定性为不可妥协的头号威胁，前沿防卫与先发制人成为不可动摇的首要选择。\n\n以色列目前的安全教条立足于三大支柱：瓦解伊朗前沿代理人威胁、在境外建立防御缓冲区，以及通过高烈度反击重塑威慑。\n\n政治观察员认为，以色列朝野当下的分歧并非要不要遏制德黑兰，而是手段、时机与动员规模。\n\n卡内基中东中心高级研究员迈克尔·扬（Michael Young）在路透社发表的分析文章中指出，以色列安全机构及大多数政界人士秉持高度一致的战略愿景——集中力量对抗伊朗、构筑安全屏障并维持绝对威慑——这大幅压缩以色列外交转向的空间。\n\n在内坦亚胡及右翼盟友的盘算中，军事强硬路线更具进攻性。内坦亚胡反复强调的“进攻是最好的防守”，背后是以瓦解德黑兰政权作为终极目标，这一意志早已深入以军作战部署。\n\n内坦亚胡前顾问布辛斯基（Aviv Bushinsky）直言，内坦亚胡在对外军事威慑上没有退守余地。“无论是针对伊朗、哈马斯或真主党的战事，都将持续推进。”\n\n华盛顿与耶路撒冷的权力动荡，与中东长期累积的结构性矛盾深度交织。在波斯湾，美军护航编队始终受困于低成本无人机游击战与非对称袭扰。\n\n在承受多轮定点打击与制裁重压下，伊朗决意以持久消耗战对冲美国的技术优势，试图借航道危机消耗美国及其盟友的战略耐心。\n\n夹在中间的波斯湾阿拉伯国家则陷入两难。他们既对以色列不断外溢的多线攻势心存疑虑，担忧局部摩擦失控引爆全面大战，私下又不得不承认，唯有以色列具备实质削弱德黑兰前线代理网络的军事决心。\n\n沙特阿拉伯智库海湾研究中心主席萨格尔（Abdulaziz Sager）道出这种微妙心理：多线开战的破坏力毋庸置疑，但若无法有效遏制伊朗，“未来半个世纪，整个中东都将笼罩在德黑兰的地缘霸权之下”。\n\n更为严峻的是，生存危机感正驱使德黑兰领导层调整威慑手段。在常规反击受挫的背景下，前所未有的安全焦虑促使伊朗加快高丰度铀浓缩步伐、逼近核门槛，试图铸造终极安全屏障。\n\n在华盛顿固守的极限施压、以色列强硬的安全教条与德黑兰背水一战的突围冲动对撞下，波斯湾这场事关生存与主导权的生死角力，正滑向毫无外交缓冲的未知险境。\n\n尽管中期选举让美国出现国会与白宫的对立格局，以色列政坛也深陷难产困境，但这并未实质削弱白宫在对外动武上的决策权与行动自由。\n\n面对失守两院的定局，特朗普在表明接受结果的同时，已明言将频繁动用总统否决权化解国会的立法掣肘。\n\n在对伊政策上，特朗普目前维持典型的“交易型威慑”。在拒绝排除军事打击选项、宣称美军“随时准备就绪”的同时，又对当前的封锁与施压格局表示满意，刻意将动武门槛置于高度模糊状态。\n\n美国有线电视新闻网（CNN）全球事务分析员麦格克（Brett McGurk）撰文指出，在享有总统战时特权护航的前提下，特朗普眼前的对伊战略推演主要涵盖三种路径：\n\n美军在几轮象征性行动后单方面宣称完成阶段性威慑目标，借战术妥协换取霍尔木兹海峡全面复航，以平抑美国国内能源价格与通胀压力。\n\n不过麦格克认为，这种推演在现实中难以成立。特朗普若有意通过全面降温来安抚国内经济，理应在选前付诸行动。既然在选前顶住政治与经济成本维持严密封锁，选后更无理由轻易放弃业已成形的压迫态势。\n\n美国智库国际政策中心非驻地高级研究员图西（Sina Toossi）分析指出，美军若在此刻掉头抽身，将被德黑兰视为“抵抗阵线”的战略胜利，为伊朗重整核导武库与区域代理网络提供喘息窗口。\n\n新加坡南洋理工大学拉惹勒南国际研究院美国项目副研究员曾宪安也认为，达成此类战术性退场的可能性极低。\n\n他告诉早报：“对特朗普而言，若仅为换取霍尔木兹海峡复航便向伊朗妥协，在外界眼中无异于一种政治屈服，其战略声誉恐难承受这一代价。”\n\n这是华盛顿国家安全建制派目前评估最契合现状的折中方案：维持海空严密扼制与舰队护航，同时对伊朗沿岸雷达、导弹阵地等军事节点施加非对称精准打击。\n\n麦格克分析，这套方案不以打响全面战争为目的，而是旨在不惜高昂成本重塑威慑，将战场压力转化为迫使德黑兰在核问题及航行安全上重返谈判桌的筹码。\n\n特朗普在采访中透露，“我们似乎已得到我们想要的一切”，恰恰印证他认定当前无须冒全面交火风险即可掌握主动。然而，这种极限施压极其脆弱，稍有误判便可能导致冲突升级。\n\n在这套高风险设想中，美军可能联合以色列，对伊朗本土关键战略与核设施实施毁灭性打击，试图以绝对军事优势打破中东僵局，强行重启因加沙冲突而搁置的《亚伯拉罕协议》，促成沙特阿拉伯与以色列建交。\n\n无论白宫最终倾向哪一种方案，美伊在战略认知上的鸿沟正急剧放大误判风险。图西告诉早报，前述方案都隐藏巨大危机，原因在于过去两年的战火已从根本上重塑了德黑兰的战略逻辑。\n\n伊朗领导层如今认定，此前的克制反而招致针对自身的持续打击，“唯有向美国及其盟友施加即时、持续且不断升级的高昂代价，方能有效遏制新的军事侵犯”。\n\n当下局势最核心的危险，在于双方陷入消耗战的认知陷阱：华盛顿坚信极限经济施压与定点威慑终能迫使德黑兰屈服；德黑兰则决意以政权的抗压韧性，持续推高美国的经济与护航成本。\n\n以色列大选没有确定结果，再度陷入宪政悬峙。反对阵营虽然在议席总数上具备抗衡能力，但内部派系林立。\n\n内坦亚胡领导的利库德集团勉强守住第一大党地位，但过往稳固的右翼宗教执政联盟面临瓦解。在漫长的组阁博弈与再度大选的阴影下，内坦亚胡以看守总理身份执政，不仅牵制以色列内政，也打乱白宫的战略节奏。", "body": "10月27日以色列大选“无果而终”后，紧接着的11月3日美国中期选举也尘埃落定。短短一周之内，主导中东战局走向的两个战略中枢接连经历政局洗牌。\n\n在耶路撒冷，高度割裂的议会版图令政局深陷泥潭。支持与反对现任总理内坦亚胡的两大阵营都未能跨过61席的执政门槛。内坦亚胡虽暂以看守总理身份留任，但权力根基已严重动摇。\n\n然而，这绝不意味白宫会向德黑兰示弱。无论是美国宪政赋予总统的对外用兵特权，还是中东盘根错节的安全死结，美以两国内政的剧烈震荡不仅未能给对伊强硬路线踩下刹车，反而进一步锁死外交斡旋的妥协空间。\n\n中东外交消息人士透露，伊朗此前密切追踪美国中期选情，并在霍尔木兹海峡升级对商船的袭扰，意图推高国际能源价格与通胀预期向美国选民施压，借此迫使特朗普政府在战事与制裁僵局中让步。\n\n民主党横扫国会两院的消息一传出，德黑兰便迅速将此归功于自身的极限施压策略。伊朗议会议长兼首席谈判代表卡利巴夫宣称，国会易手的结果证明，美国选民正借由选票向对外动武投下明确的“反对票”。\n\n然而，在国际政治观察家眼中，德黑兰的乐观研判过于一厢情愿。专家学者普遍指出，国会掣肘虽会收紧行政当局的内政预算，却无法实质束缚白宫升级对伊军事威慑的手脚。\n\n投票日当天，特朗普接受《金融时报》专访时释放了耐人寻味的战术信号。他一方面表明美国暂无立即打击伊朗的计划，另一方面坚称美军随时“严阵以待”。\n\n这番在战术节奏上踩刹车、却维持引信待发的表态，被外界解读为巩固战场筹码后的心理战，绝非战略层面的收手或退让。\n\n美国得克萨斯州南方卫理公会大学政治学教授吉尔森（Cal Jillson）接受《联合早报》访问时指出：“虽然国会可以通过举行听证会、发起质询及限制资金拨付等手段对白宫施压，但总统在行使总司令权力与对外用兵方面拥有极大的灵活性，尤其是在武装力量已经投入行动之后。”\n\n从美国战时宪政史来看，国会对总统行使战争权力的制约，在强势的行政首长意志面前往往成效有限。\n\n2006年中期选举民主党挟反战浪潮夺回两院，时任总统小布什仍在2007年初宣布向伊拉克大规模增兵，并屡次动用总统否决权化解撤军时间表。\n\n从尼克逊无视反战声浪推进空袭、克林顿绕过众院授权推进北约军事干预，到奥巴马未经国会明确批准介入利比亚战事，白宫在对外动武上的行动逻辑一脉相承。\n\n这意味着，即便新一届民主党国会意图通过预算听证与限缩拨款对总统施压，中东战局的升级与降温，最终走势依然牢牢由椭圆形办公室独断。\n\n特朗普在选前未曾放松对伊朗港口与航道的封锁，选后更不可能将波斯湾的地缘主导权拱手让出。\n\n另一方面，自2023年10月7日多线战火爆发以来，以色列的战略安全思维已彻底重塑。\n\n在耶路撒冷跨党派共识中，无论最终由谁出任总理，伊朗都被定性为不可妥协的头号威胁，前沿防卫与先发制人成为不可动摇的首要选择。\n\n以色列目前的安全教条立足于三大支柱：瓦解伊朗前沿代理人威胁、在境外建立防御缓冲区，以及通过高烈度反击重塑威慑。\n\n政治观察员认为，以色列朝野当下的分歧并非要不要遏制德黑兰，而是手段、时机与动员规模。\n\n卡内基中东中心高级研究员迈克尔·扬（Michael Young）在路透社发表的分析文章中指出，以色列安全机构及大多数政界人士秉持高度一致的战略愿景——集中力量对抗伊朗、构筑安全屏障并维持绝对威慑——这大幅压缩以色列外交转向的空间。\n\n在内坦亚胡及右翼盟友的盘算中，军事强硬路线更具进攻性。内坦亚胡反复强调的“进攻是最好的防守”，背后是以瓦解德黑兰政权作为终极目标，这一意志早已深入以军作战部署。\n\n内坦亚胡前顾问布辛斯基（Aviv Bushinsky）直言，内坦亚胡在对外军事威慑上没有退守余地。“无论是针对伊朗、哈马斯或真主党的战事，都将持续推进。”\n\n华盛顿与耶路撒冷的权力动荡，与中东长期累积的结构性矛盾深度交织。在波斯湾，美军护航编队始终受困于低成本无人机游击战与非对称袭扰。\n\n在承受多轮定点打击与制裁重压下，伊朗决意以持久消耗战对冲美国的技术优势，试图借航道危机消耗美国及其盟友的战略耐心。\n\n夹在中间的波斯湾阿拉伯国家则陷入两难。他们既对以色列不断外溢的多线攻势心存疑虑，担忧局部摩擦失控引爆全面大战，私下又不得不承认，唯有以色列具备实质削弱德黑兰前线代理网络的军事决心。\n\n沙特阿拉伯智库海湾研究中心主席萨格尔（Abdulaziz Sager）道出这种微妙心理：多线开战的破坏力毋庸置疑，但若无法有效遏制伊朗，“未来半个世纪，整个中东都将笼罩在德黑兰的地缘霸权之下”。\n\n更为严峻的是，生存危机感正驱使德黑兰领导层调整威慑手段。在常规反击受挫的背景下，前所未有的安全焦虑促使伊朗加快高丰度铀浓缩步伐、逼近核门槛，试图铸造终极安全屏障。\n\n在华盛顿固守的极限施压、以色列强硬的安全教条与德黑兰背水一战的突围冲动对撞下，波斯湾这场事关生存与主导权的生死角力，正滑向毫无外交缓冲的未知险境。\n\n尽管中期选举让美国出现国会与白宫的对立格局，以色列政坛也深陷难产困境，但这并未实质削弱白宫在对外动武上的决策权与行动自由。\n\n面对失守两院的定局，特朗普在表明接受结果的同时，已明言将频繁动用总统否决权化解国会的立法掣肘。\n\n在对伊政策上，特朗普目前维持典型的“交易型威慑”。在拒绝排除军事打击选项、宣称美军“随时准备就绪”的同时，又对当前的封锁与施压格局表示满意，刻意将动武门槛置于高度模糊状态。\n\n美国有线电视新闻网（CNN）全球事务分析员麦格克（Brett McGurk）撰文指出，在享有总统战时特权护航的前提下，特朗普眼前的对伊战略推演主要涵盖三种路径：\n\n美军在几轮象征性行动后单方面宣称完成阶段性威慑目标，借战术妥协换取霍尔木兹海峡全面复航，以平抑美国国内能源价格与通胀压力。\n\n不过麦格克认为，这种推演在现实中难以成立。特朗普若有意通过全面降温来安抚国内经济，理应在选前付诸行动。既然在选前顶住政治与经济成本维持严密封锁，选后更无理由轻易放弃业已成形的压迫态势。\n\n美国智库国际政策中心非驻地高级研究员图西（Sina Toossi）分析指出，美军若在此刻掉头抽身，将被德黑兰视为“抵抗阵线”的战略胜利，为伊朗重整核导武库与区域代理网络提供喘息窗口。\n\n新加坡南洋理工大学拉惹勒南国际研究院美国项目副研究员曾宪安也认为，达成此类战术性退场的可能性极低。\n\n他告诉早报：“对特朗普而言，若仅为换取霍尔木兹海峡复航便向伊朗妥协，在外界眼中无异于一种政治屈服，其战略声誉恐难承受这一代价。”\n\n这是华盛顿国家安全建制派目前评估最契合现状的折中方案：维持海空严密扼制与舰队护航，同时对伊朗沿岸雷达、导弹阵地等军事节点施加非对称精准打击。\n\n麦格克分析，这套方案不以打响全面战争为目的，而是旨在不惜高昂成本重塑威慑，将战场压力转化为迫使德黑兰在核问题及航行安全上重返谈判桌的筹码。\n\n特朗普在采访中透露，“我们似乎已得到我们想要的一切”，恰恰印证他认定当前无须冒全面交火风险即可掌握主动。然而，这种极限施压极其脆弱，稍有误判便可能导致冲突升级。\n\n在这套高风险设想中，美军可能联合以色列，对伊朗本土关键战略与核设施实施毁灭性打击，试图以绝对军事优势打破中东僵局，强行重启因加沙冲突而搁置的《亚伯拉罕协议》，促成沙特阿拉伯与以色列建交。\n\n无论白宫最终倾向哪一种方案，美伊在战略认知上的鸿沟正急剧放大误判风险。图西告诉早报，前述方案都隐藏巨大危机，原因在于过去两年的战火已从根本上重塑了德黑兰的战略逻辑。\n\n伊朗领导层如今认定，此前的克制反而招致针对自身的持续打击，“唯有向美国及其盟友施加即时、持续且不断升级的高昂代价，方能有效遏制新的军事侵犯”。\n\n当下局势最核心的危险，在于双方陷入消耗战的认知陷阱：华盛顿坚信极限经济施压与定点威慑终能迫使德黑兰屈服；德黑兰则决意以政权的抗压韧性，持续推高美国的经济与护航成本。\n\n以色列大选没有确定结果，再度陷入宪政悬峙。反对阵营虽然在议席总数上具备抗衡能力，但内部派系林立。\n\n内坦亚胡领导的利库德集团勉强守住第一大党地位，但过往稳固的右翼宗教执政联盟面临瓦解。在漫长的组阁博弈与再度大选的阴影下，内坦亚胡以看守总理身份执政，不仅牵制以色列内政，也打乱白宫的战略节奏。", "link": "https://www.zaobao.com.sg/news/world/story20261108-9947102", "time": "", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "欧洲民航与媒体连遭三波炸弹恐吓 战机护航客机改道引发混合战恐慌", "title_zh": "欧洲民航与媒体连遭三波炸弹恐吓 战机护航客机改道引发混合战恐慌", "summary_orig": "", "summary_zh": "（布达佩斯/都柏林/布拉格综合电）欧洲多地周五（11月6日）再接获连环炸弹恐吓，爱尔兰、英国和保加利亚的媒体机构也收到威胁电邮，显示恐吓目标可能正从民航领域扩大至其他领域 。\n\n往返里斯本、罗马、布拉格和索菲亚等地的11趟航班日前受到炸弹威胁，部分客机被破改道降落，匈牙利更出动战斗机护航。涉事飞机均已降落，当局至今未发现任何爆炸装置，也无人受伤。\n\n这是欧洲", "body_orig": "", "body_zh": "（布达佩斯/都柏林/布拉格综合电）欧洲多地周五（11月6日）再接获连环炸弹恐吓，爱尔兰、英国和保加利亚的媒体机构也收到威胁电邮，显示恐吓目标可能正从民航领域扩大至其他领域 。\n\n往返里斯本、罗马、布拉格和索菲亚等地的11趟航班日前受到炸弹威胁，部分客机被破改道降落，匈牙利更出动战斗机护航。涉事飞机均已降落，当局至今未发现任何爆炸装置，也无人受伤。\n\n这是欧洲一周内第三波针对民航客机的炸弹恐吓。周二（3日）首波事件涉及七趟航班；周四（5日）再有14趟航班受到虚假警报干扰，部分客机临时降落，甚至须由战斗机护航或拦截。\n\n目前尚不清楚这些威胁由谁发出。欧洲此前已接连发生超市制冷系统遭袭、无人机侵入等干扰事件，新一轮炸弹恐吓进一步引发安全忧虑。\n\n爱尔兰国家广播电视公司、鲍尔媒体集团和维珍媒体集团周五也收到炸弹威胁，随即疏散办公场所人员，部分广播节目一度中断。\n\n这一连串事件发生之际，地缘政治紧张局势正不断加剧。欧盟当局此前警告，俄罗斯可能正在欧洲加大“混合威胁”力度。不过，安全专家也不排除有人模仿作案，或出于私人恩怨发出威胁。\n\n欧洲航空安全组织周五说，正密切关注事态发展，并与欧洲各地的航空公司、机场、航空服务提供商及其他团体紧密合作，尽量减轻对航空交通的干扰。\n\n尽管目前均属虚惊一场，英国智库皇家联合服务研究所研究主任乔丹认为，航空公司仍须认真对待每一起威胁，因为它们最终要对乘客的生命安全负责。\n\n乔丹告诉英国广播公司，如今针对航班发出威胁的手段比以往更多，加密通信应用也让威胁者更容易隐藏身份。\n\n欧盟交通专员齐齐科斯塔斯在布鲁塞尔与欧洲航空安全组织及欧盟航空安全局会面后表示，安全专家将于下周在布鲁塞尔开会，讨论应对炸弹威胁的措施。\n\n意大利总理梅洛尼周五说，近期的网络攻击和炸弹威胁令人担忧。虽然目前尚无法判断这些事件是否相互关联，但它们传递了同一个信息：欧洲的民用基础设施正遭受攻击。\n\n爱尔兰方面则认为，这很可能是一场有协调的破坏行动。不过，目前尚无证据确定幕后黑手，当局也未将这些威胁归咎于任何组织或国家。\n\n西班牙外长阿尔瓦雷斯指出，欧洲各地接连发生手法完全相同的事件，不可能纯属巧合，可能涉及针对欧洲的“混合攻击”和“心理战”。他警告，欧洲须为更多类似挑战做好准备。", "body": "（布达佩斯/都柏林/布拉格综合电）欧洲多地周五（11月6日）再接获连环炸弹恐吓，爱尔兰、英国和保加利亚的媒体机构也收到威胁电邮，显示恐吓目标可能正从民航领域扩大至其他领域 。\n\n往返里斯本、罗马、布拉格和索菲亚等地的11趟航班日前受到炸弹威胁，部分客机被破改道降落，匈牙利更出动战斗机护航。涉事飞机均已降落，当局至今未发现任何爆炸装置，也无人受伤。\n\n这是欧洲一周内第三波针对民航客机的炸弹恐吓。周二（3日）首波事件涉及七趟航班；周四（5日）再有14趟航班受到虚假警报干扰，部分客机临时降落，甚至须由战斗机护航或拦截。\n\n目前尚不清楚这些威胁由谁发出。欧洲此前已接连发生超市制冷系统遭袭、无人机侵入等干扰事件，新一轮炸弹恐吓进一步引发安全忧虑。\n\n爱尔兰国家广播电视公司、鲍尔媒体集团和维珍媒体集团周五也收到炸弹威胁，随即疏散办公场所人员，部分广播节目一度中断。\n\n这一连串事件发生之际，地缘政治紧张局势正不断加剧。欧盟当局此前警告，俄罗斯可能正在欧洲加大“混合威胁”力度。不过，安全专家也不排除有人模仿作案，或出于私人恩怨发出威胁。\n\n欧洲航空安全组织周五说，正密切关注事态发展，并与欧洲各地的航空公司、机场、航空服务提供商及其他团体紧密合作，尽量减轻对航空交通的干扰。\n\n尽管目前均属虚惊一场，英国智库皇家联合服务研究所研究主任乔丹认为，航空公司仍须认真对待每一起威胁，因为它们最终要对乘客的生命安全负责。\n\n乔丹告诉英国广播公司，如今针对航班发出威胁的手段比以往更多，加密通信应用也让威胁者更容易隐藏身份。\n\n欧盟交通专员齐齐科斯塔斯在布鲁塞尔与欧洲航空安全组织及欧盟航空安全局会面后表示，安全专家将于下周在布鲁塞尔开会，讨论应对炸弹威胁的措施。\n\n意大利总理梅洛尼周五说，近期的网络攻击和炸弹威胁令人担忧。虽然目前尚无法判断这些事件是否相互关联，但它们传递了同一个信息：欧洲的民用基础设施正遭受攻击。\n\n爱尔兰方面则认为，这很可能是一场有协调的破坏行动。不过，目前尚无证据确定幕后黑手，当局也未将这些威胁归咎于任何组织或国家。\n\n西班牙外长阿尔瓦雷斯指出，欧洲各地接连发生手法完全相同的事件，不可能纯属巧合，可能涉及针对欧洲的“混合攻击”和“心理战”。他警告，欧洲须为更多类似挑战做好准备。", "link": "https://www.zaobao.com.sg/news/world/story20261108-9964943", "time": "", "badge": "确认免费全文", "badge_cls": "ok", "note": "", "translated": false}, {"title_orig": "卷入银行倒闭丑闻 巴拉圭被弹劾前总统接受检方问话", "title_zh": "卷入银行倒闭丑闻 巴拉圭被弹劾前总统接受检方问话", "summary_orig": "", "summary_zh": "目前正因涉嫌背信、权钱交易和挪用公款而接受调查的培尼亚（Santiago Pena），在当地时间星期六上午11时（新加坡时间晚上10时）许，从侧门进入位于首都亚松森的总检察长办公室。\n\n负责这项调查的检察官贝尼特斯（Christian Benitez）说，检方最快可能在星期六下午正式对培尼亚提出指控。\n\n巴拉圭最大贷款机构之一的乌埃诺银行（Ueno Bank", "body_orig": "", "body_zh": "目前正因涉嫌背信、权钱交易和挪用公款而接受调查的培尼亚（Santiago Pena），在当地时间星期六上午11时（新加坡时间晚上10时）许，从侧门进入位于 I）技术快速发展，网络攻击的性质也在迅速变化，必须据此加强防范，保护金融机构等关键基础设施，避免社会和经济活动陷入瘫痪。\n\n日本首相高市早苗星期五（11月6日）召开网络安全阁僚会议，指示负责网络安全保障事务的数码部长古川俊治修订《网络应对能力强化法》，加强各项网安措施。\n\n她在会上强调，要汇集政府与民间力量，提升日本整体应对网络威胁的能力。她说：“就在此刻，未经授权的访问和数据泄露事件正在发生，对民众的日常生活和企业活动造成重大影响。让我们调动政府的一切资源，提升全日本的应对能力。”\n\n会议决定，经济产业部本月内召集顶尖网络安全人才，成立官方网络安全团队。与会者以好莱坞电影《捍卫战士》（Top Gun）作比喻，将这支团队定位为守护日本网络安全的精锐部队。\n\n团队将利用AI对抗黑客，并检测网络系统的薄弱环节。他们也将与科技公司以及友好国家的先进AI开发商合作，确保日本的安全专业知识始终处于最新水平。\n\n会议提出的其他措施包括：利用AI建立各项基础对策、加强情报收集与调查体制、有策略地应对攻击，以及加强对受害者的支持，防止损害扩大。\n\n日本多家知名企业10月接连遭黑客入侵。停车场运营商Times集团外泄约660万条个人信息，汉堡王有约1118万条信息泄露。日本互联网集团GMO（GMO Internet Group）10月24日证实，公司遭黑客勒索100万美元（约128万新元），并有客户资料外泄，公司已向日本当局求助。\n\n当局分析这些企业遭攻击的情况后认为，它们委托的网安公司在防护措施上存在漏洞。当局也根据近期一系列攻击手法发布最新安全警示，呼吁处理个人信息的企业采取必要防护措施。\n\n同时，政府希望尽快实施“主动网络防御”相关法律，允许警方和自卫队协助打击黑客，加强网络安全保障。\n\n《朝日新闻》引述日本高官的话报道，全球广泛使用的编程语言PHP于10月21日被发现存在重大漏洞，高市政府由此认定，网络安全已面临重大危机。两天后，自民党提交建议书，将此事形容为“网络危机前夕”。\n\n日本政界也将接连发生的网安事件视为重大国家安全问题。国民民主党党魁玉木雄一郎认为，不能仅将这些事件看作AI技术进步带来的安全漏洞，而应从国家安全角度应对，进入准战争状态。他指出，俄罗斯入侵乌克兰前，也曾发生针对民间机构的网络攻击。", "body": "日本政府决定投入100亿日元（约8100万新元），组建中央抗黑客团队，全面应对日益猖獗的网络攻击。\n\n日本政府认为，随着人工智能（AI）技术快速发展，网络攻击的性质也在迅速变化，必须据此加强防范，保护金融机构等关键基础设施，避免社会和经济活动陷入瘫痪。\n\n日本首相高市早苗星期五（11月6日）召开网络安全阁僚会议，指示负责网络安全保障事务的数码部长古川俊治修订《网络应对能力强化法》，加强各项网安措施。\n\n她在会上强调，要汇集政府与民间力量，提升日本整体应对网络威胁的能力。她说：“就在此刻，未经授权的访问和数据泄露事件正在发生，对民众的日常生活和企业活动造成重大影响。让我们调动政府的一切资源，提升全日本的应对能力。”\n\n会议决定，经济产业部本月内召集顶尖网络安全人才，成立官方网络安全团队。与会者以好莱坞电影《捍卫战士》（Top Gun）作比喻，将这支团队定位为守护日本网络安全的精锐部队。\n\n团队将利用AI对抗黑客，并检测网络系统的薄弱环节。他们也将与科技公司以及友好国家的先进AI开发商合作，确保日本的安全专业知识始终处于最新水平。\n\n会议提出的其他措施包括：利用AI建立各项基础对策、加强情报收集与调查体制、有策略地应对攻击，以及加强对受害者的支持，防止损害扩大。\n\n日本多家知名企业10月接连遭黑客入侵。停车场运营商Times集团外泄约660万条个人信息，汉堡王有约1118万条信息泄露。日本互联网集团GMO（GMO Internet Group）10月24日证实，公司遭黑客勒索100万美元（约128万新元），并有客户资料外泄，公司已向日本当局求助。\n\n当局分析这些企业遭攻击的情况后认为，它们委托的网安公司在防护措施上存在漏洞。当局也根据近期一系列攻击手法发布最新安全警示，呼吁处理个人信息的企业采取必要防护措施。\n\n同时，政府希望尽快实施“主动网络防御”相关法律，允许警方和自卫队协助打击黑客，加强网络安全保障。\n\n《朝日新闻》引述日本高官的话报道，全球广泛使用的编程语言PHP于10月21日被发现存在重大漏洞，高市政府由此认定，网络安全已面临重大危机。两天后，自民党提交建议书，将此事形容为“网络危机前夕”。\n\n日本政界也将接连发生的网安事件视为重大国家安全问题。国民民主党党魁玉木雄一郎认为，不能仅将这些事件看作AI技术进步带来的安全漏洞， 主党在选举中获胜并不表示选民否定特朗普的供给侧政策，这些措施让12万美国民众投入到新厂房的建设。\n\n哈塞特说，特朗", "body_orig": "", "body_zh": "（亚特兰大/华盛顿综合电）美国总统特朗普的首席经济顾问哈塞特表明，虽然共和党在中期选举中失利，但白宫不会因此重新调整经济政策。\n\n白宫国家经济委员会主任哈塞特星期五（11月6日）接受彭博电视访问时说，特朗普政府的经济政策奏效，无须改变。他认为，民主党在选举中获胜并不表示选民否定特朗普的供给侧政策，这些措施让12万美国民众投入到新厂房的建设。\n\n哈塞特说，特朗普确实担心“他凝聚的正面动力如今可能被取得更大权力的民主党翻转”。但他相信，民主党人“要推翻创造出强劲就业市场的各个伟大政策将困难重重，因为总统将行使否决权”。\n\n他指出，美国通货膨胀居高不下是因为美伊战争对油价造成冲击，而特朗普政府的经济政策实际上对通胀有压抑作用。相比之下，前任拜登政府基本上是“在冠病疫情后用直升机向民众撒钱”，才造成通胀。\n\n预计明年1月将重任众议院筹款委员会主席的民主党议员尼尔表明，他将全力推翻特朗普“毫无道理”的关税和贸易领域的“幕后交易”。\n\n尼尔星期五在华盛顿出席一场贸易论坛时说，特朗普“刻意搅乱且毫无道理的贸易政策”导致美国人的生活费上涨，并加剧工人和最富群体之间的不平等。他将致力于逆转特朗普的关税政策，推进基于良好治理和透明度的贸易政策。\n\n在共和党明年1月3日把国会两院的立法权交给民主党之前，美国将进入将近两个月的“跛脚鸭国会”过渡期。\n\n据彭博社分析，特朗普和共和党人可能利用这个最后窗口推动他们的议案，或推进司法和行政职位的任命。\n\n其中，预计共和党会优先争取国会通过国会开支授权法案，以及对美伊战争提供更多资金。共和党预计也会专注推动政府拨款法案获得通过，无论是全年或是临时拨款案，以避免在年底佳节期间出现政府停摆。当前的短期拨款措施将在12月11日结束。\n\n在美国，政府任期到了两年中点时，一些内阁部长或其他官员选择离任并非不寻常。据彭博社报道，国务卿鲁比奥正在考虑离职，战争部长赫格塞斯的去留也引发揣测。因此，特朗普或许会趁国会仍由共和党主掌的时候，加速完成这些要职继任者的任命。\n\n在这同时，特朗普也可能加速推进他提名的法官人选获得国会通过。路透社报道，截至本月初，特朗普的九个司法任命还有待参议院司法委员会批准，另13名已获委员会通过的人选则在等待参议院全体表决确定。", "body": "（亚特兰大/华盛顿综合电）美国总统特朗普的首席经济顾问哈塞特表明，虽然共和党在中期选举中失利，但白宫不会因此重新调整经济政策。\n\n白宫国家经济委员会主任哈塞特星期五（11月6日）接受彭博电视访问时说，特朗普政府的经济政策奏效，无须改变。他认为，民主党在选举中获胜并不表示选民否定特朗普的供给侧政策，这些措施让12万美国民众投入到新厂房的建设。\n\n哈塞特说，特朗普确实担心“他凝聚的正面动力如今可能被取得更大权力的民主党翻转”。但他相信，民主党人“要推翻创造出强劲就业市场的各个伟大政策将困难重重，因为总统将行使否决权”。\n\n他指出，美国通货膨胀居高不下是因为美伊战争对油价造成冲击，而特朗普政府的经济政策实际上对通胀有压抑作用。相比之下，前任拜登政府基本上是“在冠病疫情后用直升机向民众撒钱”，才造成通胀。\n\n预计明年1月将重任众议院筹款委员会主席的民主党议员尼尔表明，他将全力推翻特朗普“毫无道理”的关税和贸易领域的“幕后交易”。\n\n尼尔星期五在华盛顿出席一场贸易论坛时说，特朗普“刻意搅乱且毫无道理的贸易政策”导致美国人的生活费上涨，并加剧工人和最富群体之间的不平等。他将致力于逆转特朗普的关税政策，推进基于良好治理和透明度的贸易政策。\n\n在共和党明年1月3日把国会两院的立法权交给民主党之前，美国将进入将近两个月的“跛脚鸭国会”过渡期。\n\n据彭博社分析，特朗普和共和党人可能利用这个最后窗口推动他们的议案，或推进司法和行政职位的任命。\n\n其中，预计共和党会优先争取国会通过国会开支授权法案，以及对美伊战争提供更多资金。共和党预计也会专注推动政府拨款法案获得通过，无论是全年或是临时拨款案，以避免在年底佳节期间出现政府停摆。当前的短期拨款措施将在12月11日结束。\n\n在美国，政府任期到了两年中点时，一些内阁部长或其他官员选择离任并非不寻常。据彭博社报道，国务卿鲁比奥正在考虑离职，战争部长赫格塞斯的去留也引发揣测。因此，特朗普或许会趁国会仍由共和党主掌的时候，加速完成这些要职继任者的任命。\n\n在这同时，特朗普也可能加速推进他提名的法官人选获得国会通过。路透社报道，截至本月初，特朗普的九个司法任命还有待参议院司法委员会 ）参与北京的情报行动，目的是进一步了解美国的人工智能（AI）晶片，并试图影响英伟达，推动它向中国提供最先进的晶片。\n\n《金融时报》同日引述消息人士报道，美国情报官员相信两人曾是情侣，并在特朗普今年5月访问北京前，向少数政府高级官员传递了这份备忘录。\n\n超速国际（Megaspeed）在新加坡注册运营，是英伟达云计算合作伙伴。据报道，超速国际购买英伟达AI处理器等设备，在东南亚设立数据中心，再将算力出租给阿里巴巴，相当于为中国AI开发商使用英伟达高端晶片提供后门。\n\n英伟达发表声明说，云计算合作伙伴“并未要求我们寻求修订美国法律，或倡议对华销售”，并强调公司不向客户分享机密信息，任何人试图通过合作伙伴获取机密信息，都会一无所获。\n\n针对《金融时报》的报道，英伟达则引用黄仁勋早前的说法，称他和黄乐之间纯属一般商业关系。\n\n中国驻美国大使馆发言人刘畅说，《纽约时报》的报道“毫无根据”，“纯粹是对中国的抹黑”。\n\n《纽约时报》10月29日首次报道，黄乐向北京传递信息，美国情报机构对她进行至少一年的电子监视，发现她与黄仁勋交往甚密。当局去年已向特朗普汇报，但特朗普选择不动声色。\n\n黄仁勋当时回应，英伟达与超速国际的商业交易“一般且无不寻常”，公司也已调查，确保超速国际未非法将英伟达AI处理器运往中国。\n\n民主党本周在中期选举中夺得国会参众两院控制权后，事件再受关注，共和党人也开始检视两人关系。\n\n众议院外交事务委员会、中国问题特别委员会和情报委员会于星期四（5日）联合致函黄仁勋，指报道引发重大国家安全关切，要求他11月18日出席闭门简报会，向国会说明。\n\n《纽约时报》最新报道首次指称黄乐受雇于中国国家安全部，并指这个成立于1983年的机构此前并未获得北京领导层重视，直到习近平2012年出任中国最高领导人后，北京才开始投入资源。\n\n如今，其规模已是美国中央情报局的数倍，既收集人力情报、拦截电子通信，也开展反间谍行动。\n\n中情局前反间谍分析师马蒂斯（Peter Mattis）指出，中国情报机构已将科技列为重点，视之为“争夺经济主导权的关键战役”。\n\n他说：“黄仁勋会是你想要施加影响的对象，因为他掌握巨大权力，又处于重塑世界的科技核心。”", "body": "（纽约综合电）美国情报机构评估，英伟达客户超速国际的前高管黄乐受雇于中国国家安全部，负责收集有关英伟达首席执行官黄仁勋的情报。美国情报官员也相信，两人曾有恋爱关系。\n\n《纽约时报》星期五（11月6日）引述消息人士报道，美国情报官员今年春天向特朗普政府高层决策者提呈一份备忘录，指称黄乐（Alice Huang）参与北京的情报行动，目的是进一步了解美国的人工智能（AI）晶片，并试图影响英伟达，推动它向中国提供最先进的晶片。\n\n《金融时报》同日引述消息人士报道，美国情报官员相信两人曾是情侣，并在特朗普今年5月访问北京前，向少数政府高级官员传递了这份备忘录。\n\n超速国际（Megaspeed）在新加坡注册运营，是英伟达云计算合作伙伴。据报道，超速国际购买英伟达AI处理器等设备，在东南亚设立数据中心，再将算力出租给阿里巴巴，相当于为中国AI开发商使用英伟达高端晶片提供后门。\n\n英伟达发表声明说，云计算合作伙伴“并未要求我们寻求修订美国法律，或倡议对华销售”，并强调公司不向客户分享机密信息，任何人试图通过合作伙伴获取机密信息，都会一无所获。\n\n针对《金融时报》的报道，英伟达则引用黄仁勋早前的说法，称他和黄乐之间纯属一般商业关系。\n\n中国驻美国大使馆发言人刘畅说，《纽约时报》的报道“毫无根据”，“纯粹是对中国的抹黑”。\n\n《纽约时报》10月29日首次报道，黄乐向北京传递信息，美国情报机构对她进行至少一年的电子监视，发现她与黄仁勋交往甚密。当局去年已向特朗普汇报，但特朗普选择不动声色。\n\n黄仁勋当时回应，英伟达与超速国际的商业交易“一般且无不寻常”，公司也已调查，确保超速国际未非法将英伟达AI处理器运往中国。\n\n民主党本周在中期选举中夺得国会参众两院控制权后，事件再受关注，共和党人也开始检视两人关系。\n\n众议院外交事务委员会、中国问题特别委员会和情报委员会于星期四（5日）联合致函黄仁勋，指报道引发重大国家安全关切，要求他11月18日出席闭门简报会，向国会说明。\n\n《纽约时报》最新报道首次指称黄乐受雇于中国国家安全部，并指这个成立于1983年的机构此前并未获得北京领导层重视，直到习近平2012年出任中国最高领导人后，北京才开始投入资源。\n\n如今，其规模已是美国中央情报局的数倍，既收集人力情报、拦截电子通信，也开展反间谍行动。\n\n中情局前反间谍分析师马蒂斯（Peter Mattis）指出，中国情报机构已将科 const tabs = document.getElementById('tabs');
const list = document.getElementById('list');
const meta = document.getElementById('meta');
let cur = 0;
let mode = 'zh';

function esc(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function shortTime(s){
  const m = String(s||'').match(/(\d{1,2})[月日:].*?(\d{1,2}):(\d{2})/);
  if(m) return m[2]+':'+m[3];
  const m2 = String(s||'').match(/(\d{1,2}):(\d{2})/);
  return m2 ? m2[1]+':'+m2[2] : (s||'—').slice(-5);
}
function fillCounts(){
  const nP = (DATA.papers||[]).length;
  const nI = (DATA.papers||[]).reduce((a,p)=>a+((p.items||[]).length),0);
  document.getElementById('cPapers').textContent = nP;
  document.getElementById('cItems').textContent = nI;
  document.getElementById('cTime').textContent = shortTime(DATA.updated);
}
function renderTabs(){
  tabs.innerHTML = DATA.papers.map((p,i)=>{
    const n = (p.items||[]).length;
    return `<button type="button" class="${i===cur?'on':''}" data-i="${i}">${esc(p.name)}（${n}）</button>`;
  }).join('');
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i; render();});
}
function blockFor(it){
  const tZh = it.title_zh || it.title_orig || '';
  const tOrig = it.title_orig || '';
  const sZh = it.summary_zh || '';
  const sOrig = it.summary_orig || '';
  const bZh = it.body_zh || it.body || '';
  const bOrig = it.body_orig || '';
  const showZh = mode==='zh' || mode==='bi';
  const showOrig = mode==='orig' || mode==='bi';
  const needOrigTitle = tOrig && tOrig !== tZh;
  let html = '<div class="badges">';
  html += `<span class="badge ${esc(it.badge_cls||'warn')}">${esc(it.badge||'未验证')}</span>`;
  if(it.note) html += `<span class="badge">${esc(it.note)}</span>`;
  html += '</div>';
  if(showZh) html += `<h2 class="zh">${esc(tZh)}</h2>`;
  if(showOrig && needOrigTitle) html += `<h2 class="orig">${esc(tOrig)}</h2>`;
  if(showOrig && !needOrigTitle && mode==='orig') html += `<h2 class="orig">${esc(tOrig||tZh)}</h2>`;
  if(showZh && sZh) html += `<p class="summary zh">${esc(sZh)}</p>`;
  if(showOrig && sOrig && sOrig !== sZh) html += `<p class="summary orig">${esc(sOrig)}</p>`;
  if(mode==='bi' && (bZh || bOrig)) html += `<div class="bi-sep"></div>`;
  if(showZh && bZh){
    html += `<div class="body zh">${esc(bZh)}</div>`;
    if(mode==='zh' && bOrig && bOrig.length > Math.max(500, bZh.length + 200)){
      html += `<p class="summary">（以上为译文节选；以下为原文全文）</p>`;
      html += `<div class="body orig">${esc(bOrig)}</div>`;
    }
  }
  if(showOrig && bOrig) html += `<div class="body orig">${esc(bOrig)}</div>`;
  if(showOrig && !bOrig && mode==='orig' && bZh) html += `<div class="body">${esc(bZh)}</div>`;
  return html;
}
function render(){
  renderTabs();
  document.querySelectorAll('.langbar .pill').forEach(b=>{
    b.classList.toggle('on', b.dataset.mode===mode);
  });
  const p = DATA.papers[cur];
  const n = (p.items||[]).length;
  meta.textContent = `《${p.name}》· ${p.lang} · ${p.tab_note} · 本栏 ${n} 条 · 数据时间 ${DATA.updated}`;
  if(p.error){ list.innerHTML = `<div class="empty">${esc(p.error)}</div>`; return; }
  if(!n){ list.innerHTML = `<div class="empty">暂无条目</div>`; return; }
  list.innerHTML = p.items.map(it=>`<article class="card">${blockFor(it)}
    <div class="row"><span>${esc(it.time||'')}</span><a href="${esc(it.link)}" target="_blank" rel="noopener">打开原文</a></div>
  </article>`).join('');
}
document.querySelectorAll('.langbar .pill').forEach(b=>{
  b.onclick=()=>{ mode=b.dataset.mode; render(); };
});

function immOn(){return document.documentElement.classList.contains('immersive');}
function fsLabel(){const b=$('btnFs');if(!b)return;b.textContent=(realFs()||immOn())?'退出全屏':'全屏';}
function fsTip(t){const el=$('fsTip');if(!el)return;$('fsTipTxt').textContent=t;el.classList.add('show');clearTimeout(fsTip._t);fsTip._t=setTimeout(()=>el.classList.remove('show'),9000);}
function setImm(on){document.documentElement.classList.toggle('immersive',!!on);try{sessionStorage.setItem(FS_IMM_KEY,on?'1':'0');}catch(e){}fsLabel();try{window.scrollTo(0,on?1:0);}catch(e){}}
function toggleFs(){
  const d=document,el=d.documentElement;
  if(realFs()||immOn()){try{if(realFs())(d.exitFullscreen||d.webkitExitFullscreen).call(d);}catch(e){}setImm(false);return;}
  setImm(true);
  const fn=el.requestFullscreen||el.webkitRequestFullscreen;
  const ua=navigator.userAgent||'';
  const ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
  const standalone=window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches);
  if(standalone){return;}
  let ok=false;
  if(fn&&!ios){try{const p=fn.call(el);if(p&&p.then){p.then(()=>{},()=>{fsTip('这个浏览器不让网页进入真全屏，已切到沉浸模式。想去掉地址栏：用浏览器打开后「添加到主屏幕」，再从桌面图标打开。');});}ok=true;}catch(e){}}
  if(!ok){fsTip(ios?'苹果手机的浏览器不允许网页真全屏，已切到沉浸模式。想彻底没有地址栏：点分享 → 添加到主屏幕，以后从桌面图标打开。':'这个浏览器不支持网页真全屏，已切到沉浸模式。想更全屏：用浏览器打开后「添加到主屏幕」。');}
}
$('btnFs').onclick=toggleFs;
$('fsTipOk').onclick=()=>$('fsTip').classList.remove('show');
document.addEventListener('fullscreenchange',()=>{if(!realFs()&&immOn()){setImm(false);}fsLabel();});
document.addEventListener('webkitfullscreenchange',()=>{if(!realFs()&&immOn()){setImm(false);}fsLabel();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&immOn()&&!realFs()){setImm(false);}});
try{if(sessionStorage.getItem(FS_IMM_KEY)==='1')setImm(true);}catch(e){}
fsLabel();

fillCounts();
render();
</script>
</body>
</html>
